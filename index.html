<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "Iran answered, and its second wave is on the record — along with a target class this desk had not registered at all: dead merchant seafarers. GlobalSecurity's Day 188 log states that “Iran's second wave on September 3 produced no reported casualties through the cutoff,” and the IRGC's own announcement via Sepah News says its “regret-inducing response against the aggressors” had begun — an American MQ-9 Reaper drone downed, ballistic missiles and drones fired at Camp Titin in Jordan and Shaikh Isa Air Base in Bahrain, with a claim of “a large number of” US troops killed and “several key facilities and combat helicopters” destroyed. No source reports any American military casualties. Khatam al-Anbiya Central Headquarters promised “crushing and shattering” blows. Both target sets are wider than this desk had published. Iranian strikes are recorded at Prince Hassan airbase and a Marine base in Jordan, Al Dhafra and Al Minhad in the UAE, Sheikh Issa in Bahrain, Ali al-Saleem in Kuwait and bases at Erbil in Iraq — Kuwait and Iraq are new. The American round of September 1–2 is recorded at Asaluyeh, Jiroft, Bandar Abbas, Qeshm Island, Konarak, Chabahar, Jask, Sirik and Lavan Island, adding five locations to the four the desk carried. AND THE NEW CATEGORY: two Filipino crew were killed aboard the Saudi supertanker SIDR on AUGUST 31, which GlobalSecurity calls “the first commercial-shipping deaths since hostilities resumed” — a week old and reaching this desk only now. GCC Secretary-General Jasem Mohamed Albudaiwi called it “a dangerous escalation, a grave violation of the principles.” A separate vessel, the Liberia-flagged Senegal Prosperity, was struck by three projectiles seventeen nautical miles east of Khasab, Oman on September 1, losing communications, with no casualties; UKMTO's own wording is that “a tanker has reported being struck by 3 unknown projectiles whilst completing an outbound transit of the Strait of Hormuz.” Meanwhile the Kuhestak wedding has       { t: "The Hormuz numbers moved in three directions at once, the rial has a new detail and a conflicting inflation figure, and one thing this desk has been asserting for nine days turns out to be unknown rather than zero. On throughput, GlobalSecurity's Day 188 log cites Kpler at SIX commodity-vessel transits on September 2, down from ELEVEN on September 1, against a ten-day average near thirteen — so the corridor is thin and volatile rather than simply closed. Against that, US Energy Secretary Chris Wright says “more than 17 million barrels of oil flowed through the strait on 31 August, ‘the record since before the conflict.'” TankerTrackers puts the 28-day average of crude departures at 7.54m barrels a day — 5.04m through Hormuz, 2.49m from Gulf of Oman terminals — against 17.67m before the war, with war-risk premiums at “7.5 to 10 percent of hull value” and about eighty per cent of traffic running dark. THE CORRECTION THIS DESK OWES ITSELF: it has published “zero transits of the Iran–Oman corridor” for nine consecutive days. Today straits.live no longer breaks the corridor out at all and GlobalSecurity does not carry it, so the honest statement is that the count is UNAVAILABLE, not that it is zero. An absence of a figure is not a figure of zero, and the desk has been treating one as the other. straits.live is also internally inconsistent again — its homepage body reads Day 186 while its own search title reads Day 187, against GlobalSecurity's 188 — and its insurance numbers are unchanged from yesterday, which is itself a reason to doubt they were refreshed. On the currency, IranWire dates the record low to September 2 at about 219,000 tomans to the dollar, with the euro above 250,000 tomans for the first time, the UAE dirham above 59,000, an Emami gold coin near 224 million tomans, and more than ten per cent of devaluation in a fortnight. ⚠️ It also gives INFLATION AT 117 PER CENT, against the roughly ninety per cent this desk has been carrying — flagged, no egion, and TWO POLICE OFFICERS KILLED in Dnipropetrovsk region across Nikopol and Pavlohrad districts. Kyiv's toll ran from six injured at 6:48 p.m. Thursday, with Mayor Vitalii Klitschko saying “four of those injured have been hospitalized,” to fourteen by Friday morning — an escalating toll across separate URLs, which is the ordinary shape of this reporting and not a contradiction.",

      { t: "TWO STANDING CLAIMS OF THIS DESK ARE RETIRED TODAY, BOTH WRONG IN THE SAME DIRECTION — the desk had turned a lag into an absence — and Putin's plenary produced more than the pre-plenary remarks did. FIRST, THE ISW LAG. Yesterday this brief reported that no September 2 assessment existed on either criticalthreats.org or the Kyiv Post repost path. It exists, at both, and so does the September 3 assessment, posted at 8:14 this morning; the band runs 83536, 83619, 83718. What the desk read as an absence was publication lag. SECOND, AND MORE CONSEQUENTIAL: THE CLAIM THAT UKRAINE'S AIR FORCE STOPPED PUBLISHING EXACT BALLISTIC-MISSILE FIGURES IN EARLY AUGUST IS FALSE AND IS RETIRED. The September 1 tally gave an exact figure — five ballistic missiles, with two Banderol, five Kalibr and 187 drones, 199 of 218-plus targets neutralised. The overnight tallies of September 2–3 and 3–4 carry no ballistic figure because NO BALLISTIC MISSILES WERE FIRED: 163 strike drones only in the first, one Kh-31P and 121 drones in the second. ISW independently gives an exact count for September 1–2. What the desk read as a reporting blackout was variation in what Russia actually launched. Two items from the recovered assessments that nobody had: Zelensky DISMISSED the Commander of Ukrainian Ground Forces, Major General Gennady Shapovalov, on September 2, appointing Brigadier General Svyatoslav Zaitsya; and elements of Ukraine's military intelligence directorate and its security service exchanged SMALL-ARMS FIRE IN KYIV CITY the same day, injuring three HUR servicemen — the SBU alleging FSB contacts and assassination planning, Russian Volunteer Corps deputy commander Stepan Kaplunov saying he admitted to it only under coercion (“They were saying that one could disappear forever. There was talk about ‘digging a hole'”). ISW also scored Putin's August claim of fifteen settlements and 270 square kilometres in Donetsk against its own 73.14 seized plus 104.44 infiltrated. AT THE EASTERN ECONOMIC FORUM, Putin gave his most concrete description yet of the channel: “It is difficult for me to say at the moment if these [contacts] can lead to a peace agreement… But these contacts do exist and are continuing in the current format, PRIMARILY THROUGH THE SECURITY SERVICES” — the first official confirmation of the shape of the process the Ratcliffe trip belongs to. On Washington: “We support restoring ties with the United States in full, but this does not depend on us alone.” ⚠️ TASS published two different English renderings of the same remarks under two IDs, and rendered yesterday's line as “Are there prospects? In my view, yes, there are” where the desk published “Is there a chance?” — attribute phrasing to the outlet. POWER OF BAIKAL NOW HAS THE CITABLE SOURCE THE DESK ASKED FOR, and a sharper stage than “final stages”: Energy Minister Sergey Tsivilyov says it is “in the final stages of preparations for the construction phase,” and Deputy Prime Minister Alexander Novak names the mechanism — “it has been deemed feasible to continue work on DRAFTING THE CONTRACT ITSELF so that our companies can reach concrete agreements faster.” A contract being drafted is not a contract; still no terms, no financing, no signing. Putin also conceded a first-half budget deficit of 2.8 per cent of GDP against a 1.6 per cent target, with the key rate at 14 and inflation at 6.3, and shrugged: “Considering that we have one of the lowest levels of national debt in the world, there is nothing critical here.” Bilateral readouts stay empty — a “working breakfast” with Prabowo Subianto and nothing at all for Uchral, Nyo Saw or Ding Xuexiang. Lavrov, same forum: “Agreeing to freeze conflict in Ukraine would mean revival of Nazism,” and “I don't think the North Atlantic Alliance will last much longer.”",

      { t: "The Fed trade flipped, and for the first time in this desk's series a HOLD is the favourite. investing.com's Fed Rate Monitor, stamped September 4 at 2:15 a.m. EDT, reads 51.6 per cent for a hold at 3.50–3.75 against 48.4 per cent for a hike to 3.75–4.00 at the September 16 meeting. The series with its timestamps: 64.4 per cent for a hike on September 1 at 7:25 a.m., 60.4 on September 3 at 4:55 a.m., and 48.4 now — TWELVE POINTS IN ABOUT TWENTY-ONE HOURS, and sixteen since Monday. The cause was Governor Waller, who was the day's market driver. ⚠️ NO VERBATIM WALLER TEXT COULD BE OBTAINED — federalreserve.gov's speech page was not reached — so what follows is three independent outlet PARAPHRASES and the quoted fragments belong to the outlets, not to him: that he “wasn't ready to hike rates yet” and would “need to see CPI data before making a decision”; that recent data “showed signs of disinflation” and that he would favour keeping rates unchanged this month if further reports reinforced that; and that he “downplayed the employment report but said a surprise could influence his view.” The longer curve softened with it: at least one hike by December is now 82.1 per cent against the 89 the desk carried, and two or more by March 2027 is 63.6 per cent against a figure the desk has been carrying as 100 — that one has materially broken down and is flagged rather than smoothed. Equities took it as relief and Thursday was the best session in about a month. Every close checked arithmetically against Wednesday: the S&P 500 at 7,747.59, up 80.99 or 1.06 per cent; the Dow at 53,685.52, up 623.57 or 1.18; the Nasdaq COMPOSITE at 26,612.37, up 394.54 or 1.50; the Russell 2000 at 2,968.27, up 15.10 or 0.51. All four reconcile to the penny. The ten-year closed at 4.772 per cent, down 2.2 basis points — and Wednesday's close is now confirmed to three decimals at 4.794, where the desk had published “approximately 4.79 from a single source.” AND THE LEADERSHIP FLIPPED AGAIN, a fourth consecutive session in which the composition is the story: Wednesday the small caps led a rebound at 1.13 per cent against the Composite's 0.45; Thursday inverts it exactly, the Composite nearly tripling its Wednesday gain while the Russell captured barely a third of the Composite's move. That is a duration trade — rate relief paying large-cap growth and not paying small-cap risk. The shape was a clean trend day, not a round trip: the S&P opened exactly at its low. The VIX closed at 14.32, the lowest in the desk's running series. ⚠️ Its own Wednesday base is disputed — investing.com's table gives 15.20 where this desk published 15.23, and the printed change of −0.88 is consistent only with 15.20. The level is agreed by two sources; the base is not.",

      { t: "Thursday's data was a soft-labour, hot-services split — and today brings the number that settles it. Initial jobless claims came in at 206,000 against 205,000 expected, with the prior revised UP a thousand to 204,000, so the desk's carried 203,000 was superseded before it was ever compared against. ISM Non-Manufacturing beat clearly at 55.4 against 54.2 expected and 54.1 prior — but read the internals rather than the headline, because they point opposite ways: business activity 61.7 and new orders 60.9 are strong, EMPLOYMENT AT 47.8 IS STILL IN CONTRACTION, and PRICES PAID AT 72.6 IS HOTTER THAN MANUFACTURING'S 71.1 and rising where manufacturing's was flat. The summary line is that service businesses are seeing stronger demand and higher costs, and that the strength is not translating into staffing. The trade deficit came in materially wider than forecast at $88.6bn against $86.40bn expected, with June revised to $71.2bn; the Bureau's own words are that “the goods and services deficit was $88.6 billion in July, up $17.4 billion from $71.2 billion in June, revised” — a 24.4 per cent monthly jump, exports down 2.1 per cent to $310.7bn and imports up 2.8 to $399.3bn. THE AUGUST EMPLOYMENT REPORT LANDS THIS MORNING, after this brief: consensus is about +56,000 payrolls against JULY'S OUTRIGHT LOSS OF 23,000, unemployment unchanged at 4.1 per cent, and average hourly earnings up 0.3 per cent monthly, taking the annual rate to 3.0. The framing everybody will use is that stronger payrolls, lower unemployment and hotter wages together would put a September hike back on; a second consecutive month of job losses would confirm the hold. AND A SMALL REVERSAL WORTH RECORDING: the ruble's three-session slide ended. The Bank of Russia's fixing effective September 4 is ₽86.8872, STRONGER by 0.1091 or 0.126 per cent against September 3's ₽86.9963, after ₽86.3793 and ₽86.7530 on the first and second — still 1.50 per cent weaker than the ₽85.6007 of August 29–31, but the       { t: "THE H-1B SERIES IS RE-BASED, AND THIS DESK'S OWN EXPLANATION FOR THE BREAK WAS WRONG. Yesterday the brief refused to publish a comment count that had jumped nineteen-fold to 105,740, on the theory that the read had landed on the $103,265-fee rulemaking rather than the docket the desk had been tracking. THE FEE RULEMAKING **IS** THE TRACKED DOCKET. The series the desk has been carrying — 3,957, 4,814, 5,079, 5,432 — belongs to Federal Register document 2026-17324, docket USCIS-2026-0298, RIN 1615-AD20, “Fee for Certain H-1B Petitions,” published August 25 and closing September 24. The close date matches the desk's own note exactly, and today's count of 6,064 continues the series smoothly at about 316 a day against the prior interval's 353. So the flag was right and the diagnosis was wrong: 105,740 was a bad read with no source on the page at all, and the only large number the page carries today is “Page views 27,075 as of 09/04/2026 at 4:15 am EDT,” attached to page views rather than comments. The standing rule held — a nineteen-fold overnight jump is a measurement failure until proven otherwise — and it protected the series. On the vaccine request for information at docket HHS–OS–2026–0332, the count reads 2,316, UNCHANGED from yesterday, which would make Wednesday's spike of 488 a one-off filing push rather than a new run rate. ⚠️ BUT DO NOT PUBLISH “UNCHANGED” WITHOUT THE CAVEAT: that page's only timestamp still reads 09/03 while the H-1B document page, fetched in the same minute, had rolled to 09/04. A stale render cannot be excluded, and a flat count on a page with a lagging stamp is a reading, not a fact. And a third federal page has simply stopped: the CDC's measles count sits at 2,903 as of AUGUST 27 for a FOURTH consecutive direct check — but the page states its own cadence, that its data reflect cases “reported to CDC as of 12:00PM on Thursday,” and August 27 was a Thursday. Yesterday was Thursday September 3 and it passed with no update. The snapshot is eight days old on a page that advertises a weekly refresh. That is a reportable fact about federal data operations, not merely an absence.",
        s: [["Federal Register (the vaccine RFI docket page — the comment count, and the “as of” stamp that attaches to page views)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["STAT (Morning Rounds: the disability-law suit, the overdose decline and the week's federal health items)","https://www.statnews.com/2026/09/03/health-news-hhs-flip-flops-on-disability-lawsuit-community-integration/"]] },
      { t: "The Ebola picture got worse on the numbers and much sharper in the language, and the drug-pricing analysis this desk quoted without a link now has one — and a mechanism. ECDC has moved past the snapshot the desk was carrying: as of September 3 at 15:10, with data to September 1, it gives 6,250 confirmed cases and 3,039 deaths, a case fatality rate of 48.6 per cent, 1,439 recovered and 869 in isolation — up 150 cases and 89 deaths on the desk's last read. ⚠️ The page contradicts itself: it states “New Cases Since Previous Report: 64” and thirty-two new deaths while its own cumulative totals moved by 150 and 89, so the two windows are not the same window and are not reconciled here. The provincial breakdown adds a denominator the desk lacked — “60 of 151 health zones are currently affected across the six provinces,” with Ituri at 5,104 cases and 2,324 deaths — and eighty-nine per cent of identified contacts under follow-up. There is no DON617. But there is something better and never used here: WHO's Director-General held a media briefing on September 2, and Tedros's framing is the sharpest yet — this is “the second-largest on record, and the FASTEST-MOVING that we have ever seen,” a scope claim that sits alongside rather than against DON616's “largest ever recorded in the Democratic Republic of the Congo.” His operational line: “Earning and keeping community trust and community ownership is the single most important element in changing the trajectory of the epidemic.” And the number that makes it an economics story: “The Government-led plan for the next six months comes with an ask of 1.3 BILLION U.S. dollars, covering the work of all partners.” Response scale to date: 330-plus tonnes of supplies, 300-plus experts, a laboratory network expanded from ONE facility to twenty-four, 3,000 tests a day, and 1,300 treatment beds across 49 facilities with expansion planned to 3,000. ⚠️ Tedros puts Ituri at 85 per cent of cases and 88 per cent of deaths where ECDC's own table gives 81.7 and 76.5 — different denominators, unreconciled, both published. Separately, the most-favoured-nation analysis this desk has been quoting from memory now has a citable source, and it REFINES rather than confirms one of the three findings: Gibson Dunn does characterise the pricing basis, as manufacturers extending “Medicaid supplemental rebates that bring state Medicaid net prices down to the SECOND-LOWEST NET PRICE in an eight-country reference basket.” Net-to-net, and a second-order statistic rather than a minimum — materially weaker than the name implies. The opacity findings stand verbatim: the fact sheet “is silent on that point” regarding the Medicare-pilot exemption, and “the operative agreements themselves were not released.” And the enforcement cliff behind the round-two signings is now dated: tariffs of up to 100 per cent took effect July 31 for the initial seventeen large manufacturers, and on SEPTEMBER 29 every other branded manufacturer becomes subject to them.",
        s: [["Gibson Dunn Biotech Briefings (Dan Mulloy: the September 29 tariff deadline, the second-lowest-net-price basis, and the opacity)","https://biotechbriefings.gibsondunn.com/mfn-goes-mid-market-nine-more-drugmakers-sign-medicaid-pricing-deals-as-the-september-29-tariff-deadline-approaches/"],["WHO Disease Outbreak News 616 (still the newest DON: 5,794 cases, 2,786 deaths, 60 health zones, data to August 26)","https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON616"],["KFF Health News (the rural transformation tracker — last updated August 18, and not yet reflecting the August 31 deadline)","https://kffhealthnews.org/rural-health/tracking-state-rural-health-transformation-plans/"]] },
    ]},
    { h: "Campus & culture", items: [
      { t: "The Michigan ballot measure is dead, BOTH courts killed it on the same afternoon, and somebody finally opened the Ypsilanti PDF. Justice Kavanaugh, acting ALONE rather than the full Court, denied the emergency application in 26A275 on Thursday — posted to the docket, per Michigan Advance, “without a filing or opinion.” Hours later the Michigan Supreme Court, whose role in this story the desk flagged yesterday as an entirely unchecked question, ruled too: ALL SEVEN JUSTICES upheld the forty-eight-hour deadline for filing affidavits and refused to force the Board of State Canvassers to reconsider rejected signatures. Justice Elizabeth Welch, writing: “MCL 168.476(1) does not mandate the Board to accept affidavits to rehabilitate rejected signatures, nor does it dictate the process of reviewing affidavits if the Board chooses to do so.” Justice Brian Zahra dissented alone, arguing the board should revisit four timely rejected affidavits. TWO CORRECTIONS THE DESK OWES ON ITS OWN REPORTING: the organisation is AMERICANS for Citizen Voting, not “Alliance,” which is how the Supreme Court's own docket styles it; and the sequence ran the other way from the desk's account — the group went to the Michigan Supreme Court roughly FOUR DAYS BEFORE Washington, not after. Spokesperson Kristin Combs: “We are deeply disappointed by today's decision, particularly for the nearly 710,000 Michigan citizens who put their names on this petition believing they would have an opportunity to vote on it.” The measure had fallen THREE SIGNATURES SHORT in a thousand-signature sample drawn from seven hundred thousand, and the board deadlocked two to two. ⚠️ ONE THING THE DESK CANNOT RESOLVE AND WILL NOT PICK: whether today's ten o'clock canvassers meeting is happening. The Secretary of State posted a notice dated Thursday — “The Board of State Canvassers regularly scheduled meeting on Sept. 4. 2026 is CANCELED,” no reason, no reschedule — while the board's own landing page still lists it with a live agenda link, the agenda PDF exists (Binsfeld Office Building, Lansing; substantive item, the hundred-word ballot summary “in the event it is placed on the ballot”), and Michigan Public, filing at 10:39 p.m. AFTER the cancellation, writes that the board “is meeting at 10 a.m. Friday.” The plausible reading is that the courts mooted the only substantive item; no source says so. AND THE YPSILANTI RESOLUTION IS SETTLED, WITH BOTH OF THIS DESK'S PREVIOUS VERSIONS WRONG. The printed title names TWO institutions and the university comes first: “A RESOLUTION DECLARING STRONG AND UNEQUIVOCAL OPPOSITION TO THE PLANS OF THE UNIVERSITY OF MICHIGAN AND LOS ALAMOS NATIONAL LABORATORY TO SITE A LOS ALAMOS NUCLEAR RESEARCH FACILITY ANYWHERE IN YPSILANTI TOWNSHIP.” So the September 2 reading — that the filename proved the title contained no Los Alamos — was wrong, because a slug is a naming convention and not a title; and the September 3 reading, taken off the township's web page, was a close paraphrase that dropped the university. Resolution 2026-05, adopted MARCH 31; the PDF records no vote count. It calls the facility a “Clear and Present Danger” and rests on plutonium-pit weapons research, the township's lack of federal-grade security infrastructure, depressed property values and environmental justice. Two neighbouring resolutions on the same server — 2026-08, a data-centre YCUA moratorium, and 2025-23 — are almost certainly what the earlier fetches conflated. ELSEWHERE: Cybele Raver's election WAS unanimous, in the University Record's own words, so unanimity is now assertable with attribution though no numerical tally exists and “8–0” is not; regent Denise Ilitch — “She's a collaborator. She finds how to solve problems by collaborating.” No contract terms and no faculty or AAUP reaction appear anywhere. On Ann Arbor public power there is STILL NO APPEAL FILED, nine days after AAREC said it expected to file one — an intent is not a filing, and the desk got that wrong once already. The RenCen advisory-council winners remain unnamed at three separate outlets.",
        s: [["Michigan Public (the amendment loses at both the state and US Supreme Courts, with Welch's opinion and Zahra's dissent)","https://www.michiganpublic.org/politics-government/2026-09-03/michigan-proof-of-citizenship-voting-amendment-loses-at-state-u-s-supreme-court"],["Michigan Advance (Kavanaugh declines the application, posted “without a filing or opinion”)","https://michiganadvance.com/2026/09/03/us-supreme-court-declines-to-hear-application-on-michigan-citizens-only-voting-ballot-measure/"],["Ypsilanti Township (Resolution 2026-05 as adopted — the actual PDF, opened for the first time)","https://files.ypsitownship.org/Documents/Departments/Clerks-Office/Ordinances-Resolutions/2026/2026-Resolutions/Resolution-No.-2026-05-Data-Center-High-Value-Target-Risk.pdf"],["University of Michigan Record (the Regents vote unanimously to appoint C. Cybele Raver)","https://record.umich.edu/articles/u-m-board-of-regents-votes-to-appoint-c-cybele-raver-next-president/"]] },
      { t: "The international-student hearing happened, the judge was blunt, and he did not rule. NAFSA v. DHS went before Judge F. Dennis Saylor IV in Boston on Thursday, and the Globe's headline is that he “blasted” the administration's changes. Two remarks from the bench, and they are worth reading as a signal rather than a holding: “A four year cap does not have anything to do with national security. I am just struggling to see a rational connection,” and that the government appeared to “push this through at high speed rather than taking the comments of the affected communities seriously.” He dismissed the national-security rationale, rejected the government's fraud examples as insufficient, and agreed the change would deter international students and harm the economy — then issued NO immediate decision. The duration-of-status rule takes effect SEPTEMBER 15, eleven days out, which means a ruling could land at any hour. AND THE THREE-DAY OPEN QUESTION IS CLOSED, though not the way the desk framed it: DHS DID file, but not on August 31. The Justice Department asked for a four-day extension, the court granted it to SEPTEMBER 2, and a 57-page response was filed by Assistant Attorney General Brett Shumate arguing the system needed overhaul to “safeguard national security.” The desk's “unconfirmed on a third day” line should be retired: nobody was hiding a filing, a deadline had moved. THE CPT LIST IS NOW WRITTEN DOWN, which the desk has been promising itself for a fortnight, and the count it has been publishing needs correcting in both directions. NINE institutions have an action on record: CU Boulder (Aug 20), UC Berkeley (Aug 26, indefinite), the University of Washington (Aug 26), the University of Rochester (Aug 28), Penn (Aug 29), Northwestern (by Aug 31), UCLA (reported Aug 28 — “UCLA has paused certain Curricular Practical Training authorizations while it reviews recent federal guidance”), UC Davis (reported Aug 25), and PURDUE, whose international-student office notified students on AUGUST 17 — five days after the SEVP broadcast, which pushes the start of the wave earlier than the desk has been saying. Three more are reviewing without pausing: George Washington, which has NOT moved and whose spokesperson still “declined to specify,” plus UC San Diego and Santa Clara. ⚠️ AND THE ACTIONS ARE NOT THE SAME ACTION: Berkeley and UC Davis suspended only COURSE-CREDIT CPT, while Washington, Rochester and Purdue narrowed to DEGREE-REQUIRED CPT. Calling all nine “paused CPT” overstates it, and this desk has been doing that. Purdue's spokesperson Trevor Peters gives the cleanest statement of the narrowed rule: “CPT may only be authorized when experiential learning opportunities, such as internships, are a required component of a student's degree program.” ⭐ THE SHARPEST FACT ON THE BEAT, AND IT IS AN ECONOMICS FACT: the August 12 SEVP broadcast — identified as BCM 2608-01 — concedes in its own text that it “is not itself a rule or a final action by SEVP.” Nine universities have restricted student work authorisation on the strength of a document that disclaims being a rule. That is regulatory chilling effect with no regulation, and it is measurable: international students are six per cent of US enrollment and TWELVE PER CENT OF REVENUE nationally, above thirty per cent at dependent institutions.",
        s: [["The Boston Globe (Saylor: “A four year cap does not have anything to do with national security”)","https://www.bostonglobe.com/2026/09/03/metro/international-visa-trump-policy-ruling/"],["The Daily Californian (UC Berkeley indefinitely suspends course-credit CPT after a second ICE threat)","https://www.dailycal.org/news/campus/after-second-ice-threat-uc-berkeley-indefinitely-suspends-international-student-work-authorizations/article_0e9ae0c0-dd4d-4455-a25b-e8be7b47e350.html"],["The Purdue Exponent (Purdue notified students on August 17 — the earliest dated action in the wave)","https://www.purdueexponent.org/campus/general_news/international-students-face-drastic-internship-restrictions-after-ice-memos/article_98d404d1-66ed-4d66-95b2-cf6e179374d5.html"],["The Hechinger Report (the revenue arithmetic: 6% of enrollment, 12% of revenue, over 30% at dependent institutions)","https://hechingerreport.org/as-international-enrollment-falls-u-s-students-face-program-cuts-and-higher-prices/"]] },
      { t: "Mind and cosmos: two real experiments, nine announcements with no numbers between them, no psychedelics research at all — and a quantum listing that has now fallen below the price it came public at. THE MARKET ITEM IS THE STORY. Pasqal closed Thursday at $9.75, down $2.44 or 20.02 per cent, on volume of 1,668,805 — roughly three times the prior session — with a day range of $9.56 to $12.49. That is a FIFTH consecutive down day, a fall of forty-nine per cent from the $19.11 debut close in four sessions, and the first close BELOW the $9.79 the SPAC came public at. The entire debut pop is gone. No company news exists to explain it; the most recent Pasqal item anywhere is Tuesday's metric-free True Nexus protein-gelation announcement. Two consecutive twenty-per-cent declines on rising volume with no news reads as a flows or lockup event rather than an information event. ⚠️ AND A NUMBER THE DESK WILL NOT PUBLISH: stockanalysis.com now shows a market capitalisation of $2.07bn at $9.75 where yesterday it showed about $350m at $12.19 — implying 212 million shares against 28.75 million. One share count is wrong and the desk is not guessing which. On the science, an EXPERIMENT from Sussex: Ian Ford, Adrien Amour and Matthias Keller, in Physical Review Letters, generate fully phase-controlled two-photon entangled states from a SINGLE trapped calcium-40 ion in an optical cavity, with fidelity 0.82 ± 0.03 for one Bell state and 0.70 ± 0.04 for the other. The honest caveats are the authors' own: the theoretical ceiling at these parameters is 95 per cent, limited by differential AC Stark shifts, and reaching above 99 would cost efficiency and photon pulse length. Note also that the statistics are thin — 92 to 94 two-photon events per measurement basis. A second EXPERIMENT, from IBM and Chicago: Chen, Chen, Fischer and colleagues in PRX Quantum show that the unlearnable “gauge” degrees of freedom in Pauli noise do not corrupt predictions if the learnable parameters are characterised self-consistently — on a 21-qubit GHZ state the model bias falls from 35.2 ± 6.5 per cent to −1.2 ± 4.1, and on a 92-qubit ring median mitigation error falls from 4.9 to 3.1. ⚠️ Their fifteen-fold sampling-overhead reduction is EXPLICITLY a prediction rather than a measurement, and they say so; do not report it as measured. Adjacent and genuinely new: a Nature paper reports the first ALL-OPTICAL photonic time crystal, a plasmonic metamaterial modulated on picosecond timescales by terahertz pulses, cutting photon dissipation by about half. Everything else on the quantum shelf this run is an ANNOUNCEMENT with no metrics — nine of them, of which the freshest is a Novo Nordisk Foundation plan for a 5,300-square-metre Quantum Foundry Copenhagen opening in 2027, against DKK 2.9bn committed and a stated goal of “Denmark's first fully functional fault-tolerant quantum computer before 2034.” And in psychedelics, both PsyPost verticals were checked and both stop at September 2: no new research in the window, and Psychedelic Alpha's Field Notes remain stalled at number four since August 21.",
        s: [["arXiv (Ford, Amour and Keller, Sussex: fully phase-controlled two-photon entangled states, PRL 137, 103604)","https://arxiv.org/abs/2601.16875"],["arXiv (Chen, Chen, Fischer et al., IBM and Chicago: disambiguating Pauli noise, PRX Quantum 7, 033045)","https://arxiv.org/abs/2505.22629"],["Physics World (the first all-optical photonic time crystal, from a plasmonic metamaterial)","https://physicsworld.com/a/plasmonic-metamaterial-makes-a-photonic-time-crystal/"],["stockanalysis.com (Pasqal's fifth straight down day: $9.75, −20.02%, below the SPAC price)","https://stockanalysis.com/stocks/psql/"]] },
      { t: "GLORIA STEINEM DIED AT NINETY-TWO, and the standing deaths check caught her — but not where it was looking. Her foundation says she “died peacefully, surrounded by people who loved her at her home in New York City”; cause was not disclosed. ⚠️ A DATE CONFLICT THIS DESK IS NOT ADJUDICATING: CBS and NPR give SEPTEMBER 3, while Axios — in a piece whose own URL is dated September 3 — says she “died Wednesday,” which is September 2. She founded Ms. with its first full issue on July 1, 1972, went undercover as a Playboy Bunny in 1963, co-founded the Ms. Foundation for Women in 1973, and took the Presidential Medal of Freedom in 2013. ⭐ AND THE 1963 EXPOSÉ IS, LITERALLY, LABOUR ECONOMICS DONE AS PARTICIPANT OBSERVATION — worth a minute in any class this week. Her own summary of what she found: “In the sense that we're all identified too much by our outsides instead of our insides and are mostly in underpaid service jobs, I realized we're all Bunnies.” That is compensating differentials and occupational segregation in one sentence, written by a reporter who took the job to get the data. THREE MORE DEATHS, ALL TWO-OUTLET CONFIRMED. CASSANDRA WILSON, the jazz vocalist, died September 2 at seventy in Jackson, Mississippi, her hometown — two Grammys for Best Jazz Vocal Album (New Moon Daughter, 1996; Loverly, 2008), a 2022 NEA Jazz Master, the featured voice on Wynton Marsalis's Pulitzer-winning Blood on the Fields, announced by her longtime manager Robert Torry. VICTOR MILLER, who wrote the original Friday the 13th and created Jason Voorhees, died at eighty-six; ⚠️ the outlets give September 2 and Legacy.com gives August 31 — flagged, not picked. And LAU SIU-MING, the Hong Kong dance pioneer and screen actor known as Ming Sir, died Wednesday at ninety-four, one of the first Hong Kong dancers to train formally in Europe; Culture Secretary Rosanna Law Shuk-pui: “Ming Sir devoted his life to dance and the performing arts.” ⚠️⚠️ A PROCESS FINDING WORTH MORE THAN ANY OF THEM: BOTH DEATH AGGREGATORS MISSED STEINEM ENTIRELY. dead-people.com's September 3 list carried three non-arts names; NPR's obituaries section had her. The aggregator-first routine would have missed the biggest death of the run. AT VENICE, the desk's own lineup was incomplete and two carried facts are wrong: the competition is TWENTY-ONE films, not twenty — Khrzhanovsky's DAU, Moretti's It Will Happen Tonight and Tsukamoto's Mr. Nelson, Did You Kill People? were all missing from it — Primetime is directed by LANCE OPPENHEIM with Pattinson starring, and Nicolas Pariser's competition title is A Bit Before Midnight. On the count of women directors, twenty-one films yields TWO, not one: May el-Toukhy and Rachel Szor, co-director of Naza. Cineuropa's Thursday review of McDonagh's Wild Horse Nine adds STEVE BUSCEMI to the cast and reassigns the leads — Malkovich as Chris Carlisle, a CIA hitman with a terminal diagnosis whose memoir dictations make him a target, Rockwell as Lee — and calls it “a personal tragedy of mortality, carefully disguised as a cynical political thriller.” ON THE FOUR AUTEURS: no Refn cast, on a targeted search returning nothing after May; von Trier and Noé both unchecked this run and stated as unchecked rather than logged as negatives; and 🔴 THE LYNCH WEEKENDER'S TICKETTAILOR PAGE IS NOW CONFIRMED 404 after two runs carrying it unverified — the official ticketing route for A Gathering of the Angels is dead, welcometotwinpeaks.com still reads “This event has been postponed,” and on DAY FOURTEEN not one outlet has reported it while six still list it as live, three weeks from its Genesis Cinema dates. IN THE ART WORLD, Artnet's Katya Kazakina publishes the hardest Kusama piece anybody has run: her FUNERAL WAS HELD IN SECRECY UNDER ANOTHER PERSON'S NAME, she was mostly bedridden for her final decade, she moved out of her long-time psychiatric hospital in 2023 after which her whereabouts grew opaque, and her foundation says she painted until July 2026 — one month before her death — while works sold for up to $10.5m during her seclusion. An unnamed market insider: “In the past 15 years or so, someone has been in charge of all the decisions—and it wasn't her.” No memorial date. And China has formally withdrawn from the GWANGJU BIENNALE over Taiwan's pavilion name, curator Ruan Yuelai announcing “the China Pavilion's unanimous withdrawal”; Seoul's foreign ministry replies that “the government's basic position regarding Taiwan remains unchanged.”",
        s: [["CBS News (Gloria Steinem dies at 92)","https://www.cbsnews.com/news/gloria-steinem-dies-age-92-feminist-ms-magazine/"],["NPR (Cassandra Wilson, Grammy-winning jazz vocalist, dies at 70)","https://www.npr.org/2026/09/02/nx-s1-5954558/cassandra-wilson-grammy-winning-jazz-vocalist-dies-at-70"],["Artnet (Katya Kazakina: the paradox of Yayoi Kusama's final years, and a funeral held under another name)","https://news.artnet.com/artnet-bulletin/kusama-final-decade-sep-4-2804402"],["Cineuropa (the Venice review of Martin McDonagh's Wild Horse Nine)","https://cineuropa.org/en/newsdetail/494789"]] }

  hooks: [
    { story: "A company that makes its living filing arbitration claims announced this week that the No Surprises Act has cut out-of-network emergency spending by between one and four billion dollars a year — a 13 to 52 per cent reduction across roughly twelve million out-of-network emergency claims since the law took effect on January 1, 2022. Two health economists were asked about it and did not soften their answer. Loren Adler of the USC-Brookings Schaeffer Initiative: “It doesn't look like there's actual data at play here,” and “All they're doing is a broad arithmetic exercise based on ‘ifs.'” The objection is precise, and it is worth reconstructing before you take a side. HaloMD did not observe what non-arbitrated claims were paid. It ASSUMED they were paid at the Qualifying Payment Amount or some multiple of it, and then multiplied. And here is the number that makes the assumption load-bearing rather than technical: roughly NINETY PER CENT of out-of-network claims under the Act never enter arbitration at all. So the estimate rests entirely on a guess about the ninety per cent nobody sees, produced by a firm whose entire business is the other ten. What IS observed is the arbitration data, and it runs the other way. Median awards, as a multiple of the Qualifying Payment Amount: emergency services 315 per cent, surgery 1,355 per cent, plastic surgery 3,239 per cent. HaloMD's own provider win rate is above ninety per cent. Adler and Matthew Fiedler concluded from earlier rounds of the same data that they saw “little chance that the law will meaningfully reduce prices and premiums… and a realistic possibility that the law will actually raise prices and premiums.” Georgetown's Jack Hoadley adds the one point that partly rescues the claim: “Emergency medicine is actually lower… compared to some of the other specialties out there.”",
      src: ["Healthcare Dive","https://www.healthcaredive.com/news/halomd-no-surprises-cut-oon-emergency-medical-spending-research/829466/"],
      concept: "Identification and the unobserved counterfactual — and why who produced an estimate is part of the estimate",
      q: "Do not lead with the dispute. Lead with the design problem, and make them build the study before they judge it. Tell the room only this: a law changed how out-of-network emergency bills get settled, and you want to know whether it lowered spending. Ask what they would need to observe. They will say prices before and after. Now impose the actual constraint: you can observe the arbitrated claims, which are about ten per cent of the total, and you cannot observe what was paid on the other ninety. Ask them what they would do. Somebody will propose exactly what HaloMD did — assume the unobserved claims settle at the benchmark — and that is the moment to stop and name it, because it is not a stupid idea, it is the only idea available, and it is still an assumption doing all the work. Then hand them the arbitration numbers: 315 per cent of the benchmark in emergency medicine, 1,355 in surgery, 3,239 in plastic surgery. Ask whether those make the assumption look better or worse. If the observed ten per cent settle at three to thirty times the benchmark, what is the case for assuming the unobserved ninety settle AT the benchmark? Now the second question, and it is the more useful one for their working lives: does it matter who ran the study? Push back on the easy cynicism — a firm with a stake is not automatically wrong, and dismissing evidence by its author is its own error. Get them to say what the interest actually predicts here. HaloMD wins over ninety per cent of the arbitrations it files; a finding that the Act saves money is a finding that the arbitration system it profits from is working. So the interest predicts the sign of the error, which is precisely the condition under which provenance is legitimate evidence. Close by asking what study WOULD settle it, and let them discover that the answer requires claims data nobody outside the insurers has — which is why an unfalsifiable estimate got a press release and the two economists got a paragraph." },
    { story: "Epic Research looked at more than 550 million American healthcare encounters between early 2022 and the second quarter of 2026 — the window in which more than twenty-five million people lost Medicaid coverage through redetermination — and asked a simple question: where did they go? The answer is different in different rooms of the same hospital, and the difference is the whole lesson. In the EMERGENCY DEPARTMENT, Medicaid's share of encounters fell from 18.2 per cent to 16.1, down 2.1 points, and the self-pay share rose from 5.5 per cent to 7.6 — UP 2.1 POINTS. A one-for-one substitution, to the decimal. Nobody stopped coming to the emergency department; they came without a payer. In PRIMARY CARE over the same period, Medicaid's share fell 1.1 points, from 11.4 to 10.3 — and self-pay rose only 0.1, from 1.8 to 1.9. That gap of a full percentage point is not a payer shift. It is care that did not happen. The other two lines sit between them and in the expected order: inpatient admissions, Medicaid down 1.5 and self-pay up 0.7; births, Medicaid down 1.6 and self-pay up 0.5. One coverage shock, four margins, and the response runs monotonically with how postponable the visit is.",
      src: ["Healthcare Dive","https://www.healthcaredive.com/news/medicaid-losses-leave-patients-paying-cash-epic-research-redeterminations/829258/"],
      concept: "Price elasticity of demand, and how the same shock shows up as a change in price paid or a change in quantity depending on where the demand curve is steep",
      q: "Put only the emergency-department pair on the board first: Medicaid down 2.1 points, self-pay up 2.1. Ask what happened. Somebody will say people lost insurance and went anyway. Right — now make them say what that implies about the demand curve, and hold out until somebody says the word inelastic rather than you saying it. Then add the primary-care pair: Medicaid down 1.1, self-pay up 0.1. Ask the same question and watch the room notice that the arithmetic no longer closes. Where did the missing one per cent go? It did not become self-pay and it did not stay Medicaid. It stopped being a visit. That is the cleanest natural demonstration of elasticity most of them will ever see, because it holds the shock fixed and varies only the good. Now push on what makes the goods different, and do not accept ‘emergencies are more important.' Importance is not elasticity. What matters is that an emergency-department visit cannot be deferred, cannot be substituted, and is legally required to be provided under EMTALA whether or not anyone pays — so the quantity is close to fixed and the entire adjustment has to land on who bears the cost. A primary-care visit can be put off until next month, or next year, or until it becomes an emergency-department visit. Ask them what happens to the ED column eighteen months from now if the primary-care column keeps losing visits, and let them derive the cost-shifting result themselves rather than being handed it. Finally, the welfare question, which is where health economics stops being price theory: the ED line shows care preserved and financial risk transferred onto the patient; the primary-care line shows financial risk avoided and care forgone. Ask which of those two outcomes is worse, make them commit, and then point out that the accounting treats the first as unpaid bills and the second as savings. That asymmetry is why coverage losses look cheaper on a budget score than they are." },
    { story: "The Dolly Parton demand shock, which this desk has tracked daily since August 25 and pronounced complete two days ago, reversed on September 2 — and the reversal exposes a measurement error the desk itself made in print. First the correction, because it is the reason to trust the rest: on Monday the brief reported that “9 to 5” had fallen OFF the tracked global chart entirely by September 1, six days from near-number-one to gone. It had not gone anywhere. It fell below the observation threshold. kworb tracks a top two hundred, and on September 2 the track re-entered at number 94 on 1,496,874 daily streams — meaning the cutoff it dropped under was well over a million streams a day. “Off the chart” was never a measurement of zero; it was the absence of a measurement, and this desk published one as the other. The American series, which never dropped out, shows what actually happened. Six consecutive daily declines, decelerating — minus 17, 14, 25, 12 and 10 per cent — taking it from 1,149,897 streams on August 27 down to 489,532 on September 1 at number 33. Then on September 2 it rose to 623,620 at number 16: UP 27.4 PER CENT, a seventeen-place gain, and an increase of exactly 134,088 streams, which reconciles to the digit against the delta kworb prints on its own daily page. Six days of decay, then a reversal on the seventh. No source explains it. Note also two rows the desk never had, from the on-ramp rather than the peak: the day she died the track was already at number 3 in the United States on 1,134,063 streams, and it rose 69 per cent the following day to its peak. The shock had a shape before it had a summit.",
      src: ["kworb (the Spotify US daily chart: 9 to 5 back to No. 16 on 623,620, up 134,088)","https://kworb.net/spotify/country/us_daily.html"],
      concept: "Censoring and truncation — why a variable that disappears from a dataset has not necessarily gone to zero, and what a ranked list does to the tails",
      q: "Give the room the global series and nothing else: 3.9 million, 2.5, 2.2, 1.9, 1.4, 1.2, then a blank. Ask them to describe what happened on the blank day. Almost everyone will say demand collapsed, and the word they will reach for is zero. Let it stand for a moment. Then show them the next row — a re-entry at 1.5 million streams — and ask them to reconcile it. There is no reconciliation, because the blank was never a number. It is the chart's two-hundredth position, and everything below it is recorded as nothing at all. Now give it its name and its two names, because students confuse them constantly: this is CENSORING, where you know an observation exists but not its value, as distinct from TRUNCATION, where the observation is dropped from your sample entirely and you cannot even count it. Ask which one a chart is, and make them argue it — the honest answer is that it behaves like truncation from the analyst's chair, because you cannot see the row at all. Then the question that makes it stick: WHICH DIRECTION IS THE BIAS? Have them work out that a threshold at the bottom of a distribution systematically deletes small values, so any average computed from the visible rows is too high, and any inference about how far something fell is too dramatic. Every chart, every bestseller list, every top-ten they have ever cited in an argument does this. Then hand them the harder half. If “off the chart” does not mean zero, what does the American series tell you that the global one cannot? It tells you the shock was culturally concentrated and that in the United States it is finding a floor rather than vanishing — the deceleration from minus 25 to minus 10 per cent was already the shape of a curve flattening, and then it turned. Ask what they would need to distinguish a genuine persistent shift in demand from a one-day artifact, get them to say ‘more days,' and make them notice that “wait two weeks and look again” is the correct answer that no press cycle will ever wait for." },

  pulse: [
    { cat: "Listening", t: "Olivia Rodrigo is occupying two of the top five slots on Spotify's US daily chart twelve weeks after the album came out — and the two songs above her are from 2010 and 2012",
      why: "The Rodrigo half first: “stupid song” at number 4 on 940,434 daily streams and “the cure” at number 5 on 865,858, both from you seem pretty sad for a girl so in love, her third album, released JUNE 12 — so this is not a release-week spike, it is a record still double-occupying the top five three months on. “stupid song” peaked at 3 on the Hot 100 and took number one on the Global 200. ⚠️ One correction worth having before you say anything aloud: the Robert Smith duet on that album is “what's wrong with me,” not “the cure,” and Rodrigo has addressed the confusion directly — “Honestly, this song, The Cure, has nothing to do with the band, The Cure.” The stranger fact is what sits above her on the GLOBAL chart the same day: Katy Perry's “The One That Got Away,” from 2010, at number 4 on 3,224,819 streams, and Justin Bieber's “Beauty And A Beat,” from 2012, at number 5 on 3,193,138. Two early-2010s catalogue tracks inside the worldwide top five, on an ordinary Wednesday, with no film placement or anniversary driving them.",
      rec: "The temptation is to treat the catalogue revival as a joke about nostalgia cycles, and your students will have heard that joke. The better move is to take it seriously as an economics question and ask them why a fifteen-year-old song costs the same to stream as a new one, and what that does to the incentive to make new ones. Streaming abolished the price difference between the back catalogue and the front — a 2010 track and a 2026 track are both one play — and the back catalogue has no marginal production cost left to recover. Ask what a rational label does with that, and somebody will get to catalogue acquisition before you have to mention it. If you want the lighter way in, just ask what year they think “Beauty And A Beat” came out. Most will guess within two years and several will have been three years old.",
      src: ["kworb (Spotify global daily, September 2: Perry at No. 4, Bieber at No. 5)","https://kworb.net/spotify/country/global_daily.html"] },
    { cat: "Watching", t: "The GTA 6 trailer's decline is now visible on the one instrument that is still reporting — and it lost more than half its score in a day",
      why: "FlixPatrol's points-based worldwide film chart had the twenty-six-minute Extended Look third on September 2 with 611 points. On September 3 it is fifth with 267 — a two-place slide and a 56 PER CENT SINGLE-DAY COLLAPSE in the score. That matters partly because of what it settles: this desk has been warning that FlixPatrol's weighted points and Netflix's own average-of-national-ranks are different instruments that can move in opposite directions, and this week they have converged on the same direction, which is worth saying out loud rather than quietly dropping the caveat. ⚠️ But note the reason you only have one instrument today: What's on Netflix has published no daily report for either September 2 or September 3, so Netflix's own rank series is STALE at 4.3 from September 1 and cannot be updated. Do not average a fresh number against a stale one. The cumulative figures are unchanged — 31.1 million views, number one in 87 of 93 countries at peak, and Netflix's own description of the pattern as “front-loaded,” “similar to Netflix's boxing events.”",
      rec: "This is the week to make the point about measurement rather than about the game. Give them the two instruments and ask which one they would put in a headline, then ask what each one would let them conclude about whether Netflix got value for the deal. Neither answers it, which is the useful discovery. If you want a single sentence that will land: a chart that ranks and a chart that scores are answering different questions, and almost nobody who cites one has checked which they are holding. The trap to name explicitly, because it is circulating: the 475-million figure on search results is Trailer 2 from May 2025, not this.",
      src: ["FlixPatrol (the Netflix worldwide top ten: GTA VI down to fifth on 267 points)","https://flixpatrol.com/top10/netflix/"] },
    { cat: "Watching", t: "Spider-Man is now $3.6 million short of $900 million domestic — and the headline saying it has already crossed is still ranking two and a half weeks later",
      why: "Brand New Day stood at $896.4 million domestic through September 1, worldwide $2.34 billion with $1.44 billion of that international. The recent dailies show why the round number keeps not arriving: $6.96m on August 30, $1.92m on the 31st, $2.65m on September 1. It reconciles exactly against the $893.7m this desk published on Monday. Every current headline is still forward-looking — “Poised To Cross,” “About to Make History,” “Eyes $900M Milestone” — and no outlet reports the crossing, which is worth knowing because a koimoi headline reading “$900M Locked” ranks high on the query and is an AUGUST 19 article written when the film was at $794 million. ⚠️ One conflict this desk is carrying rather than resolving: the all-time domestic record it is chasing is given as $936.66m for Star Wars: The Force Awakens in one source and $935.6m in another. Either way the gap is about $40m and roughly two more weeks of this run rate, not days.",
      rec: "Hold this one until the record actually falls, then use the twenty-four hours in which every outlet calls it the biggest film ever in America and essentially none adjusts for ticket prices. Ask what a 2015 dollar and a 2026 dollar have in common, wait for nominal versus real, then ask what the honest comparison would be — admissions, on which Gone with the Wind still leads and will keep leading. The second beat, if you want it, is the more interesting one: ask who benefits from an industry standard that resets its own record every few years, and let them work out that a nominal record is a renewable marketing asset and a real one is not.",
      src: ["Box Office Watch (Brand New Day: $896.4m domestic through September 1)","https://boxofficewatch.com/movies/spider-man-brand-new-day"] },
    { cat: "Reading", t: "The bestseller roundup this desk has been waiting a week for finally posted — and Dungeon Crawler Carl is on all five lists at once",
      why: "Book Riot's “Bestselling Books of the Week, According to All the Lists” published on September 3, closing an open question that had been sitting as “the limit of the check rather than an absence.” Matt Dinniman appears on ALL FIVE aggregated lists, alongside Allen Levi's Theo of Golden, Caro Claire Burke's Yesteryear, Ann Patchett's Whistler and Kathryn Stockett's The Calamity Club. ⚠️ A naming discrepancy the desk is flagging rather than smoothing: Book Riot lists the entry as “Dungeon Crawler Carl” where the New York Times record is for the eighth book, A Parade of Horribles, which took number one on TWO NYT lists simultaneously — Combined Print & E-Book Fiction and Hardcover Fiction. Three titles debuted this week, including Freida McFadden's Brain Damage. Book Riot also notes, in its own voice, that the aggregated lists are “disproportionately by white authors.”",
      rec: "The Dinniman path is the thing worth understanding, not the ranking. The series was serialised free on Royal Road for years, then Kindle, then audio through a small independent studio whose narrator has his own following, and only then a hardcover from a traditional publisher — which means the book arrived at the New York Times list having already proved its audience somewhere the publisher was not looking. Ask a class why an author would give away years of work and then sell it, push past the marketing answer, and get them to the real structure: free serialisation is how an unknown writer BUYS INFORMATION about whether the thing works and how big the audience is, and the price of that information is the revenue forgone. Then ask who bears the risk in each model. If anyone in the room reads LitRPG, hand them the floor — they will explain the audio economics better than you will.",
      src: ["Book Riot (the bestselling books of the week, according to all the lists)","https://bookriot.com/bestselling-books-september-3-2026/"] },
    { cat: "Online", t: "Eight days into the payment-processor story there is still no document — but the developers have written the epitaph themselves, in their own storefronts",
      why: "This is a report on the state of a check rather than a new development, which is the honest thing to file on day eight. Over the past year card networks and processors have pushed adult and explicit material off Steam, itch.io, Gumroad, Tumblr and Wattpad, with a Kotaku explainer adding OnlyFans; Archive of Our Own, which takes no payments for content, is the control case that has not moved. Every search still returns the 2025 wave and nothing newer — the only itch.io policy document that surfaces remains the original NSFW update of JULY 24, 2025 — and no processor has made a statement, no further platform has folded, and no regulator has shown interest. ⭐ What IS newly retrievable is the developer side, in the developers' own words: itch.io devlogs carry entries reading “Paid version cancelled due to itch.io policy changes” and “Shattered Minds no longer available to buy due to itch.io policy changes.” That is the same finding as the price-to-zero workaround, from underneath: free adult games came back, PAID ones stayed delisted, and developers restored availability by setting the price to zero.",
      rec: "This remains the best available illustration of a chokepoint that is neither the government nor the platform, and the devlog line makes it concrete enough to put on a slide. Ask who actually decided what these sites may host, and let the room work backwards — storefront, platform, processor, card network — four layers, of which only the first two are the ones anybody argues with online. Then the sharp question, which takes about four minutes to land and which they will not forget: developers restored their games by setting the price to zero. If a rule can be satisfied by charging nothing, what was the rule actually regulating? Students who have never once thought about payment rails will get there on their own.",
      src: ["Kotaku (the platform sequence, and Archive of Our Own as the case that did not move)","https://kotaku.com/archive-of-our-own-wattpad-smut-ban-fanfiction-2000726632"] },
    { cat: "Playing", t: "Moonlighter 2's Metascore moved from 76 to 77 without a single new review being added — and its user score still has not appeared, two days past its embargo",
      why: "Watch the two numbers separately, because they are doing different things. Onimusha: Way of the Sword went from a Metascore of 85 on 83 critics to 86 on EIGHTY-SIX critics — the mean moved because the sample grew, which is what a sample mean is supposed to do. Its breakdown is 93 per cent positive from eighty reviews, seven per cent mixed, zero negative. Moonlighter 2: The Endless Vault went from 76 to 77 with its critic count FROZEN AT SEVEN. No new observation entered, and the statistic changed anyway — which means a re-score or a change in Metacritic's own publication weights, not sampling. This desk is flagging that rather than resolving it, because it is the more interesting of the two facts and nobody explains it. Meanwhile the game's USER score is still absent — “available after 4 ratings” — roughly two days past a review embargo that was supposed to lift at noon Pacific on September 2. ⚠️ And a date the desk had wrong is now two-to-one against it: Metacritic dates Onimusha's release SEPTEMBER 4, agreeing with Nintendo Life, where this desk had September 3. Flagged, not picked.",
      rec: "Play the two side by side and let the room think they are the same story before you separate them. Give them Onimusha first — 85 on 83, then 86 on 86 — and ask why the number moved. They will say more reviews came in, which is right. Then give them Moonlighter 2 — 76 on 7, then 77 on 7 — and ask the same question. The room goes quiet, and that silence is the lesson: a published statistic can change without any new data, and nothing on the page tells you that happened. Ask what else they read that works this way, and steer toward the aggregate ratings they act on weekly. If the class is quantitative, this is a five-minute weighted-mean demonstration; if it is not, it is still the single most useful thing you can teach them about reading any number somebody else computed.",
      src: ["Metacritic (Onimusha: Way of the Sword — 86 from eighty-six critics, user score still tbd)","https://www.metacritic.com/game/onimusha-way-of-the-sword/"] }
  ],
  classnote: { t: "On one morning this week, four video games sat on the same website with four numbers that look like they belong on the same scale, and the sample sizes behind them were 0, 7, 62 and 86. Onimusha: Way of the Sword carries a Metascore of 86 computed from EIGHTY-SIX critic reviews. The Blood of Dawnwalker, out a day earlier, carries an 83 from SIXTY-TWO. Moonlighter 2: The Endless Vault carries a 77 from SEVEN. And NBA 2K27, which shipped that same morning, carries NO SCORE AT ALL — the page reads “available after 4 critic reviews,” and the only two scores visible on it are a 95 and a 60. Start there, because it is the part students never expect: Metacritic has HARD-CODED A MINIMUM SAMPLE SIZE below which it will not report a statistic. A private firm, with no methodological obligation to anyone, has decided that a mean computed from three observations is not fit to publish — and it is right, as the 35-point spread between 2K27's two visible reviews demonstrates on its own page. Now make it economics rather than statistics. A review aggregate is a device for converting many private opinions into one public signal, and its entire value to a consumer is that it can be acted on without reading anything. That value depends on precision, precision depends on n, and n is exactly the quantity the interface renders invisible: 86 and 77 appear in identical two-digit boxes with identical colouring, and only one of them can bear any weight. So the aggregate is consumed most confidently precisely when it is least reliable — on release day, when the purchase decision is actually made and seven people have played the thing. Ask a class who benefits from that timing, and the answer arrives without prompting: a publisher with genuine word-of-mouth wants to wait for the sample to fill in, and a publisher with a weak title wants the buying done in week one. That is what review embargoes ARE, why they lift when they lift, and why Moonlighter 2's user score being two days late past a noon-Pacific embargo is not a technical hiccup but a decision somebody made. Then close on the strangest observation of the four, because it is the one that generalises furthest: Moonlighter 2's Metascore moved from 76 to 77 with its critic count FROZEN AT SEVEN. The statistic changed with no new data. Whatever caused it — a re-score, a change in the weights Metacritic assigns to outlets — it happened silently, on a page that displays no version history and no methodology. Ask your students where else they encounter a number that can move without new information and without notice, and steer them, gently, to the course evaluations that will be printed in the same font whether nine students responded or two hundred. The question to leave them with is not whether 86 beats 77. It is what a rating system would look like if it were designed to communicate uncertainty rather than to conceal it — and why, when a firm with no obligation at all voluntarily suppresses a mean below n of four, essentially none of the systems they actually rely on do the same.",
    src: ["Metacritic (NBA 2K27 on release day: no Metascore, “available after 4 critic reviews,” and a 35-point spread between the two that exist)","https://www.metacritic.com/game/nba-2k27/"] },

}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}
