  hooks: [
    { story: "A Michigan ballot measure is being kept off the November ballot by a margin of three signatures — in a sample of a thousand. The campaign submitted 709,841 signatures. The legal requirement is 446,198 valid ones. Nobody checked 709,841 signatures. The Board of State Canvassers drew a random sample of 1,000, reviewed them, and extrapolated. Over successive reviews the count of valid signatures in that sample moved from 612 to 624 to 626 — against a threshold of 629. Three short, out of a thousand, on a sample drawn from a population of seven hundred thousand. The board then deadlocked two to two, which under Michigan procedure means the measure does not go on the ballot. As of yesterday the Michigan Supreme Court had done nothing with the campaign's emergency complaint — in the words of an election-law academic watching the docket, it had not even requested a response from the respondents. On August 31 the campaign went to the United States Supreme Court instead, filing an emergency application for an injunction pending appeal. Justice Kavanaugh has asked Michigan to respond by noon today. The Board of State Canvassers meets Friday morning to finalise the ballot; absentee voting begins September 24.",
      src: ["Bridge Michigan","https://bridgemi.com/michigan-government/citizenship-voting-proposal-blocked-from-michigan-ballot-backers-vow-fight/"],
      concept: "Sampling error as a policy instrument — and who bears the cost of each kind of mistake",
      q: "Do not open with the politics. Open with the arithmetic, because the room will not believe it until they have done it themselves. Write on the board: population 709,841, sample 1,000, valid in sample 626, threshold 629. Ask them what the sample proportion is. It is 62.6 per cent. Ask what the threshold proportion is. 62.9. Then ask the question that makes this a statistics class rather than a civics one: how confident should anyone be that the true population proportion is on one side rather than the other of a line three-tenths of a percentage point away? Let them compute the standard error of a proportion at n equals 1,000 — it is about 1.5 percentage points. Have them say out loud what that means: the confidence interval around 62.6 comfortably contains 62.9, and comfortably contains a good deal more besides. The sample does not distinguish the two hypotheses. It is not close to distinguishing them. Somebody will now say the board should just count all of them, and this is the moment to slow down rather than agree. Ask what a full count would cost. Signature verification is human labour — a clerk comparing each signature to a registration record — and 709,841 of them at even a minute apiece is roughly twelve thousand hours of work against a certification deadline weeks away. So sampling is not laziness; it is a rational response to a real constraint, and every state does something like it. The interesting question is not whether to sample but what to do when the sample lands inside its own margin of error. Push them to design the rule. If the estimate is indistinguishable from the threshold, what should happen? Some will say expand the sample, and that is the technically correct answer — have them work out roughly how large a sample would be needed to resolve a three-tenths-of-a-point difference, and watch them discover it is in the tens of thousands, which is a substantial fraction of a full count. Others will say the tie should go to the petitioners, or to the state. Make them defend that, because now they are choosing which error to prefer, and that is the real content. Set it up formally. There are two ways to be wrong. You can put a measure on the ballot that did not have the signatures — a false positive. Or you can keep off a measure that did — a false negative. Ask who bears the cost of each. The false positive costs the state a ballot line and, arguably, dilutes the meaning of the signature requirement. The false negative costs seven hundred thousand people their petition and cannot be undone after the election, because there is no remedy in November for a measure that was not on the ballot. Have them notice that the costs are asymmetric in both magnitude and reversibility, and ask whether the procedure they see here reflects that asymmetry. It plainly does not: a deadlock — the state's own decision procedure failing to reach a conclusion — resolves as exclusion. A tie goes to the measure not appearing. Now the part your better students will enjoy. Ask why the sample estimate moved: 612, then 624, then 626. Three different numbers from the same thousand signatures. That is not sampling variation, because the sample did not change; it is measurement variation — different reviewers, or the same reviewers applying a contested standard, or challenged signatures being restored on appeal. Have them separate the two sources of error cleanly, because students routinely collapse them: sampling error is about which signatures you looked at, measurement error is about how you judged the ones you looked at. Both are in this number and only one of them is what a confidence interval describes. Then ask the harder version: if the review process itself has a bias — if reviewers under time pressure resolve doubt toward invalid — does a larger sample fix it? It does not. Bias does not shrink with n. That single fact is worth the whole class. Close on the institutional question, which is where an economist earns her keep. This dispute is now in front of two courts, and neither court is going to recount signatures. Both are being asked to decide a procedural question whose substance is a statistical one that the procedure was never designed to answer. Ask them what a well-designed rule would have looked like — a pre-committed escalation to a larger sample within a stated band of the threshold, published in advance, with the sample size set so the band is resolvable. Then ask why nobody wrote that rule. The honest answer is that when the rule was written nobody expected the estimate to land inside the margin, and rules are usually written for the cases people imagine rather than the ones that arrive."},
    { story: "Two authoritative institutions are tracking the same Ebola outbreak in the Democratic Republic of the Congo, and this morning they disagree by 1,435 cases and 766 deaths. The World Health Organization's most recent Disease Outbreak News, number 615, was published on August 14 with data as of August 12: 4,665 confirmed cases, 2,184 deaths, a case fatality rate of 46.8 per cent, across 54 health zones in six provinces. WHO's own language is not cautious — it calls this the largest Ebola outbreak ever documented, past the 2018-to-2020 outbreak's 3,317 cases, in a phase of intense transmission and expanding faster than any previous Ebola outbreak. The European Centre for Disease Prevention and Control updates every weekday; its page was last refreshed at five o'clock yesterday evening with data through August 30, and reports 6,100 confirmed cases, 2,950 deaths, a rate near 48.4 per cent, 1,383 recovered and 814 in hospital isolation. Neither is wrong. Neither is out of date by its own standards. WHO publishes a formal situation document roughly fortnightly; ECDC maintains a rolling tracker. And this desk, working from WHO's previous document, told its reader yesterday that the gap was a month when it was eighteen days — because it had not noticed that the slower producer had published.",
      src: ["WHO Disease Outbreak News 615","https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON615"],
      concept: "Information as a produced good — the optimal refresh rate, and why a case fatality rate rises when you look sooner",
      q: "Start by refusing the obvious question. Somebody will ask which number is right, and the answer is that both are, which is annoying and is the whole lesson. Instead ask: what is a statistic? Push until somebody says something like a measurement, and then push past that. A published epidemic figure is a produced good. It has inputs — field reporting, laboratory confirmation, verification, translation, review, sign-off — and it has a production cost, and like any produced good it is supplied at a chosen quality and a chosen frequency. Ask what the two producers are optimising. ECDC is producing a monitoring instrument for people who need to act this week; its buyers value timeliness and will tolerate revision. WHO is producing an authoritative document that member states will cite, that carries diplomatic weight, and that is expensive to retract; its buyers value being right more than being fast. Have them state the trade-off precisely: verification takes time, so timeliness and accuracy are substitutes at the margin, and two rational producers facing different demand curves will choose different points. Neither is failing. Then make them do the economics of the choice. Ask what the marginal value of one more day of verification is, and what the marginal cost is. The cost is a day of unresponsiveness during exponential growth. The value is a lower probability of publishing a figure that has to be withdrawn. Ask when the balance tips — and let them find it: the faster the underlying process moves, the more a delay costs, so an outbreak expanding faster than any previous one is precisely the situation in which a fortnightly cadence is least defensible. That is an uncomfortable conclusion about a serious institution and they should be allowed to reach it themselves rather than be handed it. Now the part that will actually change how they read a number for the rest of their lives. Put the two case fatality rates side by side: WHO 46.8 per cent on August 12 data, ECDC 48.4 per cent on August 30 data. Ask whether the disease got more lethal in eighteen days. Almost every room says yes, or says it might have. Then walk them through why the comparison is close to meaningless. A case fatality rate is deaths divided by cases. But deaths lag cases — a person diagnosed today may die in two weeks or may recover — so at any moment the denominator contains people whose outcome is not yet determined. That is right-censoring, and it biases the naive ratio downward, and the bias is larger the faster new cases are arriving. Have them work out the direction: in a growing outbreak, the naive rate understates true lethality, and it understates it more the more recent your snapshot. So a later snapshot showing a higher rate is exactly what you would see with no change in the disease at all. Ask them what you would need instead — outcomes for a closed cohort, deaths divided by deaths-plus-recoveries among resolved cases only — and note that ECDC gives you 2,950 deaths against 1,383 recovered, which lets them compute a very different number and argue about whether that one is better. It is not obviously better either, and finding out why is worth ten minutes. Finish on the reader's problem, because that is the one they will actually face. Ask what a person should do who has one afternoon and needs a number. They cannot verify either source; they can only choose. Ask what a rational choice rule looks like when the sources differ in freshness and in authority, and let them notice that the answer depends entirely on the use: a policymaker deciding today's shipment wants the fresher figure and will accept revision, a paper going to press in six months wants the authoritative one. The number is not a fact about the world alone; it is a fact about the world filtered through a production process, and which one you should use is a question about your own decision problem. Then, if you want the room quiet, tell them a news dashboard reading these same two pages got the gap wrong yesterday by assuming the slower publisher had not moved."},
    { story: "A quantum-computing company has now given back its entire first-day gain, in public, in four sessions, and every price is on the record. Pasqal — ticker PSQL, a French neutral-atom quantum-computing firm with 2025 revenue of about 16.5 million euros and no profits — came to the Nasdaq through a special-purpose acquisition company whose reference price was $9.79. It opened its first session on August 29 at $16.98, traded as high as $20.10, and closed at $19.11, which every outlet reported as a gain of 95.2 per cent. Then: Monday, $17.30, down 9.47 per cent. Tuesday, $15.56, down a further 10.06 per cent, on about 1.88 million shares, with an after-hours print of $14.84 and a market capitalisation near $447 million. Three consecutive down days, and the stock has surrendered about two-thirds of the pop while remaining well above the SPAC's reference price. Nothing bad happened to the company in between. Its news of the week is a research collaboration with Saudi Arabia's national science agency, announced with no dollar figure attached — which is to say, an announcement rather than a result. The chief executive's line on debut day was that “today is not a finish line; it is an acceleration point.”",
      src: ["The Quantum Insider","https://thequantuminsider.com/2026/08/29/pasqal-shares-nearly-double-in-nasdaq-debut/"],
      concept: "What a first-day pop actually measures — price discovery in a thin float, and why a reference price is not a market price",
      q: "Begin by asking the room what the company was worth on August 29. They will reach for the closing price times the shares, which is what a market capitalisation is, and you should let them do it and then take it apart. Ask a second question: how many shares actually changed hands? On the second session it was about two million, on a company valued near half a billion dollars. Ask what fraction of the company that is. In a SPAC listing the free float is typically a small slice; most shares are locked up. Now have them state the implication carefully, because it is the load-bearing idea: a price is set by the marginal buyer and the marginal seller, and when only a sliver of the company is available to trade, the marginal buyer may be a very unrepresentative person. Market capitalisation multiplies a price formed on two per cent of the shares by a hundred per cent of them. Ask whether the company could actually be sold at that price. It could not, and everybody in finance knows it, and the number is quoted anyway. That is worth sitting with. Next, attack the phrase 'up 95.2 per cent'. Up from what? From $9.79 — a SPAC reference price, which is not a price anyone paid in an open market; it is a convention, the trust value per share. Ask what the ninety-five per cent is therefore measuring. Not that the market revalued the company overnight, but that the price at which the vehicle was assembled and the price the open market first produced were different numbers. Have them say what would follow if the reference price had been set at $19 instead. The same company, the same first trade, and a headline reading 'flat'. A percentage change requires a baseline, and where the baseline is an administrative convention the percentage is close to meaningless. This is the same error as reporting a box-office record without adjusting for ticket prices, and if you have run that example they will make the connection themselves. Now the interesting part, which is the three days after. Ask what new information arrived between Saturday and Tuesday. Essentially none: no earnings, no contract loss, one partnership announcement with no numbers in it. So a third of the value evaporated on no news. Ask what that implies about what the first-day price contained. Push them toward the answer that the opening price was not an estimate of fundamental value at all but the outcome of a temporary imbalance — a rush of demand from investors who could not get shares any other way, meeting a supply that was contractually restricted. As that imbalance clears, the price falls back toward whatever the broader market thinks, and the decline is not the market changing its mind but the market finally being allowed to speak. Have them name what this predicts: that the drift should be downward and gradual rather than a single correction, which is exactly the three-day pattern in front of them. Then get to the distributive question, because that is the one nobody in a finance textbook asks. Ask who bought at $19.11 and who sold. The people who could sell into the pop are, broadly, those who held before it. The people who bought at the top are, broadly, retail investors reading a headline that said a quantum-computing company had nearly doubled. Ask them to describe the transfer in plain language. Then ask whether anyone did anything wrong, and hold the line that mostly nobody did — which is the point. A well-functioning price mechanism, a thin float, an administrative baseline, and a news cycle produced a systematic transfer without a villain. Finally, make them value the thing. Sixteen and a half million euros of revenue, unprofitable, four hundred and forty-seven million of market capitalisation. Ask what has to be true for that to be sensible. They will get to option value: you are not buying a cash-flow stream, you are buying a claim on a technology that either matters enormously or does not matter at all. Ask how you price an asset whose distribution of outcomes is bimodal and whose probabilities nobody can estimate — and then point out that this is the same problem as the Hormuz insurance premium from last week, a price set under genuine ambiguity rather than measurable risk. A student who sees that a war-risk underwriter and a quantum-computing investor are solving the same problem has learned something that will outlast the term."}

  pulse: [
    { cat: "Listening", t: "The Parton baseline has finally been found, and it answers the question this desk has been chasing for a week: before she died, “9 to 5” was essentially not on the global chart at all",
      why: "Every run since August 25 has said the same thing — the streams are falling, and nobody can say what they are falling toward, because no pre-death baseline could be located. It has now been located, on kworb's per-track history page, and the answer is starker than expected. In ordinary times “9 to 5” barely registered globally: its last appearances anywhere were Sweden at number 173 with 44,637 daily streams in June, Sweden at 73 with 57,268 last New Year's Eve, and the United Kingdom at 133 with 106,688 the New Year's Eve before that. It was not on the worldwide chart in a normal week. Against that, the arc: number 51 with 1.88m global streams on the 25th, number 2 with 3.95m at the peak on the 26th, then 2.48m, 2.16m, 1.85m, and 1.45m on the 31st. Note carefully that these are worldwide figures and the decay percentages this desk published earlier were United States daily figures — two different series, and merging them would have been the easy error. The Jolene and Islands in the Stream figures for the 31st are 1,812,716 and 1,103,720. So the floor question resolves in a direction worth teaching: even at a third of its peak, the catalogue is running at something like thirty times its ordinary global presence, and the interesting thing is not the collapse but that the collapse is landing somewhere much higher than where it started.",
      rec: "This is the cleanest demand-shock dataset a professor will get handed all year, and it now has a genuine before as well as an after. Give students the seven daily figures and the baseline, ask them to fit a decay and forecast where it settles, and then ask the question the numbers cannot answer: is the new floor higher because people discovered the catalogue and kept it, or because the algorithm learned to serve it and has not yet unlearned? Distinguishing those requires data nobody publishes, and noticing that is the lesson.",
      src: ["kworb (9 to 5, Spotify chart history and daily totals)","https://kworb.net/spotify/track/4w3tQBXhn5345eUXDGBWZG.html"] },
    { cat: "Watching", t: "The GTA 6 trailer opened to 31.1 million views and led in 87 of 93 countries, then slid to fourth in the United States in five days — and both of those are true at once",
      why: "What's on Netflix has the day-by-day, which is better than a snapshot: the twenty-six-minute Extended Look averaged a global rank of 1.0 on its first day, meaning a near-total sweep of national number-one slots including the United States, the United Kingdom, Brazil, France and Japan; then 2.6 by the 30th, 3.5 by the 31st, and 4.3 yesterday, sitting third in Germany, Spain and the UK and fourth in the United States. Netflix's own framing is that this behaved like one of its boxing events rather than like a series — front-loaded, enormous, and gone. And yet a trade headline reports it as Netflix's most-watched title of the week. Both are correct and they measure different things: a daily rank is a flow and a weekly total is a stock, and an object that is colossal for one day and ordinary for six can top the week while losing the day. Which number a company quotes tells you what it is selling. Five days on, Take-Two has still disclosed nothing about the terms of the arrangement, and every quotable line from its chief executive predates the premiere.",
      rec: "Ask a class which figure they would put in a press release if they were Netflix, if they were Rockstar, and if they were a rival studio — same object, three different honest answers. It is the most efficient way to teach the difference between a stock and a flow, and it works because they already care about the object. The trap to avoid is treating the decline as a failure; nothing about a trailer was ever supposed to have a long tail.",
      src: ["What's on Netflix (the Extended Look: 31.1m views and the daily rank decay)","https://www.whats-on-netflix.com/news/top-10-reports/grand-theft-auto-6-extended-look-netflix-top-10-viewership/"] },
    { cat: "Watching", t: "Spider-Man: Brand New Day took a fifth consecutive weekend at number one and is days from the all-time domestic box-office record",
      why: "Twenty-two point two million on its fifth weekend, a fifth straight win, projected to pass nine hundred million domestic midweek and — within about two weeks — to overtake Star Wars: The Force Awakens as the highest-grossing domestic release in history. That is a different record from the worldwide comparison with Titanic this desk has already carried, and it is the one that will get the headlines. What makes it worth a card on a page otherwise full of things that decayed in three days is the contrast. The most anticipated trailer in the history of the medium held a number-one slot for about seventy-two hours. A country single has been at number one since spring. And a superhero film has now won five consecutive weekends in an era when the received wisdom is that nothing holds anything. The three facts do not fit one story, and a student who notices that is thinking properly.",
      rec: "When the record falls, every outlet will report it as the biggest film ever in America, and almost none of them will adjust for ticket prices. That is your opening. Ask the room what a dollar figure from 2015 and a dollar figure from 2026 have in common, and let somebody get to nominal versus real. Then ask what the honest comparison would be — admissions rather than receipts — and note that on that basis Gone with the Wind is still comfortably ahead and no headline will say so. Five minutes, and it inoculates them against a mistake they will see in print within a fortnight.",
      src: ["Bleeding Cool (a fifth weekend at number one and the domestic record in sight)","https://bleedingcool.com/movies/spider-man-brand-new-day-fifth-weekend-box-office/"] },
    { cat: "Reading", t: "Book Riot's Tuesday roundup posted exactly as forecast — and Dungeon Crawler Carl's bestseller run now has a book number attached",
      why: "Yesterday's card noted that publishing still runs on a Tuesday clock inherited from physical distribution, that at five in the morning the roundup had not yet appeared, and that the clock therefore ticks at business hours rather than at midnight. It posted during Tuesday and is live: seventeen titles, including a reissue of Octavia E. Butler's Patternist novel Survivor, Marlon James's The Disappearers, James Islington's Scion, Emily Wilson's Crossing the Wine-Dark Sea, Rachel Harrison's Kiss Slay Replay and Kalynn Bayron's Tell The Ghosts I'm Gone. A forecast made on a mechanism and confirmed the next day is a small thing but it is the right kind of small thing. The same post advances the story this desk has been tracking underneath it: Matt Dinniman's web-serial LitRPG series is on the national lists at book eight, A Parade of Horribles. A series that began as free serialised fiction is now eight volumes deep and selling alongside literary hardcovers, which is not a novelty any more but an established parallel pipeline.",
      rec: "The useful question for a class is not why the genre is popular but why publishing's calendar still has a weekly heartbeat at all. Physical distribution required it; digital distribution does not. Ask what a coordination convention is still doing in a market where its original constraint has vanished, and let them find the answer — that release-date coordination now serves charts, review scheduling and retail attention rather than trucks. Conventions outlive their causes when enough people are organised around them.",
      src: ["Book Riot (new releases for September 1, 2026)","https://bookriot.com/listen/new-releases-and-more-for-september-1-2026/"] },
    { cat: "Online", t: "August's meme of the month is a ceasefire: rival fandoms declared a truce to make fun of the same film together, and it won with 13.3 per cent",
      why: "Know Your Meme declared its August winner yesterday, closing the absence this desk reported twice. The winner is “Lesbian Space Princess Fandom War,” also circulating as the Great Fandom Truce of 2026 — normally hostile online fandoms suspending their usual conflicts to collectively ridicule a poorly received Australian animated film on Netflix, and joining forces to do it. Two things about that are worth a professor's attention. The first is that it was not among the five nominees this desk recorded on August 27, which means the ballot was larger than the desk's own note of it and the note should be read as partial rather than complete. The second is what actually happened socially: groups that define themselves largely by opposition to each other found it cheaper to cooperate against a shared target than to keep fighting. That is not a new phenomenon and it is not an internet phenomenon, which is exactly why it is teachable. Thirteen point three per cent is also a reminder that a plurality winner in a five-or-more-way field is not a majority of anything.",
      rec: "This is a coordination story with an unusually clean structure, and it takes four minutes. Ask why groups that will not cooperate on anything else cooperate on this, and push past “they had a common enemy” to the mechanism: ridicule is non-rival and non-excludable — my mocking a film does not use it up and cannot keep you out — so it is a public good that costs each participant nothing and rewards each of them with attention. That is why it scales and why the truce dissolves the moment the target does. Skim this one URL monthly and you will have the whole reference set by December without ever opening a platform.",
      src: ["Know Your Meme (the winner of August 2026's meme of the month)","https://knowyourmeme.com/editorials/poll/see-the-winner-of-august-2026s-meme-of-the-month"] },
    { cat: "Playing", t: "Moonlighter 2 lands today with a Metascore built on four reviews, in a week that has four more releases and a November everyone is budgeting around",
      why: "Moonlighter 2: The Endless Vault releases today at 76 on Metacritic — from four critics, split evenly between positive and mixed, with the user score embargoed until noon Pacific today. Crimson Moon, out yesterday, sits at 73 from five critics. One review, at 7.5, is worth reading for the shape of the complaint: it praises that “most gear and items players pick up in Crimson Moon actually matter,” and then says “frame rate drops make some sections almost unplayable, even on the lowest settings on PC,” with an unstable camera and an underdeveloped story, concluding it is “an engaging, unique game” anyway. Then The Blood of Dawnwalker and Onimusha tomorrow, NBA 2K27 on Friday. The reason the week is this crowded is not a mystery: Grand Theft Auto VI arrives November 19 at $79.99, publishers have known the date for months, and under-25 players discuss the autumn in explicitly budgetary terms on forums — what they are buying before it absorbs everything.",
      rec: "The number to point at is not 76, it is four. A Metascore from four reviews and one from four hundred are presented identically and are not the same object, and the small-sample one moves violently as more arrive. Ask a class what an aggregate score is actually aggregating, and what confidence they would attach to it — then ask why a publisher might prefer to launch into a thin review window rather than a crowded one. They will get there, and they will never read a review aggregate the same way.",
      src: ["Metacritic (Moonlighter 2: The Endless Vault)","https://www.metacritic.com/game/moonlighter-2-the-endless-vault/"] }

  classnote: { t: "A transaction happened in public last Thursday and nobody has disclosed the price — which makes it the best exercise in inferring value from quantities that your students will ever be handed about something they actually watched. The facts, and they are unusually complete for everything except the one thing that matters. Rockstar released a twenty-six-minute Grand Theft Auto VI Extended Look at three in the afternoon Eastern, exclusively on Netflix. Six hours later, at nine, the same video went up on YouTube and on the game's own site, free, to anyone. So this was not a paywall; it was a six-hour head start. Netflix's service errored worldwide for about three minutes under the load. Sensor Tower measured Netflix web users up 125 per cent and mobile users up 50 per cent against the average of the previous twelve Thursdays. Netflix reports 31.1 million views in the opening window and a number-one position in 87 of 93 countries, and its global average daily rank went 1.0, then 2.6, then 3.5, then 4.3 by yesterday — while a trade headline still calls it Netflix's most-watched title of the week. Take-Two Interactive has said nothing about terms. Strauss Zelnick's most recent verifiable comments on the arrangement are from August 11 and 12, before it happened, and describe it as part of Rockstar's marketing strategy. No money has been disclosed in either direction. The game itself arrives November 19 at $79.99, with preloading from the 12th. Now teach it, and open by refusing to let the class guess the number. Ask instead: what was actually exchanged? Netflix gave up six hours of exclusive distribution rights — a slot, essentially. Rockstar gave up nothing it needed, since the video went free the same evening. So neither side obviously paid cash, and the transaction may have been a barter of attention for attention. Have them write down the two possible directions before proceeding, because students default to assuming the famous party was paid, and here it is genuinely unclear who the buyer was. Then work Netflix's side, which is the tractable one. Ask what Netflix got and how you would value it. They will say subscribers; push them to be precise, because the traffic surge is not the same thing. A 125 per cent lift in web users on one Thursday tells you about visits, not about sign-ups, and not about retention. Ask what data you would need to convert the one into the other — conversion rate from visit to trial, from trial to paid, and the churn curve on subscribers acquired by a one-off event — and let them discover that a company with all three numbers could value this precisely and that nobody outside has any of them. Then ask the sharper question: are event-acquired subscribers worth the same as organically acquired ones? Almost certainly not, and the direction is arguable both ways, and having them argue it is the point. Now Rockstar's side, which is the interesting one. Ask what a publisher gains from putting a trailer behind a six-hour delay when it intends to release it free anyway. Somebody will say hype, which is true and useless. Push for the mechanism. A scheduled scarcity converts a passive viewing into an appointment: it manufactures a moment at which a large number of people are watching the same thing simultaneously, which is worth more than the same number of views spread over a week because simultaneity produces conversation, and conversation is what actually sells a $79.99 product eleven weeks out. Have them state that as a general result — that the value of attention is not linear in its quantity, because coordinated attention creates a good that dispersed attention does not — and then ask where else they have seen a firm deliberately restrict supply of something it planned to give away. Now the measurement problem, and this is where a careful student separates from a clever one. Put the two claims side by side: the daily rank fell from first to fourth in five days, and it was still the most-watched title of the week. Ask whether these contradict. They do not: one is a flow measured daily and one is a stock accumulated over seven days, and an object enormous for one day and ordinary for six can top the week while losing the day. Then ask the question that makes it economics rather than arithmetic — which figure would each party choose to publish, and why? Netflix wants the weekly stock, because it says the deal delivered. Rockstar wants the opening-window views and the 87-of-93 sweep, because those say the world stopped. A rival wants the daily rank, because it says the effect evaporated. Same object, three honest numbers, three different arguments. Have them notice that nobody has to lie for this to happen, and that this is the ordinary condition of every business statistic they will ever read. Then push into the part most classes never reach. Ask why neither party has disclosed terms, and rule out the lazy answer that they are hiding something embarrassing. Consider instead that disclosure would be strategically costly to both: if Netflix paid, every future rights-holder now knows Netflix's reservation price for an event slot; if Rockstar paid, every future platform knows what a games publisher will pay for a six-hour window. Have them articulate that a disclosed price in a thin, bilateral market is not information about one deal but a bargaining position in all subsequent ones — which is exactly why prices are public in commodity markets with many participants and secret in markets with very few. That single observation explains an enormous amount about which industries publish their prices. Close on the estimation question and leave it open, because it should be. Ask what you would need to bound the transfer. You could estimate the value of six hours of exclusivity from the observable traffic lift and some assumption about conversion; you could estimate what the same reach would have cost Rockstar in bought advertising; and the gap between those two numbers brackets the range in which a rational deal sits. Ask them to sketch it, and then ask what would change their estimate. If they say Take-Two's next quarterly filing, they have understood the whole thing: the price is unobservable now, and it will eventually leave a trace in an account, and reading a market by its residue is most of what an applied economist actually does.",
    src: ["What's on Netflix (31.1 million views, 87 of 93 countries, and the daily rank decay)","https://www.whats-on-netflix.com/news/top-10-reports/grand-theft-auto-6-extended-look-netflix-top-10-viewership/"] },

const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,

FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),

];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
