<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

    { h: "World & geopolitics", items: [
      { t: "The Vatican channel finally produced a readout, and it says nothing — while the president spent Thursday denying, harder, what four American newspapers report his CIA director did. Take the readout first, because it closes a thread this desk has been carrying open for two days. TASS, dateline “THE VATICAN, August 27,” reports that Archbishop Paul Richard Gallagher met Yury Ushakov, Putin’s aide for international affairs, in a pre-arranged one-on-one. The Vatican Secretariat of State’s entire published account is that “the discussion touched upon topical international issues.” That is the whole thing. Gallagher’s five-day visit also took in Lavrov — after which the Russian side called relations “trustworthy, friendly and pragmatic” — and Metropolitan Anthony of Volokolamsk at the Cathedral of Christ the Saviour. So Ushakov is on the record as having been in a room, and still not on the record in his own voice; and the only outlet that carried the meeting at all is Russian state media. Lavrov then tied the two Moscow visits together explicitly: “In both cases, the visits reflect the desire of those who visited us to come and talk.” On the American side the story went the other way. SVR director Sergey Naryshkin confirmed meeting John Ratcliffe — “the meeting did take place, and there is nothing unusual to it,” and, in Meduza’s rendering, “we discussed issues that fall within the purview of the intelligence services.” The Moscow Times ran it as “Nothing Special.” And Trump, speaking to Axios, moved from Wednesday’s “sort of semi-routine” to a flat denial: “I am not concerned… at all. There is no problem,” and “Ratcliffe sees his Russian counterpart once every six months or once every year. They have a very good relationship. There was no message and there was nothing unusual.” Set that against what the American press reports: the Wall Street Journal and Politico say the visit carried warnings against attacking NATO; the New York Times says Ratcliffe conveyed that Russia’s military and economic position is deteriorating and urged serious negotiations; the Washington Post says fresh intelligence suggested the Kremlin reads Washington as weakened by the Iran war. The US also asked Ukraine not to strike Moscow or St Petersburg during the roughly eight-hour visit. This desk will not adjudicate it, but the shape is worth naming: a US president and the Russian state wire have arrived at the same characterisation — nothing unusual, no ultimatums — against four US outlets reporting a substantive warning. Peskov, meanwhile, answered the Bloomberg escalation report directly and did not deny the premise so much as reframe it: Ukraine “is trying to hit our economic infrastructure, our trading infrastructure, thus causing a response” that “will be a heavy response,” adding “we simply don’t need it because we are advancing anyway.” Witkoff and Kushner make eight consecutive days with nothing verifiable.",
        s: [["TASS (Gallagher meets Ushakov)","https://tass.com/world/2178387"],["Moscow Times (Naryshkin: ‘nothing special’)","https://www.themoscowtimes.com/2026/08/27/russian-spy-chief-says-meeting-with-cia-director-was-nothing-special-a93585"],["Kyiv Independent (Trump: ‘there is no problem’)","https://kyivindependent.com/there-is-no-problem-trump-says-dismissing-russia-nato-threat-after-cia-chiefs-moscow-visit/"],["Meduza (Kremlin on escalation)","https://meduza.io/en/news/2026/08/27/kremlin-says-russia-doesn-t-need-military-escalation-because-its-army-is-advancing-anyway"]] },
      { t: "Kyiv set a record it did not want: thirteen air-raid alerts in a single day, the most since February 2022. The previous record was twelve, on 1 March 2022. Across the thirty-three hours from midnight Thursday to nine on Friday morning the city logged seventeen alerts, and total alert duration on Thursday alone ran to 872 minutes — roughly fifteen hours under warning. At least 398 drones were launched at Ukraine over that window, the majority toward the capital; air defences “intercepted or suppressed the vast majority,” which is the only interception language filed. At least four were injured in Kyiv, with explosions again around half past midnight. What burned is the part worth reading twice: Fora, Rozetka, Fozzy Group, Toy House, Comfy, Kolos, Avrora and Roshen warehousing, two schools, a four-storey residential building in Podilskyi, and a drone down on a main road in Holosiivskyi; Ukrainian Railways ran delays of up to thirteen hours. Nova Poshta took a triple-tap at Bilohorodka — one strike, then two more about an hour later while crews were fighting the fire. Anton Ovsiienko, head of the Bilohorodka village council: “firefighters and other specialists managed to move to a safer area before the additional impacts.” And in Kherson all generating equipment at the thermal power plant was destroyed by four glide bombs, the second strike on that plant in two days, with the heating season weeks away; Naftogaz says the attack “has no military purpose” beyond attempting to “terrorize civilians,” and that its facilities have been attacked 293 times since January. There is still no consolidated launched-versus-downed tally for the night of Aug 27–28 alone, and this desk prefers to print that absence rather than fill it. The reason is itself news: Meduza reports that Ukraine’s air defence forces stopped publishing downed-missile figures in mid-August because of the interceptor shortage, having halted ballistic reporting after an attack in which none of twenty-eight projectiles were intercepted — and resumed on Aug 27, reporting one Onyx and seven ballistic missiles downed without stating how many were fired. Zelensky says “this week, our European allies made important decisions to strengthen Ukrainian air defense,” having said Monday that Ukraine received “a few” Patriot missiles; the Associated Press reports that US forces in Europe do not have enough Patriots to stop a sustained Russian ballistic attack. Going the other way, Ukraine hit the Slavneft-YANOS refinery at Yaroslavl for the eighth time this year — Governor Mikhail Evraev gives one killed and twenty-seven injured, ten of them when drone debris fell onto a bus — plus Sevastopol, where four were hurt and a five-storey block and two kindergartens damaged, and Pavlovsky Posad east of Moscow, where a drone hit a Magnit supermarket. The night before, Ozon logistics hubs at Ufa and Orenburg. Since mid-July more than twenty Wildberries distribution centres across sixteen regions have been attacked, at least seven of the company’s ten largest warehouses knocked out; estimated losses run to ₽800bn for Wildberries and ₽30–62.5bn for Ozon. Both sides are now fighting a war on retail logistics and each casts itself as the retaliator. One correction to yesterday’s window: the earlier Kyiv attack resolves at 258 attack drones launched with 222 downed, plus Oniks, Iskander-M/KN-23 and S8000 Banderol, fifteen locations struck. ISW has now published no assessment for two consecutive days, Aug 26 and Aug 27 — when ISW is silent there is no arbiter for the front line.",

      { t: "The ruble had its worst day of the series, the euro crossed a hundred, and Russia’s fuel crisis now has a number attached to it. The Bank of Russia set USD/RUB at ₽85.9541 effective Aug 28, from ₽84.2820 — a move of ₽1.67, or 1.98% in a day, the largest single-session weakening in this series and enough to erase Thursday’s brief strengthening entirely. EUR/RUB went to ₽100.2998, the first time the euro has crossed a hundred in the run this desk has been tracking; CNY/RUB ₽12.7691. Cumulatively Aug 22 to 28 the ruble is down 3.66% against the dollar. The key rate stays at 14.00%, unchanged since July 27, with the next board meeting Sept 11. No MOEX level was retrievable in any reachable source, and this desk would rather say so than substitute one. On fuel, Meduza has done the arithmetic that turns an anecdote into a series: using 478,685 user reports from the GdeBENZ app covering 25,129 stations across 83 regions between July 4 and Aug 23, the first crisis wave bottomed on July 8–11 with only 17 to 29% of stations selling fuel without queues; the second wave, Aug 11–13, ran 25 to 33% without queues and 46 to 48% including queued stations. AI-92 rose about ₽5, or 7%, by mid-July and AI-95 ₽6.80. There were fifteen drone attacks on Russian refineries between July 25 and Aug 20 — Tyumen, Ryazan, Perm, Volgograd, Ufa, Syzran, Yaroslavl, Ilsky, Nizhnekamsk, Orsk and Salavat among them — with several multi-day shutdowns. Moscow’s share of stations selling without queues fell from 75% in late July to 30% by mid-August; St Petersburg held 81%. Meduza’s own framing is the honest one: “the second wave notably differs from the first: some regions barely felt it, while others faced continuous crisis without promised normalization.” The diesel question remains open. The July 30 package runs the gasoline and diesel export ban through Jan 31, 2027; what happens on Sept 1 is that refineries regain the right to export diesel, and the live question is whether the government closes that carve-out. No decision has landed. What does land on Sept 1 is the digital ruble, which goes live. In Brussels, Sweden, the Netherlands, Spain and Poland are pushing the Commission to do the technical work needed to deploy frozen Russian assets for Ukraine, seeking a route around Belgium’s blocking position: €260bn of Russian central-bank assets are frozen, €193bn of them at Euroclear, against a €50bn loan already financed from profits under the 2024 agreement and €90bn provided in December 2025. Putin meets Lukashenko on Saturday. Ukraine’s President’s Office says Russian intelligence documents show plans to mobilise 600,000 recruits across 2026 and 2027, citing “loss of initiative,” with internal papers showing war dissatisfaction as high as 69% in some regions — a claim from one side, in a window where ISW is silent.",

      { t: "Bessent’s week ended without the bank. On Aug 24 the Treasury secretary promised a major announcement naming an Iranian financial institution “by the end of the week.” It is now Friday morning and both indices say no. The press-release run tops out at SB0616 of Aug 26 — violent far-left terrorist networks, not Iran, not a bank — with SB0613 of Aug 24 still the most recent Iran action; there is no SB0617. OFAC’s Recent Actions agrees independently: its Aug 27 entry is amended Venezuela general licences. Five days, no designation. What did issue is quieter and arguably worth more: a Federal Register final rule published Aug 26 and effective Aug 24 indefinitely stays five Iran general licences — 31 CFR 560.544, 560.550 and 560.554 plus General Licences F and G — suspending educational activities by US persons in third countries, conference services, professional and amateur sports exchanges, academic exchanges, and personal remittances to and from Iran. OFAC’s stated ground is “Iran’s continued disruptions to global energy markets, attacks on partners and allies in the Middle East, reconstitution of its conventional and nuclear weapons programs.” Cutting personal remittances is a sanction on households, and it went out as a technical notice. On the Hormuz corridor, still no vessel has transited. Confirmed: seven miles or 11.3 kilometres wide, entry and part of the exit through Iranian territorial waters, coordinates undisclosed, explicitly temporary, with a joint mine-clearing project and no timeline. Kazem Gharibabadi: “the agreed-upon transit route with Oman is a temporary route,” and it does not mean the strait is open. Oman’s Badr Albusaidi, on X: “future management of the strait and a permanent solution will follow in due course.” Two figures circulating from a single source — a sixty-day framework with no transit fees during a trial, and tolls of up to $2m a vessel — should be left alone: the $2m is numerically identical to the figure in a Türkiye Today piece of March 30 that this desk has already rejected, and no other outlet carries either. Traffic moved and still does not reconcile. Kpler via Reuters gives seven commodity vessels on Aug 27 against seventeen on Aug 26 and a ten-day average of fifteen — the seventeen being the highest single day in the series. GlobalSecurity, now at Day 181 for Aug 27, counts 121 crossings for the week of Aug 17–23 and benchmarks against a pre-war normal of about 85 vessels a day and throughput of roughly 5m barrels against 20m. The two are measuring different things and both belong in the record. The rial opened around 2,020,000 to the dollar against an official 1.5m, inflation is near 90% per the Statistical Center of Iran, and the pause in strikes inside Iran reached a 28th night; two vice-presidents, Ghaempanah and Aref, are now on record that the current fuel path is “impossible” and that substandard gasoline imports are unsustainable, with reserves described as at red alert. In Lebanon the standing framing is dead: Hezbollah launched two explosive drones at Israeli troops on the Ali al-Taher ridge overnight Wednesday into Thursday — the IDF downed one and lost contact with the second, no Israeli casualties — though Hezbollah has not claimed it, the attribution is Israeli, and Ali al-Taher is a recurring target rather than a one-off, so do not read it as the promised Aug 15 retaliation. Israel struck Arab Salim in Nabatieh in response, killing a woman married forty-eight hours and wounding six. Lebanon’s health ministry now gives 4,350 killed and 12,310 wounded since March 2. On Gaza there has been nothing published for a fourth consecutive day. From the heterodox benches: Mearsheimer’s “The World’s Rooting for Iran” argues “people all over the planet are rooting for the US (and Israel) to lose”; Larry Johnson has two new pieces including one on the diesel market; and at Responsible Statecraft the Quincy Institute’s Karthik Sankaran connects the war to the bond market — thirty-year yields at 5.3%, levels last seen in 2007, debt past $40tn, a $2.1tn deficit, tariffs adding 0.7% to consumer prices per the Yale Budget Lab. Diesen and Sachs both come back verified negatives.",

      { t: "Nvidia got its follow-through a day late and took the market with it. The shares closed Thursday at $227.98, up 8.74% — and the arithmetic closes cleanly against Wednesday, since the $219.53 after-hours print at +4.71% implies a regular-session close near $209.66, and $209.66 times 1.0874 is $227.98. So the pre-market confusion this desk refused to publish on Wednesday resolved in favour of the bulls, and the correct call was to wait. Sales rose 106% year over year, EPS 128%, data-centre sales 117%; CNBC put the market-cap addition above $400bn, though that figure is headline-sourced only. The indexes went with it: S&P 500 7,730.99 (+55.29, +0.72%), Nasdaq Composite 26,541.35 (+411.16, +1.57%), Dow 53,569.44 (+105.56, +0.20%), Russell 2000 3,014.34 (+8.44, +0.28%) — all four arithmetically consistent with Wednesday’s closes, and note that a competing Russell print of 3,015.62 does not reconcile. Salesforce rose 22.58% on earnings and an announced partnership with Anthropic, with Marc Benioff describing it as “fusing Claude’s extraordinary reasoning with the trusted data, workflows, and governance every enterprise runs on”; CrowdStrike gained 20.50%, Veeva 15.20%, and Hormel fell 10.25%. The VIX hazard this desk flagged on Wednesday is now resolved rather than merely quarantined: Thursday’s cash close of 14.46, down 4.93%, implies a prior settle of 15.21 — the same 15.21 implied by the live-blog read of 14.84 the desk declined to publish. The chain is internally consistent and 15.21 is no longer orphaned. Thursday’s data was mixed in an interesting direction. Initial jobless claims came in at 203,000, down 4,000, against a 208,000 consensus, and continuing claims at 1.778m, down 18,000, below the 1.799m expected — a tighter labour market than the street had, on both legs; Jefferies’ Thomas Simons reads it as “a modest, steady pace of private sector job creation that is right in line with” labour-force growth. Against that, the advance goods trade deficit for July blew out to $118.8bn from June’s $101.4bn, the widest in sixteen months and roughly $20bn worse than the $99bn consensus, with exports down 2.9% and imports up 3.7%. That is a mechanical drag on Q3 GDP and it was the day’s biggest surprise, and it went almost unremarked. The Kansas City Fed manufacturing index printed 17, unchanged from July and its highest since April 2022, with every month-over-month component positive except new export orders at −2 — one figure worth handling carefully, since 17 and 14 are both circulating as the consensus and this desk cannot adjudicate which was the street; the print itself is not in dispute. Marvell reported after the close: revenue $2.74bn against $2.71bn, adjusted EPS $0.94 against $0.93, data-centre revenue up 46%, operating margin 16.8% from 14.5% — and the news was the guide, $3.15bn for Q3 against a $3.03bn consensus. The shares fell 3.1% to $235.05 anyway, and sat at $241.45 in Friday’s pre-market.",

      { t: "The Jackson Hole agenda posted, and it is an unusually good one — Warsh speaks at ten this morning. The symposium runs through Saturday on “Financial Innovation: Implications for Payments and Policy,” the first time in its history the theme centres on payments. Friday is chaired by Kristin Forbes of MIT and opens with Kevin Warsh’s keynote at 8:00 Mountain, which is 10:00 Eastern, his first as chair, on the Kansas City Fed’s YouTube channel. Then Eswar Prasad of Cornell on “Financial Innovation and the International Monetary System” with Catherine Mann of the Bank of England MPC discussing; Darrell Duffie of Stanford on “Innovation in Tokenized Finance” with Isabel Schnabel of the ECB discussing — note that Schnabel is a discussant, not a standalone speaker, which sharpens what this desk carried yesterday; a panel with Pablo Hernández de Cos of the BIS, Stefano Scarpetta of the OECD and Kristalina Georgieva of the IMF; and Kenneth Rogoff at lunch. Saturday, chaired by Anil Kashyap, has Christine Parlour of Berkeley on the future of banking with Itay Goldstein discussing, and Markus Brunnermeier of Princeton on “Financing Innovation” with Raghuram Rajan discussing, closing on a panel of Wenxin Du, Arvind Krishnamurthy and Jesús Fernández-Villaverde. On expectations, keep two surveys apart: the BofA fund manager survey has 69% expecting a neutral tone, while CNBC’s survey of economists — a different universe and a different question — has 45% expecting no guidance at all, 31% anticipating a hawkish stance and 19% a neutral one, with 80% saying Warsh should offer insight into his economic views. Larry Holzenthaler of Catalyst Funds: “this is one of the more meaningful Jackson Hole gatherings in some time,” and “Chairman Warsh has indicated that his stance is going to be to communicate a little bit less to the market.” Kansas City Fed president Jeffrey Schmid, on Thursday, called inflation “still stubborn” and “still sticky.” On the path itself, the venue numbers finally refreshed and they reconcile: CME FedWatch has a 64% probability of no action in September, and futures price a 35% chance of a September increase with a December hike fully priced — 64 plus 35 leaves essentially nothing for a cut. TradingEconomics puts the December hike above 70% rather than fully priced, so publish the direction and skip the magnitude. Recall the July 29 FOMC held 3.50 to 3.75% by nine to three with all three dissents hawkish; next meeting Sept 15–16. Yields sat at 4.68% on the ten-year in Friday’s pre-market and 5.20% on the thirty, near multi-year highs, with the two-year at 4.24%; the H.15 series had not posted Thursday’s row at fetch time, so treat the Thursday ten-year close near 4.67% as inferred rather than sourced. DXY 99.152. One caution: TradingEconomics shows the dollar down 1.72% on the month, which does not square with the +2.46% over four weeks this desk carried — different windows and possibly different bases, so do not publish a monthly dollar change without picking one. Gold reads between $4,611.72 and $4,664.80 across Thursday’s close and Friday’s pre-market, tracking its largest monthly gain since 1999; silver $70.79, up 2.22% on the day and 22.88% on the month — a level that sits exactly on top of a known-stale March headline, so quote the date, not the headline. WTI around $82.87 in Friday pre-market after a Thursday close near $83.64, Brent easing below $90 after the Oman agreement. Bitcoin around $79,700 to $80,000 — and note that CoinDesk’s own headline says it lost $80,000 while its URL says it held, which is a superlative conflicting with itself inside one article, so publish the level. LMAX’s Joel Kruger: “setbacks should now be limited, with the May high just below $83,000.” Eight consecutive sessions of US spot bitcoin ETF inflows totalling $2.8bn, with August above $3bn, the strongest month of the year.",
        s: [["investingLive (full Jackson Hole agenda)","https://investinglive.com/central-banks/here-s-the-full-agenda-for-the-jackson-hole-fed-symposium/"],["Epoch Times (Warsh’s first keynote; CNBC survey)","https://www.theepochtimes.com/business/fed-chairman-kevin-warsh-set-to-deliver-1st-jackson-hole-keynote-speech-6080131"],["Yahoo Finance (Friday markets live)","https://finance.yahoo.com/markets/live/stock-market-today-friday-august-28-dow-sp-500-nasdaq-fed-warsh-jackson-hole-081514091.html"],["CoinDesk (crypto levels and Fed pricing)","https://www.coindesk.com/markets/2026/08/28/bitcoin-holds-usd80-000"]] }

      { t: "A pancreatic cancer drug was approved six months early at $39,800 a month, and the price is the interesting part. The FDA approved daraxonrasib, branded Rasonque, from Revolution Medicines — the first drug to attack a genetic cause of pancreatic cancer, targeting mutated RAS and KRAS, present in more than 90% of cases. In roughly 500 metastatic patients in the second-line setting, median overall survival was 13.2 months against 6.7 months on chemotherapy. Set against about 67,000 US cases a year, more than 52,000 deaths, and a five-year survival rate of 13%, that is a real advance in a disease where advances have been almost nonexistent — and the honest framing came from a clinician rather than the sponsor. Dr Andrew Coveler of the Fred Hutch Cancer Center: “this medicine is not a cure but a significant improvement.” STAT’s Morning Rounds separately quotes an oncologist calling it “the biggest development we’ve had in pancreas cancer in decades” — attributed there to Andrew Ko, which is a different physician at a different institution, so keep the two quotes apart. What a health economist will want on the board is the arithmetic: 6.5 months of median overall survival gain at $39,800 a month, in a population whose median survival on the drug is 13.2 months, implies a drug cost on the order of half a million dollars for the average course, against a gain measured in months. Whether that clears a cost-effectiveness threshold depends entirely on which threshold, and on whether end-of-life weighting applies — which is the argument, not a fact about the drug. In the same window, STAT relays Bloomberg reporting that the administration will announce drug-pricing deals with mid-sized biotechs on Monday: companies would give discounts on outpatient drugs to state Medicaid programmes, aligning state prices with international prices, with state participation optional; in exchange they get exemption from Medicare pilot programmes requiring similar discounts, and tariff relief in some negotiations. Companies are not named. Note the structure — a voluntary international reference price traded for an exemption from a mandatory one, which is a bargaining problem rather than a pricing policy. And the largest number of the week is Aon’s: employer health costs are projected to rise 9.5% in 2027, to more than $19,000 per employee, with employers absorbing more than 80% of plan cost. The trend line is the story — 3.7% in 2022, 8.8% in 2026, 9.5% in 2027. The 2026 employee average is $5,297, up 7.9%, split into payroll contributions of $3,130, up 6.4%, and out-of-pocket of $2,167, up 10.2%: the out-of-pocket line is rising fastest, which is where the cost-sharing shift shows up. Aon’s Mike Pasterick and Debbie Ashford are the named sources. Elsewhere: the DEA moved to ban 7-OH and three related kratom-derived substances, with the comment period on 7-OH extended to Sept 10 and the rules on the other three effective immediately; and STAT reports epidemiologist Yulin Hswen comparing Reddit menopause discussion against more than two million UCSF electronic health records, finding the symptoms most discussed online are underrepresented in the clinical record — a measurement problem with direct bearing on what gets researched and reimbursed.",
        s: [["NPR / AP (daraxonrasib approval)","https://www.npr.org/2026/08/27/g-s1-140410/fda-approves-landmark-pancreatic-cancer-drug"],["STAT (Pharmalittle: the biotech pricing deals)","https://www.statnews.com/pharmalot/2026/08/27/pancreatic-cancer-drug-approved-trump-deal-with-biotechs/"],["Healthcare Dive (Aon: costs up 9.5% in 2027)","https://www.healthcaredive.com/news/healthcare-costs-projected-to-rise-in-2027/828719/"],["STAT (Morning Rounds: kratom, measles, menopause)","https://www.statnews.com/2026/08/27/health-news-decoding-dea-action-on-kratom-related-substance/"]] },
      { t: "The vaccine docket added 148 comments in a day and still nobody can say whose; the measles page did not refresh; and the Ebola percentage this desk has been publishing is wrong. Start with the correction, because it is ours. This desk has been giving Ituri as 83.4% of the DRC national Ebola death toll. The ECDC province table, now readable, gives Ituri at 4,716 cases and 2,119 deaths against national totals of 5,656 and 2,715 — so Ituri is 78.0% of deaths, not 83.4%, and the cases and deaths columns both sum exactly to the national figures, which means the table is internally consistent and the 83.4% simply does not reconcile with it. Drop it. The full breakdown, new this run: North Kivu 735 and 501, Haut-Uele 184 and 85, Tshopo 15 and 8, South Kivu 3 and 1, Bas Uele 3 and 1, across 58 of 151 health zones in six provinces, with 792 hospitalised, 1,245 recovered and 80.9% of case contacts under follow-up; species Bundibugyo; national case fatality rate 48%. The figures themselves did not move — same numbers, same “as of 24 August” label, same Aug 26 update timestamp — so no rate should be computed from them and no trend claimed. Uganda’s outbreak was declared ended July 28 at twenty confirmed cases and two deaths. On the RFI, the Federal Register document page now reports 652 comments against 504 on Wednesday — 148 in roughly twenty-four hours, the largest single-day jump yet, with the window closing Sept 20. And the composition is still unobtainable, because regulations.gov is a JavaScript application, so a count is all anyone outside has. What did not change is the asymmetry, and a targeted search for medical-society, insurer or manufacturer mobilisation returned nothing: no AMA, AAP, AHIP, PhRMA, BIO or state call to action directed at this docket. The only organised RFI-specific mobilisation remains on the vaccine-sceptic side and it is growing, with call-to-action posts circulating across several Substacks and a MAHA Institute brief. That is what a 148-comment day most plausibly is, and it is why the count without the composition is close to uninformative. One small correction: the Federal Register renders the citation as 91 FR 54724, not 54725. On measles, a Friday run did not catch the refresh this desk expected. The CDC page still reads as of Aug 20 data with an Aug 21 stamp — 2,777 confirmed, 47 jurisdictions plus sixteen among international visitors, 36 outbreaks, 94% outbreak-associated — and the case, hospitalisation and death tables, the age strata and the vaccination strata are present in the page skeleton with no populated data cells, for a third consecutive run. That is a rendering failure, not a data absence, and it is now a standing feature rather than a glitch. Meanwhile Kennedy posted publicly downplaying measles severity after the two Pennsylvania deaths; Governor Josh Shapiro objected; Kennedy accused Shapiro of “gaslighting.” On Merck v. Kennedy there is no advance — no notice of appeal, no company statement, every result Aug 24 vintage, and the appeal window running to about Oct 23. And STAT’s Unraveled part two landed: Daniel Payne on hospitals racing to reverse nearly $1 trillion in Medicaid cuts before they take effect, with the argument that hospital lobbying power has decayed and the scepticism is now bipartisan. Senator Josh Hawley: “I’m hoping that I’ll be able to convince my colleagues… we should be funding rural hospitals directly.” Senator Tim Kaine: “exactly what we would do… we’re starting those conversations.” The sharpest line is from Max Seltzer, health policy director to Senator Roger Marshall — “the hospital side is impossible to ignore… I can go look at your 990 form,” citing a $6m chief executive compensation figure. James Jarvis of the Maine Medical Association: “unfortunately, I think it’s going to take a catastrophe.” Democrats have spent nearly $15m on advertising mentioning health care cuts this cycle. Adjacent, and a good seminar pairing: KFF finds the $50bn Rural Health Transformation Program has state annual reports due Aug 31 that states are not required to publish, with several denying records requests and Mississippi’s governor vetoing transparency legislation — $50bn in transfers set against more than $900bn in anticipated Medicaid reductions, with Cato’s Michael Cannon and the Bipartisan Policy Center’s Maya Sandalow both on record wanting it visible.",
        s: [["ECDC (DRC Ebola, province table)","https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda"],["Federal Register (vaccine RFI docket)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["STAT (Unraveled, part 2)","https://www.statnews.com/2026/08/27/hospitals-lobby-reverse-medicaid-cuts-part-2-unraveled-series/"],["KFF Health News ($50bn rural program transparency)","https://kffhealthnews.org/rural-health/rural-health-transformation-program-transparency-50-billion-dollars-state-tracking/"]] }
    ]},

      { t: "Michigan: the U-M grading proposal has no vote scheduled and no governing body attached to it, and the Faculty Senate has said nothing since May. That is the finding worth having, because the national coverage — Fox, the Chronicle, Forbes, the College Fix, and the Wall Street Journal running it as “Coddle U” — has been arguing about a policy that has not yet been put to anyone. Bridge’s status piece names no scheduled faculty vote and no approving body; the Record’s original announcement says only that the proposal “has generated support from department chairs and program directors across LSA academic divisions,” with town halls and engagement sessions planned for fall 2026 to “answer questions, address challenges and refine details,” and the pilot “tentatively scheduled” for fall 2027. The Faculty Senate’s own tag page has nothing since May 1. Tim McKay, LSA associate dean for undergraduate education, adds a formulation worth quoting because it states the intended mechanism rather than the sentiment: “we need to give them a space to get used to the reality that we’re going to be asking them to do very difficult things that might go beyond what they were used to,” and “we’re trying to say that we think the best summary of your experience on campus would not focus on your first semester.” About 5,000 LSA first-year students a year; first-to-second-year retention 97%. Separately, C. Cybele Raver’s appointment is not final either: the regents hold a special meeting Sept 1 at 11 a.m. for the formal vote, with a Dec 1 start. On Ypsilanti Township, DTE’s silence reaches eleven days — no statement, letter or filing of any kind on the township’s document page — and the electric moratorium now has a number, Resolution 2026-21, unanimously approved Aug 18. The Sept 9 town hall has full logistics: 5 to 7 p.m. at the Ann Arbor Marriott Ypsilanti at Eagle Crest, Roy Wilbanks Ballroom, registration required, livestream available. Nothing has been posted since Aug 19. The freshest data-centre reporting is next door rather than in the township: WEMU has Sarah Mills of the Ann Arbor Planning Commission and the U-M Center for EmPowering Communities explaining why Ann Arbor is a poor site — “among the reasons that data centers are horizontal, not just because it’s cheaper, but they have to have a lot of skin into the world to dissipate that heat” — with land availability the binding constraint, and advising rural communities to get developer agreements in writing. And the real DTE story of the day is a ballot question: the Michiganders for Money Out of Politics proposal would bar regulated electric and gas utilities, DTE and Consumers named, from making campaign contributions to candidates who regulate them, plus contractors spending over $250,000 a year. It cleared 560,000-plus signatures, the House adopted it 77–26 on Aug 25, and Senate Democrats say they will not vote, which sends it to voters. Representative Jim DeSana’s objection is the procedurally interesting one: “they did not collect the signatures to put the question up to the Legislature to adopt it and then be able to amend it with a 51% vote and render it unenforceable.” Neither utility commented. Two corrections this desk owes: the RenCen community-benefits process did not start Sept 1 — the first meeting was Aug 19, and Sept 1 is the second, whose business is electing two of nine Neighborhood Advisory Council seats, with meetings running Tuesdays through Oct 27; and the Quality Behavioral Health searches were Tuesday Aug 25, not simply “Tuesday.” No charges have been announced there, and the CEO’s attorney Arthur Weiss has now spoken: “his life has been turned upside down,” accounts frozen, patients being questioned by federal agents, and he calls suggestions of wrongdoing “pure speculation.” Two more with real numbers: Outlier and Michigan Public jointly document 388 cases of Michigan police reporting migrants to Border Patrol since 2021 across 43 agencies, accelerating after the second inauguration, with minor traffic stops becoming deportation cases; and Michigan has joined twenty-plus states suing over a USPS rule limiting mail-ballot transmission, with absentee ballots going out next month and roughly 2.2 million Michiganders, 39%, having voted by mail in 2024. No new Senate poll — the average holds at El-Sayed 45.7 to Rogers 45.0, and a “+7” Fox 2 result circulating is Susquehanna, fielded Aug 11–17, not new.",
        s: [["Bridge Michigan (U-M’s plan to hide letter grades)","https://bridgemi.com/talent-education/debate-rages-over-u-ms-plan-to-hide-letter-grades-heres-what-to-know/"],["Ypsilanti Township (data center documents)","https://ypsitownship.org/government/boards___commissions/board_of_trustees/data_center_information.php"],["Axios Detroit (utility political spending on the ballot)","https://www.axios.com/local/detroit/2026/08/27/utility-political-spending-ballot-proposal"],["Outlier Media (police stops trigger deportations)","https://outliermedia.org/newsletter/detroit-area-police-stops-trigger-deportations/"]] },
      { t: "The H-1B fee is $103,265, the docket already has 3,169 comments, and the sector’s silence turns out to be an association silence rather than an institutional one. Take the number first, because the round $100,000 everyone has been repeating is not the number. The Federal Register document — RIN 1615-AD20, DHS Docket USCIS-2026-0298, published Aug 25, comments closing Sept 24 — proposes “a $103,265 fee, payable at the time of filing, for all H-1B cap-subject petitions, including those eligible for the advanced degree exemption.” The page’s own counter reports 3,169 comments received. Three days, three thousand comments, and the composition again unobtainable. Now the correction this desk owes itself: the claim circulating that DHS’s own analysis found the fee would paralyse 76% of small businesses is not in the document. Its actual small-entity language is far weaker — that “some employers, including small entities, may file fewer petitions as a result of this proposed rule” — inside an Initial Regulatory Flexibility Analysis. Do not carry the 76%. What holds is that no ACE, AAU, NAFSA or Presidents’ Alliance filing on this docket exists; every association item that surfaces is from October 2025 and responds to the September 2025 proclamation, including ACE’s letter with twenty-nine other associations calling the fee “an extraordinary and unnecessary burden.” Second correction, and a sharper one. This desk has been reporting that the CPT reinterpretation produced no institutional response of any kind. That is wrong at the institutional level, and right only at the association level. The University of Washington’s international student services office announced on Aug 26 an immediate pause on authorising new optional CPT requests — students may still submit, but no authorisations will issue while it reviews the federal guidance — citing the SEVP standard that practical training be “required for all students” where “the degree or program cannot be completed without it.” Boston University’s ISSO reports an SEVP broadcast to designated school officials dated Aug 12 tightening the definition: “CPT must be essential to degree completion as it must be an integral part of an established curriculum and directly related to the student’s major,” with a new concurrent-registration-on-transcript requirement. A university suspending an entire authorisation category is a concrete action, and it happened while the associations said nothing. Third, the enrolment aggregate exists after all. NAFSA, with JB International, published a national projection on Aug 11: from 1,177,766 international students in 2024–25 and a projected 1,168,602 in 2025–26 down to a mid-projection of 1,104,912 for 2026–27, a loss of about 111,000 students, $3.4bn in direct revenue and nearly 40,000 jobs, roughly a 9% reduction. International applications to US doctoral programmes are down 21% and admissions 17%; Common App international submissions down 9%, with India down 14%, Nigeria 17% and Ghana 34%. It is a projection, not a census, and should be labelled as one — but “census dates are landing without aggregates” was the wrong framing. Institution-level figures now include Illinois with international applicants down more than 25%, UW-Madison with 2,100 international students in programmes exceeding four years and $600,000 in compliance costs, Cornell advising 3,500 students on extension requests annually, Grinnell’s $10m in international tuition and Penn’s $500,000 to $1m in system updates. On NAFSA v. DHS itself there is no movement: still three docket events, the government’s response due Aug 31 and the hearing Sept 3 at 11 a.m. in Courtroom 1. On accreditation, the truncated quote was ours — Nicholas Kent’s sentence runs “in a more dynamic market, accrediting agencies would be incentivized to differentiate themselves based on quality responsiveness and alignment with student outcomes and workforce needs,” though Inside Higher Ed’s rendering without a comma after “quality” looks like a dropped serial comma, so quote around it. Comments close Sept 21. One new item with teeth: the Department of Defense has told thirty universities to conduct an “immediate and comprehensive” audit of foreign institutional partnerships by the end of August, with federal research funding at risk. And for the classroom, one technique built and measured at exactly the scale that matters here. Ashley Harvey at Colorado State ran an upgraded Think-Pair-Share in classes of 90 to 175. Three changes: put the prompt on the slide alongside the content rather than after it, so thinking starts before you stop talking; run the pair on a hard visible one-minute timer with no extensions ever granted, announced as fixed on day one, because “these short, reliable segments help students feel safe and avoid too-lengthy, awkward small-talk”; and pay for the share with up to one bonus point per class for speaking, capped at three to five a semester, recorded by a TA the moment the student says their name. Seventy per cent of surveyed students wanted it kept and 63% reported comfort speaking — and about half participate, which Harvey treats as sufficient rather than as success. That honesty is why it is worth trying.",
        s: [["Federal Register (H-1B petition fee)","https://www.federalregister.gov/documents/2026/08/25/2026-17324/fee-for-certain-h-1b-petitions"],["Inside Higher Ed (international rule spurring disenrollments)","https://www.insidehighered.com/news/global/international-students-us/2026/08/24/international-student-rule-already-spurring"],["Inside Higher Ed (DOD demands 30 colleges audit partnerships)","https://www.insidehighered.com/news/quick-takes/2026/08/27/dod-demands-30-american-colleges-audit-foreign-partnerships"],["Faculty Focus (upgrading Think-Pair-Share)","https://www.facultyfocus.com/articles/effective-teaching-strategies/tired-of-awkward-silences-upgrade-your-think-pair-share/"]] },
      { t: "Mind & cosmos: the psychedelics drought broke on a mint plant, quantum ran a drug-docking experiment and said plainly that it proved nothing, and someone put a quantum-resistant lock on Bitcoin that the network refuses to accept. Start with the psychedelics, because the six-day silence this desk has been reporting is over. PsyPost carries a Journal of Ethnopharmacology paper on salvinorin A — the active compound in Salvia divinorum — relieving formalin-evoked trigeminal facial pain in mice, and the mechanism is the news rather than the effect. Blocking either the CB1 cannabinoid receptors or the TRPV1 vanilloid channels abolished the relief; the kappa-opioid route salvinorin A is famous for is not what is doing the work here. The purified compound needed about one-tenth the dose of the full extract for equivalent relief, with mild depressive and sedative effects — reduced activity and exploration — and no change in anxiety or motor coordination. Sample sizes and exact doses are not in the coverage. Keep this strictly separate from the Zurich systematic review this desk carried on Wednesday: same compound, same week, different papers, one a review of about 3,456 animals across ten studies, this one a primary animal study. Psychedelic Alpha also broke its own silence with an Aug 26 analysis of the Definium Phase 3 LSD readout — analysis of the Aug 12 data, not new data. On the quantum side the best item is the most self-effacing. A*STAR’s Bioinformatics Institute and Institute of Advanced Intelligence and Computing, with NUS and NTU, ran a molecular docking problem on IBM’s ibm_kingston Heron processor — six qubits for an eighteen-variable biotin–streptavidin problem, five for a fourteen-variable benzamidine–trypsin problem, with success rates around 74% and 99% of a thousand runs under the full-basis method. The hardware found the same molecular contacts as conventional calculation, and the authors state it “doesn’t establish a quantum advantage.” Their own limitations are the valuable part: the two examples were small enough that classical software solves them, they involved well-understood structures rather than unknown candidates, the graph model simplified the molecules, and real binding depends on factors the tests did not represent. It is a preprint, arXiv 2608.19868, not peer-reviewed. Compare a Florida Atlantic paper published the same day claiming a quantum support vector machine predicting heart disease at 90.26% accuracy and AUC 0.93 on 918 patients — with no qubit count, no classical baseline and no stated limitations anywhere in the coverage. Without a classical arm the quantum-enhancement claim is unsupported, and 90% on a cardiac dataset of that size is unremarkable for ordinary classical methods. Report it as a claim. The one with a real cost figure is StarkWare’s: Avihu Levy executed a quantum-resistant Bitcoin transaction on mainnet, mined by MARA via Slipstream, using signature grinding rather than any change to Bitcoin’s cryptography — “the Quantum-Safe Bitcoin method adds a second lock that a quantum computer has no shortcut for.” It costs hours of computing per transaction, ordinary nodes reject the non-standard format so it requires direct miner submission, and Levy himself prefers a protocol-level soft fork. A demonstrated result whose own author does not recommend it. Physical Review Letters rolled forward inside Volume 137 Issue 9 again with six papers dated Aug 27, all different from Wednesday’s, but only one is quant-ph — a sign-problem study of a U(1) quantum link model from Saha, Southampton and Wake Forest; the rest are cosmology and collider, including ATLAS and CMS reporting the same ZZγ channel independently on the same day. PRX Quantum carries the day instead, with a Jülich, Cologne and RWTH Aachen group publishing an analytical route to X-gate infidelity below ten to the minus five — 99.999% against a prior 99.99% — at seven nanoseconds for a full π-rotation. Read the title carefully: “on present superconducting hardware” describes the parameter regime, not an experiment. It is analytical and numerical. Do not report 99.999% as a measured gate. One item to handle with care: Sandia’s Aug 27 lab-news post on the 98-qubit Quantinuum Helios benchmark, with 99.9975% single-qubit and 99.921% two-qubit fidelity, is the June preprint clearing peer review at Nature, not a new capability — though Robin Blume-Kohout’s description of the failure modes is worth keeping, since quantum computers “can fail in dozens of subtle ways,” including “an out-of-tune laser giving bad instructions” or “a single atom jiggling out of place.” And Nautilus has the health-economics item: a review in Aging of metformin as an anti-aging drug, where the animal results are good, the first human trial protected against diabetes but not cancer, cardiovascular disease or mortality, and a second trial of 3,000 healthy older adults begun in 2017 has published nothing in nine years. The reviewers’ own limitation is confounding by indication — observational data make it “tough to figure out if metformin slows aging or just improves disease outcomes in certain groups.” A cheap generic being consumed off-label on evidence that fails precisely at the endpoints a payer would price. Elsewhere Quanta, Physics World, Essentia and the psychedelics roll are all verified negatives for the window; Tricycle has Bernhard Poerksen and Friedemann Schulz von Thun on death and the end of communication, and Buddhistdoor carries the Dalai Lama’s condolences after the Nepal and Tibet flash floods.",
        s: [["The Quantum Insider (IBM hardware, drug docking)","https://thequantuminsider.com/2026/08/27/researchers-use-ibm-quantum-computer-to-test-drug-docking-method/"],["The Quantum Insider (quantum-resistant Bitcoin transaction)","https://thequantuminsider.com/2026/08/27/starkware-researcher-demonstrates-quantum-resistant-bitcoin-transaction/"],["PsyPost (Salvia divinorum and facial pain)","https://www.psypost.org/a-hallucinogenic-mint-plant-relieves-facial-pain-in-mice/"],["Nautilus (fact-checking the metformin biohackers)","https://nautil.us/fact-checking-the-biohackers-who-claim-metformin-is-an-anti-aging-wonder-drug-1284568"]] },
      { t: "Director watch: the Lynch weekender is still selling tickets into a checkout that 404s, five days after announcing it was cancelled. This is the run’s cleanest finding and it sharpens the standing scoop rather than merely renewing it. The postponement banner on gatheringoftheangels.com is unchanged and now captured in full: “due to unforeseeable circumstances, a Gathering of the Angels 2026 has been postponed to 2027, all ticket holders have been emailed, please check your inboxes and junk mail for further information, we deeply apologise, but we will be back bigger and more damn fine than ever next year, our new dates will be announced soon.” The homepage is stripped to navigation, two contact forms and a Laura Palmer quote. But the site’s own tickets page carries no postponement notice at all: it still shows a prominent buy-tickets link, “limited tickets” availability flags, and the full ladder — £99.50 single day, £180 weekend general admission described as “saving £19,” £310 VIP weekend, plus a £3.50 booking fee — and the link’s TicketTailor destination is the page that returns 404. Four days after the operator announced the event was off, the operator’s own checkout is still soliciting sales. Welcometotwinpeaks.com’s event page, published May 6 and updated Aug 24, still carries “this event has been postponed. Ticket holders have been informed,” with the guest list cut to George Griffith and Sabrina Sutherland. And the count of outlets still running it as live has grown from four to six, with Shortlist and London the Inside joining Time Out, NME, Getyourcomicon and Twinpeaksblog. Still not one press pickup, five days on, four weeks before the original Sept 26–27 dates, and no 2027 dates announced. One decoy logged: a Fever listing is the 2024 edition at a different venue. On von Trier there is a new dated quote from Peter Aalbæk Jensen that reframes the whole project: “After has always been designed so that it can be made according to Lars’s physical condition. He has always used limitations creatively, and now it is his own physical limitation that he is incorporating into the creative process.” That is the most economical statement yet of why the film is photographs. The screenplay is still not confirmed finished, the 1.3m kroner from the Danish Film Institute remains the only money, and the festival line stands — “the film hasn’t been made, so there’s nothing that can be shown at a festival.” The Ekko date conflict is unresolved and this desk keeps flagging rather than picking; a new recirculator to reject is an Ekko piece on a shelved short-film project, which is December 2020. Noé is a plain negative for a seventh consecutive check. Refn still has no cast for Maniac Cop with a January 2027 Los Angeles shoot. Criterion’s December slate is still unannounced with nothing past Nov 24, and the October and November listings are now fully visible: Welcome II the Terrordome on Oct 6; Eclipse Series 5, the Samuel Fuller set, with Skolimowski’s The Shout on Oct 13; The Silence of the Lambs, Christiane F. and a Complete Kubrick box on Oct 20; del Toro’s Frankenstein on Oct 27; Harold and Maude with KPop Demon Hunters on Nov 3; then Blue Heron, Marie Antoinette and Shoot the Piano Player on Nov 10, Wild at Heart in 4K with Shadows of Forgotten Ancestors on Nov 17, and The Right Stuff on Nov 24. Venice, opening Wednesday, has added a pre-opening screening: Tinto Brass’s Deadly Sweet, from 1967, at the Sala Darsena on Sept 1, the day before Danny Boyle’s Ink opens the festival proper. No Lynch, von Trier, Noé or Refn, verified a fifth time. In the art world the Kusama obituary wave has produced answers to the questions this desk left open. A private funeral has already been held for close family, with a public memorial gathering planned and no date set; the Stedelijk Museum retrospective opening Sept 11 in Amsterdam will now serve as a posthumous tribute. Her foundation’s wording, which differs slightly from the version carried here, is that she “continued to paint until shortly before her passing, never setting aside her brush” and “remained steadfast in her lifelong belief that love can save the world.” David Zwirner: she was “without a doubt, the most famous living artist in the world.” Hidenori Ota of Ota Fine Arts, her longtime Japanese representative, has the better line: Kusama “turned all of these things that were regarded negatively into positive values.” Artnet adds a piece on her twelve novels, four poetry volumes and one short-story collection published between 1977 and 2002, none of the debut translated into English — and it resolves the confusion this desk noted: the racially insensitive language in two of those books drew controversy and she apologised in 2023, so the Hyperallergic apology piece is that story and not a conflict. One caution on the Smithsonian: this desk has been insisting the regents will discuss rather than vote on Monday, but Hyperallergic states flatly that the board “will meet next Monday, August 31, to vote,” against the Art Newspaper’s “discuss” and Artnet’s “a decision is expected.” That is a three-way source disagreement, not a settled fact — “a decision is expected” is still the safe formulation, but the desk should stop asserting that “vote” is wrong. Also new: the Chinese artist Gao Zhen has been sentenced to the maximum three years by a court in Hebei for “infringing upon the reputation and honour of heroes and martyrs,” over satirical Mao sculptures made and exhibited in 2009 — nine years before the law he was convicted under was enacted. Lisa Havilah has stood aside as chief executive of Powerhouse Parramatta pending investigations into governance and procurement, ten weeks before the museum opens. And in Vancouver, emergency responders forced entry to Access Gallery on Aug 14 after a passerby mistook Allysa Pierre’s sculpture Untitled (the preparator) for a collapsed person, about $722 in damage — an art-world story that is really a story about what a city trains its residents to see.",
        s: [["A Gathering of the Angels (postponement banner)","https://www.gatheringoftheangels.com/"],["World of Reel (von Trier’s screenplay)","https://www.worldofreel.com/blog/2026/8/9/lars-von-trier-almost-finished-screenplay-for-his-final-film"],["The Art Newspaper (Yayoi Kusama dies at 97)","https://www.theartnewspaper.com/2026/08/27/yayoi-kusama-polka-dots-mirror-rooms-has-died-aged-97"],["Hyperallergic (Smithsonian board and the Latino museum)","https://hyperallergic.com/amid-trumps-threats-a-potential-home-for-smithsonian-latino-museum/"]] }
    ]}
