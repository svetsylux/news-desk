  hooks: [
    { story: "Researchers at Georgetown’s Center on Health Insurance Reforms have put a price on the No Surprises Act’s arbitration channel, and it is $22.4 billion in excess costs over four years. Jack Hoadley and Kennah Watts decompose it: $15.6 billion in awards exceeding comparable in-network rates, $4.2 billion in the internal administrative costs of running disputes, and $2.7 billion in entry fees paid to enter the process at all. The volume figures explain the trajectory — dispute filings rose 77% from 2024 to 2025 and total payment amounts rose 264%. And the outcome figures explain the volume: providers won about 85% of cases in 2025, with median payouts more than four times the qualifying payment amount, the benchmark the statute uses as a proxy for the in-network rate. The authors’ own conclusion is that “the evidence presented here suggests that providers have a clear incentive to keep filing disputes and to ask for higher and higher amounts,” with no demonstrated ceiling on what can be requested. The law itself was the good-government solution to surprise billing — take the patient out of the middle, protect them from balance bills, and send the payer and the out-of-network provider to a neutral arbitrator. The patient protection worked. This is what happened to the part behind it.",
      src: ["Healthcare Dive / Georgetown CHIR","https://www.healthcaredive.com/news/no-surprises-idr-created-22-billion-costs-georgetown-surprise-billing/828817/"],
      concept: "Mechanism design under baseball arbitration, and what happens when the cost of filing is smaller than the expected award",
      q: "Start where the students already are, because almost all of them have heard of surprise medical bills and almost none of them know what replaced them. Sketch the original problem in two minutes: a patient goes to an in-network hospital, is treated by an out-of-network anesthesiologist she never chose, and receives a bill she could not have avoided by any decision available to her. Ask what makes that a market failure rather than merely an unpleasant surprise, and steer them to the answer that there is no transaction — she never agreed to a price, never had the option to shop, and in many cases was unconscious. That is the case for intervention, and it is a strong one. Now give them the fix and let them evaluate it before they see the data. Congress removed the patient from the transaction entirely and sent the insurer and the provider to independent dispute resolution: each side submits an offer, an arbitrator picks one of the two, and the loser pays the fee. Ask them what this design is called and what it is supposed to do. Final-offer arbitration — baseball arbitration — is supposed to make both parties converge, because an extreme offer loses. Have them derive that result: if the arbitrator picks whichever offer is closer to what she independently thinks is right, then moving your offer toward the center raises your probability of winning, and both sides shade inward until they nearly meet. That is the theory, it is elegant, and it is one of the genuinely beautiful results in mechanism design. Then hand them the numbers and ask what went wrong. Providers win 85% of the time and median awards are more than four times the qualifying payment amount. If final-offer arbitration were working, we would see roughly a coin flip and awards clustered near the benchmark. We see neither. Let them generate hypotheses before you supply any, because the wrong ones are instructive. Someone will say providers are simply right — that in-network rates understate the true value of the service. Take it seriously, then ask what evidence would distinguish that from the alternative, and note that we would then expect awards to be *consistently* above the benchmark rather than rising 264% in a single year. Someone will say the arbitrators are captured. Ask what mechanism would produce that, and note that arbitrators are selected from a certified list and paid by the parties, which is a real structural concern and also not obviously enough to move an 85% win rate. The sharper answer, and the one I would spend the rest of the session on, is that the convergence result depends on assumptions the statute did not deliver. Walk them through three. First, the arbitrator’s independent judgment must actually anchor somewhere the parties can predict. The statute told arbitrators to consider the qualifying payment amount but not to be bound by it, and then listed additional permissible factors — provider training, case complexity, market share, prior contracting history. Ask what happens to convergence when the target is a range rather than a point. It weakens, because an aggressive offer is no longer clearly extreme. Second, the cost of entering must be meaningful relative to the stakes. It is $2.7 billion in aggregate but a few hundred dollars per dispute, and the median award is four times the benchmark. Have them compute the expected value of filing at an 85% win rate: it is not close. Third — and this is the part students almost never think of — both parties must be playing the same game. A large physician staffing group can batch thousands of similar disputes and treat the process as a portfolio, learning from every outcome; an insurer defends each one. Ask them what asymmetric repeat play does to a mechanism designed for two symmetric one-shot bargainers. Then push on the incidence question, because it is the whole point and it is where the health-economics content lives. The patient is protected from the balance bill by statute. So ask: who pays the $22.4 billion? Trace it. Awards above in-network rates raise insurer costs; insurer costs enter next year’s premium; premiums are paid by employers and enrollees; employer contributions come out of wages. Make them say the last step out loud, because the intuition that employers absorb health costs is one of the most durable and most wrong beliefs students bring into a health-economics course. The protection was real and the cost did not disappear — it moved to a place where nobody receives a bill with their name on it, which is precisely why it generated no political resistance. Finally, ask them to fix it, subject to keeping the patient protection intact, and make them name what each fix gives up. Binding the arbitrator to the qualifying payment amount restores the anchor but hands rate-setting power to insurers, who compute the benchmark. Raising the filing fee suppresses frivolous disputes and also suppresses meritorious ones from small practices. Loser-pays with real teeth sharpens incentives and disadvantages the party with less capital, which is not always the one you expect. Publishing arbitrator decision histories improves prediction and invites forum-shopping. There is no option that is merely better; each trades one distortion for another. Students who leave able to say that — and able to say which distortion they would rather have, and why — are doing health policy rather than reciting it."},
    { story: "The only new wide release this weekend is Coyote vs. Acme, opening Friday from Ketchup Entertainment on a projected $10 to $15 million and about 10% of showtimes — booked, in other words, roughly as widely as the fourth-place holdover. What makes it worth a class is not the film but its ownership history. It is a completed feature that a major studio finished and then declined to release, taking a tax write-off against it rather than spending on prints and advertising, before eventually selling it on to a small independent distributor. By the time that decision was made, every dollar of production cost was already spent and unrecoverable. Boxoffice Pro’s forecast for the weekend of Aug 28 to 30 has Spider-Man: Brand New Day going for a fifth consecutive weekend at number one on $18 to $25 million, down from $39 million, holding 13% of showtimes in its fifth week; The Odyssey in week seven at $10 to $15 million on 5%; and Insidious: Out of the Further, which opened to $25.1 million on a C+ CinemaScore, forecast at $10 to $15 million in its second weekend. August 2026 is the best August on record domestically and only the third to cross $1 billion.",
      src: ["Boxoffice Pro","https://www.boxofficepro.com/weekend-preview-spider-man-webbing-up-the-box-office-again/"],
      concept: "Sunk costs, and the option value of a finished asset under two different owners",
      q: "Put the sequence on the board as a timeline with no commentary — film greenlit, film produced, film completed, film shelved for a write-off, film sold, film released — and ask them to identify the moment at which production cost stops being a decision variable. They will find it, and then almost all of them will immediately reason as though it still is. That is the useful part. The standard sunk-cost lesson is that past expenditure should not enter a forward-looking decision, and students can recite it. The version worth teaching is harder: not only should the studio ignore what it spent, the correct decision may well have been to shelve a good film, and that conclusion should feel wrong to them until they work out why it is right. Set up the studio’s problem properly. At the moment of choice it holds a finished asset and faces two branches. Shelve it: receive a certain, immediate, quantifiable tax benefit, and spend nothing further. Release it: spend a large and certain amount on prints and advertising — for a wide release this is frequently comparable to a substantial share of the production budget — in exchange for an uncertain box-office return, of which the studio keeps roughly half in the domestic theatrical window. Ask them to write down the comparison. What does not appear anywhere in it is the production cost, which is identical under both branches. Then ask what the studio must believe about the distribution of box-office outcomes for shelving to dominate, and make them notice that the required belief is not that the film is bad — it is that the expected net of the release branch, after marketing, falls short of a certain tax benefit. A perfectly decent film with no obvious marketing hook can fail that test. Now bring in the second owner, because this is where the example earns its keep. Ketchup Entertainment bought a completed film. Ask what it paid for and what it did not. It did not bear production risk, did not finance the shoot, did not carry development costs or years of overhead — it acquired a known quantity at a negotiated price, and its only forward problem is whether marketing spend clears expected revenue. Have them write down that firm’s decision problem and compare it line by line with the studio’s. The films are identical. The decisions are different, because the cost structures facing the two owners at the moment of decision are different. That is the whole lesson, and it generalises enormously: an asset’s value is not a property of the asset, it is a property of the asset in the hands of a particular owner facing particular alternatives. Ask them to name three other markets where the same logic operates and you will get distressed real estate, patent portfolios, and probably a used car. Then complicate it. Ask why, if the film has positive expected value in Ketchup’s hands, the studio did not simply capture that value by selling immediately rather than shelving first. Let them flounder, because the answers are real. A sale reveals information about the film’s quality, which affects the price. The tax treatment may require the asset not be exploited. A studio has a reputational stake in what carries its name that a small distributor does not. And there is a bargaining problem: the buyer knows the seller has already decided not to release, which is about as weak a negotiating position as exists. Have them think about what that does to the price, and notice that the studio’s own write-off decision destroyed part of the asset’s sale value. Then the forecast itself, which is a nice small exercise. Coyote vs. Acme is projected at $10 to $15 million on 10% of showtimes, while Spider-Man, in its fifth week, is projected at $18 to $25 million on 13%. Ask what exhibitors are optimising over. Screens are the scarce input, exhibitors allocate them on expected revenue per screen rather than on novelty, and a fifth-week tentpole is out-earning a brand-new release on a comparable share. Then ask them to compare the two decay curves in front of them: Insidious falls from $25.1 million to a projected $10 to $15 million in one week, roughly 40 to 60%, while Spider-Man is still doing $18 to $25 million in week five. A horror opening sells novelty and a C+ CinemaScore ends the word of mouth; a well-reviewed tentpole sells a decay curve. Ask which of those two revenue shapes you would rather own if you could only see the opening weekend, and what that implies about the information content of a CinemaScore. End on the counterfactual problem, which is the honest place to leave any of this. We will observe what Coyote vs. Acme grosses. We will never observe what it would have grossed with a major studio’s marketing behind it, and the studio will never observe what it gave up. Ask them what experiment would settle whether the shelving decision was correct, and let them arrive at the answer that none is available — which is why decisions of this kind are made on beliefs, and why a firm that has already written an asset off has every incentive never to revisit the question."},
    { story: "A paper published in Nature Medicine on Aug 26, reported by Elizabeth Cooney at STAT, uses a regulatory date as an instrument. When Shingrix was approved in October 2017 it replaced Zostavax as the recommended shingles vaccine in the United States more or less overnight. The authors compare matched cohorts of vaccinated people aged 60 and over who were vaccinated in the six months before that switchover against those vaccinated in the six months after — roughly 72,000 people in the TriNetX network of about sixty health systems. Because everyone in both arms chose to be vaccinated, the healthy-vaccinee bias that contaminates most vaccine-outcome comparisons is differenced out; what separates the two groups is which product the calendar assigned them. Over seven years the Shingrix cohort showed overall cardiovascular burden lower by 9%, coronary heart disease by 10%, heart failure by 12%, stroke by 12% in men and not significantly in women, and atrial fibrillation by 7% — amounting in absolute terms to about one percentage point fewer cardiovascular events. Maxime Taquet of Oxford: “if confirmed, Shingrix could prevent hundreds of thousands of cardiovascular events in the USA alone,” and on the mechanism, “this has to do with the adjuvant, because we haven’t seen any protection of Zostavax vaccines.” Two things the study does not have: it excludes public-insurance enrollees, in a population that is overwhelmingly Medicare-eligible, and the reported confidence intervals did not render in the coverage.",
      src: ["STAT News","https://www.statnews.com/2026/08/26/shingles-vaccine-shingrix-reduces-heart-disease-dementia-risk-oxford-study/"],
      concept: "Identification: what a switchover date buys you, what it does not, and the difference between relative and absolute effect",
      q: "Open with the naive comparison and let them destroy it themselves. Write on the board: vaccinated people have fewer heart attacks than unvaccinated people. Ask whether that tells us the vaccine prevents heart attacks. Somebody will say confounding, and you should make them be specific rather than accept the word. Who gets vaccinated? People who see a doctor regularly, who have insurance, who follow medical advice, who are well enough to get to a clinic. Every one of those predicts lower cardiovascular risk on its own. This has a name — healthy-vaccinee bias — and the reason it is worth naming is that it runs in a known direction, which means we can say in advance that the naive estimate is biased toward finding benefit. Have them state the sign of the bias before you go on. Now give them the design and ask what it fixes. Both arms are vaccinated. Both arms cleared the same behavioural hurdle: made an appointment, showed up, accepted an injection. Ask them what remains unbalanced between someone vaccinated in, say, June 2017 and someone vaccinated in June 2018, and let them work at it. The honest answer is that the design does not eliminate confounding, it eliminates the confounding that operates through the *decision to vaccinate*, which is the big one. What survives is anything that changed over that calendar window and also affects cardiovascular outcomes — prescribing patterns, statin guidelines, who was still unvaccinated by the second period and why, and the composition of the health systems reporting into the database. Ask them to name the one they would worry about most. I would push them toward the last-adopter problem: people who waited until after October 2017 to get a vaccine that had been available for years are not a random draw from the population that got it before. Then the estimate itself, because the relative-versus-absolute gap here is a gift. Nine percent lower cardiovascular burden. One percentage point fewer events over seven years. Ask them to reconcile those two numbers, and to work out the implied baseline. Then ask which number belongs in a press release, which belongs in a clinical guideline, and which belongs in a cost-effectiveness model. They are the same finding, and they support very different sentences. This is the single most common place where honest research becomes misleading reporting, and students who can move fluently between the two will catch it for the rest of their lives. Now the health-economics question proper, which is where I would spend the second half. Shingrix is substantially more expensive than Zostavax was, and it is adjuvanted, which is Taquet’s proposed mechanism. Ask them to set up the cost-effectiveness comparison and then notice what has just happened to it. Before this paper, the case for the more expensive vaccine rested on shingles prevention alone. If the cardiovascular effect is real, the denominator of the cost-per-QALY calculation acquires a second stream of averted events — and the vaccine may move from marginal to obviously worth funding without anything about the vaccine changing. Ask them what that tells us about cost-effectiveness thresholds as a decision tool. They are conditional on the current state of evidence, which means a coverage decision made in 2023 and a coverage decision made today can differ on identical products, and neither is wrong. Then connect it to the live policy question, because it is running right now. HHS has a request for information open until Sept 20 asking, among other things, what approaches should govern vaccine recommendations where randomised controlled trial evidence is limited or absent. This paper is exactly that case: nobody is going to run a randomised trial with a seven-year cardiovascular endpoint on a vaccine already recommended, because it would be neither affordable nor ethical. So ask the class what evidentiary standard they would write into a recommendation framework that admits this study and excludes the naive vaccinated-versus-unvaccinated comparison. Make them draft one sentence. They will find it is very hard, and that difficulty is the actual content of the policy debate — not a failure of their reasoning. Close on external validity, which is where I would leave them uneasy in a productive way. The database excludes public-insurance enrollees. The population of interest is people over sixty in the United States, the large majority of whom are on Medicare. Ask them to say precisely what the study estimates: an effect among over-sixties with commercial or self-pay coverage inside a particular network of health systems. Then ask whether they would expect the true effect in the Medicare population to be larger or smaller, and why. There is a real argument in both directions — higher baseline risk means more absolute benefit, while worse baseline health and competing mortality can attenuate a seven-year outcome — and the fact that a serious student can argue it either way is the point. Every result you will ever read is an estimate for the population that generated the data, and the extrapolation to the population you care about is an assumption someone has to defend."}

  pulse: [
    { cat: "Listening", t: "Monday’s chart closed the case: the collapse everyone saw on Sunday was a calendar",
      why: "kworb has advanced to chart date Aug 24, and it settles something this desk got half-right on Wednesday. Ella Langley’s “Choosin’ Texas” sat at 1,341,125 on Sunday Aug 23, which read as a 9.2% single-day collapse. On Monday it is at 1,347,736 — up about 6,600, position unchanged, and the entire top nine flat or improving. The Sunday number was a weekly seasonal, exactly as the whole-chart pattern suggested, and the Monday print proves it rather than merely implying it. Two things underneath are more interesting than the record chase. The Killers’ “Mr. Brightside,” released in 2004, sits at No. 8 with 749,957 streams, 2,185 days on the chart and 864,535,574 cumulative US Spotify streams — which is 92% of the daily volume of Olivia Rodrigo’s “the cure” at No. 6 with 815,282, a single released in May 2026 that debuted at No. 5 on the Hot 100 with a major label behind it. And “the cure” is the only Rodrigo track on the chart still gaining: on the weekly it is up 67,520 while the lead single “stupid song” is down 36,512, three months after release. As for the record, it still cannot break this week — the chart dated Aug 29 is week nineteen, the tie; week twenty resolves on the chart dated Sept 5, published Tuesday Sept 1.",
      rec: "The Sunday effect is the cheapest statistics lesson you will ever get from a pop chart, and students supply the data. Ask them to guess which day of the week has the lowest streaming volume before you show them, then show them the whole top fifteen falling together. One observation from a seasonal series is not a fact about the trend — which is the same error as reading one month of unadjusted employment data, and they will never forget the pop version.",
      src: ["kworb (Spotify US daily)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Watching", t: "The best August on record, and two revenue curves that look nothing alike",
      why: "August 2026 is the highest-grossing August ever domestically and only the third to cross $1 billion. The weekend ahead is where the shape of the thing shows. Spider-Man: Brand New Day is forecast at $18 to $25 million in its fifth weekend, down from $39 million, and would be the first film since Avatar: Fire and Ash to take five consecutive weekends at No. 1. Insidious: Out of the Further opened to $25.1 million on a C+ CinemaScore and is forecast at $10 to $15 million in weekend two — a fall of roughly 40 to 60% in a single week. Put them side by side and the two business models are visible in the numbers: a horror opening sells novelty, front-loads almost everything into the first three days, and a C+ audience score ends the word of mouth that would otherwise carry it; a well-reviewed tentpole sells a decay curve and keeps earning. The tell is in the screen allocation. Spider-Man holds 13% of showtimes in week five while Coyote vs. Acme, the only new wide release, gets 10%. Exhibitors are allocating a fixed number of screens on expected revenue per screen, not on recency, and they are betting against the new film.",
      rec: "Ask which of the two they would rather own if all you could see was opening weekend. Most will pick the bigger opening, and then you show them week five. The follow-up question is the good one: what does a CinemaScore actually measure, and why does a C+ predict a steeper fall than a bad review does?",
      src: ["Boxoffice Pro","https://www.boxofficepro.com/weekend-preview-spider-man-webbing-up-the-box-office-again/"] },
    { cat: "Playing", t: "The GTA VI reveal is this afternoon, and the thing being sold is six hours",
      why: "“Grand Theft Auto 6: An Extended Look” premieres today: Netflix at 3:00 p.m. Eastern, then free on Rockstar’s YouTube channel and the GTA6 site at 9:00 p.m., exactly six hours later. One honesty note — the widely repeated thirty-minute runtime and 4K60 spec are not confirmed by Rockstar, which has stated neither runtime nor format, so treat both as unverified even though every outlet is printing them. The complaint filling every comment section is that the trailer is “locked behind an $8.99 paywall,” and it is not: nothing is permanently withheld, and what Netflix bought was priority in time. What the discourse also misses is the ladder underneath. Netflix’s $8.99 tier is Standard with ads; the advertised picture quality that makes watching it there worthwhile at all is on Premium at $26.99, with Standard at $19.99 in between. So the free-in-six-hours version is not just competing with the paid one, it is a lever on a three-rung price menu. Take-Two’s Strauss Zelnick declined to disclose terms and said the rationale would be clearer once people had watched. The game itself is unchanged: Nov 19, $79.99 and $99.99, disc-free, Nov 12 preload.",
      rec: "Ask the room who is watching at 3 and who is waiting until 9, and make each group explain itself. Between them they will describe a demand curve for impatience without anyone using the phrase — and then you can ask the harder question of why anyone would pay for the top tier to watch a trailer.",
      src: ["Push Square","https://www.pushsquare.com/guides/gta-6-netflix-extended-look-when-and-how-to-watch"] },
    { cat: "Playing", t: "The other GTA leak is being suppressed by the fans, not the lawyers",
      why: "There are two separate breaches and the community is treating them completely differently. CyberLeek’s run — documented by Know Your Meme across four consecutive days, Aug 18 to 21, at six releases including gameplay videos, a full map image and a clip spelling “LEEK” with bullets — was spread as widely as possible, drew an xQc clip past 610,000 views and Twitter posts at 1.1 to 1.6 million, and came with a manifesto against all-digital releases and an associated meme coin promoted through a Seychelles-based exchange. Note that KYM’s entry stopped updating on Aug 21, so its count of six is frozen at day four and is not current. The second leak is an unrelated Xbox Graphics Capture file containing map height data, character models and a minimap texture, and the reporting on it says something unusual: the file is being deliberately gated by community members who intend to keep it that way, and a search turns up only AI mockups rather than any legitimate leaked image. Rockstar’s lawyers did not stop that. Norms did. And the vacuum where the real thing would be has filled with zero-marginal-cost fakes, which is the substitution nobody models. Meanwhile CyberLeek monetised not the leak but the attention around it.",
      rec: "This is the best available example of private-order enforcement — a group with no legal authority successfully restricting distribution of something it holds. Ask what makes the norm stick here and fail in almost every other leak, and let them notice that the gatekeepers are fans who want the game to be good.",
      src: ["TheGamer","https://www.thegamer.com/gta-6-more-leaks-xbox-graphics-capture-file-models-map-data/"] },
    { cat: "Online", t: "Five days versus eighteen months: the trending feed is measuring itself",
      why: "Kai Cenat mispronounced “lapis lazuli” as “la peace” on an Aug 16 Minecraft stream with IShowSpeed. The founding TikTok edit drew 4.2 million views in five days, one derivative took 4.4 million in a single day, and Know Your Meme created the entry on Aug 21 — five days from origin to documentation. Set that against Udin Din Din Din Dun, the Indonesian brainrot character logged here last week: first posts February 2025, surviving original March 2025, KYM entry August 2026. Eighteen months versus five days, same encyclopedia, same editors. The variable is not virality; it is whether the source culture is already inside the documenters’ field of view. The same page makes the point twice more. Trending right now, alongside two-day-old items, is a Tim Curry line from Command & Conquer: Red Alert 3, a game released in October 2008, whose canonical upload has 9.4 million views over nine years and whose KYM entry was created in February 2025. A trending list is collapsing three different clocks — when a thing was made, when it was catalogued, and when it resurfaced — into one ranked column with no way to tell them apart.",
      rec: "When a student references something you have not heard of, skip trying to place it and ask when it started. You will often find it is years old somewhere else, which turns being out of the loop into a real question about how things travel — and they usually do not know the answer either.",
      src: ["Know Your Meme","https://knowyourmeme.com/memes/la-peace"] },
    { cat: "Reading", t: "He sold the print rights and kept the two that make money",
      why: "Matt Dinniman serialised Dungeon Crawler Carl on Royal Road in 2019, self-published book one on Amazon in October 2020, and self-published through 2024. Then Ace Books, an imprint of Penguin Random House, acquired print rights in 2024 — and he kept the digital rights, still publishing the ebooks himself. The series has passed ten million copies across eight books, with book one alone at 2.7 million and nineteen consecutive weeks on the New York Times list. The number that reframes everything: audiobook sales, through Soundbooth Theater with narrator Jeff Hays, exceed physical and ebook sales combined, and most readers discover the series through Audible. So the largest of the three channels never touched a publisher at all, the second largest is self-serve, and the traditional house bought into the smallest. In this week’s cross-list roundup he holds two of nine multi-list slots, with Dungeon Crawler Carl on four of five lists but not the Times, and a 2024 backlist title debuting on three including the Times — same author, same series, different eligibility rules.",
      rec: "Ask a student who reads this series how they found it. The answer will be a friend, a TikTok, or an Audible recommendation, and none of those is a bookstore — which is the entire explanation for why the author could keep two-thirds of his rights and still be on the bestseller lists.",
      src: ["Book Riot","https://bookriot.com/bestselling-books-august-20-2026/"] }
  ],
  classnote: { t: "Gamescom sold out its exhibition floor for the first time in the show’s history this year — 1,600-plus exhibitors from 67 countries across 233,000 square metres, with 47 national pavilions and indie participation up 16% to more than 420 companies. Then on Wednesday the Future Games Show at gamescom ran 48 games with 13 world premieres in a single block. Put those two facts next to each other and ask a principles class what the binding constraint is, because it moved. When floor space sells out, square metres stop being the scarce input and audience attention becomes it — and attention, unlike floor space, cannot be expanded by renting another hall. Have them work out what 48 trailers in one showcase does to the expected wishlist yield of any one of them. Each additional entrant lowers the return to every other, and nobody entering internalises that, which is a congestion externality in a market with essentially free entry. Then ask why the indie count is up 16% anyway, and steer them to the standard answer: entry continues until expected rents are dissipated, and the rents here are denominated in attention rather than in price. That is why so many of those 48 titles carry no release date — they are waiting for a less crowded window, which is the only input they can still choose. Now hand them the counter-case, because it complicates the story usefully. Lesbian Space Princess is a 2025 Australian animated feature that holds 98% on Rotten Tomatoes and won the Teddy Award at Berlin, and was commercially invisible outside Australia for a year. Then Netflix’s recommendation engine began surfacing it, and it became one of the largest fandom events of the summer — a mockery target that mutated into the Great Fandom Truce of 2026, with one post drawing 5.4 million views in three days. Ask them what the marketing budget was. It was zero. Algorithmic distribution manufactured salience at no cost, which appears to solve exactly the problem the 48 indie developers have. Then ask the question that makes it a real seminar: is salience the same good as demand? It plainly is not here — the attention the film received was overwhelmingly hostile, and hostility does not convert. So the recommender did not solve the indie developer’s problem, it demonstrated that the thing they are competing for and the thing they need are different goods that happen to be measured with the same units. Push on who captures the value. The Great Fandom Truce generated enormous engagement across Hazbin Hotel, Five Nights at Freddy’s, Invincible and several anime communities. None of it accrues to the Australian directors, who made a film that is now widely known and still, as far as anyone can tell, commercially unrewarded. Ask where the value landed and let them find that it landed with the platforms hosting the conversation and with the anonymous accounts that made the edits. And finally, the measurement problem, which is where I would end. Know Your Meme’s trending list right now carries a Tim Curry line from a 2008 game, catalogued in 2025, trending in 2026, sitting next to items two days old. Three clocks, one column, no way to distinguish them. Ask them what a firm allocating a marketing budget off a trending feed is actually observing, and what it is not. The honest answer is that it is observing the documenting institution as much as the phenomenon — and any student who leaves able to ask that of a dataset has learned the most transferable thing in the course.",
    src: ["GamesRadar (Future Games Show at gamescom 2026)","https://www.gamesradar.com/games/events-conferences/everything-announced-at-the-future-games-show-at-gamescom-2026/"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
