<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "The Kremlin put peace talks on a “deep pause,” and the Ratcliffe story resolved into two Russian officials answering two different questions. Peskov, to reporters Friday: “As for peace talks, that topic is currently on a deep pause,” adding “we’re pressing forward with the special military operation and our troops are making gains on the frontlines,” “our forces know what they’re doing and how to do it,” and “the Ukrainian side knows our demands full well. They just don’t want to discuss them peacefully.” On the CIA visit, note carefully what each man denied. Peskov, via TASS, said of a meeting with the president: “There was no such meeting, no contacts with the president” — and that there are no plans for a Putin–Trump call. That is a denial about Putin, and it does not contradict SVR director Sergey Naryshkin’s own confirmation on Thursday that he met John Ratcliffe. Lavrov then gave the fullest Russian framing yet: “Like everyone else in the world, we have rules for how intelligence agencies interact with one another. There is nothing unusual about this,” and “nor is there anything unusual about the fact that they carry out their work in silence. Diplomacy also largely works in silence, but diplomats, by tradition and by the very nature of their profession, have to say something publicly.” On the substance he was flatly negative: “There have been no ultimatums on our part. There has been a question on our part” — the question being one Moscow says Washington has never answered, about American weapons and intelligence support for Ukrainian strikes. So the Russian account now aligns with the American president’s and against the four US newspapers reporting a substantive warning, and it has done so in two voices rather than one. Lavrov also closed the Vatican thread: Gallagher’s five-day visit overlapped Ratcliffe’s, and of the Vatican talks he said simply, “There were no secrets.” Putin met Lukashenko in Moscow on Saturday afternoon, the opening open to the press; Lukashenko had trailed it on Thursday as a discussion of “our common problem, which we are facing in southern Belarus and western Russia,” adding “whether you like it or not, we have already understood these intentions and have a clear picture of what is happening around us.” Ushakov, who has still not been heard in his own voice on the American channel, surfaced only as a scheduler: Putin goes to the SCO summit in Bishkek Aug 31–Sept 1 with nine bilaterals — Xi, Modi and Tokayev on the Monday, Pezeshkian and Erdogan on the Tuesday, the Erdogan agenda covering Ukraine and the Black Sea — then flies that evening to Vladivostok for the Eastern Economic Forum, with a plenary address Sept 3. Witkoff and Kushner make nine consecutive days with nothing verifiable.",

      { t: "ISW came back after two missing days, and its return brought the number nobody else had filed. No assessment exists for Aug 26 or Aug 27 — the Kyiv Post republication IDs are decisive, running 83113 for the Aug 25 assessment straight to 83304 for the Aug 28 one, with nothing between, and the gap was never backfilled. The Aug 28 assessment, published Saturday, opens with the line this desk would have wanted on Friday: “Russia launched 164 drones against Ukraine overnight.” It also reports that “Ukrainian forces struck a Russian strategic bomber at the Engels-2 Airbase in Saratov Oblast” and that “Ukrainian forces are conducting repeat strikes against Russian oil refineries to keep them offline” — the explicit statement of a strategy this desk has been describing from its effects. ISW’s framing of the wider picture: “Russian budgetary challenges resulting from its costly war effort, Ukraine’s long-range strike campaign, international sanctions, and economic mismanagement are manifesting in concrete operational problems.” It adds that Russia conducted an ICBM test launch, that Ukrainian forces made limited tactical advances toward Kostyantynivka, that Russia is presenting a Starlink-jamming electronic-warfare system as a breakthrough as part of a cognitive-warfare effort, and — the forward-looking item — that the Russian Ministry of Defence will likely expand its access to Russians’ personal and medical records ahead of rumoured involuntary reserve call-ups after the Sept 20 State Duma elections. On the ground overnight, two events with real detail. In the Bucha district village of Myla, a Russian strike caused what regional governor Tymur Tkachenko called “a massive fire” that spread to nearby homes: six injured, 165 evacuated, one house destroyed and seven damaged, and a residential facility for elderly people hit. Ukrainian prosecutors have opened a pre-trial investigation under Article 367 of the criminal code — official negligence, concerning the storage and permitting of explosive materials — and Serhii Koretsky, quoted by Kyiv Post in a rendering of his title this desk could not verify, called it “criminal negligence,” saying an earlier explosion at Vyshneve “had not become a lesson.” That is a Ukrainian institution opening a case against Ukrainian permitting in the middle of a Russian attack, and it is the more unusual half of the story. In the Izmail district of Odesa Oblast, one was killed and three injured, with five grain trucks destroyed and three damaged; Oleh Kiper, head of the Odesa regional military administration, said the strike hit “agricultural logistics.” No consolidated launched-versus-downed tally exists for the Aug 28–29 window from either side, and this desk prints that rather than filling it. Peskov, meanwhile, described the campaign in his own terms: “strikes on Kiev continue systematically and purposefully. We are destroying the military and near-military infrastructure of the Kiev regime.”",

      { t: "The ruble took back part of Friday’s record fall, the euro dropped back under a hundred, and Russian refining hit a twenty-year low. The Bank of Russia set USD/RUB at ₽85.6007 effective Aug 29, from ₽85.9541 — a recovery of about 0.41% after Friday’s 1.98% collapse, which was the largest single-day weakening in this series. EUR/RUB came back to ₽99.6820, below the hundred it crossed for the first time only a day earlier; CNY/RUB ₽12.7335. So the euro’s move through a hundred lasted exactly one fixing, and this desk notes that rather than treating either day as a trend. The refining numbers are the substantial news. Meduza, citing Bloomberg and EA Analytics, reports twenty-one attacks on Russian refineries in August — “больше, чем за любой другой месяц с начала войны,” more than in any other month since the war began — with four of the ten largest refineries among the targets, though Bloomberg does not name them. August throughput ran about 3.8 million barrels a day against a normal summer 5.3 to 5.5 million, which EA Analytics calls a minimum in more than twenty years; September is projected near 4.2 million. Against the same weeks of 2025, gasoline output is down about 20% and diesel more than 23%. Set that beside ISW’s statement that Ukraine is striking refineries “to keep them offline,” and the campaign and its measured effect are now sourced separately and agree. A second Russian datum worth keeping: households added ₽2.1 trillion, about $25.3bn, to cash holdings this year, with Sberbank forecasting ₽3.8 trillion for the year — the largest on record — and cash back to roughly 15% of M2 after a long decline. Sberbank CFO Taras Skvortsov ties it to grey-market retention; Fora-Bank deputy chairman Dmitry Orlov cites hedging against internet blackouts and “unsettling comments” about freezing deposits; economist Yegor Susin is the sceptic: “the recent trend of cash’s declining market share has reversed, but given normal seasonal fluctuations, nothing extreme is happening overall.” The key rate is 14.00%, next board meeting Sept 11. Two things land Monday. The digital ruble goes live under Federal Law 248-FZ, with retailers above ₽120m in prior-year revenue required to accept it, ₽30m from Sept 2027 and ₽20m from Sept 2028; Ozon, Wildberries, MTS, Magnit and Aeroflot have committed, and Sber estimates up to ₽4 trillion could move out of ordinary accounts. And the diesel export carve-out — the point at which refineries regain the right to export, inside a ban that otherwise runs to Jan 31, 2027 — still has no decision either way as of Saturday morning.",

      { t: "Bessent’s bank landed five days late — and the bank cut off from the dollar is Egyptian. SB0617 issued Friday under the title “Iran’s Access to UAE Banks Targeted Under Operation Economic Outcast,” and it is now the highest release number, confirmed independently against OFAC’s Recent Actions entry 20260828, “Iran-related and Counter Terrorism Designations,” citing SDGT, IFSR and E.O. 13902 authorities. Read what it actually does, because the gap between the promise and the instrument is the story. Designated: Reza Mohammad Taeedi, general manager of Bank Melli’s Dubai branch, an Iranian national, under E.O. 13224; and Kameng Trading Limited of Hong Kong under E.O. 13902, said to have laundered funds through the Pedram Pirouzan Exchange House. Bank Melli itself is named as the conduit — supporting the IRGC-Qods Force and MODAFL — but was not newly designated. What is being cut off from correspondent banking is Banque Misr’s UAE branches, and that is an Egyptian bank, reached through a FinCEN proposed rulemaking rather than a designation, on a finding that it processed about $1.8bn between January 2024 and June 2026 for 103 companies tied to Iranian shadow-banking networks. Treasury calls it “a critical node for the Iranian regime’s access to U.S. dollars.” Bessent: “Treasury promised to sever every economic lifeline Tehran has left and finally end the threat of the Iranian regime.” State Department spokesman Thomas Pigott: “we will target individuals and entities that engage in illicit financial practices on behalf of the Iranian regime.” Iran’s foreign ministry called the campaign “state terrorism” and urged other states not to enforce it. So the promise of an Iranian bank designation is satisfied by a proposed rule against an Egyptian one and a designation of one Iranian branch manager — worth saying plainly, in either direction. On Hormuz, the corridor still has not opened: Windward’s maritime intelligence centre states that “no announcement date has been set,” the Aug 25 Tehran meeting having produced only a phased framework, and no vessel has transited for a fourth day. Cyprus Mail adds that Iran and Oman have agreed how to share control of the strait and its revenues in principle, with amounts undisclosed. Two things to note in the record. The $2m-per-vessel toll and sixty-day framework that appeared in GlobalSecurity’s Day 181 log have vanished from its Day 182 update — which corroborates this desk’s refusal to publish them, since the figure was numerically identical to a rejected March piece and no other outlet carried it. And the traffic series still do not reconcile: Kpler via Reuters gives seven commodity vessels on Aug 27 against seventeen on Aug 26 and a ten-day average of fifteen; GlobalSecurity gives 121 crossings for the week of Aug 17–23, decomposed as 62 route-undetermined and 56 under the Iranian scheme — which sums to 118, not 121 — against a pre-war normal it puts at about 85 vessels a day; and Windward, a third series, counts eight vessels in the 24 hours to 21:00 UTC on Aug 26, two of them dark, against a pre-war benchmark of about 130 a day. Two of those three benchmarks cannot both be right, and the two logs are even a day apart in their own numbering. Publish all three and say so. Inside Iran the rial opened near 2,020,000 to the dollar against an official 1.5m, inflation is near 90% per the Statistical Center, and the pause in confirmed strikes reached a twenty-ninth night. The gasoline shortfall now has a figure: about 15 million litres a day, production near 120m against consumption near 135m, per Ali Akbar Shaghag Esfahani of the energy optimization organization, with Tehran transport costs up from 1 million rials to 3.2 million and an open dispute between Pezeshkian’s government and the IRGC over drawing down strategic reserves. On Gaza the four-day silence broke, and it broke with numbers: Nikolay Mladenov, High Representative for the Board of Peace, warned that the situation “threatens a collapse of the ceasefire in Gaza,” that there is “no better alternative to the current plan,” and that a “return to war would be devastating” — with 1,303 Palestinians killed and 4,336 wounded since the October 2025 ceasefire, 73,438 killed and 174,447 wounded cumulatively since October 2023, $7bn in reconstruction pledges received, and an International Stabilization Force forming with Morocco in and Turkey excluded after an Israeli veto. Five more were killed in Gaza on Friday, three of them from the Abdeen family, and three in Jenin. Lebanon’s cumulative toll did not move from 4,350 killed and 12,310 wounded, and Al Jazeera published nothing on Lebanon at all. From the benches, Glenn Diesen returns after a week: “NATO and Russia are now in the most dangerous period ever in their history of conflict,” and “diplomacy still takes the form of more ultimatums and threats in the hope of rescuing the situation.” Mearsheimer and Sachs are both verified negatives.",

    { h: "Economy & markets", items: [
      { t: "Warsh gave his first Jackson Hole keynote, said the Fed has “work to do,” and the market roughly doubled the odds of a September rate rise. The speech is called “In Our Time,” and the sentence that repriced the curve is this one: “we must be confident that underlying inflation is moving to our objective, clearly and at sufficient speed. Otherwise, we have work to do.” He put the numbers on the board himself — PCE inflation at 3.7% over twelve months and 4.1% over six — and said “inflation is running above our 2 percent target. So the Fed’s predominant focus right now should be on prices.” He also took the institution’s share of the blame in unusually direct terms: “the responsibility for 65 months of sustained, elevated inflation sits squarely with the central bank.” He never used the word hike, and he was explicit about why: “I stand here today committed to a discipline, not to a decision,” noting that “a good majority of my colleagues and I thought the wiser course was to await new information in the intermeeting period.” The second half is the institutional news and will outlast the rate move. Warsh wants to end forward guidance as standing practice: “forward guidance as a regular practice was adopted by my colleagues and me during the Global Financial Crisis. It was essential at the time, and I believe that the practice has overstayed its welcome.” And: “oversharing policy deliberations and overcommitting to future decisions can lead markets, businesses, and households astray”; “in normal times, the role of forward guidance should be limited and circumscribed”; “a quieter Fed, more purposeful in its communications, is better able to meet its objectives.” He added a line that will be quoted for a while — “money matters. It’s not fashionable these days, but my view is that money has something important to do with monetary policy” — and was warm on activity: “labor markets are quite stable… people who want to work, by and large, are holding or finding jobs,” and “the potential for substantially higher growth is on the rise.” Two cautions this desk will flag rather than smooth over. First, in the first Jackson Hole in the symposium’s history to take payments as its theme, the Chair’s keynote does not discuss payments, stablecoins, central bank digital currency, tokenization, crypto or banking regulation at all — verified across two passes of the Fed’s own text — beyond a single sentence saying that innovation in the conduct of policy will help deliver price stability. Second, and relatedly, Warsh does talk about “tokens,” but he means AI compute: “users buy tokens to gain access to the models. Reports put annualized token sales for the two leading labs alone at more than $100 billion — an increase of 500-plus percent from a year ago,” and “we don’t yet know the equilibrium price of the tokens.” Anyone filing that under the tokenization panel has misread it. The pricing moved hard and in one direction. September hike odds went from roughly 34 to 36% before the speech to about 56 to 59% by the close depending on the venue, with Polymarket as high as 69%; at least one hike this year went to 89% from 75%, and two hikes by March 2027 is priced at 100%. Note against yesterday’s file that December pricing appears to have loosened even as September tightened — CME FedWatch now reads about 80% for December, against the “fully priced” framing this desk carried. Mohamed El-Erian called 60% odds “too high,” citing stable inflation expectations and productivity gains. David Russell of TradeStation: “his acknowledgment that current inflation is too high slightly boosts odds of a September hike.” The rest of the Friday programme is on the record and worth Sveta’s time: Eswar Prasad with Gordon Liao and Tony Zhang argued that stablecoins and tokenized money may strengthen rather than erode dollar dominance — “rather than dissipating network effects by leveling the playing field… digitalization could intensify them,” and “issuance begets issuance” — at the cost of greater exposure to US policy spillovers. Isabel Schnabel, discussing Duffie’s “Tokenized Finance and the Perimeter of Central Banking,” gave the sharpest formulation of the day: “stablecoins are best understood as complements to central bank money, not substitutes for it,” because “a stablecoin issuer has no independent capacity to meet the second criterion: the ability to expand liquidity elastically.” Saturday’s session — Parlour with Goldstein, Brunnermeier with Rajan, and the Du, Krishnamurthy and Fernández-Villaverde panel — has not happened yet as this is written.",

      { t: "The market took the hawkish read and sold, gold got slapped, and the day’s worst datapoint was not the speech. Friday’s closes, from the AP tally, all four reconciling to the cent against Thursday: S&P 500 7,711.76 (−19.23, −0.2%), Nasdaq Composite 26,402.42 (−138.93, −0.5%), Dow 53,559.99 (−9.45), Russell 2000 2,972.37 (−41.97, −1.4%). One caution on the wire’s own arithmetic: AP printed the Dow at “−0.1%,” but −9.45 on 53,569.44 is −0.02%, so publish the points or call it flat. On the week: S&P +0.5%, Dow +0.5%, Nasdaq Composite +0.8%, Russell −1.5% — small caps were the tell, and they were the tell in the right direction for a hike scare. The bond move was front-end and severe: the two-year closed near 4.35 to 4.38%, its highest since January 2025 and up about twelve basis points; the ten-year at 4.72 to 4.73%, up five; the thirty-year 5.21%, up two. That is a sharp flattening, which is what a market repricing a near-term tightening rather than a growth surprise looks like. DXY 99.677, up 0.52%, a one-week high and back above its 200-day moving average — and note the same page shows −1.20% on the month against +1.95% on the year, so name the window or drop the change. Gold fell: spot $4,563.05, down 0.8%, at a 16:36 GMT read, with December Comex at $4,615.10 and a session low of $4,528.94 against Tuesday’s three-month high of $4,696.18. Independent trader Tai Wong put it exactly: “gold is getting slapped hard as Chair Warsh affirms that inflation isn’t meaningfully slowing and the Fed has ‘work to do.’” Silver went the other way, $69.48, up 0.3% — which incidentally puts it below the $70.79 that had been sitting on top of a known-stale March headline, so that trap is now dead. Palladium was the mover, up 7% to $1,444.75. Bitcoin fell through the speech from about $81,000 overnight to $78,400 during it and about $77,000 to $77,900 at the close, down roughly 3%, with $6.4bn of options expiring on Deribit that morning and crypto equities down 5 to 8% across Strategy, Coinbase, Galaxy, Circle and Hut 8. WTI for October settled $83.11, down 0.5%; this desk could not verify a Brent close and prefers to say so. The VIX did not resolve cleanly either — reads of 14.4 and 14.43 circulated alongside an internally inconsistent live-blog print of 14.74 — so treat it as roughly flat near 14.4 and skip the day-change. The single-stock story is PayPal, down 12.71% to $53.66 on volume 124% above its three-month average, after Advent International and Stripe abandoned a roughly $50bn takeover approach and the deal premium came out. Nvidia gave back 4.61% of Thursday’s 8.74%; Marvell fell 10.28%, a much bigger move than the 3.1% after-hours dip, so Thursday’s guide-driven optimism did not survive the session. Elastic rose 17%, Gap 13%, Workday 5.8%, Amazon 4%. The semiconductor index fell 3.5%. And the data was worse than the speech. The Chicago Business Barometer printed 47.1 for August against 57.6 in July and a 57.9 consensus — a 10.5-point collapse into contraction, with prices-paid reported accelerating. University of Michigan final consumer sentiment came in at 51.7 from 55.2, with year-ahead inflation expectations at 4.0% and the five-to-ten-year at 3.3%, and only 8% of consumers expecting income to outpace inflation, down from 18% in December 2024. A contracting regional survey with rising prices paid, alongside a 3.7% headline PCE, is the stagflationary combination that makes Warsh’s job hard, and it went almost unremarked on a day the room was watching the podium. One item this desk will not report a direction on: the BLS released its preliminary March 2026 payroll benchmark revision at 10 a.m. Friday, and two same-day sources contradict each other outright — one gives −79,000 for the twelve months to March with the private sector at −178,000, another says the revision was upward and the first since 2022 while supplying no figure at all. The BLS page carries the schedule but not the number. That is a coin-flip dressed as reporting, so the release is noted and the direction is not.",
        s: [["AP via Epoch Times (Aug 28 index tally)","https://www.theepochtimes.com/bright/how-major-us-stock-indexes-fared-aug-28-post-6080950"],["Kitco / Reuters (metals, yields and Fed pricing)","https://www.kitco.com/news/off-the-wire/2026-08-28/gold-heads-weekly-loss-warsh-signals-fed-has-work-do"],["BLS (CES preliminary benchmark release schedule)","https://www.bls.gov/ces/"]] }
    ]},

      { t: "Three physician societies attacked the $22bn No Surprises estimate this desk carried, the author re-ran it on their own assumptions, and it barely moved. This is the best health-economics item of the week and it is a live methodological fight, so take it slowly. The American Society of Anesthesiologists, the American College of Emergency Physicians and the American College of Radiology issued a joint rebuttal to Jack Hoadley and colleagues at Georgetown’s Center on Health Insurance Reforms, and their entire objection is about one benchmark: “the report’s cost claim is built on a deeply flawed premise: that the insurer-calculated Qualifying Payment Amount (QPA) is accurate and represents an appropriate in-network payment rate. The evidence is overwhelmingly clear that QPAs are often inaccurate and unreasonably low.” The claim under attack is $22bn in unnecessary spending over four years from independent dispute resolution, of which about $16bn is attributed to arbitration awards exceeding comparable in-network rates, against roughly $5bn in IDR volume in the programme’s first two years. Hoadley then did the thing that makes this teachable: he ran the sensitivity analysis the critics implied. Recalculating at 150% of QPA cuts the estimate by $1.1bn; at 200% of QPA, by $2.3bn. The $22bn survives its critics’ own preferred assumptions with roughly $20bn intact — and the societies offered no alternative estimate of their own. The structural point is worth stating for the classroom: the QPA is the median contracted rate as computed by insurers, it anchors arbitration, and providers win about 85% of arbitrations. One side of the bargain computes the outside option; the other side wins the disputes. Both have an interest in the benchmark and neither is a neutral party to it. Second item, and it is a clean targeting failure. Ishani Ganguli of Harvard Medical School and Brigham and Women’s, writing in STAT on new JAMA-published work, reports that Medicare’s G2211 add-on code — $16 a visit for “comprehensive or ongoing, relationship-based care,” created to shore up primary care — was billed 26 million times in its first year by one in four of all physicians billing Medicare. The distribution: 43% of billings by specialists, 40% by primary care physicians, the rest by nurse practitioners and physician assistants. Patients pay about $3 out of pocket per use. Ganguli, who both studies and bills the code — “as a health services researcher and physician who has both studied and billed G2211, I’m intrigued by this code” — notes the largest single share went to specialists billing for conditions like acid reflux and glaucoma. A subsidy defined by an attribute the payer cannot observe, self-attested, went mostly to the people it was not for. Third, and the one to bring up when someone says AI will lower health costs: Doximity surveyed roughly 23,000 US physicians and found more than 65% using AI daily or weekly, 48% saying physicians should be the primary beneficiaries of the resulting productivity gains, 43% saying compensation should stay unchanged even as AI cuts time per task, 20% favouring sharing the benefit — and 17% supporting passing savings to patients as lower costs. Twenty per cent already report higher productivity expectations because of AI and 42% expect them; 39% say AI proficiency is now a hiring factor. Average physician pay rose 2% last year, down from 3.7% in 2024. Also Friday: a federal appeals court upheld the FDA’s determination that the GLP-1 shortages have ended for Ozempic, Wegovy, Mounjaro and Zepbound, so compounders may no longer legally mass-produce versions — a shortage declaration functioning as an on-off switch for a whole competitive fringe. And AstraZeneca and Ionis reported a Phase 3 failure in ATTR-CM, with no benefit in patients already taking a stabilizer, which reads through to Alnylam and BridgeBio.",
        s: [["Healthcare Dive (societies challenge the $22bn IDR estimate)","https://www.healthcaredive.com/news/providers-refute-22B-idr-no-surprises-costs-georgetown/829042/"],["STAT (Ganguli on G2211’s first year)","https://www.statnews.com/2026/08/28/medicare-g2211-code-billing-research-primary-care/"],["Healthcare Dive (Doximity: who should capture AI’s gains)","https://www.healthcaredive.com/news/physicians-say-they-should-benefit-financially-from-ais-time-savings-doximity/829046/"],["STAT (AstraZeneca/Ionis ATTR-CM failure)","https://www.statnews.com/2026/08/28/astrazeneca-ionis-wainua-eplontersen-attr-cm-study-failure-bridgebio-alnylam/"]] },
      { t: "The vaccine comment surge decayed, its driver has been found, and the measles question this desk has been asking for three runs now has an answer: no, the page does not post on Saturday. Take the docket first. The HHS vaccine RFI stands at 720 comments, against 652 on Friday, 504 on Wednesday and 256 on Tuesday — so the run is +248, then +148, then +68, and the single-day jump has more than halved two days running. That is the shape of a pulse, not a new plateau, and the pulse now has a plausible source: Children’s Health Defense published an explicit mobilisation piece on Aug 25 — “Deadline Sept. 20: HHS Seeks Public Comments on Vaccine Recommendations,” by Suzanne Burdick — which records 256 comments as of publication, supplies the docket number, both submission routes and the deadline, and coaches commenters that they “need not answer all 18 HHS questions” and that “concrete examples are encouraged.” CHD senior research scientist Karl Jablonowski frames the RFI as threatening the status quo by welcoming suppressed perspectives; Dr Shira Miller: “we encourage parents, physicians, scientists, and those affected by vaccine mandates to share their experiences and concerns with HHS.” Against that, a targeted search for AMA, AAP, AHIP, PhRMA, BIO or state-level mobilisation on this docket again returned nothing — no comment campaigns, no member alerts, no press releases. The professional side is publishing commentary, including a CIDRAP piece on shared decision-making, but it is not generating volume. The asymmetry holds, and it remains the story rather than the count, since the composition of 720 comments is unobtainable while regulations.gov renders only in JavaScript. On measles, this desk has now tested Friday and Saturday and the CDC page did not refresh on either: it still reads as-of Aug 20 data with an Aug 21 stamp — 2,777 confirmed, 47 jurisdictions plus sixteen among international visitors, 36 outbreaks, 2,614 of 2,777 outbreak-associated at 94%. Monday is the next realistic capture, and the assumption that it posts Thursday afternoon should be treated as retired. The age, vaccination-status and hospitalisation tables failed to populate for a fourth consecutive run — skeleton present, data cells empty — so that is an extraction failure and not an absence, and Utah 518 and the 7% hospitalisation rate stay unconfirmed. On Ebola the ECDC figures did move, and both the data label and the page timestamp advanced, so these are genuinely new: DRC confirmed cases 5,794 from 5,656, deaths 2,786 from 2,715, hospitalised 843 from 792, contacts under follow-up 82.3% from 80.9%, data as of Aug 26 with an Aug 28 timestamp. That is 138 new cases and 71 new deaths — a case fatality rate of 51.4% among the newly reported, against a national 48.1% — across 60 of 151 health zones in six provinces, species Bundibugyo. WHO formally confirmed the end of Uganda’s outbreak on Aug 26 after 42 days without a case, final toll twenty confirmed and two deaths. One caveat: the province table did not render this run, so the Ituri share cannot be updated and the corrected 78.0% should not be restated as current. Two more. The Trump administration’s drug-pricing deals with mid-sized biotechs, still expected Monday, now have a named benchmark basket — Canada, Denmark, France, Germany, Italy, Japan, Switzerland and the UK, benchmarked to net prices — with the administration projecting $64.3bn in government savings over ten years or $529bn including commercial spillover. Signatories remain unnamed, but the opposition now has a name: ten firms including Alkermes, Alnylam, BioMarin, Incyte, Madrigal and Travere have formed a Midsized Biotech Alliance to oppose most-favoured-nation pricing. And KFF has the price story of the day: a single US IVF cycle runs upward of $29,000 for an insured patient and more than $54,000 for a full package, against $3,000 to $4,000 for a basic cycle in Greece and about $12,000 for an Athens clinic’s full inclusive package — with Americans choosing European clinics up more than 37% in 2025, infertility affecting about 7 million Americans, only 24% of treatment needs met, and IVF medication costs up 90% since 2014. Separately, Stephanie Armour’s KFF piece measures three voluntary industry commitments and finds all three underperforming: on food dyes, only 7 of 27 companies met their pledged goals and the FDA quietly moved the deadline from end-2025 to end-2027; on prior authorization, insurers who pledged in June 2025 to cut it for 80% of diseases by January 2026 had reduced it by about 11% as of July 2026, and the promised public dashboards never appeared; on drug pricing, seventeen companies agreed to TrumpRx reductions that apply only to new drugs and existing Medicaid drugs, excluding the 200-million-plus Americans with commercial insurance.",
        s: [["Federal Register (vaccine RFI docket, 720 comments)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["ECDC (DRC Ebola, data as of Aug 26)","https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda"],["KFF Health News (IVF costs push Americans abroad)","https://kffhealthnews.org/health-care-costs/ivf-tourism-fertility-in-vitro-fertilization-high-costs-pregnancy-parenthood-greece/"],["KFF Health News (the voluntary deals, measured)","https://kffhealthnews.org/health-industry/trump-kennedy-food-dyes-price-deals-unenforced-vanishing/"]] }
    ]},
    { h: "Campus & culture", items: [
      { t: "Michigan: a DTE-funded group lost in Washtenaw County court on the same day DTE’s silence in Ypsilanti Township reached twelve days. Judge Patrick J. Conlin dismissed the complaint brought by the Ann Arbor Responsible Energy Coalition — a DTE Energy-funded group — against city clerk Jacqueline Beaudry, holding that her acceptance of petition signatures in batches complied with Michigan’s Home Rule City Act and that the measure lawfully addresses a single subject. The measure would amend the city charter to establish a municipal electric utility, with board elections in 2028; DTE would keep supplying service until a separate referendum approved acquiring the infrastructure. Coalition spokesman Rudy Harper framed the objection in cost terms: “the stakes — a proposed city takeover of the electric grid carrying an estimated $1 billion in new debt — demand a petition process that meets the letter of the law.” City attorney Atleen Kaur and Ann Arbor for Public Power executive director Brian Geiringer are the other named parties, and the coalition has appealed. Read alongside the utility campaign-finance ballot question already heading to voters, the pattern is a utility contesting the procedural gateway to two separate ballot measures rather than their substance — which is where these fights are usually decided. Meanwhile in Ypsilanti Township, DTE has now said nothing for twelve days: the township’s document page carries nothing newer than Aug 19, and DTE appears on it only inside the moratorium resolution, described as operating “a DTE substation and yard, located just 500 feet across from a low- to moderate-income housing community.” The correspondence trail is a Dingell letter of Aug 12 and a Grasso response of Aug 13, and note that the page also carries an older Resolution 2025-23 on siting, distinct from the Aug 18 electric moratorium, Resolution 2026-21. The Sept 9 town hall is 5 to 7 p.m. at the Ann Arbor Marriott Ypsilanti at Eagle Crest, Roy Wilbanks Ballroom, registration required, livestream available — and one correction to this desk’s file, the host is U-M Government Relations rather than the township, with registration through govrel.umich.edu. Elsewhere: the Ann Arbor school board amended its transgender and gender nonconforming student policy after the US Department of Education alleged it violated the law by “hiding gender identity information from parents,” an allegation the district denies. District attorney Richard Landau put the stake plainly: “failing to meet this deadline puts an estimated $15 million in annual federal funding… at immediate risk and exposes us to potential Department of Justice civil litigation,” money covering special education, Title I and USDA lunch programmes. Trustee Rima Mohammad cast the only opposing vote, citing the singling out of already-targeted students; the district’s attorney says the amendment only clarifies language and keeps protections in place. And Americans for Citizen Voting Michigan sued in the state Supreme Court on Friday after the Board of State Canvassers deadlocked two-to-two, along party lines, over accepting notarized affidavits submitted after the meeting began — a deadlock that kept a voter-ID and proof-of-citizenship question off the ballot despite more than 700,000 signatures, with a staff review of a 1,000-signature sample leaving the campaign slightly short. Campaign chair Paul Jacob: “more than 700,000 Michiganders signed this petition. We have the signatures required to qualify, and we are asking the Michigan Supreme Court to ensure those voters are not silenced because the Board of State Canvassers failed to do its job.” They have asked for a decision by Sept 1. Three standing threads produced verified negatives: no charges or new filings in the FBI investigation of Quality Behavioral Health, where the newest coverage is still Aug 27; no advance on the RenCen community-benefits process before Tuesday’s second meeting and its election of two of nine Neighborhood Advisory Council seats; and no new Senate field work — the average holds at El-Sayed 45.7 to Rogers 45.0, and both results now circulating are mid-August, the “+7” being Susquehanna from Aug 11–17 and the AARP Michigan poll being Fabrizio Ward and Impact Research from Aug 9–11, which has El-Sayed 51 to Rogers 50 among likely voters but Rogers 52 to 43 among voters over 50 and Rogers +33 among older swing voters. The LSA grade-hiding proposal still has no scheduled vote and no approving body, and the Faculty Senate has still said nothing since May 1.",
        s: [["Michigan Public (DTE-funded group’s complaint dismissed)","https://www.michiganpublic.org/transportation-infrastructure/2026-08-28/washtenaw-judge-tosses-complaint-against-ann-arbor-clerk-over-public-power-petition-signatures"],["WEMU (AAPS amends its transgender student policy)","https://www.wemu.org/wemu-news/2026-08-28/aaps-changes-transgender-student-policy-under-pressure-from-u-s-department-of-education"],["Michigan Public (voter-ID campaign sues over the ballot)","https://www.michiganpublic.org/politics-government/2026-08-28/campaign-sues-over-michigan-board-keeping-voter-id-citizenship-proof-question-off-ballot"],["Ypsilanti Township (data center documents)","https://ypsitownship.org/government/boards___commissions/board_of_trustees/data_center_information.php"]] },
      { t: "The CPT story is bigger than this desk reported and it started two weeks earlier — and there are two federal broadcasts, not one. This is a correction worth making in full, because the shape changes. This desk reported the University of Washington’s Aug 26 pause on authorising new optional CPT requests as the first institutional response. It was the fourth. UC Berkeley suspended course-credit CPT applications effective Aug 12 to 14, two weeks earlier, with Berkeley International Office director Ivor Emmanuel writing: “please know that we do not take this decision lightly as we know the importance that course credit CPT plays in your academic journey.” UC Irvine suspended some applications on Aug 17 and now processes only authorisations necessary for degree completion, reviewing the programme with legal counsel; assistant vice chancellor Michael Uhlenkamp: “international students are essential to UC Irvine’s mission, bringing perspectives, experiences and ideas that enrich our intellectual and cultural community.” USC announced on Aug 25, effective Aug 24, that “CPT requests will only be authorized when practical training is a degree requirement for graduation,” with prior fall authorisations not rescinded. And the trigger is two documents, not one: SEVP broadcast BCM 2608-01 of Aug 12, a “reminder of liability for DSOs regarding CPT authorization” that threatened certification withdrawal, and BCM 2608-02 of Aug 24, giving substantive guidance on how course-credit CPT should be administered. Berkeley and Irvine moved on the liability warning alone; USC moved on the guidance. Three of the four are University of California campuses, which suggests a system-level legal posture rather than four independent readings. The operative standard is that training be “an integral part of an established curriculum” and essential to degree completion, with certification revocation as the stated penalty. The association silence still holds; the institutional silence never existed. On the H-1B fee, the docket is accelerating: 3,957 comments against 3,169 on Friday, a jump of 788 in twenty-four hours and the heaviest day since the rule published Aug 25. The fee is $103,265, not the round hundred thousand; comments close Sept 24; and the “76% of small businesses” claim remains absent from the rule, whose actual small-entity language runs in full: “DHS acknowledges that USCIS may see a reduction in the number of H-1B cap registrations and some employers, including small entities, may file fewer petitions as a result of this proposed rule.” Worth adding is the rule’s own equity argument, which is the sentence any association comment would have to attack: petitions “are requests that are generally submitted by petitioners who have more ability to pay, as opposed to shifting those costs to all other fee payers.” Still no ACE, AAU, NAFSA or Presidents’ Alliance filing on this docket, checked three ways — though with twenty-seven days left and associations typically filing on the last day, that absence is expected rather than surprising, and this desk should stop treating it as a puzzle until late September. NAFSA v. DHS gains identifiers rather than events: it is in the District of Massachusetts before Judge F. Dennis Saylor IV, with McDermott Will & Schulte for the plaintiffs, and the coalition is seven — NAFSA, the Presidents’ Alliance, AICUM, the AFT, GLO, the UAW and the NewsGuild-CWA. Two of the seven are unions representing graduate workers, which is the theory to watch on Sept 3. Still three docket events; the government’s response is due Monday and the hearing is Sept 3 at 11 a.m. in Courtroom 1. The DOD foreign-partnership audits are also due Monday, with Duke and Georgetown confirmed among the thirty and no published list; Under Secretary for Research and Engineering Emil Michael says the department has “zero tolerance for academic partnerships that compromise our national security.” Submissions require audit findings, an assessment of exposure to sensitive or export-controlled research, and actions taken including terminating problematic partnerships. Counsel are flagging exposure under the False Claims Act and export-control law and, pointedly, potential criminal prosecution of individual faculty — which is a sufficient explanation for why not one of the thirty has said anything publicly, three days out. And for the classroom, a technique that costs no lecture minutes because it is a grading policy rather than an activity. Simon Cullen and Danny Oppenheimer at Carnegie Mellon let each student choose, at the start of term, whether attendance counts toward their own grade. Opt in and you may miss up to three recitations with no penalty; finish with three or fewer absences and you gain 3% on the final grade, finish with more and you lose 3%. Opt out and attendance carries no weight either way. In the published Science Advances work, 90% opted in, and across five classes of 60 to 200 students the range was 73 to 95%, with at most 10% regretting it. The headline attendance difference against a conventionally mandatory section was not statistically significant, and that is not the finding: the finding is the trajectory — attendance under the self-imposed rule stayed stable across the semester while attendance under the imposed rule declined significantly. Given the option, 85 to 90% also opted into harder homework, and scored better. Oppenheimer: “anytime in a class that you give freedom to choose, you give students the feeling of control over their education.” Cullen: “like Ulysses, students know they will face significant temptations.” Carnegie Mellon’s own caveat is the right one to carry: “the study was conducted at a single university with a limited number of students, and more research is needed to determine if the results will replicate across different types of institutions and student populations” — and the 73% floor is the number most likely to fall at a large public.",
        s: [["USC Office of International Services (CPT restricted to degree requirements)","https://ois.usc.edu/important-update-regarding-curricular-practical-training/"],["Daily Californian (Berkeley suspended course-credit CPT on Aug 12)","https://www.dailycal.org/news/campus/uc-berkeley-yields-to-ice-threat-suspends-course-credit-work-applications-for-international-students/article_f7d3e264-99a5-456f-9ed0-87d48b1dc1be.html"],["Federal Register (H-1B fee: $103,265, 3,957 comments)","https://www.federalregister.gov/documents/2026/08/25/2026-17324/fee-for-certain-h-1b-petitions"],["THE Campus (Oppenheimer on optional-mandatory attendance)","https://www.timeshighereducation.com/campus/are-we-overlooking-power-autonomy-when-it-comes-motivating-students"]] },
      { t: "Mind & cosmos: the psychedelics beat was genuinely empty, physics produced a result nobody was looking for, and the quantum news was all money. Start with the absence, because it is verified rather than assumed. Four live sources were checked — PsyPost’s psychedelics section, PsyPost’s wider psychopharmacology section, Psychedelic Alpha and the Nature-family literature — and not one psychedelics item was published in the window. Psychedelic Alpha’s newest remains the Aug 26 analysis of the Definium Phase 3 LSD readout, which is analysis of Aug 12 data rather than new data; Field Notes is still stalled at #4 from Aug 21 with no #5, and the numbered Bulletins remain frozen at #229 from Aug 7. PsyPost’s newest psychedelics item is still Wednesday’s salvinorin A mouse study. Two new stale decoys are worth logging for anyone searching this beat: a Molecular Psychiatry paper mapping brain organisation under 2C-B and psilocybin, which ranks high on current queries and is Feb 3, 2026; and a Neuropsychopharmacology overview of psychedelic therapeutics, which is Jan 16, 2026 and is a review rather than primary research — though it carries one figure worth having, that fewer than 2% of psilocybin trial participants have been over 65. What PsyPost did publish is serotonergic and instructive in the opposite direction. A randomized, double-blind, placebo-controlled trial from Oliver Robinson’s group at UCL, 141 participants — 45 with anxiety disorders, 96 healthy controls — gave escitalopram 10mg daily for two to three weeks with fMRI before and after. The connectivity result ran opposite to prediction: amygdala–dorsomedial cortex connectivity increased rather than decreased. Anxiety symptoms did not improve, and depression scores rose in both escitalopram arms. The authors’ own limitation is that participants “were recruited from the community rather than directly from mental health services, which may have resulted in… a different symptom profile compared to individuals who seek help.” Note the same journal-DOI trap that caught the salvinorin paper — the DOI stem is 2025, so date the coverage rather than the paper. In physics, the item with a real result is an accident. A RIKEN group led by Denis Maryenko reports the first observation of re-entrant superconductivity in a two-dimensional unconventional superconductor, in LaTiO3/KTaO3 heterostructures: a magnetic field first destroys superconductivity and then restores it above a transition field of 0.9 tesla, with the response temperature-independent. The mechanism proposed involves a Van Hove singularity — the field breaks the symmetry between p and −p, reducing Cooper-pair formation efficiency while simultaneously shifting electrons toward a higher density of states, two competing effects producing a minimum in the transition temperature. Maryenko’s own framing is the honest one: “we did not look for the RSC, and it was extremely surprising that we saw that.” One system, one observation, found by accident. The journals otherwise ran theory: Physical Review Letters 137, 090405 has Singh, Kessler and Barkai on a nonanalytic transition in the splitting probabilities of monitored quantum walks at a critical sampling time of 2π/ΔE — no experiment — and PRX Quantum 7, 033041 has Lu, Liu, Gopalakrishnan and You on a holographic duality mapping quantum-channel steady states in d dimensions to wavefunctions in d+1, also pure theory, no hardware. And note for the record that Kessler and Barkai are at Bar-Ilan, making this a fourth distinct Bar-Ilan item in circulation, separate from the attention-and-immune-response work, the rave study and the quantum-voting group. The Quantum Insider ran five items and not one is a technical result. Pasqal completed a SPAC merger with $360m in cash and lists as PSQL, claiming seven QPUs deployed and three in production — with no valuation, no qubit counts and no roadmap dates; chief executive Wasiq Bokhari: “today is not a finish line; it is an acceleration point.” Canada signed a definitive agreement committing CAD $195m to Xanadu, the federal share of up to CAD $390m, for photonic chip integration, packaging and wafer-level testing, with no specifications disclosed; Christian Weedbrook: “building utility-scale quantum computers will require a new generation of highly specialized manufacturing capabilities.” An Italian court upheld the halt to IBM’s €61m Campania contract, and three law firms are reported to hold nearly two-thirds of all recorded quantum legal work. Announcements and money, in other words, not results — and worth labelling as such every time. Elsewhere Quanta ran Ben Brubaker on whether computer science needs computers, whose answer is that the theory does not but that many of its questions would never have been asked without machines. Nautilus has a large longitudinal study from Huazhong University of Science and Technology, led by Yan Wan and Bo Hu in Neuroprotection, following more than 2,000 hospitalised Omicron-wave patients with cognitive testing at six months and two years: 67% showed no decline, 22% showed reversible decline improving by an average of three points out of forty, and 11% were irreversible, of whom a third worsened progressively by four points. Age over sixty carried four times the risk and each reinfection doubled the risk of progressive decline; education and vaccination were protective. The authors’ conclusion — “cognitive decline after Omicron infection is not necessarily permanent” — should be read alongside the fact that no uninfected control cohort is described. And Tricycle has Tulku Pema Rigtsal, holder of the Namkha Khyung Dzong lineage within Dudjom Tersar, on the pairing of mindfulness, “recollection of what is to be adopted and what is to be avoided,” with vigilance, “constant examination of the state of one’s body, speech, and mind” — the two used together to crush afflictions as they arise. It invokes the Great Perfection but is bodhisattva training rather than Dzogchen practice instruction, and is worth reading as lineage-adjacent rather than as the thing itself. Essentia and Buddhistdoor are both verified negatives.",
        s: [["Physics World (re-entrant superconductivity, found by accident)","https://physicsworld.com/a/magnetic-field-first-kills-superconductor-then-brings-it-back-to-life/"],["The Quantum Insider (Pasqal’s $360m SPAC completion)","https://thequantuminsider.com/2026/08/28/pasqal-completes-spac-merger-with-360-million-in-cash/"],["PsyPost (escitalopram’s unexpected connectivity result)","https://www.psypost.org/short-term-ssri-use-alters-brain-connectivity-in-anxious-individuals-in-unexpected-ways/"],["Nautilus (COVID brain fog may not be irreversible)","https://nautil.us/covid-brain-fog-may-not-be-irreversible-1284604"]] },
      { t: "Three deaths this desk had missed, a Lynch scoop that reaches day seven, and a £71m Rembrandt stopped at the border. Start with the correction, because it is the reason the correction exists. After missing Dolly Parton’s death for two consecutive runs, this desk added a standing instruction to check for major cultural deaths every day. It fired immediately, and it found three. Tim Curry died on Aug 26, aged 80, after what was described as serious health issues over more than a decade — Frank-N-Furter in The Rocky Horror Picture Show, Pennywise in the 1990 It, Wadsworth in Clue. Peter Cullen died on Aug 27 at his Los Angeles home, aged 85 — the voice of Optimus Prime continuously since 1984 and of Eeyore for decades, whose family asked that he be honoured by serving communities “with compassion, integrity and loyalty,” and offered a line that is his own: “be strong enough to be gentle.” And Sliman Mansour died on Aug 24, aged 79, with a funeral on Aug 26 at the Anglican Church in Birzeit, where he was born in 1947 — the painter who gave Palestinian art much of its visual language, who co-founded the League of Palestinian Artists in 1973, the same year he painted Jamal al-Mahamel; who co-founded New Visions in 1987, working in mud, straw, henna and natural dyes as a form of cultural resistance; who founded the al-Wasiti Art Center in Jerusalem in 1994; who won the UNESCO-Sharjah Prize for Arab Culture in 2019; and who completed a twelve-by-six-metre mural for the Palestinian Museum in 2024. The A.M. Qattan Foundation said his art was “inseparable from the Palestinian people, land and memory.” Also, Samuel Monroe Jr., of Menace II Society, died Aug 27 aged 52 of meningitis. One methodological note this desk owes itself: Wikipedia’s deaths-by-month page carries none of the three and is lagging badly, so it cannot be used as a negative check on this beat. On the director watch, the standing scoop holds and sharpens. A Gathering of the Angels remains postponed to 2027 with, on day seven, still not one press pickup — and getyourcomicon.co.uk, checked directly, is still advertising Sept 26 and 27 at the Genesis Cinema as live, four weeks out, with no update since Aug 3. There is one new detail and it points to a quiet cleanup: the homepage navigation now reads only Home, Previous Events and About Us, with no Tickets link anywhere on the page — the tickets URL survives only as an orphan. This desk could not fetch that orphan today, so the price ladder and the 404ing checkout it reported yesterday are not re-verified and are not being re-asserted. The banner is unchanged and there are still no 2027 dates: “our new dates will be announced soon.” On von Trier, the Aug 9 World of Reel piece yields a producer quote that turns an open-ended wait into a datable milestone. Peter Aalbæk Jensen: “before the summer break, I heard that Lars might, with a bit of luck, have the screenplay written around August.” August ends Monday, unconfirmed. The 1.3m kroner from the Danish Film Institute is still the only money, the film is still unshot, and the Ekko date conflict — Aug 5 on the article page, Aug 14 on the site index — remains unresolved and is being flagged rather than picked. Noé is a plain negative on a ninth check; Refn still has no cast for Maniac Cop with a January 2027 Los Angeles shoot. Criterion’s December slate is confirmed unannounced at the source: the Coming Soon page lists twenty-two titles and stops dead at The Right Stuff on Nov 24, with Wild at Heart in 4K on Nov 17 the Lynch title on the fall ladder. Venice opens Wednesday, and two additions are worth noting: Tinto Brass’s Deadly Sweet from 1967 screens Sept 1 at the Sala Darsena the day before Danny Boyle’s Ink opens the festival — Ink written by James Graham from his own play, with Alwin Küchler shooting and Daniel Pemberton scoring, Lucky Red taking Italy and still no US distributor — and Naza, by Yuval Abraham and Rachel Szor of the No Other Land team with Jonathan Glazer as executive producer, has been added to competition for a Sept 10 premiere; the title is a military acronym Israeli intelligence uses for the number of civilians it expects an airstrike to kill. In the art world the Kusama tributes broadened without answering the open question: there is still no memorial date, and the Yayoi Kusama Museum’s own site carries no death notice, no announcement and no closure, still fronting an exhibition that closed in March. What did emerge is a figure that measures her reach better than any obituary sentence — the Museum Ludwig in Cologne closed its Kusama retrospective on Aug 2, twelve days before she died, with more than 480,000 visitors, the institution’s most successful show ever. Victoria Miro president Glenn Scott Wright: “spending time with Kusama will forever be one of the greatest privileges of my life.” The art historian Katy Hessel: “she showed us that all of those dots matter. It takes every single one.” The freshest hard art-market story is British: the UK has placed an export bar on Rembrandt’s Portrait of Catrina Hooghsaet of 1657, valued at £71m, giving a UK buyer until Dec 26 and then fifteen business days for the owner to consider offers. It sold at Sotheby’s in 2015 for £35m and changed hands privately at Christie’s last year — so the export bar is being used to arrest an asset that has roughly doubled in a decade. Arts minister Ruth Mackenzie called it “a priority for cultural partners, funders, philanthropists and lovers of Rembrandt”; the art historian Bendor Grosvenor made the structural point: “cases like this remind us of the public value of museums having dedicated acquisition funds, as they used to.” On the Smithsonian, no movement before Monday’s expected decision — but the discuss-versus-vote question is now a four-way disagreement rather than three, since the Washington Examiner reported on Aug 20 that the institution is considering “an emergency, unscheduled meeting” of the regents to “rubber-stamp” the decision, and gives no date at all. “A decision is expected” remains the only safe formulation, the building’s status should still not be stated, and the absence of any Anthea Hartig quote now holds across four sources. And a small institutional recovery worth recording: Guatemala’s Museo de Arte Colonial in Antigua will reopen after a December 2025 court-ordered raid that moved most of a 287-piece collection to the Palacio Nacional within two weeks — despite a preliminary assessment finding only ten works needing urgent restoration. Six large paintings, five attributed to Tomás de Merlo, were too fragile to move. The culture ministry regained control on Aug 11. Minister Luis Méndez Salinas: “the keys are back, and we will work hard so that the museum is back, too.”",
        s: [["The Art Newspaper (remembering Sliman Mansour)","https://www.theartnewspaper.com/2026/08/28/remembering-sliman-mansour-a-defining-figure-of-palestinian-art"],["Hyperallergic (the art world reacts to Kusama’s passing)","https://hyperallergic.com/the-art-world-reacts-to-yayoi-kusamas-passing/"],["The Art Newspaper (£71m Rembrandt export bar)","https://www.theartnewspaper.com/2026/08/28/uk-government-places-export-bar-on-%C2%A371m-rembrandt-portrait"],["The Criterion Collection (Coming Soon: nothing past Nov 24)","https://www.criterion.com/shop/browse?popular=coming-soon"]] }
    ]}
