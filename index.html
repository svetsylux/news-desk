<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

    { h: "World & geopolitics", items: [
      { t: "The scale of Tuesday's American strike round is now on the record, and it included Iranian government tankers for the first time. CENTCOM's own account puts the noon-Tuesday operation at approximately one hundred IRGC targets — air defence, radars, mine-laying equipment, communications and anti-ship missiles — with explosions reported at Konarak (six), Qeshm Island (eight, near the airport), and Bandar Abbas and Sirik. The new element is maritime: GlobalSecurity records two Iranian government tankers struck north of the blockade line under a stated “tanker for tanker” policy, which is a category of target the United States had not previously hit. Trump, at 2:44 p.m. Wednesday: “It was a very heavy attack last night. And we're prepared to do another one anytime we want,” and, of Iran's Monday retaliation, “They gave a little love tap, but we hit them very hard last night.” One casualty question closes and another opens. Larak settles at three: IranWire reports Tasnim's own revision — “Tasnim had earlier reported two fatalities from the attack… one of the injured succumbed to severe wounds in the hospital.” But a wedding at Kuhestak in the Sirik district has produced FOUR incompatible accounts from Iranian institutions themselves — an official claim of four-plus killed, a Foreign Ministry figure of “more than 50 killed or wounded,” state television at “nearly 70 total casualties, 6 critical,” and GlobalSecurity's separate strike-day total of at least eighteen killed “including five civilians at a wedding.” CENTCOM, 6:36 a.m. Wednesday: “The U.S. military never targets civilians.” This desk publishes the spread rather than a number, because nothing in the record settles it. No second American wave and no fresh Iranian answer was found on Wednesday — the day's reporting is aftermath, not a new round.",
        s: [["IranWire (the strike list, the tanker policy and Tasnim's revision to three at Larak)","https://iranwire.com/en/news/145812-us-strikes-iran-irgc-targets-tankers/"],["CBS News (Trump: “prepared to do another one anytime we want”; the wedding casualty accounts; CENTCOM's reply)","https://www.cbsnews.com/live-updates/us-iran-war-trump-dismisses-diplomacy-tehran-says-wedding-hit-in-strike/"],["Times of Israel (September 2 liveblog: the rial's record low)","https://www.timesofisrael.com/liveblog-september-2-2026/"]] },
      { t: "Iran's currency hit a fresh record low, and the fuel-shortfall figure this desk flagged as unverified yesterday is now verified — and its arithmetic closes exactly. The rial reached about 2.2 million to the dollar on Wednesday, roughly ten per cent weaker in a week, against an official rate near 1.5 million; the Times of Israel's liveblog notes it has “lost about half of its value in a year.” That is a genuine new low against the 2,020,000 this desk has been carrying. On fuel, yesterday's brief listed a seventeen-million-litre daily shortfall as an unfetched Iran Focus headline that needed checking. It checks out at article level, though the article is dated August 29 rather than September 2, and it comes with the official who said it: Vice-President Mohammad-Jafar Ghaem-Panah, that “daily gasoline consumption in the country stands at 132 million liters, while daily production reaches only 115 million liters. This 17-million-liter shortfall has led to the closure of some gas stations.” One hundred and thirty-two minus one hundred and fifteen is seventeen; the figure is internally consistent, which the two earlier estimates of roughly fourteen and fifteen million litres also were, on different production and consumption assumptions and different dates. All three stand. On the water, nothing moves: the Iran–Oman corridor has still carried no vessel, a ninth day, and straits.live independently confirms war-risk cover at exactly forty times pre-crisis and six vessels transiting on August 30 against a typical eighty-five a day — about seven per cent of normal volume. Gharibabadi's line this round is that the Oman route is “a temporary route,” with a warning against “succumb[ing] to American pressure regarding the sanctions.” GlobalSecurity's log now reads Day 187.",
        s: [["straits.live (war-risk cover at 40x pre-crisis; six transits on August 30 against a typical 85)","https://straits.live/"],["Iran Focus (Ghaem-Panah: 132m litres consumed, 115m produced, a 17m-litre shortfall)","https://iranfocus.com/economy/iran-gasoline-shortfall-stations-close/"],["Al Jazeera (the UAE intercepts a single drone; the Iran–Oman corridor as agreed)","https://www.aljazeera.com/news/2026/8/31/uae-intercepts-drone-after-us-and-iran-exchange-attacks"]] },
      { t: "Overnight in Ukraine the exchange ran in both directions, and the Russian half reached the Moscow region and a Black Sea resort. Meduza reports Odesa struck into Wednesday morning with seventeen injured including three children, twenty apartments damaged in a twenty-one-storey building and twelve vehicles hit, attributed to Serhiy Lysak of the Odesa military administration and regional head Oleh Kiper. Going the other way, Ukrainian drones reached Kubinka in the Moscow region — a residential building hit, fires on the eighth and ninth floors, ten people evacuated, no injuries — plus blown-out windows at Pavlovsky Posad and a factory fire at Bolshoye Bunkovo. Moscow Region Governor Andrei Vorobyov: “56 drones were shot down over the Moscow region overnight,” which combined with Mayor Sergei Sobyanin's city intercepts puts at least ninety-four downed in the capital region on Russia's own account. Sochi's sea port was also struck, on monitoring-channel footage, with no statement yet from Krasnodar Krai or the city. Two absences are worth stating plainly rather than papering over. First, the ISW lag has REOPENED: no September 2 assessment could be found on either criticalthreats.org or the Kyiv Post repost path, with September 1 (ID 83536) still the newest — which vindicates yesterday's amended note that the lag runs zero to one days and varies, and must be re-checked rather than assumed in either direction. Second, and this is a correction this desk owes its own standing note: Ukraine's Air Force DID publish an exact ballistic figure on September 1 — five ballistic missiles shot down, alongside two Banderol, five Kalibr and 187 drones — which sits awkwardly against the desk's carried claim that exact ballistic figures stopped in early August. The cutoff assumption needs re-checking.",

      { t: "Putin's Eastern Economic Forum plenary is today in Vladivostok, the pipeline thread that has produced nothing since May has a new name and a stated stage — and this desk owes itself a dating correction on the Ratcliffe story. Ahead of the plenary, TASS carries Putin on a Ukraine settlement: “We are grateful to everyone who is trying to contribute to resolving this issue. Is there a chance? In my opinion, yes, there is.” On ownership of the process, and this is the sentence to read carefully: “Russia and Ukraine must reach an agreement first and foremost. All other countries are ready to support and assist.” On China, that “President Xi Jinping, when we meet, also constantly raises this issue.” Confirmed bilateral guests for today's session: Indonesian President Prabowo Subianto, Mongolian Prime Minister Nyam-Osoryn Uchral, Myanmar First Vice-President Nyo Saw and Chinese Vice-Premier Ding Xuexiang, with no individual readouts published yet. The forum also produced the first concrete movement on Power of Siberia 2 since the May 20 Beijing framework, and it arrives as a rebranding: Energy Minister Sergei Tsivilev says the project has been renamed Power of Baikal, personally by Putin, and that “we are in the final stages of moving to the construction of the project formerly known as Power of Siberia 2” — 2,600 kilometres, a design capacity of 50 billion cubic metres a year to China via Mongolia from Yamal fields, on top of Power of Siberia 1's 38. A stage is not a contract and no terms were published. THE CORRECTION: yesterday this desk reported, as a September 2 CBS detail, that the United States asked Ukraine to suspend strikes for the duration of the Ratcliffe delegation's presence in Moscow. That reporting is real but it is OLDER than the desk said — it traces to CBS on August 25 and the Kyiv Post's write-up of August 26, not to this week. No seventh account of the trip and no Russian or American readout dated September 2 or 3 could be found. An Asia Times piece of September 1 carries far larger claims from “Ukrainian back-channels” — a US offer to withdraw all troops from Europe in exchange for freezing the war, and an internationally backed administration replacing the Zelensky government — which its own author explicitly flags as unconfirmed, and which this desk therefore reports as a claim about a claim and nothing more.",

      { t: "Wednesday reversed the week, small caps led it, and the index that led is once again a different index from yesterday's. The closes, each checked arithmetically against Tuesday: the S&P 500 at 7,666.60, up 35.13 or 0.46 per cent; the Dow at 53,061.95, up 295.07 or 0.56; the Nasdaq COMPOSITE — always name the index — at 26,217.83, up 118.06 or 0.45; and the Russell 2000 at 2,953.17, up 33.04 or 1.13 per cent. Every one reconciles to the prior close. The VIX closed at 15.23, down 1.11 or 6.79 per cent, off a 16.34 settle on Tuesday, which retrospectively confirms the “closed above 16” description this desk published without an exact figure. The composition story is now three days long and worth watching as a pattern rather than a level: Monday the Dow led a decline, Tuesday the Composite and small caps led a decline, and Wednesday the small caps led a rebound of more than double any large-cap gauge — after opening down 1.23 per cent intraday, a round trip of roughly 2.4 points in a session. Breadth was broad: nine of the S&P's eleven sectors higher and about sixty per cent of components advancing. One flag rather than a resolution. The ten-year printed an intraday 4.814 per cent before yields paused, and the outlet reporting it described that as the highest since NOVEMBER 2023, where the same desk's Tuesday source described 4.796 per cent as the highest since JANUARY 2025. Those two characterisations cannot both be right and neither was re-derivable; the levels are solid and the superlatives are not, so this desk publishes the levels. Wednesday's close on the ten-year could only be obtained as approximately 4.79 per cent from a single source, so it is published as approximate. On commodities, TradingEconomics' live panel and its own narrative text disagree again — panel WTI $90.51 and Brent $95.10 against text of “around $90” and a WTI print of $90.55 — so both are published, per the standing rule, and a third source's Wednesday close of $89.58 WTI and $94.19 Brent is flagged rather than reconciled.",

      { t: "The private payroll print missed badly, the Fed's own survey said “modestly,” hike odds came off four points — and the ruble fixings this desk could not obtain yesterday have been recovered for both days. ADP came in at 38,000 against a forecast of 47,000 and a prior 46,000: a sizeable miss, and the last read on private hiring before Friday's August employment report. Factory orders for July rose 0.9 per cent against a consensus reported as 0.7 by one source and 0.6 by another — a beat on both, with the June figure revised to a 0.2 per cent decline. The Beige Book, released at one o'clock Wednesday, is the day's most quotable document and its verb is deliberately small: “Economic activity increased modestly since early July,” with ten of twelve districts reporting slight-to-moderate growth and two flat, prices “increased moderately in eight Districts,” employment growth minimal, and contacts citing “heightened uncertainty surrounding the effects of higher energy prices, policy, and international conflict.” Tariffs are named directly: “Retail and manufacturing contacts continued to note tariff-related impacts in multiple Districts.” The Bank of Canada held at 2.25 per cent as expected, with second-quarter GDP up 3.3 per cent, unemployment easing to 6.4 per cent in July but “demand for labour remains subdued,” CPI near three per cent “primarily due to gasoline prices,” and an explicit warning that “the longer that high oil prices and elevated refinery margins persist, the greater the risk of spillover to the prices of other goods and services.” Rate expectations moved with the payroll miss: investing.com's Fed Rate Monitor, cleanly stamped September 3 at 4:55 a.m. EDT, now reads 60.4 per cent for a hike to 3.75–4.00 and 39.6 per cent for a hold, against 64.4/35.6 stamped September 1. A hike is still the majority-priced outcome into the September 15–16 meeting. AND THE GAP CLOSES: the Bank of Russia's fixings, which failed on an expired certificate at one source and a stale serve at another yesterday, are ₽86.7530 effective September 2 and ₽86.9963 effective September 3 — three consecutively weaker fixings from ₽86.3793 on September 1, about 0.72 per cent over two sessions, with the euro at ₽100.8287 and the yuan at ₽12.9217. Digital-ruble uptake coverage is absent on day three as it was on days one and two, confirmed including a Russian-language search: an established absence now, not an unchecked one.",

    { h: "Health & policy", items: [
      { t: "Three open questions about the drug-pricing deals were closed yesterday, all three in the negative, and by a source with no stake in the answer. This desk has spent a week unable to establish whether the most-favoured-nation agreements price against net or list, whether signatories are exempt from the mandatory Medicare pilots, and whether any actual terms exist in public. A law-firm analysis of the August 31 round answers all three, and its answers are that nobody knows. On net-versus-list: not specified anywhere in official materials. On the pilot exemption: “pre-announcement reporting by Bloomberg, Reuters, and the Financial Times also described exemption from the pending mandatory Medicare pricing models as part of the bargain, although… the fact sheet is silent on that point.” On the agreements themselves: “the operative agreements themselves were not released, consistent with the administration's practice on the earlier deals.” Trade coverage puts the same finding plainly — details are “mostly thin on which of the companies' specific drugs are included… and the precise discounts.” That is now three independent confirmations in three days that the opacity is a feature of the programme rather than a gap in this desk's searching, and it should frame every future announcement: twenty-six firms, a claimed eighty-nine per cent of the branded market, a $19.6bn manufacturing pledge, Section 232 tariff relief as the mechanism, and no published terms for any of it. Against which, a real and measurable move in the opposite direction: UnitedHealthcare said Wednesday it is removing prior authorisation from about 1,700 codes effective October — roughly thirty per cent of its preapprovals, broken out as 800-plus commercial, about 940 ACA, about 120 Medicare Advantage and dual, and 1,400 Oxford. Set that beside the industry-wide scorecard this desk has been carrying, where prior-authorisation reductions came in at eleven per cent against an eighty per cent promise. One insurer delivering a specific number is not the industry delivering on a pledge, and the two should not be merged — but it is the first hard figure on the compliance side in a fortnight of soft ones. Still nothing from the Midsized Biotech Alliance about being passed over twice.",
        s: [["STAT (Payne, Chen and Wilkerson: the details of the deals aren't public, and the White House declined to comment)","https://www.statnews.com/2026/09/01/trump-pharma-deals-analysis-latest-round-most-favored-nation"],["Healthcare Dive (UnitedHealthcare cuts prior authorization from 1,700 codes)","https://www.healthcaredive.com/news/unitedhealthcare-prior-authorization-codes-cut-1700/829406/"],["KFF Health News (Armour: the enforcement record behind the pledges — 11% against an 80% promise)","https://kffhealthnews.org/health-industry/trump-kennedy-food-dyes-price-deals-unenforced-vanishing/"]] },
      { t: "The vaccine docket jumped well above its own steady state, the WHO number this desk chased yesterday exists and has existed since August 28 — and one tracked series has come apart and is being flagged rather than published. THE EBOLA CORRECTION, AND IT IS THE SECOND IN TWO DAYS ON THE SAME STORY. Yesterday this desk wrote that no DON616 existed. It does, and it was published on AUGUST 28 with data to August 26: 5,794 confirmed cases, 2,786 deaths, a case fatality rate of 48.1 per cent, and SIXTY health zones across six of twenty-six provinces, up from fifty-four in DON615. WHO's own language calls it “the largest Ebola disease outbreak ever recorded in the Democratic Republic of the Congo irrespective of Ebola virus species,” a “large and geographically expanding epidemic” with “sustained transmission, high mortality and an increasing risk of further international spread.” The standing rule — check for a newer DON number before declaring WHO stale — was written into this file yesterday and then not followed; it is followed now. The gap to ECDC is smaller than the desk has been saying: ECDC's own update of September 1 at 17:00, data to August 30, gives 6,100 confirmed, 2,950 deaths, a rate near 48.4 per cent, 1,383 recovered and 814 hospitalised in isolation. Four days apart on data cutoffs, not eighteen. On the dockets, the vaccine request for information at docket HHS–OS–2026–0332 now reads 2,316 comments, up 488 in a day — WELL ABOVE the 130-to-200 weekday steady state this desk established, which is either a coordinated filing push or the shape of a deadline approaching on September 20. As always, no timestamp attaches to the comment count; the page's only stamp reads “Page views 8,334 as of 09/03/2026 at 4:15 am EDT,” attached to page views, continuing the migration this desk flagged. THE H-1B SERIES HAS BROKEN AND IS NOT BEING PUBLISHED AS A NUMBER: today's read returns 105,740 against the 5,432 carried on September 2, roughly nineteen times higher, and the likeliest explanation is that the read landed on the $103,265-fee rulemaking rather than the tracked docket. A nineteen-fold overnight jump is a measurement failure until proven otherwise. Measles holds its plateau at 2,903 as of August 27, unchanged on a third consecutive direct check. And a real move outside the federal channel: the Vaccine Integrity Project's multi-society autumn guidance has ACOG extending the RSV vaccination window for pregnant people from September 1–January 31 to September 1–MARCH 1, with Bruce Gellin on the record that “Americans should have access to the best available scientific evidence… so they can make informed decisions.” That is AAFP and ACOG, not the AMA or the AAP, whose docket silence holds a tenth day.",
        s: [["WHO Disease Outbreak News 616 (published August 28, data to August 26: 5,794 cases, 2,786 deaths, 60 health zones)","https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON616"],["Federal Register (the vaccine RFI docket: the comment count, and the “as of” stamp that attaches to page views)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["STAT (doctors' groups release vaccination guidelines ahead of respiratory illness season)","https://www.statnews.com/2026/09/02/vaccine-integrity-project-fall-winter-guidelines-rsv-covid-flu-shots/"]] },
    ]},
    { h: "Campus & culture", items: [
      { t: "Michigan filed on time, the applicant replied the same day, and the Supreme Court has not ruled — so the story this desk got badly wrong on Monday is now fully on the record. Reading the Court's own docket at 26A275: the Alliance for Citizen Voting in Michigan filed its emergency application for an injunction pending appeal on August 31; Justice Kavanaugh ordered a response by noon on September 2; the Board of State Canvassers, Secretary of State Jocelyn Benson and Elections Director Jonathan Brater FILED THAT RESPONSE ON TIME; and — the new element nobody had — ACVM filed a reply in support of its application the same day. No ruling from Kavanaugh or the full Court as of this morning. The underlying dispute is worth restating because it is the cleanest statistics story in American politics right now: the initiative fell THREE signatures short under the state's random-sampling validation method, and petitioners submitted affidavits from voters swearing their signatures were valid, which Michigan dismissed on procedural grounds. The next fixed date is tomorrow: the Board of State Canvassers meets at 10 a.m. Friday at the Binsfeld Office Building in Lansing to finalise the ballot, livestreamed via Senate TV, with absentee voting starting September 24 and the court's outside deadline September 19. TWO OPEN ITEMS, BOTH FLAGGED RATHER THAN RESOLVED. First, the Ypsilanti Township resolution title has RE-OPENED: the township's own data-center page describes Resolution 2026-05 as “Declaring Strong Opposition to Los Alamos National Laboratory Siting a Nuclear Research Facility Anywhere in Ypsilanti Township,” adopted March 31 — which directly contradicts yesterday's finding that the file is named for “Data Center High-Value Target Risk” with no Los Alamos in it. The page lists several resolutions and the fetch may have conflated them; nobody has opened the actual PDF. Until somebody does, this desk asserts neither title. What IS new and clean: a SECOND town hall on October 1, 5:30–7:30 p.m., alongside the September 9 one. Second, the RenCen Neighborhood Advisory Council election of September 1 WAS reported — Axios Detroit published “Residents elected to RenCen advisory council” on September 2 — but only the headline and date could be recovered, not the article or the winners' names. Elsewhere: Cybele Raver's start date at Michigan is December 1, and her first quotes are on the record — “It's a tremendous opportunity to lead such a remarkably brilliant group of faculty in a way that allows us to pursue really big, bold, exciting questions to which we do not yet have answers.” Still no vote tally anywhere, so still no claim of unanimity.",
        s: [["Supreme Court of the United States (docket 26A275: the response filed September 2 and the same-day reply)","https://www.supremecourt.gov/DocketPDF/26/26A275/422769/20260902121336561_26A275%20ACVM%20Response%20A.pdf"],["Ypsilanti Township (the data center information page: the September 9 and new October 1 town halls)","https://ypsitownship.org/government/boards___commissions/board_of_trustees/data_center_information.php"],["University of Michigan Record (Raver: “one of the biggest jobs in higher education,” starting December 1)","https://record.umich.edu/articles/c-cybele-raver-taking-on-one-of-the-biggest-jobs-in-higher-education/"]] },
      { t: "The curricular-training wave is bigger than ten, three more universities are now sourced with their own words, and the case everybody has been waiting on is heard this morning. NAFSA v. DHS goes before Judge F. Dennis Saylor IV at 11 a.m. today in Courtroom 1 of the District of Massachusetts — the earlier of the two circulating dates, confirmed against the Presidents' Alliance's own case page citing Saylor's August 19 scheduling order, and a secondary source still carrying September 9 is stale. The eight plaintiffs are now named in full for the first time: NAFSA, the Presidents' Alliance on Higher Education and Immigration, the Association of Independent Colleges and Universities in Massachusetts, the American Federation of Teachers, Graduate Labor Organization AFT Local 6516, the International UAW, UAW Local 2322 and the NewsGuild-CWA, represented by McDermott Will & Schulte. Whether DHS ever filed its August 31 response REMAINS UNCONFIRMED on a third day of checking — no source says it did and no source says it did not, which is an absence of reporting rather than an absence of filing. The rule takes effect September 15, and DHS's own final rule text concedes that “enrollment of foreign students in US educational institutions may decline because of this rule but is unable to quantify the extent of this decline.” On CPT, three institutions that were not on this desk's list of ten now have dated, quoted notices, all sitting chronologically between CU Boulder on August 20 and Penn on August 29. UC BERKELEY (August 26) suspended course-credit CPT only, leaving degree-requirement CPT running. THE UNIVERSITY OF WASHINGTON (August 26) is “pausing authorization of any new CPT requests that are not required work experiences for all students in an academic degree program,” because “CPT should only be authorized when the practical training is required for all students and the degree or program cannot be completed without it.” THE UNIVERSITY OF ROCHESTER (August 28), over Vice-Provost Reitumetse Mabokela's signature: “CPT may only be authorized when practical training is required for all students enrolled in a program to earn the degree.” Whether these are inside or outside the tracked ten cannot be settled without the underlying list, so the count is published as “at least ten, and the three above are sourced.” George Washington is under review and explicitly NOT confirmed paused — a spokesperson “declined to specify.” And the pedagogy column finally has a live item rather than an evergreen one: the Chronicle's Beth McMurtrie, dated yesterday, on oral examinations returning as an assessment format that resists AI-assisted cheating — “Hard to fake your way through a discussion.” The disciplines cited are mathematics, engineering, health sciences and communication, not economics, which is the obvious place for somebody to fill in.",
        s: [["Presidents' Alliance (NAFSA v. DHS: the September 3 hearing, the eight plaintiffs, Saylor's scheduling order)","https://www.presidentsalliance.org/duration-of-status-litigation/"],["CU Boulder ISSS (the August 20 notice quoting the August 12 SEVP broadcast message verbatim)","https://www.colorado.edu/isss/2026/08/20/change-cpt-authorization-policy"],["The Chronicle of Higher Education (Beth McMurtrie, The Return of the Oral Exam)","https://www.chronicle.com/article/the-return-of-the-oral-exam"]] },
      { t: "Mind and cosmos: a randomised trial with an unusually large effect and an unusually honest blinding failure, a null result published alongside it, an entangling gate between two different atomic species — and a quantum stock down another twenty-two per cent. THE BEST ITEM IS AN EXPERIMENT. Hendricks, Lappan, Shelton and colleagues at the University of Alabama at Birmingham, in JAMA Network Open: a randomised controlled trial, n=40 adults with cocaine use disorder, psilocybin plus cognitive behavioural therapy against an ACTIVE placebo — diphenhydramine — plus the same therapy. The psilocybin arm recorded about twenty-eight more abstinent days per hundred in the final three months, and thirty per cent achieved full 180-day abstinence against zero per cent on placebo. The stated limitations are the ones that matter and the authors state them: forty people limits generalisability, and NINETY PER CENT of psilocybin recipients correctly guessed their assignment — the same unblinding problem that qualified Rucker's UK trial in August, in a field where an active placebo was supposed to be the fix. Published within a day of it, a NULL RESULT worth as much: Volkmann, Seitz and colleagues at the Charité in npj Mental Health Research, a naturalistic longitudinal survey of 102 first-time psychedelic users against 1,066 never-users drawn from 9,351 respondents, measuring the Big Five at baseline and a year on. Raw openness rose slightly and conscientiousness fell slightly — and after adjusting for confounders the effect was NOT DISTINGUISHABLE FROM CHANCE. Its own limitations: self-reported non-randomised use, no data on dose, setting, timing or intensity, and a one-year window that cannot establish persistence. In physics, a genuine EXPERIMENT rather than a proposal: Miles, Lichtman, Scott and twenty colleagues including M. Saffman, in Physical Review Letters, report an interspecies rubidium–caesium entangling Rydberg gate at fidelity 0.975 ± 0.002, with quantum non-demolition syndrome-measurement fidelities of 0.933(12) on a two-qubit plaquette and 0.865(17) on a three — measurement fidelity falling as the plaquette grows, which is the honest caveat. Three new PRL papers alongside it are THEORY, and a PRX Quantum entanglement-purification paper is a DESIGN framework with no hardware validation. And the listing keeps deflating: Pasqal closed Wednesday at $12.19, down $3.37 or 21.66 per cent, on volume of 560,828, with a market capitalisation of about $350.5m — a FOURTH straight down day, from $19.11 on debut through $17.30 and $15.56. Same-day company news was a partnership announcement with True Nexus on protein structures, explicitly “a first milestone” with NO performance metrics disclosed. An announcement is not a result, and a twenty-two per cent fall is not explained by a metric-free press release.",
        s: [["PsyPost (UAB: psilocybin therapy shows strong potential for treating cocaine addiction)","https://www.psypost.org/psilocybin-therapy-shows-strong-potential-for-treating-cocaine-addiction/"],["PsyPost (Charité: psychedelics may cause slight personality changes, but other factors play a big role)","https://www.psypost.org/psychedelics-may-cause-slight-personality-changes-but-other-factors-play-a-big-role/"],["arXiv (Miles, Lichtman, Scott et al. with Saffman: the interspecies Rb–Cs entangling gate, PRL 137)","https://arxiv.org/abs/2603.13492"],["stockanalysis.com (Pasqal's fourth straight down day: $12.19, −21.66%, volume 560,828)","https://stockanalysis.com/stocks/psql/"]] },
      { t: "Both of yesterday's urgent death leads are now facts, and one of them is a major film-beat name. JEAN-PAUL RAPPENEAU, the French director of Cyrano de Bergerac (1990), died September 2 at ninety-four — confirmed at multiple independent outlets rather than aggregator mirrors, including Le Temps, L'Avenir, France 3 Bourgogne-Franche-Comté and Eye For Film, with a Deadline headline behind a paywall. CHEN KUAN-TAI, the Hong Kong actor, director and action choreographer of The Chinese Boxer, Boxer from Shantung and Flying Guillotine and more than 160 films, died September 2 at eighty, reportedly of a cerebral haemorrhage — confirmed at The Star Malaysia, AsiaOne, Dim Sum Daily and Film Combat Syndicate. That is the standing deaths check paying on its sixth consecutive run, and both names were single-sourced leads twenty-four hours ago; the two-outlet rule is what converted them. No other major cultural death broke overnight. At Venice, day two brought the two starriest competition titles. Martin McDonagh's WILD HORSE NINE stars Sam Rockwell and John Malkovich as CIA agents on Easter Island just before the 1973 Chilean coup, with a theatrical release this autumn; McDonagh's two previous Venice premieres, Three Billboards and The Banshees of Inisherin, both went on to multiple Oscar nominations. Werner Herzog's BUCKING FASTARD stars Rooney Mara and Kate Mara as twin sisters who, in the wire's description, “speak in unison, love the same man, and have the same dreams.” Maggie Gyllenhaal leads the jury; the Golden Lion is announced September 12; the competition still contains one female director among twenty. On the four auteurs this dashboard follows, all four are plain negatives today and each is a real result rather than a gap: no Maniac Cop cast announcement from Refn, whose January 2027 Los Angeles shoot stands; nothing from von Trier since August 9; a FOURTEENTH consecutive verified negative on Gaspar Noé; and the Lynch weekender not re-checked this run, so the still-selling ticket page and the un-re-verified TicketTailor 404 both carry forward unadvanced. Criterion's December slate is still unannounced and — usefully — the Coming Soon page rendered CLEAN this time, matching the known September-to-November slate through The Right Stuff on November 24 with no title moved or dropped, which retires yesterday's scrambled-fetch worry as summarisation noise. In the art world: the Art Gallery of Ontario's director Stephan Jost steps down on December 31 after a decade — “We have met our goals ahead of schedule. Now is the time to set the AGO up for the future with new leadership” — having added more than 18,000 works and, on the gallery's own measure, brought its audience to majority under-39. And the Serpentine has launched a Future Art Ecosystems fellowship on AI and culture, judged by Refik Anadol, Cao Fei, Google DeepMind's Lila Ibrahim and the economist Mariana Mazzucato, with £10,000 grants to Alice Bucknell, Reina Mun, Alfredo Salazar-Caro and Auriea Harvey. Kusama's public memorial still has no date.",
        s: [["L'Avenir (Jean-Paul Rappeneau, director of Cyrano de Bergerac, dead at 94)","https://www.lavenir.net/actu/2026/09/02/jean-paul-rappeneau-realisateur-de-cyrano-de-bergerac-est-mort-a-94-ans-Z6PBYCSC5ZE4DHPAUZ4LQDZSIM/"],["The Star (Hong Kong martial arts star Chen Kuan Tai dies at 80)","https://www.thestar.com.my/lifestyle/entertainment/2026/09/03/hong-kong-martial-arts-star-chen-kuan-tai-dies-at-80"],["AP via the Lethbridge Herald (Venice day two: McDonagh's Wild Horse Nine and Herzog's Bucking Fastard)","https://lethbridgeherald.com/entertainment/entertainment-news/2026/09/02/venice-film-festival-heats-up-with-mcdonaghs-wild-horse-nine-and-herzogs-bucking-fastard/"],["The Art Newspaper (Stephan Jost steps down at the Art Gallery of Ontario)","https://www.theartnewspaper.com/2026/09/02/art-gallery-ontario-director-stephan-jost-stepping-down"]] }
    ]}

  hooks: [
    { story: "Medicare's prescription drug benefit spent $587.7 million over three years on drugs it is legally not allowed to cover, and the reason is a boundary that moved and a payment system that did not notice. The Department of Health and Human Services' own inspector general reported yesterday that between 2021 and 2023, Part D paid for drugs that had been switched from prescription-only to over-the-counter status — which makes them ineligible for Part D by statute. The single largest line is startling in its ordinariness: $562.1 million of the total, across 15.8 million prescriptions, was generic Voltaren — diclofenac gel, the thing on the pharmacy shelf next to the ibuprofen. The rest is generic Pataday and Lastacaft, Astepro and Sklice. The mechanism is not fraud. CMS relied on outdated FDA data about which products had switched, and never told Medicare Advantage and Part D plans to reject claims for OTC-switched drugs, so the claims processed exactly as designed. CMS has concurred with the finding and says it will issue guidance. Note what the number is and is not: it is not a measure of waste in the sense of care that did nobody any good — patients got a drug that presumably worked — it is a measure of who paid, and of a rule that kept being applied to a category that had quietly emptied out.",
      src: ["Healthcare Dive","https://www.healthcaredive.com/news/medicare-spending-ineligible-otc-drugs-hhs-oig-audit/829454/"],
      concept: "What changes when a good crosses the prescription–OTC boundary — and the cost of an administrative rule outliving the category it was written for",
      q: "Do not start with Medicare. Start with the drug, because everybody in the room has bought it. Ask what happens to diclofenac gel the day the FDA moves it from prescription to over-the-counter. They will say it gets easier to buy. Push: what happens to the price faced by the consumer? Two things move in opposite directions — the list price usually falls, because it now competes on a shelf, and the price faced by an insured patient usually RISES, from a copay to the whole thing, because insurance stops paying. So a policy sold as expanding access can raise the out-of-pocket price for exactly the people who had coverage, and lower it for the uninsured. That is worth five minutes on its own. NOW bring in the $587.7 million. Ask: if Part D is not allowed to cover it, why did it? And resist the answer “because government is wasteful,” which explains nothing. The real answer is that the eligibility rule was a stock of information — a list of which drugs are prescription-only — and that stock decayed while the payment system kept executing against it. Ask what it would have cost to keep the list current, and whether that is obviously less than $587.7 million over three years. Then the harder question, which is the one a health economist should leave them with: 15.8 million prescriptions is a lot of people who went to a doctor to get something they could have picked up themselves. Was the $562.1 million buying nothing at all, or was it buying a physician visit, a diagnosis and a prompt to actually use the drug? Distinguish the accounting error from the welfare question, and make them say which one the inspector general measured." },
    { story: "Twenty-six drug manufacturers have signed agreements with the United States government covering, on the White House's own count, eighty-nine per cent of the branded drug market — and as of this morning nobody outside the negotiating rooms can read a single one of them. This is now established rather than suspected. A law-firm analysis of the August 31 round states that the operative agreements “were not released, consistent with the administration's practice on the earlier deals”; that whether prices are benchmarked against NET or LIST prices “is not specified anywhere in official materials”; and that on the widely reported exemption from mandatory Medicare pricing pilots, “the fact sheet is silent on that point.” Trade coverage independently reports the details are “mostly thin on which of the companies' specific drugs are included… and the precise discounts.” Set against that a number that IS public: on the same day, one insurer announced it was removing prior authorisation from about 1,700 codes — roughly thirty per cent of its preapprovals — with the breakdown published by product line. The comparison is the lesson. One party made a commitment with a countable unit and a date; the other party made commitments whose content is not observable to anyone who might check. And the consideration flowing the other way is not vague at all: Section 232 tariff relief, which is specific, immediate and enforceable.",
      src: ["STAT","https://www.statnews.com/2026/09/01/trump-pharma-deals-analysis-latest-round-most-favored-nation"],
      concept: "Contract verifiability — why a promise nobody can observe is cheap, and what a party gives up by accepting one",
      q: "Set this up as a trade before you call it anything else. On one side of the table the government hands over tariff relief under Section 232 — a real, dated, legally specified thing worth money the day it lands. On the other side, twenty-six firms promise most-favoured-nation pricing. Ask the room to write down, in one sentence, what a firm would have to do tomorrow to VIOLATE its promise, and then ask how anyone outside would know. They will get stuck, and being stuck is the point: “net or list?” is not a technicality, it is the difference between a large concession and none at all, and it is not written down anywhere public. Now give them the vocabulary. A contract term is only worth what it costs to verify; a term nobody can observe is not a weak term, it is closer to no term. Ask why a firm would ever sign a specific, checkable commitment instead — and steer them to the insurer's 1,700 codes, which is checkable precisely because it is countable, and which the insurer chose to make countable. What does the countable party get for that? Reputation, mostly, and the ability to be believed the next time. Then close on the asymmetry, and do not soften it: the enforceable thing was handed over immediately, the unobservable thing was promised. Ask whether that is a bargain either side would have accepted if the observability ran the other way — and whether the eighty-nine per cent figure, which is the number everybody repeats, actually tells you anything about what was bought." },
    { story: "Dolly Parton died on August 25 and the demand shock that followed has now completed its arc — and the two ways of measuring it give opposite answers, which is the whole exercise. On kworb's per-track Spotify history for “9 to 5,” the GLOBAL series runs: August 26 at number two on 3,948,267 daily streams, the peak; then 20th on 2,478,146; 30th on 2,163,312; 49th on 1,852,812; 82nd on 1,394,444; 153rd on 1,249,374 — and by September 1 the track has fallen OFF the tracked global chart entirely. Six days from near-number-one to gone. That matches the baseline this desk spent a week establishing: before she died, “9 to 5” essentially did not chart globally at all, its last appearances anywhere being Sweden at number 173 in June 2026 and Sweden at number 73 last New Year's Eve. Global demand returned to where it started. The UNITED STATES series, over the same days, does something else: number 3 on 1,149,897, then 4th on 957,012, 6th on 826,733, 14th on 622,284, 23rd on 545,926, and on September 1 still 33rd on 489,532. Still charting, still ten times its ordinary level, and — read the day-over-day declines, which run minus seventeen, minus fourteen, minus twenty-five, minus twelve, minus ten per cent — DECELERATING. A caveat this desk owes: its own record carried 1,450,520 global for August 31 where today's read of the same page gives 1,249,374, so one of the two transcriptions is wrong and neither is being smoothed over.",
      src: ["kworb (9 to 5: Spotify chart history, global and US daily series)","https://kworb.net/spotify/track/4w3tQBXhn5345eUXDGBWZG.html"],
      concept: "Transitory versus persistent demand shocks — and how aggregation can hide the only signal that survives",
      q: "Put both series on the board without saying which is which. Call them A and B, give them the six daily numbers each, and ask the room to describe what happened. They will say A collapsed and B is settling. Now reveal that A and B are the same song in the same week, measured globally and in one country. Ask what could make those diverge, and hold out for the good answers rather than the first one. The obvious mechanism is that the shock was culturally concentrated — she is an American institution, and the rest of the world was briefly curious and then was not. But push for the second mechanism, which is a measurement artifact and matters more: the global chart is a RANKING, and a track can hold its streams and still fall off it if everything around it is bigger. Ask them to check whether that is what happened here, using the numbers — global daily streams did fall by more than two-thirds, so no, the collapse is real. Good; now they have learned to test an artifact instead of assuming one. Then the economics. A transitory shock decays to the old equilibrium; a persistent one shifts it. Ask which this is, and make them commit before you point at the deceleration in the US column — falling by ten per cent a day instead of twenty-five is the shape of something finding a floor, not the shape of something vanishing. Finally, the honest ending: nobody yet knows whether the American floor is above the old baseline, because the data stop on September 1. Ask what they would need to see, and how long they would have to wait, to answer it — and let them notice that “wait three more weeks” is a perfectly good scientific answer that no press cycle will ever give." },

  pulse: [
    { cat: "Listening", t: "Ella Langley's twenty-week Hot 100 record is real, the twenty-first week is not due until Monday — and this desk has been calling the song by the wrong name",
      why: "The correction first, because it is the kind that quietly ruins a classroom example. The record-setting song is “Choosin' Texas.” It is not “You Look Like You Love Me,” which is a separate Langley–Riley Green duet that topped Country Airplay back in December 2025 and is old news. Three independently dated outlets confirm the twentieth consecutive week at number one, breaking on August 31: the second song in American chart history to reach twenty weeks at the summit, behind only Mariah Carey; the sole non-holiday record holder, past the nineteen-week tie shared by “Old Town Road” and “A Bar Song (Tipsy)”; and the first woman to top the Hot 100, Hot Country Songs and Country Airplay simultaneously. The twenty-first week has not been decided, and the reason is a calendar rather than a silence: Billboard's recap cadence on this record has run Monday to Monday all summer, so the verdict is due around September 7. Billboard's own site returns a paywall error, so all of this comes via Whiskey Riff, the Washington Times and the Music Universe rather than the source.",
      rec: "The useful classroom fact is not the record, it is that undergraduates in 2026 are running a country song to twenty weeks at number one — a genre most faculty assume they have no relationship with. Ask a class to explain the mechanism before you offer one, and listen for whether they reach for playlists, for short-form video, or for the specific thing that makes a long run possible now: a song does not have to be bought again each week to keep charting, so persistence has become cheap in a way it never was on the singles chart. If you want the harder version, ask them why the number-one slot is stickier than it used to be and whether that makes the chart more or less informative than it was in 1999. Do check the title before you say it aloud.",
      src: ["Whiskey Riff (Choosin' Texas becomes the second song in American history to spend 20 weeks at number one)","https://www.whiskeyriff.com/2026/08/31/ella-langleys-choosin-texas-becomes-the-second-song-in-american-history-to-spend-20-weeks-at-1-on-the-billboard-hot-100/"] },
    { cat: "Watching", t: "The GTA 6 trailer is now sixth-day-old news on Netflix, and the two available measures of its decline are measuring different things",
      why: "Netflix's own global average-daily-rank series has the twenty-six-minute Extended Look at 1.0 on day one — effectively a clean sweep of national number-one slots — then 2.6 by August 30, 3.5 by the 31st and 4.3 by September 1, fourth in the United States. Independently, FlixPatrol's points-based worldwide chart has it third among films on September 2, behind two other titles. Those are not the same number and should not be averaged: one is an average of national ranks, the other is a weighted points score, and a title can move up on one while moving down on the other. Cumulatively it stands at 31.1 million views and number one in 87 of 93 countries at peak, with Netflix describing the pattern as “front-loaded,” “similar to Netflix's boxing events.” A Deadline headline calls it Netflix's most-watched weekly title, which is a stock against everything else here being a flow — not a contradiction, just a different question.",
      rec: "This is the cleanest stock-versus-flow example that will land in a lecture hall all term, because the object is one everybody in the room has an opinion about. Give them the four daily rank figures, the 31.1 million cumulative and the “most-watched weekly title” headline, and ask which of the three a journalist should lead with — then ask what each one would let you conclude about whether Netflix got its money's worth. There is no correct answer, which is what makes it worth the ten minutes. The trap to name explicitly: the 475-million figure that circulates on search is Trailer 2 from May 2025, not this.",
      src: ["What's on Netflix (31.1 million views and the day-by-day rank decay)","https://www.whats-on-netflix.com/news/top-10-reports/grand-theft-auto-6-extended-look-netflix-top-10-viewership/"] },
    { cat: "Watching", t: "Spider-Man has NOT crossed $900 million domestic yet — and the headline saying it has is two weeks old",
      why: "Brand New Day stood at $893.7 million domestic as of September 1, needing about $6.3 million more for the round number, with recent dailies of $10.01m on August 29, $6.96m on the 30th and $1.92m on the 31st. Worldwide it is at $2.33 billion, of which $1.44 billion is international. The all-time domestic record it is chasing is Star Wars: The Force Awakens at $936.66 million, so the gap is $142.66 million and about two more weeks — not days. Worth flagging as a live trap: a headline reading “$900M Locked” surfaces high in search and turns out to be an August 19 article written when the film was at $794 million. This is the ordinary way a projection becomes a fact in aggregation — nobody lied, the date just fell off.",
      rec: "When the record does fall, essentially every outlet will call it the biggest film ever in America and essentially none will adjust for ticket prices. That is the opening. Ask what a 2015 dollar and a 2026 dollar have in common, let somebody reach nominal versus real, and then ask what the honest comparison would be — admissions, on which Gone with the Wind still leads and will keep leading. If you want a second beat, ask why the industry prefers the nominal measure, and let them work out who benefits from a record that resets every few years.",
      src: ["Box Office Watch (Brand New Day: $893.7m domestic, $2.33bn worldwide)","https://boxofficewatch.com/movies/spider-man-brand-new-day"] },
    { cat: "Reading", t: "Dungeon Crawler Carl's eighth book took number one on two New York Times lists at once — a series that exists because its author gave it away first",
      why: "Matt Dinniman's A Parade of Horribles, the eighth Dungeon Crawler Carl book, hit number one on both the Combined Print & E-Book Fiction list and the Hardcover Fiction list simultaneously. This is the endpoint of a distribution path that runs almost entirely outside publishing: serialised on Royal Road, then Kindle, then audio through Soundbooth Theater with a narrator readers follow as closely as the author, and only then into hardcover through a traditional house. Alongside it, Book Riot's Tuesday clock ticked exactly on schedule again — the September 1 roundup carrying seventeen titles including a reissue of Octavia E. Butler's Survivor, Marlon James's The Disappearers and Emily Wilson's Crossing the Wine-Dark Sea, followed by a separate young-adult roundup on September 2. The weekly bestseller compilation had not posted a September edition at time of checking, which is the limit of the check rather than an absence.",
      rec: "Ask a class why an author would post a book for free, chapter by chapter, for years, and then sell it. The first answers will be about marketing, and they are not wrong but they are shallow. Push toward the real structure: free serialisation is how an unknown author buys information — about whether the thing works, about which readers stay, about how big the audience actually is — and the price of that information is the revenue forgone. Then ask who bears the risk in the traditional model and who bears it here, and let them notice that the author moved the risk onto themselves and kept the upside. If somebody in the room reads LitRPG, hand them the floor; they will explain the audio-narrator economics better than you will.",
      src: ["Book Riot (new releases for September 1, 2026)","https://bookriot.com/listen/new-releases-and-more-for-september-1-2026/"] },
    { cat: "Online", t: "The payment-processor story that reshaped what four platforms will host has now gone six days without a document — and the last real one is from July 2025",
      why: "This is a report on the state of a check rather than a new development, which is the honest thing to file. Over the last year card networks and processors have pushed adult and explicit material off Steam, itch.io, Gumroad, Tumblr and Wattpad, with a Kotaku explainer adding OnlyFans; Archive of Our Own, which takes no payments for content, is the control case that has not moved. itch.io restored free adult games and left PAID ones delisted, and developers worked around it by setting prices to zero — which is the single most legible fact in the whole story, because it shows the constraint was never the content. Six days of checking now produce nothing new: the only itch.io policy document that surfaces remains the original NSFW update of JULY 24, 2025, the community thread most often cited is archived with its last post in September 2025, and no processor has made a statement, no further platform has folded, and no regulator has shown interest.",
      rec: "This is the best available illustration of a chokepoint that is not the government and not the platform. Ask who actually decided what these sites may host, and let the room work backwards from the storefront to the platform to the processor to the card network — four layers, of which only the first two are the ones anybody argues with online. Then the sharp question: developers relisted by setting the price to zero. If a rule can be satisfied by charging nothing, what was the rule actually regulating? Students who have never thought about payment rails will get there in about four minutes, and they will not forget it.",
      src: ["Kotaku (the platform sequence, and Archive of Our Own as the case that did not move)","https://kotaku.com/archive-of-our-own-wattpad-smut-ban-fanfiction-2000726632"] },
    { cat: "Playing", t: "Onimusha returned this week to an 85 built on eighty-three reviews, while Moonlighter 2 sits at 76 built on seven — and even the release date is in dispute",
      why: "Onimusha: Way of the Sword launched to a Metascore of 85 from eighty-three critics on PS5, with IGN at a perfect ten — “nothing but move and counter move, sword clashing against sword” — and Eurogamer at four out of five. Moonlighter 2: The Endless Vault, out a day or two earlier depending on platform, has moved from a Metascore of 76 on four reviews to 76 on seven, and its user score still had not appeared despite an embargo that was supposed to lift at noon Pacific on September 2. One live discrepancy worth carrying rather than resolving: this desk had Onimusha down for September 3, and Nintendo Life dates it September 4 — possibly a regional or platform variance, possibly an error, unsettled either way.",
      rec: "Play the two Metascores against each other before you say anything about statistics. Ask which game is better, wait for somebody to say Onimusha because 85 beats 76, and then reveal the sample sizes — eighty-three against seven. The gap in confidence is enormous and completely invisible in the presentation, which shows a two-digit integer in both cases. Then ask what would have to happen for the 76 to move to 82, and how many reviews the 85 would need before it could move at all. If the room is quantitative, this is a five-minute standard-error demonstration with an object they actually care about; if it is not, it is still the single most useful thing you can teach them about reading any aggregate rating, including the ones on their own course evaluations.",
      src: ["Nintendo Life (the Onimusha review round-up: 85 from eighty-three critics)","https://www.nintendolife.com/news/2026/09/round-up-the-reviews-for-onimusha-way-of-the-sword-are-in"] }
  ],
  classnote: { t: "Two games launched this week with scores that look like they belong on the same scale and do not, and the gap between them is the most teachable thing in the youth-culture column this morning. Onimusha: Way of the Sword carries a Metascore of 85, computed from EIGHTY-THREE critic reviews. Moonlighter 2: The Endless Vault carries a 76, computed from SEVEN — up from four when it launched, which is itself informative, because it means the number moved as the sample grew. Both are rendered identically: two digits in a coloured box. Neither carries a confidence interval, an n, or any visual signal of how much weight it can bear. Now make it economics rather than statistics. A review aggregate is a device for turning many private opinions into one public signal, and its whole value is that a consumer can act on it without reading anything. That value depends entirely on precision, and precision depends on n — but n is precisely the quantity the interface hides. So the aggregate is most confidently consumed exactly when it is least reliable: at launch, on the day the purchase decision is actually made, when four or seven people have played the thing. Ask a class who benefits from that timing. A publisher launching a game with genuine word-of-mouth wants to wait; a publisher launching a weak one wants the buy to happen in week one, before the sample fills in. That is why review embargoes exist, why they lift when they lift, and why Moonlighter 2's user score being late is not a technical hiccup but a decision somebody made. Then push to the general case, because your students are already living in it: a professor's course evaluation with nine responses and one with two hundred are printed in the same font. So are restaurant ratings, seller ratings, and every hotel they will book this year. The question to leave them with is not “is 85 better than 76” — it is what a rating system would look like if it were designed to communicate uncertainty rather than to conceal it, and why essentially none of them are.",
    src: ["Pure Xbox (Moonlighter 2's Metascore, and the review count moving from four to seven)","https://www.purexbox.com/news/2026/09/roundup-the-first-reviews-have-dropped-for-moonlighter-2-ahead-of-xbox-game-pass-launch"] },

      { t: "EXPERIMENT: psychedelics may cause slight personality changes, but other factors play a big role — Volkmann, Seitz et al., Charité, npj Mental Health Research. 102 first-time users against 1,066 never-users from 9,351 respondents; after confound adjustment the effect is NOT distinguishable from chance. A null result, published as one", u: "https://www.psypost.org/psychedelics-may-cause-slight-personality-changes-but-other-factors-play-a-big-role/", d: "2026-09-01" },

      { t: "⭐ THE COMPOUND IS NAMED AND THE PERMALINK IS CAPTURED, closing yesterday's declared gap. EXPERIMENT (animal): the “little-known psychedelic compound” is DOI, 2,5-dimethoxy-4-iodoamphetamine. Michael Fiorillo and Javier González-Maeso, BMC Neuroscience — the SAME VCU laboratory as the Aug 12 Science Signaling paper, a different compound. Low-dose DOI 24h before an immune challenge cut hippocampal IL-6 and TNF-alpha at four hours; pre-treated mice held normal movement and regained weight faster; the IL-6 effect is partly 5-HT2A-dependent. “Higher levels of the inflammatory cytokine interleukin-6 matched up with increased passive behavior.” Stated limitations: a single acute trigger rather than chronic inflammation, whole-hippocampus rather than cell-type-resolved analysis, male mice only, and central-versus-peripheral mechanism unresolved", u: "https://www.psypost.org/a-psychedelic-compound-primes-the-mouse-brain-to-resist-severe-inflammation/", d: "2026-08-31" }

    "psyroll": [
      { t: "EXPERIMENT: psilocybin therapy shows strong potential for treating cocaine addiction — Hendricks, Lappan, Shelton et al., University of Alabama at Birmingham, JAMA Network Open. n=40, psilocybin+CBT against an ACTIVE placebo; ~28 more abstinent days per 100 in the final three months and 30% at full 180-day abstinence against 0%. STATED LIMITATION: 90% of psilocybin recipients correctly guessed their assignment", u: "https://www.psypost.org/psilocybin-therapy-shows-strong-potential-for-treating-cocaine-addiction/", d: "2026-09-02" },
      { t: "⭐ THE BEST ITEM ON THIS SHELF IN WEEKS, and it is a consciousness result wearing a psychedelics coat. EXPERIMENT (human): Mona Irrmischer and Marco Aqil, with Robin Carhart-Harris and Christopher Timmermann among the authors, Journal of Neuroscience — n=27, within-subject intravenous DMT against saline placebo, EEG before and 20 minutes after. DMT shifted theta, alpha and beta away from CRITICALITY toward randomness, pushing alpha and beta into an inhibition-dominated SUBcritical regime, and the correlation is the finding: “the further the alpha and theta brain waves shifted away from criticality, the more intensely the participants felt their sense of self disintegrate.” STATED LIMITATION, unusually candid: EEG mainly captures slow oscillations, and the authors SPECULATE that faster ones might move the opposite way, toward an overactive regime that could account for vivid imagery — explicitly speculation, and not published here as a result", u: "https://www.psypost.org/how-dmt-alters-brain-waves-to-induce-the-loss-of-self/", d: "2026-09-01" },
      { t: "⭐ THE SECOND CAPTURED PERMALINK, and a caveat that matters enormously for how it will be misread. EXPERIMENT (animal): Sandra Siegert and Alessandro Venturino, Institute of Science and Technology Austria, Science Advances — SURGICAL-GRADE ketamine anaesthesia, explicitly NOT psychiatric dosing. In female mice only, four hours on: microglial activation markers up, post-anaesthesia electrical activity up, corticosterone about three times baseline, Fkbp5 selectively upregulated in microglia. What lifts it above correlation is the manipulation — removing the adrenal glands ERASED the female-specific effects and injecting corticosterone RESTORED them. Limitations: mouse-only, a single four-hour timepoint, and anaesthetic rather than therapeutic dosing", u: "https://www.psypost.org/stress-hormones-drive-female-specific-brain-rewiring-following-ketamine-anesthesia/", d: "2026-08-31" }

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}

  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
</script>
