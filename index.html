<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "The American answer came at noon yesterday, and it was a second round of strikes inside Iran. This is the question the desk was watching for and it resolved within a day. At twelve o'clock Eastern on Tuesday, US Central Command posted that “US forces began striking Islamic Revolutionary Guard Corps (IRGC) targets in Iran,” citing “recent attempted attacks by the IRGC against commercial shipping in the Strait of Hormuz and US service members.” Explosions were reported at Bandar Abbas, at Sirik, on Qeshm Island and in areas near the Gulf of Oman. Trump, on Truth Social, tied the strikes to both the mine-laying attempt and the Jordan base attack and told Iran to “Be More Worried About What Comes Next.” He also framed part of it as pre-emptive: “They tried to rebuild their radar because they can't see anything. We waited until it was almost built and then we hit it,” adding that “an agreement with them isn't worth the paper it's written on.” Separately CENTCOM knocked down an Iranian claim that a supertanker had struck mines in the southern Hormuz route: “No ships have hit mines in the Strait of Hormuz. This is FALSE,” calling it “an IRGC attempt to intimidate regional commercial shipping through disinformation.” Three things firmed up around it. The Larak casualty figure now has a second independent lineage — GlobalSecurity's own Day 186 log says two were killed and several wounded, matching The New Arab, while IranWire reports Tasnim revising its count to three after one of the injured died in hospital. The United Arab Emirates drone discrepancy resolves toward the smaller account, and it resolves on the record: the UAE Ministry of Defence called reports of an attack on Al Minhad “false” and urged the public to “refrain from circulating rumours,” confirming only a single drone intercepted over territorial waters on approach from Iran. Iran's army statement still claims dozens at the airbase and has not walked it back. And the Jordan interception count is now told three ways rather than two: eight intercepted with two Jordanian security sources telling ABC that some were not; Trump saying all eight were shot down; and the Times of Israel saying Jordan intercepted ten of thirteen ballistic missiles with three landing in unpopulated areas. Whether that last is a revised recount or a separate wave could not be established. One further casualty report, single-sourced and printed as such: an Iranian official says two were killed when a US strike hit a residential home during a wedding in Hormozgan province.",
        s: [["RFE/RL (CENTCOM confirms new strikes on IRGC targets inside Iran)","https://www.rferl.org/a/iran-live-blog-trump-middle-east/33803414.html"],["Al Jazeera (the UAE intercepts a drone and denies an Al Minhad attack)","https://www.aljazeera.com/news/2026/8/31/uae-intercepts-drone-after-us-and-iran-exchange-attacks"],["IranWire (Tasnim revises the Larak toll to three)","https://iranwire.com/en/news/156997-us-strike-on-larak-island-kills-three-irgc-personnel/"],["GlobalSecurity (Iran War Day 186 log)","https://www.globalsecurity.org/military/ops/iran-war-oprep.htm"]] },
      { t: "The Hormuz day-logs kept their offsets, the insurance figure is now precise enough to teach from, and the same log that carries the war also missed the war. Take the counts first. GlobalSecurity calls September 1 Day 186, Windward via global-energy-flow Day 185, straits.live's homepage Day 184 — each exactly one higher than yesterday, offsets preserved for a fourth consecutive run, which is what makes the spread readable rather than confusing. A cached search snippet showed straits.live at 185 against the homepage's 184; the homepage is the one printed here, consistent with this desk's standing rule about that site's internal inconsistency. Now the number worth carrying into a classroom. The war-risk premium on a Hormuz transit is quoted at forty times the pre-crisis rate, the transit premium on a very large crude carrier is about ten million dollars a voyage, and six protection-and-indemnity clubs have withdrawn coverage entirely. That is a far more specific mechanism than the political one, and it explains what the political one cannot: the Iran-Oman corridor has now stood open on paper for an eighth day with no vessel through it. Deputy Foreign Minister Kazem Gharibabadi's framing is the political half and is worth having verbatim: Iran “has reached an understanding with Oman regarding arrangements for passage through the Strait of Hormuz, but this understanding will not automatically enter the implementation phase,” which “requires commitments to be fulfilled by the other side, especially the United States”; Iran is “in no hurry to reopen the strait”; and if a vessel does pass, “it will do so with the coordination and authorization of the Islamic Republic of Iran.” On volumes the three-way split holds and has gained precision at one end: the Energy Secretary at about nine million barrels a day through the strait and fifteen million across the Gulf including pipelines; GlobalSecurity now at 6.92 million as a twenty-eight-day average against about twenty million before the war; Barclays at about three million for the week ending August 7. The Windward page's own words on the Secretary's figure are worth quoting because they are unusually honest for a data provider: it “sits well above independent flow estimates,” a gap the page “is not resolving in either direction.” New alongside them, and not merged with them: Kpler counts between seven and forty-three vessels a day against eighty-four to a hundred and forty before the war, and CENTCOM says it has aided the passage of 660 million barrels since May, a cumulative figure that reconciles with none of the daily ones. Finally, a warning about the log itself. GlobalSecurity's Day 186 entry states that no US strike on Iranian territory was reported in the twenty-four hours to its September 1 cutoff — which the confirmed noon strike contradicts outright. This is the second consecutive day that log has been behind the wires on strike activity, after it recorded a thirty-first consecutive quiet night on the day of the Larak strike. It remains excellent for day-counts and throughput and unreliable for whether anything happened.",

      { t: "Overnight in Ukraine: a fresh package, a new region hit, and a Kyiv toll that grew all day on a single unchanging URL. The night of September 1 into 2 brought 174 attack drones — Shahed types, S8000 Banderol, Gerbera and Parodiya decoys — plus two Iskander-M ballistic missiles and two Kh-59/69 guided missiles, 178 in all, of which Ukraine downed or jammed 141. Hits were recorded at sixteen locations; Odesa reports eight injured; three warehouses burned in the Kyiv region. And a genuinely new location rather than an update to an old one: an industrial facility in Poltava region was struck, with no casualties reported. Now the number this desk has to correct itself on, and the mechanism behind it is worth naming. Yesterday's brief carried Euronews' “at least four killed” alongside Ukrainian Railways' seven at the Kyiv depot and said the two did not reconcile. Overnight the same Euronews URL cycled through three different headlines without changing address, and now reads that a massive missile and drone attack on the capital region killed at least twelve — seven in Darnytskyi district, one in Holosiivskyi, three in the surrounding region, which sums to eleven against a stated twelve, an arithmetic gap this desk records rather than smooths. Meduza's Russian service independently says more than ten died. So the depot's seven has not moved, and Euronews was not contradicting it but counting a wider area on a slower clock. A live-updated liveblog is not a fixed source, and yesterday's apparent conflict was partly an artifact of reading one at a moment. Ukrainian Railways chief executive Oleksandr Pertsovskyi's figure stands: “The ballistic strike claimed the lives of 7 people, 6 of whom were our employees,” with one more hospitalised. UNN separately counts thirteen injured in Kyiv across September 1, nine of them hospitalised. On Myla, a partial resolution: a fresh read of the Kyiv Post's own page confirms 38 dead, 20 injured including two children, and four missing — so the Kyiv Post side of the twenty-versus-fifty-two injury split is confirmed, while Ukrinform's fifty-two did not resurface today and the discrepancy stays open. Prime Minister Serhii Koretskyi calls the depot blast “criminal negligence,” citing an earlier ammunition detonation at Vyshneve that was not learned from. Zelensky puts the week's totals at roughly 2,000 attack drones, more than 1,600 aerial bombs and 31 missiles, and on Myla says pyrotechnic units “are working around the clock to detect and neutralize unexploded ordnance scattered across the highly contaminated area.” Russia's Ministry of Defence again publishes a window that must not be merged with anyone else's: 109 fixed-wing Ukrainian drones claimed downed between eight in the morning and eight at night Moscow time, across eight named regions and the Black Sea. And the Mediazona and BBC Russian Service named count is unchanged at 242,750 as of August 28, with officers at 7,596 and fifteen generals.",

      { t: "The ISW lag closed, three sources independently describe the same tactical shift, a sixth account of the Ratcliffe trip arrives with an operational detail nobody had — and one of this desk's own claims about a source has to be withdrawn. Start with the plumbing, because this desk has spent three runs establishing that a missing same-day assessment was a publication schedule rather than a search failure, and today the schedule caught all the way up. Both the August 31 and the September 1 assessments are live, the latter at Kyiv Post ID 83536 posted at four minutes past eight this morning, which is the ID band predicting correctly a fifth time. The September 1 assessment reads: “Neither Russian nor Ukrainian forces advanced on September 1.” It finds Russia's rate of advance marginally increased across August while breakthroughs stayed limited, and that Russia “continued to suffer a high casualty rate in August 2026 for the second month in a row, paying an increasingly high price for limited battlefield gains.” Its most useful line is a tactical one, and it is corroborated three separate ways today rather than asserted once: ISW says Russian forces are “shifting their strike tactics to maximize civilian harm by leveraging jet-powered drones over slower and less effective piston-engine-driven drones”; Meduza's English service published a feature this morning on why the jet-powered Geran drones are so hard to shoot down and what Kyiv's falling interception rate implies; and Meduza's Russian service described a shift from nightly strikes to near-round-the-clock ones. Three institutions, one finding, arrived at independently. ISW also notes Putin conducted a substantial reshuffle within Russian law enforcement on August 31 and is augmenting the force responsible for his personal safety. On the American channel, CBS News supplies a sixth framing of the Ratcliffe visit, and unlike the previous five it comes with a mechanism attached. Peskov confirms the meeting happened, says Ratcliffe did not meet Putin “though the president was briefed afterward,” and says it was too soon to predict whether it might pull the relationship out of what he called a deep crisis. Read carefully, that is consistent with rather than contradictory to his earlier flat denial, which this desk has twice warned denies only a Putin meeting. The new detail is the one worth keeping: CBS reports the United States asked Ukraine to suspend strikes for the duration of the delegation's presence in Moscow. The five earlier accounts of the trip's purpose remain unadjudicated and this desk still adjudicates none. Witkoff and Kushner make a thirteenth consecutive day with nothing verifiable — the newest item anywhere is a Bloomberg headline of August 14. Two traps caught and discarded rather than published: a Fox News piece on the CIA director and Russia's spy chief holding a first phone call in more than two years is dated March 12, 2025, and a Kommersant peace-plan article that looked timely is January 9, 2026. On the summitry, the Putin-Pezeshkian meeting did happen on September 1 at Bishkek, exactly as this desk forecast after correcting itself yesterday for reporting it a day early, and its readout is real but thin. Putin: “Russian-Iranian friendly relations are steadily developing in all areas, in accordance with the letter and spirit of the Comprehensive Strategic Partnership Treaty.” Pezeshkian: “Our relations are strategic… We are confident that in this way we can resist the United States and all the sanctions they impose against us.” No new agreement, no deliverable, and — the point of yesterday's correction — no revival of the year-old Rosatom figure anywhere in the coverage. Distinguish that from a non-event, as this desk has been trained to: the meeting occurred and produced a readout, and it produced no outcome. The same distinction applies to Power of Siberia 2, where a fresh search returns nothing after the May 20 Beijing meeting at which the two sides failed to agree a timeline or a price. The Kremlin's own event listing confirms Putin travels to the Far Eastern Federal District today and tomorrow for the Eastern Economic Forum, with the plenary on the third. Now the withdrawal, and it is a real one. On Sunday this desk reported that Jeffrey Sachs had broken a seven-day silence with a piece titled “NATO's New Plans To Destroy Russia,” dated August 30, and treated it as a lesson that a multi-day negative streak is a flag to re-verify rather than extend. Today that claim could not be independently confirmed at the article level: a direct fetch of jeffsachs.org lists nothing newer than October 2025, and the only match for the title is a video and channel listing rather than a dated permalink on his own site. The general lesson survives; this instance does not, and it is retracted here rather than left to stand. From the other benches: Sonar21 published four consecutive days, August 28 to 31, with nothing yet in September, and the guest-versus-masthead rule still applies. Diesen's search ordering misled again in three more cases now dated at the article page — a Jennifer Kavanagh piece is August 2, a Larry Johnson guest post is August 4, and a Lawrence Wilkerson piece that reads as maximally current is JUNE 9. Mearsheimer's “The Iran Roller Coaster” could not be opened at all, the domain returning its familiar rate limit, so its May 27 date rests on a cross-reference rather than the article page; this desk labels that rather than laundering it. And a small plumbing win: Responsible Statecraft's Iran tag listing does not contain the May 18 piece that ranks so high on current queries, which confirms that item is a homepage-ranking artifact rather than part of the live feed.",

      { t: "Everything fell on Tuesday, the ten-year printed its highest since January 2025, and one of this desk's open discrepancies closed cleanly. The closes first, each checked arithmetically against Monday because that is the test that catches a stale or intraday number. The S&P 500 closed at 7,631.47, down 54.56 or 0.71 per cent. The Dow closed at 52,766.88, down 418.31 or 0.79 per cent. The Nasdaq Composite — naming the index, as always — closed at 26,099.77, down 271.12 or 1.03 per cent, and that one subtracts from Monday's 26,370.89 to the penny. The Russell 2000 closed at 2,920.13, down 36.32 or 1.23 per cent, the worst of the four. So the selling broadened rather than narrowed: on Monday the Dow led the decline and the Composite barely moved; yesterday the Composite and the small caps led it. The ten-year Treasury closed at 4.796 per cent, described as its highest since January 2025, up from about 4.75 on Monday. On the VIX there is both a resolution and a new range. Yesterday's brief published August 31 as an unsettled 14.9-to-15.3; Yahoo Finance's historical table now gives that close as 14.92, up 0.49 or 3.40 per cent from Friday's 14.35, which settles it in favour of the lower read and against the live-blog snapshot. For Tuesday itself no exact settle could be found: the index closed below 15 on Monday, rose as high as 16.80 during Tuesday and pared into the afternoon to finish above 16. That is published as a description rather than a number. The cause is not in doubt and it is the same one driving the geopolitics column. Brent this morning is quoted at $94.847 on TradingEconomics' live panel, up 0.21 per cent, against $94.68 and 0.03 per cent in the same page's narrative text — the daily panel-versus-narrative split, printed both ways as always. That page attributes the move to escalating US-Iran tensions around the Strait of Hormuz and puts Brent up 13.02 per cent over the month and 40.06 per cent over the year. It was $92.07 on Monday. So a war that has destroyed no terminal and no tanker has moved the oil price forty per cent in twelve months and taken the equity market down across all four indices in a session.",
        s: [["Investrade (market review, September 1: closes, the ten-year and the VIX range)","https://investrade.com/market-review-september-01-2026/"],["Alain Guillot (an independent close-of-day recap for September 1)","https://www.alainguillot.com/stock-market-recap-september-1-2026/"],["TradingEconomics (Brent, September 2: live panel against narrative text)","https://tradingeconomics.com/commodity/brent-crude-oil"],["Investing.com (Fed Rate Monitor, stamped Sep 01 07:25 AM EDT)","https://www.investing.com/central-banks/fed-rate-monitor"]] },
      { t: "ISM missed, JOLTS was flat, New Zealand hiked back to back, and the digital ruble's second day is as dark as its first. Yesterday's two prints both landed after the last brief was written, which is exactly why the desk's standing rule is that a deadline-day brief is a preview and the day after is where the result lives. ISM manufacturing came in at 54.6 per cent for August, down a full point from July's 55.6 and missing the 55.2 consensus — but still an eighth consecutive month of expansion, and the sub-indices are where the interest is: new orders 53.7, down 3.0; production 58.3, essentially flat; employment 51.2, down 1.6; and prices paid 71.1, exactly unchanged from July and below the 72 consensus. Chair Susan Spence of the survey committee: “the manufacturing sector expanded in August for the eighth consecutive month,” and “the overall economy continued in expansion for the 22nd month in a row.” Her most quotable line is the one that cuts against the headline number: “In August, 42 percent of the comments were positive and 58 percent negative.” JOLTS for July, from the Bureau's own release: job openings 7.3 million, hires 5.1 million, quits 3.1 million, layoffs and discharges 1.7 million, with the Bureau's own framing that openings “was little changed” and that hires and total separations “both changed little.” A flat labour-demand print with prices paid stuck at 71.1 is not an obvious argument for either side of the Fed's September question, and the odds barely moved: Investing.com's rate monitor, cleanly stamped as updated at 7:25 in the morning on September 1, puts a hike to 3.75-4.00 per cent at 64.4 per cent against 35.6 for a hold — consistent with the above-65 close on Monday and, importantly, not a fresh Wednesday reading, which cannot exist before the session opens. Today's calendar: ADP at 7:15 Eastern with a 48,000 forecast against 44,000 prior, factory orders at nine with plus 0.7 per cent against minus 0.3, EIA crude inventories at 9:30, and the Beige Book at one. Friday brings the August employment report. Abroad, the Reserve Bank of New Zealand delivered a back-to-back hike, taking the official cash rate from 2.50 to 2.75 per cent at two in the morning GMT with Governor Anna Breman's press conference an hour later; that rests on a pre-decision preview plus two post-decision headlines rather than a single fully readable post-decision text, and is flagged accordingly. The Bank of Canada announces at 9:45 Eastern, consensus a hold, and nothing had posted at the time of writing. On Russia, one confirmation and one honest gap. The Bank of Russia's fixing effective September 1 is confirmed by direct fetch at 86.3793 to the dollar, 100.5714 to the euro and 12.8580 to the yuan — but the fixing effective today could not be obtained, the site still serving yesterday's page and a secondary source failing on an expired certificate, so no September 2 ruble figure is printed. Digital-ruble uptake remains entirely unreported on its second day, across three searches including a Russian-language one for first results; that is now a confirmed absence rather than an unchecked one. And a new detail on the fuel bans: alongside the gasoline ban to January 31, 2027 and the producer diesel ban extended to September 30, there is a jet fuel export ban running to November 30, 2026. Deputy Prime Minister Novak insists there is “no diesel shortage on the domestic market,” says the ban “could be adjusted depending on output growth,” and notes that “several refineries have completed maintenance and resumed supplying additional fuel volumes.”",
        s: [["ISM via PR Newswire (Manufacturing PMI at 54.6% for August)","https://www.prnewswire.com/news-releases/manufacturing-pmi-at-54-6-august-2026-ism-manufacturing-pmi-report-302865127.html"],["BLS (JOLTS, July 2026: openings 7.3 million)","https://www.bls.gov/news.release/jolts.htm"],["Investing.com (today's calendar: ADP, factory orders and the Beige Book)","https://www.investing.com/news/stock-market-news/adp-jobs-report-oil-inventories-and-fed-beige-book-due-wednesday-93CH-4884464"],["Bank of Russia (fixings, effective September 1)","https://www.cbr.ru/eng/currency_base/daily/"]] }
    ]},
    { h: "Health & policy", items: [
      { t: "The drug-pricing deals now cover eighty-nine per cent of the branded market, the terms are confirmed non-public by a named reporter, and the group that lost has a full roster and a quote. Three things advanced on the most-favoured-nation programme overnight, and all three sharpen rather than soften the reading. First, the White House's own fact sheet supplies a framing figure this desk did not have: the twenty-six manufacturers now in the programme are said to cover eighty-nine per cent of the branded drug market. It is worth noticing what that same fact sheet does not do — it does not name the benchmark countries, does not say whether the reference price is net or list, and does not mention the GLOBE and GUARD Medicare pilots at all. Those are three genuine unknowns, not three omissions this desk failed to look up. Second, and this is the confirmation that matters, STAT published a piece by Payne, Chen and Wilkerson yesterday whose accessible portion states plainly that “the details of the deals… aren't public,” and identifies as an open question whether the second-wave companies would avoid both tariffs and the mandatory Medicare pilots — with the White House declining to comment. That is a dated, on-the-record confirmation from working reporters that the terms are unavailable and the exemption question is unanswered, which is stronger evidence than this desk's own failure to find them. Third, the alliance that was passed over now has a full name and a full membership. The Midsized Biotech Alliance of America launched on February 25 with ten companies: Acadia, Alkermes, Alnylam, Ardelyx, BioMarin, Exelixis, Incyte, Madrigal, Neurocrine and Travere — six of which match the Reuters list this desk carried, with Acadia, Ardelyx, Exelixis and Neurocrine new to it. One flag: ten at formation sits against the eleven Reuters reported in February, and the desk does not pick. Spokesperson Alanna Temme's line is unambiguous — most-favoured-nation pricing “would destroy biotech innovation in this country” and “could wipe them off the map” — and the group's stated grievance is explicitly comparative, that its advocacy was hampered by AstraZeneca, Lilly, Novo Nordisk and Pfizer landing favourable terms first. Not one of the ten signed either round. And there is still no statement from the Alliance about being passed over on Monday; the February formation story remains the only on-record material. The Brookings comments on GLOBE and GUARD now have named authors — Richard G. Frank, Kristi Martin and Rachel E. Sachs — objecting to benchmark-setting methodology, mandatory manufacturer participation and inclusion criteria, and conflicting assumptions in the regulatory impact analyses. And a small item that says a great deal: a March law-firm client alert is headed “Congress Seeks Answers on Most-Favored-Nation Drug Pricing Agreements and Their Impact on Medicaid.” Congress cannot see the terms either.",
        s: [["STAT (Payne, Chen and Wilkerson: five burning questions, and the details aren't public)","https://www.statnews.com/2026/09/01/trump-pharma-deals-analysis-latest-round-most-favored-nation-drug-pricing/"],["STAT (nine more drugmakers sign)","https://www.statnews.com/2026/08/31/trump-most-favored-nation-drug-pricing-new-round-price-cuts-announced/"],["FierceBiotech (the Midsized Biotech Alliance of America forms with ten companies)","https://www.fiercebiotech.com/biotech/worried-mfn-will-destroy-biotech-innovation-midsize-biotechs-form-coalition-fight-back"],["Brookings (Frank, Martin and Sachs on the GLOBE and GUARD models)","https://www.brookings.edu/articles/comments-on-globe-and-guard-drug-pricing-models/"]] },
      { t: "Both dockets moved, the professional-society silence held a ninth day, and this desk owes a correction on Ebola that reverses its own finding. The dockets, with the timestamp discipline that makes them readable. The vaccine request for information is at 1,828 comments, up 193 from yesterday's 1,635, and it still exposes no comment-specific timestamp — the only stamp on the page is a page-views figure of 7,076 as of eight fifteen last night. So the count is demonstrably fresh, since a stale render would repeat 1,635 exactly, and its own vintage is still unstated. Two consecutive weekday readings now make the steady state legible: plus 135, then plus 193, against the weekend-adjacent plus 780. Call it 130 to 200 a day into the September 20 close, which the page itself puts at nineteen days out. The H-1B fee docket is at 5,432, up 353 from Monday afternoon's 5,079, closing in twenty-three days. One wrinkle worth recording because it changes how the number should be read: today's fetch attached the “as of 09/01/2026 at 4:15 pm EDT” stamp to the page-views figure rather than to the comment count, where yesterday the same stamp attached cleanly to the count. The time of day is identical, so the whole statistics block probably refreshes together once daily — but the desk cannot certify the comment count carries that stamp today and says so. The asymmetry that is the real story on this docket held a ninth day. The American Medical Association's own vaccine-access page is still dated July 30 and still makes no mention of docket HHS-OS-2026-0332 or of commenting on it, while the association is demonstrably busy elsewhere — statements on ACIP membership, an independent vaccine safety and effectiveness review system, amicus briefs joined by more than seventy-nine medical societies. The Academy of Pediatrics likewise has no docket-specific comment; its live fight is its own break from the CDC childhood schedule and its lawsuit, in which a court has now rejected the department's motion to dismiss. These organisations are fighting in court and in the press and not in the comment file, and nine days of consistency is no longer a coincidence. Measles is unchanged and the page renders correctly, so this is a plateau and not a failure: 2,903 confirmed as of August 27, 2,887 US residents across 47 jurisdictions plus sixteen international visitors, 37 outbreaks, and the outbreak-associated share now confirmed to the exact fraction, 2,737 of 2,903. Now the correction, and it is a reversal rather than a refinement. Yesterday this desk reported that the World Health Organization's Ebola page was a full month staler than the ECDC's and called the gap between two authoritative trackers the datapoint. The WHO had in fact already moved: Disease Outbreak News 615, published August 14 with data to August 12, puts the outbreak at 4,665 confirmed cases and 2,184 deaths, a 46.8 per cent case fatality rate, across 54 health zones in six provinces — up from 49 zones in five — and calls it in its own words the largest Ebola outbreak ever documented, exceeding the 2018-to-2020 outbreak's 3,317 cases, in a phase of intense transmission and expanding faster than any previous Ebola outbreak. The ECDC, last updated at five o'clock yesterday evening with data to August 30, is at 6,100 confirmed and 2,950 deaths, a rate near 48.4 per cent, with 1,383 recovered and 814 in hospital isolation. So the gap is real but it is about eighteen days rather than a month, and the desk was working from a superseded document. On the rural health reports, still nothing: no state has published and there is no new CMS statement. One phrasing correction there too — spokesperson Timothy Foster's verifiable words are that CMS “will publish an annual report on state progress,” and the further clause this desk has been carrying, that individual reports are shared only on request, could not be traced to a second Foster quote. STAT's Unraveled series has still not produced part three, six days after part two.",
        s: [["Federal Register (vaccine RFI: 1,828 comments, no comment-specific stamp)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["Federal Register (H-1B fee docket: 5,432 comments)","https://www.federalregister.gov/documents/2026/08/25/2026-17324/fee-for-certain-h-1b-petitions"],["WHO (Disease Outbreak News 615: 4,665 cases, 2,184 deaths, the largest ever documented)","https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON615"],["ECDC (6,100 confirmed and 2,950 deaths, data to August 30)","https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda"]] }
    ]},
    { h: "Campus & culture", items: [
      { t: "Michigan: this desk was wrong yesterday. The Kavanaugh application is real, it is at the United States Supreme Court, and the state's response is due at noon today. Yesterday's brief reported that an automated read asserting an emergency request to Justice Kavanaugh had been checked by a dedicated verification search, found to have zero corroboration in any outlet or docket, and discarded as a fabrication. That was the wrong call and it is corrected here rather than quietly dropped. The application exists at the Supreme Court's own docket as number 26A275, filed August 31 and titled “ACVM Emergency App for an Injunction Pending Appeal” — a primary source, not a summary. The campaign's own outlet confirms the sequel: “Americans for Citizen Voting files with SCOTUS; Kavanaugh Requests a Response by Noon on Wednesday.” Today is Wednesday. It is corroborated by the Detroit News on August 31 and by the Michigan Public Radio Network affiliates and a national wire on September 1. The one detail the desk was right about is small: the deadline is a response due at noon today, not an injunction by September 3, so the version that reached this page was garbled — but garbled is not invented, and the difference matters. The lesson the desk takes is not to loosen its verification standard but to note what actually happened: a single verification search that finds nothing establishes that the searcher found nothing, and on a filing less than a day old at a court whose docket is hard to reach, that is much weaker evidence of absence than it felt like. What is still unknown at five this morning is whether Michigan met the noon deadline, and whether Kavanaugh or the full Court has done anything. Nothing dated past September 1 exists on it. The state court remains the other half: as of Monday the Michigan Supreme Court had taken no action at all, not even to request a response, and today is the organisers' appeal deadline. The Board of State Canvassers still meets at ten on Friday to finalise the ballot, and how that relates to the September 19 certification deadline is stated nowhere and is not stated here. The underlying arithmetic is worth keeping in view: 709,841 signatures submitted against 446,198 valid required, and a thousand-signature sample review that moved 612 to 624 to 626 valid against a threshold of 629. Three short. Elsewhere: the University of Michigan Board of Regents did meet and did elect C. Cybele Raver as seventeenth president, reported by Michigan Public under the headline quote “She is the best person to lead our complex” — no vote tally surfaced, so no unanimity is asserted. And the Ypsilanti “Los Alamos” artifact is finally resolved, in a way that is half a vindication and half a rebuke. The actual file on the township's own server is named Resolution-No.-2026-05-Data-Center-High-Value-Target-Risk.pdf, so the resolution's title is “Data Center High-Value Target Risk” and does not contain the words Los Alamos — the filename rule was right. But “Los Alamos” is not invented either: the Michigan Advance ran “Ypsilanti Township board gives full support to resolution opposing Los Alamos research facility” on April 2, and ClickOnDetroit used the same phrase on August 12. It is real media shorthand for the project bleeding into summaries of the resolution. Cite the filename; treat Los Alamos as description, not title. One figure to flag rather than resolve: WXYZ puts the computing centre at $1.25bn where this desk has carried $1.2bn. On Ann Arbor public power there is still no appeal, and a new detail that supports the negative — a local outlet headlines the DTE-funded group's loss as the “first round,” which is not how anyone writes about a case already on appeal.",
        s: [["Supreme Court of the United States (docket 26A275, the emergency application as filed)","https://www.supremecourt.gov/DocketPDF/26/26A275/422446/20260831090954276_ACVM%20Emergency%20App%20for%20an%20Injunction%20Pending%20Appeal.pdf"],["Michigan Fair Elections (Kavanaugh requests a response by noon Wednesday)","https://www.mifairelections.org/post/breaking-news-americans-for-citizen-voting-files-with-scotus-kavanaugh-requests-a-response-by-noon"],["Michigan Public (the regents elect Raver)","https://www.michiganpublic.org/education/2026-09-01/she-is-the-best-person-to-lead-our-complex-u-m-board-of-regents-elects-new-president"],["Election Law Blog (the state court had taken no action; the Friday canvassers meeting)","https://electionlawblog.org/2026/michigan-ballot-measure-proponents-seek-supreme-court-emergency-review-of-state-decision-to-keep-voting-measure-off-the-michigan-ballot/"]] },
      { t: "Curricular practical training is now paused at ten universities, the August 12 memo has a corroboration older than the one this desk celebrated, and the hearing everybody has been arguing about is tomorrow. Two new institutions, both outside California and outside the East Coast privates the desk read as the pattern's second phase. The University of Pennsylvania paused on August 29; its international office director Rudie Altamirano: “Because Penn must apply federal eligibility requirements consistently across all of our schools, we've temporarily paused decisions on new and pending CPT requests while we conduct an expedited review of our academic programs and processes.” Northwestern followed on August 31 with, per its student paper's headline, a hold on curricular practical training requests “following federal guidance” — headline-confirmed, quote-unverified, since the site refused the fetch. That makes Berkeley, Irvine, Davis, San Diego, USC, Washington, Boston University, Rochester, Penn and Northwestern. More valuable than the count is a document find that quietly rebukes yesterday's framing. This desk called Boston University's August 28 notice the first third-party corroboration UC San Diego's account of an August 12 memo had ever had. It was not. The University of Colorado Boulder posted on August 20 — eight days earlier — stating verbatim that “On August 12, 2026, the federal government, through the Student and Exchange Visitor Program (SEVP), issued a Broadcast Message… limiting when an international student in F-1 status may be authorized for Curricular Practical Training.” Boulder's action is a restriction rather than a pause, permitting training “required for completion of the student's degree or major (not minor)” and leaving already-authorised autumn internships alone, which is why it did not read as part of the wave. The corroboration is therefore three-way, and it is older and more granular than the desk claimed. New from the department's side, and worth putting beside the memo language: Homeland Security now requires both that the employer have a partnership with the college and that all students in a programme — not merely some — be required to complete the internship in order to graduate. A departmental line, distinct from the “performative outrage” quote already on the record: “Schools and employers should consider themselves on notice: under President Trump, abuse of this generous system will no longer be tolerated.” And from the Chronicle's newsletter, the sentence that does the actual work: “In any instance where an elective course is optional, making the CPT optional, the integral and required aspects of CPT would not be met.” The underlying broadcast was located as a PDF on the immigration agency's own server and refused the fetch, so its full text still has not been seen by anyone here. The litigation date is resolved and it is the earlier one: the Presidents' Alliance's own case page, citing Judge Saylor's August 19 scheduling order, gives Thursday September 3 at eleven in Courtroom 1 — tomorrow — which supersedes the September 9 this desk flagged as a conflict and could not adjudicate. The same page confirms the plaintiffs are eight organisations including NAFSA and the Alliance itself, which settles the naming question, and that the government's response brief was due Monday without saying whether it was filed. The rule takes effect September 15. The declarations filed by fifteen institutions are the best cost evidence yet: Illinois Urbana-Champaign reports international applications down more than a quarter, with Chancellor Charles L. Isbell Jr. saying the university is committing personnel and administrative resources solely because of the rule; Grinnell puts ten million dollars of annual international tuition at risk and says its three-two engineering partnerships with Columbia and Caltech are threatened; Cornell's five-year architecture and four-plus-one programmes are at risk, with vice provost Wendy Wolford saying they will potentially reduce enrolment; Penn estimates half a million to a million in compliance and information-technology cost, Wisconsin-Madison six hundred thousand in legal and compliance; Maryland Baltimore says dozens of admitted students have withdrawn. Finally, the Pentagon audit silence is not total after all, though it is still total in public. The Chronicle's tracking liveblog, updated at 3:44 on deadline day, documents three of the thirty acting through records rather than statements: North Carolina at Chapel Hill ended a Fudan University exchange out of an abundance of caution and screens partnerships with commercial compliance software; Oklahoma State was flagged for a Fudan partnership on the government's list and received a letter setting out required steps; and South Carolina was flagged for a programme it had already terminated in February — which means the list itself contains stale entries. Not one of the thirty has said anything to a reporter.",
        s: [["The Daily Pennsylvanian (Penn pauses CPT; Altamirano quoted)","https://www.thedp.com/article/2026/08/penn-international-curricular-practical-training-work-authorization-trump"],["CU Boulder ISSS (the August 12 SEVP broadcast, named on August 20)","https://www.colorado.edu/isss/2026/08/20/change-cpt-authorization-policy"],["Inside Higher Ed (DHS limits internships for international students)","https://www.insidehighered.com/news/quick-takes/2026/08/31/dhs-limits-internships-international-students"],["Presidents' Alliance (the hearing is September 3 at 11 a.m., Courtroom 1)","https://www.presidentsalliance.org/duration-of-status-litigation/"]] },
      { t: "Mind and cosmos: three real experiments, two long-standing plumbing failures fixed, and one open citation the desk is now prepared to retire. The best item is a human study that belongs as much to consciousness research as to pharmacology, and it is the kind of result this shelf exists for. In the Journal of Neuroscience, Mona Irrmischer and Marco Aqil, with Robin Carhart-Harris and Christopher Timmermann among the authors, report on twenty-seven healthy adults given intravenous DMT against saline placebo in a within-subject crossover, with EEG before and twenty minutes after injection. DMT shifted theta, alpha and beta activity away from criticality and toward randomness, pushing alpha and beta into an inhibition-dominated subcritical regime — and the correlation is the finding: “the further the alpha and theta brain waves shifted away from criticality, the more intensely the participants felt their sense of self disintegrate.” The authors state their own limitation and it is an unusually candid one: EEG mainly captures slow oscillations, and they speculate that faster oscillations might move in the opposite direction, toward an overactive regime that could account for the vivid imagery. That last is explicitly speculation and is not published here as a result. Two more experiments, both animal. The compound in the item this desk could not name yesterday is now named: it is DOI, 2,5-dimethoxy-4-iodoamphetamine, in BMC Neuroscience from Michael Fiorillo and Javier González-Maeso at Virginia Commonwealth — the same laboratory as the August 12 Science Signaling paper, a different compound. Low-dose DOI given twenty-four hours before an immune challenge cut hippocampal interleukin-6 and TNF-alpha at four hours; pre-treated mice held normal movement and regained weight faster; and the interleukin-6 effect was partly dependent on the 5-HT2A receptor. Limitations stated by the authors: a single acute trigger rather than chronic inflammation, whole-hippocampus rather than cell-type-resolved analysis, and male mice only. The ketamine paper is also now attributable — Science Advances, Sandra Siegert and Alessandro Venturino at the Institute of Science and Technology Austria — and it carries a caveat that matters enormously for how it will be misread: this is surgical-grade anaesthesia, not psychiatric dosing. In female mice only, four hours after anaesthesia, microglial activation markers rose, post-anaesthesia electrical activity increased, corticosterone ran about three times baseline, and Fkbp5 was selectively upregulated in microglia. What lifts it above correlation is the manipulation: removing the adrenal glands erased the female-specific effects, and injecting corticosterone restored them. On the quantum side, and saying which is which as always. Physical Review Letters volume 137 has moved on to issue ten — nominally cover-dated September 4, which is APS forward-dating an issue rather than anything suspicious — and its three new papers, all dated September 1, are all theory: many-body cages from flat bands in Fock space; critical quantum metrology beyond adiabaticity; and quantum magnetometry in cavity-magnon systems. The Aug 31 photonic entanglement experiment now has an author line, Wu, Shi and Sun among them. PRX Quantum contributes two genuine experiments: dispersive qubit readout with intrinsic resonator reset, reporting readout infidelities near 0.6 per cent and framed for error-correction cycles, and Andreev-enhanced conductance quantisation in germanium-silicon quantum point contacts. The 99.999 per cent paper this desk keeps warning about now has authors too — and it is still analytical and numerical, a pulse-shaping framework, not a measured gate. On the Munich nuclear-spin qubit, a partial win and a decision. The title is “Cavity-enhanced optical readout and control of nuclear spin qubits.” The published DOI has now failed on a fifth attempt: the arXiv record carries no journal reference, and the journal's own subject listing returned an error. This desk is retiring the chase rather than repeating it, and will describe the work as a preprint whose journal version it cannot pin. Pasqal, meanwhile, has given the whole debut back and then some — a third consecutive down day, closing Tuesday at $15.56, off $1.74 or 10.06 per cent, on about 1.88 million shares for a market capitalisation near $447m, with the after-hours print at $14.84. Nineteen eleven, seventeen thirty, fifteen fifty-six. Its announcement of the day is a research collaboration with Saudi Arabia's KACST, with no figures attached, and is labelled an announcement. Finally, two plumbing failures this desk has logged for days are fixed, and one of them by the exact method it predicted. Tricycle's dated index fetched successfully after three consecutive failures, showing a full week of items through this morning's piece on veganism and omnivorism in early Buddhism — though per-article permalinks still cannot be captured, so that limitation is separate and stands. And Lion's Roar's feed resolved by searching the literal string, precisely the fix the desk wrote down yesterday, surfacing a prayer for Nepal and Tibet that answers Buddhistdoor's flash-flood item from last week. Neither outlet carried anything on Dzogchen, mahamudra, rigpa or Advaita in the window, which is a content finding rather than a technical one, and the difference is now visible because the pipes work.",
        s: [["PsyPost (Irrmischer and Aqil: how DMT alters brain waves to induce the loss of self)","https://www.psypost.org/how-dmt-alters-brain-waves-to-induce-the-loss-of-self/"],["PsyPost (the compound is named: DOI primes the mouse brain against inflammation)","https://www.psypost.org/a-psychedelic-compound-primes-the-mouse-brain-to-resist-severe-inflammation/"],["PsyPost (Siegert and Venturino: stress hormones drive female-specific rewiring after ketamine anaesthesia)","https://www.psypost.org/stress-hormones-drive-female-specific-brain-rewiring-following-ketamine-anesthesia/"],["Lion's Roar (a prayer for Nepal and Tibet — the feed resolved by literal-string search)","https://www.lionsroar.com/a-prayer-for-nepal-and-tibet-and-how-to-help/"]] },
      { t: "Three of the standing death leads resolved into facts, Venice opened, the Smithsonian got a second and better source, and a cancelled Lynch weekend is still taking money on day eleven. The deaths check paid again, and this time it converted rather than merely collected. Péter Nádas, the Hungarian novelist and the most significant name on this desk's unverified list, is confirmed across five or more outlets — he died on August 26 at eighty-three, Euronews calling him a giant of contemporary Hungarian literature and France24 describing the reclusive author's death. Ada Yonath, the Israeli crystallographer who shared the 2009 Nobel Prize in Chemistry, is confirmed at seven or more outlets including the American Chemical Society's own trade paper and her home institution, the Weizmann, dead at eighty-seven. And Michel Fano is confirmed at two outlets — with both his date and his age moving in the process. He died on September 1, not August 31, at ninety-seven rather than ninety-six: a composer who studied under Messiaen, one of Pierre Boulez's closest lifelong friends, a long collaborator with Alain Robbe-Grillet, and the author of a genuinely useful idea, the partition sonore, refusing to treat film music as mere accompaniment to the image. Two new single-sourced leads arrived and are published as leads only, one of them squarely on this beat: the French director Jean-Paul Rappeneau, of the 1990 Cyrano de Bergerac, dated to today at ninety-four; and the Hong Kong actor Chen Kuan-tai, also dated today, at eighty. Neither has a second outlet and neither is a fact here. Venice opened this morning with Danny Boyle's Ink, and George Clooney and Ellen Burstyn both took their honorary Golden Lions. Guy Pearce plays Rupert Murdoch, Jack O'Connell the editor Larry Lamb. Boyle, on his ensemble: “It's this bed of people that you build the story around and from and they give support and succor to the idea but the big thing they bring is belief in the idea,” and, more usefully for a room of students, “I haven't learned a great deal in 30 years and that's probably a good thing.” Festival director Alberto Barbera on Clooney: “a great actor, one of the greatest actors at the moment and a great filmmaker.” The coverage frames this year around documentaries on Gaza, Musk, Ukraine and American immigration enforcement rather than around celebrity, which is a fair description of a lineup containing a seven-hour Bertolucci film and a four-hour Musk film. There is no Lynch, no von Trier, no Noé and no Refn in it, verified an eighth time. The Smithsonian item is now sourced twice and, more importantly, answers the question this desk left open. Axios independently confirms the Board of Regents designated the Arts and Industries Building the permanent home of the National Museum of the American Latino, and adds the fact that makes it a decision rather than a step: it reverses a 2022 recommendation for new construction near the Washington Monument. Director Jorge Zamanillo, in Axios's phrasing, says it places the Latino story at the heart of the National Mall and the American story. And on the American Women's History Museum, which this desk correctly reported as genuinely unresolved rather than merely unreported, Axios says its permanent home remains unresolved, its legislation is stalled in Congress, and officials indicate it could still be a decade or more from completion. That is now a reported absence rather than a gap in the reporting. Still no Anthea Hartig quote exists anywhere. On the directors, a quiet day with one useful sharpening. Lars von Trier: nothing since August 9, and a new trap caught before it reached this page — a Kristeligt Dagblad piece on his honorary Bodil award is March 15, 2025, with his children accepting on his behalf and saying it was about damn time. Refn still has no cast for Maniac Cop, and the sales-agent discrepancy this desk has been flagging as a conflict between outlets turns out to be internal to a single Cineuropa article, which says Veterans will handle international sales while describing Vincent Maraval as Goodfellas' chief executive in the same breath. A new Refn line worth having: the film is “a radical new vision where there is no protection, no safety net, only mayhem.” Noé is a plain negative on a thirteenth check. Criterion's December slate is still unannounced on a fifth consecutive check, the page still stopping at The Right Stuff on November 24. And the Gathering of the Angels reaches day eleven with both pages re-fetched live and both unchanged: the homepage still saying the 2026 event has been postponed to 2027 with new dates to be announced and none given, the orphaned tickets page still selling at £99.50 a day, £180 for the weekend with its “save £19” line and £310 for VIP, with a live buy button and a £3.50 transaction charge, and still urging visitors to buy the weekend “for the full Lynchian experience.” Eleven days, and not one outlet has reported the postponement.",
