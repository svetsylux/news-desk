<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "Trump confirmed the Moscow trip, called it routine, and knocked down every explanation on offer without supplying one — and on the same day, Kremlin sources told Bloomberg the diplomacy is finished. Asked about John Ratcliffe’s Vnukovo visit, the president called it “sort of semi-routine,” added “something may come out of it. We’re working very hard to get that war ended,” and said “we would like to see the war with Ukraine end,” with the striking claim that “frankly, they both want to see it ended at this point.” Asked which of the circulating accounts was correct — Ksenia Sobchak’s prisoner-release version, the Wall Street Journal’s warning-about-mobilisation version, Ukraine Context’s “operation of significant importance” version — he said “none of the above.” That is an on-record knock-down of all three at once, and it leaves the trip’s purpose exactly where Meduza left it on Tuesday: unknown. Ratcliffe did not meet Putin; the Kremlin’s framing stayed at contacts between the security services. This desk finds no onward leg to Kyiv, and no readout from any side. One recirculator to reject if it surfaces: a Deccan Herald “CIA director visits Kyiv, meets with Ukraine’s Zelenskyy” is January 20, 2023 and concerns William Burns. Set against that, Meduza relays a Bloomberg report sourced to people close to the Kremlin that Putin is preparing to escalate — “stepped-up conventional ballistic missile strikes on Kyiv, including the city center, and on infrastructure in other Ukrainian cities” — on a Moscow reading that all diplomatic mechanisms have collapsed. Bloomberg stresses there are “no signs that Russia is preparing to use tactical nuclear weapons,” while reporting that “a growing number of Russian officials believe that Putin could eventually take the extreme step of using tactical nuclear weapons.” Alexander Gabuev of the Carnegie Russia Eurasia Center in Berlin puts that risk “extremely low”; Peskov declined to comment. The two reports are not reconcilable and this desk will not try: within one 24-hour window the American president says both parties want it over and unnamed Kremlin sources say the channel is dead. Note which is on the record and which is not, and note that the ballistic-missile prediction was published hours before ballistic missiles hit Kyiv.",
        s: [["Moscow Times (Trump confirms the trip)","https://www.themoscowtimes.com/2026/08/26/trump-confirms-cia-directors-moscow-trip-calling-it-semi-routine-a93582"],["Meduza (Kremlin sources tell Bloomberg)","https://meduza.io/en/feature/2026/08/26/kremlin-sources-tell-bloomberg-that-putin-is-preparing-to-escalate-the-war-in-ukraine-a-growing-number-of-russian-officials-believe-that-could-eventually-mean-a-tactical-nuclear-weapon"],["Kyiv Post (ballistic missiles on Kyiv)","https://www.kyivpost.com/post/83195"],["Kyiv Independent (explosions rock Kyiv)","https://kyivindependent.com/explosions-rock-kyiv-as-russia-launches-ballistic-missiles-at-the-capital-and-other-regions-across-ukraine/"]] },
      { t: "Overnight it was ballistic missiles on the capital, and there is no consolidated tally yet — which is itself worth stating rather than filling in. Around 3 a.m. at least six explosions inside roughly one minute were reported in Kyiv, from ballistic missiles aimed at the capital and other regions. The city military administration said only that “information about casualties and damage is being clarified,” and that “debris from intercepted targets fell in the courtyard of a residential building in the Podilskyi district and on the grounds of an educational institution in the Shevchenkivskyi district.” Initial reports gave no casualties in Kyiv itself. Elsewhere: an industrial facility struck in Kryvyi Rih with two civilians wounded, three injured in Zaporizhzhia per Governor Ivan Fedorov, explosions in Odesa with no figures, and a running total of at least seven injured. No Ukrainian Air Force launched-versus-intercepted figure had been published for this window at the time of writing, and neither had any Russian Defence Ministry claim — both filings are explicitly developing, and this desk would rather print the absence than a number it cannot source. One revision to yesterday’s window: the Kyiv Independent now gives the night of Aug 25–26 as 163 launched and 132 shot down against the 162 and 134 published here, with 18 locations struck and debris at three more unchanged. That is a revision, not a second event. Going the other way, the Wildberries strike at Kotovsk in Tambov Oblast resolves with numbers. Governor Yevgeny Pervyshov: “19 drones targeted the warehouse in all. Air defenses shot down 16 of them, while three managed to strike the building.” The warehouse “burned to the ground”; Mayor Alexey Plakhotnikov told residents to keep windows closed “because of the heavy fire, smoke, and smog.” Injuries were a 19-year-old man concussed and a 49-year-old woman with a broken finger — against the July 18 strike on the same warehouse, which killed seven Wildberries employees. The Lukoil refinery at Kstovo in Nizhny Novgorod Oblast is now confirmed struck rather than reportedly targeted, and three people were killed across Tambov, Lipetsk, Belgorod and Nizhny Novgorod. Zelensky’s framing: “the war must return to where it came from. Ukraine responds to Russian strikes, and we do so in a way that ensures the cost of the war for the aggressor inevitably rises.” The framing contrast today is an absence rather than a divergence. TASS’s dominant war story of Aug 26 is one no Ukrainian or exile outlet carried at all: a strike on a passenger bus on the Zolotoye–Pervomaisk highway in the LPR, nine killed of fifteen aboard, six wounded. LPR head Leonid Pasechnik called it “targeted” and an “act of terrorism by the bloody Kiev regime”; Investigative Committee spokeswoman Svetlana Petrenko said a criminal case was opened “on charges of terrorism”; commentator Andrey Marochko added that “the UAV operator sees in real time where he strikes.” Searching it returns TASS, RT, Sputnik and syndicators and nothing else. Two decoys rank alongside it and must not be merged: a BBC file on a bus strike in Ukraine, and Ukrainska Pravda copy on Marhanets in Dnipropetrovsk Oblast — nine killed, 42 injured — which is a different, earlier, opposite-direction event.",
        s: [["Kyiv Post (ballistic missiles, Aug 27)","https://www.kyivpost.com/post/83195"],["Meduza (Wildberries warehouse destroyed)","https://meduza.io/en/news/2026/08/26/wildberries-warehouse-in-russia-completely-destroyed-in-ukrainian-drone-attack"],["Moscow Times (3 killed, refinery ablaze)","https://www.themoscowtimes.com/2026/08/26/3-killed-in-russia-as-ukraine-sets-wildberries-warehouse-and-oil-refinery-ablaze-a93577"],["TASS (LPR bus strike)","https://tass.com/politics/2178023"]] },
      { t: "The diplomatic register produced a seventh day of silence, and the fuel story turns out to have been read backwards — by this desk, in the right direction. On the Vatican channel, Archbishop Paul Richard Gallagher’s published itinerary does place the Yuri Ushakov meeting on Aug 26, with Aug 25 given to Lavrov and Metropolitan Anthony of Volokolamsk and Aug 27 to Catholic clergy and Mass at Moscow’s Cathedral of the Immaculate Conception. But no readout of the Ushakov meeting was published anywhere, and no confirmation it occurred. The Vatican’s own line on the Lavrov meeting is boilerplate — “topics of common interest and current international issues were addressed, with particular attention to the war in Ukraine and the prospects for peace” — and the trip is described as Gallagher’s first to Russia since 2021 and “a mission of dialogue and peace.” So Ushakov remains untraceable in his own voice, and Witkoff and Kushner now make seven consecutive days with nothing verifiable, the last Kremlin text on them still Peskov’s Aug 20 “no specific dates have been set for such a visit yet.” ISW published no Aug 26 assessment; the Kyiv Post topic index tops out at Aug 25 while its article IDs have run well past. The evaporated joint peace proposal did not reappear. The Patriot obstacle in Brussels produced no advance whatsoever. Now the correction, and it matters because it inverts the direction of the policy. This desk reported that Russia’s diesel export ban expires Sept 1 with extension “under consideration.” It does not expire. The July 30 package runs the gasoline and diesel export ban through Jan 31, 2027; retailers are banned throughout; what happens on Sept 1 is that refineries regain the right to export diesel. So the question under consideration is whether to close that carve-out, not whether to extend a ban — and no decision has landed. Deputy prime minister Alexander Novak had signalled end-2026 before the January date was set. On the currency, the ruble took back a fraction of Wednesday’s record fall: the Bank of Russia set USD/RUB at ₽84.2820 effective Aug 27, from ₽84.4635, with EUR/RUB at ₽98.2897 and CNY/RUB at ₽12.5294 — a first strengthening after the largest single-day weakening in this series. Key rate 14.00%, next board meeting Sept 11. No MOEX move and no new cumulative refining-capacity figure surfaced. One more line to carry with its caveat attached: Peskov said Aug 26 that “the fact that Ukraine is losing the conflict is unequivocal and the dynamics in all frontline areas clearly demonstrate this,” which TASS pegs to a remark it attributes to a Ukrainian it calls “ex-Defense Minister Mikhail Fyodorov.” Mykhailo Fedorov is Ukraine’s digital-transformation minister and has never been defence minister; the title is TASS’s and the underlying quote could not be verified. With ISW silent there is no arbiter for the front line, and nothing verifiable was claimed by either side.",
        s: [["Catholic World Report (Gallagher itinerary)","https://www.catholicworldreport.com/2026/08/25/vatican-foreign-minister-meets-with-officials-in-russia-to-discuss-ukraine-conflict/"],["Moscow Times (export ban through January 2027)","https://www.themoscowtimes.com/2026/07/30/russia-extends-gasoline-and-diesel-export-ban-through-january-2027-a93382"],["Bank of Russia (Aug 27 fixings)","https://www.cbr.ru/eng/currency_base/daily/"],["TASS (Kremlin on the front line)","https://tass.com/politics/2177875"]] },
      { t: "The teased Iranian bank designation still has not issued, and the Hormuz corridor gained the one detail that makes it an economic arrangement rather than a navigational one. On the sanctions second act: checked against both the Treasury press-release index and OFAC Recent Actions, the highest release number is now SB0616 of Aug 26 — “Treasury Takes Action Against Violent Far-Left Terrorist Networks,” not Iran and not a bank — while SB0613 of Aug 24 remains the latest Iran action. OFAC’s most recent entry, also Aug 26, covers counter-terrorism designations and a Russia-related general licence. So Bessent’s promise of a major announcement naming a financial institution by the end of the week is outstanding with two days left. Fortune supplies a causal claim worth carrying with its source attached: the administration has spared major Chinese businesses and banks connected to the US financial system, hitting only a China-owned tanker and a Hong Kong business, and Fortune frames the carve-out as calibrated around an upcoming Xi Jinping state visit to Washington. The campaign name has held at Operation Economic Outcast; no post-Aug-24 use of Economic Fury turned up. On the corridor, an unnamed IRGC spokesperson says the agreements reached with Oman cover “the share of each country in the waters” and “the share of Iran and Oman in its revenues” — the first indication that the temporary route carries a revenue split, though no amounts, vessel types, fees, escorts, protocols, duration or start date have been disclosed, and no vessel has transited. Kazem Gharibabadi added that American mine-detection vessels entering the area would be “very good targets,” that “the new American sanctions are doomed to failure, and we have our own methods to counter them,” and that US mine-clearing claims are “only aimed at calming the markets.” Oman’s Badr Albusaidi has said nothing new. GlobalSecurity’s war log did roll forward, to Day 180 for Aug 26: the rial opened at 2,037,000 to the dollar, touched a record 2,060,000 and eased to about 2,015,000, against an official rate near 1.5 million; inflation is still around 90% per Iran’s Statistical Center; and the pause in strikes inside Iran reached a 27th consecutive night. The traffic figures moved and still do not reconcile — Kpler via Reuters now gives five commodity vessels on Aug 25 against a ten-day average of fifteen, with four on Aug 23 and thirteen on Aug 22, while GlobalSecurity carries two on Aug 24 against an average of fourteen. The two sources disagree about the average itself, so publish both. Tehran blacklisted 45 tankers on Aug 24 for alleged violations. Elsewhere in the region: Israeli air attacks on al-Mansouri and Sarbine in south Lebanon on Aug 26, artillery on Wadi Zibqin, strikes on Beit Lif and Yater, demolitions in Hula, and shelling near Beit Jinn in Syria with a ground raid at Taranja in Quneitra; President Joseph Aoun defended negotiations as the option that would spare Lebanon “the horrors of war,” while analyst Khaldoun Al-Sharif counted “more than 10,000 violations, and they haven’t lifted a finger.” Hezbollah’s threatened retaliation for the Aug 15 strikes is still unexecuted, and nothing on Gaza was published Aug 26 or 27 — the al-Bursh oxygen figures have not been updated. From the heterodox benches the drought broke: Diesen posted a Jeffrey Sachs interview dated Aug 25 on his own page, the same conversation Sachs’s site dates Aug 24, and Mearsheimer posted a video alert Aug 25; Sonar21 has nothing newer than Monday’s CIPS piece. The most useful counter-frame is at Responsible Statecraft, where Sam Fraser, quoting analyst Rory Johnston, notes that oil peaked near $120 in April and has largely stayed below $100 since June, against early predictions of $150 to $200 — six months of war, and the price is the dog that did not bark.",

    { h: "Economy & markets", items: [
      { t: "Nvidia beat everything and the market closed lower anyway. The numbers first, because they are large: revenue $96.2 billion against a $92.07 billion consensus and company guidance of “$91.0 billion, plus or minus 2 percent”; non-GAAP EPS $2.22 against $2.09; GAAP EPS $2.46; data centre $89.0 billion, split $48.7 billion hyperscale and $40.3 billion AI clouds, industrial and enterprise. Gross margin came in at 75.0% on both a GAAP and non-GAAP basis, against 72.4% a year earlier — which retroactively vindicates the 75% figure this desk carried on Monday and could not source to any preview, though the correction stands: it was unverified when published and being right by luck is not the same as being sourced. Guidance for Q3 is $108.0 billion plus or minus 2%, implying 86% to 93% year-over-year growth, at a 74.0% margin plus or minus 50 basis points — and, as before, it “assumes no Data Center compute revenue from China.” Jensen Huang: “AI has reached its inflection point. It’s doing useful work. Its tokens are productive and profitable. Now, compute is revenue.” Also, unprompted: “the only regret that I have is that I didn’t invest more and sooner.” The shares rose 4.71% to $219.53 after hours. Treat the follow-through as unresolved — a Kiplinger live blog reporting a next-day pre-market near $212 to $213 cannot be reconciled with a $219.53 after-hours print, and CNBC’s “Nvidia jumps 6% in premarket” headline was not fetchable. Do not publish a pre-market percentage. Morning’s data was the more interesting half. July PCE ran hot on the headline and in line at the core: headline +0.2% month over month and 3.7% year over year against a +0.1% and 3.6% consensus, core +0.2% and 3.3% — exactly in line. Personal income +0.4%, or $115.1 billion, against +0.2% expected; disposable income +0.5%; consumer spending +0.2% against +0.3%, with services up $86.2 billion and goods down $49.9 billion, real spending essentially flat and the saving rate at 3.0%. Note that the coverage benchmarked headline against +0.1% and 3.6%, not the −0.1% and 3.7% Reuters poll this desk published — and that Christopher Hodge of Natixis, alone in calling headline unchanged at 3.70%, was exactly right. Q2 GDP was unrevised at +1.5%, a downward revision of less than a tenth, but the line worth teaching is underneath it: corporate profits from current production rose $400.9 billion in Q2 against $74.4 billion in Q1. Durable goods split cleanly in two — headline +1.1%, or $3.6 billion to $339.3 billion, against +0.3% expected, which confirms the correction that +0.3% was the street and +0.7% was TradingEconomics’ own model; but core capital goods orders, nondefence excluding aircraft, rose only +0.2% against +0.9% expected, while core shipments rose 1.4%. Transport flattered the headline; underlying capex orders missed and shipments were strong. And the market closed slightly lower on all of it: S&P 500 7,675.70 (−1.58, −0.1%), Nasdaq Composite 26,130.20 (−21.10, −0.1%), Dow 53,463.88 (−113.52, −0.2%), Russell 2000 3,005.90 (−4.12, −0.1%), each arithmetically consistent with Tuesday’s close. Abercrombie & Fitch rose 35% on earnings and raised guidance, Salesforce 13% on guidance, and Meta rose after settling the social-media addiction trial for $16.7 billion. One caution: the VIX figure circulating from a live blog implies a prior close that reconciles with nothing on record, so treat it as an intraday snapshot rather than a settle.",

      { t: "Hike odds moved up on the print, Jackson Hole gained a second name, and the buyback story finally has numbers. Yields rose a second session — the 10-year at 4.65% on Wednesday’s close and 4.66% intraday Thursday, the 30-year at 5.17% — and the dollar index closed at 99.036 (+0.12%) before a 99.112 pre-market, up 2.46% over four weeks. On the Fed, publish the direction rather than a venue number: nothing datestamped after the print surfaced from Kalshi, Polymarket or CME FedWatch, and everything the index returned was pre-PCE and now stale. What is datestamped is TradingEconomics’ narrative figure of “a 60% probability of unchanged Fed rates in September,” implying roughly 40% for a hike, and AP’s summary that traders are “still mostly betting the Federal Reserve will hike the federal funds rate by the end of this year” — a year-end formulation, not a September one. Notice that a 40% implied reading sits almost exactly on Barchart’s 39% futures-implied figure this desk flagged as an outlier on Aug 25, which suggests it may simply have been early rather than wrong. Jackson Hole opens today through Aug 29 on “Financial Innovation: Implications for Payments and Policy,” with Warsh’s keynote Friday at 10:00 a.m. Eastern, his first as chair. Newsquawk’s calendar adds ECB executive board member Isabel Schnabel as a Friday speaker — a second named participant this desk did not have. The full agenda was not posted as of this morning; one outlet says the Kansas City Fed typically releases it the evening before the symposium opens, which would have been Wednesday, but nothing was retrievable, which is consistent with the Thursday-evening timing carried here. On Treasury buybacks the specifics have arrived: operations at least double from $2 billion to $4 billion each, running Sept 9 to Nov 4, in a move Treasury says “reflects Treasury’s desire to provide greater liquidity support” for the long-bond market. Rebecca Patterson at the Council on Foreign Relations supplies the sceptical read — buybacks are “more signal than substance” and will be “absorbed into broader supply and demand dynamics.” The reported plan to tap the Treasury General Account to fund them has produced nothing since Aug 24. Commodities Thursday morning: gold around $4,600 to $4,620 an ounce, up about half a percent, with the month at +14.29% and the year at +34.72% against January’s $5,608.35 all-time high; silver $69.027, +1.37%; WTI $81.654, −0.70%; Brent $87.231, −0.69%. Two honest gaps — no December gold futures figure surfaced, so there is no contango spread to report today, and Wednesday’s one-day oil move cannot be settled, since Thursday’s level implies a Wednesday settle well above the $80.08 published here. Crypto levels, not deltas: bitcoin around $79,000, ether $2,494, solana $101, XRP $1.41, BNB $703. Joel Kruger of LMAX Group puts the confirmation level at the May high near $82,820 and says a break above “would open the way back towards $100,000”; QCP Capital reads the tape the other way — “falling open interest points to short covering rather than fresh buying, with spot ETF inflows supplying the genuine demand.” On Canada, no Wednesday development, but a units reconciliation worth having: the C$27.6 billion figure and the “about $20 billion of US goods” figure are the same number in two currencies at roughly 0.72, so publish it as C$27.6 billion, about US$20 billion. Today’s calendar is thin — jobless claims at 8:30 with a 206,000 consensus, continuing claims 1,799,000, the advance goods trade balance at −$99 billion, and the Kansas City Fed manufacturing index at 11:00 with a consensus of 17 against TradingEconomics’ own model of 14. Marvell reports. And the week’s teaching paper is a health-economics one: Hung Le and Otto Toivanen at VoxEU on entry decisions in the Swedish pharmaceutical market, asking whether the observed entry pattern is competition or collusion. The runner-up, and the better fit for the yield story above, is Timothy Taylor on Hanno Lustig’s argument that Treasuries are repricing from safe to risky — long rates up, some corporates borrowing below the sovereign, and the flight-to-safety correlation breaking down, because “the marginal foreign holder of US Treasurys is no longer a central-bank reserve manager but a private, yield-sensitive investor” whose demand is “more fragile.”",

      { t: "The Merck opinion is readable after all, and voluntariness does all the work in it. Two corrections first. The case is captioned Merck & Co., Inc. and Merck Sharp & Dohme LLC v. Robert F. Kennedy, Jr., in his official capacity as Secretary of HHS — Kennedy has been substituted for Becerra, so “Merck v. Becerra” as published here on Wednesday is the old caption. And the text was not unavailable: the Georgetown litigation tracker does carry the 17-page memorandum opinion, mislabeled under a filename that looks like a 2023 docket report, which is why it read as absent. CourtListener’s docket page is robots-disallowed to automated fetch; Justia yields the district court’s internal docket number, 256105, which is the workaround for the RECAP path. The disposition, verbatim: “For the foregoing reasons, the Court shall DENY Merck’s Motion for Summary Judgment in full and GRANT the Government’s Cross-Motion for Summary Judgment in full,” and the accompanying order dismisses the case. On the Fifth Amendment takings claim, which is the load-bearing one, Judge Colleen Kollar-Kotelly writes that “absent a government mandate to relinquish the use of private property, there is no physical taking,” that “a long line of cases instructs that no taking occurs where a person or entity voluntarily participates in a regulated program,” and — the sentence a health economist will want on a slide — that “economic hardship is not equivalent to legal compulsion for purposes of takings analysis.” She distinguishes Horne v. Department of Agriculture on the ground that the raisin growers had to exit their entire market whereas Merck can withdraw from Medicare and Medicaid and remain in pharmaceutical sales. On compelled speech: “the First Amendment does not prevent restrictions directed at commerce or conduct from imposing incidental burdens on speech,” and the agreement “expressly states that the parties intend to give all statutorily-defined terms their statutory meaning, not their colloquial meaning” — Merck remains free to criticise the programme in any forum other than the contracts that effectuate it. One structural correction to Wednesday’s account: there is no standalone unconstitutional-conditions holding. The court folds that claim into the voluntariness analysis and cites Rumsfeld v. FAIR. Three claims failed as to outcome; two were reasoned. The pressure point Merck built its coercion theory on is quantified in the opinion — the daily excise tax “begins at 185.71% of a selected drug’s sale price on the first day” of noncompliance and escalates to “1,900% of the sale price after 270 days.” The drug is Januvia. AstraZeneca lost a parallel challenge the same day before Judge Matthew Maddox in the District of Maryland, having contested the grouping of multiple drugs to reach the eligibility benchmark. No Merck statement has appeared in any free source and no notice of appeal is on the docket; the window in a case with the United States as a party runs sixty days, which is arithmetic rather than a reported date. Two traps caught in the reporting on this: an automated read rendered the deciding court as “the US Court of Appeals for the Third Circuit in Washington, D.C.,” which is wrong twice over, and Public Citizen’s case page yields the line that “the program does not effect a taking and does not compel speech,” which is Public Citizen’s summary and not the court’s words. Alongside it, the best pure health-economics finding of the week comes out of Georgetown’s Center on Health Insurance Reforms, where Jack Hoadley and Kennah Watts put a number on the No Surprises Act’s arbitration channel: $22.4 billion in excess costs over four years, decomposed into $15.6 billion in awards exceeding comparable in-network rates, $4.2 billion in internal administrative costs and $2.7 billion in entry fees. Dispute volumes rose 77% from 2024 to 2025 and payment amounts 264%; providers won about 85% of cases in 2025 with median payouts more than four times the qualifying payment amount. Their conclusion: “the evidence presented here suggests that providers have a clear incentive to keep filing disputes and to ask for higher and higher amounts.” One internal figure — $16.6 billion in 2025 alone — does not reconcile easily with the four-year total and should be checked before it is quoted. A plumbing note that matters: Healthcare Dive is not stale, its homepage is. The front page still renders items from Aug 18 to 20, while individual articles are current, which is what produced five runs of apparent silence.",
        s: [["Georgetown litigation tracker (memorandum opinion)","https://litigationtracker.law.georgetown.edu/wp-content/uploads/2026/08/MERCK-CO._2026.08.24_ORDER-ON-MOTION-FOR-SUMMARY-JUDGMENT.pdf"],["FiercePharma (Merck and AZ suits swatted away)","https://www.fiercepharma.com/pharma/merck-az-lawsuits-against-medicare-price-negotiations-are-swatted-away"],["Healthcare Dive (No Surprises IDR, $22B)","https://www.healthcaredive.com/news/no-surprises-idr-created-22-billion-costs-georgetown-surprise-billing/828817/"],["STAT (shingles vaccine natural experiment)","https://www.statnews.com/2026/08/26/shingles-vaccine-shingrix-reduces-heart-disease-dementia-risk-oxford-study/"]] },
      { t: "The vaccine docket has 504 comments and nobody can say whose, the Ebola numbers were revised up, and a shingles vaccine got a natural experiment. On the RFI: the Federal Register document page for HHS–OS–2026–0332 now reports 504 comments received, with the window closing Sept 20. That is a solid count and the composition behind it is not — regulations.gov is a JavaScript application that refused three separate fetches, so who those 504 are remains unverified. What did not change is the asymmetry: no medical society, insurer, manufacturer or state comment surfaced, while the only organised RFI-specific mobilisation remains on the vaccine-sceptic side, with call-to-action posts still circulating. The nearest thing to professional engagement is a CIDRAP op-ed by Jake Scott, clinical associate professor of infectious diseases at Stanford, arguing that shared clinical decision-making is being misapplied where consensus is strong — “recommendation categories have been manipulated for purposes beyond their design,” and “no vaccine has been removed from the schedule entirely” — but it neither references the RFI nor urges comments on it. One new procedural detail: HHS’s own press release is dated Aug 21, three days before Federal Register publication, and contains no quote from Kennedy or any named official. And the executive-order baseline now has a fourth reading — Fierce Healthcare gives 17 to 11, a reduction of six, naming no vaccines, which matches Healthcare Dive against NBC’s 18 to 11 and Texas Public Radio’s 18 to 11 without RSV. Carry all four; the arithmetic still only closes at 18 if RSV is counted. Florida’s proposal has firmer edges: the four vaccines being removed from school-entry requirements — hepatitis B, varicella, Haemophilus influenzae type b and pneumococcal conjugate — are set by agency rule rather than statute, which is precisely what allows repeal without the legislature. Emma Spencer, a department director, says the proposal is “grounded in policy based on considerations that favor parental rights and medical freedom”; Surgeon General Joseph Ladapo: “Who am I to tell you what your child should put in their body? I don’t have that right. Your body is a gift from God.” One near-miss to reject: an NBC piece on a public hearing in Panama City Beach renders no date and no byline and its content matches a December meeting the current reporting refers to in the past tense. CDC measles did not refresh — the page still reads Aug 20 data, 2,777 confirmed across 47 jurisdictions plus sixteen among international visitors, 36 outbreaks, 94% outbreak-associated — and the state table, age and vaccination breakdowns and hospitalisation rate failed to render for a second consecutive run, which is a page problem rather than a data absence. The Thursday-noon cadence means the refresh should land later today. One item not previously carried: two measles-related deaths in Pennsylvania, reported as the state’s first in 35 years. The DRC Ebola figures need revising upward rather than extending, and the revision kills a reading this desk floated on Wednesday. ECDC, updated Aug 26 at 13:50 but still labelled as of Aug 24, now gives 5,656 confirmed cases and 2,715 deaths, a case fatality rate near 48%, across 58 of 151 health zones in six provinces, with Ituri at 4,716 cases and 2,119 deaths, or 83.4% of the national total; species Bundibugyo. Against the 5,514 and 2,642 published here for the same date, that is 142 more cases and 73 more deaths — implying roughly 71 cases and 36 deaths a day rather than the 27 and 18 computed on Wednesday. The likeliest explanation is exactly the weekend reporting lag flagged at the time, which means the deceleration reading should be dropped and not replaced with an acceleration reading; three points on a back-filled series is not a trend. Report the figures with their timestamp attached, since both sets carry the same “as of 24 August” label at different update times. Finally, the item most worth a seminar: Elizabeth Cooney at STAT on a Nature Medicine paper exploiting the October 2017 replacement of Zostavax by Shingrix as a natural experiment, comparing matched cohorts of vaccinated people over 60 in the six months either side of the switchover. Because both arms are vaccinated, the healthy-vaccinee bias that wrecks most vaccine-outcome studies is differenced out; the only thing separating them is which vaccine the calendar assigned. Across roughly 72,000 people in the TriNetX network — which excludes public-insurance enrollees, a real problem for a Medicare-age population — seven-year cardiovascular burden fell 9%, coronary heart disease 10%, heart failure 12%, stroke 12% in men and not significantly in women, atrial fibrillation 7%, amounting to about one percentage point fewer events in absolute terms. Confidence intervals did not render and are not reported here. Maxime Taquet of Oxford: “if confirmed, Shingrix could prevent hundreds of thousands of cardiovascular events in the USA alone,” and on mechanism, “this has to do with the adjuvant, because we haven’t seen any protection of Zostavax vaccines.” Note what that implies for the RFI’s own question about what counts as adequate evidence where randomised trials are absent.",
        s: [["Federal Register (vaccine RFI docket)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["ECDC (DRC Ebola, updated Aug 26)","https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda"],["WUSF (Florida school vaccine rule)","https://www.wusf.org/health-news-florida/2026-08-24/florida-seeks-to-repeal-four-vaccines-from-school-entry-requirements"],["KFF Health News (Bill of the Month: breast MRI)","https://kffhealthnews.org/health-care-costs/breast-cancer-mri-preventive-care-bill-of-the-month-august-2026/"]] }
    ]},

      { t: "Michigan: DTE has now been silent for ten days, and U-M has proposed hiding first-semester grades. On Ypsilanti, the township’s own document index yields a fuller chain than this desk has been carrying, and two date corrections. The Winters letter about pushback from county commissioners is dated June 22, not June 24; June 24 is a separate item, a Dingell letter to U-M and Los Alamos. The Aug 13 Grasso response is co-signed by LANL director Thom Mason and answers a Dingell letter of Aug 12, and there is an earlier pair — Dingell June 24, Grasso and Mason July 10 — with the earliest Dingell item Jan 30 on an open house. The resolution chain also runs deeper than the moratorium: Resolution 2026-05 of March 31 declares “strong opposition to Los Alamos National Laboratory siting a nuclear research facility anywhere in Ypsilanti Township,” and Resolution 2026-08 of April 15 is the YCUA water and sewer moratorium, with the electric moratorium of Aug 18 the third in the sequence. The township describes it as six months on large electric utility structures, unanimously approved. Everything else on this thread is a verified negative: no DTE correspondence of any kind on the document page, no litigation, no advance on the Sept 9 town hall, and no local follow-up to the national coverage of Aug 21 — WEMU has published nothing since Aug 19, and Planet Detroit, which covers Michigan data centres and water and is newly confirmed reachable, has nothing since April. A national moratorium tracker counts 29 active Michigan moratoria and has not yet logged Ypsilanti’s electric one, which is a fair measure of how thinly this is being followed; the same tracker lists Kalamazoo adopting one on Aug 18 and a Bay City subcommittee drafting an ordinance on facility size, power demand, water use, noise and decommissioning, and notes that Whitmer has pledged to veto statewide moratorium legislation in favour of voluntary industry pledges and statutory guardrails. The story with the most direct bearing on Sveta’s own classroom is at Bridge: starting fall 2027, first-year students in the College of Literature, Science, and the Arts would receive “pass” or “no credit” on their transcripts for their first semester. Students still see their real grades; the grades simply do not reach the GPA or the official transcript. About 5,000 first-year students a year are affected, against a first-to-second-year retention rate of 97%. Tim McKay, LSA associate dean, gives the aims as “encouraging academic exploration and improving student mental health,” and wants exploration to happen “in a way which is safe enough that they’ll come through it strong”; Thomas Guskey, professor emeritus at Kentucky, calls it a thoughtful approach. The opposition is worth reading too, and it is not only external — the Wall Street Journal ran it under “Coddle U,” while Sophia Xu, a pre-med senior, argues the policy “shifts this issue onto the winter semester” where students will “freak out,” and Connor Olsen, a business junior, calls it “prolonging the inevitable.” Both of those are testable predictions, which is the useful thing about them. In the Senate race there is still no new poll — RealClearPolling holds at El-Sayed 45.7 to Rogers 45.0, with nothing conducted or released since Aug 20 — but Bridge has a substantial Rogers profile noting he lost to Slotkin by about 19,000 votes in 2024 while running about 123,000 behind Trump. Two refinements on the Piker episode: Bridge renders the line as “if Jews in America keep putting this idea out there that they are singularly invested in Israel,” which differs from the “pro-Israel Jews” phrasing carried here, so quote it with the discrepancy attached; and Jeremy Moss has clarified that while he has not endorsed El-Sayed, he will not support Rogers. Three other Michigan items with a health-economics edge. The FBI executed search warrants Tuesday at Quality Behavioral Health facilities in Detroit, Troy and Eastpointe and at the home of chief executive Naveed Syed — a contracted provider for the Detroit Wayne Integrated Health Network, whose president James E. White noted that “the people we serve place their trust in our provider network during some of the most challenging moments of their lives.” No charges have been announced. Michigan will receive at least $171 million of the $17 billion Meta settlement across 47 states and the District of Columbia, which imposes for five years a two-hour combined daily limit on Instagram and Facebook with pauses at 15, 60 and 90 minutes, a midnight-to-6 a.m. block, and no weekday push notifications between 8 a.m. and 3 p.m. And the In Her Honor exhibition on Black maternal mortality is in Detroit through Friday, carrying the CDC figures that Black women are three times likelier to die of pregnancy-related causes and that 80% of US pregnancy-related deaths are preventable, against fifteen Michigan counties with little or no hospital or birth-centre care. On move-in, still no day-of coverage and still no confirmation any student was displaced; the U-M Record has nothing on Wolverine Village, temporary housing or new president C. Cybele Raver since Aug 19.",
        s: [["Ypsilanti Township (data center documents)","https://ypsitownship.org/government/boards___commissions/board_of_trustees/data_center_information.php"],["Bridge Michigan (U-M plan to hide letter grades)","https://bridgemi.com/talent-education/debate-rages-over-u-ms-plan-to-hide-letter-grades-heres-what-to-know/"],["Bridge Michigan (Mike Rogers 2.0)","https://bridgemi.com/michigan-government/mike-rogers-2-0-after-defeat-gop-senate-hopeful-takes-new-pitch-to-voters/"],["Michigan Advance ($171M Meta settlement)","https://michiganadvance.com/2026/08/26/michigan-to-receive-171m-in-17b-meta-settlement-over-addictive-features/"]] },
      { t: "The visa docket did not move, the H-1B clock started later than reported, and the department admits it cannot estimate what its own accreditation rule would do. On NAFSA v. DHS the Presidents’ Alliance litigation page still lists exactly three events — complaint and preliminary-injunction motion Aug 18, and Judge Saylor’s order of Aug 19 setting the schedule. No early DHS filing, no amicus, no new order. “The defendant’s response is due August 31, 2026,” with the hearing Sept 3 at 11 a.m. in Courtroom 1. The next move is the government’s, four days out. On the H-1B fee, a correction that sharpens rather than reverses: the rule formally published in the Federal Register on Aug 25 as “Fee for Certain H-1B Petitions,” which means the 30-day comment clock runs from Aug 25 and closes around Sept 24 — so the absence of any reaction from ACE, AAU, NAFSA or the Presidents’ Alliance is an absence in a live comment period, not merely a slow week. The only higher-ed-specific treatment anywhere is the Chronicle’s own analysis, headlined that most colleges will not be affected. The CPT reinterpretation has still produced no institutional or association response of any kind; the sector’s last word on it is a Chronicle newsletter of Aug 19. One figure circulating that this desk will not carry: a claim attributed to DHS’s own analysis that the fee would paralyse 76% of small businesses, which appears in a headline and was not checked against the regulatory impact analysis. Accreditation gained its first named critic and, more usefully, a departmental admission. Mike Gavin, president of the Alliance for Higher Education: “defining academic freedom is a role the government should not take,” and the approach is “a tactic to chill inquiry while claiming the administration advocates for intellectual diversity.” The department, for its part, acknowledges it “lacks sufficient data to estimate how these proposed changes will affect the accreditation marketplace” — a deregulatory case made without an impact estimate, which is the sort of sentence worth reading aloud in a policy class. Two new provisions beyond the advisory-board voting bar: accreditors could not partner with affiliated trade associations, with no shared budgeting, office space or personnel, which is the mechanism behind the ABA exposure and which predominantly hits programmatic accreditors; and accreditors would be required to enforce First Amendment protections rather than merely intellectual-diversity standards. Comments close Sept 21. One flag rather than a correction: Inside Higher Ed renders under secretary Nicholas Kent’s line as ending “based on quality responsiveness” and alignment with student outcomes, where this desk has carried it ending at “quality.” One of the two is truncated and it should be re-verified against the department’s own release. On Chicago, the answer to Wednesday’s question is not a second institution but a second unit: no other university has adopted a comparable ban, but the University of Chicago Law School announced last month that laptops, tablets and phones are barred from classrooms starting this fall. That reframes the social-sciences core policy from a divisional eccentricity into an institutional pattern. Jenny Trinitapoli, now rendered as master of the Social Sciences Collegiate Division, adds that “our sequences are best understood as a pedagogical setting without AI” and that “at UChicago we train students to use both reason and specialized knowledge in preparation for life as a free person.” Separately, Oxford University Press has published Academic Freedom in the Era of Trump, twenty chapters from twenty-one contributors edited by Lee Bollinger and Geoffrey Stone, in which Bollinger argues the present moment “is even more serious than the McCarthy era, because McCarthy was one senator. This is the president of the United States and the entire administration,” and that “they have total leverage. If they really want to destroy an institution, they can do it.” On institutional enrolment numbers the honest answer is that nothing new has been published — Maryland’s projected 30% graduate decline, UMBC’s 32 withdrawals and 14 deferrals, and Youngstown State’s drop to 850 remain the only data points, and census dates are landing without aggregates. For the classroom itself, two techniques, both new to this desk and both runnable in a large room. The first is an economist writing about his own lectures: Theodore Koutmeridis at Glasgow runs a Democracy Lab — a twenty-minute structured debate at the start of a two-hour lecture, on a topic chosen jointly with students and posted in advance, with the instructor participating rather than only moderating and guests occasionally including sitting parliamentarians. It is ungraded, which is both why it costs nothing to try and why it will not reach the students who most need to speak. The second landed this morning: Leonard Nalencz at Mount Saint Vincent describes a seventeen-minute silent writing protocol in four timed steps, with a chime at each transition — three minutes recording immediate reactions, six minutes rereading and annotating against guided questions, four minutes on the inverted question of what the text is not, and four minutes returning to the original to identify what lingers, followed by structured pair discussion. It is object-agnostic, and step three is the interesting one for intermediate theory: what does this diagram not show?",
        s: [["Presidents’ Alliance (duration-of-status litigation)","https://www.presidentsalliance.org/duration-of-status-litigation/"],["Inside Higher Ed (accreditation proposal)","https://www.insidehighered.com/news/governance/accreditation/2026/08/26/3-key-changes-trumps-new-accreditation-rule"],["Inside Higher Ed (Bollinger and Stone)","https://www.insidehighered.com/news/faculty/academic-freedom/2026/08/26/trump-attack-higher-ed-more-serious-mccarthy-era"],["THE Campus (Koutmeridis, the Democracy Lab)","https://www.timeshighereducation.com/campus/democracy-lab-how-20-minutes-debate-can-revive-lecture"]] },
      { t: "Mind & cosmos: entanglement over live commercial fibre under Munich, two different quantum voting papers that must not be merged, and a psychedelics beat now six days dry. Physical Review Letters rolled forward a day and the Aug 26 tranche is five papers, all distinct from Tuesday’s. The best is a deployed-network result rather than a laboratory one: a Max Planck Institute of Quantum Optics, LMU and Munich Center for Quantum Science and Technology group — Maya Büki, Pooja Malik and colleagues with Gerhard Rempe and Harald Weinfurter — entangled a single atom with a 780-nanometre photon, converted it to the telecom S-band, sent it 14 kilometres line of sight through 24 kilometres of deployed commercial fibre, and converted it back. Photon transfer efficiency was 1.7%; atom–photon entanglement fidelity degraded by less than 1%. Their own framing of the problem is the clearest statement of why this is hard: “while communication over long distances can use deployed fiber infrastructure, it requires photons in the telecom band. However, advanced quantum network nodes do not operate at such wavelengths.” They claim only that this “brings integration of atomic quantum nodes with existing long-distance fiber networks into reach” — into reach, not achieved, and a 1.7% transfer efficiency is what into-reach looks like. The same issue carries a criticality-assisted metrology framework from Peking University and Milan with no experimental numbers, an exact equivalence between stabilizer and Shannon Rényi entropies for Gaussian eigenstates of quadratic fermions from Universidade Federal Fluminense, a quantum cellular automaton treatment of asymmetric exclusion transport from Coventry and Sapienza, and the first bulk sample of ultracold heteronuclear p-wave Feshbach molecules from Garching, Eindhoven and CUHK. Now the conflation warning, which is also this beat’s economics item. There are two separate quantum-voting stories in circulation from the same week and they are different papers, different journals, different countries. The first, reported by Physics World on Aug 25, covers two Physical Review Letters teams — Federico Centrone’s at the Barcelona Institute of Technology, reporting a 96% success rate creating the required entanglement, and Rob Thew’s at Geneva with Joey Marcellino at 87% — with Thew’s honest verdict that “this suffices as a proof-of-principle for the protocol and our modified approach, although obviously we would want to improve these numbers significantly for real-world applications.” The second, in Scientific Reports from Gal Amit, Eliahu Cohen and colleagues at Bar-Ilan, the European Institute of Science in Management and Chapman, was run on IBM’s 156-qubit ibm_marrakesh with five voters and three candidates over six possible rankings; the winner survived a readout error probability of 0.4 and deteriorated sharply at 0.5, with winner-agreement rates of 43% to 80% for randomised electorates, 70% for a cyclic preference profile and 100% for a near-cyclic one. This is a social-choice mechanism running on quantum hardware, tested explicitly on Condorcet cycles — and the authors are admirably clear about what they have not done: the system “is not a complete secure voting protocol,” lacking ballot secrecy, voter authentication and coercion resistance, the scale “is unrealistic for real-world elections using today’s noisy intermediate-scale quantum computers,” and they “did not attempt to prove” anything about Arrow’s impossibility theorem. They encoded ranked ballots; they did not escape the theorem. Also new: a Padua, ThinkQuantum and CNR-IFN team ran quantum key distribution over an 18-kilometre free-space link joined to half a kilometre of fibre, reporting roughly 1,000 bits per second with superconducting detectors against 200 at room temperature, quantum bit error rates below 1% against about 2%, through total channel loss near 30 decibels — with the limitation that this is fixed horizontal ground links in weak-to-moderate turbulence, no satellite motion, no daytime operation, no severe weather. One accounting note: the National Science Foundation’s $37.5 million has now appeared three times in three days, at Chicago, Yale and Illinois. These are components of the same $290 million eight-institute package, not new money. On the mind side, the item a health economist should read is at Nautilus: a PNAS model from Kobe University, RIKEN and the Interdisciplinary Transformation University asking whether updating both the donor’s and the recipient’s reputation stabilises cooperation. A sweep across more than a million norm combinations found 61 producing both high cooperation and evolutionary stability, and all 61 update both reputations. Tham Yukari Jessica reads it in both directions, which is why it is worth teaching: the tendency “may help coordinate reputations and thereby maintain cooperation,” but the same mechanism “could contribute to harmful outcomes such as exclusion or bullying if we treat someone badly simply because we see others treating them badly.” That is a formal model of deservingness judgments with stigma built into it, which is uncomfortably close to how populations decide who warrants publicly funded care. Nautilus also has Climate Central’s finding that the average person lost nearly 56 hours of sleep a year to elevated temperatures between 2020 and 2025 across 1,338 cities, with heat-attributable sleep loss doubling or tripling since the 1970s and the burden concentrated on the over-65s, women and households without air conditioning — of which, as of 2021, only about 35% of households globally had any. Temperature-controlled mattresses at $700 to $5,000 showed only placebo effects in a 34-adult study. The psychedelics beat is now six days dry: no Field Notes #5 at Psychedelic Alpha, the numbered bulletins still stalled at #229 from Aug 7, nothing at all Aug 22 to 27, and every result returned was a known stale item. One correction to Wednesday’s claim that PsyPost carried nothing on Aug 25 — it did: a Translational Psychiatry systematic review of Salvinorin A led by Wolfgang Emanuel Zürrer at Zurich, screening 1,718 publications down to ten studies and about 3,456 animals, finding promise for pain, stroke protection and addiction alongside anxiety-like behaviour and motor and cognitive problems, with inconsistent depression evidence and the candid limitation that “animal models cannot reproduce the complexity of human psychiatric illness.” That corrects the record without breaking the drought. And Buddhistdoor reports the World Buddhist Sangha Council’s 60th anniversary gathering in Sri Lanka from Nov 28 to Dec 1, expecting some 600 representatives from 50 countries plus 500 Maha Sangha members from Sri Lanka’s three Nikayas; Tricycle has nothing since Bashō on Aug 25.",
        s: [["PRL (metropolitan entanglement distribution)","https://journals.aps.org/prl/abstract/10.1103/94hz-xtht"],["The Quantum Insider (quantum voting on IBM hardware)","https://thequantuminsider.com/2026/08/26/quantum-voting-system-shows-resilience-to-noise-on-ibm-hardware/"],["Nautilus (how we decide who deserves our help)","https://nautil.us/how-we-decide-who-deserves-our-help-1284505"],["PsyPost (Salvinorin A meta-analysis)","https://www.psypost.org/a-unique-psychedelic-shows-promise-for-pain-and-stroke/"]] },
      { t: "Director watch: Yayoi Kusama died twelve days before anyone was told, and the Lynch weekender remains a postponement no outlet has reported. The art world’s news of the week is an obituary with a gap in it. Kusama died in a Tokyo hospital on Aug 14, aged 97 — and the death was not announced until Aug 26, by her studio and by David Zwirner, which is why it lands in this window rather than a fortnight ago. Artnet gives the cause as multiple organ failure per Zwirner; Hyperallergic, publishing at 4:42 a.m. Thursday, states no cause. Her studio: “she continued to paint until her final days, never setting aside her brush, and continued exploration of forever love and eternal soul.” Her own line, from earlier: “I will keep on making my art until the day I die. And even after I die, my spirit will keep creating new art.” On Lynch, the scoop holds and has hardened. Both event-controlled pages still carry the postponement — gatheringoftheangels.com’s banner reads “due to unforeseeable circumstances, a Gathering of the Angels 2026 has been postponed to 2027,” with “all ticket holders have been emailed,” “our new dates will be announced soon,” and “bigger and more damn fine than ever next year” — and the homepage has now been stripped bare of guests, venue and prices entirely. Welcometotwinpeaks.com’s event page, published May 6 and last updated Aug 24, still says “this event has been postponed. Ticket holders have been informed,” with the guest list reduced to George Griffith and Sabrina Sutherland. The ticket structure that is now void: £180 weekend general admission, £99.50 single day, £310 VIP weekend, at the Genesis Cinema in Whitechapel for Sept 26–27. Not one press outlet has picked it up, three days after the site update and four weeks before the original date; what surfaces instead is more pre-postponement copy, including a Getyourcomicon piece of Aug 3 still announcing guests. No 2027 dates have been announced. On von Trier the checkpoint returns a no with a new and unusually final quote attached. The screenplay for After is still not finished, and Peter Aalbæk Jensen forecloses the festival speculation directly: “the film isn’t made, so there’s nothing that can be shown at a festival.” His other lines are unchanged — that he heard before the summer break that Lars might with a bit of luck have the screenplay written around August, and that “there will be at least two more years before we have a finished film.” Stellan Skarsgård remains attached, the still-image format modelled on Chris Marker’s La Jetée remains the news, and the Danish Film Institute’s 1.3 million kroner remains the only money. One new detail: the encyclopedia documentary series carries an Ø prefix — Ø – Fragmenter af en encyklopædi. The Ekko date conflict stands unresolved; the article page renders Aug 5 and the site index lists Aug 14, and this desk will keep flagging rather than picking. A new recirculator to reject: World of Reel’s “Lars Von Trier’s Next Film After is Shooting This Summer” is September 2024. Noé is a verified negative for a sixth time, every 2026-dated result an artefact of the same handful of items. Refn is unchanged since May, with Maniac Cop still shooting January 2027 in Los Angeles and still no cast. Criterion’s December slate is still not announced — the Coming Soon page stops at The Right Stuff on Nov 24 — but the September slate is now visible: 12 Angry Men on Sept 8, Shoah and Loznitsa’s Two Prosecutors on Sept 15, Mendonça Filho’s The Secret Agent and Linklater’s Nouvelle Vague on Sept 22, Days and Nights in the Forest and Three Films by Leos Carax on Sept 29. Two corrections to the November listing carried here: Nov 10 is Blue Heron, Marie Antoinette and Shoot the Piano Player, and Wild at Heart in 4K is Nov 17 alongside Shadows of Forgotten Ancestors. Eclipse Series 5 is The First Films of Samuel Fuller. Venice, which opens in six days, is clean of all four directors, and one name-collision trap is worth logging: Nicolas Pariser is in competition with One Minute to Midnight, and is not Nicolas Winding Refn. Elsewhere in the art world, one correction this desk owes itself. It has been reporting that the Smithsonian regents will vote on Aug 31 on housing the National Museum of the American Latino in the Arts and Industries Building. Neither source supports that verb: The Art Newspaper says the regents will discuss the proposal, and Artnet says only that “a decision is expected from the Smithsonian board on August 31.” Use “a decision is expected.” The bypass point is confirmed — using an existing building would avoid the congressional approval the original plan required — and the May 2026 failure of the women’s history museum bill remains the precedent everyone is reading. The building’s status is still contested three ways and this desk will still not state it, though note that The Art Newspaper’s Aug 21 piece has moved toward the others, describing it as currently open but closing Sept 7 for further renovations. Also live: the State Department has removed Kehinde Wiley’s Young Artists After Siamesas from the US embassy in Santo Domingo, where it was installed in 2015 through Art in Embassies with public funds, and is “in the process of discussions with legal representatives to ascertain whether the art can be sold,” on the stated ground that “the work of an individual with such violent and racist words and depictions has no place in the America First State Department.” Photographer Justin Thomas is suing Elizabeth Peyton, David Zwirner and Sotheby’s in the Southern District of New York over her 1996 Earl’s Court (Liam + Noel), alleging it is a “slavish copy” of his 1995 photograph and that “the only transformation is the medium itself.” The Gwangju Biennale reversed course on Aug 25 and approved the name Taiwan Pavilion after renaming it unilaterally. The Vienna Bernini is unchanged and still unveiled. And the Italian video artist Fabrizio Plessi has died at 86.",
        s: [["Hyperallergic (Yayoi Kusama dies at 97)","https://hyperallergic.com/yayoi-kusama-artist-of-infinities-dies-at-97/"],["Welcome to Twin Peaks (event postponed)","https://welcometotwinpeaks.com/event/a-gathering-of-the-angels-2026-david-lynch-celebration/"],["Ekko (von Trier’s screenplay)","https://www.ekkofilm.dk/artikler/lars-von-trier-naermer-nyt-manuskript/"],["The Art Newspaper (Wiley removed from embassy)","https://www.theartnewspaper.com/2026/08/25/kehinde-wiley-painting-removed-us-embassy-dominican-republic-state-department"]] }
    ]}
