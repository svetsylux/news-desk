<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

  brief: [
    { h: "World & geopolitics", items: [
      { t: "The day’s worst hour was Friday afternoon in Kryvyi Rih, and the second wave is the part to hold onto. A drone strike hit the city’s largest shopping and entertainment complex around 4:30 p.m. local, roughly 60 km from the front, in Zelensky’s hometown; about thirty minutes later, with rescue crews already working, a second wave came in. Oleksandr Vilkul, head of the Kryvyi Rih Defense Council, said that second strike used a jet-powered Shahed flying at extremely low altitude — a double-tap, timed for the responders. Interior Minister Ivan Vyhivskyi said fire engulfed a third of the center; Zelensky put the burning area at 9,000 square meters. The toll climbed the way tolls do: first filings said 5 killed and 50 to 90 injured (both the Kyiv Independent and RBC-Ukraine slugs froze at that number), CBS had 15 dead and 130 wounded with 23 children among the injured, Al Jazeera’s body had “at least 15” with 22 children and 29 in serious condition, and by early Saturday Oleksandr Hanzha of the Dnipropetrovsk regional military administration had it at 16 dead with nine people still missing. That is a genuine climb, not competing narratives — CBS, Al Jazeera, the Kyiv Independent and AP converge. Zelensky called it “an absolute Russian atrocity. They’re just monsters,” and separately “attacks like these are nothing less than terrorist acts”; Human Rights Commissioner Dmytro Lubinets said “the Russian army once again proves that civilians are a deliberate target.” Ukraine’s nationwide Friday toll was 21, including two in Kharkiv region and four in Mykolaiv region, three of them children. Worth stating as an absence rather than a claim: searches surfaced no TASS coverage of the Kryvyi Rih strike at all, and the Russian state-wire content verifiable for the window consists entirely of intercept counts.",
        s: [["Al Jazeera","https://www.aljazeera.com/news/2026/8/21/russian-drone-attack-on-busy-shopping-centre-kills-14-in-ukraine"],["AP (via ClickOrlando)","https://www.clickorlando.com/news/world/2026/08/22/russian-attacks-on-ukraine-kill-2-people-a-day-after-deadly-shopping-mall-drone-strike/"],["ISW (Aug 20)","https://www.kyivpost.com/post/82794"]] },
      { t: "Ukraine answered at 1,600 kilometres, and the mirror ledger stayed unreadable in the usual way. Drones hit the Lukoil-Permnefteorgsintez refinery in Perm Krai — well over 1,600 km from the border, the fourth reported strike on that plant this year, a facility that processes 12.6 million tonnes of crude annually — with the AVT-5 crude unit reportedly damaged. Meduza reported sirens, a drone-threat alert and suspended flights at Perm’s airport, with smoke visible per the independent Telegram channel Astra, and noted that Perm Krai authorities had provided no account of the aftermath by publication. The Kyiv Post added the Marynovka military airfield in Volgograd, a Su-34 reportedly damaged at Akhtubinsk, and a drone launch site at Primorsko-Akhtarsk. Zelensky: “We continue to use our long-range sanctions to return the consequences of the war to where it came from.” The counts do not reconcile and are not meant to: Ukraine claimed 107 of 135 Russian drones intercepted overnight, while Russia’s Defense Ministry claimed 325 Ukrainian drones downed overnight across fifteen regions and another 211 later Friday — roughly 536 for the day — with Sergey Sobyanin reporting seven aimed at Moscow. ISW’s Aug 20 assessment names only two specific advances, in northern Sumy Oblast and on the Pokrovsk axis, and flags Russia stockpiling ballistic and cruise missiles while integrating North Korean systems including an upgraded KN-30; GlobalSecurity’s parallel log for Aug 21 counts 172 combat engagements, 75 airstrikes, 219 guided bombs and 23 attempted Russian assaults at Pokrovsk alone. Overnight into Saturday, ballistic missiles hit railway infrastructure in Kyiv, killing one: Zelensky confirmed casualties, Russia’s Defense Ministry said it had struck “a locomotive depot.” Both statements can be true, which is the point.",
        s: [["Kyiv Post","https://www.kyivpost.com/post/82804"],["Meduza (EN)","https://meduza.io/en/news/2026/08/21/ukrainian-drones-attack-russia-s-perm"],["AP (via ClickOrlando)","https://www.clickorlando.com/news/world/2026/08/22/russian-attacks-on-ukraine-kill-2-people-a-day-after-deadly-shopping-mall-drone-strike/"]] },
      { t: "Moscow said it would listen; Kyiv’s corruption file grew; and a Russian state economist was fired for saying what the fuel numbers say. Deputy Foreign Minister Sergey Ryabkov: “The Russian Federation is ready to listen to any reasonable proposals and ideas that are in line with the goals set by the Russian president and meet the ‘realities on the ground’” — a formula that concedes nothing, since those goals still include Ukraine ceding all of Donbas, demilitarizing and renouncing NATO. He added that what matters is “to what extent Washington is able to influence the decisions of the Kyiv regime and its European sponsors, who still dream of a ‘strategic defeat’ of Russia.” Zelensky said he was “preparing decisions within the diplomatic team.” No verifiable Witkoff, Kushner or Ushakov development exists in this window — the recirculating Kremlin-visit story remains December 2025, and the absence is worth stating plainly. Domestically, NABU’s file on Iryna Mudra, dismissed as deputy head of the President’s Office on Aug 19, widened: beyond the 150-million-hryvnia bail-laundering scheme (wiretap: “Either we make it 150, or we do nothing”; “Corruption needs to be systematised and controlled”), new tapes released Aug 20 allege a separate corporate-raiding operation with sitting MP Vadym Stolar and ex-MP Maksym Mykytas — unauthorised interference with Ministry of Justice databases to seize roughly 248 million hryvnia in enterprises. On the Russian side, Rosneft imposed a 30-litre national cap on gasoline, down from 90-litre fills in June; Gazprom Neft caps Moscow at 40 litres and St Petersburg at 60 per receipt; Lipetsk is rationing by licence plate. Refining output is down to 3.6 million barrels a day, the lowest since May 2002 and about 30% below the seasonal norm, with at least 26 refineries knocked offline at peak. Andrey Klepach, chief economist at the state development bank VEB, said Ukrainian strikes are “a significant macroeconomic barrier to Russian economic growth” and that “I believe Russia won’t collapse, but I’m almost certain we’ll reach a social crisis.” He was removed from his position after the remarks. From the other bench, Glenn Diesen’s Aug 20 essay reads the whole conflict upstream of any of this: “A declining hegemon will predictably seek to weaken rising powers, and all ‘universal values’ that no longer sustains hegemony can be thrown out the window.”",
        s: [["Al Jazeera (Ryabkov)","https://www.aljazeera.com/news/2026/8/21/russia-ready-for-new-ideas-on-ukraine-war-that-match-putins-goals"],["Al Jazeera (Klepach)","https://www.aljazeera.com/news/2026/8/21/russian-expert-warns-of-impending-social-crisis-as-ukraine-death-toll-rises"],["Glenn Diesen","https://glenndiesen.substack.com/p/on-the-path-to-world-war"]] },
      { t: "On Iran the announced campaign is now four days old and still mostly announced. Treasury did act on Thursday, designating ten people — nine Turkish nationals and one Iranian, described as the Yunus Alper Yilmaz cash-courier network moving hundreds of millions to Hezbollah through Lebanon, Turkey and the UAE — and re-designating Hezbollah as an agent of the IRGC-Quds Force. That is a real action and a narrow one. The “toughest sanctions in history” package Bessent has been promising will not be detailed until a Monday, Aug 24 press conference. His framing meanwhile: “It is a one-two punch. We have the blockade, and we are going to have the toughest sanctions in history”; “It is going to work in Iran, and we are going to collapse this regime”; and to third countries, “You’re either with us or against us.” The strike pause held a 22nd consecutive night. Hormuz produced a third mutually incompatible number: Kpler data via GlobalSecurity counts 236 vessels transiting Aug 1–19, of which 148 — more than 60% — went dark with transponders off, rising to 89 of 112 energy carriers, over 80%. That is not reconcilable with either the 2–3 transits a day or the 17% of pre-conflict average this brief carried a week ago, and none of the three should be treated as settled. Brent closed Aug 20 at $93.01, a fifth straight gain against a roughly $66 pre-war baseline. Tehran’s framing is that the pivot to economics is itself the concession: President Masoud Pezeshkian said “it is better that we bring the war to an end now as we are in a position of power and dignity,” and Speaker Mohammad Bagher Ghalibaf that the Americans and Israelis “have realised that they cannot handle Iran… in the field of a hard military war, so they have entered into a cognitive war and an economic war.” Trump’s read: “they would love to make a deal, but they’re not ready to make the right deal.” Larry Johnson at Sonar21 attacks the oil story from the supply side — the US Strategic Petroleum Reserve is down from 415 million barrels pre-war to 298.7 million, which he calls the lowest since 1983 — and concludes “oil is not priced off sanctions announcements; it is priced off barrels reaching refineries… The market isn’t confused. It’s presenting the bill — and the reserve that was quietly paying it is empty.” Mearsheimer, writing Aug 20, casts it as mutual strangulation: “The US is betting it can strangle Iran’s economy to the point where Iran will concede defeat,” while “Iran is effectively betting that continuing to limit the flow of oil and gas out of the Strait of Hormuz will threaten the US economy.” Elsewhere in the region, Israeli tank fire hit villages in southern Lebanon on Friday, and Turkey, Qatar and Egypt issued a joint mediators’ statement warning that “the intensification of Israeli attacks undermines regional and international efforts at a critical juncture.”",

      { t: "Ross Stores is the counter-reading to Walmart, and the metals are the counter-reading to the yields. Ross beat on both lines, raised full-year earnings guidance and closed up 5.79% after running 8–9% premarket — twenty-four hours after Walmart beat, raised, and lost 9.2% on a US comparable-sales miss. The two prints are the same consumer described twice: a shopper trading down is a problem for the incumbent’s comps and a tailwind for off-price, and the market paid each stock according to what its own price already assumed rather than according to the level of the results. Elsewhere the day belonged to everything that trades against the dollar, which slid below 99 on the index. Gold ran up roughly 1.9–2.4% — Kitco’s PM print was $4,602.99, other wraps had it as high as $4,680 — with Kitco’s explanation that “gold has held the breakout because the dollar has fallen below 99.00, fiscal concerns remain front and center,” notable because elevated yields would normally do the opposite. Silver finished near $69, up about 4.9% on the week, 21.1% on the month and 79.3% on the year. Bitcoin surged past $77,000 for its best week in two years, dragging MicroStrategy up 7.6% premarket. Crude went nowhere by comparison: WTI hovered around $86.6–86.8 and Brent just above $94, essentially flat after Thursday’s jump. Flowers Foods fell 5.7%. The through-line, if there is one, is that a weakening dollar and rising long yields at the same time is not the usual pairing, and the assets that rallied are the ones that read it as a fiscal story rather than a growth story.",

    { h: "Health & policy", items: [
      { t: "A 51-hospital system is closing its insurance arm entirely, and the reason it gives is scale. Providence is shutting Providence Health Plan after a deal to hand its Medicare Advantage book to an unnamed national carrier collapsed — about 440,000 covered lives, including more than 64,000 MA seniors. The financials are the argument: the insurance division lost over $100 million in 2025 and was still losing roughly $4 million in the first half of 2026, while the parent system swung to $349 million in net income over the same six months, from a $69 million loss a year earlier. The hospitals are fine; the insurer is not, and has not turned an annual profit in four straight fiscal years. CEO Erik Wexler, from the May wind-down announcement: “Larger insurance companies have consolidated significantly, giving them the size and resources to operate more efficiently.” Baylor Scott & White is exiting Medicaid and ACA lines this year too. Read together with Centene — which posted $1.1 billion in second-quarter profit against a $253 million loss a year earlier, after restructuring its exchange business and shrinking Medicaid membership while states raised acuity-adjusted rates — the pattern is regional and provider-owned plans retreating while national incumbents reprice and hold. The cost side points the same way. Aon projects employer health costs rising 9.5% in 2027 to more than $19,000 per employee, after 8.8% this year, from a survey base of 1,100-plus employers and $135 billion in 2026 spend; employees are already carrying $5,297 on average. And Peterson-KFF’s compilation of 2027 ACA rate filings from 276 insurers across all fifty states finds a median proposed increase of 15%, a second straight double-digit year, of which insurers attribute roughly four percentage points specifically to the expiring enhanced premium tax credits — with filing language stating that “healthier consumers are more likely to lapse coverage.” That is adverse selection asserted by the party with money on it, in a regulatory document, which is rarer and better evidence than any commentary about it.",

      { t: "Medicare’s $50 GLP-1 pilot has an eligibility rule that excludes the patients with the most to gain. The Bridge pilot prices the drugs at $50 a month, but only for beneficiaries using them exclusively for weight loss — anyone whose chart also carries type 2 diabetes or sleep apnea, conditions the same molecules treat, is disqualified even when obesity is the underlying driver. NPR puts the excluded population at about 5.9 million Medicare enrollees. The illustrative case is Jeff La Marca, a retired professor with a BMI of 42, prediabetes and stroke risk, denied the pilot and facing standard Part D copays that Kansas physician Dr. Taylor Lacy puts at “$200 to $600” a month; his prescription is unfilled. CMS’s stated rationale is to isolate prevention-driven savings before chronic disease develops, which is a defensible research design bearing a real and uncounted welfare cost. Three other Friday items belong beside it. The Justice Department has reversed a 25-year-old interpretation requiring states to offer home and community-based alternatives to institutionalization — advocates call it a one-two punch alongside federal Medicaid cuts, though that characterization is theirs and no independent fiscal estimate exists; note only that home-based care is generally the cheaper setting, so the change pushes some states toward the costlier one for reasons unrelated to cost. HHS and CDC posted a Request for Information to the Federal Register on Friday, opening a 30-day comment window on new vaccine recommendation tiers including one for vaccines “recommended but not during infancy” — worth watching because the ACA’s no-cost-sharing preventive mandate is keyed to recommendation status, so a tier change is a coverage change. And Heidi Overton’s FDA nomination remains unresolved, with Sen. Patty Murray committed against and Sen. Bill Cassidy publicly uneasy. Closer to home, KFF’s piece on hospital violence — healthcare workers are seven times as likely as other workers to suffer violence-related job injuries — leads on the 700-plus workers who have now been on strike at Henry Ford Genesys in Grand Blanc for more than eleven months.",

    { h: "Campus & culture", items: [
      { t: "Ypsilanti Township’s case against the data center is now an equity argument, and the paper trail is still missing. The 180-day moratorium on major electric infrastructure serving hyperscale and AI computing facilities passed Aug 18; the township’s own site describes the vote as unanimous but still posts no resolution number, no text and no roll call for it — the only resolution number visible on that page attaches to an earlier, separate water-service moratorium. Treat “unanimous” as characterization. The project is U-M’s computing center with Los Alamos on 144 acres on Textile Road, bordering the Huron River and a public park, reported at $1.2 billion by Bridge and 404 Media and $1.25 billion by Michigan Public; the frequently cited 110-megawatt DTE substation figure could not be independently confirmed this week and should be handled carefully. Township General Counsel Doug Winters has moved from procedure to distribution: “we don’t want them anywhere in this township,” “is there no moral authority left anymore at the decision-making level?” and, most pointedly, “they would not put this in Ann Arbor” — the claim being that the site was chosen because the township has fewer resources to resist. Supervisor Brenda Stumbo: “They’re making this decision regardless of what our residents want. I feel like we don’t matter to them.” U-M President Domenico Grasso answers on a different axis entirely: “Universities like Michigan are built by generations willing to invest in discoveries and opportunities they may never live to see,” adding that “we are equally committed to listening to our neighbors.” In-person registration for the Sept 9 town hall at the Ann Arbor Marriott Ypsilanti at Eagle Crest is at capacity with a waitlist open; a livestream will run. The rest of the state, briefly: Wolverine Village opens for early move-in this weekend with about 2,300 beds across five halls, though the Michigan Daily has reported construction delays that may put some residents in temporary dorms and its site cannot be fetched to verify; the Regents vote formally on C. Cybele Raver as seventeenth president Sept 1, for a Dec 1 start; Dana Nessel filed a sixth rehearing request over DOE’s forced operation of the J.H. Campbell coal plant, calling it an attempt “to force an aging, obsolete plant to operate indefinitely”; the Board of State Canvassers takes up the proof-of-citizenship petition Monday, 17 valid signatures short in a 1,000-signature sample; and Detroit’s restarted Pay As You Stay, with the HOPE exemption, has kept nearly 18,000 households out of foreclosure since 2020.",
        s: [["WEMU","https://www.wemu.org/wemu-news/2026-08-20/ypsilanti-city-council-contemplating-vacancy-tax"],["ClickOnDetroit (Wolverine Village)","https://www.clickondetroit.com/all-about-ann-arbor/2026/08/20/university-of-michigans-wolverine-village-opens-this-weekend-with-2300-new-beds/"],["Michigan Public (Nessel)","https://www.michiganpublic.org/environment-climate-change/2026-08-20/michigan-ag-challenges-the-us-department-of-energy-again-over-coal-plants-forced-operation"],["U-M Record (town hall)","https://record.umich.edu/articles/u-m-to-host-town-hall/"]] },
      { t: "The tenure-track number went up 7% and nobody who studies this believes it means what it looks like. CUPA-HR’s survey of more than 900 institutions, running November 2024 to November 2025, shows tenure-track faculty up 7% — the largest single-year rise since 2016, and the first time in a decade that tenure-track growth outpaced non-tenure-track. Underneath it, full-time staff fell 6.6% and part-time staff fell 23.9%, after a 21.1% surge the year before. Robert Kelchen of Tennessee calls the faculty jump “almost implausible” given sector conditions and reads it as searches already well under way before the February 2025 policy shifts landed; on the faculty-versus-staff divergence he says simply, “I don’t have an explanation for that.” The AI story has moved from policy statements to graduation requirements. Indiana’s Kelley School now requires AI 101 and AI 201 of every incoming undergraduate, with weekly “What’s New in AI” lessons, run by accounting professor Brian Williams; Purdue requires one of 22 AI courses and had to modify 331 plans of study, with Senior Vice Provost Haley Oliver-Jischke telling faculty to “be clear, be specific, be prescriptive, so that everybody’s on the same page” in syllabus AI language; Coastal Carolina has a librarian teaching AI in the research process for core credit. The assessment item worth stealing is older than this week and better than anything in it: Birkbeck law professor Stewart Motha reinstated invigilated in-person exams in which students may bring handwritten notes, and more than 45% of his students earned first-class grades against 13% the previous year under take-home essays. His account of why — “it was a return to the university as a site for learning how to learn” — is worth more scrutiny than the grade jump, since a distribution shift that large is at least as consistent with a change in what the assessment rewards as with a change in what students learned. Bath moves to a two-lane system next year with a closed lane that is timed, invigilated and in person. Meanwhile the visa suit filed Aug 18 in Massachusetts federal court — NAFSA, the Presidents’ Alliance and the AFT among the plaintiffs — argues the four-year duration-of-status cap taking effect Sept 15 is arbitrary and capricious, DHS having relied on anecdotes covering 0.067% of the roughly 3.1 million affected visa holders.",
        s: [["Inside Higher Ed (CUPA-HR)","https://www.insidehighered.com/news/quick-takes/2026/08/21/tenure-track-ranks-grew-last-year-survey-finds"],["Inside Higher Ed (AI fluency)","https://www.insidehighered.com/news/faculty/teaching/2026/08/20/ai-requirements-and-courses-colleges-eye-ai-fluency"],["THE (in-person exams)","https://www.timeshighereducation.com/depth/are-universities-returning-person-exams-combat-ai-cheating"]] },
      { t: "Mind & cosmos: a fabrication trick, a classical method beating a quantum annealer, and organoids that kept developing for five years. Cornell’s Valla Fatemi group, in Nature Materials, swapped argon for krypton as the sputtering gas and got body-centered-cubic tantalum films onto silicon at 200°C instead of the 400°C-plus that conventional methods demand — qubits from those films reached quality factors up to 16.9 million. Fatemi: “We figured out a relatively simple change… to bring that temperature down into a zone that is translatable to nanofabrication systems in industry.” It is a materials result, not a bigger processor, and the coverage does not address yield at scale. Running the other way, Joseph Tindall and colleagues at the Flatiron Institute benchmarked a classical tensor-network method — belief-propagation message passing — against D-Wave’s Advantage2 on Ising spin-glass dynamics, and the classical approach showed markedly lower error on cylindrical and diamond lattices, with comparable error on cubic at fixed annealing time. The authors frame it as one model class rather than a verdict, which is the correct amount of modesty and rarer than it should be. In psychedelics, a Bar-Ilan meta-analysis in Neuroscience and Biobehavioral Reviews pooled ten studies and 39 effect estimates on MDMA and oxytocin: release peaks 150–200 minutes after dosing and persists about five hours. The honest number is the one the authors lead with — time, dose and sex together explain only about 25% of the variance, peripheral oxytocin may not track central activity, and the pooled studies are methodologically inconsistent. Psychedelic Alpha’s Aug 21 Field Notes records Resilient refiling its MDMA-for-PTSD NDA, Definium releasing initial Phase 3 topline for LSD in generalized anxiety without disclosing efficacy figures, and J&J leading an $85 million Series C in Delix. And in Nature, a Utrecht group led by Noelia Antón-Bolaños kept cerebral organoids in culture for five years, finding they tracked human developmental timelines past the first year into post-birth milestones and that mature cells retained a developmental “memory,” regaining neurogenic capacity when mixed with younger cells — with the paper stating plainly that the organoids remain far too simple for memory or consciousness, a caveat worth carrying every time this line of work is described.",
        s: [["The Quantum Insider (tantalum)","https://thequantuminsider.com/2026/08/19/new-tantalum-process-could-ease-manufacturing-of-superconducting-quantum-chips/"],["Physics World (tensor networks)","https://physicsworld.com/a/no-quantum-advantage-yet-in-the-world-of-tensor-networks/"],["PsyPost (MDMA/oxytocin)","https://www.psypost.org/meta-analysis-confirms-mdma-triggers-sustained-oxytocin-release/"],["Nautilus (organoids)","https://nautil.us/the-remarkable-lives-of-5-year-old-brain-organoids-1284120"]] },
      { t: "Director watch: von Trier has a fifteenth film written, and a death hoax is circulating alongside it. World of Reel reports that the screenplay for a final feature titled After is nearly complete — a film about mortality and the afterlife drawing on von Trier’s own reflections, with no cast attached and 1.3 million kroner committed by the Danish Film Institute. It would be his first since The House That Jack Built in 2018. Producer Peter Aalbæk Jensen of Ekkof Film, addressing the Parkinson’s diagnosis directly: “Physically, Lars is affected, but there’s nothing wrong with his mind.” Separately and unrelatedly, an Instagram post reading “(1956–2026) Lars von Trier is gone” is going around; multiple death-hoax trackers identify it as a recurring fabrication, and the Aug 9 reporting above postdates nothing that would support it. Nothing verifiable this week on Lynch, Noé or Refn — the Lynch items in circulation resolve to a 2022 Pace Gallery piece and a June 2025 Peter Deming interview about the unfinished Unrecorded Night, the Noé casting story remains the unreconfirmed July 2023 one, and the Refn material restates July interviews around Her Private Hell and the announced Maniac Cop revival. In the art world, the Guggenheim Foundation has sued Massachusetts residents Lawrence Jay Handler and Wendy Cohen Handler in New York State Supreme Court over Picasso’s Femme dans un fauteuil (1918), stolen from the University of Pittsburgh Student Union on Feb 6, 1961 while on loan. The painting resurfaced during a Christie’s valuation in July 2023; the Handlers bought it in 1999 from a Manhattan dealer and refused a return demand in August 2023, and it has sat at Christie’s since. The Guggenheim seeks $3.5 million; the 1961 insurance payout was $7,000. A spokesperson: “The Guggenheim is and always has been the painting’s rightful owner, and we look forward to its recovery.” Two NAGPRA notices also publish Monday — the American Museum of Natural History returning a ceramic pipe to the Stockbridge Munsee Community, and the Princeton University Art Museum a ceramic vessel to the Quapaw Nation, both eligible for repatriation on or after Sept 23.",
        s: [["World of Reel","https://www.worldofreel.com/blog/2026/8/9/lars-von-trier-almost-finished-screenplay-for-his-final-film"],["Hyperallergic (Picasso)","https://hyperallergic.com/a-picasso-vanished-in-1961-the-guggenheim-now-wants-it-back/"],["Hyperallergic (Speed repatriation)","https://hyperallergic.com/speed-art-museum-returns-24-native-artifacts-to-oklahoma-tribes/"]] }
    ]}

  hooks: [
    { story: "Providence, a 51-hospital system, is closing its health plan entirely after a deal to transfer its Medicare Advantage book collapsed — about 440,000 covered lives, more than 64,000 of them MA seniors. The insurance arm lost over $100 million in 2025 and was still losing roughly $4 million in the first half of 2026, while the parent hospital system earned $349 million in net income over the same six months. No annual profit from the plan in four straight fiscal years. CEO Erik Wexler: ‘Larger insurance companies have consolidated significantly, giving them the size and resources to operate more efficiently.’",
      src: ["Healthcare Dive","https://www.healthcaredive.com/news/providence-health-plan-medicare-advantage-deal-fails-closure/828195/"],
      concept: "Economies of scale in risk-bearing, and exit as a source of concentration",
      q: "Start with the arithmetic that makes insurance different from most businesses, because students almost never have it. If claims across n enrollees are independent with variance σ², the variance of average claims is σ²/n — so the standard deviation of the average falls as the square root of n. Have them compute it: quadruple the enrollees, halve the per-member risk. That single fact means the capital an insurer must hold per covered life falls with size, and it is a genuine technological economy of scale, not a bargaining story. Then ask what else scales. Network contracting is a fixed cost spread over members; so is the actuarial and compliance apparatus; so, importantly, is the machinery of MA star ratings and risk adjustment, which is expensive to run well and pays off in proportion to enrollment. A 440,000-life plan is not small in absolute terms and still could not clear the bar. Now the interesting part, which is why the parent was profitable while the subsidiary bled. Ask students to state the theory of vertical integration here — the hospital owns the insurer so it can internalize the margin and steer utilization — and then ask what that theory predicts about the losses. It predicts they should show up as gains upstream, which makes the accounting separation partly an artifact. Push them: is Providence exiting because insurance is unprofitable, or because the internalized gain no longer covers the standalone loss? The evidence cannot settle it, and saying so is the point. Close on the market-structure consequence, which is the part policy people miss. Every provider-owned regional plan that exits raises concentration among national carriers, which raises their scale advantage, which raises the bar for the next regional plan. That is an entry-barrier feedback loop generated by ordinary competitive exit, with no anticompetitive conduct anywhere in it — and it is a good place to ask what, if anything, an antitrust authority is supposed to do about a market that concentrates because concentration is efficient."},
    { story: "Medicare’s GLP-1 Bridge pilot charges eligible seniors $50 a month, but only those using the drugs exclusively for weight loss. Anyone whose chart also carries type 2 diabetes or sleep apnea — conditions the same drugs treat — is disqualified, even when obesity is the underlying driver. NPR estimates about 5.9 million Medicare enrollees are excluded. One denied patient, a retired professor with a BMI of 42 and prediabetes, now faces standard Part D copays a Kansas physician puts at ‘$200 to $600’ a month; his prescription is unfilled. CMS says the restriction is meant to isolate prevention-driven savings before chronic disease develops.",
      src: ["NPR","https://www.npr.org/2026/08/19/nx-s1-5931390/medicares-pilot-glp-1-discount-program-has-a-catch-some-sick-patients-dont-qualify"],
      concept: "Categorical eligibility, screening on a proxy, and inverted subsidy incidence",
      q: "Ask first what a benefit-maximizing planner would do with a fixed subsidy budget, and get the answer stated as a rule: allocate to the patients with the highest marginal health return per dollar. Then ask who those patients are here. Students will say the sickest — the ones with obesity plus prediabetes plus apnea risk — and they will be right, which sets up the collision, because those are exactly the people this rule excludes. Make them articulate the inversion precisely: eligibility is decreasing in expected benefit, so the subsidy is targeted opposite to where it does the most good. Now defend CMS, because the design is not stupid and treating it as stupid teaches nothing. The comorbidity screen exists so that any measured savings can be attributed to prevention rather than to treating an already-present disease — it is a rule chosen for identification, not for allocation. Have students name the tradeoff in its own terms: cleaner causal inference purchased with real forgone health in a specific, identifiable population. Ask whether that trade is ever worth making, and under what conditions. It sometimes is, which is the uncomfortable part. Then attack the proxy itself. Diagnosis codes are observable; underlying causal structure is not. A patient whose apnea is caused by obesity is coded identically to one whose obesity is incidental, so the rule screens on a variable that is correlated with, but not equal to, the thing it means to exclude. Ask what the coding response will be — clinicians who understand the rule can often choose which diagnosis leads — and you have arrived at Goodhart's law arriving through a billing system. Good extension for an intermediate section: model this as a mechanism-design problem where the principal wants a clean estimate and the agents want access, and ask whether a randomized allocation among all clinically eligible patients would give CMS better identification and better allocation simultaneously. It would, which raises the sharper question of why lotteries remain politically unusable for allocating medical benefits."},
    { story: "Andrey Klepach, chief economist of Russia’s state development bank VEB, said publicly that Ukrainian strikes represent ‘a significant macroeconomic barrier to Russian economic growth,’ adding: ‘I believe Russia won’t collapse, but I’m almost certain we’ll reach a social crisis.’ He was removed from his position after making the comments. Separately this week, Russian refining output fell to 3.6 million barrels a day — the lowest since May 2002 — with Rosneft capping gasoline at 30 litres per vehicle nationwide, down from 90-litre fills in June, and rationing in effect across dozens of regions.",
      src: ["Al Jazeera","https://www.aljazeera.com/news/2026/8/21/russian-expert-warns-of-impending-social-crisis-as-ukraine-death-toll-rises"],
      concept: "Cheap talk, censorship as a tax on information, and the principal who ends up uninformed",
      q: "Set this up as a sender-receiver problem and let the structure do the work. An expert observes the state of the economy and reports to a principal; the principal wants an accurate forecast; the expert wants to keep his job. Now impose the observed policy: reports above some pessimism threshold trigger dismissal. Ask students what the equilibrium reporting strategy is, and they will find it quickly — truncate at the threshold, report the worst permitted number regardless of what you saw. Then ask the question that makes it interesting: what does the principal learn from a report at the threshold? Nothing. The message has been stripped of its information content by the very rule meant to control it, and the principal has purchased silence at the price of his own situational awareness. This is the formal core of why authoritarian systems get bad forecasts, and it is worth insisting that it is a structural result rather than a claim about anyone's competence. Push on the second-order effects. If the principal knows the constraint exists, he should discount optimistic reports — but he cannot recover the discarded information, only distrust what remains, which pushes him toward informal channels and personal networks that are noisier still. Ask what happens to the market for economic statistics under this regime, and connect it to something concrete: there is a strand of applied work using satellite nightlights and other physical proxies precisely because reported Russian figures are treated as unreliable. Ask why an outside researcher would pay a large measurement cost to avoid free official data, and what that revealed preference implies about the data's value. Close by turning it around, which is where the discussion earns its keep with an American undergraduate. Ask where else a reporting agent faces punishment for unwelcome news — a division head forecasting to a CEO, an analyst covering a client's stock, a scientist whose grant renewal depends on the finding, a graduate student telling an advisor the experiment failed. The Klepach case is legible because the firing was immediate and public. Ask them to specify what would make the same distortion invisible, and you have taught something about institutional design rather than about Russia."}

  pulse: [
    { cat: "Listening", t: "A new artist broke on two charts at once while an 18-week No. 1 refused to move",
      why: "Ella Langley’s ‘Choosin’ Texas’ took an 18th consecutive week at No. 1 on the Hot 100 and is still pulling 1,348,488 Spotify streams a day, closing on the record for the longest run by a non-holiday song. Behind it, STELLA LEFTY’s ‘Boston’ moved to No. 11 on the Spotify US daily with 723,512 streams and simultaneously went 6 to 4 on the Hot 100 — cross-platform confirmation, which is what separates a genuine breakout from an algorithmic blip on one service. The other thing to notice is genre: roughly a quarter of the daily top 30 is country or Americana, with Langley holding four separate entries. That is not a country revival so much as the disappearance of the format wall. Radio sorted music into stations and each station had its own chart; a playlist-driven chart has no such partition, so country now competes head-on with pop and hip-hop for the same slots, and an artist who would once have topped a genre chart in parallel now shows up at the top of the only chart there is.",
      rec: "If a student mentions an artist you don’t know, the useful follow-up isn’t ‘what genre is that’ — it may not have one. Ask where they first heard it. The answer is a distribution channel, and the channels are what have actually changed.",
      src: ["kworb / Spotify US daily","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Watching", t: "Spider-Man hit $800 million faster than any film has, and a 55% horror sequel is still opening big",
      why: "Spider-Man: Brand New Day is going for a fourth straight weekend at No. 1 after $70.7 million last weekend, has become the fastest film ever to cross $800 million domestic ($803.9 million as of Aug 20), and has passed $2 billion worldwide — making it the highest-grossing Spider-Man film, above No Way Home. Opposite it, Insidious: Out of the Further is projected to open at $20–30 million despite a 55% Rotten Tomatoes score. That gap between reviews and opening is not students ignoring critics; it is a genre where the review carries almost no decision-relevant information. A horror film is bought as a group event with a fixed showtime, and the thing being purchased — being scared in a room with your friends — is barely correlated with whether the plot holds up. It is also unusually spoiler-resistant, which means the reaction clips that flood the feed after opening night function as free advertising rather than as a substitute for the ticket.",
      rec: "Worth knowing that ‘we’re going Friday’ is often the whole reason, independent of the film. If you want a conversation opener that doesn’t require you to have seen anything, ask who they go to movies with — theatrical horror is one of the last genuinely social media habits under 25, and they will tell you more than you expected.",
      src: ["Boxoffice Pro","https://www.boxofficepro.com/weekend-preview-spider-man-going-for-four-in-a-row/"] },
    { cat: "Reading", t: "The series dominating the bestseller lists got there through audio, not BookTok",
      why: "Matt Dinniman’s Dungeon Crawler Carl and its sequel The Dungeon Anarchist’s Cookbook both appear on four or more of the five major bestseller lists this week. The interesting part is the route, because it is not the one people assume. This did not come up through the BookTok romantasy pipeline; it came up through audio. The series is produced by Soundbooth Theater as a full-cast dramatized production rather than a single narrator, which makes it structurally closer to prestige television or a serialized podcast than to an audiobook — bingeable, clippable, and a natural fit for Audible’s credit model, which rewards exactly the long-running series a subscriber can sink a year into. That explains something otherwise odd: it charts on traditional print bestseller lists that BookTok hits often cannot crack, because the audio audience and the print audience are additive markets rather than the same one counted twice.",
      rec: "Advising, not teaching. When a student says they don’t read, the question that actually gets an answer is what format — a student sixty hours into an audio series will not describe themselves as a reader, and the distinction matters if you are trying to gauge whether long-form attention is the problem or just print.",
      src: ["Book Riot","https://bookriot.com/bestselling-books-august-20-2026/"] },
    { cat: "Online", t: "An unaired 2018 SNL sketch is the format of the month",
      why: "‘The Other Cavaliers’ — a shelved sketch with Donald Glover, Kenan Thompson, Pete Davidson and Kyle Mooney as the useless end of an NBA bench — resurfaced on Instagram Reels in late July and is now an exploitable template for whoever contributes nothing to a group. The clip is eight years old and was never broadcast. That is the whole mechanism worth understanding: a recommendation feed has no structural bias toward recency, so a piece of shelved broadcast content is exactly as eligible for distribution today as something uploaded this morning. Radio, television schedules, and retail shelves all had a retirement function built in, because space was finite and something had to leave for something new to arrive. A feed has no such constraint, which is why the same pattern shows up simultaneously in music charts full of 1998 songs and in Prime Video’s top ten carrying a series cancelled in 2012.",
      rec: "Context rather than material. If a student references something that predates them, the safe assumption is not that they discovered a classic — it is that the feed served it, undated and uncontextualized. That is a real difference in how a shared reference gets built, and it is worth a moment before assuming common ground.",
      src: ["Know Your Meme","https://trending.knowyourmeme.com/editorials/meme-review/the-weekly-meme-roundup-pinkchyu-the-other-cavaliers-kinda-chic-trend-and-more"] },
    { cat: "Online", t: "‘Brainrot’ is now a supply-side phenomenon, not a taste",
      why: "Whispering Pigeon, an AI-generated character that murmurs absurd non-sequiturs, broke in early August and sits alongside formats like ‘It’s a Clock’ — a sped-up Hunger Games sample used to flag an obvious pattern someone just noticed. It is tempting to read this as a story about attention spans. It is better read as a story about costs. The marginal cost of producing a piece of short-form video has collapsed toward zero, and the platform’s reward function optimizes watch-time and rewatch rather than coherence, so the equilibrium output is content that is cheap to make and rewards a second viewing without rewarding comprehension. The audio-sample formats work by a different logic worth separating out: the joke is entirely in recognizing the sample, so participation costs nothing and the payoff is a demonstration of shared reference — a very low-effort, very legible in-group signal.",
      rec: "The one thing not to do is treat this as evidence of decline in front of a class. A student who posts AI slop is generally aware that it is slop; the irony is the point, and missing that reads as not understanding rather than as disapproving.",
      src: ["Know Your Meme","https://knowyourmeme.com/newsfeed/trending"] },
    { cat: "Playing", t: "Carlsen won the Esports World Cup chess event undefeated; the $75 million tournament closes tonight",
      why: "The 2026 Esports World Cup, relocated to Paris after regional flight disruption made Riyadh unworkable, ends Aug 23 with the Counter-Strike 2 grand final — the last event of a seven-week, $75 million tournament covering 24 titles, split between $30 million for a club championship across the top 24 organizations and $39 million across individual events. Magnus Carlsen took the chess title on Aug 15 without losing a match, beating 19-year-old Denis Lazavik 3–1 in both sets of the rapid final, and noted afterward that every opponent he faced was born after 2000. Prize money ran $250,000, $190,000 and $145,000 for the top three. Chess being in an esports event at all is worth a second’s thought: the game did not change, the narration layer did — streaming commentary added a real-time explainer between the board and the audience, which is what converted a spectator-hostile game into watchable content.",
      rec: "The chess event is the ten-minute entry point if you ever want to see what this looks like. And if a student names an org — T1, G2, Team Falcons — it is a club fielding teams across unrelated games, not a single team, so asking which titles they field is a real question rather than a polite one.",
      src: ["Tech Times","https://www.techtimes.com/articles/317143/20260525/esports-world-cup-2026-moves-paris-middle-east-conflict-forces-record-75m-event-out-riyadh.htm"] }
  ],
  classnote: { t: "Four of the top thirty songs on the US Spotify daily chart this week are between 18 and 49 years old: The Killers’ ‘Mr. Brightside’ (2004) at No. 7 with 776,416 streams in a day, Goo Goo Dolls’ ‘Iris’ (1998) at No. 24, Fleetwood Mac’s ‘Dreams’ (1977) at No. 25, and Michael Jackson’s ‘Billie Jean’ (1982) at No. 28 — several of them outperforming this year’s new releases. Roughly one in three Spotify streams now goes to a song at least ten years old, and the share of US listeners aged 13 to 24 who listen mostly to 2020s music has fallen from 55% in 2021 to 44%. The temptation is to explain this with nostalgia, and the temptation should be resisted, because there is a supply-side explanation that requires no claim about taste at all. Start by asking students what used to force turnover. Radio had finite airtime, record stores had finite shelf space, and a chart position was rationed by physical scarcity — putting a new record in the bin meant taking an old one out. Have them name the cost that enforced that: the marginal cost of stocking one more title was positive, so unprofitable inventory was retired. Now set that cost to zero, which is what a streaming server does, and ask what the retirement mechanism becomes. There isn’t one. A 2004 song competes for algorithmic placement on exactly equal footing with a 2026 release, forever, at no cost to anyone. This is a clean case of a market in which a technological change removed an exit condition rather than changing anyone’s preferences, and it is worth making them state that distinction explicitly, because the observed data are consistent with both stories and only one of them requires assuming a generation changed its mind. Then push on what recorded music actually is: a durable good that does not depreciate, produced once at high fixed cost and reproduced at essentially zero marginal cost. Ask what the presence of a non-depreciating durable good in unlimited supply does to the residual demand facing a new entrant — this is the used-goods problem from a durable-monopoly lecture, except the used copies never wear out and never leave the market. Then ask the question that makes it a real economics problem rather than a cultural observation: what happens to the return on producing new music? The pessimistic answer is that the back catalog is a permanent competitive fringe and expected returns to new work fall. The complication worth raising is that catalog rights are owned, heavily, by the same firms financing new releases, so the cannibalization is substantially internalized — which is a decent argument for why the catalog boom has coincided with rising rather than falling investment in new artists. Close with the falsifiable version, since this is the habit worth teaching: if the mechanism is zero-cost shelf space rather than generational taste, the same pattern should appear in every medium where distribution went from finite to infinite. Have them check it — a series cancelled in 2012 sitting in Prime Video’s top ten, and an unaired 2018 sketch as this month’s meme format, are the same observation in two other markets.",
    src: ["kworb / Spotify US daily","https://kworb.net/spotify/country/us_daily.html"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
