<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "THE STREAK IS BROKEN AND THERE IS A DATE. For fifteen consecutive windows this brief has reported a Witkoff and Kushner visit to Kyiv with no published date attached. Zelensky supplied one on the record on Thursday: “Steve Witkoff and Jared Kushner will visit Moscow and will visit Kyiv on Sunday” — Moscow TODAY, Kyiv TOMORROW. TASS, citing Axios, gives the identical itinerary: the envoys “travel on Friday, hold talks with Russian President Vladimir Putin at the Kremlin on Saturday and then meet with Ukraine's Vladimir Zelensky in Kiev on Sunday.” AND ZELENSKY HAS DECLARED A UNILATERAL AIR PAUSE TO GET THEM THERE: “There will be no air strikes from our side,” Ukraine undertaking to “ensure the normal functioning of Russian airspace so that the negotiators can arrive safely,” with a request that Russia reciprocate during the Kyiv leg. ⭐ THAT IS NOT A PROMISE, IT IS AN OBSERVABLE, AND IT ALREADY SHOWS UP IN THE DATA: Russia's Defence Ministry reported just 53 Ukrainian fixed-wing drones overnight, against 490 in the equivalent window the night before. Moscow has offered nothing in return. Peskov, asked directly whether Russia would ask Kyiv to pause its attacks before the envoys arrive: “No, we won't” — adding, “Presumably, the Americans will demand that the Ukrainians cease their terrorist activities,” and on the visit itself, “I wouldn't announce anything, but once these contacts take place, we will inform you.” Trump: “They've done a great job, and we sent them over to see whether or not we can get something done. And there may be a good chance that we'll do it.” ⚠️ CARRY THE DOUBT ALONGSIDE THE DATE, BECAUSE TWO INDEPENDENT SOURCES RAISE IT. The Kyiv Independent reports the Kyiv leg “thrown into doubt after Witkoff 'gets scared',” quoting a person familiar: “The Russians don't want them to come here to Kyiv, and Witkoff is always sensitive to Russian sentiment. They're being told there that it's dangerous.” ISW, arriving at it independently, judges that “The Kremlin's behavior indicates Russia's unwillingness to guarantee the safety of the US delegation during their reported upcoming visit to Ukraine.” ⚠️ And a reported Ukrainian “silence regime” running midnight Sept 5 to Sept 8 rests on Ukrainian media citing unnamed sources with only an MP, Oleksii Honcharenko, on the record — no official confirmation and no official denial. Unconfirmed, and published as such.",

      { t: "The pause did not begin before Thursday, and Thursday was violent in both directions — including a drone sent at the head of Ukraine's security service, and two more Russian refineries taken out of service. Start with the strike that will be remembered: a Geran-type drone hit the SBU's main building on Volodymyrska Street in central Kyiv at about half past three in the afternoon, aimed, ISW assesses, at the office of SBU head OLEKSANDR POKLAD, who was not in it; at least seven people were injured. Zelensky ordered a reply that “mirrors” the strike — “adequate, tangible, and, if possible, symmetrical” — adding, “Our military will support this response.” ISW's related judgement matters more than the incident: “The Russian Geran drone platform adaptations are improving their ability to conduct successful high-precision strikes.” Overnight, Russia launched 167 strike drones from six sites plus Iskander-M ballistic missiles from Rostov and Voronezh; 128 were downed, with hits at 23 locations. ⚠️ NOTE TWO THINGS ABOUT THAT TALLY. It is PARTIAL BY CONSTRUCTION — the Air Force says “the attack is ongoing, with enemy drones still present in Ukrainian airspace,” and gives it “according to preliminary data.” And NO EXACT BALLISTIC FIGURE WAS PUBLISHED, which under this desk's own retired claim is a genuine non-publication rather than evidence that none was fired — the opposite inference from the one made here a month ago. Casualties over the past day, per the Kyiv Independent: seven killed and 51 injured, with five dead and six hurt in Dnipropetrovsk, two dead and 27 hurt in Kherson, and injuries in Donetsk, Zaporizhzhia, Mykolaiv and the Kyiv region. ⭐⭐ AND THE ATTRIBUTION CONFLICT FLAGGED HERE YESTERDAY IS RESOLVED AGAINST THIS DESK. Serhii Lysak has headed the ODESA CITY military administration since 15 October 2025, having moved there from Dnipropetrovsk; he is not paired with Oleh Kiper, who heads the Odesa OBLAST administration — two separate bodies. And Oleksandr Hanzha genuinely is the Dnipropetrovsk governor, the chain running Lysak to Haivanenko to Hanzha. Ukrinform was right and the desk's own pairing was the error. ⚠️ A second correction in the same direction: SOCHI WAS ONE DEPOT, NOT TWO — Meduza names a single facility, does not confirm ownership, and attributes the Rosneft claim only to the Telegram channel Astra. GOING THE OTHER WAY, Ukraine's General Staff says TWO MORE REFINERIES HAVE CEASED OPERATIONS: Lukoil's NORSI at Kstovo in Nizhny Novgorod region, about 800 kilometres out, and Novatek's Ust-Luga plant in Leningrad region, about 850 — damage described as hitting “sophisticated condensate processing and hydrocracking equipment, as well as pipelines and other oil infrastructure,” which is a DAMAGE ASSESSMENT rather than an explicit claim of responsibility. ⭐⭐ AND PUTIN CONCEDED, IN HIS OWN WORDS, THAT MOSCOW GOT THE WHOLE PROBLEM WRONG: Russia assumed refineries “are purely civilian facilities, and they cannot be the targets of any attacks whatsoever, even in conditions of armed conflict. But in this sense we were wrong.” He added that Russia “must be ready for anything” and that “I think we will restore the remaining 10% in the very near future.” The scale behind that: more than SEVENTY Ukrainian drone strikes on refineries this year; production down to about SEVENTY PER CENT of domestic consumption by late August; a daily deficit near 30,000 tonnes; fuel-sale restrictions in at least seventeen regions; and Kinef in Leningrad region, the second-largest plant by capacity, fully halted on September 2. ⚠️ Finally, POWER OF BAIKAL SLIPPED BACKWARDS RATHER THAN FORWARD. This brief published on Thursday that it was “in the final stages of preparations for the construction phase.” Novak, a day earlier, said the ROUTE ITSELF IS NOT DETERMINED — it “will be decided as final agreements on the contract are reached, including the route as well.” A contract being drafted is not a contract; a route still undecided is not a pipeline.",

      { t: "Iran had no third night, and two of this desk's own standing lines about the war are settled today — one retired for good, one overturned. THERE WAS NO THIRD IRANIAN WAVE AND NO NEW AMERICAN ROUND. GlobalSecurity's Day 189 log frames it as “two consecutive nights,” September 1–2 and September 3, with “no third night reported,” and the principals say the same in public: Trump, on Thursday, “We're not fighting right now. There's no fighting,” and separately “It's not a big thing”; Vance, “I wouldn't call it a war. Right now, there is no active shooting.” The live vector is shipping, and the American position is that talks are off until the ship attacks stop. Trump also says the US may strike Iran's PICKAXE MOUNTAIN “very soon” — threatened, not executed. ⚠️ ONE FIGURE NOT TO MISREAD: the “18” US military deaths circulating today is a CUMULATIVE total since February 28, restated by the President on September 3. It is not evidence of losses in the September 3 wave, and a US official says those attacks “didn't impact any military facilities in the Middle East where U.S. forces are based.” ⭐⭐ THE OMAN-CORRIDOR LINE IS NOW POSITIVELY DEAD, WHICH IS BETTER THAN YESTERDAY'S RETRACTION. This brief published “zero transits, day N” for nine days, then corrected it on Thursday to “unavailable.” Today it is established WHY: straits.live's own data documentation states that its transit series aggregates to a single chokepoint figure WITH NO GEOGRAPHIC SUBDIVISION, and that its API offers only vessel-type and capacity breakdowns. The underlying source, IMF PortWatch, does not publish the breakout at all. The number was never obtainable from any instrument this desk uses. ⚠️ AND THE SAME SOURCE IS STRUCTURALLY STALE IN A WAY WORTH KNOWING: its transit figure reads “6 commercial vessels transited the Strait of Hormuz on AUG 30,” marked verified six days ago, because PortWatch publishes weekly on Tuesdays with a two-day lag — while its live insurance dashboard IS current,     { h: "Economy & markets", items: [
      { t: "THE AUGUST EMPLOYMENT REPORT BLEW OUT, AND THE MORE IMPORTANT NUMBER IS THE ONE THAT CHANGED THE PAST. Payrolls rose 162,000 in August against a consensus near 55,000 — a beat of roughly three to one — with private payrolls up 127,000, unemployment unchanged at 4.1 per cent, average hourly earnings up 0.3 per cent on the month to $37.75 and 3.1 per cent on the year, participation UP two-tenths to 61.6 per cent, and the average workweek up a tenth to 34.4 hours. The Bureau's own summary: “Total nonfarm payroll employment increased by 162,000 in August, and the unemployment rate was unchanged at 4.1 percent. Employment increased in food services and drinking places and in local government education. The information industry lost jobs.” ⭐⭐ NOW THE REVISIONS, WHICH MATTER MORE THAN THE HEADLINE AND WHICH THIS DESK HAS BEEN BUILDING A NARRATIVE ON FOR A WEEK: June went from +20,000 to +31,000, and JULY WENT FROM MINUS 23,000 TO PLUS 21,000 — a combined upward revision of 55,000, and a 44,000 swing in July alone. The “second consecutive month of outright job losses” that everyone was positioned for, and that this brief reported as the live possibility only yesterday, DID NOT HAPPEN AND, ON THE REVISED DATA, NEVER HAD. ⭐⭐ THE FED TRADE FLIPPED BACK WITHIN TWENTY-FOUR HOURS. The Fed Rate Monitor, stamped September 5 at 12:35 a.m. EDT, puts a HIKE to 3.75–4.00 back in front at 58.4 per cent against 41.6 for a hold. The full series with its timestamps: 64.4 per cent for a hike on September 1 at 7:25 a.m., 60.4 on September 3 at 4:55 a.m., 48.4 on September 4 at 2:15 a.m. — the single day on which a hold led — and 58.4 now. A ten-point round trip in seventy-two hours, driven by Waller on Wednesday and by the payroll revisions on Friday. Further out: October 28 hold odds fell 7.2 points to 30.1; at least one hike by December is now 85.6 per cent against 82.1; two or more by March 2027 is 67.6 against 63.6. ⚠️ ONE HONEST QUALIFICATION: the monitor returned target ranges without hike-or-hold labels, so the mapping onto a 3.50–3.75 base is INFERRED rather than printed — though it is consistent across all four meetings, which is what makes it credible rather than merely convenient. The next FOMC is September 15–16.",

      { t: "WALLER'S PRIMARY TEXT IS OBTAINED, AND IT CORRECTS THE THING THIS DESK PUBLISHED YESTERDAY. On Thursday this brief carried three outlet PARAPHRASES of the speech that drove the entire session, said plainly that no verbatim text could be reached, and warned that the quoted fragments belonged to the outlets rather than to him. The text is on federalreserve.gov: “The Economic Outlook and Some Comments on My Policy Communication,” delivered at a Reuters NEXT newsmaker interview in Washington on September 3. What he actually said is both more precise and more conditional than the paraphrases suggested. On the labour market: “Job creation, though a bit volatile, has increased this year by an average of 60,000 a month through July” — a line that Friday's revisions have already nudged upward. On inflation: “Three-month inflation has fallen steadily from 4.76 percent in February. That is a considerable improvement.” And the policy conditional, in full and in his own construction: “If there is continued progress toward our 2 percent goal, then I am willing to support holding the policy rate,” against “If inflation comes in hot, I would consider a rate hike,” with the crucial calibration that “I judge that policy is currently only slightly restricting aggregate demand, and it may not take much acceleration in inflation to nudge me into supporting tighter policy.” ⭐ READ THAT LAST SENTENCE AGAINST THURSDAY'S MARKET REACTION AND SOMETHING ODD APPEARS: the session read him as dovish enough to make a hold the favourite for the first time, when the text itself sets a LOW BAR FOR TIGHTENING. Thursday's four missing releases are also all recovered, and one of them contradicts a number published here on Thursday. Second-quarter productivity came in at 1.4 per cent and unit labour costs were revised DOWN to 1.2 from 1.3 per cent; Challenger job cuts were 52,881 in August against 33,429 in July, still down 38.5 per cent on the year and “the lowest August month since 2022.” ⚠️ AND THE CONTRADICTION: S&P Global's Services PMI came in at 56.5, describing “rising employment at the fastest pace in 18 months,” against ISM Services employment at 47.8 — still in contraction. Two services surveys, the same month, opposite signs on labour. Both published; neither reconciled.",

      { t: "The market took the strong report badly, the leadership flipped for a FIFTH consecutive session, and this desk owes itself a correction on Thursday's Nasdaq. Friday's closes, each checked arithmetically: the S&P 500 at 7,718.36, down 29.35 or 0.38 per cent; the Dow at 53,414.25, down 271.86 or 0.51; the Nasdaq COMPOSITE at 26,506.99, down 77.07 or 0.29; and the Russell 2000 at 2,974.85, UP 6.92 or 0.23 — THE ONLY INDEX TO CLOSE HIGHER. The ten-year rose to 4.789 per cent, reversing two sessions of decline, and the VIX closed at 14.53, up 0.21 and reconciling exactly against Thursday's 14.32. ⭐ FIVE SESSIONS, FIVE DIFFERENT COMPOSITIONS, AND FRIDAY INVERTS THURSDAY EXACTLY. Wednesday small caps led; Thursday the Composite nearly tripled the Russell's gain in a clean duration trade; Friday the duration trade unwinds on the yield back-up and the small caps are the only thing standing. If you have been reading the index level and not the composition, you have missed the entire week. ⚠️⚠️ AND THE CORRECTION, WHICH IS THIS DESK'S OWN: investing.com's Composite history gives THURSDAY at 26,584.06 and plus 1.40 per cent, where this brief published 26,612.37 and plus 1.50. Friday's close reconciles exactly against 26,584.06 and not against the carried figure, so both the level and the percentage published here on Thursday were wrong. The error is recorded rather than quietly overwritten. ⭐ THE RUBLE STRENGTHENED A SECOND TIME AND THREE TIMES HARDER: the Bank of Russia fixing effective September 5 is ₽86.5857 to the dollar and ₽100.5693 to the euro, stronger by 0.3015 against Thursday's ₽86.8872, where Thursday's own move was 0.1091. The series now reads ₽85.6007 for August 29–31, then 86.3793, 86.7530, 86.9963, 86.8872 and 86.5857 — one three-session slide, then two days of recovery that have taken back roughly forty per cent of it. Key rate 14.00 per cent; the board meets SEPTEMBER 11. On commodities the panel-versus-narrative split fired on all three instruments AND on a fourth: the live panel gives WTI $91.48 up 0.20 per cent, Brent $96.28 up 0.80, and gold $4,432.56 down 0.92, while the narrative text on the same pages says crude “fell to 91.22… down 0.09%,” Brent “rose to 95.83… up 0.32%,” and gold “fell 2% to around $4,380 an ounce on Friday as the dollar strengthened following stronger-than-expected US employment data.” WTI IS A DIRECTION CONFLICT AGAIN. The ten-year adds a fourth split, the panel giving 1.6 basis points against a narrative “nearly 3.” Per the standing rule, both readings are published and none is reconciled.",
        s: [["investing.com (the economic calendar and index history — and the source of the Thursday Composite correction)","https://www.investing.com/economic-calendar/"],["Bank of Russia (the fixing effective September 5: ₽86.5857, a second consecutive strengthening)","https://www.cbr.ru/eng/currency_base/daily/"],["TradingEconomics (crude: the live panel and the narrative text, published together)","https://tradingeconomics.com/commodity/crude-oil"]] },
    ]},
    { h: "Health & policy", items: [
      { t: "THREE FEDERAL DATA SERIES READ “FLAT” OR “STALLED” THIS WEEK AND ALL THREE WERE THE MEASURING APPARATUS RATHER THAN THE WORLD. Take them in order, because together they are the most useful thing on this beat today. ⭐ FIRST, THE VACCINE RFI JUMPED. The comment count on docket HHS–OS–2026–0332 now reads 3,896 against 2,316 on each of the two previous checks — plus 1,580 over two days, or about 790 a day against a prior run rate of 488. THURSDAY'S “FLAT AT 2,316” WAS A STALE CACHE, exactly as the caveat published here warned it might be, and the correct reading is that the filing rate did not revert — it roughly doubled. ⚠️ Quote the stamp and say what it attaches to: “Page views 11,384 as of 09/04/2026 at 10:15 pm EDT,” which attaches to PAGE VIEWS; the comment line carries no independent timestamp of its own. It closes September 20. ⭐ SECOND, THE DESYNC REVERSED ROLES. Fetched in the same minute, the H-1B document page is stamped September 4 at 4:15 a.m. while the vaccine page is stamped September 4 at 10:15 p.m. — an EIGHTEEN-HOUR SPREAD, with yesterday's laggard now the fresher of the two. So the H-1B count, flat at 6,064 against a roughly 316-a-day run rate, sits on the demonstrably staler page, and “H-1B comments have stopped” is NOT a publishable finding. ⭐⭐ THIRD, AND THE CLEANEST OF THE THREE: THE CDC MEASLES PAGE RESUMED ITS CYCLE ONE DAY LATE AND THE NUMBER MOVED HARD. It reads 3,134 confirmed cases as of SEPTEMBER 3, against 2,903 as of August 27 — UP 231 IN A WEEK — with the footer reading “Reviewed: September 4, 2026.” Outbreaks went 37 to 38, and outbreak-associated cases from 94 to 95 per cent of the total. This desk checked that page four times and read 2,903 every time. A daily scraper would have logged FOUR CONSECUTIVE ZERO-GROWTH DAYS AND THEN A SPIKE OF 231, and the generating process would have been CDC's publication schedule rather than measles transmission. ⚠️ Its state table, age and vaccination breakdowns and hospitalisation rate failed to render for an ELEVENTH consecutive run, so Utah 518 and the seven per cent hospitalisation rate remain unrestatable. And two former CDC officials — Debra Houry and Demetre Daskalakis — now supply a named-source mechanism for the dashboard's behaviour, writing that after Pennsylvania reported two measles deaths using “the same established process as Texas did in 2025,” “CDC political leadership questioned the state's determinations in a politicized social media post and delayed adding the deaths to the national dashboard.” Their question: “Is CDC now applying different standards to state data depending on who governs the state or what political party won an election?” That is an opinion piece by former officials, not an audit, and is published as one.",
        s: [["Federal Register (the vaccine RFI: 3,896 comments, and the page-views stamp)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["CDC (measles surveillance: 3,134 as of September 3, reviewed September 4)","https://www.cdc.gov/measles/data-research/"],["STAT (Houry and Daskalakis: “Make infectious disease data boring again”)","https://www.statnews.com/2026/09/04/pennsylvania-measles-deaths-data-cdc-director-rfk-jr/"]] },
      { t: "Ebola's arithmetic now reconciles, KFF's silence turns out to be a holiday, and a clause this desk refused to attribute for three runs finally has its owner. ECDC updated on September 4 at 14:25 with data to September 2: 6,342 confirmed cases, 3,072 deaths, a case fatality rate near 48.4 per cent, 1,475 recovered and “770 patients are hospitalised in isolation.” ⭐ AND THE INTERNAL CONTRADICTION THIS DESK PUBLISHED LAST WEEK HAS GONE: the page states 92 new confirmed cases and 33 new deaths, and its own cumulative totals moved by EXACTLY 92 and 33. Last week's stated 64 and 32 against cumulative moves of 150 and 89 now looks like a one-week reporting error, since corrected — which is a better outcome than the desk's assumption that the two windows were simply incommensurable. Health zones are unchanged at “60 of 151… across the six provinces”; contacts under follow-up have slipped from 89 to 86.5 per cent. ⚠️ The Tedros-versus-ECDC divergence on Ituri PERSISTS and widened slightly on deaths — 85 and 88 per cent against 81.4 and 76.1 — different denominators, unreconciled, both published. Three separate negatives, each checked rather than assumed: there is NO DON617, DON616 remaining the newest Disease Outbreak News; there is NO new Director-General briefing, the September 2 one still being the newest item on WHO's Ebola page; and AFRO's Report 16 could not be found by search, with Reports 12 through 15 all surfacing and confirming the non-sequential slugs. ⚠️ Both AFRO pages attempted failed at the server, so those figures are UNREADABLE TODAY, which is not the same as absent. ⭐⭐ KFF'S SILENCE IS EXPLAINED, AND THIS DESK CAN STOP DIAGNOSING AN INDEX LAG. KFF Health News carries a verbatim notice on its own homepage: “KFF Health News is on hiatus the week of Aug. 31 and also for Labor Day. The Morning Briefing will not be published during that time. Look for it in your inbox on Tuesday, Sept. 8.” A planned shutdown, which retires the question for the next two runs. ⭐⭐ AND THE FOSTER ATTRIBUTION IS RESOLVED AFTER THREE FAILED ATTEMPTS, WITH THE DESK'S CAUTION VINDICATED. The “shared upon request” language belongs to CMS DOCUMENTATION cited by KFF, which says individual state Rural Health Transformation reports are “intended to be” shared on request and that the agency will not proactively publish them. CMS spokesman Timothy Foster's actual quote is narrower and different: CMS “will publish an annual report on state progress.” Never attribute the clause to him. Six days past the August 31 deadline, no state has published and no CMS statement has appeared — ⚠️ though the CMS half is UNVERIFIED rather than established, because medicaid.gov's rural-health page would not render. New from the same reporting, a transparency ranking worth keeping: detailed publication in Alaska, Kansas, Oklahoma, Nevada and New Hampshire; press releases only in Florida, Nebraska, Ohio, Virginia and New Jersey; minimal or nothing in Mississippi, South Dakota and West Virginia. Mississippi state senator Hob Bryan: “I just don't believe in all this secrecy.” ⚠️ Elsewhere the beat is genuinely quiet rather than merely unrendered: Healthcare Dive's topic pages both render current content and NEITHER carries anything for September 3, 4 or 5, and STAT's *Unraveled* part three is absent on day twelve.",
        s: [["ECDC (the Ebola outbreak page, updated September 4: 6,342 cases, 3,072 deaths, and increments that finally reconcile)","https://www.ecdc.europa.eu/en/ebola-virus-disease-outbreak-democratic-republic-congo"],["KFF Health News (the Rural Health Transformation reporting — and the CMS documentation behind the “on request” clause)","https://kffhealthnews.org/rural-health/rural-health-transformation-program-transparency-50-billion-dollars-state-tracking/"],["WHO Disease Outbreak News 616 (still the newest DON: 5,794 cases, 2,786 deaths, data to August 26)","https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON616"]] },
    ]},
    { h: "Campus & culture", items: [
      { t: "Michigan's November ballot is now official, the canvassers meeting this desk could not adjudicate did not happen, and the Ann Arbor story reversed on us — in the opposite direction from last time. TWO STATEWIDE QUESTIONS WERE CERTIFIED: Proposal 1, whether to convene a new state constitutional convention, and Proposal 2, whether to limit political donations from utilities and large government contractors. The proof-of-citizenship amendment is not among them, which closes a story that ran here for two weeks and ended with a measure three signatures short in a thousand-signature sample drawn from seven hundred thousand. ⭐ THE CANVASSERS CONFLICT IS SETTLED AND THE MEETING WAS CANCELLED. Michigan News Source, writing after the fact, records that the board “had been scheduled to meet Friday, Sept. 4… The meeting was subsequently cancelled”; no September 4 minutes exist, and the board's next listed meeting is October 23. The motive is now plain — the only substantive agenda item was the hundred-word ballot summary “in the event it is placed on the ballot,” a contingency the Wednesday rulings extinguished. ⚠️ AND HERE IS WHY MICHIGAN PUBLIC LOOKED AUTHORITATIVE AND WASN'T: its 10:39 p.m. sentence that the board “is meeting at 10 a.m. Friday” was FORWARD-LOOKING, was overtaken by a same-day cancellation, and remains uncorrected. Two further artifacts that are not evidence of a meeting: the Secretary of State's landing page still lists September 4 with a live agenda link and no cancellation mark, and the agenda PDF carries no cancellation stamp either. ⚠️ The SCOTUS docket question is UNTESTED this run — could not afford, which is not the same as checked and absent. ⭐⭐ AND THE REVERSAL: THE ANN ARBOR PUBLIC POWER APPEAL WAS FILED AND HAS ALREADY BEEN DECIDED. This brief has said for ten days that no appeal had been filed. In fact the DTE-backed group appealed and LOST — the Michigan Court of Appeals, judges Brock Swartzle and Anica Letica, ruled on Wednesday that state law “does not expressly direct a clerk to reject [a petition] for filing and canvassing any supplemental signatures,” and the public power proposal STAYS ON THE NOVEMBER BALLOT. ⭐ THE METHODOLOGICAL LESSON IS BIGGER THAN THE STORY: annarborpublicpower.org, which this desk was using as its tracker, sat silent through both the filing and the loss of a live appeal. Its silence carries no evidential weight and it should be retired as a tracker. Having been wrong in August by treating an intent as a filing, the desk has now been wrong in September by treating an absence as a non-filing. ⚠️ A naming discrepancy that is not resolved: ClickOnDetroit styles the group A2REC where this desk has carried AAREC. Elsewhere: Raver's contract terms have landed at $2M a year, though ⚠️ HEADLINE-LEVEL ONLY, since both reporting domains are robots-blocked; the Ypsilanti town hall is double-confirmed for Wednesday at the Marriott at Eagle Crest, where U-M's Chris Kolb concedes “residents who have serious questions and concerns”; and note the framing gap in one line — U-M calls it a “high-performance research computing center” and the township resolution calls it a “nuclear research facility.”",
        s: [["Michigan Public (the November 2026 ballot is official, and includes two questions for all voters)","https://www.michiganpublic.org/politics-government/2026-09-04/michigans-november-2026-ballot-is-official-includes-two-questions-for-all-voters"],["ClickOnDetroit (the DTE-backed group loses its appeal; public power stays on the ballot)","https://www.clickondetroit.com/news/local/2026/09/04/dte-backed-group-loses-appeal-to-exclude-public-power-proposal-from-ann-arbor-ballot/"],["Michigan Secretary of State (the September 3 cancellation notice)","https://www.michigan.gov/sos/resources/news/2026/09/03/sept-4-meeting-of-board-of-state-canvassers-canceled"],["University of Michigan Record (the Sept 9 town hall, and Chris Kolb on residents' concerns)","https://record.umich.edu/articles/u-m-to-host-town-hall/"]] },
      { t: "Judge Saylor has not ruled, but he floated the remedy — and the CPT count this desk finally wrote down two days ago is already wrong by three. NO RULING IN NAFSA v. DHS, confirmed three ways rather than assumed. The Boston Globe is decisive: Saylor “did not make a ruling, and he said he would take his time in doing so.” NAFSA's own case page is stamped “Last updated: September 4, 2026,” logs the hearing and records no order — plaintiffs' counsel updating a day later without an order is strong evidence none exists — and the Presidents' Alliance tracker has not been touched since August 21. ⭐ THE ADVANCE IS THE REMEDY HE NAMED: Saylor said he would “consider issuing a TEMPORARY RESTRAINING ORDER” to buy time before the rule takes effect on SEPTEMBER 15, ten days out. So the likely near-term posture is a TRO rather than a full preliminary-injunction ruling, which is a materially different thing to watch for. A bench quote not previously on file, and the sharpest of them: “Maybe I am stating the obvious but I'll state it: A foreign student who wants to take a photo of a military base could do it in four years.” ⚠️ A correction to this desk's own record: the government's advocate AT THE HEARING was Michael Celone, senior counsel at the Justice Department — Brett Shumate signed the 57-page written response. Two different roles; both facts stand. And both advocacy groups DID post hearing readouts on September 3, answering a question left open here — ⚠️ though NEITHER READOUT CONTAINS A SINGLE JUDGE QUOTE. Everything quotable from that courtroom exists only in press coverage. ⭐⭐ THE CPT COUNT IS TWELVE, NOT NINE, AND HARVARD IS THE FRESHEST. Harvard halted CPT at the College, Law, Medical, Design and the Graduate School of Arts and Sciences on SEPTEMBER 3, while retaining degree-required-only authorisation at Business, the Kennedy School, Education, Divinity and Public Health; spokesperson Jason A. Newton: “CPT eligibility and program requirements vary among Schools.” Boston University acted on August 28 and Barnard in early August. The two URLs this desk has been carrying on secondhand attribution are found — Penn at the Daily Pennsylvanian, Northwestern at the Daily Northwestern — and CU Boulder's URL is CORRECTED, needing a trailing “-faqs” that has been dropped here since August. George Washington has still not moved, staying in the reviewing bucket with UC San Diego and Santa Clara. ⚠️ The Crimson names Michigan and USC as having acted and NO DATED SOURCE for either could be found, so neither is promoted. ⭐ THE BROADCASTS NOW HAVE OFFICIAL TITLES, obtained from Boston University rather than from ice.gov, which remains 403: the August 12 message is “Reminder of Liability for DSOs Regarding CPT Authorization” and the August 24 one “Guidance for Designated School Officials regarding Curricular Practical Training.” The full text of neither has surfaced, and the August 12 disclaimer stands — it “is not itself a rule or a final action by SEVP.” TWELVE universities have now restricted student work authorisation on the strength of a document that disclaims being a rule. ⚠️⚠️ AND ONE LINE OF THIS DESK'S OWN MUST BE RETIRED: the brief has repeatedly called Inside Higher Ed's silence on the crackdown “a real absence at the sector's paper of record.” IHE published on AUGUST 31. The nuance survives in weakened form — it is a short quick-take naming only Berkeley, not a feature — but the claim as written was wrong.",
        s: [["The Boston Globe (Saylor takes it under advisement, and floats a temporary restraining order)","https://www.bostonglobe.com/2026/09/03/metro/international-visa-trump-policy-ruling/"],["The Harvard Crimson (CPT authorisations halted across five Harvard schools, September 3)","https://www.thecrimson.com/article/2026/9/3/cpt-authorizations-halted/"],["Boston University ISSO (additional SEVP guidance — and the official titles of both broadcasts)","https://www.bu.edu/isso/2026/08/28/additional-sevp-guidance-further-restricts-cpt-eligibility/"],["Inside Higher Ed (DHS limits internships for international students — the August 31 item this desk said did not exist)","https://www.insidehighered.com/news/quick-takes/2026/08/31/dhs-limits-internships-international-students"]] },
      { t: "Mind and cosmos: two hardware experiments, neither of which publishes an error bar on the claim in its own headline — and a quantum listing that has now lost more than half its value in six sessions. TAKE THE MARKET ITEM FIRST BECAUSE IT IS THE STORY. Pasqal closed Friday at $7.96, down 18.36 per cent on volume of 3,144,819 — roughly double Thursday's — with an intraday low of $7.42 that is also its 52-week low. The run from the debut now reads $19.11 on August 29, then 17.30, 15.56, 12.19, 9.75 and 7.96: A SIXTH CONSECUTIVE DOWN DAY AND MINUS 58.3 PER CENT IN SIX SESSIONS, with a second straight close below the $9.79 the SPAC came public at. Three consecutive sessions of roughly twenty per cent declines on RISING volume with still no company news strengthens the flows-or-lockup reading rather than weakening it. ⭐ AND THE NUMBER THIS DESK REFUSED TO PUBLISH ON THURSDAY CAN NOW BE PUBLISHED: the share count resolves by cross-day consistency at about 212.29 MILLION, so the roughly 28.75-million figure implying a $350m capitalisation was the erroneous one — almost certainly a public-float count taken before the post-SPAC register updated. At $7.96 that is a market capitalisation near $1.69bn. ⚠️ Single source; worth one confirmation before it is treated as settled. On the science, both experiments come from the SAME INSTITUTION, USTC Hefei, and both were published on September 4 in Physical Review Letters volume 137 — the current volume, checked. The first, from Shuo Ren, Tao Tu, Jin-Shi Xu, Chuan-Feng Li and colleagues, stores entanglement AT ROOM TEMPERATURE in a silicon-carbide quantum node: a single PL6 colour centre in 4H-SiC forms a three-qubit register of one electron spin and two silicon-29 nuclear spins, with a nuclear-spin Bell state at 94 ± 2 per cent fidelity, a three-qubit GHZ-type state at 89 ± 4, transfer via swap gate at 92.5 ± 2.5, and entanglement lifetime extended 240-fold. ⚠️ THE AUTHORS STATE NO LIMITATIONS AT ALL, so the caveats have to be structural: the 240× is a RATIO with no absolute storage time attached, and “more than 10 per cent” of 200 surveyed centres carrying usable registers means about nine in ten do not. The second, from Peng Wang and colleagues with Origin Quantum as a commercial co-author, suppresses spectator leakage in superconducting two-qubit gates to “of the order of 10⁻⁴” with up to three simultaneous spectator qubits. ⚠️ THAT IS THE PAPER'S ONLY NUMBER, IT CARRIES NO ERROR BAR, AND NO GATE FIDELITY IS QUOTED — against a claim to have resolved the trade-off between dense frequency packing and high-fidelity operation. ⚠️ And the day's trap for headline-skimmers is a DESIGN paper: MIT's “arm qubit,” reported as though it were a result, is simulations only with no numerical results at all, its own lead author saying “we'll need to see if we can make it, and determine whether we missed anything in the modeling or design.” In psychedelics, one in-vitro study whose null result is the interesting half — psilocin increased synaptic connections in cultured rat brain cells within 24 hours while LSD, DMT and fluoxetine produced no measurable change, and the authors flag their own null as possibly technical. ⚠️ The unblinding thread was fed nothing, and the piece that looked most like feeding it turns out to be from March 2024.",
        s: [["Physical Review Letters (Ren et al., USTC: room-temperature storage of entanglement in a silicon carbide quantum node)","https://journals.aps.org/prl/abstract/10.1103/454t-n78h"],["Physical Review Letters (Wang et al., USTC and Origin Quantum: spectator leakage suppression in cz gates)","https://journals.aps.org/prl/abstract/10.1103/zywf-twfv"],["stockanalysis.com (Pasqal's sixth straight down day: $7.96, −18.36%, on a resolved share count)","https://stockanalysis.com/stocks/psql/"],["PsyPost (psilocin and rapid neural growth — and the null result for LSD, DMT and fluoxetine)","https://www.psypost.org/psilocin-triggers-rapid-neural-growth-in-laboratory-study/"]] },
      { t: "TONY GATLIF DIED AT SEVENTY-SEVEN, and the Lynch story this desk has carried alone for a fortnight finally broke — on the event's own website, still not in a single newspaper. Gatlif died on Thursday in Arles, of a health problem, WHILE WORKING ON A HISTORICAL FILM PROJECT, six days short of his seventy-eighth birthday. He was born Michel Dahmani in Algiers in 1948 to a Kabyle father and a Romani mother, came to France in 1960, and made twenty-five films built almost entirely on Romani life and music — Latcho Drom, Gadjo Dilo, which launched Romain Duris, Vengo, Transylvania, Djam — winning BEST DIRECTOR AT CANNES for Exils in 2004. ⭐ THE DETAIL WORTH A MINUTE IN ANY CLASSROOM: he was not born Gatlif. He took the name at twelve, during a police stop in Algiers, off a park sign. To AFP in 2021: “I fought a battle against my destiny, against myself, and that is no small thing.” ⚠️ Euronews attributes a tribute — “Tony Gatlif loved taking side roads, where borders fade away” — to “France's Culture Minister Catherine Pégard,” and Pégard is not the Culture Minister; either the name or the title is wrong at that outlet, so the quote is held. ⚠️ A ROUTING NOTE THAT MATTERS MORE THAN IT SOUNDS: npr.org's obituaries section, added to the rotation yesterday because it ALONE caught Gloria Steinem, carried nothing at all for September 4 or 5, while dead-people.com had Gatlif. Yesterday the pattern was exactly reversed. Keep both; neither is sufficient. 🔴 AND THE LYNCH WEEKENDER: gatheringoftheangels.com now carries the postponement in its own words — “A GATHERING OF THE ANGELS 2026 HAS BEEN POSTPONED TO 2027,” “OUR NEW DATES WILL BE ANNOUNCED SOON,” and, in a register the man himself might have enjoyed, “BIGGER AND MORE DAMN FINE THAN EVER NEXT YEAR.” Ticket holders were notified by email; no 2027 dates yet; and ON DAY FIFTEEN NOT ONE OUTLET HAS REPORTED IT, while welcometotwinpeaks.com is now BEHIND the event's own site, unchanged since August 24. ⭐ VON TRIER AND NOÉ WERE BOTH CHECKED, closing the gap left open here yesterday. Von Trier: nothing past August 9, but a new named producer and a real framing conflict — Louise Vesth, in November, saying the final film is “a project in continuous evolution” and that he “no longer works full days as he used to,” against Peter Aalbæk Jensen in August saying “there is nothing that can be shown at a festival” and “at least another two years.” Noé: a clean, explicitly labelled negative on a fifteenth verification — zero 2026 items. Refn has no cast, confirmed AT SOURCE this time rather than by absence of results, Cineuropa's own page reading “Cast and Creative Team: Not yet announced.” And Criterion's December slate is CONFIRMED NOT ANNOUNCED rather than merely unreached, the latest listed release being The Right Stuff on November 24. At Venice, McDonagh's Wild Horse Nine drew the longest ovation of the edition — ⚠️ reported at thirteen minutes, fourteen, and a precise fourteen minutes forty-four seconds, which is what the split is made of. In the art world Christie's has raised its buyer's premium to 28 per cent of hammer under $2m, 22 to $8m and 15 above, aligning with Sotheby's earlier increases, with Bonhams following next month; China's Gwangju withdrawal now numbers eighteen artists and three curators, with the edition independently confirmed as the SIXTEENTH against Hyperallergic's erroneous caption; and Ally van Tillo, founder of the UK AIDS Memorial Quilt, died on AUGUST 30 — ⚠️ with both details this desk carried wrong, the quilt holding 335 panels rather than 333 and the Tramway exhibition running September 12 to October 4 rather than to the 17th.",
        s: [["Euronews (Tony Gatlif, maker of Gadjo Dilo, dies aged 77)","https://www.euronews.com/culture/2026/09/04/film-director-tony-gatlif-maker-of-gadjo-dilo-dies-aged-77"],["A Gathering of the Angels (the event's own site: postponed to 2027, “bigger and more damn fine than ever”)","https://www.gatheringoftheangels.com/"],["Artnet (Christie's and Bonhams hike buyer's fees — the new tiered schedule)","https://news.artnet.com/market/industry-intel-sept-4-2806789"],["Art Plugged (Ally van Tillo, founder of the UK AIDS Memorial Quilt, dies)","https://artplugged.co.uk/ally-van-tillo-the-uk-aids-memorial-quilt-dies"]] }
    ]}

  hooks: [
    { story: "On August 7 the Bureau of Labor Statistics reported that the American economy LOST 23,000 jobs in July. That number was carried in every newspaper, priced into every rate expectation, and repeated in this brief as recently as yesterday morning, when it framed the question everyone was asking of Friday's release: would a SECOND consecutive month of job losses confirm that the Fed should hold? On Friday morning the answer arrived, and it was not an answer to that question. August payrolls came in at plus 162,000 against a consensus near 55,000 — but buried under the headline, the Bureau revised July from MINUS 23,000 TO PLUS 21,000, a swing of forty-four thousand, and June from plus 20,000 to plus 31,000. The month of job losses did not merely fail to repeat. On the revised data it never occurred. Nothing about the world changed between August 7 and September 4; what changed was how many employers had returned their survey forms. The initial estimate rests on the establishments that respond by the first collection date, roughly seventy per cent of the eventual sample, and late responders are not a random subset — a firm that hired in July has payroll records to reconcile before it can report. So the first print is not a noisy measurement of the truth; it is a measurement of a SYSTEMATICALLY DIFFERENT AND SMALLER POPULATION, corrected twice over the following two months, and then again in an annual benchmark revision which for March 2026 has already been estimated at minus 79,000. Markets moved on the revision as much as on the level: the odds of a September rate hike, which had fallen to 48.4 per cent, went back to 58.4 within a day.",
      src: ["Bureau of Labor Statistics — the August Employment Situation","https://www.bls.gov/news.release/empsit.nr0.htm"],
      concept: "Provisional data and non-random measurement error — why a first estimate is biased rather than merely noisy, and what that does to a decision that cannot wait",
      q: "Do not open with the revision. Open with the original number and let them commit to it. Put “July: −23,000 jobs” on the board and ask what it means and what should be done about it. Give it four or five minutes; let somebody say recession, let somebody say the Fed should cut, let the room reach a view. Then write the revised figure underneath: +21,000. Ask what new information arrived. The instinct will be that something in the economy changed, and the useful moment is watching that instinct fail — nothing about July changed, because July was over. Now make them build the mechanism themselves. Ask how the number is produced: a survey of establishments, with a fixed publication date and a response rate around seventy per cent at first print. Ask what kind of firm answers late. Push until somebody sees it — a business that has been hiring has more payroll to reconcile, and is therefore MORE likely to miss the first deadline. That is the whole thing: the missing observations are not missing at random, they are missing in a way CORRELATED WITH THE VARIABLE BEING MEASURED, which makes the early estimate biased downward in exactly the months when hiring is picking up. Then ask the question that makes it economics rather than statistics: if everyone knows the first print is systematically low in a recovery, why publish it at all? Wait through the silence, because the answer is a real trade-off and they can find it — a decision-maker who must act in September cannot use a number that will be accurate in November, and the cost of acting on a biased estimate has to be weighed against the cost of acting on none. Close by asking what a rational forecaster should do with a first print, and steer them to the answer professionals actually use: do not treat it as the truth, treat it as a draw from a distribution whose bias has a KNOWN SIGN. That is a more sophisticated idea than most of what they will read in the financial press this year, and Friday handed it to you with the numbers attached." },
    { story: "Clozapine is the only drug shown to work in treatment-resistant schizophrenia, and roughly one in three people with schizophrenia is treatment-resistant. About FOUR PER CENT receive it. For more than thirty years the standard explanation for that gap was the paperwork: clozapine carried a Risk Evaluation and Mitigation Strategy requiring prescribers to enrol in a federal registry, patients to submit blood counts — weekly at the start — and pharmacies to verify each result in a national database BEFORE they could dispense. It was, by common consent, among the most burdensome compliance regimes attached to any prescription drug in America. On FEBRUARY 24, 2025 the FDA eliminated it. That is as clean a natural experiment as health policy ever hands you: a dated, exogenous, near-total removal of an administrative cost, applied to one drug and not to its substitutes, with no accompanying change in price, efficacy or coverage. Write down what you expect the quantity response to be. Now here is the report from the field, from Nitin Gogtay, a psychiatrist and physician-scientist at the National Institute of Mental Health, writing this week: he could not find “a single child psychiatrist across four academic centers willing to start clozapine.” His conclusion is five words long — “The paperwork was never really the problem.” ⚠️ And the honest limitation, which is his too: this is clinical observation across four academic centres, not a measured series. Nobody in the piece has run the pre- and post-February-2025 prescribing data, and the four per cent figure is not identified as before or after. The natural experiment exists. It has not been exploited.",
      src: ["STAT — Nitin Gogtay on clozapine and the removal of its REMS","https://www.statnews.com/2026/09/04/clozapine-children-schizophrenia-neutrophil-fda-monitoring/"],
      concept: "Non-price constraints and the identification of a binding constraint — why removing a cost can produce no quantity response, and what that tells you about which cost was binding",
      q: "This one works best if you make them predict before they learn. Describe the regime in full and make it vivid — the registry, the weekly blood draws, the pharmacy that cannot legally hand over the bottle until a number clears a federal database — and then say the FDA abolished all of it on a specific Tuesday in February 2025. Ask them to write down, privately, whether prescribing goes up a lot, a little, or not at all. Have them hold up fingers. Almost nobody will say not at all, because everything in a principles course has trained them to expect that when you lower a cost, quantity rises. Then give them Gogtay's sentence. The productive discomfort lasts about thirty seconds, and then somebody says the obvious right thing: the paperwork was not the binding constraint. Draw it. Two constraints, one slack and one binding; relaxing the slack one moves nothing. Then ask what the binding one IS, and do not accept “doctors are lazy.” Make them name a cost that the REMS was not: the clinician's exposure if a patient develops severe neutropenia, which is personal, career-shaped, and entirely unaffected by whether the monitoring is federally mandated or merely medically advisable. Removing the mandate arguably made that WORSE, because a physician following a required protocol has a defence that a physician exercising judgement does not. Now the health-economics turn, and it is the one worth the class time: ask who bears each cost. The administrative cost fell on the prescriber and the pharmacy and was visible and measurable, which is precisely why it was the one regulators could act on. The liability cost falls on the prescriber, is invisible, is not denominated in dollars, and no agency has an instrument for it. Ask what that predicts about which constraints get relaxed in health care generally — and let them arrive at the uncomfortable answer that we reliably deregulate the things we can see. Finally, if you have quantitative students, hand them the research design: pre and post February 24, 2025, clozapine initiations, with other antipsychotics as a control group and the drug's own long-run trend as the counterfactual. Somebody in that room could actually run it." },
    { story: "Two firms handle the overwhelming majority of the world's high-value art auctions. Earlier in 2026 Sotheby's raised its buyer's premium — the fee a winning bidder pays ON TOP of the hammer price. This week Christie's raised its own to match, publishing a new schedule of 28 per cent of the hammer price up to $2m, 22 per cent from there to $8m, and 15 per cent above $8m. Bonhams, the next firm down, introduces a more complex tiered structure next month. Three houses, one direction, inside a year. Now notice the structure of the fee itself, because it is stranger than it looks and students will not spot it unless you point at it: the buyer's premium is charged to the bidder, while the seller separately pays a commission out of the hammer price. The house takes a cut from BOTH SIDES of the same transaction, and the two cuts are quoted on different bases and negotiated in different rooms — seller's commissions are heavily discounted for desirable consignments, buyer's premiums essentially never are. A bidder who wants to spend $2m all-in is really bidding about $1.56m, and knows it; the seller's reserve is set against the hammer price, not the all-in. The fee is therefore not a price to a consumer in any straightforward sense. It is a wedge, driven into the middle of a two-sided market by the firm that operates the market.",
      src: ["Artnet — Christie's and Bonhams hike buyer's fees, and more industry intel","https://news.artnet.com/market/industry-intel-sept-4-2806789"],
      concept: "Oligopoly and price leadership in a two-sided market — and the evidentiary problem of distinguishing tacit coordination from independent cost-following",
      q: "Give them the facts flat and in order: Sotheby's raised, Christie's matched, Bonhams follows next month, two firms hold most of the market. Then ask the question they are all itching to answer — is this collusion? — and make them EARN it rather than assert it. Push first on what the observation is actually consistent with, and get at least three stories on the board: tacit coordination with a price leader; independent responses to a common cost shock, since both houses face the same insurance, shipping, storage and marketing inflation; and simple competitive irrelevance, if bidders are inelastic enough that neither firm loses volume by raising the wedge. All three predict the same headline. That is the lesson, and it is a lesson about EVIDENCE rather than about auctions: parallel pricing is not proof of anything, which is exactly why antitrust law generally requires more than parallel pricing. Then ask what evidence WOULD distinguish them, and hold out for something testable — the timing and size of the follow (did Christie's match exactly, or land somewhere plausible on its own cost curve?), whether the increases appear at the same tier boundaries, whether input costs actually moved, and whether market shares stayed put. Now turn to the two-sidedness, which is where the good economics is. Ask who really pays a 28 per cent buyer's premium. The instinct is 'the buyer, obviously.' Make them think again: if bidders know the fee, they bid less at the hammer, and the seller absorbs part of it through a lower final price. THE INCIDENCE IS SPLIT, and how it splits depends on the relative elasticities of consignors and bidders — a tax-incidence result arriving in a room full of people who did not think they were doing tax incidence. Close with the strategic question: why raise the fee on the BUYER's side rather than the seller's? Let them work out that consignors are the scarce input, courted and discounted, while bidders arrive for the object and cannot take their bid to a rival house that does not have it. The premium rises on the side of the market with nowhere else to go — which is a sentence they can carry out of the room and apply to platforms, ticketing, and every marketplace they will ever use." },

  pulse: [
    { cat: "Listening", t: "Ella Langley now has two songs in the American top ten, and the one at number one is still GAINING — while a Killers song from 2004 climbs the same chart",
      why: "“Choosin' Texas” held number one on Spotify's US daily chart on September 3 with 1,480,493 streams, UP 5,926 on the day — which is not what a song in its twenty-first week at the top is supposed to do. Behind it, “Be Her” sits at number nine on 751,340 with a gain of 33,058, THE LARGEST INCREASE IN THE TOP TEN. Two songs, one artist, both moving up. ⚠️ Two corrections before you say any of this aloud: the record-breaking song is “Choosin' Texas,” not “You Look Like You Love Me,” which is a separate 2025 duet — and a Music Universe piece that ranks highly on this story is dated APRIL 21, 2026 and its “21 weeks” refers to Hot Country Songs, not the Hot 100 run everyone is counting. The Billboard verdict on a twenty-first consecutive Hot 100 week is due around September 7. Meanwhile at number ten, on 735,709 streams and UP 10,948: The Killers' “Mr. Brightside,” released in 2004, before most of your students were born.",
      rec: "The temptation is to treat this as two unrelated chart facts. It is one fact. Ask your students what a streaming chart actually measures, and let them discover that it measures nothing but PLAYS PER DAY — no purchase, no commitment, no scarcity, and no distinction whatever between a new release and a twenty-two-year-old song someone put on at a party. A record that would have been physically impossible in 1994, when a catalogue track could not be bought without going to a shop and buying the whole album again, is now trivially possible. If you want the sharper version, ask them why an artist would ever release a new song into a market where her old competition never depreciates. That is a real economics question and nobody in the music industry has a good answer to it.",
      src: ["kworb (Spotify US daily, September 3: Langley at 1 and 9, “Mr. Brightside” at 10)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Watching", t: "Spider-Man came within $237,889 of $900 million — and three outlets announced it had crossed before it did",
      why: "The dailies are now nailed to the dollar: Brand New Day stood at $898,125,379 at the September 2 close and $899,762,111 at the September 3 close, a daily take of $1,636,732 and a shortfall of $237,889. Watch the sequence of headlines against those numbers. Boxoffice Pro said on September 2 that the film was “right now crossing $900M domestic.” Showbiz411 headlined “Crossing $900 Million Today” on September 3. On September 4 the same outlet wrote “Came ThisClose… The total this morning is $899.762,111.” THE MILESTONE WAS REPORTED THREE TIMES BEFORE IT OCCURRED, by outlets that were each, in a forecasting sense, very nearly right — the film almost certainly crossed on Friday. Worldwide it stands at $2.34bn, with six consecutive number-one weekends, the longest run since Avatar: The Way of Water managed seven. ⚠️ And the record it is chasing is now given three different ways across sources — $936.66m, “$936 million,” and $935.6m. Flagged, unresolved.",
      rec: "This is a five-minute exercise in the difference between a forecast and a realisation, and it costs nothing to set up. Show the three headlines in order, then the actual figure. Ask what the outlets got wrong. The answer is almost nothing — their point estimate was excellent — and yet each published a false sentence in the present tense. Then ask the question that makes it economics: what happens to an outlet that announces a milestone a day early, and what happens to one that announces it a day late? Nothing, and it gets scooped. When the penalty is asymmetric, reporting runs systematically AHEAD of the event, and every reader who does not know that will consistently believe things happened slightly before they did. Students who take that idea seriously will start reading election night, earnings season and sports transfers differently within a week.",
      src: ["Showbiz411 (“Came ThisClose to $900 Million Last Night” — the total at $899,762,111)","https://www.showbiz411.com/2026/09/04/spider-man-came-thisclose-to-900-million-last-night-will-cross-the-line-today"] },
    { cat: "Watching", t: "The GTA 6 trailer has now lost three quarters of its score in two days, and the second instrument that would check it has gone dark for four",
      why: "FlixPatrol's points-based worldwide film chart had the twenty-six-minute Extended Look third on 611 points on September 2, fifth on 267 on September 3, and EIGHTH ON 158 ON SEPTEMBER 4 — a 40.8 per cent single-day fall on top of a 56.3 per cent one, and minus 74.1 per cent cumulatively in forty-eight hours. It now sits at 18.1 per cent of the day's number one, a Netflix film called The Whisper Man. This is the shape Netflix itself predicted, describing the pattern as “front-loaded” and “similar to Netflix's boxing events,” against cumulative figures of 31.1 million views and number one in 87 of 93 countries at peak. ⚠️ But note what you cannot do with it: What's on Netflix has published no daily report for September 2, 3 OR 4, so Netflix's own average-of-national-ranks series is STALE at 4.3 from September 1, now four days old. Do not average a fresh number against a stale one; they are different instruments measuring different things.",
      rec: "Use this the week your students are most confident about something they read on a chart. Give them the three FlixPatrol numbers and ask what happened to the trailer's popularity. They will say it collapsed. Then ask what the points MEASURE — and let them discover that neither of you knows, because FlixPatrol's weighting is proprietary. A 74 per cent fall in an index whose construction is not published is a 74 per cent fall in the index, not in the world. The useful habit, and it takes one sentence: before quoting a number, ask whether you could reproduce it from raw data if you had them. Almost none of the numbers they cite in arguments would survive that test, and knowing which ones do is most of what quantitative literacy actually is.",
      src: ["FlixPatrol (the Netflix worldwide top ten, September 4: GTA VI eighth on 158 points)","https://flixpatrol.com/top10/netflix/"] },
    { cat: "Playing", t: "Three new reviews cost Onimusha a point — and Moonlighter 2's user score finally appeared, resting on exactly four ratings",
      why: "Follow the two numbers separately, because they are doing opposite things. Onimusha: Way of the Sword went from a Metascore of 86 on eighty-six critics to 85 ON EIGHTY-NINE. Three reviews arrived and the score went DOWN — which is exactly what a sample mean is allowed to do and exactly what nobody expects of a thing presented as a score. Its breakdown is now 82 positive, 7 mixed, zero negative. Moonlighter 2: The Endless Vault, meanwhile, has had its user score appear at 7.0 — RESTING ON EXACTLY FOUR RATINGS, two positive and two mixed, which is the bare minimum Metacritic will publish. Its critic count is STILL FROZEN AT SEVEN, where it has sat since release. So on one page today, a published “85” rests on eighty-nine observations, a published “77” on seven, and a published “7.0” on four — all three rendered in the same font, the same box, the same colour. And NBA 2K27, on day two, still has NO Metascore at all: the page reads “available after 4 critic reviews,” and its only two visible scores are a 95 and a 60, an unchanged thirty-five-point spread.",
      rec: "Play the three side by side and let the room think it is one story before you separate them. Give them Onimusha first — 86 on 86, then 85 on 89 — and ask why the number fell. They will say the new reviews were worse, which is right and is worth dwelling on, because it means the number they saw yesterday was not a fact about the game. Then Moonlighter 2: a 7.0 from four people, printed identically to a score from eighty-nine. Ask which of those two numbers they would act on, then ask what on the page told them the difference. Nothing did. The one-sentence version, if you have no time: an aggregate without its sample size is not an estimate, it is a rumour with a decimal point. Then, gently, ask where else they meet numbers that work exactly this way — and let somebody in the room be the one to say “course evaluations.”",
      src: ["Metacritic (Onimusha: Way of the Sword — 85 from eighty-nine critics)","https://www.metacritic.com/game/onimusha-way-of-the-sword/"] },
    { cat: "Reading", t: "The Dungeon Crawler Carl mystery this desk flagged as a naming discrepancy turns out to be two levels of naming, and the answer is in the hyperlink",
      why: "Book Riot's weekly aggregation of five bestseller lists posted on September 3, and Matt Dinniman appears on ALL FIVE. This brief flagged an apparent conflict: Book Riot listed the entry as “Dungeon Crawler Carl” where the New York Times record is for the eighth book in the series, A Parade of Horribles. The resolution is mundane in the most satisfying way — Book Riot prints the SERIES name in the body of the list while the LINK BEHIND IT points to A Parade of Horribles. Series name in the text, volume name in the href, no conflict at all. The rest of the week's picture is also richer than first reported: on all five lists alongside Dinniman are Allen Levi's Theo of Golden, Caro Claire Burke's Yesteryear, Ann Patchett's Whistler and Kathryn Stockett's The Calamity Club; on four, Sheila Masterson's The Poison Daughter; on three, Freida McFadden's Brain Damage, Maggie Haberman and Jonathan Swan's Regime Change, Belle Burden's Strangers, and a Barstool sports collection. Book Riot notes in its own voice that the aggregated lists are “disproportionately by white authors.”",
      rec: "The Dinniman route is the thing worth understanding, not the ranking, and it is genuinely economics. The series was serialised free on Royal Road for years, then Kindle, then audio through a small independent studio with its own narrator following, and only then a hardcover from a traditional publisher — which means it arrived at the New York Times list having ALREADY PROVEN its audience somewhere no publisher was looking. Ask a class why an author would give away years of work and then sell it. Push past the marketing answer to the real structure: free serialisation is how an unknown writer BUYS INFORMATION about whether the thing works and how large the audience is, and the price of that information is the revenue forgone. Then ask who bears the risk under each model, and who captures the return once the uncertainty is gone. If anyone in the room reads LitRPG, hand them the floor — they will explain the audio economics better than you will.",
      src: ["Book Riot (the bestselling books of the week, according to all the lists)","https://bookriot.com/bestselling-books-september-3-2026/"] },
    { cat: "Online", t: "YPulse is publishing again after a month, and its three new surveys are the most usable Gen Z numbers this desk has had all week",
      why: "This brief has been carrying a note that YPulse had published nothing since August 6. That note is obsolete: three dated articles appeared over September 1 to 3, with figures attached. The Halloween survey reports that 79 PER CENT OF TEENS and 68 per cent of young adults say they will dress up in costume this year — a startlingly high number for an activity most people assume ends around fourteen — with the holiday falling on a Saturday and Gen Z apparently calling it “Saturween.” A second finding: “nearly half of young adults use TikTok Shop,” from a shopping and retail report dated August 26, ⚠️ though the sample size is not disclosed on the free page. And a third, which is the one most likely to be useful in an office hour rather than a lecture: 70 PER CENT OF EIGHTEEN- TO TWENTY-FOUR-YEAR-OLDS agree that “dating is more difficult now than it was in the past,” with the apps responding through AI matching and “more intentional” design.",
      rec: "The Halloween number is the one to use, and not for the reason it looks like. Ask your students to guess what share of American teenagers dress up for Halloween. They will guess low, because the strong cultural script says costumes are for children — and the answer is 79 per cent. Then ask what changed. The honest answer involves a market: costumes became photographable, and a photographable costume is a different good from a private one, with a different demand curve and a much longer age tail. If you want the version that will actually land, ask what fraction of the value of a costume is consumed by the wearer and what fraction by the audience, and let them work out that a good whose value depends on being SEEN behaves nothing like a good whose value depends on being used. It is the cleanest network-effect example available in September, and it will still be true in October when the photographs start.",
      src: ["YPulse (6 trends to expect from Gen Z this Halloween — 79% of teens dressing up)","https://www.ypulse.com/article/2026/09/03/6-trends-to-expect-from-gen-z-this-halloween/"] }
