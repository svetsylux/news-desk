  hooks: [
    { story: "Medicare’s GLP-1 “bridge” pilot, reported out by Jackie Fortiér at KFF Health News, launched in July as an 18-month program offering Wegovy, Zepbound KwikPen and Foundayo to Part D enrollees at $50 a month. Eligibility is a BMI of 35 or above, or 27 to 34 with prediabetes or cardiovascular disease — about 3.8 million people, with 5.9 million excluded, at a projected cost of roughly $3.3 billion at 25% uptake and about $10 billion at 75%. The catch is in the fine print: the $50 price applies only to beneficiaries using a GLP-1 exclusively for weight loss. A patient who also carries an FDA-approved indication — Type 2 diabetes, moderate-to-severe obstructive sleep apnea — falls back to their Part D plan and pays $200 to $600 or more a month. Juliette Cubanski, who directs KFF’s Program on Medicare Policy, describes the design intent as reaching “those people who can’t get GLP-1 coverage through Part D but would benefit from taking one for weight loss.” The illustration in the piece is Jeff La Marca, 68, a retired New Jersey professor with a BMI of 42 and a quadruple bypass behind him, denied the $50 price because of a sleep-apnea diagnosis.",
      src: ["KFF Health News","https://kffhealthnews.org/aging/medicare-glp1-bridge-weight-loss-drugs-coverage-exceptions-cost-access/"],
      concept: "Notches in a budget constraint, and an insurance program that prices the healthier type lower",
      q: "Put the two prices on the board with nothing else — $50 a month, or $200 to $600 a month — and ask what distinguishes the two groups. Let them guess. They will reach for income, for plan type, for whether the drug works. Then tell them: the cheap price goes to the patient who has only obesity, and the expensive one to the patient who also has diabetes or sleep apnea. Give it a moment. The reaction in the room is the pedagogical asset, because the instinct that this is backwards is correct and they should learn to trust it while also learning to say precisely why. Start by making them draw it, because the shape is the whole thing. This is not a subsidy that phases out; it is a notch — a discontinuous jump in the budget constraint triggered by a discrete event, in this case the presence of a diagnosis code in a claims record. Have them sketch monthly out-of-pocket cost against health status and label the vertical segment. Then ask the question that makes notches interesting everywhere they appear: what behavior does a discontinuity create that a smooth phase-out would not? The answer is that anything sitting just on the good side of the line acquires enormous value, and anyone near the line has a reason to influence which side they land on. Now push on who does the influencing here, because it is not the patient alone. A diagnosis is entered by a clinician, in a record, for reasons that are partly clinical and partly administrative. Ask what happens to the incentive to document a marginal sleep-apnea case when documentation costs the patient several thousand dollars a year. You are not accusing anyone of fraud; you are pointing out that a coding decision has been given a price, and that prices change behavior even when everyone involved is honest. This is the general lesson about administrative data as an economic object — categories that were designed to describe become, once money attaches to them, things people optimize over. Then turn to the insurance logic, which is the part worth the most class time. In the standard adverse-selection story, the high-cost type is the one who most wants coverage, and the design problem is stopping the pool from unravelling as healthy people leave. Here the program does something that looks like the reverse: it offers its best price to the person with the fewest comorbidities and its worst to the person with the most. Ask them whether that is a mistake or a constraint. Make them argue it. The case for a mistake is straightforward — the patient with diabetes and obesity is the one for whom the drug plausibly does the most good and averts the most downstream spending, so charging him more is buying the least health per dollar. The case for a constraint is that the pilot was designed to fill a gap rather than to maximize health: Part D already covers the drug when there is an approved indication, so the program is deliberately not paying twice for the same person, and the $50 price is aimed exactly at those Part D will not cover. Both are right, which is the point. The design is coherent as gap-filling and incoherent as health policy, and the reason is that the two objectives were never reconciled. Have them state the objective function each interpretation implies. Then do the arithmetic, because the take-up range is a live elasticity problem handed to you for free. Three point eight million eligible; $3.3 billion at 25% uptake; about $10 billion at 75%. Ask them to back out the implied annual cost per taker and check whether it is consistent across the two scenarios — it should be, roughly, and if a student finds it is not, that is a better afternoon than anything I could assign. Then ask what determines where in that range we land. Not price alone: the $50 is fixed. It is awareness, administrative friction, physician willingness to prescribe, and how many people discover only at the pharmacy counter that a diagnosis they already had disqualifies them. Finally, the design question, which is where I would end. Ask them to fix it, subject to a budget. The obvious repair — extend the $50 price to everyone regardless of indication — costs a great deal more and pays for people Part D already covers. The alternative — index the subsidy to expected benefit rather than to indication — requires measuring expected benefit, which nobody can do at the point of sale. A third option is to smooth the notch into a slope, which removes the cliff but destroys the clean administrative rule that made the program cheap to run. Make them pick one and name what they gave up. Every real policy in this space is a choice among those three, and students who can see that will read the next CMS rule differently."},
    { story: "Rockstar Games premieres “Grand Theft Auto 6: An Extended Look” tomorrow, Thursday Aug 27 — roughly thirty minutes of footage, on Netflix at 3:00 p.m. Eastern and on Rockstar’s own YouTube channel at 9:00 p.m. Eastern, in 4K at 60 frames per second. The gap is six hours, and it is the entire commercial structure of the deal. Netflix requires a subscription starting at $8.99; the YouTube version is free to everyone. Brandon Riegg, Netflix’s vice president of nonfiction series, framed it as wanting to be “a place where the most ambitious storytelling, from any medium, can find the biggest possible audience,” adding that “the anticipation and fandom around Grand Theft Auto 6 is unprecedented, and we’re honored that Rockstar Games has partnered with us to debut the next part of the Grand Theft Auto story with Netflix members first.” Take-Two’s Strauss Zelnick declined to disclose financial terms, said there was “a rationale behind the decision,” and suggested the benefits would become clearer once fans had watched. Both companies called the arrangement first-of-its-kind. The reaction online has been almost uniformly that the trailer is “locked behind an $8.99 paywall.” It is not. Nothing is permanently paywalled; what Netflix bought was six hours of priority.",
      src: ["Game Rant","https://gamerant.com/gta-6-extended-look-release-times-netflix-youtube-edt-pdt-bst/"],
      concept: "Windowing as intertemporal price discrimination, and a two-sided platform buying attention rather than content",
      q: "Open with the misconception, because it is load-bearing and your students will arrive holding it. Write on the board what the internet has decided this is — a paywalled trailer — and then write the two times, 3 p.m. and 9 p.m., and ask what is actually being sold. It takes a minute and then somebody gets it: the good is six hours. Nothing is withheld; impatience is priced. That distinction between excluding people from a good and ordering their access to it is one students can carry into a dozen other markets, and it is worth making them say it in their own words before you give them the term. Now build the mechanism. Ask them what a firm needs in order for intertemporal price discrimination to work, and let them derive the conditions rather than receiving them: consumers must differ in willingness to wait, the firm must be able to prevent arbitrage between the early and late versions, and the early version must not cannibalize so much later demand that the whole exercise loses money. Then test each condition against this case. Willingness to wait obviously varies — that is what a fandom is. Arbitrage is where it gets interesting, because the ordinary mechanism fails completely here: a viewer at 3 p.m. can screen-record and post within seconds, and thousands will. Ask why the scheme survives anyway. The answer is that the resold good is degraded in exactly the dimension the impatient buyer cares about — a compressed rip on a social feed is not 4K at 60 frames per second, and more importantly the person who wanted to see it first and talk about it first has already been beaten. Some goods are self-enforcing against arbitrage because the thing being bought is a position in time, and a copy cannot occupy the same position. Have them name three other goods with that property. Then invert the transaction, which is the step most students miss. Ask who is paying whom. The instinctive answer is that viewers pay Netflix. But Netflix is paying Rockstar an undisclosed sum for the right to show content it did not make, promote and will not own, and Rockstar is accepting a smaller immediate audience in exchange for reach into people who do not follow games. So the flow of money runs opposite to the flow of the product, which is the signature of a platform buying an input it values for something other than resale. Ask what Netflix is actually acquiring. Not viewing hours — thirty minutes is nothing against its library. It is acquiring subscriber acquisition and reactivation on a specific afternoon, plus a demonstration to future partners that it can be the venue for a cultural moment. Have them write down what Netflix would need to believe about conversion and churn to make an eight- or nine-figure payment rational, and then ask whether those beliefs are testable after the fact. Now the two-sided part. Rockstar’s side is not obvious either, so make them work it out: why give up the free-and-immediate distribution you already control, on a channel with an enormous installed audience, in exchange for money and a six-hour delay? The best answer is that the two audiences barely overlap. The YouTube audience was going to watch regardless; the Netflix audience contains people who will not buy a $79.99 game on Nov 19 unless something puts it in front of them, and Netflix’s recommendation surface is one of the few places that happens at scale. So Rockstar is not selling access, it is buying discovery, and paying for it in patience belonging to fans who were never going to defect anyway. Ask them whether that is costless to Rockstar, and steer them to the answer that it is not: the cost is the goodwill visible in the backlash, which is a real if unpriced input for a company whose product depends on it. Close with the measurement problem, which is the honest place to leave them. Zelnick declined to disclose terms and said the rationale would become clear after the premiere. Ask what evidence would actually settle whether this was a good deal, for either party, and what data each firm has that the other does not. Netflix can observe sign-ups and cancellations at an hourly resolution; Rockstar can observe preorders. Neither can observe the counterfactual. And that is the general condition of most marketing spending — the firm knows what happened and cannot know what would have happened, which is why the industry runs on beliefs and why an economist’s first question about any such deal should be what experiment, if any, is embedded in it."},
    { story: "Four hospital systems are competing for the right to build 92 acute-care beds in Buncombe, Madison and Yancey counties in western North Carolina, a decision that belongs to the state health department under its certificate-of-need law. Mission Health, owned by HCA, wants to add them to a campus already licensed for 853 beds after receiving 95 more in March; AdventHealth would fold them into a Weaverville facility under construction; UNC Health proposes a new hospital at the Westgate Mall site near downtown Asheville; Novant would add twenty to an approved 34-bed facility in Arden. Mission has drawn its fourth Immediate Jeopardy finding since 2021, was at risk of losing Medicare and Medicaid reimbursement, and was recently confirmed back in substantial compliance. At the Aug 19 public hearing, Yancey County EMS director Kristy Bryant said her crews frequently hear patients ask to be taken “anywhere but Mission,” and that cooperation declined after HCA’s 2019 acquisition; Madison County commissioner Matthew Wechtel cited travel times of 45 to 75 minutes; state senator Julie Mayfield said she was “shocked” and “puzzled” by the March allocation. All five county commissions, sheriffs, health departments, EMS agencies, school systems and municipalities backed AdventHealth and UNC Health, and Asheville mayor Esther Manheimer signed support letters for every applicant except Mission. When the auditorium of more than a hundred was asked whether Mission should receive more beds, the room stood — after Mission’s representatives had left.",
      src: ["North Carolina Health News","https://www.northcarolinahealthnews.org/2026/08/25/western-nc-hospital-certificate-of-need-tug-of-war/"],
      concept: "Entry regulation as a rationed right, and what competition looks like when the regulator, not the market, chooses the entrant",
      q: "Begin with the sentence students will skim past: the state decided there should be 92 more beds. Not a firm, not a set of firms responding to demand — a regulator picked the number, and now picks who gets it. Ask them to say what kind of economic object that is. It is a quantity restriction combined with a licensing decision, which is to say a legally created barrier to entry, and the first useful move is to have them predict the consequences from theory before they hear a word about Asheville. They should be able to generate the standard list: fewer entrants than the free-entry level, positive economic profits for incumbents, rents that get competed for somewhere other than the product market, and an incentive for incumbents to invest in the political process rather than the clinical one. Then hand them the facts and let them check. Now make the incumbent problem concrete. Mission is the largest system, already at 853 beds, already received 95 in March, and has the worst regulatory record of the four. Ask what would happen to a firm with that record in a market with free entry. Patients would leave, a competitor would build, and the incumbent would shrink. Now ask what happens under CON, and let them find the answer themselves: leaving requires somewhere to go, and somewhere to go requires the state’s permission, which the incumbent can contest. The quality-competition channel that ordinarily disciplines a bad provider has been routed through an administrative proceeding. This is the deepest point in the session, and it is worth stating carefully — CON does not merely restrict quantity, it converts quality competition into regulatory competition, and those two processes reward very different capabilities. Then take capture seriously rather than as a slogan. Senator Mayfield was “shocked” and “puzzled” by the March award of 95 beds to Mission, and a DHHS analyst told the hearing he had not been involved in it. Ask what evidence would distinguish capture from a defensible technical judgment made on criteria the public does not see. Make them specify it: the written record of the March decision, the criteria weights, who submitted comments then versus now, whether the same analyst pool decided both. If they cannot name the evidence, they have a suspicion rather than a finding, and the discipline of saying so is most of what an economics education is for. Then complicate the populism, because the hearing was one-sided and one-sided is not the same as correct. The entire local political apparatus backed AdventHealth and UNC. Ask whose interests county commissioners and EMS directors represent, and whether those interests coincide with efficient allocation. Travel time of 45 to 75 minutes from Madison County is a real access cost and belongs in the analysis; it is also exactly the argument every locality makes for a facility in its own county, and the aggregate of all such arguments is a hospital in every county, which is how you get seventeen closures against six openings. Have them reconcile Wechtel’s point with the fixed-cost structure of an acute-care hospital, and notice that the honest answer involves a minimum efficient scale that nobody at the hearing mentioned. Then the counterargument for CON, which deserves its strongest form. The original rationale is that hospitals face a demand curve they partly create, that unconstrained entry leads to duplicated fixed capital and a medical arms race, and that in a market where a large share of payment comes from public programs, excess capacity is financed by taxpayers rather than disciplined by losses. Ask whether any of that is true here, and what the last thirty years of evidence says. Then ask the sharper version: if CON solves a real problem, is picking the entrant the right instrument, or would a rule that caps total beds and auctions the right accomplish the same thing without the hearing? That question — quantity regulation versus allocation mechanism — is the one I would want them to leave holding. Close on the standing ovation. A room of a hundred stood to say the incumbent should not grow, and the incumbent had already gone home. Ask them what that scene is evidence of. It is genuine information about local preferences and it is also a public meeting at 6 p.m. on a Wednesday, attended by people with the time and the motivation to come. Have them name who was not in the room, and what those people would have said. Selection into the comment record is a measurement problem that applies to every participatory process, and students who learn to ask it here will ask it of survey data for the rest of their careers."}

  pulse: [
    { cat: "Listening", t: "The record can’t break this week, and the drop everyone noticed wasn’t about the song",
      why: "Two corrections to what this desk told you on Monday, both of which make the story better. Ella Langley’s “Choosin’ Texas” cannot take the all-time non-holiday record on the chart dated Aug 29 — that chart is week nineteen, the tie. The twentieth week, and the record, resolves on the chart dated Sept 5, published Tuesday Sept 1. And the 9.2% single-day streaming drop this desk called the steepest of its run was a whole-chart Sunday effect: every one of the top fifteen on Spotify’s US daily fell that day. The level is 1,341,125, down 136,468, and that is the number to publish rather than the delta or the superlative. What is genuinely interesting sits underneath. Langley now holds No. 1 and No. 9 simultaneously on the Hot 100 with “Be Her,” and on the Spotify weekly chart “Be Her” climbed four places to No. 7 while the lead single held flat — the catalogue growing while the hit decays, which is what an artist looks like when the audience has moved from following a song to following a person. And at No. 7 on the daily, with 732,164 streams and 312 weeks on the chart, sits The Killers’ “Mr. Brightside,” released in 2004, outstreaming most of the current Hot 100.",
      rec: "The record is the hook and the aggregation rule is the lesson. Ask a student whether a song at No. 1 for nineteen weeks is more popular than one that peaks for three, and let them work out that the answer depends entirely on what Billboard is adding up — and that “All I Want for Christmas Is You” got its twenty-two weeks by re-entering every December, which is not the same process at all.",
      src: ["kworb (Spotify US daily)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Watching", t: "Outer Banks is No. 1 on Netflix and down 46%, and both numbers are true",
      why: "The season-five premiere week of Aug 17–23 drew 9.4 million views and 80.6 million viewing hours, topping Netflix’s English TV list and debuting at No. 1 in 84 countries — and it is down 46% from season three’s 17.4 million, below even season two’s 12.2 million despite an extra day. It also lost the daily top spot over its own opening weekend to a Nordic crime series, Blood Sacrifice. Audience score on Rotten Tomatoes is 38%, down from season four’s 47%, attributed to backlash over a character death in the previous finale. Set that against the finale reportedly scoring 9.0 on IMDb — this desk could not verify that figure and flags it — and the apparent contradiction dissolves the moment you ask who is doing the rating. Finale raters are a survivor population who watched all ten episodes; season raters include everyone who quit in episode three. A rising finale score inside a falling audience is not a paradox, it is what selection looks like. Nineteen days later it is still No. 1 on the US series chart, on day 49 of its run, in a top ten where four titles are true crime or documentary.",
      rec: "This is the cleanest selection-bias example you will get from a television show, and students will supply the data themselves. Ask who finished it, then ask that group to rate the finale, then ask the people who quit why they quit — and point out you have just constructed two incompatible samples in ninety seconds.",
      src: ["What’s on Netflix","https://www.whats-on-netflix.com/news/outer-banks-season-5-debuts-down-on-prior-seasons-with-9-4m-views-in-opening-week-on-netflix/"] },
    { cat: "Playing", t: "The GTA VI reveal is tomorrow afternoon, and the six-hour gap is the whole deal",
      why: "Correcting Monday’s note: the Netflix reveal did not happen Aug 25. “Grand Theft Auto 6: An Extended Look” premieres Thursday Aug 27 — about thirty minutes, on Netflix at 3:00 p.m. Eastern and free on Rockstar’s YouTube channel at 9:00 p.m. in 4K at 60fps. The complaint filling every comment section is that the trailer is “locked behind an $8.99 paywall,” which is not what is happening: nothing is permanently withheld, and what Netflix bought was six hours of priority. Take-Two’s Strauss Zelnick declined to disclose terms and said the rationale would become clearer after people had watched. Meanwhile the leaks remain unresolved — Rockstar has not identified CyberLeek, who has now published at least ten leaks, Bloomberg reports management treating it as all hands on deck with employees “frustrated and exhausted,” and metadata suggests the footage is from 2024 or earlier. A second, unrelated leak of an Xbox Graphics Capture file containing 3D models, map height data and minimap textures is being deliberately gated by the community itself, with only AI mockups circulating publicly. Nov 19, $79.99 and $99.99, disc-free, Nov 12 preload — all unchanged.",
      rec: "Ask which showing they are watching and why. The student who waits until 9 and the student who pays to see it at 3 will each explain their reasoning unprompted, and between them they will have described a demand curve for impatience without anyone using the word.",
      src: ["Game Rant","https://gamerant.com/gta-6-extended-look-release-times-netflix-youtube-edt-pdt-bst/"] },
    { cat: "Playing", t: "Gamescom’s biggest announcement was an eleven-year-old game",
      why: "Opening Night Live ran Tuesday from Cologne, about two hours with Geoff Keighley, who had pre-emptively told people not to expect many new games. He was right, and the headline was The Witcher 3 Remastered: Sept 29, on PC, PS5, Xbox Series X|S and Switch 2, a free upgrade for everyone who already owns it, co-developed with the Hungarian studio Yigsoft and launching on Battle.net through a new Blizzard partnership. CD Projekt Red is also giving both expansions, Hearts of Stone and Blood and Wine, free to all current owners effective immediately — then selling a paid DLC, Songs of the Past, in 2027, the first full expansion since Blood and Wine in 2016. The Witcher 4 was not shown and remains 2028. Elsewhere: Onimusha: Way of the Sword on Sept 4, Gears of War: E-Day on Oct 6, Valor Mortis on Oct 13, NetEase’s Ananta on Jan 15, 2027, Humankind 2 and Rainbow Six: Tactics in 2027, and a Final Fantasy VII Revelation trailer that revealed Ruby and Emerald Weapon. The giveaway is the interesting move: reactivating a dormant installed base immediately before selling it something.",
      rec: "Ask what the free remaster is actually buying. Students who play will tell you they reinstalled a game they finished a decade ago, which is the answer — the giveaway is not generosity, it is the cost of putting a 2027 purchase in front of people who had stopped thinking about the franchise.",
      src: ["Dot Esports","https://dotesports.com/the-witcher/news/the-witcher-3-remaster-songs-of-the-past-dlc"] },
    { cat: "Online", t: "Two fandoms declared a truce over a film almost nobody had seen",
      why: "The biggest native meme event of the week is worth understanding because of how it started. Lesbian Space Princess is a 2025 Australian adult animated sci-fi comedy directed by Emma Hough Hobbs and Leela Varghese, following Princess Saira of the planet Clitopolis as she rescues her ex-girlfriend from the Straight White Maliens. It holds 98% on Rotten Tomatoes and won the Teddy Award at Berlin, and was commercially invisible outside Australia for a year — until Netflix’s recommendation engine started surfacing it and it became a mockery target. Then it mutated: rival fandoms — Hazbin Hotel, Five Nights at Freddy’s, Invincible, several anime communities — began “extending a hand” to each other under the catchphrase “Just This Once,” producing the Great Fandom Truce of 2026. Engagement is not small: one post drew 5.4 million views in three days. Separately, the archive-footage pattern this desk has been tracking has kept collapsing — strictly archive-derived items are now one of eight on Know Your Meme’s trending feed, down from four of seven a fortnight ago. And a nuance on Udin Din Din Din Dun, the Indonesian brainrot character logged as breaking through last week: its first posts date to February 2025 and the surviving TikTok original to March 2025. It did not break through, it was documented. What we are measuring is Anglophone documentation lag, not creation.",
      rec: "When a student references something you have never heard of, skip trying to place it and ask when it started. You will frequently find it is two years old somewhere else, which turns a moment of being out of the loop into a real question about how things travel — and they usually do not know the answer either.",
      src: ["Know Your Meme","https://knowyourmeme.com/memes/events/lesbian-space-princess-fandom-war-the-great-fandom-truce-of-2026"] },
    { cat: "Reading", t: "The self-published series is on four lists and missing from the one that matters",
      why: "Book Riot’s cross-list roundup blends the New York Times, USA Today, Publishers Weekly, Amazon and the Indie Bestsellers list, and Matt Dinniman holds two of the nine multi-list slots. But look at which lists. Dungeon Crawler Carl, the flagship, appears on four of five — Publishers Weekly, USA Today, Amazon and Indie — and not on the New York Times. The Dungeon Anarchist’s Cookbook, a 2024 backlist title, is a fresh debut on three, and the Times is one of them. Same author, same series, different coverage, because the lists have different eligibility rules about what counts and for how long. Three titles make all five: Ann Patchett’s Whistler, Caro Claire Burke’s Yesteryear and Kathryn Stockett’s The Calamity Club. And the measurement gap underneath all of it is still open: the official BookTok Bestseller List, run by the German firm Media Control with TikTok and blending NielsenIQ sales with BookTok engagement, is United Kingdom only and — correcting Monday’s note — monthly rather than weekly, debuting with March 2026 data. There is no US equivalent. Every American claim about BookTok’s commercial power, including the ones this desk makes, is inferred from retailer proxies.",
      rec: "When a student mentions a book everyone is reading, ask how they found it rather than what they thought. The recommendation chain they describe will have no identifiable origin, which is exactly why nobody can measure this — and why publishers are guessing too.",
      src: ["Book Riot","https://bookriot.com/bestselling-books-august-20-2026/"] }
  ],
  classnote: { t: "Line up five facts from five different corners of this week’s youth-culture beat and you have one of the better market-structure discussions available for a principles class, because students will already know every data point. On Spotify’s US daily chart, The Killers’ “Mr. Brightside,” released in 2004, sits at No. 7 with 732,164 streams and 312 weeks on the chart, ahead of most of the current Hot 100. At No. 8 in the weekend box office, on 1,561 screens and taking $3.1 million, sat The Fast and the Furious — the 2001 one. The single biggest announcement at Gamescom was a remaster of The Witcher 3, which came out in 2015, given free to everyone who already owns it. Two of the eight items trending on Know Your Meme are a 2007 Family Guy cutaway and a 2026 TikTok song built on a line from a 2020 Pringles Super Bowl commercial, whose original upload has drawn about 141,000 views in six years while one 2026 derivative drew 3.5 million in ten days. And Matt Dinniman is on three bestseller lists with a book he published in 2024. Start by asking what these have in common, and do not accept nostalgia as an answer — nostalgia is a preference and preferences do not explain why the supply showed up. The answer is on the cost side. Digitized back catalogue has essentially zero marginal cost of supply and, crucially, zero remaining fixed cost, because the fixed cost was sunk years ago and has often already been recovered. Have them draw the two supply curves — a new film with a $200 million production budget and a marketing spend, against a twenty-five-year-old film whose only incremental cost is a distribution fee — and ask what a rational exhibitor does with a screen on a slow August weekend. Then push on why this is new, since old films and old songs have always existed. Two things changed. Distribution costs collapsed, so the catalogue is now as available as the new release rather than sitting in a warehouse; and recommendation systems now put it in front of people who were not looking for it, which is how a 2004 song outstreams a 2026 one and how an obscure Australian animated film with 98% on Rotten Tomatoes goes from commercially invisible to 5.4 million views in three days once Netflix starts surfacing it. Ask them to state the general principle: when search costs fall to near zero, the effective competitor set for any new work expands to include everything ever made in that category. Now the interesting question, and the one worth the second half of the session. If the back catalogue is nearly free to supply and, by revealed preference, close enough in quality that people choose it, who finances new work? Let them flounder a little, because the obvious answers are wrong in instructive ways. “The catalogue owner reinvests” is partly true and is exactly what CD Projekt Red is doing — give away an eleven-year-old game to reactivate a dormant installed base, then sell the 2027 expansion — but it only works for firms that own both. “New work is differentiated” is true and yet Spider-Man: Brand New Day, the highest-grossing Marvel film in US history, was still sharing its top ten with a twenty-five-year-old action movie. The sharper framing is that the catalogue and the new release are not really competing for the same thing: the catalogue competes for attention, the new release competes for the event — which is why the theatrical weekend, the reveal at 3 p.m. tomorrow, and the album release week all involve manufacturing a moment that cannot be time-shifted. Close on the Pringles number, because it is the cleanest thing in the set. The original ad reupload: 141,000 views in six years. One derivative built on a single line from it: 3.5 million views in ten days — roughly twenty-five times the audience in about a two-hundredth of the time. Ask where the value was created and where it landed. It was created in the recombination, by an anonymous account, and it landed nowhere that anyone can bill for. Then ask whether Pringles could have captured it, and make them work through what that would have required — anticipating which line, owning the platform, or enforcing a copyright claim that would have killed the thing generating the value. Most students arrive assuming intellectual property is a mechanism for capturing the value of creative work. This is the example that shows them it is a mechanism for capturing some of it, sometimes, and that the rest goes to whoever happened to be holding the phone.",
    src: ["Boxoffice Pro","https://www.boxofficepro.com/weekend-box-office-spider-man-takes-a-fourth-spin-at-the-top/"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

function renderAbout() {
  const legendRows = ["wire","west","acad","realist","ruind","rust","rudom"].map(k =>
    `<span class="badge"><i style="background:var(${PERS[k].v})"></i>${PERS[k].label}</span><span>${{
      wire: "Wire services and large newsrooms. Fast and factual on events; framing tends to follow Western official sourcing.",
      west: "Defense and foreign-policy analysis shops (ISW, War on the Rocks, Crisis Group, Foreign Affairs). Rigorous, but institutionally close to Western policy debates.",
      acad: "University-affiliated or scholarly aggregation (Carnegie Politika, Russia Matters, NBER, VoxEU, Health Affairs). Slower, source-critical, citation-friendly.",
      realist: "Your five voices plus Responsible Statecraft and Judging Freedom. Strong on questioning official narratives; note they appear frequently on each other's shows, so treat the cluster as one correlated perspective, not several independent confirmations.",
      ruind: "Russian newsrooms in exile (Meduza, Moscow Times). Independent of the Kremlin; oppositional by circumstance.",
      rust: "State wire. Read it to know the official Kremlin line — that is its value and its bias.",
      rudom: "Business dailies operating inside Russia under censorship (Kommersant, RBC). Useful on the economy; constrained on politics."
    }[k]}</span>`).join("");
  document.getElementById("tab-about").innerHTML = `
    <div class="card about" style="max-width:900px">
      <h2 style="font-family:Charter,Georgia,serif;margin:0 0 10px">How this desk works</h2>

      <div class="legend">${legendRows}</div>
      <p><b>A practical habit from the classroom:</b> when any source — mainstream or heterodox — makes a falsifiable prediction (“the front will collapse by spring”, “sanctions will crater the ruble”), jot it down and revisit in three months. Track records, not vibes, are the academic's bias detector. The side-by-side columns in Geopolitics are built to make that easy.</p>
      <p><b>Freshness:</b> a scheduled task rewrites the Morning brief, the classroom hooks, the Student Pulse, and the saved headlines once a day, every morning around 5:00 a.m. Detroit time. Independently, every time you open the page it re-pulls all 98 feeds live (green dot = live; gray = snapshot from the last rebuild; red = source unreachable right now). The FX tiles pull European Central Bank reference rates live.</p>
      <p><b>Paywalls &amp; plumbing:</b> FT and The Economist feeds carry headlines; the click may hit a paywall. Sources without a usable public feed arrive via a Google News query (their headlines, Google's plumbing). YouTube cards list each channel's latest uploads.</p>
      <p><b>Student Pulse:</b> a standing answer to “what are my undergraduates into right now?” Each refresh rewrites the Pulse check — what they're listening to, watching, reading, playing, and doing online — with a line of analysis and one practical way in for you, plus a weekly youth-market story that doubles as a micro example. The aim is fluency, not imitation: knowing what Haymaker Valley is beats referencing it.</p>
      <p><b>Mind &amp; Cosmos:</b> your standing shelf for consciousness studies, Dzogchen and Tibetan Buddhism, Advaita Vedanta, quantum physics and computing, and psychedelics research — mixing contemplative magazines (Tricycle, Lion's Roar, Buddhistdoor), consciousness-first essays (Essentia, Aeon/Nautilus filtered, Closer to Truth), hard physics (Quanta, Physics World, new arXiv quant-ph papers), and the psychedelic research pipeline (Psychedelic Alpha, PsyPost, MAPS). Teaching &amp; pedagogy has its own column under Higher Ed, and the Culture tab keeps a Director watch on Lynch, Noé, von Trier, and Refn alongside Criterion, MUBI, and Senses of Cinema.</p>
      <p><b>Culture without the WSJ:</b> FT Life &amp; Arts and Aeon are the closest substitutes for the WSJ weekend essay; the New Yorker, NYRB, and The Atlantic cover the long-form review beat; ARTnews and Guardian Culture carry art-world news; Vogue, Business of Fashion, and Variety keep a lighter eye on style and entertainment.</p>
    </div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
</script>
