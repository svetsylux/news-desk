  hooks: [
    { story: "A rural hospital has two ways to stop losing money, and both of them make somebody worse off. STAT's reporting this morning gives the numbers on one side: when rural hospitals merge, one study finds post-merger price increases of “more than 10%,” and a bipartisan Senate review found increases of “20% or more … ‘not uncommon'.” The other side is closure, which does not raise the price of care — it removes it. Greg Maddrey of Chartis says “For every deal that's been announced, there are scores being talked about,” and the wave is being driven by hospitals bracing for Medicaid cuts. Now put beside it a case from last week that supplies something economists almost never get. FAIRFIELD MEDICAL CENTER IN OHIO WAS LOSING MORE THAN $37 MILLION A YEAR. OhioHealth moved to acquire it. The Federal Trade Commission — which had already sued OhioHealth in February over allegedly anticompetitive insurer contracts — BLOCKED that deal, and simultaneously went looking for another buyer. One appeared: Adena Health, whose acquisition closed on September 3. The FTC's Daniel Guarnera: “Today's announcement should serve as a reminder that we will stop bad hospital deals.” So the usual objection to blocking a merger — that the alternative was the hospital dying — was tested here, and the alternative turned out to be a different buyer.",
      src: ["STAT — Unraveled, part three: rural hospital mergers and how to balance survival versus competition","https://www.statnews.com/2026/09/08/rural-hospital-mergers-medicaid-cuts-part-3-unraveled-series/"],
      concept: "The WILLIAMSON TRADE-OFF, and the failing-firm defence as an empirical claim rather than a legal one. Merger policy in health care is the cleanest available case of a welfare trade-off that cannot be assumed away: consolidation may genuinely lower average cost — shared back office, shared specialists, one electronic record instead of three, a bigger draw on capital markets — while simultaneously raising price by removing the alternative a payer could have walked to. Williamson's insight, which is exactly a hundred years too late for most textbooks to state cleanly, is that these two effects are measured in different units and traded off at the margin: a merger that raises price by 10% but lowers cost by more can be welfare-improving in a partial-equilibrium sense, and one that raises price without lowering cost is pure transfer plus deadweight loss. The second concept is the FAILING-FIRM DEFENCE, which is where the Fairfield case earns its place: antitrust law will permit an otherwise-illegal merger if the target would exit anyway and no less anticompetitive buyer exists. Note the structure of that test — it is a claim about a COUNTERFACTUAL, and it is almost always argued rather than observed. Here it was observed, and it failed: an alternative buyer existed. The third strand, and the one a health economist can push furthest, is that hospital markets are defined by geography, so the relevant elasticity is not a taste parameter but a driving time.",
      q: "Start with the trade-off and refuse to let them resolve it too fast. Put two numbers on the board — post-merger prices up 10 to 20%, and the alternative is the hospital closing — and ask which is worse. They will split, and the split is the lesson, because both answers are defensible and the disagreement is about a magnitude nobody in the room has. Push them to say what they would need to KNOW to decide: how far the next hospital is, how many patients are price-sensitive versus emergency, how much of the cost saving is real versus accounting, and who captures it. Once they have generated that list they have effectively derived the merger-review framework, and you can tell them so. THEN INTRODUCE FAIRFIELD, and do it as a puzzle rather than an illustration. Give them only this: a hospital losing $37m a year, a buyer, and a regulator that blocked the sale. Ask whether the regulator was right. Somebody will say the obvious and correct-sounding thing — that a hospital about to die should be allowed to be bought by anyone. Let that argument be made well. Then give them the ending: a second buyer appeared within months. Watch what happens to the room. The point to land is precise and it transfers everywhere: THE FAILING-FIRM ARGUMENT IS AN EMPIRICAL CLAIM ABOUT WHAT WOULD OTHERWISE HAPPEN, AND IT IS USUALLY UNTESTED BECAUSE ONCE YOU APPROVE THE MERGER YOU NEVER FIND OUT. Ask them how they would design a policy that tests it — a waiting period, a solicitation requirement, a divestiture-with-buyer condition — and let them notice that the FTC here did the third thing on purpose. Three extensions, each about four minutes. FIRST, the incidence question, which is where health economics diverges from ordinary IO: a hospital's price is not paid by the patient, it is negotiated with an insurer and passed through to premiums. Ask who actually bears a 10% hospital price increase in a rural county, and let them trace it to employer premiums, to wages, and to the uninsured. SECOND, the elasticity question: what does “the next hospital is forty miles away” do to a demand curve, and does it do the same thing to an obstetrics patient as to a heart attack? They will get to the answer that the emergency case has essentially inelastic demand and therefore bears the whole increase — which is why emergency care is where surprise-billing fights happen. THIRD, for a quantitative group: this is a natural-experiment design waiting to happen. Blocked mergers and completed mergers are not randomly assigned, but the FTC's enforcement decisions generate variation. Ask what they would need to believe for a comparison of merged and blocked-merger markets to identify a price effect, and let them find the selection problem themselves — the FTC blocks the deals it thinks are worst, so the blocked sample is not a control group."  },
    { story: "Two federal rulemaking dockets are open right now on the same website, both closing this month, and the Federal Register publishes for each one a comment count and a page-view count. On the HHS request for information about federal vaccine recommendations, there are 12,237 COMMENTS AGAINST 13,271 PAGE VIEWS. On the Department of Homeland Security's H-1B fee rule, there are 6,647 COMMENTS AGAINST 29,012 PAGE VIEWS. Work out the ratios and something odd falls out. On the vaccine docket, comments are 92.2% of page views. On the H-1B docket, 22.9%. The H-1B rule is drawing FOUR TIMES the traffic and HALF the comments. Same platform, same fortnight, same two-click filing mechanism, wildly different behaviour. Nor is the vaccine count a slow accumulation: it went from 3,896 to 9,798 in a single day, then to 12,237 the next. And when you go looking for why, you find it immediately — Children's Health Defense is running two separate action alerts pointing members at that docket, Teachers for Choice a third, and there are others. Those alerts link straight to the comment form. A person who arrives that way never loads the Federal Register page at all, which is exactly why the ratio exceeds ninety per cent.",
      src: ["Federal Register — the HHS vaccine RFI comment and page-view counters (12,237 comments, 13,271 page views)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],
      concept: "COLLECTIVE ACTION, the cost of participation, and why a count of anything is a joint measurement of preference AND of the technology for expressing it. Olson's argument is that a diffuse group with small per-person stakes will under-organise relative to a concentrated group with large per-person stakes, even when the diffuse group is larger and its total interest greater. That is usually taught as a story about lobbying budgets, which makes it feel remote. Here it is visible in two numbers on a government website: the group with an organised infrastructure converts nine readers in ten into filers, and the group without one converts two in ten. The deeper move — and this is the one worth the class — is that a comment count is NOT a measurement of public opinion, it is a measurement of MOBILISATION, and the ratio of comments to page views is a rough estimate of how much of the count is organised. That distinction has a formal name in the literature on political participation, and it is the reason agencies are legally required to weigh the substance of comments rather than tally them. Third strand: the ratio itself is a free instrument. Nobody constructed it, nobody publishes it, and it costs one division. Students should come away knowing that the most useful statistic in a dataset is often one that is not in it.",
      q: "Give them the four numbers cold — 12,237 on 13,271, and 6,647 on 29,012 — and say only that these are two open federal rules. Ask which rule the public cares about more. They will reach for the vaccine docket, because 12,237 is bigger than 6,647, and that is the answer you want on the board so you can dismantle it. Then ask a second question: which rule are more people READING about? Now the H-1B docket wins by a factor of four, and the room has two contradictory answers from the same table. Let the contradiction sit for a moment before you give them the ratio. Once somebody computes 92% and 22%, ask what could possibly produce a ninety-two per cent conversion rate from readers to filers — and let them work out that it cannot be a conversion rate at all, because the filers were never readers. They arrived somewhere else. At that point tell them about the action alerts, and watch the number change meaning in front of them. THE LINE TO LAND: A COMMENT COUNT MEASURES ORGANISATION, NOT OPINION — and the page-view denominator is what lets you see which. Then push into economics proper. Ask why the H-1B rule, which reallocates a great deal of money among firms and workers, generates so much less filing than a rule about vaccine schedule categories. Somebody will get to Olson: the H-1B rule's costs and benefits are spread across employers, universities and prospective migrants who have no single organisation and, in the case of the migrants, frequently no standing to file. The vaccine docket has a mailing list. Ask them which way that biases the record an agency is legally obliged to consider, and you have arrived at regulatory capture from a direction that has nothing to do with bribery. Three extensions. FIRST, the mechanism-design version: how would you design a comment process that measures intensity of preference rather than count of filings? Let them propose costly signals — requiring a substantive argument, requiring identification, sampling rather than tallying — and for each, ask who is excluded and what the new evasion is. SECOND, an empirical exercise they can actually do in an hour: pick any three open dockets on regulations.gov, compute the comments-per-page-view ratio, and predict from the ratio alone which ones have an advocacy campaign behind them. Then check. It works often enough to be interesting and fails often enough to be instructive. THIRD, for the strong students: the ratio is contaminated in a way they should be able to find. Page views are inflated by repeat visits, bots and researchers; comments are inflated by duplicates. Ask what the bias does to the ratio and in which direction, and whether the COMPARISON between two dockets survives contamination that hits both. It largely does — which is a nice demonstration that a noisy statistic can still support a clean comparison."  },
    { story: "Netflix says that “Grand Theft Auto VI: An Extended Look” — a twenty-seven-minute promotional video for a video game that will not be released until November — took 31.1 MILLION VIEWS in its opening window, was number one on the English Films chart, and was number one in 87 OF 93 TRACKED COUNTRIES. On YouTube the same video did about 17 million. So the Netflix number is nearly double, and a trailer beat films. Now look at how the number is built. Netflix reports 14 MILLION VIEWING HOURS for it, and defines a “view” as TOTAL HOURS DIVIDED BY RUNTIME. Fourteen million hours divided by twenty-seven minutes is 31.1 million. The arithmetic is exact. Beside it on the same chart sits “The Whisper Man,” a feature film, with 23.2 MILLION VIEWS ON 44.1 MILLION HOURS — THREE TIMES THE ACTUAL WATCH TIME, and a lower headline number. A twenty-seven-minute advertisement out-“views” a feature film because the denominator it is divided by is small. Both numbers are correct. They are not measuring the same thing, and they are printed in the same column. The trailer then fell to an average rank of about 4.3 within four days and vanished from the daily chart entirely — which the weekly chart, being an average of ranks, still shows at number five.",
      src: ["What's on Netflix — the GTA 6 Extended Look's Netflix Top 10 viewership (31.1 million views on 14 million hours)","https://www.whats-on-netflix.com/news/top-10-reports/grand-theft-auto-6-extended-look-netflix-top-10-viewership/"],
      concept: "UNITS, DENOMINATORS, AND WHO CHOOSES THE METRIC. The formal content is elementary and almost never taught: a ratio is only comparable across items when the denominator is held fixed, and “views” defined as hours-over-runtime has a denominator that varies BY THE ITEM BEING MEASURED. That is not a measurement error, it is a category error, and it systematically advantages short content — which is to say, it advantages advertising over programming, on a platform that increasingly sells both. The economics arrives when you ask WHO SELECTED THIS DEFINITION. Netflix chose it, publishes it, and is measured by it by advertisers, by the press and by its own shareholders. That is the classic structure of a performance metric chosen by the party the metric evaluates, and the prediction — Goodhart's law in its sharpest form — is that the metric will be optimised rather than merely reported. A second, cleaner concept sits underneath: hours are a measure of ATTENTION, which is the genuinely scarce input in this market, while views are a measure of TRANSACTIONS. Whether a platform should be valued on attention or on transactions is a real question with different answers for a subscription business and an advertising business — and Netflix is now both.",
      q: "Do this one entirely as a puzzle and give away nothing. Put two rows on the board: GTA 6 trailer, 31.1m views, 14m hours; The Whisper Man, 23.2m views, 44.1m hours. Ask which was watched more. The class will split immediately, and unlike most classroom splits this one has a correct answer that depends entirely on what “watched more” means. Let them argue for three or four minutes before anyone divides. Then ask someone to divide hours by views for each row. Twenty-seven minutes for one, nearly two hours for the other — and at that moment the definition reveals itself without your having to state it. Write on the board: A VIEW IS HOURS DIVIDED BY RUNTIME. Now ask the question the class is ready for: what kind of content does this metric flatter? They will get to short content, and then, if you wait, to advertising. Then turn it into economics. Ask who chose the definition, who is evaluated by it, and what you would expect to happen to the length of Netflix's content over time if this remains the headline number. Somebody will say Goodhart's law even if they do not know the name; give them the name. The generalisation is the payload and it transfers to everything they will read: WHEN A PERFORMANCE MEASURE IS DEFINED BY THE PARTY BEING MEASURED, THE DEFINITION IS PART OF THE PERFORMANCE. Three extensions, four minutes each. FIRST, the alternative-metrics exercise: ask them to propose three other definitions of “view” — completion rate, unique accounts, hours — and for each, name the content type it advantages and the firm that would prefer it. They will discover there is no neutral choice, which is the honest and slightly uncomfortable conclusion. SECOND, the censored-data version, using the same story: the trailer went third, fifth, eighth, then GONE from the daily top ten, while the weekly chart — an average of daily ranks — still shows it at number five. Both are correct. Ask what “gone” means on a list that reports only ten places, and let them see that everything below the cut is recorded as the same value, absence, whether it was eleventh or five-hundredth. That is truncation, and once they have seen it here they will see it in every dataset with a top-N. THIRD, for a quantitative group: hand them the two rows and ask what quantity they would need in order to compare the two titles fairly. They should arrive at hours, or at attention-share, and then hit the real problem — that a two-hour film and a twenty-seven-minute trailer are not substitutes for the same slot of a viewer's evening, so even hours is not a clean comparison. That difficulty is genuine and unresolved in the industry, and telling them so is better than pretending otherwise."  },

  pulse: [
    { cat: "Listening", t: "The Dolly Parton plateau broke the moment the weekend washed out of the numbers — and it took the 1982 story down with it",
      why: "For a week this desk described the post-death streaming surge for “9 to 5” as settling onto an elevated plateau: 1,496,874 global streams on Sept 2, then 1,484,293, then 1,558,847, then 1,522,698. Sunday's figures end that reading. “9 to 5” fell to 1,258,610, DOWN 17.3%, and “Jolene” to 1,239,904, down 16.3% — and BOTH TRACKS HAVE NOW LEFT THE GLOBAL TOP 100 for the first time. What makes it conclusive rather than just another down day is the comparison set. Every other track this desk tracks fell on the same day, because Sunday always falls: Bieber −10.9%, Michael Jackson −12.1%, The Killers −9.9%, Katy Perry −7.0%. The Parton tracks fell at ROUGHLY 1.6 TIMES THE RATE OF THE CHART AROUND THEM. That is decay resuming, not a plateau, and the flatness of Sept 2 to 5 was substantially the weekend holding it up. The same correction applies to something this desk reported approvingly on Saturday: Michael Jackson's “Billie Jean” was UP 81,916 and looked like a genuine forty-four-year-old revival accelerating. On Sunday it gave back 338,690 — four times the rise — and dropped from ninth to twelfth. The Saturday gain was a day-of-week artifact.",
      rec: "This is the cleanest five minutes on seasonality you will get from something your students actually follow, and the trick is to withhold the comparison set. Put up the two Parton numbers and the −17%, and ask whether the surge is over. Most will say yes; a few will say it is just Sunday. Then reveal that everything else fell too, and ask the better question: how much of the −17% is Sunday and how much is Dolly? Getting from “it fell” to “it fell MORE THAN THE THINGS AROUND IT” is the whole idea of a difference-in-differences, arrived at without the phrase. Then make it sting a little by admitting the Billie Jean error out loud — a rise you would have reported as a trend, undone by the same effect running the other way. Students trust an instructor who shows their own revision.",
      src: ["kworb — Spotify global daily, September 6 (“9 to 5” at 1,258,610, down 17.3%, out of the top 100)","https://kworb.net/spotify/country/global_daily.html"] },
    { cat: "Listening", t: "Ella Langley has seven of the American top 200 — and her record is simultaneously the first, the second and the fourth longest-running ever, depending on who is counting",
      why: "“Choosin' Texas” held number one in the United States on Sunday with 1,399,798 streams, but the more interesting fact is underneath it: SHE HAS SEVEN TRACKS IN THE US TOP 200, and FIVE OF THE SEVEN ARE COLLABORATIONS — “Be Her” at nine with Morgan Wallen, “I Can't Love You Anymore” at 29, “Hell At Night” with BigXthaPlug at 44, “you look like you love me” with Riley Green at 99. The hit does not just sit at the top; it pulls a catalogue up behind it and lends her audience to other artists' records. ⚠️ The chart that decides whether she reaches a twenty-first week at number one — the Hot 100 dated September 12 — HAD NOT PUBLISHED at 5 a.m., almost certainly shifted by the Labor Day Monday. What did surface is a definitional problem worth more than the missing chart. Billboard describes her twentieth week as making her the “sole longest-leading NON-HOLIDAY Hot 100 hit”; Rolling Stone calls the same run the “SECOND-longest-running number one single”; Forbes, at seventeen weeks, called it the “FOURTH-longest reigning.” The whole gap is one analyst's decision to exclude Christmas songs.",
      rec: "Ask your students what the record IS, and let them discover there isn't one — there are three, and the difference between them is a definition rather than a measurement. This is the identical problem to the box-office record being quoted four ways and never adjusted for inflation, and it is worth putting the two side by side, because the pattern is general: every “all-time” claim contains a hidden comparison set, and the person quoting it chose it. Then use the seven-tracks fact for the economics. Ask why a single hit lifts an artist's entire back catalogue — the answer is algorithmic recommendation plus artist-page browsing — and then ask what that does to the price a featured artist should be willing to pay for her verse. They will get to the idea that she is renting an audience, which is a real market with real prices and no published data.",
      src: ["kworb — Spotify US daily, September 6 (“Choosin' Texas” at number one on 1,399,798)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Playing", t: "Three days of Metacritic readings, and you can watch sampling error collapse in real time",
      why: "This desk started tracking two game pages on Saturday, and the third reading turns an anecdote into a series. ONIMUSHA: WAY OF THE SWORD went 8.9 on 51 user ratings, then 8.7 on 187, then 8.7 ON 259. The score moved two tenths on the first fivefold expansion and DID NOT MOVE AT ALL on the next 39% of new ratings. That is exactly what convergence looks like: the 8.9 was noise from the fifty people who pre-ordered a niche samurai action game and rushed to post, and the 8.7 is the estimate. Meanwhile the critic sample FROZE AT 91 and has stayed there — the review-embargo cohort is complete and closed, so one estimator is censored forever at 91 observations while the other is still growing. Both print at the same apparent precision. ⭐ Better still, the platform splits arrived today and they are the sharper example: the SAME GAME scores 83 on 28 PC critics, 83 on 10 Xbox critics, and 89 ON 12 SWITCH 2 CRITICS. The highest score comes from the smallest sample. ⚠️ And NBA 2K27 supplies a live case of a reporting rule manufacturing an absence: its PC score read “tbd” on two reviews on Saturday, and today, having crossed seven, it prints 70. The Xbox version is still “tbd” on four. Nothing about the game changed; the count did.",
      rec: "Put the three Onimusha readings on the board as a sequence and ask what the game did between Saturday and today. The answer — nothing — is the point. Then ask why the score moved the first time and not the second, and let them get to sample size on their own. The line that generalises past video games, and the one worth saying slowly: a rating is most reliable exactly where it is least needed, because the things everyone plays get thousands of raters and the obscure ones get five. If you want a second act, the platform splits are the better hook for a class that has already met standard errors — same game, same week, 83 to 89, and the highest number resting on twelve opinions. Ask what a confidence interval on each would look like and whether the ranking would survive it.",
      src: ["Metacritic — Onimusha: Way of the Sword (85 on 91 critics; user 8.7 on 259 ratings, read September 8)","https://www.metacritic.com/game/onimusha-way-of-the-sword/"] },
    { cat: "Watching", t: "What your students are actually streaming this week is a teen shipwreck drama in its umpteenth season, and it is nowhere near the top of the chart",
      why: "FlixPatrol's worldwide Netflix daily for September 7 is led by titles that would mean nothing in a lecture hall: “The Whisper Man” at 826 points, “The Secret Woman” at 639, an Instadocs entry at 538. The genuine under-25 title is “OUTER BANKS,” SEVENTH ON THE TELEVISION CHART WITH 223 POINTS — the same position it has held for several days, well behind “The Gentlemen” at 794. That gap is worth internalising before you reference anything: the platform's most-watched list and your students' most-watched list are different lists, and the overlap is thinner than the phrase “Netflix top ten” suggests. The GTA 6 promotional video, which was number one in 87 of 93 countries little more than a week ago, is ABSENT FROM THE DAILY CHART for a second consecutive day — while the weekly chart, being an average of daily ranks, still shows it at number five. Both are correct and they measure different windows.",
      rec: "The useful habit here is not knowing what is on the chart, it is knowing that the chart is not one thing. If a student mentions a show, ask which chart they saw it on before assuming it is big — daily, weekly, per-country and per-language charts disagree constantly, and a title can be simultaneously first and absent. As a two-minute classroom aside, the GTA 6 case is a free lesson in truncation: a title “disappears” from a top ten not because nobody is watching it but because the list only reports ten places, and everything below the cut is recorded as the same value, namely absence. When a series ends, ask whether the thing stopped or the ruler ran out.",
      src: ["FlixPatrol — Netflix worldwide top ten, September 7 (Outer Banks seventh on the TV chart with 223 points)","https://flixpatrol.com/top10/netflix/"] },
    { cat: "Online", t: "Know Your Meme still has no September ballot — and the reason the desk's own “missing July” complaint was wrong is a better lesson than the ballot would have been",
      why: "A third consecutive direct check of the meme-of-the-month poll index finds NO SEPTEMBER BALLOT. August's winner still stands: the “Lesbian Space Princess Fandom War,” also circulating as the Great Fandom Truce, on 13.3% of the vote, in which rival fandoms “stopped tearing each other apart and joined forces to relentlessly make fun of Lesbian Space Princess” — which is a genuine coalition-formation case and a better game-theory example than most textbook ones. ⭐ But the real finding today is a correction to this desk's own reasoning. For two runs this desk has noted that the poll index “jumps August to June, skipping July,” and treated that as evidence the index is unreliable. JULY'S POLL EXISTS. It is filed under a different category — meme-review rather than poll — and so never appears on the index this desk was reading. The index is not incomplete because a month went missing; it is incomplete because a month was FILED SOMEWHERE ELSE. Which means the absence of a September ballot from that index is weaker evidence than it looked, and might mean nothing at all.",
      rec: "This is worth five minutes precisely because the mistake is so ordinary. Ask your students what it means when something is missing from a list, and push past “it doesn't exist” to the two alternatives: it was never added, or IT WAS FILED SOMEWHERE THE LIST DOESN'T LOOK. Then ask which of those you can distinguish from the list alone — the answer is neither — and you have taught selection on the observation rule rather than on the outcome, which is the harder and more useful version. If they want the game theory instead, the Great Fandom Truce is a clean coalition problem: rival groups with a shared low-cost target, temporary cooperation, and no enforcement mechanism. Ask what makes it collapse.",
      src: ["Know Your Meme — the meme-of-the-month poll index, checked directly for a third day","https://knowyourmeme.com/editorials/poll"] },
    { cat: "Online", t: "Seventy-nine per cent of teens say they will dress up for Halloween. Nobody says out of how many",
      why: "YPulse's Halloween trend report, the freshest youth-market research available this week, reports that 79% OF TEENS AND 68% OF YOUNG ADULTS say they will wear a costume this year — an eleven-point age gradient, which is the kind of number that ends up in a marketing deck and then in a lecture. The accessible version publishes NO SAMPLE SIZE, no field dates and no definition of its age bands. What counts as a teen? What counts as a young adult? Over what period were people asked, and how many? None of it is stated. The eleven-point gap may be real and may be interesting, but with no n and no band definitions it cannot carry any weight at all — and the report's headline promises six trends while the free version delivers three categories, several of them with no figures whatsoever. This desk's standing rule on this beat is to omit unmeasured claims rather than dress them up, and most of what is published about Gen Z fails that rule.",
      rec: "Use it as an inoculation, not as a fact. Show your students the 79% and ask what they would need to know before repeating it — they will produce sample size, question wording, who was asked and when. Then point out that the number is going to be quoted all month anyway, by people selling costumes, and that the absence of an n is not an oversight but a norm in commercial research, because the n is the part that costs money. The transferable habit is small and permanent: when a percentage arrives without a denominator, the correct response is not disbelief, it is a question. If your students take one thing from this beat all term, make it that one.",
      src: ["YPulse — 6 trends to expect from Gen Z this Halloween (79% of teens, 68% of young adults; no sample size published)","https://www.ypulse.com/article/2026/09/03/6-trends-to-expect-from-gen-z-this-halloween/"] },
  ],

  classnote: { t: "NBA 2K27 has a Metacritic score of 76, from sixteen professional critics. It also has a user score of 4.5 out of ten, from eleven players — which on the same hundred-point scale is 45. A THIRTY-ONE-POINT GAP, on the same game, in the same week. Compare that with Onimusha, released within days of it, where critics say 85 and users say 87: two populations agreeing to within two points. The 2K27 gap is not noise, and this is checkable — the user score has held at exactly 4.5 while its sample nearly tripled from four ratings to eleven. Something systematic is happening, and it is the best available illustration of an idea your students will otherwise meet only as a diagram. START BY ASKING WHAT A REVIEW SCORE IS A SCORE OF. Push past “how good the game is” until somebody says something more careful, like “how much someone enjoyed the thing they paid for.” Write that on the board, because the phrase contains the answer. Then ask the class to describe, concretely, what a professional critic and an ordinary player each experienced. The critic received the game free, before release, on a review build, played it intensively for a week and wrote about the basketball. The player paid seventy dollars, and then encountered a second economy inside the game — a virtual currency, purchasable with real money, that accelerates the improvement of their player. The critic reviewed a basketball simulation. The player bought a basketball simulation ATTACHED TO A STOREFRONT. THEY ARE NOT RATING THE SAME GOOD. Now you have the concept, and it is worth naming precisely: this is a TWO-PART TARIFF, the same structure as a printer and its cartridges, a razor and its blades, a theme park with a gate price and paid queue-jumping. A fixed fee for entry, then a per-unit charge for the thing you actually want more of. Ask them why a firm would ever prefer that to simply charging eighty-five dollars up front, and let them work through it rather than telling them. They will get to the answer eventually, and it is a good one: the two-part tariff lets the seller extract more from the customers who value the product most WITHOUT pricing out the ones who value it least, because the entry price can stay low while heavy users pay more. That is price discrimination achieved through product design instead of through a price list, and it is why the structure is everywhere. THEN THE TWIST THAT MAKES IT WORTH A FULL CLASS. Ask who is in a position to observe the second part of the tariff. The critic, playing a free pre-release build, largely is not — the storefront barely exists before launch, and the currency is not scarce when you have been given everything. The player, four weeks in and short of currency, is living inside it. So the thirty-one-point gap is not a disagreement about quality at all; it is the difference between reviewing the gate price and paying the whole tariff. Ask them to predict which OTHER products would show this signature, and they will generate mobile games, gym memberships, airlines with baggage fees, and printers — all cases where the professional review and the customer review diverge in the same direction and for the same reason. THREE EXTENSIONS, ABOUT FIVE MINUTES EACH. FIRST, the measurement problem, which brings the earlier lesson back: sixteen critics against eleven users. Neither number is large, and the user score is drawn from people motivated enough to post, who skew toward the aggrieved. Ask whether the gap would survive better sampling — and note that it is an annual franchise, so the same gap appearing year after year is itself evidence that it is not a fluke. SECOND, the welfare question, which is genuinely contested and should not be resolved for them: is the buyer worse off? They paid seventy dollars for something they wanted and can play without ever spending another cent, but the game is designed to make that experience slower. Ask whether a deliberately degraded free path is a harm or merely a price, and let the disagreement stand — this is the live question in every regulatory fight over loot boxes and in-app purchases, and there is no settled answer. THIRD, for a quantitative group: this is a testable proposition with public data. Ask them to collect critic and user scores for the last five annual editions of a sports franchise and for five single-purchase games released the same years, and see whether the critic-user gap is systematically larger where a currency economy exists. That is a real, small, publishable-shaped empirical project a good undergraduate could do in a fortnight, using only numbers anyone can read off a website.",
    src: ["Metacritic — NBA 2K27 (Metascore 76 on sixteen critics; user score 4.5 on eleven ratings, read September 8)","https://www.metacritic.com/game/nba-2k27/"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
