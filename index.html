<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "Iran answered the Larak strike by hitting American bases in two Gulf states, and the president promised to answer that. Sunday night US Central Command struck IRGC rocket launchers on Larak Island; CENTCOM said its personnel had been observed loading sea-mine rockets onto the launchers and preparing to deploy them into the shipping channels, roughly fifteen miles from the Strait of Hormuz lanes. On Monday morning Iran retaliated directly, which is the development this desk was watching for. The IRGC launched a combined missile and drone strike on the King Hussein and Al Azraq bases in Jordan, saying the strikes “destroyed the technical and repair infrastructure, as well as the enemy fighter” deployment sites. Jordan's military says it intercepted eight missiles; two Jordanian security sources told ABC News that some were not successfully intercepted. No casualties are reported either way. Iranian forces also struck the Al Minhad airbase in the United Arab Emirates, and here the accounts diverge in scale rather than in fact: Al Jazeera and The New Arab describe dozens of drones, while GlobalSecurity's Day 185 log describes the UAE air force engaging a single drone over territorial waters, calling it the first Iranian drone activity against a Gulf state in twelve days. Both are printed; neither is reconciled. Iran separately claims to have shot down an American drone over the strait, which the US side has not confirmed. President Pezeshkian: “We are not seeking war, but we will deliver a decisive response to the aggressors.” IRGC spokesman Sardar Mohebi called the American strike “a strategic and fatal mistake” with consequences to follow “economically and militarily.” Trump, on Fox News: “We're going to hit them hard. There will be a response” — and separately, in a post declaring Iran a failed nation, “IT IS DEAD! They have no Navy, they have no Air Force, they have no currency.” He also alleged the Iranian government has killed more than 100,000 protesters and should be tried for war crimes; Al Jazeera flags the figure as unsubstantiated and notes Iran's own official protester-death count is 3,117, which is a different metric from the 3,527 Iranian war dead in Al Jazeera's six-month ledger and should not be merged with it. Trump also posted an AI-generated video falsely showing Kharg Island being destroyed, which GlobalSecurity's log identifies as disinformation with no supporting evidence. Israel is not part of this exchange, which remains a US-Iran chain; Israeli forces ran separate operations Monday in Gaza and in Syria's Quneitra governorate. On Larak's own casualties the desk will not overreach: The New Arab reports at least two killed and several wounded citing unnamed Iranian state media, and a lower-tier aggregator goes to three dead with two names attached, which is single-sourced and is not published here as fact.",

rd rather than inferred — spokesman Yurii Ihnat on reports like “28/0” being used to argue nothing was intercepted, and the Institute of Mass Information's Oksana Romaniuk warning that “when some communication disappears, the vacuum can be filled with suspicions and rumors.” Presidential adviser Serhii Beskrestnov, on supermarket shelves stripped by warehouse strikes: “Ukraine will not go hungry.” The ISW assessment for August 30 has now appeared, at Kyiv Post ID 83460, one day later than its own date and exactly as the ID band predicted: roughly two square kilometres cleared near Kupyansk, advances east of Novoselivka and north-west of Lyman, no Russian advances in eight named directions between the 29th and 30th, two Iskander-M ballistic missiles and 130 drones launched with 125 intercepted, and a Sberbank figure worth keeping — Russian marketplace consumer spending down fifteen per cent in recent weeks with marketplace profitability down from about fifteen per cent to about five. The August 31 assessment had not appeared anywhere as of this morning. And the Mediazona and BBC Russian Service count has ticked to 242,750 Russian military dead verified by name as of August 28, with officers unchanged at 7,596 and fifteen generals.",

      { t: "Bishkek produced an actual declaration, and one of the figures this desk carried yesterday turns out to be a year old. The Shanghai Cooperation Organisation summit signed the Bishkek Declaration marking the bloc's twenty-fifth anniversary along with twenty-seven further agreements, among them a regulation establishing a Universal Center for Countering Challenges and Threats to the Security of SCO Member States, a 2026 to 2030 port and logistics action plan, a declaration on nuclear and physical security cooperation, an energy-systems partnership statement, and a Green Technology Corridor programme. The Putin-Xi bilateral produced rhetoric and a travel pledge rather than a pipeline. Putin: “Today, amid a complex geopolitical environment, the comprehensive partnership and strategic cooperation between Russia and China serve as a role model of a relation between two countries,” and “we are ready to work together to make the visa-free regime permanent if the Chinese side considers this possible and useful,” with tourism between the two countries up forty-three per cent in the first half of the year. Xi: “I believe, under our strategic guidance and joint efforts, foundation of China-Russia relations will be more solid, our pace will be synchronised and prospects will be brighter.” No Power of Siberia 2 outcome, price or signing appears in any readout of the meeting. Now the correction, and it is this desk's own. Yesterday's brief reported a $25bn Rosatom nuclear-plant agreement with Iran as being carried into the Putin-Pezeshkian meeting. Every source for that figure is dated September 26, 2025 — it is a real deal from a year ago, and no 2026 reporting attaches it to Bishkek. The desk repeated a twelve-month-old number as a pending item and should not have. The Putin-Pezeshkian meeting is itself scheduled for today rather than yesterday, per Iranian state media, and Ushakov offered no agenda; no outcome exists yet. On the American channel, no sixth account of 828. A release number moving is not an Iran action. From the benches, three breaks in a long silence and one confirmed quiet. Larry Johnson published twice more at Sonar21 — “We Own It: The Wall of Steel Springs Another Leak at Larak in the Strait of Hormuz” on Sunday and a Black Sea ports piece on Monday. Jeffrey Sachs, whom this desk had logged as a verified negative for seven consecutive days, posted “NATO's New Plans To Destroy Russia” on Saturday; the title is Russia-framed rather than Iran-framed and the desk has not watched the video, so it makes no claim about its contents. Responsible Statecraft, also logged as nothing-after-August-28, ran Trita Parsi on Sunday arguing the new strikes may restart the war Trump wants to freeze. Diesen and Mearsheimer are genuine negatives, each checked at article-page level. Two plumbing notes worth keeping: responsiblestatecraft.org/tag/iran/ does carry working per-article permalinks where the /latest/ index does not, which solves a standing problem, and its “Trump appears poised to restart the Iran war” piece ranks high on current queries but is dated May 18.",

sus-narrative split this desk flags daily, trivial today but present, and both are printed. On the Fed, the arc through Monday is more informative than any single reading. CME FedWatch had the September hike at 58 per cent just before seven in the morning; 60.4 per cent shortly after, against roughly 35 per cent before Warsh's Friday speech; 62 per cent later in the session, against roughly 40 per cent a week ago; and above 65 per cent by the close. A Forbes headline puts it at 66 per cent but the body is unreadable to an automated reader, so that one is carried as a headline claim rather than a verified reading, exactly as the $40 trillion debt figure is. No fresh Tuesday reading can exist before the session opens. The live question at this Fed remains a hike, and the July meeting held at 3.50 to 3.75 per cent on a nine-to-three vote with all three dissents hawkish.",

      { t: "The drug-pricing deals landed at ten past five last night, and the most interesting thing about the list is who is not on it. Nine companies signed most-favoured-nation agreements with the administration: Alcon, Astellas Pharma, BeOne Medicines, BridgeBio, CSL, Kyowa Kirin, Sun Pharma, Teva Pharmaceuticals and UCB. That takes the programme to twenty-six drugmakers, which independently confirms seventeen as the correct prior count and settles the sixteen-versus-seventeen question in KFF's favour. The drugs covered run to haemophilia, Parkinson's, macular degeneration, glaucoma, liver disease, skin conditions and several cancers, priced for Medicaid against the same eight-country basket — Canada, Denmark, France, Germany, Italy, Japan, Switzerland and the United Kingdom. Whether the benchmark is net or list price is not stated in any of today's coverage and this desk does not assume it. What is now confirmed is the payment. The inducement is Section 232 pharmaceutical tariff relief in exchange for domestic manufacturing commitments, and UCB and BeOne both cited tariff immunity in their own statements; the collective manufacturing pledge is $19.6bn, alongside active-ingredient donations to the strategic reserve running to 163 tons of levetiracetam from UCB, 71.4 tons of clindamycin and 6.75 of doxycycline from Sun, 45 tons of metronidazole and 4.8 of amlodipine from Teva, and 25 kilograms of tacrolimus from Astellas. A Medicare pilot exemption is not confirmed for this round; the two live proposals the mid-size firms have lobbied against, GLOBE and GUARD, were submitted to CMS in February and drew critical comments from Brookings in March, and no source today says these nine got an exemption from them. Diego Sacristan of CSL: the agreements “provide a sustainable and stable access framework to important medicines for people living with rare diseases and serious conditions.” Two things a health economist should notice. First, the savings figures — $64.3bn to government over ten years, $529bn including commercial spillover — were not re-certified against these nine companies; they come from the White House's original methodology paper of May 6 and are a static projection being presented alongside a live announcement. Second, and this is the real finding: not one of the nine is a named member of the Midsized Biotech Alliance of America, the group that has organised against exactly this instrument. The signatories are disproportionately multinationals with production and revenue outside the United States — India, Israel, Japan twice, Australia, Belgium, Switzerland — plus BridgeBio. For firms like those, trading tariff exposure for Medicaid concessions is a cheaper swap than it is for the Alliance's American, rare-disease, high-list-price members, who have again stayed out and have said nothing about being passed over. One correction: the Alliance is reported at eleven companies rather than ten. And whatever is claimed for these deals should still be read against the enforcement record KFF published on Friday — prior authorisation down eleven per cent against an eighty per cent pledge, seven of twenty-seven food-dye commitments met with the deadline moved to 2027, no public compliance dashboards, and one physician in three believing voluntary pledges make a meaningful difference.",
        s: [["FiercePharma (nine mid-sized drugmakers sign; the tariff-relief mechanism)","https://www.fiercepharma.com/pharma/white-house-unveils-next-round-mfn-pricing-deals-9-midsized-drugmakers"],["Pharmaceutical Commerce (the programme reaches 26 drugmakers)","https://www.pharmaceuticalcommerce.com/view/mfn-program-nine-drugmakers-manufacturing-investment"],["KFF Health News (Armour: the health-industry deals have not been enforced)","https://kffhealthnews.org/health-industry/trump-kennedy-food-dyes-price-deals-unenforced-vanishing/"],["Brookings (comments on the GLOBE and GUARD drug-pricing models)","https://www.brookings.edu/articles/comments-on-globe-and-guard-drug-pricing-models/"]] },
      { t: "One docket moved a lot, the other moved a little, the rural reports stayed invisible, and a thread this desk has chased for a week is now retired. Take the dockets, and take the timestamp discipline seriously because it is what makes them readable. The H-1B fee docket is at 5,079 comments, cleanly stamped as of four fifteen yesterday afternoon — up 265 from Saturday lunchtime's 4,814. The vaccine request for information is at 1,635. That is a genuine movement from the 1,500 the desk saw twice, since a stale render would still read exactly 1,500 — but honesty requires a caveat the H-1B page does not need: the Federal Register page for the vaccine RFI exposes no comment-specific timestamp at all, only a page-views figure stamped yesterday morning, so the count is fresh but its own vintage is not stated. The finding is nevertheless clear. A rise of 135 against the weekend's 780 means the spike is over and the docket has settled into ordinary weekday accretion. And the asymmetry that has been the real story all along held for a seventh day: the American Medical Association's own vaccine-access page was last updated on July 30 and makes no mention of docket HHS-OS-2026-0332 or of submitting comments to it. The AMA is fighting this in court and in press statements, not in the comment file. On the rural health reports, silence, and now with a structural explanation attached. No state has published its annual report under the $50bn Rural Health Transformation Program, and there is no new CMS statement beyond spokesperson Timothy Foster's line that CMS will publish an annual summary and will share individual state reports only on request. The desk also checked the one outside tracker that might have filled the gap and found it tracks a different, earlier deadline — initial applications due last November, last updated in January — so there is not even unofficial public infrastructure for these submissions. Set that beside the Bipartisan Policy Center's point that CMS's own template requires disaggregated reporting by initiative, evidentiary documentation and quantitative metrics, and the shape of it is clear: the information exists in full and simply is not public. Mississippi state senator Hob Bryan: “I just don't believe in all this secrecy. If they're not up to something nefarious, why do they have to do it all in secret?” STAT's Unraveled series has still not produced part three. The CDC measles page is unchanged and still stamped as of August 27 — 2,903 confirmed, 37 outbreaks, 94 per cent outbreak-associated — and the kindergarten MMR line rendered again with a figure worth carrying: the fall from 95.2 to 92.4 per cent leaves roughly 280,000 kindergartners potentially vulnerable. The state table and hospitalisation rate failed to render for a seventh consecutive run. Two threads close today. Merck v. Kennedy has now survived seven searches unidentified and is retired; the ~October 23 appeal window stays unverified and should not be repeated. And on Ebola, the World Health Organization's own outbreak page is dated as of July 30 — 3,605 cases, 1,587 deaths, a 44 per cent case fatality rate — which is a full month staler than the ECDC's four-day lag. Two authoritative trackers on the same outbreak, a month apart on what they call current, is itself the datapoint.",
        s: [["Federal Register (H-1B fee docket: 5,079 comments, stamped Aug 31 4:15pm)","https://www.federalregister.gov/documents/2026/08/25/2026-17324/fee-for-certain-h-1b-petitions"],["Federal Register (vaccine RFI: 1,635 comments, no comment-specific stamp)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["KFF Health News (rural health reports due, publication optional)","https://kffhealthnews.org/rural-health/rural-health-transformation-program-transparency-50-billion-dollars-state-tracking/"],["CDC (measles: 2,903 as of Aug 27; MMR kindergarten coverage)","https://www.cdc.gov/measles/data-research/index.html"]] }
    ]},
    { h: "Campus & culture", items: [
      { t: "Michigan: the Supreme Court has done nothing at all, a new deadline surfaced, and two false claims were caught before they reached this page. On the ballot question, the finding is the absence. As of yesterday the Michigan Supreme Court had taken no action on the citizen-voting campaign's mandamus complaint — not even to request a response from the respondents — and nothing had issued as of five this morning. The campaign asked for a ruling by September 1, with a fallback request that the court simply place the measure on the ballot now and litigate the procedure later; that request has not been granted or refused. Organisers had until tomorrow to appeal and the court has until September 19 to decide, and a checkpoint the desk had not previously recorded now sits between them: the Board of State Canvassers is scheduled to meet at ten in the morning on Friday September 4 to finalise the ballot. How that meeting relates to the September 19 military and absentee certification deadline is not stated in any source and is not stated here. The disputed filing date has moved two-to-one toward Thursday August 27, with the campaign's own outlet and an election-law academic both giving that date against the public radio stations' August 28; the desk still flags rather than picks. Two claims were rejected today rather than published, and both are worth naming because they are the same failure mode. An automated read of an election-law post asserted an emergency request to Justice Kavanaugh seeking an injunction by September 3; a dedicated verification search found zero corroboration anywhere, in any outlet or docket, and it is discarded. And a second automated read of the Michigan Advance story on the Ann Arbor public-power case asserted flatly that an appeal has been filed — the same claim, from the same story, that this desk wrongly published as confirmed on Sunday. It is still not true. Ann Arbor for Public Power's own site records no filing, and the DTE-funded coalition's most recent position remains spokesman Rudy Harper's August 26 line that the group is “reviewing the decision and expect to appeal.” Venue of the dismissal is Washtenaw County Trial Court before Judge Patrick Conlin, on summary disposition; the appellate venue is still stated nowhere. In Ypsilanti Township the invented Los Alamos string on Resolution 2026-05 reproduced for a third consecutive run — though with a nuance the desk should record, since Planet Detroit did run a real April headline about the township escalating its fight against the University of Michigan and Los Alamos, so this may be stale reporting bleeding into fetch summaries rather than pure invention. Either way, go by the filename. Resolution 2025-23 failed to appear for a second consecutive fetch, still a discrepancy and still not a confirmed removal, and DTE has now said nothing for a fortnight. Today's two events are both after this brief. The University of Michigan regents meet at eleven to vote formally on C. Cybele Raver as seventeenth president, with Domenico Grasso staying through November 30; board chair Michael Behm calls her record one “of building strong teams, expanding research excellence, and strengthening every institution she has served,” and Raver calls it “an extraordinary honor… at this pivotal moment in higher education.” No opposition, no faculty-senate statement and no schedule change surfaced. And the second Renaissance Center community-benefits meeting is at six tonight, electing two of nine Neighborhood Advisory Council seats by resident vote — nominees must live in the impact area, be eighteen or over and have no conflicts with the development team or the city — with the remaining meetings running Tuesday evenings through October 27.",
        s: [["Election Law Blog (the Michigan Supreme Court has taken no action; the Sept 4 canvassers meeting)","https://electionlawblog.org/2026/michigan-ballot-measure-proponents-seek-supreme-court-emergency-review-of-state-decision-to-keep-voting-measure-off-the-michigan-ballot/"],["Ann Arbor for Public Power (no appeal filing recorded; newest post Aug 26)","https://annarborpublicpower.org/"],["U-M Regents (the special meeting to vote on C. Cybele Raver, Sept 1 at 11 a.m.)","https://regents.umich.edu/governance/announcements/u-m-board-of-regents-names-dr-c-cybele-raver-as-choice-for-17th-president/"],["BridgeDetroit (the RenCen benefits process and the council seats)","https://www.bridgedetroit.com/residents-challenge-timeline-vision-at-first-renaissance-center-benefits-meeting/"]] },
      { t: "The curricular-practical-training suspensions are at eight universities, they are no longer a California story, and the memo behind them finally has a name and a date. This is the run's biggest higher-education finding and it corrects the desk twice over. Boston University's international office announced on August 28 that it is pausing certain CPT approvals “to review institutional practices,” while continuing to approve CPT “for requests that are clearly required for program completion.” The University of Rochester's provost said the same thing on the same day: pausing approval of new CPT applications except where the training is required to complete a degree. Both are East Coast privates, which breaks the University of California pattern this desk built a system-posture reading on. More valuable still, Boston University names the underlying documents that everyone else has only alluded to: two Student and Exchange Visitor Program broadcast messages, one dated August 12, 2026, titled “Reminder of Liability for DSOs Regarding CPT Authorization,” and one dated August 24 titled “Guidance for Designated School Officials regarding Curricular Practical Training.” That August 12 date is the first third-party corroboration UC San Diego's account has ever had — UCSD said it was made aware of an SEVP policy update on precisely that day — and it converts a single unverified university web page into a documented sequence. The new language is uniform across the announcements: CPT must be essential to degree completion and directly related to the student's major, and should not be authorised solely for employment purposes. So the running count is Berkeley, Irvine, Davis, San Diego, USC, Washington, Boston University and Rochester, with UCSD's pause on all F-1 CPT still the broadest. Whether it remains in force could not be re-verified today and is not asserted. NAFSA's silence held under a fresh search: nothing on the 2026 suspension wave, only longstanding regulatory background. The other two Monday deadlines produced less. Not one of the thirty universities ordered to audit their foreign partnerships has said anything, and the deadline has now passed; a news outlet that contacted all thirty on August 17 logged zero responses then and there have been none since. In NAFSA v. DHS, no source confirms the government actually filed its response, and a real conflict has opened on the hearing date: the Presidents' Alliance, reflecting Judge Saylor's August 19 scheduling order, gives Thursday September 3 at eleven in Courtroom 1, while a piece published yesterday gives September 9 at the same hour in the same courtroom, and one tracker hedges to “early September” and explicitly advises confirming against the docket rather than a secondary report. This desk therefore prints no firm date. Worth having on the record from the department's side, near the suit's filing: the suit is “performative outrage,” and “where was the outrage when foreign nationals were abusing the system, violating the terms of their student visas, and making a mockery of our immigration laws?” On teaching, a date correction the desk owes — the Chronicle's University of Chicago tech-ban piece is August 24, not the 25th, which matters only because it is the sort of small slip that compounds — and a genuinely useful find that predates the window but is the most mechanically specific pedagogy item available: Arpita Ghosh, an economics lecturer at Exeter, on tech-free teaching, with sessions of about twenty-five, a four-phase structure moving from icebreaker to whole-group debate to breakout groups of three or four to facilitator synthesis, prompts distributed five to seven days ahead, and reported outcomes of 96 per cent satisfaction and 87 per cent feeling prepared. Still no second institution has followed Chicago. The Hechinger Report was checked for the first time in days and carries nothing on classroom mechanics in the window.",
        s: [["Boston University ISSO (CPT pause; the Aug 12 and Aug 24 SEVP broadcasts named)","https://www.bu.edu/isso/"],["Inside Higher Ed (the suit seeking to vacate the duration-of-status rule)","https://www.insidehighered.com/news/global/international-students-us/2026/08/19/lawsuit-seeks-vacate-rule-ending-duration-status"],["Presidents' Alliance (NAFSA v. DHS: the scheduling order and hearing)","https://www.presidentsalliance.org/duration-of-status-litigation/"],["THE Campus (Arpita Ghosh, Exeter: tech-free teaching, with the mechanics)","https://www.timeshighereducation.com/campus/techfree-teaching-how-get-it-right"]] },
      { t: "Mind and cosmos: two real experiments this run, a half-solved citation, and a psychedelics paper that argues against the field's favourite explanation. Take the human study first, because it is the best thing on the beat today and it cuts against the grain. In the Journal of Psychopharmacology on Sunday, Bostoen, Krediet, van Schagen, van der Wee and Giltay of ARQ Centrum '45 and Leiden University Medical Center report on fifty-three patients with chronic treatment-resistant PTSD given MDMA-assisted therapy against an active placebo. The mystical-experience score was 63.1 out of 150 for MDMA against 24.7 for placebo, and 23 per cent of the MDMA group met the criteria for a complete mystical experience; PTSD severity on a 136-point scale fell by about thirty-six points against about fifteen. But the finding is what predicted improvement: not mystical experience overall, but the positive-mood subscale — joy, peace, love. In the authors' words, the therapy “may be less about transcending the self, and more about creating an emotionally open and positive state in which people with PTSD may be able to relate to themselves, others, and traumatic memories differently.” For a field that has leaned hard on ego dissolution as its mechanism, that is a real challenge from inside a positive trial. On physics, and saying which is which as this desk does every run: the tranche has two experiments. Physical Review Letters volume 137 issue nine, which the desk has now checked four runs running and found theory-only each time, picked up an experimental paper yesterday — a photonic-platform demonstration certifying genuine multipartite entanglement of W, Dicke and cluster states using minimal-size correlation measurements. Author list and institution were not confirmed and are not invented. That the issue keeps accreting papers after appearing closed is itself the plumbing lesson. And the Munich nuclear-spin-qubit paper this desk flagged Saturday as missing its own citation is half-resolved: the preprint is arXiv 2603.01987, submitted March 2, with the full author list Alexander Ulanowski, Johannes Früh, Fabian Salamon, Adrian Holzäpfel and Andreas Reiserer, confirming erbium-167 in yttrium orthosilicate in a cryogenic Fabry-Pérot cavity, 91 per cent single-shot readout fidelity with a two-point uncertainty, coherence beyond 0.2 seconds, telecom C-band and frequency-multiplexed, positioned as a quantum-network node. The published Nature Communications DOI still could not be pinned after four attempts, and the authors' stated limitations are still not captured; the desk will keep trying rather than paper over it. Everything else on the quantum side is an announcement and is labelled as one: Diraq will put an eight-qubit silicon CMOS spin-qubit machine inside an Equinix data centre in Sydney under twenty kilowatts in a standard rack, targeting October, with chief executive Andrew Dzurak saying quantum computers “are about to become as essential to data centers and computing infrastructure as data servers, CPUs and GPUs” — a deployment plan, not a measurement. Pasqal's second session is now reportable, and the debut pop gave a good deal back: it closed Monday at $17.30, down 9.47 per cent from the $19.11 debut close, on about two million shares for a market capitalisation near $497m, still well above the SPAC's $9.79. Its ticker is PSQL, not PSQH as this desk had it. On the contemplative shelf, Essentia ran Orlando Moreira on Camus, arguing that “care for the other does not begin in defiance or condescension, but in allowing the other to be insufficient just as we ourselves are,” and is then quiet until the fifth. Buddhistdoor has advanced twice, to a piece today on Shin Buddhism in Hawaii facing declining membership and temple closures. Nautilus is genuinely quiet past Anand Kumar's DSM piece, confirmed by two independent fetches rather than assumed. Lion's Roar needs a two-sided report: the routing failure that returned an online-gaming page twice on Sunday is resolved and the site serves real content again, but its feed remained unreachable on provenance grounds, so nothing fresh was retrieved and nothing is claimed. Tricycle's dated index was likewise unreachable today, though the magazine archive surfaced Taylor Plimpton's tenth dog essay dated yesterday.",
        s: [["PsyPost (Bostoen et al.: mystical experience does not explain MDMA-assisted therapy for PTSD)","https://www.psypost.org/mystical-experiences-dont-explain-the-success-of-mdma-assisted-therapy-for-ptsd/"],["arXiv (Ulanowski, Früh, Salamon, Holzäpfel and Reiserer, 2603.01987)","https://arxiv.org/abs/2603.01987"],["The Quantum Insider (Diraq to deploy inside an Equinix data centre)","https://thequantuminsider.com/2026/08/31/diraq-to-deploy-a-quantum-computer-inside-an-equinix-data-center/"],["PsyPost (Bysiek et al.: psilocybin in chronically stressed rats)","https://www.psypost.org/psilocybin-reverses-depressive-behaviors-and-restores-brain-cell-growth-in-stres/"]] },
      { t: "Wendell Berry has died, the Smithsonian question resolved itself in the direction this desk suspected, and a ticket page for a cancelled Lynch weekend is still taking money on day ten. Berry first. The Kentucky poet, novelist, essayist and farmer died at home in Port Royal on Sunday at ninety-two — National Humanities Medal in 2010, a Guggenheim in 1961, and two long spells teaching English at the University of Kentucky. Six outlets carry it, so it clears the desk's two-outlet rule several times over; no cause of death is stated anywhere and funeral arrangements were incomplete at publication. He is survived by his daughter Mary Berry. One line of his, since it is the sort a man of ninety-two gets quoted on: “Beware the machinery of longevity. When a man's life is over the decent thing is for him to die.” Two of this desk's nine agents found him independently, which is the standing deaths instruction doing exactly what it was added to do. Now the Smithsonian, and this is a clean resolution of a disagreement the desk has been publishing unadjudicated for a week. At Monday's meeting the Board of Regents approved converting the Arts and Industries Building into the permanent home of the National Museum of the American Latino, bypassing congressional approval. Director Jorge Zamanillo: “Today marks a major milestone in a dream and effort of decades in the making.” Former interim director Eduardo Díaz, on the long argument about the building: “There were people saying, ‘We don't want a hand-me-down.'” Secretary Lonnie G. Bunch III was preparing a response to White House criticism for the board's executive committee. Two caveats belong with it. The reporting is the Washington Post's, read through an aggregator because the Post itself is unreadable to an automated fetch, and the Smithsonian's own actions log has not been updated past June 8, so the institution has not yet recorded its own decision. And crucially, the piece does not mention the American Women's History Museum at all — a targeted search for a decision on it found nothing anywhere. So the desk's four-way disagreement splits cleanly in two: resolved for the Latino museum, and genuinely unresolved rather than merely unreported for the women's history museum. The Hyperallergic line the desk cited for a week was always about the former. On the directors, September opened with silence in three places and one small find. Lars von Trier's August screenplay window expired with nothing — no confirmation, no denial, no Danish Film Institute disbursement — and the two pieces that surface on September queries are both stale, a March speculation piece and a November 2025 producer interview. Refn still has no cast for Maniac Cop, though Vincent Maraval's line is worth having alongside Efe Cakarel's: “This is not nostalgia. It is a new nightmare.” One caution: a fetch summary attached a 2027 release date to the film, which conflicts with the January 2027 shoot and is almost certainly a conflation; it is not published as fact. Criterion's Coming Soon page holds at twenty-two titles and still stops at The Right Stuff on November 24, with no December slate. Noé remains a plain negative on a twelfth check. And the Lynch weekender reaches day ten unchanged: the homepage still says the 2026 gathering has been postponed to 2027 with dates to be announced, the orphaned tickets page is still selling at £99.50 a day, £180 the weekend and £310 for VIP with a live checkout button, and the checkout behind it still returns 404. One new detail, not previously recorded here: the original dates were September 26 and 27 at the Genesis Cinema in London — three and a half weeks from now, for an event that is not happening, still on sale. On Kusama, still no memorial date, and both her museum's site and her estate's remain unreadable; her gallerist of thirty years, Hidenori Ota, speaks of “a memorial gathering to be announced later.” No arrest in the Vienna theft, no word from Kehinde Wiley in a second week. And the deaths check produced leads it will not publish as facts: the French composer Michel Fano, corroborated only at a single specialist outlet beyond the aggregator, and single-sourced entries for the Hungarian writer Péter Nádas, the Argentine musician Miguel Zavaleta, the jazz guitarist Gene Bertoncini and others. Also flagged, outside this beat and single-sourced: the Nobel chemistry laureate Ada Yonath.",
        s: [["Kentucky Lantern (Wendell Berry, 1934-2026)","https://kentuckylantern.com/2026/08/31/kentucky-writer-farmer-and-advocate-wendell-berry-dies-at-92/"],["Louisville Public Media (Berry, famed poet and novelist, dies at 92)","https://www.lpm.org/news/2026-08-31/kentuckys-wendell-berry-famed-poet-and-novelist-dies-at-age-92"],["Hyperallergic (the Aug 24 “vote” piece — about the LATINO museum, now confirmed)","https://hyperallergic.com/amid-trumps-threats-a-potential-home-for-smithsonian-latino-museum/"],["A Gathering of the Angels (the orphaned tickets page, still selling on day ten)","https://www.gatheringoftheangels.com/tickets"]] }
    ]}

  hooks: [
    { story: "At ten past five last night the administration announced its second round of most-favoured-nation drug-pricing agreements. Nine companies signed: Alcon, Astellas, BeOne Medicines, BridgeBio, CSL, Kyowa Kirin, Sun Pharma, Teva and UCB. They agree to price a list of drugs — haemophilia, Parkinson's, macular degeneration, glaucoma, liver disease, several cancers — for state Medicaid programmes against a basket of eight rich countries. In exchange they receive Section 232 pharmaceutical tariff relief, and UCB and BeOne both said so in their own statements. The collective manufacturing commitment is $19.6bn, plus donations of active ingredient to the strategic reserve measured in tons. That takes the programme from seventeen firms to twenty-six. Now the part that makes this a class rather than a press release. For months the organised opposition to this instrument has been the Midsized Biotech Alliance of America — eleven companies including Alkermes, Alnylam, BioMarin, Incyte, Madrigal and Travere. Not one of them signed. The nine who did are, with one exception, multinationals with substantial production and revenue outside the United States: India, Israel, Japan twice, Australia, Belgium, Switzerland. The Alliance's members are American, concentrated in rare disease, and dependent on high list prices in a single market.",
      src: ["FiercePharma","https://www.fiercepharma.com/pharma/white-house-unveils-next-round-mfn-pricing-deals-9-midsized-drugmakers"],
      concept: "Self-selection into a voluntary programme — and what it means when the price is paid in forbearance",
      q: "Put two lists on the board and nothing else: the nine who signed, the eleven who did not. Ask the room what distinguishes them. Somebody will reach for cooperativeness or political alignment; do not let that stand, because it explains nothing and predicts nothing. Push for something structural. Eventually someone will notice the nationalities. Then ask the sharp version: what is each firm actually being offered, and what is each firm actually being asked to give up? Both sides of that trade differ across the two lists, and that is the whole answer. Work the offer side first. The inducement is relief from Section 232 tariffs on pharmaceuticals. Ask who values tariff relief. A firm that manufactures in Belgium or Hyderabad or Osaka and sells into the United States faces a real, immediate, quantifiable tariff bill; a firm that already manufactures in New Jersey faces none. So the same offer is worth a great deal to one list and almost nothing to the other. Have them state it precisely: a uniform inducement produces non-uniform participation whenever the inducement's value varies with a firm characteristic, and the participants will be exactly those for whom it is worth most. Now work the concession side, which is harder and more interesting. Ask what a Medicaid MFN price costs a firm. Push past 'lower revenue' — make them ask lower relative to what. For a drug with a large commercial market and a modest Medicaid share, the concession is a rounding error. For an ultra-rare-disease drug priced at several hundred thousand dollars a year, where Medicaid may be a substantial share of the patient population and where the international reference price was set in a country with a very different willingness to pay, the concession bites the core of the business model. So the cost also varies systematically across the two lists — and in the opposite direction from the benefit. Have them put the two together and predict who signs. They will get it, and they should notice they could have predicted the list without knowing a single company's politics. That is what a selection model buys you. Now make them do the welfare question, because the room will want to declare this a success and it is more complicated. Ask what the programme has achieved if the firms who sign are precisely the firms for whom compliance is cheapest. Let them work out that the observed price reductions are real but are drawn from the least-binding part of the distribution — which means the announced savings are not an unbiased estimate of what the same policy would deliver if applied to everyone. This is adverse selection wearing a policy costume: the participants are self-selected on exactly the characteristic that determines the programme's cost to them, so the sample is not the population. Ask how you would even estimate the counterfactual. It is genuinely hard, and that difficulty is the point. Then get to the thing a health economist should not let pass. Ask them to name the currency. It is not cash. The government is paying with tariff relief — that is, by not doing something it otherwise would have done. Ask where forbearance appears in the projected $64.3bn of ten-year government savings. It does not, because forgone future policy has no line in a budget score. So the announced saving is a gross figure with the price left out, and the price is paid by whoever would have benefited from the tariff, which is a different group from whoever benefits from the drug price. Have them articulate that a transfer has occurred between two constituencies who never appear in the same table. Close on the number itself, because they should learn to interrogate figures that are handed to them. The $64.3bn and $529bn come from a methodology paper published in May and were not recalculated for last night's nine companies — a static projection presented beside a live announcement. Ask what would have to be true for the old estimate to still apply to a new and self-selected group of signatories. Almost nothing that is true here. And then ask them what they would want to see published to check it: the drugs, the volumes, the baseline net prices, and the reference prices actually used. None of that is public, which is precisely the finding KFF documented on Friday about the first seventeen deals — no compliance dashboards, quietly moved deadlines, and a prior-authorisation pledge that delivered eleven per cent against a promised eighty."},
    { story: "The Strait of Hormuz is not closed. No government has declared it shut, no blockade has been announced, and both sides insist the opposite of each other — the IRGC Navy calls American statements that the strait is open “an obvious lie,” while CENTCOM says it is escorting traffic through. Iran and Oman agreed a temporary corridor seven miles wide, with entry and part of the exit through Iranian territorial waters. It has now stood open, on paper, for a seventh day, and not one vessel has used it. The reason offered by the shipping trackers is not political. It is a price: war-risk insurance for the passage is quoted at roughly forty times normal rates, which makes the voyage economically unfeasible. Meanwhile nobody can say how much oil is actually moving. Three figures are in circulation for the same waterway in the same week — the Energy Secretary at about nine million barrels a day through the strait and fifteen million across the Gulf including pipelines; GlobalSecurity at six to eight million against twenty million before the war; and Barclays, cited on the very page that carries the Secretary's number, at about three million for the week ending August 7. A factor of three, on the single most-watched chokepoint in the world economy. And yesterday American forces struck rocket launchers on Larak Island to stop mines being loaded, Iran hit bases in Jordan and the UAE in reply, and Brent went to about $91.7.",
      src: ["straits.live","https://straits.live/"],
      concept: "A market closed by a price rather than a rule — and why the insurance premium is the real policy instrument",
      q: "Open with the puzzle stated flatly: the strait is legally open, physically navigable, militarily escorted, and empty. Ask the room how that is possible. They will reach first for fear, and fear is not an economic answer — push them to say what fear does to a decision. Someone will get to cost. Then give them the number: insurance at forty times normal. Ask what that does to a voyage's economics. Have them do it roughly out loud — if the risk premium on a single transit swamps the charter rate and the cargo margin, the expected profit goes negative and no rational operator sails, whatever the law says and whatever a navy promises. Now make them state the general result, because it generalises far beyond shipping: a prohibitive price and a prohibition produce the same observed quantity, and you cannot tell them apart from the quantity alone. That is worth writing down. Ask them where else they have seen it — a tax set high enough to end an activity, a compliance cost that closes a small firm, a permit fee that functions as a ban. Then ask which of the two a policymaker should prefer, and let them argue. The honest case for the price version is that it lets the transaction happen when the value is high enough, so it preserves the margin; the case against is that it allocates by wealth rather than by need, and that nobody voted for it. Now go after the insurer, because that is the actor students never think about and it is the one setting policy here. Ask who chose forty times. Not a government, not a navy, not the shippers. An underwriter, who is solving a private problem: pricing a tail risk on a hull worth tens of millions with a small and rapidly changing sample of incidents. Ask what happens to that price when the underlying probability is unknowable rather than merely uncertain — when there is no stable base rate because the situation is a week old. Push them to the answer: with genuine ambiguity rather than measurable risk, a loss-averse insurer prices toward the pessimistic end of the range, and the premium therefore reflects the width of the uncertainty as much as its centre. So the quiet mechanism closing the strait is not Iranian policy or American policy, it is the variance of everyone's beliefs about them. That is a much better sentence than anything they will read in a newspaper. Then use the three throughput numbers, and do not rush this part. Ask them which is right. The correct answer is that they should not pick, and you should make them defend not picking. Then ask why three sophisticated observers disagree by a factor of three about a physical quantity. Walk it through: some vessels have transponders off, so the measured count is a lower bound of unknown size; some estimates include pipelines that bypass the strait entirely, so they are measuring a different object; and some are weekly averages against others' daily snapshots over a period when the daily number is enormously volatile. Have them name the three separate problems — measurement error, definitional mismatch, and aggregation over a non-stationary series — and notice that only the first is what people usually mean by a number being wrong. Now the payoff question, and the one worth taking home. Ask what the price of Brent knows about all this. Yesterday it moved on a strike that destroyed no oil, no terminal and no tanker — two rocket launchers. Ask what changed. Not the flow, but the distribution of beliefs about future flow, and specifically its upper tail. Have them get to inventories as the mechanism: if closure becomes likelier, a barrel held today is worth more, so demand for storage rises now, and expectations about the future show up in a present price. Then close by putting the two halves against each other. The insurance premium and the oil price are both prices of the same underlying risk, set by different people in different markets on different information. Ask what it means that one of them has shut the strait and the other has moved less than two per cent. The answer is that they are pricing different exposures — a total loss of a specific hull versus a marginal change in global supply — and a student who can say that cleanly understands more about risk pricing than the phrase 'the market is worried' will ever teach them."},
    { story: "Eight American universities have now suspended or paused curricular practical training for international students: Berkeley, UC Irvine, UC Davis, UC San Diego, USC, Washington, Boston University and Rochester. Until yesterday this looked like a University of California story; Boston University and Rochester, both announcing on August 28, make it national. More usefully, Boston University names the documents everyone else had only gestured at. Two Student and Exchange Visitor Program broadcast messages: one dated August 12, headed “Reminder of Liability for DSOs Regarding CPT Authorization,” and one dated August 24, “Guidance for Designated School Officials regarding Curricular Practical Training.” No rule was changed. No regulation was published in the Federal Register. No comment period opened. Two advisory messages went out to designated school officials — the individual university staff who personally sign CPT authorisations — and within a fortnight eight institutions independently arrived at almost identical language: CPT will be approved where it is strictly required for degree completion, and paused everywhere else. Boston University's own phrasing is that it is pausing “to review institutional practices.” This lands on a market already contracting: new F-1 degree visas fell 33.4 per cent last year, Indian issuance by 56.6 per cent.",
      src: ["Inside Higher Ed","https://www.insidehighered.com/news/global/international-students-us/2026/08/19/lawsuit-seeks-vacate-rule-ending-duration-status"],
      concept: "Where liability sits determines how cautious a gatekeeper is — and an ambiguous signal produces a corner solution",
      q: "Start by getting the facts of the mechanism straight, because the class will misread this as new regulation and it is not. Ask what legally changed. Nothing. Then ask what changed. A memo reminded a particular class of person that they are personally liable. Ask who that person is. A designated school official — a university employee, usually in an international-students office, who signs the form. Now ask the question that unlocks everything: whose money is at risk when that person signs, and whose career is at risk? Not the same person's. That gap is the whole model. Build the gatekeeper properly. Put the DSO's decision on the board as a choice under uncertainty: approve a borderline CPT request, or decline it. Ask them to write down the payoffs. If she approves and the authorisation later proves improper, she bears a personal sanction and her institution bears a compliance finding. If she declines, one student loses an internship. Ask who bears that second cost. The student, who is not in the room, cannot appeal, and in many cases cannot lawfully work anywhere else. Have them state the asymmetry precisely: the decision-maker internalises the cost of a false approval and externalises almost the entire cost of a false denial. Then ask what the optimal decision rule looks like for someone facing those payoffs, and let them derive rather than receive it — she should set her approval threshold far above the level that would maximise joint welfare, and the gap between the two thresholds widens with the personal penalty and with the ambiguity of the standard. Now attack the word 'ambiguity', because that is the second lever and students always collapse it into risk. Ask what the memo actually told her. That CPT must be 'essential to degree completion' and 'directly related to the major', and should not be authorised 'solely for employment purposes'. Ask them to apply that to a computer-science master's student taking a summer position at a software firm for elective credit. Genuinely unclear — and, crucially, unclear in a way that no amount of further thought resolves, because the standard's meaning depends on how an unknown future auditor will read it. Have them notice the difference from ordinary risk: she cannot compute a probability, so she cannot equate marginal costs, so she does the thing agents do under ambiguity — she retreats to a corner. Approve only the cases no auditor could possibly question. Now make them predict, and then check the prediction against the evidence in front of them. Ask what a model like this forecasts about how different institutions respond. It forecasts convergence — because they are all solving the same problem with the same payoffs — and it forecasts that convergence without coordination. Then show them that eight universities on two coasts, with no evidence of consulting each other, produced the same rule within a fortnight, and that seven of the eight drew the line in exactly the same place. That is a prediction the room made and the world confirmed, which is a rare thing to be able to do with this week's news. Push the last step: is this policy? Nobody promulgated a rule ending elective CPT. Yet elective CPT has substantially ended at eight major universities. Ask them who made that decision and by what authority, and sit in the discomfort of the answer. Then ask the design question, which is where a good class finishes rather than starts. If you wanted the gatekeeper to make the socially optimal call, what would you change? Push them past 'write clearer rules', which is true but weak. The stronger answers are structural: move the liability from the individual to the institution, or create an appeal that gives the student's loss a voice in the process, or — the cheapest and most powerful — publish a safe harbour, since an ambiguous standard with a bright-line safe harbour produces very different behaviour from an ambiguous standard alone. Ask why an agency might prefer not to publish one. Because the chilling effect is doing work the agency would otherwise have to do by rulemaking, and rulemaking can be challenged in court. Whether they find that efficient or troubling is a fair thing to leave open."}

  pulse: [
    { cat: "Listening", t: "It held. Ella Langley's “Choosin' Texas” has spent twenty weeks at number one — the longest run for a non-holiday single in the history of the Hot 100",
      why: "This desk flagged the record as resolving on the chart dated September 5, published today. It actually broke yesterday, a day earlier than expected, and four outlets carry it. Two framings are both true and worth keeping straight: among non-holiday singles she is now the outright record-holder, having passed the nineteen-week tie with “Old Town Road” and “A Bar Song (Tipsy)”; against all singles she is second, behind only Mariah Carey's “All I Want for Christmas Is You,” whose twenty-two weeks were accumulated across seasons rather than consecutively. A third record came with it: she is the first woman to top the Hot 100, Hot Country Songs and Country Airplay simultaneously. What makes this worth a card rather than a footnote is the contrast with everything else on this page. The Parton catalogue has lost two-thirds of its peak in five days. The most anticipated trailer in the history of gaming held a streaming number one for three days. And one country single has been at the top since spring.",
      rec: "This is the cleanest superstar-economics example currently available, and it has a mechanism your students can explain to you better than a textbook can: playlist and short-video placement is self-reinforcing, so a small early lead compounds into a durable one. Ask them why a market with essentially unlimited choice produces more concentration rather than less. The answer — that when search costs fall to nearly zero, the ranking itself becomes the scarce resource — is one of the most counterintuitive results you will teach all term.",
      src: ["The Music Universe (a twentieth week at No. 1)","https://themusicuniverse.com/ella-langleys-choosin-texas-holds-the-top-spot-for-20th-week/"] },
    { cat: "Listening", t: "The Parton shock kept falling — and the deep cuts are unwinding faster than the hits, which is the interesting part",
      why: "The freshest kworb chart is dated August 30, so the lag has narrowed from three days to two; the desk states the chart date rather than pretending to yesterday's data. Against the August 28 figures: “Jolene” fell from 961,193 to 652,062, down 32.2 per cent over two days, and dropped from third to twelfth. “9 to 5” fell from 957,012 to 622,284, down 35 per cent. “Islands in the Stream” fell 39.6 per cent to 412,678 and slid thirty-two places to forty-ninth. So the daily rate has settled near eighteen per cent for the two big hits rather than continuing to taper — the shock is still actively decaying, not yet flattened. The genuinely new finding is the divergence. The deep cut is decaying at about twenty-two per cent a day against the hits' eighteen, and Ella Langley's return to her own baseline is gentler still at about four. That pattern says the recommendation-driven listening — people pulled into the catalogue by algorithms and by other people's grief — is unwinding faster than the deliberate re-listening to songs the audience already knew. Two Parton tracks remain in the top fifteen, unchanged from the 28th, so chart presence has stabilised even while raw streams keep sliding.",
      rec: "The desk still cannot find a pre-August-25 baseline for these tracks, which means the question it most wants answered — does the floor sit above where it started — is honestly open. That is the assignment. Give students the six daily figures, ask them to fit a decay and forecast Friday, then ask what evidence would distinguish a shock that merely redistributed attention from one that added listeners who did not previously know the catalogue. They will discover they need a number nobody published.",
      src: ["kworb (Spotify US daily, chart dated Aug 30)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Watching", t: "The GTA 6 trailer is down to third on Netflix, five days after the most anticipated promotional release in the medium's history",
      why: "FlixPatrol's worldwide top ten, dated August 31: The Whisper Man at 886 points, The Secret Woman at 710, and the twenty-six-minute Grand Theft Auto VI: An Extended Look third at 686. It peaked at 916 points and number one on the 30th and was dethroned the same day; it has now fallen a further place. Set against what it cost to get there — a bespoke six-hour exclusivity window on Netflix, a worldwide three-minute outage from demand, Netflix web traffic up 125 per cent and mobile up 50 per cent against the average of the previous twelve Thursdays — three days at the top is a very short reign. The useful comparison is that a large film gets about the same. The trailer did not behave like an event; it behaved like a piece of content, and it decayed on content's schedule. Five days on, Take-Two has still said nothing about the terms of the Netflix arrangement, and every quote from Strauss Zelnick this desk can verify predates the premiere.",
      rec: "Put this beside the Parton numbers, since the two have nothing in common except the shape of the curve. Ask a class why almost nothing holds a number-one position any more, and what that implies about the value of buying one. If attention decays at twenty to forty per cent a day regardless of what you spent to acquire it, the asset a marketer is actually purchasing is a few days of salience — and it should be priced like something perishable rather than something owned.",
      src: ["FlixPatrol (Netflix worldwide top ten, Aug 31)","https://flixpatrol.com/top10/netflix/"] },
    { cat: "Reading", t: "Two web-serial LitRPG novels are on the national bestseller lists at once — and Book Riot's Tuesday roundup still had not posted at five this morning",
      why: "Matt Dinniman's Dungeon Crawler Carl is on all five national lists and Carl's Doomsday Scenario on three, sitting alongside Ann Patchett. The series began as free serialised fiction posted on the web, in a genre — LitRPG, fiction structured around video-game mechanics — that essentially every gatekeeper in publishing ignored for a decade. Audiobook and subscription discovery carried it the rest of the way. For readers under twenty-five the distinction your generation draws between real publishing and fan-adjacent web fiction has quietly stopped existing; they encounter both through the same recommendation surface and judge them on the same terms. The second half of this card is a follow-through on yesterday's. This desk noted that publishing runs on a Tuesday clock, inherited from physical distribution. Today is Tuesday, and at five in the morning the September 1 new-releases roundup had not posted, so the August 25 list is still what a reader would find. The clock is real, but it ticks at business hours.",
      rec: "This is a genuinely good industrial-organisation example and it takes five minutes. A two-sided platform lowered entry costs enough that demand-side discovery overrode supply-side gatekeeping — and the gatekeepers were not defeated by a better argument, they were routed around. Ask what a publisher's advance is actually paying for once discovery is free, and let the room work out that it is risk-bearing and capital, not access.",
      src: ["Book Riot (bestselling books, the weekly roundup)","https://bookriot.com/bestselling-books-august-27-2026/"] },
    { cat: "Online", t: "August's meme-of-the-month vote closed last night with no winner announced and no September ballot — and four of the five nominees were built on somebody else's intellectual property",
      why: "Know Your Meme's August ballot went up on the 27th and closed with the month. As of this morning no winner has been declared and no September poll is live, which the desk reports as an observed absence rather than filling in. The nominees were Petra Parker, a Spider-Man fan-art trend; Roaming Characters at Universal Horror Nights, which lives on X; John Politics; a wholesome trend called Kinda Chic; and Gucci Morty. Four of those five derive from existing intellectual property — a Marvel character, a theme park, an animated series, a fashion house. That is not a decline from some earlier purity; it is simply the current condition of internet humour, where the raw material is whatever is already in circulation and the creative act is the recombination. The ballot's existence matters more than any entry on it: Know Your Meme has turned an entirely informal process into a dated monthly archive, and it is the only recency index in this space that reliably timestamps itself. The trending feed on the same site serves cached renders and has caught this desk out before.",
      rec: "The four-of-five ratio is a five-minute discussion prompt with real content in it: when a fan edit outperforms the rights-holder's own marketing, who has captured the value, and who should have? Skim this one URL once a month and you will end a term with the whole reference set, without ever opening a platform. Naming one thing correctly in passing is worth far more than building a lecture around one, which ages in weeks.",
      src: ["Know Your Meme (August 2026 meme of the month)","https://knowyourmeme.com/editorials/poll/cast-your-vote-for-august-2026s-meme-of-the-month"] },
    { cat: "Playing", t: "Four major game releases land between today and Friday — a crush that exists because everyone knows what is coming on November 19",
      why: "Moonlighter 2: The Endless Vault tomorrow, The Blood of Dawnwalker and Onimusha: Way of the Sword on Thursday, NBA 2K27 on Friday, with Crimson Moon today. The desk flagged yesterday that this calendar came from an aggregator whose URL it had failed to capture; it now has a citable source, and that source also removes an item — My Hero Academia: All's Justice does not appear in this window and should not be used. What makes the week worth a card is why it is crowded. Grand Theft Auto VI arrives on November 19 at $79.99, and publishers have known the date for months. Under-25 players discuss this in explicitly budgetary language on forums — what they are buying before GTA absorbs their autumn — and publishers are visibly reading the same logic from the other side, front-loading anything that cannot survive a head-to-head.",
      rec: "This is anticipated demand crowding out, happening in public and eleven weeks in advance, which makes it a much better example than the textbook version. Ask what a rational publisher does when a category-defining competitor's release date is public knowledge a quarter ahead — and then ask the harder follow-up, which is whether releasing early is a solution or merely a coordination failure in which everyone crowds the same safe window and cannibalises each other instead.",
      src: ["ScreenRant (September 2026 video game releases)","https://screenrant.com/september-2026-video-games-releases-schedule-lineup/"] }
