<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

    { h: "World & geopolitics", items: [
      { t: "Kyiv was hit twice on Thursday, and the toll moved all day. Ballistic and cruise missiles plus jet-powered drones struck Solomianskyi, Darnytskyi, Pechersk, Holosiivskyi, Sviatoshynskyi and Shevchenkivskyi over roughly nine hours overnight; the upper floors of a nine-storey residential building were destroyed, a children’s hospital, a school and a kindergarten were damaged, and two fuel facilities burned. A second strike around 5:30 p.m. local hit Holosiivskyi. The count is best read as a snapshot rather than a fact: the Kyiv Independent had 15 killed and about 40 injured, Meduza’s Russian-language war log 15 and 34, Meduza English “at least 17” once the evening strike was added, the Moscow Times 17 killed and more than 40 injured, Al Jazeera “at least 18,” and Kyiv Post 17 dead, 42 injured, 86 residential buildings damaged. The Moscow Times article ID a93536 carried three different tolls under three different headlines over the day — 12, then 16, then 17 — which is what in-place updating looks like from outside. Zelensky: “It was a massive attack. The Russians had been preparing for a long time, combining different types of ballistic missiles, cruise missiles, and drones, aiming to cause as much damage as possible to civilian infrastructure,” and “The interceptors for Patriot systems have not yet been replaced, and they are needed every day.” Foreign Minister Andrii Sybiha: “Every Russian ballistic missile is an act of barbarism. And every interceptor delivered to Ukraine is an act of humanity and lives saved.” A resident, Olena Postoyuk, to the Kyiv Independent: “Give us something to shoot down these missiles, because nothing gets shot down.” TASS described the same night as precision strikes on the Fire Point plant making Flamingo boosters, the Antonov aircraft factory, an arsenal, a Ukrspecsystems site, a logistics hub and a Brovary fuel depot, and reported no civilian casualties. Note one wrinkle in the Ukrainian account: ballistic and Zircon counts were withheld under a new Ukrainian disclosure policy, so the launch totals in circulation — 44 to 46 cruise missiles and 168 drones — are partial by design.",
        s: [["Moscow Times","https://www.themoscowtimes.com/2026/08/20/russian-missile-and-drone-attack-kills-17-in-kyiv-a93536"],["Meduza (EN)","https://meduza.io/en/news/2026/08/20/russia-strikes-kyiv-twice-in-one-day-killing-at-least-17-as-zelensky-vows-a-long-range-response"],["Al Jazeera","https://www.aljazeera.com/news/2026/8/20/russian-strike-kills-3-in-ukraine-as-zelenskyy-faces-pressure-at-home"],["TASS","https://tass.com/politics/2175485"]] },
      { t: "The mirror ledger diverged more sharply than usual, and this time the divergence is about a place name. Russia’s Defense Ministry, via TASS, reported 726 Ukrainian drones destroyed between 8 p.m. and 8 a.m. Moscow time — roughly 90 over Rostov, 21 Voronezh, 19 Tula, 12 Kaluga, 11 Ulyanovsk, plus a dozen more regions and the Azov and Black Seas — with Moscow Mayor Sergey Sobyanin separately reporting 250 drones headed for Moscow Region. What the Russian side did not say is where the significant hit landed. Tatarstan’s authorities named only the “Zakamsk economic zone” and omitted the city; the independent Telegram channel Astra identified it as Nizhnekamsk and the target as the Taneco refining complex, and Ukraine’s General Staff separately confirmed strikes on Taneco, capacity 16 million tons a year, and the Tamanneftegaz terminal in Krasnodar Krai. Officials acknowledged casualties without giving a figure. Ukrainian military intelligence also claimed strikes on drone-launch airfields at Primorsko-Akhtarsk and occupied Donetsk and on two radar systems, the 55Zh6U Nebo-U and 55Zh6UM Niobiy. ISW’s Aug 20 assessment leads on the strike pattern — Russia “stockpiling ballistic and cruise missiles” and preparing to integrate North Korean systems including an upgraded KN-30 — and flags something the wires mostly buried: Russian drones entered Moldovan and Romanian airspace and a naval drone was destroyed near a Romanian gas platform, which ISW reads as the Kremlin accepting collateral damage to NATO states. Both TASS pieces used here print datelines with no year; article IDs 2175485 and 2175501 anchor them to Aug 20, 2026.",
        s: [["TASS","https://tass.com/politics/2175501"],["Meduza (EN)","https://meduza.io/en/news/2026/08/20/ukrainian-drones-strike-russia-s-tatarstan-local-officials-report-injuries-and-disrupted-industrial-operations"],["ISW (Aug 20)","https://www.kyivpost.com/post/82794"]] },
      { t: "Ukraine’s wartime-election taboo broke in public, and Russia’s fuel crisis widened. Mykhailo Fedorov, fired as defense minister in July and replaced Aug 19 by SBU major general Yevhen Khmara on a 312-vote confirmation, used a video address to demand a “safe and realistic mechanism” for elections under martial law: “We must not let Putin decide when Ukrainians can choose their government,” and “Democracy is part of what we are fighting for today.” The pushback was immediate and cross-party — Oleksandr Merezhko of Servant of the People: “Holding elections under martial law is legally and politically impossible”; Yaroslav Yurchyshyn of Holos cannot imagine elections until fundamental problems are resolved; Volodymyr Ariev of European Solidarity attacked from the other side. Polling gives the argument its shape: Zelensky’s trust ran 61% against 34% in early July, and a majority still oppose elections before a ceasefire. Separately NABU released tapes implicating Iryna Mudra, Zelensky’s former deputy chief of staff, along with sitting MP Vadym Stolar and former MP Maksym Mykytas in an alleged property-seizure group; Mudra has been charged with money laundering and fired. Defense procurement chief Arsen Zhumadilov announced his exit for Aug 31. On the Russian side Meduza’s tally is the number to keep: 59 regions under strict fuel sales limits, 17 more with localized disruption, and gasoline available at only 28% of stations as of Aug 16 — with a new motor-oil squeeze, prices up 40% in some segments, on top of gasoline up 7.4% and diesel up 12.1% since January. Imported fuel is clearing at 80 rubles a litre against a 54-ruble domestic average. From the other bench, Mearsheimer’s Aug 19 “Living in Dark Times” holds that “Ukraine & the West are almost certain to lose the Ukraine war”; ISW’s reading of the same fuel data is that the Kremlin is managing symptoms rather than solving anything.",

      { t: "On Iran the gap between what was announced and what was signed is now the whole story. Trump’s “ECONOMIC D-DAY” post promised the “MOST CRUSHING ECONOMIC OPERATION EVER TAKEN AGAINST ANY COUNTRY,” naming oil smuggling, swap lines, cash transfers, exchange houses, ship registries and front companies, and threatening “TREMENDOUS Economic Consequences” for any country whose institutions give Iran a lifeline; Bessent promised the “toughest sanctions in history” to “collapse” the government and urged China to join. GlobalSecurity’s Day 174 log records that as of 5 a.m. ET Thursday — three days after the announcement — no designations, executive orders or Federal Register actions had been published. What Treasury actually did on Thursday was designate three individuals, Ossama Jaber, Ja’far Muhammad Qasir and Samer Kasbar, plus one Hezbollah front company, Hokoul SAL Offshore, over Iranian fund transfers to Lebanon. Under Secretary John K. Hurley: “Lebanon has an opportunity to be free, prosperous, and secure — but that can only happen if Hezbollah is fully disarmed and cut off from Iran’s funding and control.” Araghchi called the campaign “a diversion from America’s own crisis: unprecedented debt & surging interest costs” and elsewhere “economic terrorism.” Larry Johnson at Sonar21 reads it as an admission — “The escalation is the confession… You do not need an unprecedented new sanctions campaign to defeat a country you have already defeated” — and on the dollar itself: “You cannot make your currency the ultimate weapon and expect your adversaries to keep it as their savings account,” citing foreign Treasury holdings down $72.1 billion in June to $9.299 trillion. Two disputes worth carrying rather than resolving: the strike pause held a 21st night with no US or Israeli strikes inside Iran, and Hormuz traffic is reported at 2–3 transits a day against a 130–140 norm by GlobalSecurity but at 17% of pre-conflict average by Johnson citing UKMTO — roughly 2% versus 17%, and the two cannot both be right. War-risk premiums sit at 7.5–10% of hull value against a 1–3% pre-war baseline. The chief engineer of the bulk carrier Minoan Dignity was killed by an unattributed projectile outbound; Iran seized the tanker Amara over unpaid transit fees under its new toll regime; Abu Dhabi’s indefinite embargo removes roughly $28 billion in trade. Against Trump’s claim that the strait is “open,” Mearsheimer: “the president has just proclaimed that the Strait of Hormuz is open, which of course is not true.”",

      { t: "Wednesday’s buyback rally lasted exactly one day. Thursday opened higher and closed lower across the board: the S&P 500 at 7,681.27 (−26.71, −0.35%), the Dow 53,072.74 (−390.31, −0.73%), the Nasdaq 26,156.88 (−174.21, −0.66%) and the Russell 2000 3,011.46 (−21.48, −0.71%), a third straight down day, with the VIX up 5.65% to 15.73. The 10-year finished near 4.71% and the 30-year near 5.25%, wiping out the decline that followed Bessent’s Wednesday buyback expansion — Bloomberg’s headline was “US 30-Year Bonds Reverse Gains From Treasury’s Buyback Surprise,” and its slug called the plan “at best a circuit breaker for the global bond slump.” That reversal is the day’s real signal, and it happened against data that were strong rather than weak: initial claims came in at 206,000 against 210,000 expected, with the prior week revised up to 212,000; the Philadelphia Fed’s general activity index printed +47.4 against a +25.0 consensus, a five-year high, with the employment sub-index jumping from 10.0 to 27.9; and July leading indicators rose 0.2% against +0.1% expected. St. Louis Fed President Alberto Musalem was hawkish on Thursday, citing “strong growth, accommodative financial conditions” and arguing that raising rates now could avert more aggressive action later. Worth keeping straight: this Fed’s live question is a hike, not a cut, and the venue for it is not yet here — Jackson Hole runs Aug 27–29 on the theme “Financial Innovation: Implications for Payments and Policy,” with Chair Kevin Warsh delivering his first keynote as Chair on Friday the 28th. Commodities went the other way: WTI settled at $86.46 (+2.45%), Brent near $93.98, gold around $4,536 and silver up 1.6% to $66.86. The ruble strengthened to 82.79 to the dollar (CBR fixing 83.3550 for Aug 21) with the key rate at 14.00% since July 27 and the next board meeting Sept 11; Urals was $88.85 on Aug 19, a far narrower discount to Brent than July’s $65.48 average implies.",

      { t: "Walmart beat, raised guidance, and fell about 9%. Revenue was $187.9 billion, up 6%; adjusted EPS $0.81, up 19%; US e-commerce up 24%, global up 23%, Sam’s Club e-commerce up 26%; advertising up 38%; and full-year guidance went up on both lines, to 4–5% sales growth and $2.80–$2.87 adjusted EPS. GAAP net income nonetheless fell 9%. The number the tape traded on was US comparable sales at +2.6% against +3.8% expected, which the Yahoo desk attributed to customers making trade-offs on high gasoline prices — a reading that sits awkwardly beside the same day’s five-year-high Philadelphia Fed print. CEO John Furner: “Our team delivered another good quarter, and we continue to make steady progress on the long-term value drivers of our business.” It is a clean illustration for a classroom of the difference between a level and a surprise: every absolute number improved and the equity still lost roughly a tenth of its value, because the price already contained the improvement. The day’s other movers were violent in both directions — Advance Auto Parts −25.2%; Moderna −24.8%, a near-total round trip from Wednesday’s 177% surge on the melanoma vaccine readout, which is worth flagging as a caution about how fast a single-readout repricing can unwind; CF Industries +5.7%, Coinbase +6.1%.",

    { h: "Health & policy", items: [
      { t: "Two Thursday stories say the same thing about drug prices from opposite ends: the price is set by the label and the payment rule, not by demonstrated marginal benefit. KFF Health News reports on a body of work questioning FDA-approved cancer dosages — Keytruda alone did about $32 billion last year, close to half of Merck’s drug sales, against Opdivo’s $10 billion and CDK4/6 inhibitors at $4.1 to $5.7 billion each — with a modeled claim that minimum necessary dosing in 2024 would have saved the US system roughly $31 billion. Treat that figure as a model, not a finding; no large randomized low-dose trial exists. What is not modeled is the incentive stack: Medicare pays physicians average sales price plus 6% per infusion, so a larger dose is a larger fee; insurer rebates are indexed to standard dosing, penalizing reductions; 340B-discounted hospitals buy low and bill high, making volume the margin; and nobody is paid to discover that less works. Mark Ratain of the University of Chicago: “Pembrolizumab is the lifeblood of American hospitals… That’s why you don’t see hospitals in this country running to do trials.” Mayo’s Matthew Goetz: “Decisions aren’t always made with the best needs of patients in mind.” Northwestern economist Charles Manski, who is also a melanoma patient: “There is incredible uncertainty in drug dosing.” The August Health Affairs issue happens to carry a paper titled “Profitability Of Infused Biologics For Hospitals And Physician Practices: Case Study Of Keytruda,” though the journal’s site is currently serving a cookie interstitial on every article URL, so its figures could not be checked this morning. At the other end, FDA approved two seven-figure therapies on the same day: Ultragenyx’s Genglycos for glycogen storage disease type Ia at $2.7 million a patient, granted accelerated approval on reduced cornstarch intake — a surrogate endpoint, in a US population of 1,500 to 2,500 — and Regeneron’s Pasatru for fibrodysplasia ossificans progressiva at roughly $1.4 million a year, ranging $693,000 to $2.1 million by weight, on a Phase 3 showing 90% or better reduction in new heterotopic ossification lesions.",
        s: [["KFF Health News","https://kffhealthnews.org/health-industry/cancer-drug-immunotherapy-fda-approved-dosages-challenged-keytruda-opdivo/"],["STAT (approvals)","https://www.statnews.com/2026/08/20/biotech-news-fda-approves-utlragenyx-gene-therapy/"]] },
      { t: "Rationing is being renegotiated on two fronts at once, and both are measurable now. On substitution: a Wells Fargo industry report finds metabolic bariatric surgery volumes fell 34.1% from 2022 to 2024 while GLP-1 use rose more than 140% over the same period — correlational, but the direction is hard to argue with. Medicare Part D gross GLP-1 spending hit $27.5 billion in 2024, a fivefold rise since 2019; 64% of large firms say GLP-1s moderately or significantly raised their drug spending; and obesity drugs now account for about 25% of forecast late-stage pipeline value, up from 1% in 2022, displacing oncology for the first time in sixteen years. The two CBO numbers to put side by side: authorizing Medicare obesity coverage adds about $35 billion in federal spending over 2026–2034, at a near-term cost of roughly $5,600 per user in 2026 against roughly $50 per user in offsetting federal savings that year — which is the entire distinction between cost-effectiveness and budget impact in one ratio. On screening: newly disclosable 2025 data compiled by KFF from the fourteen largest insurers in each segment show Medicare Advantage denial rates averaging 12% (UnitedHealth 17%, Elevance 5%), Medicaid managed care 14% (Independence 23%, L.A. Care 2%) and ACA marketplaces 18% (Centene 25%, Guidewell 3%) — with roughly two-thirds of appealed MA denials overturned, half in Medicaid and 43% on the exchanges. A screen that is reversed two times in three on appeal is not primarily separating valid from invalid claims. Into that gap walks an arms race: R1 RCM, which processes over 600 million transactions a year for about 1,000 providers, is buying Humata Health to run AI on prior authorizations, claiming a first-pass approval rate up to 96% — a vendor figure, unverified — against payer-side AI doing the denying.",
        s: [["Fierce Healthcare (GLP-1)","https://www.fiercehealthcare.com/payers/glp-1s-are-reshaping-health-business-models-wells-fargo-report"],["Healthcare Dive","https://www.healthcaredive.com/news/r1-drills-down-on-ai-prior-authorizations-with-humata-buy/828382/"]] }
    ]},
    { h: "Campus & culture", items: [
      { t: "The Ypsilanti Township moratorium is real; the paper trail is not there yet. The board passed a 180-day moratorium at its Aug 18 meeting covering “hyper-scale data centers, mid-sized data centers, artificial intelligence computing facilities, and high-performance computational centers” — the mechanism aimed at U-M’s $1.2 billion, 144-acre computing center with Los Alamos and DTE’s proposed 110-megawatt substation, which WEMU notes equals the township’s entire current power draw and Bridge describes as enough for 80,000 homes, in a community of 56,000, against $100 million in state money and roughly 200 projected jobs. As of this morning the township’s own data-center page posts Resolutions 2026-05, 2026-08 and 2025-23 but not the Aug 18 moratorium: no resolution number, no text, no roll call. WXYZ’s “unanimously approved” is a single-source characterization, not a documented vote. Township attorney Doug Winters: “It’s for six months, the moratorium; at the same time, we’re going to proceed with due diligence.” Supervisor Brenda Stumbo: “We need to make sure it’s in the right location from a planning standpoint.” Clerk Debbie Swanson on the university’s account of its outreach: “U of M has been so crystal clear that they’ve been communicating to us abundantly — which is not true.” U-M says it is evaluating the resolution and declined further comment; DTE says it has an obligation to serve. The structural fact underneath all of it is that U-M is a public university exempt from local zoning, which is precisely why the township is working the utility lever. Registration for the Sept 9 town hall at the Marriott at Eagle Crest reached capacity Thursday and is now waitlisted. Elsewhere in the state: Attorney General Dana Nessel filed a sixth rehearing request over DOE’s forced operation of the J.H. Campbell coal plant — “it is clear that DOE intends to stretch [Section 202(c)] of the Federal Power Act to force an aging, obsolete plant to operate indefinitely” — at an estimated $139 million a year to MISO ratepayers and $295 million incurred since May 2025; the Board of State Canvassers takes up the proof-of-citizenship petition Monday, 17 signatures short in a 1,000-signature sample; Michigan confirmed its first human EEE case since 2021, in Roscommon County; and Detroit restarted Pay As You Stay, which with the HOPE exemption has kept nearly 18,000 Detroiters out of foreclosure since 2020.",
        s: [["WEMU","https://www.wemu.org/wemu-news/2026-08-20/ypsilanti-city-council-contemplating-vacancy-tax"],["Bridge Michigan","https://bridgemi.com/business-watch/ypsilanti-township-eyes-moratorium-on-power-transmission-to-slow-u-m-data-center/"],["Michigan Public (Nessel)","https://www.michiganpublic.org/environment-climate-change/2026-08-20/michigan-ag-challenges-the-us-department-of-energy-again-over-coal-plants-forced-operation"]] },
      { t: "International applications fell 10% and a university let an AI write its answer to Washington. Common App’s end-of-season report across 1,146 institutions has international applicants down about 16,000 to 148,000 from 165,000, with Asia off 11% and Africa off 17%, even as total applicants rose 2% to 1.5 million and applications from below-median-income ZIP codes rose 8%. Common App’s Rodney Hughes on the mechanism: “If you think, ‘OK, it might be hard for me to get a visa,’ that may make students more hesitant to apply” — the demand response arrives before the rule does, since the four-year cap on duration of status does not take effect until Sept 15 and is already being litigated in Massachusetts by eight organizations including NAFSA and, notably, the UAW. In a category of its own, the Chronicle reports that the UNC System’s eleven-page response to Education Secretary Linda McMahon’s “Call to Action” — which asks institutions about, among other things, academic rigor in the AI era — was itself drafted with AI help, flagged as such by three detection services. Spokesman Andy Wallace called it “typical of administrative tasks”; historian Cate Denial: “Communications coming from the highest level need to be modeling the kinds of things that they’re expecting.” The pedagogy item worth actually stealing is at home: Inside Higher Ed profiles ROB 201, Jessy Grizzle’s calculus-for-engineers course at Michigan, which merges Calc I and II with differential equations and Julia programming, and which inverted the usual order — “I took the subject apart and rearranged it so that we started with integration, because it’s much easier than differentiation.” The transferable piece is this fall’s assessment change: five low-stakes quizzes plus an in-class final done by hand with handwritten notes only, while coding and computational tools stay central to homework and projects. Grizzle on why the redesign is hard to spread: faculty resist because “they’re afraid their students will be less prepared than they are.” Alongside it, CUPA-HR data show tenure-track faculty up 7% year over year, the biggest single-year rise since 2016, while part-time staff fell 23.9% — a divergence Robert Kelchen called “almost implausible.”",
        s: [["Inside Higher Ed (applications)","https://www.insidehighered.com/news/admissions/traditional-age/2026/08/20/applications-international-students-down-10"],["Chronicle (UNC)","https://www.chronicle.com/article/unc-used-ai-to-help-draft-its-compact-2-0-response-is-that-hypocritical"],["Inside Higher Ed (ROB 201)","https://www.insidehighered.com/news/student-success/academic-life/2026/08/20/rethinking-calculus-future-engineers"]] },
      { t: "Mind & cosmos had a genuinely large Wednesday, and the psilocybin pair is the reason. In Nature, a Monash-led group with Robin Carhart-Harris and Anil Seth among the authors reports the largest single-site psychedelic neuroimaging dataset of its kind: 62 psychedelic-naive adults, 19 mg psilocybin, fMRI and EEG at rest and during meditation, music and film. The headline result runs against the field’s entropy story — brain activity did not simply become noisier but realigned with context. Occipital connectivity fell up to 39% while associative regions rose up to 72%; modularity dropped in every condition; and the accuracy with which context could be decoded from brain trajectories correlated with boundary dissolution at r = 0.64 and with next-day mindset change at r = 0.40. Half the participants ranked the session among the most meaningful experiences of their lives. Devon Stoliker: “The brain is essentially tracking what’s happening and aligning with that.” The honest limit is in the paper: an eight-week mindfulness-training arm produced no significant group-level difference in acute effects, and follow-up runs only one month. Alongside it in JAMA Network Open, an OHSU-led cohort of 346 people who used Oregon’s regulated non-clinical psilocybin services across 24 licensed centers reports 91.5% saying they benefited at one month, 64.9% ranking the session among their ten most meaningful life events, 7 of 346 calling it harmful at three months, and four first-time users needing medical attention. Todd Korthuis: “The data has swayed me. These results are very reassuring.” Johns Hopkins’s Albert Garcia-Romeu, not involved: “I would say that we really can’t generalize based on this study that it’s going to be this safe and look this way for everyone” — fair, given no control arm, self-selection, and about a third of participants reporting household income above $200,000. In physics, a Japanese group ran Young’s double slit between two adjacent silicon atomic columns 1.36 ångström apart, roughly seven orders of magnitude tighter than the original, with fringes surviving from 300 K to 900 K; a Caltech-led team recovered conformal field theory spectra in Rydberg chains of 7 to 35 atoms, hitting the predicted 2:4:6:8 ratios; and IBM linked two modular cryostats below 15 millikelvin, en route to at least 1,000 programmable qubits across joined processors by 2027.",
        s: [["Nature","https://www.nature.com/articles/s41586-026-10910-z"],["OHSU / JAMA Netw Open","https://news.ohsu.edu/2026/08/19/study-finds-sustained-benefit-for-people-using-oregon-psilocybin-services"],["Nature (double slit)","https://www.nature.com/articles/s41586-026-10914-9"],["The Quantum Insider","https://thequantuminsider.com/2026/08/19/ibm-connects-two-modular-cryogenic-systems-quantum-computing/"]] },
      { t: "Director watch: Criterion is putting out the first Estate-approved Lynch restoration. The November 2026 slate, announced last week, includes Wild at Heart on 4K UHD and Blu-ray with a November 17 street date, from a new 4K restoration “supervised by director of photography Frederick Elmes and approved by the David Lynch Estate,” with a new introduction by Dennis Lim, deleted scenes and outtakes remixed in 5.1, readings from Lynch’s memoir, and an excerpt from Chris Rodley’s Lynch on Lynch with a new Rodley introduction. The rest of the month is Harold and Maude, Marie Antoinette, Shoot the Piano Player, Parajanov’s Shadows of Forgotten Ancestors, Sophy Romvari’s Blue Heron, The Right Stuff — and, without comment, KPop Demon Hunters. A second edition of the London tribute “A Gathering of the Angels” runs Sept 26–27 at the Genesis Cinema in Whitechapel with Harry Goaz, Ian Buchanan and executive producer Sabrina Sutherland attending. On Refn: Her Private Hell has already been and gone theatrically — Cannes out of competition in May, US release through Neon in July — and the reception is poor, 44% on Rotten Tomatoes from 27 critics and 38 on Metacritic, with The Film Stage’s Rory O’Connor writing that it drifts toward “perfume-advert vapidity — or, worse still, AI slop.” Refn, to Hammer to Nail: “Everyone’s algorithm is their private hell.” His next is a Maniac Cop revival with MUBI and Goodfellas, announced but not in production. Nothing verifiable this week on Noé or von Trier, and none of the four appears in the Venice lineup (Sept 2–12, opening with Danny Boyle’s Ink, Maggie Gyllenhaal presiding). For the weekend read, the New York Review’s Aug 20 issue is unusually strong: Daniel Mendelsohn on Nolan’s Odyssey, Alma Guillermoprieto on the Frida Kahlo exhibitions, Coco Fusco on Pope.L, Dan Chiasson on Fairfield Porter. In the art world, the painter Mary Heilmann died at 86; the Speed Art Museum returned 24 sacred objects to the Southern Cheyenne and Arapaho Tribes, in the collection since a 1930 donation — Chester Whiteman: “All these articles should be in Native hands. They weren’t made to be put on display” — and works attributed to Antonello da Messina were stolen from a Sicilian museum during a town feast, with Mafia involvement suspected but not established.",
        s: [["The Arts Shelf (Criterion)","https://theartsshelf.com/2026/08/16/criterion-collection-november-2026-releases/"],["Time Out (Lynch tribute)","https://www.timeout.com/london/news/david-lynch-weekender-london-september-081226"],["NYRB","https://www.nybooks.com/articles/2026/08/20/artful-weaving-odyssey-christopher-nolan/"],["Hyperallergic","https://hyperallergic.com/speed-art-museum-returns-24-native-artifacts-to-oklahoma-tribes/"]] }
    ]}

  hooks: [
    { story: "Keytruda did roughly $32 billion in sales last year, close to half of Merck’s drug revenue. Researchers argue the FDA-approved dose is higher than necessary — a modeled estimate puts 2024 savings from minimum necessary dosing at about $31 billion — but no large randomized low-dose trial exists. Medicare pays physicians average sales price plus 6% per infusion; insurer rebates are indexed to standard dosing; 340B hospitals buy at a discount and bill at full rates. Mark Ratain, University of Chicago: ‘Pembrolizumab is the lifeblood of American hospitals… That’s why you don’t see hospitals in this country running to do trials.’",
      src: ["KFF Health News","https://kffhealthnews.org/health-industry/cancer-drug-immunotherapy-fda-approved-dosages-challenged-keytruda-opdivo/"],
      concept: "Ad valorem reimbursement, agency, and who funds a public good",
      q: "Start with the payment rule, because it does the analytic work: ASP plus 6% is an ad valorem markup, so the provider’s margin is proportional to the price and the quantity of drug administered. Have students write the physician’s payoff and ask what dose maximizes it, holding clinical outcome fixed. They will get there fast, and the fast answer is the wrong place to stop — push them to say what would have to be true for that incentive to actually bend prescribing, given that the physician also bears malpractice risk, professional norms, and a patient in front of them. Now switch to the interesting question, which is not why doses are high but why nobody finds out. A definitive low-dose trial would be expensive, and the party that would pay for it captures none of the gain: the savings accrue to Medicare, to insurers, and to patients, while the manufacturer loses revenue and the infusing hospital loses margin. That is a textbook underprovision of a nonexcludable good, and it explains a market failure that no amount of competition among manufacturers would fix — the missing product here is information, not a drug. Ask who could internalize it, and make them evaluate the candidates seriously: NIH or CMS funding trials directly; a payer contracting for the study and keeping the savings; value-based pricing that pays per outcome rather than per milligram. Then complicate it. Ratain’s claim implies that current dosing is clinically unnecessary, which the evidence does not yet establish — the $31 billion is a model, and the trial that would test it is the very thing nobody runs. Ask students how they would design a policy that is robust to the possibility that the high dose is right, and notice that this is the same structure as a firm deciding whether to fund research whose main effect is to shrink its own market. Good closer for a health-econ section: the FDA approves a maximum tolerated dose, not a cost-effective one, and nothing in the regulatory pipeline is charged with finding the second."},
    { story: "Newly disclosable 2025 data show Medicare Advantage prior-authorization denial rates averaging 12% — UnitedHealth 17%, Elevance 5% — with Medicaid managed care at 14% and ACA marketplaces at 18%. Roughly two-thirds of appealed MA denials are overturned, half in Medicaid, 43% on the exchanges. R1 RCM, which handles over 600 million transactions a year for about 1,000 providers, is acquiring Humata Health to run AI against prior authorizations, claiming a first-pass approval rate up to 96%.",
      src: ["Healthcare Dive","https://www.healthcaredive.com/news/r1-drills-down-on-ai-prior-authorizations-with-humata-buy/828382/"],
      concept: "Ordeal mechanisms, costly screening, and what happens when the cost falls",
      q: "Set prior authorization up as what it is: an ordeal mechanism. The insurer cannot observe whether care is necessary, so it imposes a cost — paperwork, delay, appeals — that it hopes falls more heavily on low-value claims than high-value ones. Ask what has to be true for that to work, and get the condition stated precisely: the ordeal cost must be negatively correlated with the value of the claim. Then hand them the overturn rate and let it do damage. If two-thirds of appealed denials are reversed, the screen is not cleanly separating valid from invalid requests; it is separating persistent from non-persistent claimants, which is a different variable entirely and one that correlates with things nobody wants it to correlate with — administrative capacity, health literacy, whether a practice employs someone whose whole job is appeals. Ask which patients never appeal, and what that does to the welfare arithmetic. Now bring in the acquisition, because it is a genuinely new question rather than a familiar complaint. If AI drives the provider’s cost of contesting a denial toward zero, the ordeal stops screening at all — everything gets appealed, and the insurer’s denial carries no information. Have students predict the insurer’s best response. Most will reach the arms-race answer: raise the denial rate, or make the criteria more opaque, or move the screen somewhere the automation cannot reach. Ask whether the equilibrium is better or worse than the status quo, and make them be explicit about whose welfare they are counting — the resources burned on both sides of an automated fight are pure deadweight loss, but the patients who previously lost care by attrition may now get it. Extension for an intermediate section: model this as a costly-state-verification game and ask what a regulator maximizing total surplus would do — cap denials, mandate response times, or make the insurer bear the cost of overturned denials. That last one is the mechanism-design answer, and it is worth asking why it is not the policy."},
    { story: "Ypsilanti City Council heard a presentation on a possible vacancy tax; no legislation has been introduced. Ypsilanti has one of the highest vacancy rates in Washtenaw County. Mia Loseff of Local Progress argues such fees ‘encourage owners to activate their properties.’ The same week, the neighboring township passed a 180-day moratorium on major electric infrastructure aimed at a $1.2 billion computing center — two very different instruments for changing what gets built and when.",
      src: ["WEMU","https://www.wemu.org/wemu-news/2026-08-20/ypsilanti-city-council-contemplating-vacancy-tax"],
      concept: "Holding costs, option value, and taxing an asset for what it is not doing",
      q: "Start by asking why a rational owner would hold a vacant building at all, since students’ first instinct is that vacancy is irrational or spiteful. Make them list the reasons and they will produce a real model: renovation costs exceed the rent a tenant would pay; the owner is waiting for a neighborhood to turn, so the property is an option rather than an income stream; holding costs are low because property tax is assessed on a stale value; and selling would crystallize a loss. Once vacancy is a rational choice under uncertainty, the tax has a clear job — raise the holding cost enough to make waiting more expensive than acting. Have them work out what ‘acting’ means, because the tax does not specify: the owner can rent, sell, renovate, or demolish, and only some of those are what the council wants. Ask which margin a flat annual fee actually pushes hardest, and whether a demolished building counts as success. Then take the other side seriously. The option value of waiting is not obviously a social loss — sometimes the efficient thing is for a parcel to sit until a better use arrives, and a tax that forces premature commitment destroys value. Ask what evidence would distinguish a vacancy that imposes real costs on neighbors, through blight and reduced foot traffic, from one that is simply an owner waiting well. That distinction is the whole case for the tax: it is a Pigouvian instrument if vacancy is an externality and a distortion if it is not. Close by putting the two Ypsilanti instruments side by side. The city is contemplating a price on an unwanted behavior; the township next door has used a quantity restriction — a flat six-month prohibition — on an unwanted project. Ask which tool each situation calls for, and why a local government facing a $1.2 billion counterparty reached for the ban rather than the price. The answer is partly that it has no authority to set the price, which is a useful reminder that the choice between instruments is often made by jurisdiction rather than by efficiency."}
  ],
  pulse: [
    { cat: "Listening", t: "Five songs from 1997–2005 climbed the US chart on the same day",
      why: "On the Aug 19 Spotify US daily, The Killers’ ‘Mr. Brightside’ (2003) jumped six places to No. 7 on 772,466 streams, up 63,474 in a day; Goo Goo Dolls’ ‘Iris’ (1998) rose ten to No. 24; Fleetwood Mac’s ‘Dreams’ held No. 25; and Kelly Clarkson’s ‘Since U Been Gone’ and Wheatus’s ‘Teenage Dirtbag’ entered new at No. 120 and No. 136. No single trigger is verifiable — don’t assume a sync or a trend. The structural explanation is better documented: roughly one in three Spotify streams now goes to a song at least ten years old, and among US listeners aged 13 to 24 the share who listen mostly to 2020s music has fallen from 55% in 2021 to 44%. The nineties is the fastest-growing decade. One reading gaining traction is that verifiable human provenance is becoming the scarce good in a catalog filling with AI music. Worth noticing alongside it: Ariana Grande’s ‘petal’ sits at No. 19 while ‘Petal Chair Choreo’ is a live TikTok format — the chart position and the format are the same event, not two.",
      rec: "Ask what the oldest song in their regular rotation is and how they found it. It is a better question than ‘what are you listening to’ because the answer is almost always a route rather than a title, and the routes are the interesting part — a video, a parent’s car, an edit, a game soundtrack.",
      src: ["kworb / Spotify US daily","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Watching", t: "Two teen-drama finales landed in the same week",
      why: "Outer Banks premiered its fifth and final season Aug 20, and The Audacity dropped Aug 19, in a window where My Life with the Walter Boys season three is already No. 1 worldwide on Netflix — nine million views and 71 million hours watched in its first four days. The thing to register is that these are not background shows. A final season of something a student started at fourteen is a genuine event with a fixed date, and the fixed date is the point: nearly everything else in their media life is on demand and therefore unsynchronized, so an appointment finale is one of the few remaining places where a whole cohort is watching the same thing at the same hour and can talk about it the next day without spoiling anyone.",
      rec: "If a Friday class feels flat in the first week of term, ‘did anyone finish Outer Banks’ is a low-cost opener with a high hit rate, and it costs you nothing in credibility because you are asking rather than claiming. The follow-up question that actually earns something: did you watch it as it dropped, or save it?",
      src: ["ScreenRant","https://screenrant.com/best-netflix-shows-to-binge-week-august-17-2026/"] },
    { cat: "Reading", t: "One series holds five of the top fifteen — and the order gives away why",
      why: "On the NYT fiction list dated Aug 23, Matt Dinniman’s Dungeon Crawler Carl occupies positions 8, 11, 12, 13 and 15 — the same five-slot spread as last week. Look at the ordering rather than the count: the newest volume, The Dungeon Anarchist’s Cookbook, sits at No. 8 while book one is at No. 11 and volumes two, three and five fill out the rest. New readers are entering at the top of the news cycle and buying downward through the backlist inside the same week. A serialized LitRPG series that must be read in order converts one promotional push into demand for the entire catalog simultaneously, so a weekly unit-sales list reports one cultural event as five separate books. Conventional trade fiction structurally cannot do this.",
      rec: "Advising material more than classroom material. A student who says they don’t really read may be sixty hours into a series that would never come up in a syllabus conversation. Asking what format they read in — audio, serial, app — gets a truer answer than asking for a title, and it takes ten seconds.",
      src: ["Book Riot","https://bookriot.com/bestselling-books-august-20-2026/"] },
    { cat: "Online", t: "‘Ruth Smiling’ is a meme about millennials, aimed at millennials",
      why: "The image is the actress K Callan as Ruth, an 84-year-old character in Apple TV’s Widow’s Bay, from a June finale — and the viral version is AI-altered, with the sweater and lighting changed, which is itself part of the story. It broke on Aug 1 via a post about discovering a hairdresser was born after 9/11 (32,600 likes), then an Aug 15 post about school computer labs did 2.6 million views and 182,000 likes in three days. The joke is not that old people are funny. It is a reaction image for the moment you realize you have become the outdated reference, and it is being deployed at people roughly ten years older than the people deploying it. That makes it a generational boundary marker with a very precise target, and the target is not you — it is your former students.",
      rec: "Context, not material. The useful thing is knowing the category exists, so that when a student uses an image you don’t recognize to mark someone as dated, you can read it as a boundary being drawn rather than an insult. Also worth knowing on the same beat: ‘flobby samuel insect,’ a format Know Your Meme states plainly is not a real format — the joke is the anxiety of missing a reference that was engineered to have no referent.",
      src: ["Know Your Meme","https://trending.knowyourmeme.com/editorials/guides/what-is-the-ruth-smiling-meme-the-old-woman-from-widows-bay-making-millennials-feel-ancient-explained"] },
    { cat: "Online", t: "A Chinese animated flop is now a $3 million ironic hit",
      why: "Niu Lai, about a cowardly cow in a dreamscape, was made over five years by director Xin Yumeng and his mother. It opened with no marketing at all — theaters were sent no poster, so staff drew their own — and died. Then it went ‘so bad it’s good’ on Douyin, crossed to North American TikTok, and has now grossed over 28 million yuan, about $3 million. Know Your Meme compares the fandom to Morbius. What makes it worth noticing is that ironic consumption is now a distribution channel with real revenue attached, and it operates on exactly the films that conventional marketing has abandoned. The audience is not laughing at the filmmakers so much as claiming discovery rights over something no algorithm pushed at them.",
      rec: "A one-line aside, if it fits: a film with a zero marketing budget made $3 million because people found it embarrassing. Under-25 audiences take real pleasure in things that were not optimized for them, which is a useful thing to know about a cohort usually described as algorithmically captured.",
      src: ["Know Your Meme","https://trending.knowyourmeme.com/editorials/guides/what-is-niu-lai-the-memes-about-the-so-bad-its-good-chinese-animated-cow-film-explained"] },
    { cat: "Playing", t: "The $75 million Esports World Cup closes in Paris this weekend",
      why: "The 2026 Esports World Cup finishes Aug 23 at Paris Expo Porte de Versailles after running since July 6 — 24 titles, a $75 million total prize pool split between $30 million for a club championship across the top 24 organizations and $39 million spread over 25 individual events, with Trackmania making its debut alongside League of Legends, Valorant, Counter-Strike 2 and chess. The club-championship structure is the part worth understanding: it pays organizations for aggregate performance across unrelated games, which is why esports orgs now look like multi-sport clubs rather than single-title teams. For students who follow this, it is closer to watching a league season conclude than to watching a tournament.",
      rec: "Not something to bring up cold. But if a student mentions an org name — T1, G2, Team Falcons — it is a club, not a team, and asking which titles it fields is a real question rather than a polite one. The chess event is the low-effort entry point for anyone who wants to watch ten minutes of it.",
      src: ["Esports World Cup","https://esportsworldcup.com/en/news/all-you-need-to-know-ewc26"] }
  ],
  classnote: { t: "Mortal Shell II went on general sale Thursday at $49.99 — but it had already been playable since Aug 17 for anyone who bought the $59.99 Devout Edition, and there is a $69.99 physical Revered Edition that sold out in eight days. Same game, three posted prices in one week, and the whole menu is a clean second-degree price discrimination problem. Start with the middle tier: $10 buys three days of earliness plus a cosmetic skin set. The build already exists, so the marginal cost of granting early access is essentially zero, which means close to the entire $10 is producer surplus extracted from buyers who sort themselves as impatient. Ask students to write down the screening logic — the firm cannot observe who is impatient, so it posts a menu and lets preferences reveal themselves — then ask why the earliness and the skins are bundled rather than sold separately. Pure bundling makes it impossible to learn which component the buyer valued, which is precisely what protects the $10 screen from being competed away. Now put a quantity on the demand curve: peak concurrent Steam players during the paid early-access window, when $59.99 was the only way in, exceeded 23,000. That is an observed point at a known price, and a lower bound on units. Note the timing too, because it is either luck or design: the OpenCritic verdict landed at 85 with 92% of critics recommending on Aug 17, the exact day paid early access opened — the quality signal arrived when only the expensive tier was purchasable, which is what gives the $10 option its value. Ask what happens to that option if the reviews had come in at 55. Then use the third tier for the sharpest contrast. Two tiers have zero marginal cost, unlimited supply, and never stock out; the physical collector’s edition has real marginal cost, a fixed print run, and cleared to a stock-out in eight days. A stock-out is direct evidence the posted $69.99 sat below the market-clearing price. Ask why a publisher would deliberately underprice its most constrained SKU, and make them argue it out: scarcity signaling, seeding a resale market that advertises the game for free, avoiding the reputational cost of gouging its most committed customers, or simply treating the collector’s edition as a marketing line rather than a profit center. Good extension: the free open beta drew a million players. Ask what problem a zero price solves for an experience good whose feel cannot be assessed before purchase, and what the conversion from a million free players to 23,000 paying early adopters actually tells you.",
    src: ["Tech Times","https://www.techtimes.com/articles/325103/20260820/mortal-shell-ii-goes-wide-today-one-million-beta-players-4999-day-one-patch-applied.htm"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

    ${colhead("The beat press")}
    <div class="cols c3">
      <div>${colhead("Music")}${feedCard("billboard", 4)}${feedCard("pitchfork", 4)}${feedCard("rollingstone", 4)}</div>
      <div>${colhead("Screens &amp; play")}${feedCard("avclub", 4)}${feedCard("letterboxd", 3)}${feedCard("polygon", 4)}${feedCard("verge", 3)}</div>
      <div>${colhead("Reading, style &amp; online")}${feedCard("bookriot", 3)}${feedCard("teenvogue", 3)}${feedCard("dazed", 3)}${feedCard("kym", 3)}${feedCard("ypulse", 3)}</div>
    </div>`;
}
function renderAbout() {
  const legendRows = ["wire","west","acad","realist","ruind","rust","rudom"].map(k =>
    `<span class="badge"><i style="background:var(${PERS[k].v})"></i>${PERS[k].label}</span><span>${{
      wire: "Wire services and large newsrooms. Fast and factual on events; framing tends to follow Western official sourcing.",
      west: "Defense and foreign-policy analysis shops (ISW, War on the Rocks, Crisis Group, Foreign Affairs). Rigorous, but institutionally close to Western policy debates.",
      acad: "University-affiliated or scholarly aggregation (Carnegie Politika, Russia Matters, NBER, VoxEU, Health Affairs). Slower, source-critical, citation-friendly.",
      realist: "Your five voices plus Responsible Statecraft and Judging Freedom. Strong on questioning official narratives; note they appear frequently on each other's shows, so treat the cluster as one correlated perspective, not several independent confirmations.",
      ruind: "Russian newsrooms in exile (Meduza, Moscow Times). Independent of the Kremlin; oppositional by circumstance.",
      rust: "State wire. Read it to know the official Kremlin line — that is its value and its bias.",
      rudom: "Business dailies operating inside Russia under censorship (Kommersant, RBC). Useful on the economy; constrained on politics."
    }[k]}</span>`).join("");
  document.getElementById("tab-about").innerHTML = `
    <div class="card about" style="max-width:900px">
      <h2 style="font-family:Charter,Georgia,serif;margin:0 0 10px">How this desk works</h2>
      <p><b>The design premise: no single source is unbiased — so this page doesn't promise one.</b> Every outlet here, including each of your five preferred commentators, has a vantage point. Instead of hiding that, the desk labels it and puts perspectives side by side. When the wires and the realists describe the same event differently, that gap is itself information — it is usually where the interesting research question lives.</p>
      <div class="legend">${legendRows}</div>
      <p><b>A practical habit from the classroom:</b> when any source — mainstream or heterodox — makes a falsifiable prediction (“the front will collapse by spring”, “sanctions will crater the ruble”), jot it down and revisit in three months. Track records, not vibes, are the academic's bias detector. The side-by-side columns in Geopolitics are built to make that easy.</p>
      <p><b>Freshness:</b> a scheduled task rewrites the Morning brief, the classroom hooks, the Student Pulse, and the saved headlines once a day, every morning around 5:00 a.m. Detroit time. Independently, every time you open the page it re-pulls all 98 feeds live (green dot = live; gray = snapshot from the last rebuild; red = source unreachable right now). The FX tiles pull European Central Bank reference rates live.</p>
      <p><b>Paywalls &amp; plumbing:</b> FT and The Economist feeds carry headlines; the click may hit a paywall. Sources without a usable public feed arrive via a Google News query (their headlines, Google's plumbing). YouTube cards list each channel's latest uploads.</p>
      <p><b>Student Pulse:</b> a standing answer to “what are my undergraduates into right now?” Each refresh rewrites the Pulse check — what they're listening to, watching, reading, playing, and doing online — with a line of analysis and one practical way in for you, plus a weekly youth-market story that doubles as a micro example. The aim is fluency, not imitation: knowing what Haymaker Valley is beats referencing it.</p>
      <p><b>Mind &amp; Cosmos:</b> your standing shelf for consciousness studies, Dzogchen and Tibetan Buddhism, Advaita Vedanta, quantum physics and computing, and psychedelics research — mixing contemplative magazines (Tricycle, Lion's Roar, Buddhistdoor), consciousness-first essays (Essentia, Aeon/Nautilus filtered, Closer to Truth), hard physics (Quanta, Physics World, new arXiv quant-ph papers), and the psychedelic research pipeline (Psychedelic Alpha, PsyPost, MAPS). Teaching &amp; pedagogy has its own column under Higher Ed, and the Culture tab keeps a Director watch on Lynch, Noé, von Trier, and Refn alongside Criterion, MUBI, and Senses of Cinema.</p>
      <p><b>Culture without the WSJ:</b> FT Life &amp; Arts and Aeon are the closest substitutes for the WSJ weekend essay; the New Yorker, NYRB, and The Atlantic cover the long-form review beat; ARTnews and Guardian Culture carry art-world news; Vogue, Business of Fashion, and Variety keep a lighter eye on style and entertainment.</p>
    </div>`;
}
function renderAll() {
  renderToday(); renderGeo(); renderEcon(); renderHealth(); renderMichigan(); renderEducation(); renderMind(); renderPulse(); renderCulture(); renderAbout();
  applySearch();
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
</script>
