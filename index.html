  hooks: [
    { story: "On Friday, three physician specialty societies — the American Society of Anesthesiologists, the American College of Emergency Physicians and the American College of Radiology — issued a joint rebuttal to a Georgetown study finding that the No Surprises Act’s independent dispute resolution process has generated about $22bn in unnecessary health spending over four years, roughly $16bn of it from arbitration awards exceeding comparable in-network rates. Their objection is not to the arithmetic. It is to the benchmark: “the report’s cost claim is built on a deeply flawed premise: that the insurer-calculated Qualifying Payment Amount (QPA) is accurate and represents an appropriate in-network payment rate. The evidence is overwhelmingly clear that QPAs are often inaccurate and unreasonably low.” The QPA is the median contracted rate for a service in a geographic area — as calculated by insurers — and it is the number arbitrators anchor on when a provider and a plan cannot agree on payment for out-of-network emergency or ancillary care. Jack Hoadley, the study’s lead author at Georgetown’s Center on Health Insurance Reforms, then did something worth showing students: he re-ran the estimate using his critics’ premise. Setting the appropriate rate at 150% of QPA reduces the $22bn by $1.1bn. Setting it at 200% of QPA — assuming, that is, that the insurer-computed benchmark understates the true rate by half — reduces it by $2.3bn. The finding survives with roughly $20bn intact. The societies published no alternative estimate of their own. Two further facts belong on the board: IDR volumes are up 77% and awarded amounts up 264% since the process began, and providers win about 85% of arbitrations.",
      src: ["Healthcare Dive","https://www.healthcaredive.com/news/providers-refute-22B-idr-no-surprises-costs-georgetown/829042/"],
      concept: "Bargaining in the shadow of an administered outside option — and who gets to compute it",
      q: "Open with the institutional facts and nothing else: before 2022, an out-of-network emergency physician could bill a patient directly for whatever the insurer did not pay. The No Surprises Act made that illegal, took the patient out of the transaction entirely, and told the provider and the plan to settle it between themselves — with binding arbitration if they cannot. Ask the room what problem that solves. They will get it quickly: the patient in an ambulance is not a shopper, has no information, no time, and no capacity to decline, so the market that was supposed to discipline the price never existed. That is the cleanest example of a missing market a health economics course will ever get, and it is worth dwelling on before you move. Now ask the harder question, which is the one Congress actually had to answer: if the patient is removed, what determines the price? Let them propose answers. Someone will say the insurer and provider should just negotiate. Push: they were already negotiating, and this provider is out of network precisely because that negotiation failed. So the statute has to supply something, and what it supplies is the QPA — the median in-network contracted rate — as the anchor for arbitration. Here is where the seminar turns. Ask who computes the median. The answer is the insurer. Ask what an insurer’s incentive is with respect to that number, and let them derive it rather than telling them: the QPA anchors every arbitration the insurer will face, so a systematically low QPA lowers the expected award across the entire portfolio of disputes. Now ask what the provider’s incentive is with respect to attacking it, and note the number that makes it interesting: providers already win about 85% of arbitrations. So the side attacking the benchmark is the side that is winning. Ask them to reconcile those two facts. There are real answers — it may be that only providers with strong cases file, so the win rate is selected rather than structural; it may be that winning at a low benchmark still yields less than the old balance-billing regime; it may be that the volume increase of 77% is itself the response, with providers filing marginal cases because the expected value is positive. Each is testable and each implies a different policy fix. Then formalise the bargaining problem, because the intuition is worthless until they can draw it. Two parties split a surplus; if they fail to agree, an arbitrator picks a number anchored on b. Ask what happens to the negotiated settlement as b falls. It falls too, even for disputes that never reach arbitration — which is the point students almost always miss. The benchmark does not just decide the 15% of cases that go to arbitration; it prices the 100% that settle in its shadow. That is why both sides fight so hard over a number that most disputes never formally invoke. Now do the part that is really a lesson about research rather than about health care. Put Hoadley’s sensitivity analysis on the board: at 150% of QPA the estimate falls by $1.1bn, at 200% by $2.3bn, out of $22bn. Ask them what he has demonstrated. Not that his critics are wrong about the QPA — he has conceded that entirely, twice over, and assumed the benchmark is off by a factor of two. He has demonstrated that his conclusion does not depend on the assumption they attacked. Ask them to state the general principle, and make them say it out loud: the way to answer a critic who challenges an assumption is to adopt the critic’s assumption and re-run. Then ask the obvious follow-up — why did the societies not publish their own estimate? Let the room be uncomfortable with the answer for a moment. Producing a number invites the same treatment. Attacking one does not. That asymmetry is a permanent feature of policy argument and students should learn to notice which side of it a participant has chosen. Close on the design question, and make them commit. If you were rewriting the statute, who should compute the benchmark? Options on the table: the insurer, as now; an independent third party using all-payer claims data, which several states have; the arbitrator, case by case, with no anchor at all; or a fixed percentage of Medicare, which is what several state laws do. Ask them to name the failure mode of each. All-payer databases are expensive and incomplete. No anchor at all raises variance enormously and invites strategic filing. A Medicare multiple is administrable and blunt, and it imports every distortion already in the Medicare fee schedule. There is no clean answer, and the absence of one is the actual content of this policy area. What students should leave with is the habit of asking, whenever they meet a regulated price, a benchmark, or an index: who calculates it, what do they gain from its level, and what settles in its shadow?"},
    { story: "KFF Health News published a report on Friday on Americans travelling to Europe for in vitro fertilisation, and the price gap is not marginal. A single IVF cycle in the United States runs upward of $29,000 for an insured patient; a full package including genetic testing, storage, pregnancy care and delivery runs more than $54,000. The Solomon family in Florida were quoted $40,000. In Athens, a basic cycle using the patient’s own eggs runs $3,000 to $4,000; Pelargos IVF quotes about $12,000 for a full package including medication, fertilisation, storage and transfer; Serum IVF quotes just under $6,000 excluding embryo freezing. That is a ratio of roughly five to ten to one for the same procedure. The quantity side responded: the number of Americans choosing European clinics rose more than 37% in 2025. The demand side is enormous and mostly unmet — infertility affects about 7 million Americans and only 24% of treatment needs are met — while more than 100,000 babies were born via IVF in the United States in 2024, a record. IVF medication costs alone are up 90% since 2014. Penny Ampatzi, co-founder of Serum IVF in Athens, and William Kiltz of CNY Fertility are among those quoted.",
      src: ["KFF Health News","https://kffhealthnews.org/health-care-costs/ivf-tourism-fertility-in-vitro-fertilization-high-costs-pregnancy-parenthood-greece/"],
      concept: "The law of one price, and what has to be true for a five-to-one gap to survive",
      q: "Write two numbers on the board — $29,000 and $3,500 — say they are the price of the same procedure in two countries, and ask what should happen. Students who have had a trade course will say arbitrage: buyers move to the cheap market, sellers to the expensive one, and the prices converge. Ask them what it would take, physically, to arbitrage this one, and let them work out that the good is a service embodied in a person, so the only way to move it is to move the patient. Then give them the observed response — a 37% increase in one year — and ask whether that is a lot or a little. It is both, and that is the interesting part: it is a very large behavioural response and a very small fraction of the market, which tells you the arbitrage channel exists but is narrow. Now build the list of what keeps the gap open, and insist they be specific rather than gesturing at ‘barriers.’ There is a fixed cost of travel that is large relative to a Greek cycle and small relative to an American one — ask them what that does to who arbitrages, and let them find that the gap is closed only by patients whose valuation is high enough to bear a fixed cost, which selects for people already committed to multiple cycles. There is the continuity-of-care problem, since IVF is not one visit but a monitored sequence. There is legal and regulatory non-portability. There is information: patients do not have prices, because American clinics quote packages that are not comparable across providers. And there is the one that matters most for your course: for a patient with any coverage at all, the relevant price is not the price. Push on that last point until it yields. Ask what fraction of the $29,000 an insured American actually faces. Most face all of it — IVF is excluded from most plans — which is why this market has price transparency at all, and why it responds to price the way ordinary consumer markets do and unlike almost everything else in American health care. Then ask the counterfactual that makes it a health economics question rather than a trade question: if IVF were universally covered tomorrow, what happens to the medical-tourism flow, and what happens to the US price? The flow collapses, because the patient no longer faces the differential. And the price rises, because the constraint that has been holding it — patients paying cash and able to walk — is removed. Have them state the general result carefully, because it is counterintuitive and they will resist it: insurance coverage of a service can raise its price by destroying the demand elasticity that was disciplining it. That is not an argument against covering IVF. It is an argument that coverage design has to anticipate it, and it is exactly why reference pricing and centres-of-excellence contracting exist. Now use the 24% figure, because it is the one that reframes the whole discussion. Infertility affects about 7 million Americans and only 24% of treatment needs are met. Ask what the other 76% represents. It is not a shortage in the usual sense — no clinic is turning away paying patients, and capacity is not binding. It is demand that exists at a lower price and does not exist at $29,000. Have them draw it: the quantity gap is the area under the demand curve between the two prices, and it is enormous. Then ask the welfare question honestly, from both sides. The consumer-surplus loss from the gap is large and concentrated on people who very much wanted children. Against that, ask what the $29,000 is paying for besides the procedure — the answer includes the fixed costs of a laboratory, a genuinely skill-intensive workforce, and, in a market with no coverage, the entire cost of failed cycles borne by successful ones. Close on the comparison that will stay with them. This is the same structure as pharmaceutical international reference pricing, which is in the news this week: the same good, a large cross-border price gap, and a policy debate about whether to import the foreign price. Ask what is different. For drugs the good is portable and the gap is defended by market segmentation and re-importation bans; for IVF the good is not portable and the gap is defended by the fixed cost of a plane ticket. Ask which gap is more likely to survive a decade of policy pressure, and have them defend the answer. Most will say drugs. The right answer is probably the opposite, and the reason is that geography is a more durable barrier than law."},
    { story: "Doximity published a compensation survey on Friday drawing on more than 250,000 responses over seven years, including about 23,000 US physicians in the past year. More than 65% now use AI daily or weekly for clinical or administrative work. Asked who should benefit from the resulting productivity gains, 48% said physicians should be the primary beneficiaries; 43% said compensation should remain unchanged even as AI reduces the time each task takes; 20% favoured sharing the cost benefit; and 17% supported passing the savings to patients as lower costs. Twenty-four per cent expect AI to raise their own compensation within a year. Twenty per cent already report higher productivity expectations because of AI, and 42% are worried about future productivity pressure. Thirty-nine per cent say AI proficiency has become a hiring factor in their specialty. Average physician pay rose 2% last year, down from 3.7% in 2024. The survey is a statement of preferences over the division of a surplus, taken from one side of the bargain, and it is unusually candid: the group closest to the technology, asked directly whether the public should get any of the gains, mostly said no.",
      src: ["Healthcare Dive","https://www.healthcaredive.com/news/physicians-say-they-should-benefit-financially-from-ais-time-savings-doximity/829046/"],
      concept: "Who captures a productivity gain, and why the answer is a bargaining problem rather than an accounting one",
      q: "Start by asking the room, before showing them any of this, what happens to health care costs when doctors get more productive. You will get a near-unanimous answer: costs fall. Write it down, because you are going to spend the hour taking it apart, and the fact that it is the intuitive answer is what makes the exercise worth doing. Now give them the survey and let the 17% land — only one physician in six thinks the savings should reach patients. Ask whether that is greed. Resist the easy yes, and reframe it: it is a preference over the division of a surplus, stated by the party that would have to give it up, which is exactly the answer economics would predict from anyone. The interesting question is not whether they want it. It is whether they can get it. So build the framework. A technology reduces the labour input required per unit of output. Ask what determines how the gain is split between the worker, the employer and the consumer, and steer them toward the three things that actually decide it: whether output expands or hours contract, how competitive the downstream market is, and the relative bargaining power of the parties. Then take each in turn with this specific case. First, the output margin. Ask what a hospital does when a physician can see the same patients in less time. There are two options — see more patients, or work fewer hours — and the survey tells you which is happening: 20% already report higher productivity expectations. So the hours are not falling; the volume is rising. Ask what that implies for the wage. If output per hour rises and hours are constant, the employer captures the increment unless the wage renegotiates, and the 43% who want compensation unchanged as time per task falls are, in effect, asking to be paid for output they no longer produce the old way. Whether that is reasonable depends entirely on who paid for the tool, which is the question to put to them next. Second, the downstream market. Ask whether a hospital that lowers its cost per visit lowers its price. Have them specify the conditions under which it would: many competing sellers, informed price-sensitive buyers, low switching costs. Then ask them to evaluate each condition in a regional hospital market with two or three systems, prices set by negotiated contract, and patients who mostly do not see prices. Cost reduction passes through to price in proportion to competitive pressure, and there is very little here — so a cost saving in a concentrated market is a margin, not a discount. Have them state that as a general result, because it applies far beyond medicine. Third, bargaining power, and this is where the survey has a second story hidden in it. Note the 39% saying AI proficiency is now a hiring factor. Ask what a technology does to a worker’s bargaining position when proficiency with it becomes a hiring criterion. It cuts both ways and they should see both: it raises the return to a skill the physician holds, and it makes the physician more substitutable by anyone else who acquires that skill — including, in medicine, nurse practitioners and physician assistants operating at a higher effective scope. Then ask them to look at the 2% wage growth against 3.7% the year before, and ask whether that is evidence for anything. Make them be careful. It is one year, it is nominal, and there are a dozen confounds. The honest answer is that it is consistent with physicians not capturing the gain and equally consistent with an ordinary labour-market slowdown, and a student who says so has learned more than one who claims it proves the point. Then push into the part that is specific to health care and that the survey does not ask about. If AI raises the number of visits a physician can supply, and physicians in many settings influence the number of visits demanded, ask what happens to volume. This is supplier-induced demand, and it is the mechanism by which a genuine productivity improvement can raise total spending rather than lower it — more encounters, each cheaper to produce, billed at unchanged prices. Ask them what evidence would distinguish that from patients simply getting better access to care they needed. It is a hard question and they should feel that it is hard, because the two are observationally very close and the policy implications are opposite. Close by returning to the sentence they wrote at the start. Productivity gains lower costs only under conditions this market does not satisfy: competitive downstream pricing, price-sensitive buyers, and an output margin that does not expand to absorb the improvement. Ask them to name one part of the health system where those conditions do hold. Retail pharmacy is a decent answer. Generic drugs is a better one. Then ask why those two are the parts where prices have actually fallen — and let them notice they have just derived the answer themselves."}

  pulse: [
    { cat: "Listening", t: "Dolly Parton now holds seven of the top fifteen songs in America, and the deep cuts are moving faster than the hits",
      why: "On the Spotify US daily chart dated Aug 26 — kworb runs a one-to-three-day lag, so this is the freshest available — “Jolene” is No. 1 at 2,023,623 streams, “9 to 5” No. 2 at 1,916,970, “Islands in the Stream” No. 3, “I Will Always Love You” No. 6, “Coat of Many Colors” No. 7, “Here You Come Again” No. 11, and “My Tennessee Mountain Home” at No. 23. She logged 51 million streams in a single day, about thirty-five times her daily average, took her first-ever No. 1 on the US Spotify Top Artists chart, and “Jolene” hit No. 1 on the global chart for the first time in fifty-three years. US streams are up 2,320% and global 1,260%. The detail worth noticing is the ordering of the percentage gains: “My Tennessee Mountain Home” is up 8,920% and “Coat of Many Colors” 5,330%, against 1,225% for “Jolene.” A death does not drive people to the hits they already know — it drives them into the catalogue. And the desk was wrong twice about this: her surge has not begun to decay, it accelerated between the Aug 25 and Aug 26 charts.",
      rec: "Ask what the supply curve for a fifty-three-year-old recording looks like. It is perfectly elastic at essentially zero marginal cost — no pressing, no shipping, no restock lag — which is why a demand shock of this size produces no price effect and no queue, only volume. That is the whole reason music catalogues are now traded as financial assets, and why the interesting variable is not the spike but its decay rate.",
      src: ["kworb (Spotify US daily, chart dated Aug 26)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Playing", t: "A twenty-six-minute video game trailer is the second-biggest movie on Netflix worldwide",
      why: "As of Saturday, Netflix’s global film chart reads: Facing El Chapo at No. 1, Grand Theft Auto VI: An Extended Look at No. 2, The Heat at No. 3, Shrek at No. 4. It is ranked as a film, above a Pixar-era blockbuster and a new release, and it is twenty-six minutes of promotional material for a product that does not exist yet. Sensor Tower data puts Netflix web users up 125% and mobile users up 50% against the average of the previous twelve Thursdays. The exclusivity lasted six hours before it went free on YouTube. Details confirmed in the showcase: the map is three times larger than Red Dead Redemption 2, one developer’s story playthrough ran about eighty hours, there are no microtransactions in the single-player campaign, and Rockstar says no generative AI was used in development. The game runs at 30fps on PS5 and Xbox Series X with a performance mode still undecided — so the 4K60 figure most outlets printed remains wrong, and Take-Two’s Strauss Zelnick has still said nothing about the Netflix terms four days on.",
      rec: "Ask the room who paid whom. Almost everyone assumes Rockstar bought distribution. Then show them the traffic numbers and let them reconsider: a firm with no distribution problem whatsoever, selling a $79.99 game in November, does not need Netflix — but Netflix needs six hours of attention it cannot otherwise buy. The terms are undisclosed precisely because the price would reveal the answer.",
      src: ["PC Gamer (Netflix traffic more than doubled)","https://www.pcgamer.com/games/grand-theft-auto/netflix-is-likely-pleased-as-punch-with-the-gta-6-extended-look-which-more-than-doubled-its-web-traffic/"] },
    { cat: "Watching", t: "Two deaths in forty-eight hours whose audiences are almost entirely under twenty-five",
      why: "Tim Curry died Aug 26 at 80 and Peter Cullen died Aug 27 at 85, and the thing they have in common is that the twenty-year-olds in your lecture hall know both of them without knowing they do. Curry’s Frank-N-Furter survives through participatory midnight screenings of The Rocky Horror Picture Show — a fifty-year-old film that persists not as a text but as a live event, with a script the audience performs. Cullen voiced Optimus Prime continuously from the 1984 cartoon through every live-action Transformers film since 2007: a single voice spanning three generations of the same intellectual property, which is why a student who has never seen the original series still recognises it instantly. His family asked that he be honoured by serving communities “with compassion, integrity and loyalty,” and left a line worth repeating: “be strong enough to be gentle.” This desk found both only because it added a standing daily check for cultural deaths after missing Dolly Parton for two runs.",
      rec: "Ask why Rocky Horror survived when films of the same year did not, and refuse the answer “it’s a cult classic.” It survived because it converted a private good into a club good — the value is not the film, it is the room, and the room requires other people. That is a network effect with a fifty-year time series, and it explains why the film is nearly unwatchable alone and unmissable in company.",
      src: ["The Mary Sue (three losses in one week)","https://www.themarysue.com/three-legends-gone-in-one-heartbreaking-week-peter-cullen-dolly-parton-and-tim-curry-leave-behind-unforgettable-legacies/"] },
    { cat: "Reading", t: "The bestseller lists have two books by the same man, and both started as a free serial on a forum",
      why: "Book Riot’s Aug 27 roundup of the five major bestseller lists has Matt Dinniman on it twice — Dungeon Crawler Carl on all five, and Carl’s Doomsday Scenario on three. Five titles made all five lists: Allen Levi’s Theo of Golden, Caro Claire Burke’s Yesteryear, Ann Patchett’s Whistler, Dinniman, and Kathryn Stockett’s The Calamity Club. The pipeline behind Dinniman is the one to notice, because it is the same pipeline that produced everything else your students read: serialised free on Royal Road, then Kindle Unlimited, then self-published ebooks, and only then a print deal — Ace bought print rights only in 2024 and he still publishes the ebooks himself. The audiobooks, through Soundbooth Theater, outsell print and ebook combined. So the traditional publisher bought the smallest of three channels, on a book whose quality signal came from readers rather than editors, several years after those readers had already supplied it.",
      rec: "Ask a student who reads this series how they found it. It will be a friend, a TikTok or an Audible recommendation, and none of those is a bookstore. Then ask what function the publisher’s gatekeeping used to perform, and who performs it now — the answer is an audience with skin in the game, which is a better signal in some respects and a much worse one in others.",
      src: ["Book Riot (bestsellers, Aug 27)","https://bookriot.com/bestselling-books-august-27-2026/"] },
    { cat: "Online", t: "“2026 is the new 2016” started as a joke on r/genz and is now visible in the actual charts",
      why: "The premise traces to an Aug 2025 Reddit post by a user arguing that 2026 would repeat 2016 — GTA 6, Battlefield 6, a World Cup, a Shrek sequel — and it spread through 2026 as a nostalgia bit: an Instagram video with 13 million views, a slideshow past 105,000 likes, a Jacksepticeye post past 441,000. What makes it worth a card now is that the joke has started showing up in demand data rather than engagement metrics. Shrek is the No. 4 film on Netflix worldwide today. The Killers’ “Mr. Brightside” — twenty-two years old — sits at No. 13 on the US Spotify daily chart, in its 312th week on the weekly chart. And Lia Haberman’s ICYMI reports the same students deliberately posting in a 2016 style to game the 2026 Instagram algorithm. Be careful with the framing, though: the meme entry was catalogued in January, so this is not a twenty-four-hour story. It is a standing trend that is now cashing out in measurable consumption.",
      rec: "The interesting question is not why they are nostalgic for a decade they barely remember — it is why the nostalgia coordinated on a specific year. Ask them. A shared focal point is what makes a reference legible to strangers, and 2016 works because it is far enough back to be a place and close enough that the artefacts are all still one click away.",
      src: ["Know Your Meme (2026 is the new 2016)","https://knowyourmeme.com/memes/2016-trend-2026-is-the-new-2016"] },
    { cat: "Online", t: "itch.io restored the free adult games and left the paid ones delisted — which tells you exactly where the censorship lever sits",
      why: "This is the sharpest available version of the payment-processor story your students already half-understand. After a site-wide takedown last year, the game marketplace itch.io restored free adult content but left paid titles delisted — and developers found the workaround immediately, which was to relist at a price of zero and move the money off-platform to Patreon and donation links. Same content, same platform, same audience; the only variable is whether a card transaction is attached. Read the sequence against that: Steam, itch.io, Gumroad, Tumblr and now Wattpad, which rewrote its guidelines on Aug 10 to ban content “created primarily for sexual arousal” and lost a large part of its base to Archive of Our Own within days — catalogued by Know Your Meme as “The Wattpad Migration” on Aug 27, the same day it happened. AO3 is the control case: it is donation-funded, no card transaction touches any individual work, and it is the only platform in the whole sequence that never changed its rules. It did not have to be brave. It was structurally out of reach.",
      rec: "Ask which platform folds next and make them justify it from the funding model rather than the content policy. Students who can predict a moderation decision from a balance sheet have learned something that transfers directly to app stores, ad networks and cloud hosting.",
      src: ["GamesHub (itch.io restores free NSFW games, paid stay delisted)","https://www.gameshub.com/news/news/itchio-nsfw-games-restored-2791314/"] }
  ],
  classnote: { t: "Coyote vs. Acme opened Friday and took $1.7 million in Thursday previews at 96% on Rotten Tomatoes, tracking somewhere between $17 and $20 million for the weekend. Take the whole sequence to a principles class, because every number in it is public and the arithmetic does not come out the way students expect. Warner Bros. produced the film for about $70 million — one source puts the original budget at $30 million, and the discrepancy is worth flagging rather than smoothing, since it is the difference between a modest write-off and a large one. In November 2023 the studio shelved the finished film, unreleased, to claim a tax write-off of roughly $30 million. A public campaign followed. In 2025 Warner sold it to Ketchup Entertainment for about $50 million, and Ketchup has spent roughly $10 million releasing it. Start by asking the room whether shelving it was rational, and make them separate two questions they will want to merge. The first is whether the $70 million was recoverable — it was not, it was spent, and no decision in November 2023 could unspend it. Students will nod at that and then immediately reason from it anyway, which is why sunk cost is worth teaching with a live example rather than a textbook one. The second question is the real one: given the money was gone, was $30 million in tax value greater than the expected value of releasing? Have them list what the studio would have needed to believe. A theatrical release costs real marketing money on top of the production spend; the film had no stars of the first rank; the write-off was certain and immediate while box office is uncertain and delayed. Those are not stupid beliefs. Then show them what happened: the asset the studio valued at $30 million sold, two years later, for about $50 million — so the decision taken to capture $30 million forwent a $50 million sale, a gap of roughly $20 million before counting two years of foregone revenue and the reputational cost of becoming the studio that buried a finished film. Ask them to name the error precisely, because “they were wrong” is not an answer. The error is not the write-off; it is that the studio priced its own asset using its own distribution capability as the only counterfactual. It never asked what the film was worth to a firm with a different cost structure — and Ketchup, a small distributor with low overhead and no slate to protect, had exactly that. Have them state the general result: an asset’s value is not a property of the asset, it is a property of the asset and its owner jointly, and a firm that only ever values assets in its own hands will systematically undervalue the ones worth more in someone else’s. That is the entire logic of divestiture, of secondary markets, and of why private equity exists. Now add the comparison that makes the weekend interesting. The other new wide release, The Dog Stars, carries a budget reported anywhere from $70 to $110 million, has a 40% Rotten Tomatoes score and took $850,000 in previews — roughly half what a shelved film did on a fraction of the spend. Ask what that pair does to the standard intuition that budget signals quality or that studios can identify their own good films. Then ask the harder question, which is about the campaign. Producer Chris DeFaria described the objective as making sure the film “was never viewed as a failure, that it wasn’t being shelved because it was a bad movie.” Ask what the fan campaign actually produced. It did not change the film. It changed the information available to potential buyers about demand — and in doing so it raised the reserve price on an asset whose owner had already written it to zero. Ask them whether that is a market working or a market failing, and let the disagreement stand: the information existed all along, and it took two years and a public campaign to reach a buyer. Close on the tax rule itself, since this is a policy course as much as a pricing one. A write-off is only available for content that is never released, which means the tax code pays a studio, at the margin, to destroy the consumer surplus a completed film would generate. Ask them to design a rule that preserves the legitimate purpose — letting firms recognise genuine losses — without that incentive. It is harder than it sounds, and the difficulty is the lesson.",
    src: ["World of Reel (Coyote vs. Acme’s $1.7m previews)","https://www.worldofreel.com/blog/2026/8/28/box-office-coyote-vs-acme-eyes-17m-opening-after-17m-thursday-the-dog-stars-bombs-with-850k"] },

function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {

      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
