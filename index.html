  hooks: [
    { story: "The FDA approved daraxonrasib — brand name Rasonque, from Revolution Medicines — on Thursday, six months ahead of its target action date. It is the first drug to attack a genetic cause of pancreatic cancer, targeting mutated RAS and KRAS proteins present in more than 90% of cases. In a trial of roughly 500 patients with metastatic disease in the second-line setting, median overall survival was 13.2 months against 6.7 months on chemotherapy. Pancreatic cancer kills more than 52,000 Americans a year out of about 67,000 diagnoses, and five-year survival is 13%; this is the first meaningful movement in decades, and the clinician quoted by the wire is careful about what it is — Dr Andrew Coveler of the Fred Hutch Cancer Center: “this medicine is not a cure but a significant improvement.” The list price is about $39,800 a month. Put those two numbers in the same sentence and the classroom problem writes itself: a median gain of roughly 6.5 months, at a price that implies something on the order of half a million dollars for a patient who survives the median course. On the same day, the administration was reported to be finalising deals with mid-sized biotech firms under which they would offer state Medicaid programmes discounts benchmarked to international prices — voluntarily, and in exchange for exemption from Medicare pilot programmes that would require the same discounts, plus tariff relief in some cases.",
      src: ["NPR / AP","https://www.npr.org/2026/08/27/g-s1-140410/fda-approves-landmark-pancreatic-cancer-drug"],
      concept: "Pricing a good with almost no substitutes, and what a cost-effectiveness threshold is actually doing",
      q: "Open by writing only the clinical result on the board — 13.2 months against 6.7 — and asking whether the drug is worth it. Let the room split, then refuse to let anyone answer until they have told you worth what, to whom, and instead of what. That refusal is the lesson; almost every argument students have heard about drug prices is conducted without those three specifications, and it is why those arguments never resolve. Now build the seller’s problem properly, because students arrive convinced the price is set by greed and leave understanding that greed alone does not pick a number. Ask what the firm’s marginal cost of manufacturing another month of a small-molecule drug is. It is small — the expensive thing already happened, in a laboratory, years ago, and it happened whether or not this compound worked. Ask what that implies for pricing. If price were set at marginal cost, the firm would never have run the trials, so the entire return to discovery has to be collected in the gap between price and marginal cost during the patent term. This is the standard defence of pharmaceutical pricing and students should be able to state it in its strongest form before they attack it. Then attack it. Ask what disciplines the price. In an ordinary market, substitutes. So ask what the substitutes are here, and make them say the answer out loud: chemotherapy with a median survival of 6.7 months, or nothing. A patient with metastatic pancreatic cancer facing that choice has a demand curve that is close to vertical over any price they can conceivably finance. Ask what a profit-maximising firm charges when demand is vertical and the buyer is not the patient but an insurer, and let them find the real constraint: the price is not disciplined by the patient’s willingness to pay, it is disciplined by the payer’s willingness to cover. That is an entirely different mechanism and it is where the policy lives. Now do the arithmetic, because it is the part that changes minds. At $39,800 a month, a patient who survives the median 13.2 months on the drug generates roughly $525,000 in drug spending. The incremental gain over the comparator is about 6.5 months. Have them compute the implied cost per life-year gained — it lands somewhere near $970,000, and it will be higher once you adjust for quality of life in metastatic disease. Then ask them where the commonly cited thresholds sit: $50,000 per QALY is the number they will have heard, $100,000 to $150,000 is closer to what is used in practice, and the UK’s NICE works from roughly £20,000 to £30,000. So this drug misses every threshold anyone uses, by a factor of five or more. Then ask the question that makes it a seminar rather than a calculation: given that, should Medicare cover it? Most of the room will say yes, and they should be made to explain why they are willing to abandon a threshold they accepted thirty seconds earlier. The good answers are real and they should be drawn out rather than supplied. One is the end-of-life argument — that society appears to weight a month of survival more heavily when there are few months left, which is a stated preference thresholds do not encode. One is the option-value and innovation argument — that refusing to pay for a first-in-class drug changes what gets developed next, so the price is buying future drugs as well as this one, and the true comparison is not against chemotherapy but against the counterfactual in which nobody attacked KRAS at all. One is the equity argument — that a threshold applied disease by disease systematically disfavours rare and rapidly fatal conditions, because there are fewer patients to spread fixed costs across and less time in which to accrue benefit. Each of these is a reason to override a threshold, and each of them, if accepted generally, dissolves the threshold entirely. Ask them to name a rule that lets in daraxonrasib and keeps out something they would want to exclude. They will find it hard, and the difficulty is the actual content of coverage policy. Close on the second story, which is a bargaining problem dressed as pricing policy. The administration is offering firms an exemption from a mandatory Medicare discount programme in exchange for voluntary discounts to state Medicaid programmes benchmarked to international prices. Ask what a firm gives up and what it gets. Then ask the sharper question: what does it tell you about the expected stringency of the mandatory programme that firms are willing to pay to be exempted from it? A voluntary agreement priced against a compulsory alternative reveals the shadow price of the compulsory alternative — which is information the government has and the public does not. And ask who is absent from the bargaining table. State Medicaid programmes are the payers, participation is optional for them, and they were not party to the negotiation."},
    { story: "On August 10 Wattpad revised its content guidelines to prohibit pornographic content “created primarily for sexual arousal,” along with non-consensual acts, sexual violence and content involving minors. Within days a large share of its writers and readers had decamped to Archive of Our Own. Know Your Meme catalogued the exodus as “The Wattpad Migration” on August 27 — the same day it happened, which is itself unusual — with individual posts about it drawing 24,000 likes and 227,000 views. Wattpad insists only the wording changed, not the enforcement: “Wattpad has always been a place to tell stories that are steamy, complicated, romantic, weird, emotional, and everything in between.” Users report deletions. AO3’s response is the interesting document: “no plans to change the content we allow on AO3, and we stand by our commitment to maximum inclusiveness of fanwork content,” along with the pointed clarification that “we don’t make decisions based on how many times something is reported” — issued because some arrivals immediately began mass-reporting work they disliked. The part that makes this an economics story rather than a moderation story is the cause. Book Riot attributes the pattern to “increasing censorship of sexual content as orchestrated by payment processors,” and Kotaku names the prior targets of the same pressure: Steam, itch.io, Gumroad and Tumblr. AO3 is the control case. It is a donation-funded nonprofit with no advertising and no card-processed transactions attached to the works themselves — and it is the one platform in the sequence that did not change its rules.",
      src: ["Know Your Meme","https://knowyourmeme.com/memes/events/wattpad-migration"],
      concept: "Market power in a complementary input, and why the binding constraint is rarely where the rules are announced",
      q: "Start by asking who regulates speech on the internet, and write down whatever they say. You will get platforms, governments, advertisers, maybe the EU. Then put the sequence on the board — Steam, itch.io, Gumroad, Tumblr, Wattpad — and ask what those five have in common that AO3 does not. Give them a minute. Someone will get it: the five take card payments and AO3 does not. Then tell them the answer to your opening question is Visa and Mastercard, and watch the room decide whether you are joking. Now formalise it, because the intuition is worth very little until they can draw it. A platform selling access to content needs two inputs it cannot produce itself: hosting, which is competitive and cheap, and payment processing, which is neither. Ask them to describe the market structure in card processing. Two networks handle the overwhelming majority of card volume, they are not close substitutes for a merchant who wants to reach ordinary consumers, and there is no third option a mass-market platform can switch to at reasonable cost. So payment processing is a complementary input supplied by a duopoly, and the platform’s demand for it is close to perfectly inelastic — a content platform that loses card acceptance does not shop around, it dies. Ask what that does to bargaining power over terms that are not price. This is the step students almost never see, and it generalises enormously: a firm with market power in an essential input can extract concessions in dimensions that have nothing to do with the price of the input. The processors are not charging Wattpad more. They are telling it what it may host. Now ask why they would want to. The honest answer has several parts and none of them is a conspiracy: chargeback and fraud exposure is genuinely higher in adult content; reputational and political risk is real and asymmetric, since a processor gains nothing from permissive content and can lose a great deal from a scandal; and the cost of imposing a restriction is borne almost entirely by the merchant. Have them notice the externality — the processor internalises its own risk and none of the value the restricted content creates for readers and writers, so the privately optimal restriction is more stringent than the socially optimal one, and would be even if the processor were entirely well-intentioned. Then run the identification exercise, because AO3 is a natural experiment sitting in plain sight. If the cause of the rule changes were public pressure, or advertiser pressure, or state regulation, AO3 would be under the same pressure — it is larger and more visible than several of the platforms that folded. It is not, and the only structural difference is that its money arrives as donations rather than as card payments attached to the works. Ask them what that identifies and what it does not. It is one observation, and there are other differences — nonprofit governance, no shareholders, a user base that self-selects. But the direction is hard to argue with. Then push on the migration itself, which is a nice small exercise in switching costs. Ask why the exodus was so fast. Fanfiction is unusually portable — it is text, authors hold their own copies, there is no algorithmic accumulation to lose, and the readers move as a community rather than individually. Compare that to a musician leaving Spotify or a seller leaving Amazon. Ask what makes those switching costs high and this one low, and let them derive that the platform's bargaining power over its users is a function of what it holds that they cannot take with them. Wattpad held almost nothing. Finally, the policy question, and make them take a position. If you think the current arrangement produces too much restriction, what would you change? Regulating processors as common carriers has an obvious appeal and an obvious problem — it forces a private firm to bear risk it did not choose. Requiring disclosure of processor-mandated terms is cheaper and probably does less, but it would at least move the argument to where the decision is actually made, which is the single most useful thing you can do to a debate being conducted in the wrong venue. And subsidising payment alternatives is a real proposal that nobody has costed. Students who leave able to say “the rule was announced by Wattpad and made by Visa” have learned something they will use on a dozen unrelated markets, starting with app stores."},
    { story: "The H-1B petition fee published in the Federal Register on August 25 is not the round $100,000 everyone has been repeating. The document proposes “a $103,265 fee, payable at the time of filing, for all H-1B cap-subject petitions, including those eligible for the advanced degree exemption” — a flat charge, per petition, at filing, regardless of the job, the salary, the employer’s size or whether the petition is ultimately granted. Comments close September 24, and the Federal Register page reports that 3,169 comments have already arrived at regulations.gov in three days. What is not in the document is a claim circulating widely in coverage: that DHS’s own analysis found the fee would paralyse 76% of small businesses. The rule’s actual small-entity language is much weaker — that “some employers, including small entities, may file fewer petitions as a result of this proposed rule” — inside an Initial Regulatory Flexibility Analysis. Meanwhile the higher-education associations that would ordinarily be first to comment have filed nothing on this docket; every ACE, AAU or NAFSA item that surfaces dates from October 2025 and responds to a different instrument. And a separate NAFSA projection published August 11 estimates the combined visa changes will cost US institutions about 111,000 international students, $3.4 billion in direct revenue and nearly 40,000 jobs.",
      src: ["Federal Register","https://www.federalregister.gov/documents/2026/08/25/2026-17324/fee-for-certain-h-1b-petitions"],
      concept: "A fixed fee is not a tax rate: how a lump-sum charge sorts rather than shrinks",
      q: "Write $103,265 on the board and ask what kind of instrument it is. Someone will call it a tax on immigration, and that is close enough to start with and wrong in the way that matters. Ask what it is a tax on — per worker? per dollar of wage? per hour? It is per petition, and it does not scale with anything. Then ask the question that opens the whole problem: two employers file for the same visa, one for a postdoctoral researcher at $62,000 and one for a machine-learning engineer at $340,000. What does each pay? The same. Ask them to compute the fee as a share of first-year salary in each case — about 167% and about 30% — and let them sit with that for a moment, because it is the entire policy. A flat fee is a proportional tax only if everyone is the same, and the moment they are not, it is a screen. Now make them do it properly. Have them write down an employer’s decision rule: file if the expected surplus from hiring this specific worker, over the best domestic alternative, over the visa term, exceeds $103,265 plus the ordinary costs. Ask what happens to the marginal petition. It disappears — and ask them to characterise which petitions are marginal, because that is the whole distributional result. They are the ones where the surplus over the domestic alternative is smallest: lower-wage roles, shorter expected tenures, employers who cannot spread the cost over many hires, and — this is the one that lands in this building — universities, hospitals and nonprofits, where the wage is set by a salary scale that cannot absorb a six-figure shock and the surplus is real but not large in dollars. Ask them to predict, before you tell them, which sectors the fee removes from the market entirely. Then complicate it in the direction the proponents would argue, and give that argument its full strength, because the room is likely to be unanimous and unanimity is bad for them. The stated purpose of a high fee is precisely to screen: if the concern is that H-1B has been used to substitute for domestic workers at the low end rather than to acquire genuinely scarce skills at the high end, then an instrument that removes exactly the low-surplus petitions is doing what it was designed to do. Ask them to state the conditions under which that argument is right. It requires that surplus over the domestic alternative correlates with the social value of the hire — and it is worth asking whether a $62,000 postdoc running a lab’s experiments has less social value than a $340,000 engineer, and what would have to be true for the fee to be a good proxy. That is where the argument actually breaks, and students should break it themselves rather than be told. Then the incidence question, which is the health-economics habit worth building. Ask who pays the $103,265. Not the government — it receives it. The naive answer is the employer. Push: in a competitive labour market, what happens to the worker's wage when hiring them carries a large fixed cost the employer cannot avoid? Some of it is shifted into lower wages, and the share depends on the elasticity of the worker's labour supply — and a worker who needs this specific employer for their visa has very inelastic supply, which means the incidence lands heavily on them. Then ask what happens to the wages of comparable domestic workers if the fee removes enough foreign supply, and let them find the intended effect and the ambiguity in it. Finally, use the 3,169 comments, because it is a live natural experiment in revealed preference. Three thousand comments in three days is an enormous rate for a fee rule. Ask what it measures. It measures the intensity of preference among people who both know the docket exists and can write, which is not the same as the distribution of the affected population — and the composition is not obtainable, since regulations.gov will not render its own comments to an automated reader. Then close on the absence. Not one higher-education association has filed on this docket, inside a live thirty-day window, on a rule that a separate projection says will cost the sector $3.4 billion. Ask them what would explain that. Options include a collective-action problem — every institution wants the associations to spend the political capital, none wants to be the one visibly opposing the administration; a strategic judgment that comments do not change rules and litigation does; and simple capacity, since the same offices are simultaneously handling the duration-of-status litigation and the CPT reinterpretation. Ask which explanation is testable, and what you would look for in September to distinguish them. That is the assignment."}
  ],
  pulse: [
    { cat: "Playing", t: "The GTA VI reveal ran 26 minutes, broke Netflix for three, and told everyone the game runs at 30fps",
      why: "It premiered yesterday at 3 p.m. Eastern on Netflix and went free on YouTube at 9, exactly six hours later, and it passed 1.5 million YouTube views inside about three hours of going free. Two things resolved that were unverified going in. The runtime was never Rockstar’s number — Netflix’s own app listing said 26 minutes, which users found Thursday morning, and several outlets that had pre-written “nearly 30 minutes” never corrected. And the 4K60 spec that every outlet printed is now effectively refuted: Netflix said only that it was “captured entirely from in-game footage on PlayStation 5,” base console not Pro, and on the same day Rockstar co-director Rob Nelson told a YouTuber at the Edinburgh office that the game is “currently targeting 30fps on all consoles,” with no decision on a 60fps mode. What was in it: Jason Duval and Lucia Caminos, a relationship system with deeper consequences than Red Dead’s honour meter, missions only one protagonist can take, dodge mechanics in melee, and a great deal of Vice City. What was not: radio stations, the wanted system, GTA Online, PC. At 3:00 p.m. the Netflix homepage returned errors worldwide and was normal again by 3:03.",
      rec: "The three-minute outage is the interesting artefact, because it is a measurement. Ask the room what Netflix bought — they will say subscribers, and the honest answer is that nobody has said. Then ask what Netflix got that it can point to, and let them arrive at a globally legible demonstration of simultaneous demand that no view counter delivers for a day.",
      src: ["Push Square (Rockstar on 30fps)","https://www.pushsquare.com/news/2026/08/gta-6-targeting-30fps-on-ps5-undecided-on-performance-mode"] },
    { cat: "Listening", t: "Dolly Parton died Tuesday, her streams rose 2,320% — and she still could not take No. 1",
      why: "This desk missed it for two runs and should say so plainly: Parton died on August 25 at 80, of cancer, at the Vanderbilt-Ingram Cancer Center in Nashville. On the Spotify US daily chart dated August 25 she took four of the top fifteen — “Jolene” at No. 2 with 1,294,067 streams, “9 to 5” at No. 3 with 1,134,063, “Islands in the Stream” at No. 8, “I Will Always Love You” at No. 15 — with US streams up 2,320% and global up 1,260%, a single-day total of 19.8 million against roughly 1.4 million the day before. Her under-25 audience is not inherited; it was built by two specific distribution accidents, Hannah Montana on the Disney Channel and Beyoncé’s “Jolene” on Cowboy Carter in 2024. And what blocked her from No. 1 is the number worth teaching: Ella Langley’s “Choosin’ Texas” at 1,351,602, unmoved, in its forty-fourth chart week — and on the Hot 100 dated August 29 it took a nineteenth week at No. 1, tying “Old Town Road” and “A Bar Song (Tipsy)” for the longest non-holiday run ever. A death produces one enormous day. Langley has had forty straight good ones.",
      rec: "Put the two numbers side by side and ask which is the more interesting one. A 2,320% spike is a demand shock with a known decay; a forty-four-week hold is a flow. Catalogue valuation runs on the second, which is why the spike makes headlines and the hold makes the money.",
      src: ["kworb (Spotify US daily, Aug 25)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Watching", t: "The movie a studio destroyed for a tax deduction opens today, and the arithmetic does not work",
      why: "Coyote vs. Acme opens Friday from Ketchup Entertainment on a forecast of $8 to $17 million. The numbers behind it are now firm and they are strange. Warner Bros. spent about $70 million producing it, shelved the finished film in November 2023 for a roughly $30 million tax write-off, and after a public campaign sold it in 2025 for about $50 million. So the shelving decision, taken to capture $30 million, was ultimately worth $20 million less than the sale it delayed — before counting two years of forgone revenue and the reputational cost of being the studio that buried a finished film. Producer Chris DeFaria’s line explains how the campaign was fought: “we wanted to make sure that it was never viewed as a failure, that it wasn’t being shelved because it was a bad movie.” The wider frame is a record month. August 2026 finished at $1.1 billion domestic, the highest-grossing August ever, beating 2016’s $1.019 billion — with Spider-Man: Brand New Day supplying about $685 million of it, roughly 62% of the month, and the top two films together about 78%. Spider-Man is forecast at $22 to $27 million this weekend, chasing a fifth consecutive No. 1.",
      rec: "Ask which fact about this weekend is more surprising: that a buried film is opening, or that one movie is 62% of a record month. The second is the one with consequences — a record built on a single title is a record about concentration, not about moviegoing recovering.",
      src: ["Cartoon Brew","https://www.cartoonbrew.com/distribution/coyote-vs-acme-budget-distribution-265524.html"] },
    { cat: "Online", t: "Wattpad changed its rules and the whole fanfiction economy moved in a week",
      why: "On August 10 Wattpad banned pornographic content and, within days, a large part of its writer and reader base had relocated to Archive of Our Own. Know Your Meme catalogued it as “The Wattpad Migration” on August 27 — same-day documentation, which is rare and is itself a signal about how visible the move was. Wattpad says only the wording changed: “Wattpad has always been a place to tell stories that are steamy, complicated, romantic, weird, emotional, and everything in between.” Users report deletions. AO3 said it has “no plans to change the content we allow” and, notably, “we don’t make decisions based on how many times something is reported” — because some arrivals immediately began mass-reporting work they disliked. The part students have worked out and most adults have not is the cause. Book Riot attributes the whole pattern to pressure from payment processors, and the same sequence has already run through Steam, itch.io, Gumroad and Tumblr. AO3 takes donations, not card payments on the works — and it is the one platform that did not change its rules.",
      rec: "This is the cleanest available example that the binding constraint online is often two card networks rather than a platform or a government. Ask a student who moved why they moved; then ask them who they think actually wrote the rule. Most will name Wattpad, and the follow-up is why AO3 is exempt.",
      src: ["Book Riot","https://bookriot.com/wattpad-censorship/"] },
    { cat: "Reading", t: "He kept the digital rights, and now he is trading royalty rate for library shelf space",
      why: "Matt Dinniman serialised Dungeon Crawler Carl on Royal Road in 2019 and self-published book one in October 2020. In 2024 Ace Books, a Penguin Random House imprint, bought print rights only; he kept digital and still publishes the ebooks himself. Ten million-plus copies across eight books, book one alone at 2.7 million, nineteen consecutive weeks on the New York Times list — and audiobook sales through Soundbooth Theater with narrator Jeff Hays exceed print and ebook combined, above three million on their own. So the largest of his three channels never touched a publisher, the second largest is self-serve, and the traditional house bought into the smallest. The new development is a deliberate margin sacrifice: the ebooks are leaving Amazon exclusivity for Libby, reaching library systems for the first time, while the audiobooks stay Audible-exclusive. Book Riot notes he likely earns less per unit than under Amazon’s exclusive split. He is buying discovery with royalty rate.",
      rec: "Ask a student who reads this series how they found it. The answer will be a friend, a TikTok, or an Audible recommendation, and none of those is a bookstore — which is precisely why he could keep two-thirds of his rights and still be on the bestseller lists.",
      src: ["Book Riot","https://bookriot.com/bestselling-books-august-20-2026/"] },
    { cat: "Online", t: "Only 5% want to be creators, 68% use AI for homework, and the youngest adults are the ones against phone bans",
      why: "Lia Haberman’s ICYMI back-to-school playbook is still the current edition and is worth mining in layers rather than reading once. Three findings that cut against what faculty tend to assume. First, career preferences: 5% of Gen Z and Alpha want creator careers, against 18% naming tech entrepreneur, 17% professor and 14% doctor. The creator-economy panic is not describing what these students actually want. Second, AI: 68% of middle and high schoolers use AI chatbots for homework — but about half worry it gives harmful advice, 40% worry it manipulates people, and more than half say they dislike AI-generated content compared to human-made work. They are heavier users and more sceptical consumers at the same time, which is not a contradiction so much as the position of someone who has actually used the tool. Third, and the one to sit with: 48% of Americans back all-day school phone bans against 43% opposed — and support is lowest among the youngest adults. The people closest to the experience are the least convinced. On spending: 50% of Gen Z deliberate two or more days before buying, and 62% avoid weekend plans specifically to sidestep a “spending hangover.”",
      rec: "The phone-ban split is the one to raise, because it inverts the usual framing. Rather than asking whether students support restrictions, ask why proximity to the experience reduces support — and be open to the answer that they know something about the substitution effects that the survey’s older respondents do not.",
      src: ["ICYMI (Lia Haberman)","https://liahaberman.substack.com/p/icymi-gen-z-alpha-back-to-school"] }
  ],
  classnote: { t: "Rockstar released a 26-minute video about a video game to Netflix at 3 p.m. Eastern on Thursday and to everyone free on YouTube at 9 p.m. — a six-hour window, after which the product is identical and costs nothing. Take that to a principles class and ask what was sold, because the answer is not the video. Netflix’s cheapest tier is $8.99 with ads, then $19.99 standard, then $26.99 for the 4K HDR that would be the only reason to prefer watching it there. Nothing was permanently withheld from anyone. So have them write down what a viewer who watched at three bought that a viewer who watched at nine did not, and the answer is six hours. This is intertemporal price discrimination in almost laboratory form — the hardback-then-paperback problem, the theatrical-then-streaming window, the same mechanism stripped of every confound. Have them sketch the demand curve for impatience, and then ask the harder question: who exactly is on the steep part of it? Not, mostly, people who wanted the information sooner; the information had no time-sensitive use. It was people for whom watching first had social value inside a group that would be discussing it. That is a positional good, and it is why the window works at six hours when it would not work at six minutes or six days. Then push on the seller side, because the deal has an unusual asymmetry. Take-Two’s Strauss Zelnick declined to disclose terms and said in early August that the rationale would be clear once people had watched; it is now the morning after and neither he nor Rockstar has said anything further, so the rationale has to be inferred. Ask what Netflix could plausibly have paid for. Not exclusivity, which it had for a third of a day. Not retention, since nothing stops a viewer cancelling on Friday. What it bought was attention it can measure and point to — and it got a demonstration: at 3:00 p.m. the Netflix homepage returned errors worldwide, and was working again by 3:03. Three minutes of failure is a more legible proof of simultaneous demand than any number Netflix could have published, and it arrived free. Ask them whether a firm can rationally value an outage. Then make it a two-sided-market problem, which is what it actually is. Rockstar has a product with no distribution problem whatsoever — a $79.99 game arriving November 19 that will sell tens of millions of copies whatever it does in August. Netflix has distribution and a hunger for events. Ask which side needed the other more, and let them notice that the terms are undisclosed precisely because the answer would be legible from the price. Finally, the counterfactual, which is where I would leave them. We can observe that the video passed 1.5 million YouTube views within roughly three hours of going free. We cannot observe what it would have done with no Netflix window at all — whether the six hours added anticipation or merely relocated it. Ask them to design the experiment that would settle it, and let them discover that Rockstar will never run it, because the firm only gets one launch and has no incentive to learn the answer at the cost of the outcome. That is the honest condition of most marketing decisions, and it is worth saying out loud in a course that spends its time on problems where the counterfactual is assumed available.",
    src: ["Push Square (the Netflix window explained)","https://www.pushsquare.com/guides/gta-6-netflix-extended-look-when-and-how-to-watch"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
