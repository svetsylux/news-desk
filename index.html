<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "The war’s heaviest civilian toll in this window landed on Kyiv overnight. Ballistic and Kalibr missiles, Zircons launched from Kursk Oblast and jet-powered drones hit the Sviatoshynskyi, Solomianskyi, Shevchenkivskyi and Darnytskyi districts; a nine-storey residential building collapsed and burned, a children’s hospital in Solomianskyi was damaged, and impacts were reported at a dozen-plus locations including a school and warehouses. The count moved all night and is best read as a snapshot rather than a fact: Kyiv Post had 5 killed and 23 injured at 1 a.m. Kyiv time, Al Jazeera 3 killed and 20 wounded at 2:50 UTC — its own headline said six while its body said three, mid-update — the Kyiv Independent 8 and 33, and Meduza and CNN at least 12 killed with more than 30 injured by morning. Mayor Vitali Klitschko: “Explosions in the capital. Kyiv is under ballistic attack,” and later, “People are trapped.” A day earlier Russian Banderol-type jet drones struck the National Police headquarters in Zhytomyr Oblast, killing two and injuring at least 40 by the Kyiv Independent’s count and 20 by Meduza’s; First Deputy Head of the National Police Maksym Tsutskiridze called it “a cynical attack by Russian forces.” CNN’s framing of the night: “Russia again exploits Ukrainian air defense shortages.”",

      { t: "The mirror ledger is where the two vantage points separate most sharply. Russia’s Defense Ministry, via TASS, reported 453 Ukrainian drones intercepted between 8 p.m. and 8 a.m. Moscow time across twenty-one-plus regions. Meduza’s independent tally for the same night names four — Bashkortostan, Nizhny Novgorod, Vladimir and Tula — and the named governors’ own posts account for a small fraction of the ministry’s figure: Bashkortostan head Radiy Khabirov said six drones targeted Ufa and four were shot down; Vladimir’s Alexander Avdeev reported damage to dacha structures; Nizhny Novgorod’s Gleb Nikitin said “an attack by 52 drones was repelled,” and Tula’s Dmitry Milyaev counted 27. What is not in dispute is the target set. A unit under repair at the Ufa oil refining hub, roughly 1,200 km from the border, caught fire, and Ukraine’s General Staff separately claimed strikes on the Progress Rocket and Space Center and the Aviakor plant in Samara using Flamingo missiles — “Strikes on facilities of this importance significantly weaken Russia’s military and technological capabilities” — a claim the Kyiv Independent says it could not independently verify. Putin’s response contains the divergence in miniature: both TASS and Meduza carry him saying “there are no critical consequences from such attacks, there never have been, and there never can be,” but Meduza also carries the next sentence — “But they are certainly harming us — that’s obvious” — and reports that he ordered a program to rebuild damaged logistics capacity. TASS headlined the same remarks “Russia’s trade infrastructure resilient despite terrorist attacks.”",

      { t: "Kyiv’s own politics moved as fast as the front. The Rada confirmed Yevhenii Khmara as defense minister 312–2; his ousted predecessor Mykhailo Fedorov used a video address to call for wartime elections — “We must find a legal, safe and realistic mechanism that will allow Ukraine to restore a full democratic process even amid a prolonged war” — and said the country faces “a systemic crisis in how it is governed.” Ukrainian law bars elections under martial law. In the same window Andriy Yermak, Zelensky’s former chief of staff, resigned and was named a suspect by the National Anti-Corruption Bureau, which AP calls “the biggest threat to Zelenskyy’s government since Russia’s invasion in February 2022.” The two sides also exchanged 103 prisoners each. ISW’s Aug 19 assessment leads not with the front but with the Russian economy: “Putin is attempting to present Russia’s poor economic performance in a positive light as he is unable to conceal the damage that over four years of war and Ukrainian long-range strikes have done to the Russian economy.” It reports paramilitary forces deployed against fuel unrest and restrictions on gatherings in Red Square. The independent Russian press corroborates the mechanism: Moscow gas stations reimposed per-customer limits — 60 litres at Gazprom Neft, 50 at Tatneft — gasoline is up nearly 20% since January at a 76.04-ruble national average, and motor oil prices jumped 40% as imports ran short. From the other bench, John Mearsheimer’s Aug 19 “Living in Dark Times” holds that “Ukraine and the West are almost certain to lose the Ukraine war,” while Branko Marcetic in Responsible Statecraft names The Atlantic, The Economist, Time, CBS and CNN as outlets whose breakthrough framing keeps failing: “a combination of wishful thinking and misinformation does just enough to keep the idea of a military victory alive, undermining the chance for painful but necessary negotiations.”",

      { t: "The Gulf war is now being fought with a spreadsheet. Trump declared “economic D-Day” on Wednesday, promising the “MOST CRUSHING ECONOMIC OPERATION EVER TAKEN AGAINST ANY COUNTRY” and “TREMENDOUS Economic Consequences” for any country whose financial institutions, businesses, airports or government entities give “any type of lifeline to Iran”; Treasury Secretary Scott Bessent described a “combination of economic isolation like the world has never seen before” alongside a “continued blockade in the Strait of Hormuz.” As of this morning no designations, target lists or effective dates had been published — the last actual round of measures was Aug 7–11 — so the program is currently framing rather than policy. Foreign minister Abbas Araghchi answered that it is “a distraction from America’s own crisis,” arguing “America is facing unprecedented debt and soaring interest costs.” Abu Dhabi suspended all trade and financial transactions with Iran hours before Trump’s post. Larry Johnson at Sonar21 reads the escalation as an admission rather than a threat — “You do not need an unprecedented new sanctions campaign to defeat a country you have already defeated” — and Djavad Salehi-Isfahani in Responsible Statecraft supplies a number behind that reading: Iranian GDP contracted just 0.21% year on year in spring 2026, with unemployment rising from below 8% to 9.1%. Two measurement disputes are worth carrying rather than resolving: Hormuz transits are variously reported at single digits a day, thirteen a day, and 17% of normal, depending on whether you count AIS-identified vessels or estimated traffic; and war-risk premiums of 7.5–10% of hull value are quoted against a pre-war baseline of either 1–3% or 0.25%, which changes the headline multiple from roughly fourfold to thirtyfold. Militarily the pause held into a twentieth consecutive night without US or Israeli strikes inside Iran, while the Liberia-flagged bulk carrier Minoan Dignity was hit by an unattributed projectile in the strait, killing its chief engineer. Trump, asked Wednesday evening about renewed talks: “Maybe at some point.”",

    { h: "Economy & markets", items: [
      { t: "The day’s market story was not the minutes; it was an 11 a.m. Treasury announcement. Treasury said it will double buyback operation sizes in the 10-to-20-year and 20-to-30-year nominal sectors from $2 billion to at least $4 billion per operation between Sept 9 and Nov 4, in language framed as reflecting “Treasury’s desire to provide greater liquidity support in longer-dated nominal sectors.” The long end rallied: the 30-year fell about 10 basis points to roughly 5.18% after touching 5.34% on Tuesday, its highest since 2007, and the 10-year eased to about 4.64%. TD Securities called it “Treasury firing a warning shot across the market’s bow rather than doing something just yet,” and the scale supports that reading — the $2 billion increment is roughly six thousandths of a percent of a Treasury market now above $40 trillion. Equities snapped a three-day losing streak: the S&P 500 closed 7,707.98 (+16.22, +0.2%), the Dow 53,463.05 (+119.65), the Nasdaq 26,331.09 (+41.38) and the Russell 2000 3,032.94 (+0.5%). Gold ran to $4,521 spot, up 4.3%, silver up 5.3%, WTI settled near $84 and Brent near $91. The 2 p.m. FOMC minutes were hawkish and largely absorbed: “Many participants assessed that policy tightening would likely be necessary if inflation did not decline”; “some participants commented that financial conditions might not currently be sufficiently restrictive to facilitate a return of inflation to 2 percent”; and Hammack, Kashkari and Logan “preferred to raise the target range for the federal funds rate by 1/4 percentage point at this meeting.” One caveat worth keeping: that meeting predates both the weak July jobs print and the latest CPI, so the minutes’ forward signal is thinner than the language suggests.",

      { t: "Retail split along the discretionary line and the tape rewarded neither. Target beat on revenue at $26.54 billion against $26.15 billion expected and on adjusted EPS at $4.11 against $2.34 — but the earnings beat rests largely on a one-time tariff refund rather than operations, comparable sales rose 3.8%, and the stock fell about 4% to $146.46. Lowe’s posted $26.0 billion in sales with comps up 0.2%, a fifth consecutive positive quarter, and trimmed full-year guidance to the low end of its range; CEO Marvin Ellison credited “sustained growth in Pro, Online and Home Services... despite pressure in discretionary DIY spending.” The largest single-stock move of the day was in health care: Moderna closed up 177% at $174.38 on roughly eighteen times normal volume, lifting its market capitalization from about $25 billion to $69 billion after intismeran plus Keytruda met its primary endpoint in adjuvant melanoma; Merck rose 12.6% and BioNTech 22%. Ahead today: Walmart before the open, weekly jobless claims at 8:30 a.m. (the last print was 209,000 against a 202,000 consensus), the Philadelphia Fed survey and July leading indicators.",

    { h: "Health & policy", items: [
      { t: "The mRNA cancer vaccine result is real and, so far, thinly documented. Moderna and Merck said intismeran, an individualized neoantigen therapy, combined with Keytruda slowed recurrence and metastasis in adjuvant melanoma in a randomized Phase 3 — the first such trial to demonstrate benefit for a neoantigen vaccine. As of the announcement no hazard ratio, enrollment number or trial name had been released, which is the part to hold onto before the framing hardens around it. The economics are unusual enough to flag on their own: an individualized neoantigen vaccine is manufactured per patient, which puts it close to the limiting case of a good with high and non-declining marginal cost, so much of the intuition built on small-molecule pricing — including how cost-effectiveness thresholds behave — has to be rebuilt rather than transferred. Elsewhere in the pipeline, STAT reports White House deputy domestic policy director Heidi Overton as the president’s pick to run the FDA, and the Physicians Committee for Responsible Medicine sued HHS and USDA in federal district court in Washington alleging a Federal Advisory Committee Act violation — that a panel with industry ties rewrote the dietary guidelines in under three months, setting aside a nearly two-year science review. PCRM president Neal Barnard: “The government allowed the meat and dairy industries to ghostwrite the Dietary Guidelines.”",

      { t: "Two Wednesday stories are the same story told from opposite ends of a payment rule. KFF Health News reports that Medicare pays roughly $520 for a standard cataract procedure, down about 20% over the past decade, and that surgeons increasingly steer patients toward femtosecond lasers at $1,000 to $3,000 an eye and premium intraocular lenses at $1,000 to $4,000 — neither covered, both paid out of pocket — with nearly 12% of the five million US cataract surgeries performed annually now laser-assisted and the share growing. Johns Hopkins’s Oliver Schein: “That’s a powerful combination for a surgeon.” UCLA’s Kevin Miller: “It’s a win-win for patient and doctor.” At the other end of the same logic, NPR and KFF report that Medicare’s GLP-1 Bridge Program offers $50-a-month pricing over an eighteen-month pilot but covers weight loss only in the absence of comorbidities — excluding roughly 5.9 million enrollees who have Type 2 diabetes, sleep apnea or other GLP-1-treatable conditions, against typical Part D copays of $200 to $600. Jeff La Marca, prediabetic with a BMI of 42: “I’m obese... I’m at risk for stroke. I’m prediabetic. And yet I can’t get it.” CMS spokesperson Timothy Foster says the pilot is testing whether Medicare saves money by treating obesity before costlier chronic conditions develop.",

      { t: "Providence Health Plan is closing entirely after a national carrier walked away from talks to take over its Medicare Advantage book — more than 64,000 MA seniors and about 440,000 covered lives affected, at a system that operates 51 hospitals. The insurance division lost over $100 million in 2025 and narrowed to a $4 million loss in the first half of 2026; the spokesperson’s line was that the deal failed “despite significant effort on all sides,” with regulatory overhead, medical cost growth and national-carrier competition cited. It is a clean exit case, and a useful counterweight to the August Health Affairs finding that hospitals with vertically integrated MA plans mostly do not charge affiliated plans preferential prices — integration here failed on scale, not on foreclosure. Alongside it, KFF’s survey piece on clinical trials finds 71% of patients with chronic conditions would likely participate if asked, two-thirds say a provider never raised it, only 9% of adults have ever been invited, and up to 86% of trials miss recruitment targets — with 55.6% of cancer patients having no trial available at their treatment facility at all. Alan Balch of the Patient Advocate Foundation: “Recruitment is one thing — retention is another.”",

      { t: "Ypsilanti Township’s answer came in, and it was yes. The Board of Trustees voted Tuesday night — unanimously, per WXYZ — for a 180-day moratorium on new major electric utility infrastructure, the mechanism aimed at U-M’s $1.2 billion computing center with Los Alamos at Bridge and Textile Roads. The number that carried the room: DTE would build a 110-megawatt substation, described as equal to the township’s entire current power use and enough for 80,000 homes, in a community of 56,000 people, while the state has pledged $100 million through the MEDC against roughly 200 projected jobs. Township attorney Doug Winters: “All options are on the table; we will use any and all legal means necessary to make sure our voice is heard.” Supervisor Brenda Stumbo: “We need to make sure it’s in the right location from a planning standpoint, and we need to make sure that we have ordinances in place.” U-M says it is evaluating the resolution and has scheduled a town hall for Sept 9 at the Marriott at Eagle Crest; DTE says it is reviewing the moratorium. One caveat for the record: the township had not posted the resolution as of this morning, so there is no resolution number or roll call on the public record yet. Elsewhere in the state, Jocelyn Benson named Senate Majority Leader Winnie Brinks her running mate against John James and Jay DeBoyer, and Bureau of Elections staff found the proof-of-citizenship voter-ID petition short — 612 valid signatures against 629 required in the sample — with the Board of State Canvassers taking it up Monday.",
        s: [["WEMU","https://www.wemu.org/wemu-news/2026-08-19/ypsilanti-township-passes-moratorium-on-new-major-electric-infrastructure"],["WXYZ","https://www.wxyz.com/news/region/washtenaw-county/ypsilanti-township-approves-moratorium-on-large-utility-structures-amid-u-of-m-supercomputing-plans"],["Michigan Public (Brinks)","https://www.michiganpublic.org/politics-government/2026-08-19/jocelyn-benson-picks-mi-senate-majority-leader-winnie-brinks-for-lieutenant-governor"],["Michigan Public (petition)","https://www.michiganpublic.org/politics-government/2026-08-19/elections-staff-petition-to-tighten-michigans-voter-id-requirements-appears-short-on-signatures"]] },
      { t: "The student-visa fight is now in court. Eight organizations including NAFSA and the Presidents’ Alliance on Higher Education and Immigration sued DHS on Tuesday in federal district court in Massachusetts over the rule ending duration of status and capping international students and journalists at four-year stays — finalized in July, effective Sept 15. The complaint’s sharpest line is procedural rather than substantive: “DHS’s cost-benefit analysis is fundamentally defective... The agency acknowledged billions of dollars in quantified costs over ten years, but listed zero quantitative benefits.” NAFSA puts the economic hit at $3.4 billion. Underneath the litigation sits a quieter accountability story with more teaching value: Inside Higher Ed reports that 42% of colleges — 1,930 of 4,640 — are missing or underreporting Financial Value Transparency and Gainful Employment data, with 578 submitting none of the seven required files, including 60% of for-profits and about a third of HBCUs; more than 492,600 undergraduates attend institutions with zero complete submissions. Clare McCann of American University’s Postsecondary Education and Economics Research Center: “For a lot of institutions, I think they saw the Trump administration come in and begin to re-regulate on these issues and they took it as a pass.” The American Council on Education’s response points instead to “institutional capacity and potential confusion with changes in reporting deadlines.” Final compliance deadline: Jan 15, 2027.",
        s: [["Inside Higher Ed (visas)","https://www.insidehighered.com/news/global/international-students-us/2026/08/19/lawsuit-seeks-vacate-rule-ending-duration-status"],["Inside Higher Ed (data)","https://www.insidehighered.com/news/government/student-aid-policy/2026/08/19/almost-half-colleges-havent-fully-submitted-student"]] },
      { t: "Mind & cosmos had an unusually strong Wednesday, and the psychedelics paper is the one to read. A Monash-led group published in Nature on the largest single-site psychedelic neuroimaging dataset assembled to date — 62 adults, fMRI and EEG at rest and during meditation, music and film, before and on the day of psilocybin — with Robin Carhart-Harris and Anil Seth among the authors. The finding runs against the field’s dominant entropy story: “psilocybin reorganizes brain activity into structured, context-sensitive patterns that co-vary with the quality of subjective experience, revealing a latent order missed by time-averaged measures.” Networks that ordinarily segregate internal from external processing integrated, producing what the authors name embeddedness — the felt experience of being continuous with, rather than separate from, the environment — and the strength of that context alignment scaled with both the depth of boundary dissolution and next-day mindset change (r = 0.40, p < 0.01). Half the participants ranked the experience among the most meaningful of their lives. Principal investigator Adeel Razi: “If translated to patients, this could eventually help clinicians understand how someone is responding and predict who is most likely to benefit.” Alongside it, OHSU reports in JAMA Network Open on 346 people who used Oregon’s regulated non-clinical psilocybin services: 91.5% reported benefit at one month, 64.9% ranked the session among their ten most meaningful life events, and seven of 346 reported harm at three months. Todd Korthuis: “Safety was very similar to what we’ve seen with psychedelics in clinical settings.” In hardware, IBM joined two modular cryogenic systems into a single environment for the first time, cooling below 15 millikelvin on a road to at least 1,000 programmable qubits across linked processors by 2027; and a Caltech group in Nature observed conformal field theory spectra directly in a strontium-88 quantum simulator, recovering the predicted 2:4:6:8 universal energy ratio in systems of 7 to 35 atoms.",
        s: [["Nature","https://www.nature.com/articles/s41586-026-10910-z"],["OHSU / JAMA Netw Open","https://news.ohsu.edu/2026/08/19/study-finds-sustained-benefit-for-people-using-oregon-psilocybin-services"],["The Quantum Insider","https://thequantuminsider.com/2026/08/19/ibm-connects-two-modular-cryogenic-systems-quantum-computing/"],["Nature (CFT)","https://www.nature.com/articles/s41586-026-10904-x"]] }
    ]}

  hooks: [
    { story: "Medicare pays roughly $520 for a standard cataract procedure — down about 20% over the past decade. Surgeons are increasingly steering patients toward femtosecond lasers at $1,000 to $3,000 per eye and premium intraocular lenses at $1,000 to $4,000 per eye, neither covered by Medicare and both paid out of pocket. Nearly 12% of the five million cataract surgeries performed in the US each year are now laser-assisted, and the share is growing. UCLA's Kevin Miller: 'It's a win-win for patient and doctor.'",
      src: ["KFF Health News","https://kffhealthnews.org/insurance/medicare-cataract-surgery-scalpel-laser-ophthalmology-iol-lenses/"],
      concept: "Regulated prices, multiproduct firms & physician-induced demand",
      q: "Start by having students draw the surgeon as a single-product firm facing an administered price that fell 20%. Standard prediction: quantity supplied falls. Then show them what actually happened — volume did not fall, the product changed. Now redraw the firm as multiproduct, selling a regulated procedure bundled with an unregulated upgrade, and ask what regulating only one of the two prices accomplishes. The sharp version of the question: is the laser a genuine quality improvement that patients would buy at cost, or is it the margin the firm retreated into when the first margin was capped — and what evidence would let you tell those apart? Push on the information structure, because that is where this stops being a normal upsell. The person recommending the upgrade is the person who captures its margin, the buyer cannot evaluate the clinical claim, and the decision is made once, under anxiety, about an eye. Ask what a competitive market would need for Miller's 'win-win' to be literally true, and which of those conditions actually holds here. Then close with the policy question that has no clean answer: if CMS raises the $520 back to its 2016 real value, does laser uptake fall? Have them argue both sides — one says the upgrade was always a response to the squeeze, the other says demand for premium lenses is real and independent, and the regulated price just determines who captures the surplus." },
    { story: "Medicare's GLP-1 Bridge Program offers $50-a-month pricing over an eighteen-month pilot — but covers weight loss only in the absence of comorbidities. Roughly 5.9 million enrollees with Type 2 diabetes, sleep apnea or other GLP-1-treatable conditions are excluded, against typical Part D copays of $200 to $600 a month. CMS says the pilot is testing whether treating obesity earlier saves money on chronic disease later.",
      src: ["NPR / KFF Health News","https://www.npr.org/2026/08/19/nx-s1-5931390/medicares-pilot-glp-1-discount-program-has-a-catch-some-sick-patients-dont-qualify"],
      concept: "Screening rules, selection & the design of eligibility",
      q: "This is a rare case where the eligibility rule is legible enough to model in one class. Set it up as a screening problem: the payer wants to buy prevention, not treatment, and cannot observe who will convert from obesity to diabetes, so it uses an observable proxy — the absence of a diagnosed comorbidity — as its screen. Ask students to write down what that screen actually selects on, and they will get there: it excludes precisely the patients with the highest realized clinical benefit and the highest expected cost. Then ask whether that makes it a bad rule. It might not. Have them distinguish the payer's two possible objectives — maximize health benefit per dollar, versus estimate an incremental treatment effect on a population where the counterfactual is still open — because the second objective genuinely justifies excluding people already sick, and it is the objective CMS states. Now break it. Note that comorbidity status is partly endogenous: a patient near the threshold has a reason not to get diagnosed, and a physician has a reason not to code one. Ask what that does to the pilot's internal validity, and whether the estimated savings will generalize to a program without the screen. Good closer for a health-econ section: this is adverse selection with the sign flipped — the insurer, not the enrollee, is doing the selecting, and the same asymmetry that usually destroys a market is here being used as a research design." },
    { story: "Ypsilanti Township voted unanimously Tuesday for a 180-day moratorium on new major electric utility infrastructure, aimed at slowing U-M's $1.2 billion computing center with Los Alamos. DTE's proposed substation would carry 110 megawatts — described as equal to the township's entire current power use, enough for 80,000 homes — in a community of 56,000, while the state has pledged $100 million through the MEDC against roughly 200 projected jobs.",
      src: ["WEMU","https://www.wemu.org/wemu-news/2026-08-19/ypsilanti-township-passes-moratorium-on-new-major-electric-infrastructure"],
      concept: "Externalities, the holdout problem & who holds the veto",
      q: "Start with the arithmetic, because it does the persuading for you: 110 megawatts into a township of 56,000, matched against 200 jobs and $100 million of state money that mostly does not land locally. Have students identify who bears the cost and who receives the benefit, and they will see the classic asymmetry — concentrated, geographically bounded costs against benefits dispersed across the state and, in the research case, the country. Ask what the efficient outcome looks like if the parties could bargain freely. Then ask why they cannot, and make them be specific: the township holds a regulatory veto rather than a priced entitlement, so its only instrument is delay, which destroys value rather than transferring it. This is the point where Coase becomes useful instead of decorative — ask what a transferable entitlement would look like here, what the township would have to be paid to grant it, and why no legal mechanism exists to write that contract. Then complicate the tidy story. A veto held by a local government is not straightforwardly a bargaining chip: it is also the only protection available to residents against a genuine externality nobody has priced. Ask whether a moratorium can be efficient even when it blocks a project with positive aggregate net benefit, and under what conditions. Extension for an intermediate section: the substation's capacity exceeds the township's entire load, so the marginal infrastructure is essentially dedicated. Does that change your externality analysis relative to a shared upgrade, and does it change who should pay for it?" }

  pulse: [
    { cat: "Listening", t: "Catalog is eating the chart, and the mechanism is edits",
      why: "Mac Miller's 'Cinderella' — a 2016 album track — sat at No. 7 on the Spotify US daily chart this week with 763,270 streams, four months after it went viral. Spotify's own figures, given to Complex, show it went from about 2 million to over 15 million weekly streams the week of April 6, with Miller's total catalog streams up 19% and new-listener discovery up 83% from May through July. The Killers' 'Mr. Brightside,' from 2003, is still No. 10 on the weekly. The distinction that matters: a dance trend dies when the choreography saturates, but an edit sound is consumed as background for the user's own life events — graduations, breakups, moving out — so its demand tracks the calendar of adolescence rather than the trend cycle. That is why 'Cinderella' is still top ten four months on.",
      rec: "Ask what song they'd put under an edit of their own year. It is a more precise question than 'what are you listening to,' the answers are unguarded, and it hands you a live illustration of a catalog good with zero marginal cost and no meaningful release date.",
      src: ["kworb / Spotify US daily","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Watching", t: "Spider-Man is the fastest film ever to $800 million",
      why: "Spider-Man: Brand New Day crossed $800 million domestic on Tuesday — $803,929,225 through Aug 18 — the fastest any film has reached that mark, and it is projected to take a fourth straight weekend at $30 to $40 million against Insidious: Out of the Further opening at $20 to $30 million. Nolan's The Odyssey has passed $512.8 million domestic and is closing on $1.3 billion worldwide, which is the more surprising number of the two given the material. Your students are not treating either as a franchise-versus-art-film contest; both are simply events, and the theatrical calendar has become the one remaining place where a shared cultural clock still runs.",
      rec: "If you want a five-minute opener that works on almost everyone, ask what the last film was that they saw in a theater on purpose rather than by accident, and why that one. The answers separate cleanly into 'event' and 'nobody spoiled it yet,' which is a real finding about the value of simultaneity.",
      src: ["Boxoffice Pro","https://www.boxofficepro.com/weekend-preview-spider-man-going-for-four-in-a-row/"] },
    { cat: "Reading", t: "One series still holds five of the NYT top fifteen",
      why: "On the fiction list dated Aug 23, Matt Dinniman's Dungeon Crawler Carl occupies positions 8, 11, 12, 13 and 15 — unchanged from last week. Five simultaneous slots for one series is not a bestseller signature, it is a binge-acquisition signature: readers who enter mid-series buy the entire backlist in a single transaction, which is only possible because LitRPG reached them through serialized web fiction and audiobook rather than staggered bookstore releases. Also on the nonfiction list, still: Jonathan Haidt's The Anxious Generation, at No. 9, which is worth knowing is being read by the people it is about.",
      rec: "Not classroom material — advising material. A student who says they don't really read may be forty hours into a series that never comes up in a syllabus conversation. Asking about format rather than title gets a truer answer, and it takes ten seconds.",
      src: ["NYT fiction list","https://www.nytimes.com/books/best-sellers/"] },
    { cat: "Online", t: "'Flobby samuel insect,' a meme about there being no meme",
      why: "Posted to r/ComedyHeaven on Aug 19 and past 3,600 upvotes inside a day: an image of Big Jack Horner from Puss in Boots captioned 'flobby samuel insect,' framed as a screenshot of a Hinge match sending it with no explanation. Know Your Meme's own writeup contains the whole joke: the format 'is not, at the time of publishing this article, a real meme format.' The humor is entirely second-order — the anxiety of failing to recognize a reference that does not exist. For a cohort raised inside total meme literacy, inventing a fake referent is close to the only remaining way to produce genuine confusion.",
      rec: "Context, not material, and the useful thing to know is the category rather than this instance. If a student says something that sounds like a reference you missed, there is now a real chance it is engineered to have no referent at all, and saying so is funnier than pretending to get it.",
      src: ["Know Your Meme","https://knowyourmeme.com/editorials/guides/what-is-the-flobby-samuel-insect-meme-the-viral-comedy-heaven-reddit-post-and-big-jack-horner-meme-explained"] },
    { cat: "Playing", t: "The Kyiv studio's redemption arc ships this morning",
      why: "S.T.A.L.K.E.R. 2: Cost of Hope arrives today from GSC Game World, with reviews that lifted the embargo yesterday at 85 on Metacritic and 87 on OpenCritic, 88% of critics recommending. The free companion patch, Update 2.0, moves the game to Unreal Engine 5.5.4 and rebuilds the A-Life AI; the expansion opens the Chornobyl plant itself and the Iron Forest around the Duty and Freedom factions. DayOne's verdict: 'S.T.A.L.K.E.R. 2 finally feels like a complete game.' The number that makes it a story is Steam concurrents at 2,850, some 98% below the 121,335 peak of November 2024 — this is the redemption-arc pattern of No Man's Sky and Cyberpunk 2077, which under-25 players track and reward as a genre in its own right, and this one is being executed from Kyiv during a war.",
      rec: "One sentence in a Thursday class is plenty: a Kyiv studio shipped a full engine rebuild this morning, mid-war. It costs nothing in credibility because you are reporting rather than performing, and it quietly reminds a room that a war has firms and workers in it, not only armies.",
      src: ["GamingBolt","https://gamingbolt.com/s-t-a-l-k-e-r-2-cost-of-hope-dlc-review-return-to-the-zone"] },
    { cat: "Online", t: "TikTok has no center right now — and that is the finding",
      why: "Lightreel's weekly report concludes the platform 'is not converging around one dance, sound or aesthetic' but is rewarding 'clear, remixable narrative mechanics.' The live formats are structural rather than musical: searchable identity prompts ('Doing my [X] based on my [Y]'), repeat-twice-reveal-third, confession-first openings, plus 'It's a Clock' (Catching Fire audio at double speed, captioning an obvious truth someone has just noticed) and 'We Had ChatGPT Make Us a Script,' in which friends deadpan AI-generated scenes. If you have been waiting for one dance to learn about, there isn't one, and the absence is more informative than any single trend would be.",
      rec: "Useful mainly as a correction to how the platform gets described in faculty conversation. The unit of culture there is currently a format, not a song — which means asking 'what's the trend right now' will get you a blank look, and asking 'what's a video format you keep seeing' will not.",
      src: ["Lightreel","https://lightreel.ai/blog/tiktok-trends-this-week"] }
  ],
  classnote: { t: "KATSEYE: Wild Hearts opened at No. 5 with $3,950,000 — on 724 screens. That works out to about $5,455 per screen, against PAW Patrol: The Dino Movie's $5,713 on 3,545 screens and The End of Oak Street's $6,097 on 3,446. A fandom concert film matched wide-release productivity on a fifth of the footprint, and that comparison is the whole lesson. Start by asking what the scarce input actually is: not the film, which has zero marginal cost per screening, but screens and showtimes, which are rival, fixed in the short run, and allocated by negotiation between distributor and exhibitor. Then ask why a distributor would ever choose 724 screens when it could ask for 3,000. Students usually reach it — the expected audience is small in absolute terms but nearly certain to show up, so concentrating it raises revenue per screen, which is the number the exhibitor is actually optimizing when deciding what to give you. Push further: what does the exhibitor's opportunity cost look like on a weekend when Spider-Man is taking a fourth turn, and how does that change the split each side can demand? Then complicate it. Per-screen average is a productivity measure, not a profitability measure — have them work out what else they would need to know (rental terms, the exhibitor's split, marketing spend, concession revenue per attendee) before concluding the narrow release was the better decision. Good extension: if fandom supplies demand certainty, it substitutes for breadth of distribution. Ask which other goods have that property, and what happens to the value of shelf space, screens or slots when a seller can guarantee the buyer will find them anyway.",
    src: ["Boxoffice Pro","https://www.boxofficepro.com/weekend-preview-spider-man-going-for-four-in-a-row/"] },

  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

function badge(p) {
  const per = PERS[p] || PERS.none;

  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;

  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }

}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
</script>
</body>
</html>
