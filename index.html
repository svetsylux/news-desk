  pulse: [
    { cat: "Listening", t: "Ella Langley's twenty-first week at number one is decided tomorrow, and nobody has published it — while the song itself is still climbing",
      why: "“Choosin' Texas” held number one on Spotify's US daily chart at 1,480,493 streams, up 5,926 on the day, with “Be Her” at number nine on 751,340 and the largest gain in the top ten. Globally it went further: 2,900,393 streams, UP 153,334, arithmetic validated against the prior day's 2,747,059. The Billboard verdict on a twenty-first consecutive Hot 100 week is due around September 7 — tomorrow — and both Whiskey Riff and Billboard's own list page are still stuck on the twenty-week story from August 31. So the record is still pending, which is worth saying because plenty of places will report it as already set. ⚠️ Two corrections to keep in your pocket: the record-breaking song is “Choosin' Texas,” not the 2025 duet “You Look Like You Love Me”; and a Music Universe piece that ranks highly on this story is dated APRIL 21, 2026 and its “21 weeks” refers to Hot Country Songs, a different chart entirely.",
      rec: "The useful question is not who is at number one but why the top of a streaming chart is so much stickier than it used to be. Ask your students what has to happen for a song to get displaced — and let them discover that the answer runs through algorithmic playlists, which are populated partly on the basis of current popularity. A song at number one is put in front of more listeners because it is at number one. That is a feedback loop with increasing returns, and it means chart position is not a clean signal of quality but a mixture of quality and incumbency in unknown proportions. If someone asks how you would separate the two, tell them honestly that this is a live research question and that the answer would be worth publishing.",
      src: ["kworb (Spotify US daily — “Choosin' Texas” at 1,480,493, “Be Her” at 751,340)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Listening", t: "Dolly Parton's posthumous streaming curve stopped decaying and went back UP — which is the more honest shape, and the reason the tidy version was wrong",
      why: "This desk spent a week describing the decay of “9 to 5” after her death as if it were a smooth curve finding a floor: 1,134,063 US streams on the day she died, a trough of 489,532 on September 1, a 27.4 per cent rebound to 623,620, then two consecutive days of sub-one-per-cent decline that looked like a plateau. The global series has now broken that story. It ran 1,249,374 on August 31, vanished from the tracked chart entirely on September 1, re-entered at 1,496,874 on the 2nd, slipped to 1,484,293 on the 3rd — and then ROSE to 1,558,847 on the 4th, a gain of 74,554 or five per cent, above the re-entry level. ⚠️ And a measurement note that belongs with it: the US daily page returned the same September 3 snapshot on two separate fetches this morning, apparently cache-locked, so whether the American floor held a third and fourth day is genuinely unknown rather than confirmed. ⭐ Remember also that the September 1 disappearance was a TRUNCATION ARTIFACT — the track was rising through the day it vanished off the bottom of a chart that only lists a fixed number of rows.",
      rec: "This is the best five minutes of statistics you will get from a pop song. Draw the smooth exponential decay everyone expects after a celebrity death, then plot the actual global points on top of it and let the class see the bump. Ask what could cause a second rise a week later — a tribute broadcast, a playlist add, a viral clip — and then ask the harder question: how would you tell a real second shock from noise? Push them toward the honest answer, which is that with one series and no comparison group you cannot. Then hand them the two measurement problems for free: a chart that truncates makes a rising track look like it went to zero, and a page that serves you a cached yesterday makes a moving number look flat. Both of those errors are invisible unless you go looking, and both would have made it into a confident sentence.",
      src: ["kworb (Spotify global daily — “9 to 5” back up to 1,558,847)","https://kworb.net/spotify/country/global_daily.html"] },
    { cat: "Watching", t: "Spider-Man crossed $900 million — three days after three outlets said it had, and one day before anyone confirmed it",
      why: "The arc is now complete and it is the cleanest forecasting artefact this desk has assembled. Boxoffice Pro said on September 2 that the film was “right now crossing $900M domestic.” Showbiz411 headlined “Crossing $900 Million Today” on September 3. It did not cross on either day: the September 3 close was $899,762,111, a shortfall of $237,889, and on September 4 the same outlet published “Came ThisClose… The total this morning is $899.762,111.” It crossed on September 4, and the confirmation appeared on SEPTEMBER 5, when Showbiz411 reported the film “now at $903 million” and noted that reaching $900M “took 37 days.” Box Office Watch independently converges at $903.6 million domestic and $2.34 billion worldwide. ⚠️ Two cautions: that tracker's own crossing-date claim is internally inconsistent, so its total corroborates while its date does not; and the all-time domestic record it is chasing is now quoted FOUR different ways across sources — $936.66M, “$936 million,” $935.6M, and now $936.7M. Also from the same weekend report, a number worth its own conversation: “The Dog Stars,” with Jacob Elordi and a $100 million budget, has made $11 million and is described as heading to video.",
      rec: "Show the four headlines in date order without the figures, ask the class when the film crossed $900 million, and let them answer from the reporting. They will say September 2 or 3. Then give them the dailies. The reporting was wrong twice and right once, and the interval between the first claim and the actual event was two days — which is small, and is exactly why nobody will ever correct it. Then ask the question that generalises: what happens to an outlet that calls a milestone a day early, and what happens to one that calls it a day late? Nothing, and it gets scooped. When the penalty is that asymmetric, reporting runs systematically AHEAD of events, and a reader who does not know that will believe things happened slightly before they did — in election coverage, in earnings season, in transfer windows, in every domain where a threshold gets crossed and somebody is racing to say so first.",
      src: ["Showbiz411 (the after-the-fact confirmation: “now at $903 million,” 37 days to get there)","https://www.showbiz411.com/2026/09/05/box-office-spider-man-crosses-900-million-but-newer-entries-like-by-any-means-and-dog-stars-scratch-to-find-customers"] },
    { cat: "Watching", t: "The GTA 6 trailer did not decline off the chart. On day ten it simply was not on it",
      why: "Follow the four days. FlixPatrol's points-based worldwide film chart had the twenty-six-minute Extended Look third on 611 points on September 2, fifth on 267 on the 3rd, and eighth on 158 on the 4th — a 56 per cent fall then a 41 per cent fall, minus 74 per cent cumulatively. On September 5 it is NOT IN THE TOP TEN AT ALL. Four days from third to absent, for a trailer that at its peak was number one in 87 of 93 countries and has accumulated 31.1 million views. Netflix itself predicted this shape, describing the pattern as “front-loaded” and “similar to Netflix's boxing events.” ⚠️ And the second instrument that would let you check it is still dark: What's on Netflix has published no daily report since September 1, so Netflix's own average-of-national-ranks series is stale at 4.3 and five days old. Do not average a fresh number against a stale one — they are different instruments measuring different things.",
      rec: "Ask what “fell off the chart” actually means, and make them notice that a top-ten list has a hard edge. An item at position eleven and an item at position four hundred are reported identically: absent. So the visible series ends not when interest ends but when it drops below whatever the eleventh title happens to be doing that day — which means the last observation is censored by a threshold, not by the underlying quantity. This is the same structure as the Parton track that “vanished” from the global chart while it was rising. If you want a one-sentence version they will remember: a ranked list tells you about order, never about magnitude, and the moment something leaves the list it stops telling you anything at all.",
      src: ["FlixPatrol (the Netflix worldwide top ten, September 5 — GTA VI no longer listed)","https://flixpatrol.com/top10/netflix/"] },
    { cat: "Playing", t: "Two games ungated their user reviews at the same hour. One collected 51 ratings; the other collected zero",
      why: "Metacritic held back user scores on both Onimusha: Way of the Sword and NBA 2K27 until noon Pacific on September 5. Onimusha's arrived immediately: a user score of 8.9 RESTING ON 51 RATINGS, against a critic Metascore that is holding at 85 across eighty-nine reviews — the same 85 that fell from 86 when three new reviews landed. NBA 2K27 finally has a Metascore too, and it is 79 ON FIVE CRITIC REVIEWS, having sat for days below the four-review threshold with only a GamersRD 95 and a ComicBook 60 visible and a thirty-five-point spread between them. But its Switch 2 user reviews, checked specifically, are still COMPLETELY EMPTY — “There are no user reviews yet… Be the first to rate” — days after the gate opened. So on one page today there is an 85 from 89 observations, a 79 from five, an 8.9 from 51, and a blank. All four are rendered in the same font, the same box, the same colour.",
      rec: "Put the four numbers on the board with their sample sizes hidden and ask which game is best. Then reveal the N beside each. The 79 and the 85 look comparable and are not: one is an average of five opinions and the other of eighty-nine, and the five-review average could move six points tomorrow while the eighty-nine-review one will barely move at all. Then ask the more interesting question, which is not about statistics but about behaviour: why did one game attract fifty-one raters within hours while another attracted none? Sample size is not a property of the thing being measured, it is a property of who bothered to show up — and people show up when they are already engaged. So the games with the most enthusiastic audiences get the largest samples, which means the number is most reliable exactly where it is least needed. Ask where else they meet a number produced only by the people motivated enough to produce it, and wait: somebody will say restaurant reviews, somebody will say course evaluations, and the room will go quiet in a useful way.",
      src: ["Metacritic (Onimusha: Way of the Sword — 85 from eighty-nine critics, 8.9 from fifty-one users)","https://www.metacritic.com/game/onimusha-way-of-the-sword/"] },
    { cat: "Reading", t: "A romantasy self-published in October 2025 is on four of the five major bestseller lists — because a publisher bought it after the audience had already been proved",
      why: "Book Riot's weekly aggregation of five bestseller lists still shows Matt Dinniman's Dungeon Crawler Carl on all five, alongside Ann Patchett's Whistler and Caro Claire Burke's Yesteryear. The one to watch is a level down: THE POISON DAUGHTER by Sheila Masterson, on four of the five, described in Book Riot's own words as “a standalone romantasy that was self-published in October 2025” and now charting through a traditionally published collector's edition. Eleven months from self-publication to four national lists, with the traditional publisher entering at the point where the demand was already visible. Book Riot also notes in its own voice that the aggregated lists remain “disproportionately by white authors.”",
      rec: "The route is the economics here, and it applies just as well to Dinniman, who serialised free on Royal Road for years before Kindle, then audio, then hardcover. Ask a class why an author would give work away and then sell it, and push past the marketing answer. Free serialisation is how an unknown writer BUYS INFORMATION about whether the thing works and how large the audience is; the price of that information is the revenue forgone. Then ask who bears the risk under each model and who captures the return once the uncertainty is resolved. Under the old model the publisher bore the risk of an unproven book and took the return; under this one the author bears it, and the publisher buys in afterwards at a price that reflects a demand curve somebody else has already estimated. That is a real change in where risk sits in an industry, and your students who read on Wattpad or Royal Road understand the supply side of it better than most economists do — so ask them.",
      src: ["Book Riot (the bestselling books of the week, according to all the lists)","https://bookriot.com/bestselling-books-september-3-2026/"] }

  classnote: { t: "Spider-Man: Brand New Day crossed $900 million at the American box office on September 4, and the sentence everyone wrote about it — that it is closing in on the all-time domestic record — is doing something economically illiterate that nobody notices, including the people who write it every year. Start with the surface problem, because it is funny and it warms the room up. THE RECORD IT IS CHASING IS QUOTED FOUR DIFFERENT WAYS ACROSS FOUR SOURCES: $936.66 million, “$936 million,” $935.6 million, and $936.7 million. Four outlets, four numbers, for a single figure that is in principle exactly knowable — somebody counted the tickets. Ask the class how that happens, and let them find the answers: different cutoff dates for a film that is still occasionally re-released, different treatment of previews and of re-issues, and, mostly, everybody copying somebody without checking. That alone is a decent five minutes on why a number being precise is not the same as it being right. NOW THE REAL PROBLEM, WHICH IS THE WHOLE LESSON. Ask what the record actually is: the largest number of DOLLARS ever collected at the American box office by one film. Not the most tickets. Not the largest audience. Dollars — added up across years in which the price of a ticket was wildly different. The current record was set in 2015. This film's takings are being accumulated in 2026. Nobody in any of the four sources deflates either figure, and no box-office chart in general circulation does. So the “all-time record” is a nominal comparison across eleven years of price change, which means it is not primarily a measurement of popularity at all — it is substantially a measurement of INFLATION AND OF THE PRICE OF A CINEMA TICKET, and every year that passes makes it slightly easier to break for reasons that have nothing to do with any film. This is the single most useful nominal-versus-real example available to you right now, and it beats the textbook version because they already care about the answer. Make them do the arithmetic. Have them look up the average US ticket price in 2015 and today, divide, and ask what the 2015 record is worth in 2026 dollars. Then ask the question that lands: on the corrected figure, is this film close to the record, or is it not close at all? Then push one step further, because there is a better measure sitting right there and it makes the point unforgettable. Ask what you would measure if you actually wanted to know which film the most Americans went to see. Somebody will say tickets sold — admissions — which is exactly right, and it is a quantity nobody publishes on a chart. When you do rank by admissions, the answer is not the 2015 record-holder and it is not this film; it is GONE WITH THE WIND, from 1939, and it is not close. A film from before television leads the American box office on the only metric that measures what the metric claims to measure, and it is invisible because the industry ranks itself in undeflated dollars. Ask them why an industry might PREFER a measure that makes each year look bigger than the last, and you have arrived, without ever using the phrase, at the reason index construction is a political act and not a technical one. Three extensions, four minutes each. FIRST: the same error runs through everything they will read this year — “record” tax revenue, “record” debt, “record” company profits, “record” student borrowing, almost all of it nominal, almost none of it flagged. Give them the habit of asking “in what units, and were they deflated?” and they will catch it weekly for the rest of their lives. SECOND: ask whether a real comparison is even well defined here, since the good has changed — a 1939 ticket bought a different experience from a 2026 ticket with reclining seats, and quality change is exactly the problem that makes constructing any price index genuinely hard rather than merely tedious. That is the honest complication and they should hear it. THIRD, if you have a quantitative group: hand them the actual research design. Take the top fifty domestic grossers, deflate by the average ticket price in the release year, and re-rank. It is an afternoon's work with public data, the answer is publishable in a student journal, and it will be more interesting than the chart everybody quotes.",

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
