<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "⭐⭐ THE CAPITALS TRUCE DID NOT EXPIRE CLEANLY. IT EXPIRED ASYMMETRICALLY — KYIV WAS STRUCK, MOSCOW WAS NOT. The three-day pause on long-range strikes against the two capitals ran through September 7, and the Kyiv Independent puts its end precisely: “The truce came to a definitive end in the early hours of Sept. 8.” Russia fired 32 Kh-101 cruise missiles, Iskander-M, S-400 and KN-23 ballistics, Oniks anti-ship missiles and 166 Shahed-type drones, over half of them jet-powered, plus Parody decoys. Ukraine's air force says it destroyed or suppressed 175 targets — 2 ballistic missiles, 31 cruise missiles and 142 drones — and records in its own words that “hits by enemy missiles and attack UAVs were recorded at 29 locations, as well as the fall of downed targets (debris) at 9 locations.” Launch points: Bryansk, Kursk, Voronezh, Vologda and Oryol regions, Krasnodar Krai, and occupied Crimea and Donetsk. Set that against the previous night's 92 drones and the scale of the break is visible in one comparison. ⭐ THE CASUALTY FIGURE WAS RESOLVED AGAINST THE INDEX-CARD TRAP THIS DESK NAMED YESTERDAY, AND THE TRAP FIRED AGAIN. The Kyiv Independent's homepage card read “killing 2, injuring 16” while the article body still served a 4:04 a.m. version saying “at least two people and injured 10.” Ukrinform at 11:37 is the authoritative reading: TWO KILLED AND SIXTEEN INJURED, a toll of eighteen. Interior Minister Ihor Klymenko: “more than 50 facilities were damaged in the overnight combined attack on Kyiv,” with “Damage was recorded in many districts. Two people were killed in the attack in the Solomianskyi district,” and “The number of injured residents has risen to 16.” Explosions ran nearly five hours; 13 people were rescued; 300-plus rescuers deployed; residential buildings, a dormitory, school grounds, shops, filling stations, a flour plant and a medical centre were hit. ⭐⭐ AND THE CHEAPEST SINGLE INDICATOR — THE ONE THIS DESK COULD NOT READ YESTERDAY — NOW READS THREE NIGHTS DEEP AND SAYS THE SAME THING EACH TIME. The Russian Defence Ministry's overnight air-defence tally for Sept 7–8 is 384 Ukrainian drones over Russia and Crimea, with Bryansk, Belgorod, Saratov and Crimea named. MOSCOW OBLAST IS ABSENT. The Sept 6–7 gap is also filled at 306 UAVs, over a long region list — Belgorod, Bryansk, Volgograd, Voronezh, Kursk, Lipetsk, Nizhny Novgorod, Oryol, Rostov, Samara, Saratov, Tambov, Ulyanovsk, Perm, Crimea, Tatarstan, Udmurtia, Chuvashia and the Black and Azov Seas — and MOSCOW OBLAST IS ABSENT THERE TOO. So the series runs 490 (Sep 3–4), 53 (Sep 4–5), 258 (Sep 5–6), 306 (Sep 6–7), 384 (Sep 7–8), as five distinct nights that must never be averaged, with Moscow oblast missing from the last three. Ukraine kept its half of the bargain on the capital and broke nothing when the clock ran out; Russia struck Kyiv within hours of the same clock. ⚠️ Ukrainian drones did strike elsewhere: Rosneft's Saratov refinery, capacity about 4.8m tonnes a year, which the independent Russian outlet Astra analysed from footage and concluded “had been hit and was burning.” Governor Roman Busargin confirmed only that “Civilian infrastructure in Saratov has been damaged in a drone attack,” later reporting ten injured including three children, and never named the refinery. Four were killed across Russian regions and Crimea — one in Starodub, Bryansk; one in a Belgorod border district; two near Simferopol. ⚠️ A Ukrinform report of Foreign Minister Sybiha saying Putin attacked Kyiv as soon as Trump's envoys left could not be recovered: the article ID surfaced in search and then 404'd, the known Ukrinform trap, so the line is omitted rather than paraphrased.",

      { t: "⭐⭐ THE TWO SIDES PUBLISHED IRRECONCILABLE READOUTS OF THE SAME FAILED TRIP, AND THE KREMLIN'S IS THE MORE REVEALING OF THE TWO. Sunday's Kyiv leg ended, in the Kyiv Independent's headline, with “‘The war will continue' — US peace push fails to achieve deal.” Steve Witkoff's own account, posted to X on Monday, says the opposite in flat terms: “Substantive progress was made, including movement on scheduling additional trilateral talks,” with “President Trump is working hard to stop the killing and work towards a lasting and durable peace.” ⭐ AGAINST THAT, MOSCOW SAYS IT HAS NOT BEEN TOLD ANYTHING. Presidential spokesman Dmitry Peskov, at Monday's briefing, on the Kyiv leg specifically: “No, we do not have information at the moment about results of our US colleagues' contacts in Kiev.” Asked how the American proposals differ from what was agreed at Anchorage, he said simply: “No, I cannot tell you that.” On the trilateral, he deferred rather than confirmed — “As for the resumption of the trilateral format, you heard the statements from Kiev yesterday” — and called it premature to name a venue or a date, while allowing that “We do not rule out the possibility that a phone conversation between the presidents may take place following the visit of the American negotiators.” Of the Moscow leg he offered the warmest line available: “This is one small step toward peace. We truly value the peacemaking efforts of the American negotiators very highly.” Presidential aide Yuri Ushakov called Putin's three-hour meeting with the envoys “substantive, constructive, extremely frank and trusting.” ⭐ THE VERIFIABLE FACT SITS BETWEEN THEM: NO TRILATERAL HAS BEEN ANNOUNCED. Witkoff claims movement on scheduling; Peskov says venue and timing are premature; Euronews states plainly that none is scheduled. Yesterday's open question — whether the trilateral floated “in short order” would materialise — has its answer for today, and the answer is no. ⚠️ Nothing from Putin, Lavrov, the foreign ministry or Kirill Dmitriev on Sept 7–8: checked, not found, which is a different statement from silence being meaningful. ⭐ ZELENSKY'S OWN READ, GIVEN TO AXIOS, IS THE MOST INTERESTING THING EITHER SIDE SAID, BECAUSE IT IS ABOUT MOTIVE RATHER THAN PROCESS: Putin “doesn't want … to upset him” — Trump — and is “ready to discuss” ideas for moving negotiations forward. He said the war is unlikely to end this year and that he expects major Russian attacks on energy infrastructure this autumn and winter, which is a forecast the coming weeks will grade. Euronews reports the American proposals cover energy facilities, grain shipments and oil and gas exports — the first substantive description of their content anyone has given, and notably narrower than the territorial question Meduza identified as central on Sunday.",

      { t: "⭐ ISW REVERSED ITS OWN EMPHASIS IN TWENTY-FOUR HOURS, AND THE REVERSAL IS THE FINDING RATHER THAN A CONTRADICTION. Saturday's assessment gave Russia something — “tactically-significant advances in the Hulyaipole direction” — alongside the arithmetic that Russian forces “will not seize Donetsk Oblast until 2032 at their current rate of advance.” Sunday's leads the other way. Its opening claim is that “The Ukrainian military demonstrated, and a Kremlin-affiliated milblogger acknowledged, the falsity of one of Russian President Vladimir Putin's more outrageous claims of fictitious Russian gains in Donetsk Oblast,” and it records that “Ukrainian forces recently advanced in the Slovyansk direction and the Kostyantynivka-Druzhkivka tactical area.” The mechanism ISW proposes is the interesting part, because it is a claim about an institution rather than about a battlefield: “The pervasive culture of lying within the Russian armed forces paradoxically both damages Russian forces' ability to fight effectively and supports exaggerated Kremlin claims that Putin weaponizes to enhance Russia's negotiation position.” That is a two-sided cost — the lie degrades the army and strengthens the negotiator — and it ties the military assessment directly to the diplomacy above it: “Negotiations to secure the durable and lasting peace that US President Donald Trump has said he aims for cannot be based on Russian lies. They can only be based on the actual realities of the battlefield and the real trajectory of the war, which does not favor Russia.” ⚠️ TWO METHOD NOTES, BOTH ABOUT HOW THIS WAS OBTAINED. First, the routing failed in the same direction as yesterday and then some: criticalthreats.org returned nothing after Sept 5, and understandingwar.org returned nothing at all, so the assessment was read via the Kyiv Post repost — post 83986, published Sept 8 at 8:15 a.m., above the 83898–83925 band this desk logged yesterday and consistent with the band advancing rather than drifting. Both paths get checked every run precisely because either can fail; a failure at one is a failed check, not an absence. Second, the repost surfaced ISW's key takeaways only, so there is no Pokrovsk, Vovchansk, Hulyaipole or Kupiansk detail today — a rendering limit on the substitute route, stated as such. ⭐ The reported Ukrainian “silence regime” — midnight Sept 5 to the end of the day Sept 8, so expiring tonight — remains exactly what it was: sourced by Ukrainska Pravda to “sources in the military,” and never confirmed or denied by the government, the General Staff or the President's Office. Checked again today, still not there. Note also that Zelensky's own public pledge was narrower than the reported order — he undertook only to “refrain from conducting aerial strikes against Russia during the visit for the safety of the U.S. negotiators” — and last night's 384 drones settle the aerial half regardless of what the order said.",

      { t: "⭐⭐ IRAN — THE NON-RESPONSE HELD, AND THE HORMUZ CORRIDOR TURNS OUT TO HAVE A MONTH-LONG PAPER TRAIL THAT MAKES SUNDAY'S ANNOUNCEMENT A RE-ANNOUNCEMENT. Two days ago the IRGC claimed it had struck an American unmanned surface vessel in the Strait, a target class Admiral Brad Cooper's published exchange rate — “If you shoot at two of our ships, we will impose an even higher economic cost — taking out three of yours” — never priced. GlobalSecurity's Day 192 log now states it plainly: CENTCOM “did not address claim.” No confirmation, no denial, no retaliation, no new tanker strike, and no Iranian fire at a manned warship, through this morning. The ratio was neither tested nor broken; it was simply left alone by both sides for a third day. ⚠️ AND A TRAP THIS DESK ALMOST WALKED INTO: Middle East Eye carries CENTCOM redirection figures of 111 (May 28) and 125 (June 3), which belong to the mid-April Iranian-port blockade series and are NOT an advance on the current Hormuz count of 92. Different series, similar name, do not merge. ⭐⭐ THE CORRIDOR STORY IS THE ONE THAT CHANGED, AND IT CHANGED BACKWARD. Mohsen Rezaei, Secretary of the Supreme National Security Council, said on Sunday that maps of an Iran–Oman corridor “have been agreed and should be signed in the coming days.” It emerges that Al Jazeera reported on AUGUST 5 that “Tehran, Oman agree on route coordinates in Hormuz Strait,” and that Oman and the International Maritime Organization opened a temporary transit corridor on JUNE 24 — voluntary, no tolls, no navigation restrictions, with IMO Secretary-General Arsenio Dominguez announcing plans to evacuate over 11,000 stranded seafarers. So a month-old agreement was re-announced as imminent. It still has not been signed: The National reports the memorandum “remains unpublished with no signing date confirmed,” and GlobalSecurity records that “no Omani confirmation located.” ⭐ There is an Omani voice on the record, just not on Rezaei's claim: Foreign Minister Badr Albusaidi “expressed hope for soon announcing the temporary corridor,” within a phased framework including mine-clearing built on a June US–Iran memorandum. Trita Parsi's reading of the mechanics is worth keeping because it inverts the sovereignty framing: inbound traffic through Iranian-administered waters, outbound through Omani, and “The arrangement would represent a slight climbdown by Tehran,” which had previously demanded all traffic pass through Iranian waters. Washington rejects the arrangement outright and denies Iranian control of the strait. ⭐ THE TWO FRAMINGS OF THE STRAIT ITSELF, PUBLISHED SIDE BY SIDE: an unnamed senior US official tells Al Jazeera the waterway is “fully open and under US Navy control.” Iran's foreign ministry spokesman Esmaeil Baqaei says Iran's actions “are quite defensive and are being carried out in response to the ongoing military aggression,” that the strait was “rendered insecure … as a direct result of US-Israeli belligerence,” and that “It was the United States that first carried out attacks on vessels.” The numbers sit closer to Tehran's account than to Washington's: GlobalSecurity has commodity traffic at a TEN-DAY AVERAGE OF 10 VESSELS A DAY against a pre-war daily average of 138, with 2 transits on Sept 5 and 6 on Sept 6; Kpler has traffic down 28% to 77 vessels in a week and calls it the lowest since May. ⭐ Qatar's foreign ministry spokesman Mohammed Al-Ansari today calls reopening “a priority, as the world faces an ‘industrial catastrophe' if the crisis continues.” ⚠️ US casualties are now disputed THREE ways rather than two — Stars and Stripes “more than 790” wounded, ABC News 767, Responsible Statecraft 794, against a consistent 18 killed since Feb 28. Publish all, reconcile none. ⚠️ Pickaxe Mountain remains unstruck with no new quote, and the Oval Office remark this desk dated Sept 4 is dated Sept 5 by Al Jazeera — a one-day conflict, flagged, not resolved. ⚠️ Lebanon's ministry of health figures MOVED DOWN rather than up: Al Jazeera's Sept 6 reading gives 4,358 killed and 12,359 wounded since March 2, against the 4,362 and 12,378 this desk carried, alongside an unchanged 8,920 and 30,595 since October 2023. Gaza moved the other way, to 73,658 killed and 174,622 wounded.",

      { t: "⭐⭐ THE TWO FED INSTRUMENTS AGREE TO WITHIN TWO TENTHS OF A POINT, AND THAT AGREEMENT IS AN ARTEFACT OF THEIR TIMESTAMPS RATHER THAN A CONVERGENCE OF METHODS. This desk spent Saturday and Sunday tracking a gap between investing.com's Fed Rate Monitor and CME's FedWatch that ran 1.6 points, then 0.4. Today it reads 0.2 — the Rate Monitor at 58.1% for a September hike, FedWatch at 58.3% — and the right conclusion is not that two methodologies have converged. BOTH OF THOSE READINGS ARE STAMPED SEPTEMBER 7. Every source stamped SEPTEMBER 8 prints something higher: Commerzbank, quoted by FXStreet at 08:26 GMT this morning, says “the Fed funds futures increased the probability of a 25bp hike on 16 September to 62% compared with 51% before the employment report,” and TradingEconomics' ten-year page puts it at “roughly a 60% probability.” So the likeliest reading is that odds firmed overnight and the Rate Monitor has simply not refreshed since 4:55 p.m. Monday. A stale page is not a flat number, and two stale pages agreeing with each other is not a finding. ⭐ ONE GENUINE METHODOLOGICAL ADVANCE, AND IT VINDICATES A CALL THIS DESK HAS BEEN HEDGING FOR FOUR RUNS: THE RATE MONITOR NOW PRINTS ITS RATE-RANGE LABELS RATHER THAN LEAVING THEM TO BE INFERRED. The current target is 3.50–3.75%, so 3.75–4.00% is a 25bp hike — exactly the mapping this desk had been publishing as “inferred.” The inference was right. Its September 16 grid reads 41.9% hold against 58.1% hike; October 28 is 29.4 / 53.3 / 17.4; December 9 is 14.6 / 41.3 / 35.4 / 8.7; March 17 2027 is 6.9 / 25.8 / 36.1 / 23.4 / 7.0 / 0.8. Derived from its own components: at least one hike by December 85.4% (was 85.2), two or more by March 67.3% (was 66.9). ⭐ NOTE THE SHAPE OF THE MOVE — September eased 0.6 of a point while every cumulative measure firmed. The curve steepened; it did not shift. ⭐ NO FED SPEAKER FOR A FIFTH CONSECUTIVE DAY, established from the Board's own 2026 speeches index rather than inferred: Waller's Sept 3 remains newest, Barr's Sept 1 behind it, and the blackout that began Saturday Sept 5 is holding. ⚠️ THE PHANTOM BARR SPEECH GOT HARDER TO DISMISS RATHER THAN EASIER. The Board's September calendar still lists him for TOMORROW, Sept 9 at 9:05 a.m., at the Second Chance Lending Forum — but now with a topic, “Economic Outlook and Financial Inclusion,” which is DIFFERENT from the title of his Sept 1 speech at the same forum. A duplicate-row glitch would normally replicate the title. Two live possibilities remain: a real appearance confined in practice to financial-inclusion content, or a stale calendar row. Tomorrow's speeches index settles it. ⚠️ AND THE HOUSEKEEPING THAT MATTERS FOR EVERY NUMBER BELOW: MARKETS REOPEN TODAY, BUT THEY HAD NOT OPENED WHEN THIS WAS WRITTEN. There is still no Monday close, because Monday was Labor Day, and no Tuesday close yet. Friday September 4 remains the most recent US cash close and will until this afternoon — S&P 500 7,718.36, Dow 53,414.25, Nasdaq Composite 26,506.99, Russell 2000 2,974.85, VIX 14.53, ten-year 4.789%. What overnight products show is a split rather than a direction: on investing.com's index CFDs, the Dow product −0.58% against the Nasdaq 100 product +0.54%, with the S&P pinned flat between them, and a VIX quote at 16.23 against Friday's 14.53 cash settle. Name the instrument: those are CFDs, not CME contracts. The dollar index has softened overnight from about 99.20 to 98.95. TradingEconomics splits internally on the ten-year, panel 4.80% against narrative 4.77% — publish both. ⭐ AUGUST NFIB SMALL BUSINESS OPTIMISM, the week's first mover, was due at 6:00 a.m. and had not published when this was written; July's reading was 99.8, up 2.4 points and “the highest level since August 2025,” the first month above the 52-year average of 98.0. PPI lands Thursday, AUGUST CPI FRIDAY, four days before the FOMC and inside the blackout, with no consensus published on either. Deutsche Bank: “all eyes will be on the August US CPI print on Friday, preceded by the PPI on Thursday.”",
        s: [["investing.com Fed Rate Monitor (the rate-range labels now printed — September at 58.1/41.9, stamped Sep 7, 4:55 p.m. EDT)","https://www.investing.com/central-banks/fed-rate-monitor"],["FXStreet (Commerzbank: fed funds futures at 62% for a September hike, “compared with 51% before the employment report”)","https://www.fxstreet.com/news/us-dollar-index-price-forecast-stabilizes-below-618-fibo-retracement-at-9920-202609080826"],["Federal Reserve (the 2026 speeches index — nothing since Waller on September 3)","https://www.federalreserve.gov/newsevents/2026-speeches.htm"],["Federal Reserve (the September calendar, still carrying the Barr entry for September 9 inside the blackout)","https://www.federalreserve.gov/newsevents/2026-september.htm"],["NFIB (the Small Business Optimism Index — July at 99.8, with the August reading due this morning)","https://www.nfib.com/news/monthly_report/sbet/"]] },
      { t: "⭐⭐ DIESEL CROSSED $5.90. FOURTH CONSECUTIVE RECORD — AND THE SPREAD HAS STOPPED WIDENING EVEN AS THE LEVEL KEEPS RISING, WHICH IS THE MORE INTERESTING HALF. AAA's national average on data stamped September 7 puts diesel at $5.9015 a gallon, through the round number by fifteen hundredths of a cent, against $5.8970 yesterday, $5.6002 a week ago, $5.3313 a month ago and $3.7088 a year ago: up 0.45 of a cent on the day, 30.13 cents on the week, 57.02 cents on the month, and 59.12% year on year. Regular gasoline is $4.1505, up 0.32 of a cent on the day, 6.98 cents on the week and 29.82% on the year. ⭐ THE DIESEL–GASOLINE SPREAD IS $1.7510, against $1.7497 yesterday. It widened by thirteen hundredths of a cent. For four days this desk has reported a distillate-specific squeeze visibly opening a gap; today both fuels rose almost exactly in step, and the gap is essentially static at a very high level. That is a different regime from the one that produced it, and it is worth watching for whether the spread plateaus the way a one-off supply shock would or resumes widening the way a structural distillate shortage would. ⚠️ ONE ODDITY IN THE SAME TABLE, FLAGGED RATHER THAN EXPLAINED: only regular and diesel rose. Mid-grade fell 1.61 cents, premium 0.72, E85 0.28. A national average in which the two ends of the gasoline slate move in opposite directions on one day is more likely a mid-week survey artifact than a genuine grade divergence, and should not be read as one. ⭐⭐ CRUDE IS THE STORY BEHIND BOTH, AND BRENT IS WITHIN SEVENTY CENTS OF A HUNDRED DOLLARS. TradingEconomics' commodity pages — not its index panel, which is a CFD — give Brent $99.315, up 2.22% on the day, at six-week highs, and WTI $94.04, up 1.62%, at three-month highs. Yesterday's panel readings were $97.625 and $91.486. The narrative on both pages attributes the move directly to the Hormuz story above: crude climbed “after Iran said an agreement with Oman to manage shipping through the Strait of Hormuz was nearing completion, fueling concerns over Tehran's growing control of the key waterway.” ⚠️ That narrative says “Tuesday” while carrying a Sept 7 stamp; reported as found, not resolved. A third source, Eurasia Business News, had Brent at $96.80 and WTI at $92.14 on Monday, consistent with an overnight rally. ⭐ AND ONE OF THIS DESK'S LONGEST-RUNNING DIVERGENCES HAS CLOSED: GOLD. Kitco has $4,397.30 bid, TradingEconomics $4,395.73 — $1.57 apart, against $29.20 yesterday. Two independent sources on the same metal now agree to within four hundredths of a percent, and the divergence did not survive one session. ⚠️ TradingEconomics still splits against itself, its own narrative giving $4,391.85 on the same page as its $4,395.73 panel. ⚠️ Kitco's displayed stamp reads “09:17:00 AM ET” at 5:17 a.m. Eastern — four hours ahead, almost certainly a GMT label. The value looks current; the timezone label does not. ⭐ THE RUBLE HAS A GENUINELY NEW FIXING, AND IT STRENGTHENED. The Bank of Russia's rate effective 08.09.2026 is USD ₽86.1909 and EUR ₽100.1711, against the ₽86.5857 and ₽100.5693 that covered Saturday, Sunday and Monday — the ruble up 0.46% against the dollar and 0.40% against the euro. Key rate 14.00%, with the board meeting FRIDAY, the same day as US CPI, press release at 13:30 Moscow and the governor's press conference at 15:00. ⚠️ AND A CORRECTION TO THIS DESK'S OWN SOURCING PRACTICE: VoxEU is not merely permalink-limited, it is STALE. Its permalink pattern was confirmed to resolve — a live test on cepr.org/voxeu/columns/[slug] returned a real column — but the columns listing's newest entry is FEBRUARY 15, 2026, nearly seven months old. The mechanism works; the site is not serving current columns. Yesterday's “Monetary policy's last-mile problem” attribution should be treated as unverified for date, and the slot reclassified from rendering failure to stale page.",
        s: [["AAA (the national average — diesel through $5.90 at $5.9015 on a fourth consecutive record, gasoline $4.1505)","https://gasprices.aaa.com/"],["TradingEconomics (Brent at $99.315, within seventy cents of $100, on the Hormuz corridor news)","https://tradingeconomics.com/commodity/brent-crude-oil"],["Kitco (gold at $4,397.30 bid — $1.57 from TradingEconomics, against $29.20 yesterday)","https://www.kitco.com/price"],["Bank of Russia (the fixing effective 08.09.2026 — USD ₽86.1909, EUR ₽100.1711)","https://www.cbr.ru/eng/currency_base/daily/"],["VoxEU / CEPR (the columns listing, whose newest entry is February 15, 2026)","https://cepr.org/voxeu/columns"]] },
    ] },
    { h: "Health & policy", items: [
      { t: "⭐⭐ THE VACCINE CACHE BROKE, THE DISCRIMINATING TEST RAN, AND THE ANSWER IS THAT THE SURGE WAS REAL AND IS NOW DECELERATING. For two runs this desk has been chasing one number. Comments on the HHS vaccine RFI jumped from 3,896 to 9,798 in under a day — a 2.51-fold rise against a trailing pace near 790 a day — and then the Federal Register page served a byte-identical stale cache on Sunday, leaving the question open. The test proposed was simple: a further ~5,000 a day means a real filing campaign before the September 20 close; reversion to about 4,000 cumulative behaviour means the 9,798 was a batch artifact. TODAY THE PAGE MOVED CLEANLY. COMMENTS 12,237, UP 2,439; PAGE VIEWS 13,271, UP 507; and the stamp advanced exactly twenty-four hours to “09/07/2026 at 4:15 am EDT.” Both figures moved and the stamp is a clean one-day delta, so this is not a repeat cache. A second consecutive large increment sits far above the pre-spike baseline of roughly 400 to 1,600 a day, which settles it toward a real campaign — but at 41% of the prior day's increment, the flow is decaying rather than accelerating. Thirteen days remain. The full series: 256, 504, 652, 720, 1,500, 1,500, 1,635, 1,828, 2,316, 2,316 stale, 3,896, 9,798, 12,237. ⭐⭐ AND THE MECHANISM IS NOW IDENTIFIED RATHER THAN INFERRED, WHICH MATTERS FOR HOW THE RECORD SHOULD BE READ. Organised filing campaigns are running against this docket — Children's Health Defense with two separate action alerts, Teachers for Choice with a third, and at least one substack call to action, all of them vaccine-sceptical. A comment file assembled this way is directionally lopsided by construction, and is evidence about mobilisation rather than about public preference. ⭐⭐ THE SINGLE BEST NUMBER OF THE RUN IS A RATIO NOBODY PUBLISHES, AND IT FALLS OUT OF COMPARING THE TWO DOCKETS THIS DESK ALREADY TRACKS. COMMENTS ARE NOW 92.2% OF PAGE VIEWS ON THE VACCINE RFI — 12,237 against 13,271. On the H-1B fee docket, same platform, same twenty-four hours, the figure is 22.9% — 6,647 comments against 29,012 page views. Four times the traffic and half the comments. Filers on the vaccine docket are arriving through third-party portals straight to the comment form and never loading the page at all; readers on the H-1B docket are mostly reading. One number distinguishes organised campaign filing from organic engagement, at zero cost, and it is sitting in plain sight on two pages. ⭐ THE H-1B DOCKET ITSELF KEEPS DECELERATING: 6,647 comments, UP JUST 67, a new smallest non-zero increment against the previous record of 96, on a page stamped “09/07/2026 at 10:15 pm EDT.” Its increment series now runs 857, 265, 353, 632, 0 stale, 420, 96, 67 — monotonic decay across the last three readings. Do not annualise it. ⚠️ BOTH STAMPS, AS ALWAYS: the vaccine page at 4:15 a.m., H-1B at 10:15 p.m. H-1B leads by eighteen hours, the same direction and magnitude as Sept 5 and Sept 7 — which now makes Sunday's six-hour reversal look like the anomaly rather than a genuine role swap. Docket USCIS-2026-0298, RIN 1615-AD20, 91 FR 54817, closing September 24; the vaccine docket HHS–OS–2026–0332, closing September 20.",
        s: [["Federal Register (the vaccine RFI — 12,237 comments and 13,271 page views, the cache broken and the stamp advanced a full day)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["Federal Register (the H-1B fee docket — 6,647 comments on 29,012 page views, up just 67)","https://www.federalregister.gov/documents/2026/08/25/2026-17324/fee-for-certain-h-1b-petitions"]] },
      { t: "⭐⭐ STAT'S “UNRAVELED” PART THREE LANDED THIS MORNING, ON DAY TWELVE, AND IT IS THE BEST HEALTH-ECONOMICS ITEM OF THE WEEK. Daniel Payne's piece — “Rural hospital mergers and how to balance survival versus competition” — closes an eleven-day gap since part two on August 27, and it is a straight statement of a trade-off with numbers on both sides. Rural hospitals are merging to survive anticipated Medicaid cuts; one study puts post-merger price increases at “more than 10%,” and a bipartisan Senate review found increases of “20% or more … ‘not uncommon'.” Against that sits closure, which removes access entirely. Greg Maddrey, president of Chartis: “For every deal that's been announced, there are scores being talked about.” Chrissi Maguire, chief executive of MDI Health in Maine, on trying to find a partner: “They wouldn't even look at me — because they've absorbed all the small hospitals.” Trampas Hutches of MaineHealth Mountain Region: “At some point you have to say, OK, we've got to change the model.” Named deals include North Star Health Alliance with Rochester Regional, WVU Health with Independence Health System, Knox Community Hospital with Kettering Health, and Baptist Health with Magnolia Regional. Bogalusa, Louisiana, where one of the hospitals sits, has a 40% poverty rate. ⚠️ Note that STAT's own homepage did not list part three; the search index did. Homepage lag is now confirmed for statnews.com, so its front page cannot be used to establish a negative. ⭐⭐ AND THE COUNTERFACTUAL THAT USUALLY DOES NOT EXIST IS SITTING ON HEALTHCARE DIVE FROM LAST WEEK. The FTC sued OhioHealth in February over allegedly anticompetitive insurer contracts and blocked its acquisition of Fairfield Medical Center — a hospital carrying operating losses of more than $37 million in 2025 — while encouraging alternative buyers. A second buyer emerged, and the Adena Health deal closed on September 3. Daniel Guarnera, director of the FTC's Bureau of Competition: “Today's announcement should serve as a reminder that we will stop bad hospital deals.” Adena's president and chief executive Kathi Edrington: “Our mission calls us to serve our communities.” Put the two stories together and you have the rare case where the alternative to the blocked merger is observed rather than assumed. ⭐ SECTION 504: THE PARTY COUNT THAT HAS BEEN REPORTED FIVE WAYS IS FINALLY RECONCILED, AND THE EXPLANATION IS THAT THE ROSTER WAS SHRINKING. Disability Belongs records that NINE states filed the amended complaint in January 2026 and FIVE remain as plaintiffs as of September 1 — Texas, Alaska, Louisiana, Montana and Florida, named for the first time. Different sources were reporting different points on a moving number. The court has still not entered the proposed judgment. ❌ The Olmstead margin is unquantified on a seventh run, with this source too printing no figure; the denominator will have to come from CMS or MACPAC enrolment data rather than case coverage. ⭐ EBOLA — BUNDIBUGYO VIRUS — ADVANCED SHARPLY ON A FRESH WEEKDAY READING. ECDC, stamped September 7 at 14:25 with data to September 5: 6,604 cases and 3,175 deaths, against 6,342 and 3,072 three days earlier; 1,548 recovered, 851 in isolation, 61 of 151 health zones. NORTH KIVU HAS CROSSED A THOUSAND CASES at 1,000 and 659 deaths, adding a sixteenth health zone; Ituri is at 5,326 and 2,398. ⚠️ Contact tracing DETERIORATED from 86.5% to 85.7% while the isolation census grew — capacity strain against the WHO director-general's stated 1,300 beds across 49 facilities. ⚠️ The CFR was again NOT PRINTED; 48.1% is a computed value today, not a quoted one. ⚠️ And the page's own “82 new cases and 41 new deaths since previous report” cannot describe the same interval as the +262 and +103 in its own cumulative totals — ECDC's baseline is a different series from its own prior page revision, so the two must not be presented as the same change. No DON617 exists. ⭐ KFF Health News's published hiatus was due to end today and had not ended at this hour: its homepage still carries the notice and the Morning Briefing archive still stops at August 28. Expect the backlog later today.",
        s: [["STAT (Unraveled part three — rural hospital mergers, post-merger prices “more than 10%,” and “20% or more … not uncommon”)","https://www.statnews.com/2026/09/08/rural-hospital-mergers-medicaid-cuts-part-3-unraveled-series/"],["Healthcare Dive (the FTC blocks OhioHealth and a second buyer emerges — Adena acquires Fairfield after antitrust scrutiny)","https://www.healthcaredive.com/news/adena-health-acquires-fairfield-medical-center-after-antitrust-scrutiny/829659/"],["Disability Belongs (the plaintiff roster shrinks from nine states to five; the court has not entered the judgment)","https://www.disabilitybelongs.org/2026/09/texas-v-kennedy-action-update/"],["ECDC (Bundibugyo Ebola at 6,604 cases and 3,175 deaths, with contact tracing slipping to 85.7%)","https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda"]] },
    ] },
    { h: "Campus & culture", items: [
      { t: "⭐⭐ NORTHWESTERN IS THE NINETEENTH INSTITUTION, THE LEAD IS NOW VERIFIED AT THE PRIMARY SOURCE, AND IT SUPPLIES SOMETHING BETTER THAN A HIGHER COUNT — A PROPAGATION DATE. Yesterday this desk carried Northwestern as a headline-only lead, its student paper being robots-disallowed. The university's own international office page now says it directly: “While Northwestern reviews this new information, we have instituted a hold on any CPT request that is not a required work experience for all students in an academic program.” Read that phrase against the eighteen institutions already logged — George Washington, Rochester, Washington, Michigan, USC, Harvard, Berkeley — and it is the same one-sentence test, word for word in substance. ⭐ THE NEW DATUM IS THE TIMESTAMP INSIDE IT: the page cites “OISS's update on federal guidance regarding Curricular Practical Training sent on Tuesday, August 25.” AUGUST 25 IS THE DAY AFTER THE AUGUST 24 SEVP BROADCAST MESSAGE. Berkeley named the two memo dates, August 12 and August 24; Harvard cited the same two and published the school-by-school consequences; Northwestern now shows the propagation lag — one day from federal guidance to institutional hold. Three institutions, independently, triangulating the same two documents. ⚠️ AND STILL NOT ONE OF THE NINETEEN HAS PUBLISHED AN EFFECTIVE DATE. Northwestern's hold is framed as interim — “while Northwestern reviews” — exactly like Berkeley's “until further notice.” Nineteen indefinite pauses, zero end dates. A twentieth institution: checked, not there. ⭐ THE STORY ALSO REACHED THE NATIONAL TRADE PRESS, AND IT SUPPLIES THE FIRST GOVERNMENT-SIDE QUOTE. Inside Higher Ed, August 31, carries a DHS spokesman: “Schools and employers should consider themselves on notice: under President Trump, abuse of this generous system will no longer be tolerated.” It also confirms the test is TWO-PART rather than one — the employer must have a partnership with the college AND all students in the programme must be required to complete an internship — which means Harvard's “cooperative agreements with the school” clause is federal, not a Harvard idiosyncrasy. ⚠️ Worth noting plainly: IHE gives no broadcast-message numbers, no memo dates, no effective date and no institution count, and says only “last week.” ⭐⭐ NAFSA v. DHS: STILL NO ORDER OF ANY KIND, SEVEN DAYS FROM THE RULE'S SEPTEMBER 15 EFFECTIVE DATE, AND NOW CONFIRMED FOUR WAYS RATHER THAN THREE. NAFSA's tracker is still stamped September 4. The Chronicle's liveblog stops at Sarah Brown's September 3 entry, “Judge Appears Skeptical of New Sharp Limits on Student Visas.” An unfiltered search surfaces nothing after September 4. ⭐ And a fourth route new to this desk — the Presidents' Alliance litigation tracker — independently corroborates the docket's shape and adds a detail NAFSA's page does not carry: Judge Saylor's only order to date is a PROCEDURAL one, issued August 19, setting the briefing schedule and hearing date. His stated “fervent hope” was to rule before September 15; the trackers are maintained by the plaintiffs' own coalition and would post an order within hours. ⚠️ Yale's international office, meanwhile, makes no mention of the lawsuit at all and tells students flatly that “Beginning September 15, 2026, most F-1 students, J-1 exchange visitors, and their dependents will no longer be admitted to the United States for Duration of Status.” Universities are planning as though the rule takes effect. ⭐⭐ AND THE ARITHMETIC BEHIND ALL OF IT NOW HAS A MICHIGAN NUMBER. NAFSA's fall 2026 outlook, with JB International, projects 111,000 FEWER INTERNATIONAL STUDENTS, up to $3.4 BILLION in lost revenue and nearly 40,000 jobs at risk — a 5 to 10% decline against a 2024–25 baseline of 1,177,766. State losses: California $499.6m, New York $470.3m, Massachusetts $284.0m, MICHIGAN $284.0m, Texas $199.1m. Michigan is tied fifth nationally. ⚠️ In pedagogy, Ghosh's “Tech-free teaching” survives a twelfth challenger; THE Campus got first call and produced only a new date trap — “Effective assessment methods for large enrolment classes” ranks as current, is undated in results, and is from OCTOBER 2023. Faculty Focus's newest, Kerri Olore on collaborative syllabus design, is prescriptive and figure-free, its own summary conceding “the greatest transformation was not the syllabus itself, but the relationships that developed.” This is now a stable finding rather than a pending search.",
        s: [["Northwestern OISS (“a hold on any CPT request that is not a required work experience for all students in an academic program”)","https://www.northwestern.edu/international/international-students/student-employment/cpt-for-f1-students.html"],["Inside Higher Ed (DHS: “Schools and employers should consider themselves on notice”)","https://www.insidehighered.com/news/quick-takes/2026/08/31/dhs-limits-internships-international-students"],["NAFSA (the case tracker, still stamped September 4 — no order with a week to the effective date)","https://www.nafsa.org/legal-defense-DS"],["NAFSA (the fall 2026 outlook — 111,000 fewer students, $3.4bn, and Michigan at $284.0m)","https://www.nafsa.org/fall2026outlook"],["Yale OISS (the university telling students the four-year admit-until date begins September 15, with no mention of the litigation)","https://oiss.yale.edu/immigration/elimination-of-duration-of-status-summary-faqs"]] },
      { t: "⚠️⚠️ MICHIGAN: TWO OF THIS DESK'S OWN STANDING CLAIMS ARE WRONG, AND ONE OF THEM HAS BEEN CHASED FOR THREE RUNS ON A FALSE PREMISE. FIRST, THE DISASTER DECLARATION. This desk has reported for two runs that there was no disaster declaration after the Detroit tornado — “checked, not there.” There is one. MAYOR MARY SHEFFIELD DECLARED A LOCAL STATE OF EMERGENCY ON FRIDAY, SEPTEMBER 4, at an afternoon news conference with city department heads. It gives the city broader authority to mobilise local resources for cleanup and to support residents in the hardest-hit area, and lets it begin discussions with state and federal officials about recovery resources. No specific state or federal request has been made. The claim is corrected here rather than quietly dropped. SECOND, AND MORE EMBARRASSING BECAUSE IT DROVE THREE RUNS OF SEARCHING: THE FY2027 MICHIGAN BUDGET IS NOT PENDING AGAINST AN OCTOBER 1 DEADLINE. IT WAS FINALISED ON JULY 3. Lawmakers passed a roughly $85 billion budget after an all-night session, with $22.9bn across K-12 and higher education. Senate Appropriations chair Sarah Anthony: “It's a truly bipartisan budget.” House Speaker Matt Hall, dissenting: “If we go to real dollars spent, we can cut $3 billion of waste, fraud, and abuse in this budget.” Only amounts tied to federal funding not yet received remain uncertain. The thread is retired. ⭐⭐ THE YPSILANTI TOWN HALL IS TOMORROW, AND THE MOST USEFUL NEW NUMBER SHARPENS EXACTLY THE QUESTION THIS DESK HAS BEEN CAREFUL ABOUT. Michigan Advance reports the planned $1.2bn U-M facility is about 300,000 square feet, of which APPROXIMATELY 250,000 SQUARE FEET SERVES LOS ALAMOS CLASSIFIED WORK AND 50,000 SUPPORTS UNIVERSITY NON-CLASSIFIED RESEARCH. Five-sixths classified. That does not resolve the modelling-versus-materials distinction — U-M's Paul Corliss says the centre “would not involve the storage or handling of nuclear materials,” and its own Record describes “computational modeling for nuclear stewardship,” which remain compatible — but it does tell you what the building mostly is. THREE NAMED CRITICS, ALL NEW: Dylan Spaulding, senior scientist in the Union of Concerned Scientists' Global Security Program, says the classified component suggests “a more aggressive approach towards weapons-related science”; Stewart Prager, professor of astrophysical sciences at Princeton, says current US activities are “proliferative” and that “This does not maintain the status quo”; Nathan Kim, a doctoral student and Graduate Employees Organization organiser, says “We refuse to have our livelihoods … be part of this project.” A THIRD U-M VOICE, distinct from Kolb and Corliss: project lead Steve Ceccio calls the activities “a continuum” serving national security and cites wildfire modelling and Arctic sea-ice research. Los Alamos declined to comment despite weeks' notice. ⭐ A SITTING REGENT OPPOSES IT: Ypsilanti Township's own data-centre page names U-M Regent Paul Brown as calling for the project to be halted and publishes a phone number for residents. The town hall is 5 to 7 p.m. Wednesday at the Marriott at Eagle Crest, at capacity since August 20, with a waitlist and a livestream; registration for the second town hall on October 1 OPENS THURSDAY. ⚠️ Keep the two Ypsilantis apart: the CITY approved a 60-day emergency moratorium on new data-centre zoning permits on September 1 and advanced it on second reading yesterday, but it applies only inside city limits and DOES NOT AFFECT THE TOWNSHIP SITE. ⭐ THE POLITICS AROUND IT HAVE STATEWIDE NUMBERS NOW: an EPIC-MRA poll finds 73% OF MICHIGAN VOTERS OPPOSE federal tax incentives accelerating data-centre development and 62% oppose Michigan projects generally, and Senator Jim Runestad has announced legislation to repeal the state's data-centre sales and use tax exemptions — “We shouldn't be paying billion-dollar tech conglomerates to farm” the state's resources. ⭐ THE CANVASSERS FINDING HARDENS, AND A PATTERN APPEARS. The Board of State Canvassers still has NO SEPTEMBER MEETING AT ALL, its next date October 23, five weeks after ballots begin mailing September 19. New today: this is the FIFTH cancellation of 2026 — April 17, May 8, July 31, August 14 and September 4 — and the asymmetry is the point. May 8 was rescheduled to May 21 and August 14 to August 17. SEPTEMBER 4 WAS NOT RESCHEDULED. Still no published reason. ⚠️ And an item that belongs beside it: a vendor, Idemia, misprinted 8,200 Michigan enhanced licences and state IDs on August 26 with a stock photo and the wrong date of birth, delivered the week of September 6. Corrected cards are already out, but it is an identification error arriving eleven days before ballots mail.",
        s: [["ClickOnDetroit (Mayor Sheffield declares a local state of emergency after the EF2 tornado — the correction to this desk's “no declaration”)","https://www.clickondetroit.com/news/local/2026/09/04/mayor-mary-sheffield-declares-state-of-emergency-after-tornado-hits-detroit-s-east-side/"],["Michigan Advance (the computing centre — 250,000 of 300,000 square feet for classified Los Alamos work, with three named critics)","https://michiganadvance.com/2026/09/04/u-ms-proposed-computing-center-draws-concerns-over-role-in-nuclear-weapons-modernization/"],["Michigan Advance (EPIC-MRA: 73% oppose data-centre tax incentives; Runestad's repeal bill)","https://michiganadvance.com/2026/09/07/michigan-data-centers-the-weekly-download-4-2-2/"],["Ypsilanti Township (the data-centre page — Regent Paul Brown calling for a halt, and the resolution history)","https://ypsitownship.org/government/boards___commissions/board_of_trustees/data_center_information.php"],["Michigan Secretary of State (the Board of State Canvassers — no September meeting, next date October 23)","https://www.michigan.gov/sos/elections/bsc"]] },
      { t: "⭐⭐ MIND & COSMOS — THE RESEARCH PIPELINE IS EMPTY, AND FOR ONCE THAT IS A FINDING RATHER THAN A FAILED CHECK. Zero experiments, zero theory papers, zero design papers in the last twenty-four hours. Both APS journals were fetched, both rendered, and both stop dead at SEPTEMBER 4: Physical Review Letters is unchanged at volume 137, issue 10, and PRX Quantum at article 7, 033046. Nothing dated September 5 through 8 exists in either. The calendar explains it exactly — a weekend followed by Labor Day, the same closure that kept Pasqal from trading — and the discipline of fetching both journals is what makes the emptiness reportable rather than merely unobserved. Against Saturday's tally of four experiments, two theory papers, two company announcements, two commentaries and one essay, today's window is three announcements, four commentaries and one essay: eight items, not one of them a result. ⭐⭐ THE MISSING-ERROR-BAR CHECK FIRES FOR A FIFTH CONSECUTIVE RUN, AND THIS TIME IT FIRES AT THE REGULATOR RATHER THAN AT A JOURNAL. New Zealand's Ministry of Health has approved TWO PSYCHIATRISTS TO PRESCRIBE MDMA FOR TREATMENT-RESISTANT PTSD, and separately two clinicians for psilocybin — patients 18 and over, controlled clinical settings only, no take-home dosing, approved protocols, case by case. The Medsafe announcement's own qualifier is the load-bearing sentence: “The approval does not mean MDMA has been approved as a medicine in New Zealand. Evidence on its use for PTSD is still emerging internationally.” The announcement cites NO trial data, no p-values, no confidence intervals and no effect sizes, and the specialist coverage carries none either. A prescribing authorisation has been granted on an evidence base the regulator itself declines to quantify — which is the same defect as the unblinding thread this desk spent a week recovering, arriving one level further up. ⚠️ A DATE DISCIPLINE NOTE THAT MATTERS: Psychedelic Alpha carried this on September 7, but THE REGULATORY EVENT IS SEPTEMBER 4, confirmed against the ministry's own page. Carrier date is not event date. From the specialist coverage, the economics are the interesting part: Dr Gary Wynn, one of the two approvees, waited THIRTEEN MONTHS for approval and expects six months for those who follow; his practice capacity is about FIFTEEN PATIENTS A YEAR on a three-dose protocol; and the patient cost is roughly NZ$15,000, about US$9,000. Australia, which approved in July 2023, treats FEWER THAN 100 PATIENTS ANNUALLY. He says “I have not seen or heard a negative response … other than frustration at the cost.” A legal supply constrained to fifteen patients per prescriber per year at nine thousand dollars each is a rationing mechanism whatever the statute says. ⚠️ Psychedelic Alpha's own stall lengthens: the Bulletin is still #230 from September 1, and FIELD NOTES IS STILL #4 FROM AUGUST 21 — an eighteen-day stall, one day longer than yesterday. Neither PsyPost vertical has published since September 5. ⭐ A CORRECTION TO YESTERDAY'S CONTEMPLATIVE READING: this desk reported Buddhistdoor “silent Sept 5–7.” IT PUBLISHED TWICE IN THAT WINDOW, and the story is a large one nobody on this beat had. A glacier fracture on Langtang Lirung in Nepal on AUGUST 26 triggered an avalanche equivalent to a magnitude 5.2 earthquake, swelling the Trishuli River into a landslide across Nepal's Rasuwa district and Tibet's Gyirong County. Buddhistdoor's September 5 editorial gives over 1,000 dead and about 4,000 missing including 583 foreigners, with the Dalai Lama: “I pray for all those who have lost their lives, and offer my sympathy and heartfelt condolences to the bereaved.” Tricycle's September 7 piece has the toll two days later at 1,222 dead and nearly 5,000 missing in Nepal, plus 21 dead and more than 540 missing in Tibet, and lists the responding organisations. ⚠️ Every one of those figures is a bare point estimate with no range and no revision note, which is normal for a disaster toll and worth saying rather than smoothing. ⚠️ ROUTE STATUS, PLAINLY: essentiafoundation.org RECOVERED from yesterday's block and its content had not moved, the ~seven-day piece not yet due; physicsworld.com/feed/ FAILED a second consecutive day; lionsroar.com/feed/ FAILED a third, and its homepage renders no dates at all, which is a weaker method and is labelled as one. ⚠️ A new trap on the Physics World fallback: the most recent dates on its quantum section page are FUTURE CONFERENCE LISTINGS, not publications — a shallow read would report September 9 content that does not exist. Pasqal has no new close and cannot have one until this afternoon; Friday's $7.96 stands, with settled volume revised up to 3,154,885.",
        s: [["Physical Review Letters (the recent index — unchanged at volume 137, nothing after September 4)","https://journals.aps.org/prl/recent"],["New Zealand Ministry of Health (two psychiatrists approved to prescribe MDMA — “Evidence on its use for PTSD is still emerging internationally”)","https://www.health.govt.nz/news/two-psychiatrists-granted-approval-to-prescribe-medicinal-mdma-for-ptsd"],["Psychedelic Alpha (Josh Hardman on the New Zealand approvals — thirteen months, fifteen patients a year, NZ$15,000)","https://psychedelicalpha.com/news/two-new-zealand-psychiatrists-approved-to-prescribe-mdma-for-ptsd/"],["Buddhistdoor Global (Unity Over Division Amid the Nepal-Tibet Floods — the Langtang Lirung glacier fracture and the Dalai Lama's message)","https://www.buddhistdoor.net/features/buddhistdoor-view-unity-over-division-amid-the-nepal-tibet-floods/"],["Tricycle (Buddhist organizations respond to Nepal's flash floods — 1,222 dead and nearly 5,000 missing)","https://tricycle.org/article/buddhist-organizations-respond-to-nepals-flash-floods/"]] },
      { t: "⭐⭐ THE QUESTION THIS DESK PUT TO ITSELF YESTERDAY WAS ANSWERED IN THE STRONGEST POSSIBLE WAY: *POSSIBLE LOVE* IS ON THE TOMATOMETER AT 100%, AND IT HAS TAKEN VENICE'S TOP SLOT. Lee Chang-dong's first film in Venice competition in twenty-four years scored on 15 reviews, with no audience ratings yet, and it displaces Robert Pattinson's *Primetime* — which itself rose from 94% to 95% — as the festival's best-reviewed title. The full scorecard four days from Saturday's Golden Lion: *Possible Love* 100%, *Primetime* 95%, *Oasis: Don't Look Back in Anger* 93%, McDonagh's *Wild Horse Nine* 90%, Boyle's *Ink* down from 86% to 83%, Herzog's *Bucking Fastard* 71%, and a new entry, *The Basics of Philosophy*, at 64%. *Bunker* and *Naza* remain unscored; *Naza* premieres Thursday. ⚠️ The scorecard listed *Wild Horse Nine* above *Oasis* despite the lower percentage, so treat the percentages as reliable and the row order as not; no review counts are published. Rotten Tomatoes independently confirms the running time at 2h 44m and both US dates — limited October 23, streaming November 6 — and lists a FIFTH billed cast member this desk did not have, Yuri, alongside Jeon Do-yeon, Sul Kyung-gu, Zo In-sung and Cho Yeo-jeong. Recall what is riding on Saturday: it is a Netflix film, Lee's first, made after he failed to secure theatrical backing, and it is South Korea's official Academy Award submission. A Golden Lion would be only the second for Korea, after *Pieta* in 2012. ⚠️ The ovation conflict is unresolved and stays flagged — six minutes, 6.5, and “over six.” 🔴 GEORGINA LIGHTNING HAS DIED AT 63, AND IT IS THE DAY'S SIGNIFICANT FILM DEATH. The Cree filmmaker and actor — a citizen of the Samson Cree Nation, born and raised in Edmonton, and one of the first Indigenous women to direct a major feature — was killed on Saturday September 5 at the Enoch Rodeo Grounds in Alberta, STRUCK BY AN OFF-TRACK HORSE WHILE FILMING IN THE MEDIA AREA. Her daughter, the actor Crystle Lightning, announced it on Sunday: “I have lost my mother, my sons Kohkum, my matriarch, my role model, my confidant.” Her debut *Older Than America* (2008) won twenty-three festival awards; she also worked on *Johnny Greyeyes*, *DreamKeeper*, *Blackstone*, *Trickster*, *Three Pines* and *Alaska Daily*. The Enoch Cree Nation said the community was “grieving.” Verified at Native News Online and the Globe and Mail. ⭐ AND THE BACKLOG PAID AGAIN: MICHAEL MENDL IS PROMOTED FROM AGGREGATOR LEAD TO CONFIRMED FACT. The German actor died on September 5 at 82; his agent told the German Press Agency he had “passed away peacefully,” and the family confirmed. He played Artillery General Helmuth Weidling in *Downfall*, won a Golden Camera for playing Willy Brandt, and appeared in Netflix's *Dark*. On himself, in 2019: “I'm a character actor. I play the difficult roles — even the villainous ones.” Also new to the aggregator and still one-outlet, so carried as leads rather than facts: the Latvian director and former MEP Rihards Pīks at 84 on September 7, the New Zealand printmaker Barry Cleavin at 86, and the Czech singer Richard Tesařík at 80. Separately, EDWARD FIELD, the WWII airman who became a National Book Award-winning poet of gay bohemian New York, died on September 7 AT 102. ⚠️ NPR's obituaries section came back empty in window for a FOURTH consecutive day while the aggregator produced; the two-route rule keeps earning its place. ⚠️ CRITERION'S DECEMBER SLATE HAS NOT LANDED — checked, not there — so the ~September 15 expectation stands, and the November 3 and November 10 clusters read correctly again after Saturday's rendering failure. *12 Angry Men* has dropped off the coming-soon page, consistent with releasing today. ⚠️ ON THE AUTEURS: nothing on Lynch, von Trier or Noé, and REFN'S CAST ANNOUNCEMENT HAS STILL NOT FIRED — Cineuropa's “Cast and Creative Team: Not yet announced” stands. A March piece quotes *Maniac Cop* originator William Lustig saying Refn was preparing to shoot “in the autumn,” i.e. autumn 2026, against the January 2027 date this desk carries from a July interview; the later source most likely supersedes rather than contradicts, and both are recorded. ⚠️ THE STEDELIJK'S KUSAMA RETROSPECTIVE OPENS SATURDAY AND THE EXHIBITION PAGE STILL READS AS THOUGH SHE IS ALIVE — describing her as “born 1929” and referencing her current work from Tokyo, twelve days after NL Times reported the show would become a tribute. ⭐ But a correction this desk owes itself: the museum HAS responded, on a separate news page titled “Stedelijk responds to the passing of Yayoi Kusama,” whose text is robots-blocked. It is the exhibition page, not the museum, that is silent. Still no memorial date and no press view. ⭐ And in the wider art world, The Art Newspaper's September 7 slate is unusually good: the $1bn Lucas Museum of Narrative Art finally opens to the public September 22 with more than 1,300 works across thirty-plus galleries by Ma Yansong of MAD Architects — George Lucas: “The Lucas Museum of Narrative Art was created to honor humanity's stories and the artists who illustrate them” — alongside David Chipperfield's conversion of Banco Santander's headquarters into Faro Santander, a 51-work donation by Dimitris Daskalopoulos to museums in Greece and Scotland, and Beyoncé's $2m gift to the Studio Museum in Harlem. ⚠️ The 40,000-work figure elsewhere reported is the collection; 1,300-plus is what opens.",
        s: [["Rotten Tomatoes (the Venice 2026 scorecard — Possible Love enters at 100%, above Primetime's 95%)","https://editorial.rottentomatoes.com/guide/venice-film-festival-2026-scorecard/"],["Native News Online (Georgina Lightning, groundbreaking Cree filmmaker and actress, dies at 63)","https://nativenewsonline.net/arts-entertainment/georgina-lightning-groundbreaking-cree-filmmaker-and-actress-walks-on-at-63"],["Bluewin (Michael Mendl, Downfall's General Weidling, dies at 82 — his agent tells DPA he “passed away peacefully”)","https://www.bluewin.ch/en/people/actor-michael-mendl-has-died-li.3588793"],["Criterion (the coming-soon page — no December slate, November 3 and November 10 reading correctly)","https://www.criterion.com/shop/browse?popular=coming-soon"],["Stedelijk Museum (the Kusama exhibition page, four days from opening, still carrying no tribute)","https://www.stedelijk.nl/en/exhibitions/yayoi-kusama-en"],["The Art Newspaper (the September 7 slate — the Lucas Museum, Faro Santander, the Daskalopoulos gift and Beyoncé's $2m)","https://www.theartnewspaper.com/"]] },
