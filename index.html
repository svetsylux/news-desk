  hooks: [
    { story: "Two fuels come out of the same barrel of crude, refined in the same plants, sold on the same forecourts. Over the last year one of them has risen 58.9% and the other 29.6%. The national average price of diesel set a record on Friday at $5.85 a gallon, broke it again on Saturday at $5.8819, and broke it a third time on Sunday at $5.8970 — now a penny below $5.90, up 29.4 cents in a week and 55 cents in a month. Regular gasoline over the same week rose 6.9 cents, to $4.1473. THE SPREAD BETWEEN THEM IS NOW $1.75 A GALLON. And the futures board says the same thing in a different voice: on Monday's shortened session heating oil — which is the distillate contract, chemically diesel's near-twin — was the strongest mover on the board at +1.85%, while gasoline futures fell 0.42%. Crude itself is up, on war news out of Hormuz, but crude being up cannot by itself explain this, because a crude shock lifts both fuels together. Something is happening to diesel specifically.",
      src: ["AAA national average fuel prices (diesel $5.8970, gasoline $4.1473, data stamped September 6)","https://gasprices.aaa.com/"],
      concept: "Joint production in fixed-ish proportions, and why a shock to one output shows up in a SPREAD rather than in a parallel shift. A barrel of crude does not yield diesel or gasoline at the refiner's discretion; it yields a slate of products in proportions that can be adjusted only within a range and only at a cost. This makes gasoline and diesel classic JOINT PRODUCTS, like wool and mutton, or like beef and hides — and joint production is the case where the neat one-good supply curve of the textbook stops working, because the marginal cost of producing one output is not separable from the other. Under joint supply, a demand shift for one product cannot simply be met by making more of it; it has to be rationed by price, and the relative price of the two outputs does the work that quantity adjustment would do in a single-product industry. This is also the cleanest available example of DERIVED DEMAND, since almost nobody consumes diesel for its own sake — it is demanded because freight, agriculture and construction are demanded, which is precisely why a diesel price is a leading indicator for goods prices in a way a gasoline price is not.",
      q: "Put the four numbers on the board and nothing else: diesel +58.9% year on year, gasoline +29.6%, spread $1.75, both from the same barrel. Ask what could make that happen, and let them work through the candidates in order, because each one is a real mechanism and each one is testable. FIRST candidate: demand. Ask who buys diesel and who buys gasoline, and let them arrive at the answer themselves — diesel is bought by trucks, trains, ships, tractors and generators, which is to say by FIRMS, as an input, while gasoline is bought overwhelmingly by households, as a final good. That single distinction does most of the analytical work in this hook, and it is worth dwelling on: demand for an input is derived from demand for the output it helps make, so it inherits that output's elasticity and its cyclicality. A trucking firm cannot decide to drive less this month in the way a household can decide to skip a weekend trip. SECOND candidate: supply. Ask whether a refiner facing a $1.75 spread would simply make more diesel — and the answer, satisfyingly, is 'somewhat, and then no.' Refineries can shift their yield within a band by changing crude slate and unit configuration, but the band is narrow in the short run and the equipment is fixed. So you get exactly the shape they should recognise: a supply response that is real but sharply inelastic, which means the adjustment has to come mostly through price. THIRD candidate, and this is where the news comes in: the war. Ask them to predict, before you tell them, whether a Hormuz disruption should hit diesel or gasoline harder, and why. Give them the hint that the Gulf's export slate is heavy in middle distillates. Then the exercise that makes it stick, and it takes ten minutes with a phone: have them find the diesel-gasoline spread for the same week in 2019, 2022 and today, and ask which of the three looks like a normal year. They will discover 2022 was worse, which is the useful surprise — this is a repeat of a known pattern rather than a novelty, and the 2022 episode has a literature they can read. If you want the harder follow-up for a strong group: ask what a policy of capping the diesel price would do under joint supply, and let them find the answer that a naive single-good model hides — that it does not merely create a diesel shortage, it changes the refiner's incentive to produce gasoline too, because the two decisions were never separate in the first place." },
    { story: "A randomised controlled trial works because neither the participant nor the assessor knows who got the drug. That is the whole mechanism — randomisation makes the groups comparable, and blinding keeps them comparable after treatment starts, by preventing expectation from doing the work the molecule is supposed to do. Now here is what a systematic review of 112 randomised clinical trials of psychedelics as psychiatric treatments found. In trials of psilocybin, LSD and ayahuasca, BLINDING FAILURE RATES EXCEEDED 90% — participants worked out which arm they were in. That number should not be surprising if you think about it for two seconds, which is the point: a substance whose defining feature is that it produces an unmistakable altered state is a substance whose blind cannot survive contact with the participant. But the second finding is the one worth a class. ONLY 29.5% OF THOSE TRIALS — 33 OF THE 112 — EVALUATED BLINDING INTEGRITY AT ALL. A further 57.1% mentioned it as a limitation in the methods section, which is to say they named the problem in prose and did not measure it. And the review reporting all this offers not one confidence interval, including on its own headline figure.",
      src: ["Clinical Trial Vanguard — the systematic-review figures (112 trials, >90% blinding failure, 29.5% evaluating integrity)","https://www.clinicaltrialvanguard.com/opinion/psychedelic-trials-are-effectively-open-label-the-fda-has-to-decide-what-to-do-with-that/"],
      concept: "Identification, and the economics of who bears the cost of measuring a threat to your own result. The first half is methodological and belongs in any course that touches causal inference: an RCT's claim to identify a causal effect rests on an assumption — that assignment is uninformative to the participant — and when that assumption fails, the design degrades continuously toward an observational study with a motivated sample. The estimate does not become meaningless; it becomes an estimate of a different quantity, the combined effect of drug and expectation, which is not the quantity the label will claim. The second half is pure incentives, and it is the part economists are better placed to teach than clinicians. Measuring blinding integrity is CHEAP — you ask people to guess which arm they were in, and you count. So why do seven trials in ten not do it? Because the cost of the measurement is borne by the party running the trial, while the benefit accrues to the reader, the regulator and the field; and because the measurement can only ever damage your own paper. This is a private-cost/social-benefit divergence with a nasty twist: the private return to the information is NEGATIVE for the person best placed to collect it.",
      q: "Open by asking what an RCT is for, and insist on a precise answer rather than 'to test if a drug works' — push until somebody says something like 'to make the treated and untreated groups comparable so the difference in outcomes can be attributed to the treatment.' Write the word ASSUMPTION on the board next to it. Then give them the 90% and ask what it does to that assumption, and let them talk themselves from 'the study is worthless' — which is wrong and which somebody always says first — to the accurate version: the study now estimates drug-plus-expectation rather than drug, and the two are only the same quantity if expectation does nothing, which is precisely the thing nobody believes about psychedelics. That distinction, between an invalid estimate and a valid estimate OF SOMETHING ELSE, is worth ten minutes by itself and it transfers to everything they will ever read. Now turn it into the economics, because the 29.5% is the better half of the lesson. Ask: measuring this costs almost nothing — one question, asked once, at the end. Who pays for it, and who benefits? Let them build the divergence themselves, and then ask the sharpest version of the question: what is the private expected return to a trialist of collecting a number that can only ever weaken their own paper and can never strengthen it? Somebody will spot that it is not merely small, it is negative — and at that moment they have derived, without being told, why disclosure requirements exist and why they are almost never voluntary. Three extensions if you have the time. FIRST, the mechanism-design version: design a rule that gets blinding integrity measured. Requiring it as a condition of publication, requiring it as a condition of regulatory submission, pre-registering the guess question, funding an independent third party to ask it — and for each, ask who now bears the cost and what the new evasion is. SECOND, the health-economics version, and this one is not hypothetical: if the effect estimate includes expectation, what is the payer actually buying, and how would you price it? Note that expectation effects are real effects — patients genuinely improve — which makes this a question about what a payer is entitled to be told rather than about whether anyone was helped. THIRD, for a quantitative group: this is a live and publishable question. Ask how you would estimate the size of the expectation component given only guess-accuracy data and outcomes, and let them discover that guess accuracy is itself an outcome-correlated variable, so the obvious regression is contaminated. That is a genuine identification problem, in a live literature, that they can understand in one class." },
    { story: "One federal formula, applied to one university, produced ten different answers. In August an office inside the Department of Homeland Security sent American universities two broadcast messages — one dated August 12, one dated August 24 — narrowing when international students may be authorised for Curricular Practical Training, the mechanism by which an F-1 student takes an internship. The operative test is a single sentence, and it is the same sentence at George Washington, Rochester, Washington, Michigan, USC and now Harvard: no CPT unless the practical training is REQUIRED OF ALL STUDENTS IN THE PROGRAMME. Harvard is the eighteenth institution to act, and the only one to publish which of its own schools lose it. CPT is gone at Harvard College, the Law School, the Medical School, the Graduate School of Design and the Graduate School of Arts and Sciences. It survives at the Business School, the Kennedy School, the Graduate School of Education, the Divinity School and the School of Public Health. Same university, same rule, same week, five and five. And Berkeley, independently citing the same two dated memos, arrives at the mirror image: it has suspended 'Course Credit CPT' while leaving degree-requirement CPT untouched.",
      src: ["The Harvard Crimson — the Harvard International Office's school-by-school CPT split, and the two SEVP broadcast messages of August 12 and August 24","https://www.thecrimson.com/article/2026/9/3/cpt-authorizations-halted/"],
      concept: "The INCIDENCE of a uniform rule, and why a rule that treats everyone identically almost never affects everyone equally. This is the same logical move as tax incidence, generalised beyond taxes and stripped of the arithmetic that usually hides it: the statutory application of a rule and its economic burden are different objects, and the difference is determined by the structure that was already there when the rule arrived. Nothing in the federal formula mentions business schools or medical schools. The formula asks one structural question — is this training required of everyone? — and the answer was already fixed, years ago, by curricular decisions made for reasons having nothing to do with immigration. Professional programmes that had embedded a required practicum with cooperating employers pass; a College and an arts-and-sciences graduate school, whose internships are elective by design, fail. The burden lands not where anyone chose to put it but where the pre-existing elasticity of the affected party is lowest — here, where the curriculum is least able to reclassify itself in response.",
      q: "Do not explain any of this. Put the two lists on the board — five schools that keep CPT, five that lose it — and give them only the rule: training must be required of all students in the programme. Ask them to work out what distinguishes the two columns. They will get it, and getting it themselves is the entire pedagogical point, because the abstraction they are deriving is the one that usually needs three lectures. Once somebody has said 'the ones that keep it already required internships,' write on the board: THE RULE DID NOT CHOOSE THE WINNERS. THE EXISTING STRUCTURE DID. Then run the analogy explicitly, because they will not see it unaided. Ask who bears a payroll tax that is statutorily levied half on employer and half on employee, and let them recall that the answer depends on relative elasticities rather than on what the statute says. Then ask what the analogue of elasticity is here — and let them find it: how easily can a programme redesign its curriculum to make the internship mandatory? A business school with a required capstone is inelastic in the useful direction, having already complied by accident. A doctoral programme in economics, where internships are elective and idiosyncratic, cannot make one mandatory for everyone without changing what the degree is. Now the second half, which is where a strong class earns its keep. Ask what programmes will do NEXT, and let them reason to the prediction: some will make internships a formal degree requirement, purely to restore eligibility. Then ask the question that turns it into economics rather than administration — is that a good outcome? A requirement adopted to satisfy an immigration test, and imposed on every domestic student in the programme too, is a real curricular cost borne by people the rule was not about. That is regulatory spillover, it is measurable, and none of it appears in any impact assessment. Two extensions. FIRST: eighteen institutions did not independently reach the same conclusion — they read the same two memos, which expressly disclaim being rules. Ask what it means that a document declaring itself not to be a rule produced identical national behaviour, and you have a clean case of a focal point doing the work of law. SECOND, for a quantitative group: this is a natural experiment with a defined start date and a structural assignment variable. Programmes with pre-existing required practica are, in effect, the control group. Ask them what they would want to measure, and whether the assignment is plausibly exogenous — and let them notice that it is not quite, because programmes that required internships in 2024 differ systematically from those that did not." },
  ],
  pulse: [
    { cat: "Playing", t: "Two games, one morning, one rating system — and one of them has 278 opinions behind its numbers while the other has 13",
      why: "Onimusha: Way of the Sword sits at a Metascore of 85 on 91 critics with a user score of 8.7 on 187 ratings. Yesterday it was 85 on 89 critics with a user score of 8.9 on FIFTY-ONE ratings. So in one day the critic count moved by two and the critic score did not budge, while the user base more than tripled and the user score fell two tenths. That drop is not the game getting worse; it is the sample changing. The first fifty raters were the people who pre-ordered a niche samurai action game and rushed to post about it, which is about as selected a population as exists, and the mean sank as ordinary buyers arrived. Meanwhile NBA 2K27 went from a Metascore of 79 on FIVE critics to 75 on NINE — four extra reviews moved the aggregate four points — with a user score of 4.5 on FOUR ratings. A thirty-point gap between critics and users, which in this franchise is the annual revolt over microtransactions, resting on thirteen observations in total. Both games display their numbers at identical apparent precision, and nothing on either page tells you that one is built on 278 opinions and the other on 13.",
      rec: "Pull up both pages side by side on the projector and cover the sample sizes with a hand. Ask which number they trust more. Then uncover. The line worth landing, and it generalises far past video games: sample size is not a property of the thing being measured, it is a property of who bothered to show up — which means a rating is most reliable exactly where it is least needed, because the games everyone plays get thousands of raters and the obscure ones get five. If a student asks how you would fix it, that is the right question and the honest answer is that Metacritic could publish a confidence interval and has chosen not to, because an interval would make most of the site's numbers look as uncertain as they are.",
      src: ["Metacritic — NBA 2K27 (75 on nine critics; user 4.5 on four ratings, read September 7)","https://www.metacritic.com/game/nba-2k27/"] },
    { cat: "Listening", t: "Ella Langley's twentieth week at number one is now confirmed — and the twenty-first is decided by a chart that publishes this morning",
      why: "The ambiguity this desk was carrying is resolved: the Hot 100 dated September 5 IS week twenty for “Choosin' Texas,” in its forty-sixth week on the chart, and the twenty-first week will be the chart dated September 12, which arrives with Billboard's Monday refresh — today. It had not posted at 5 a.m. She currently holds THREE of the Hot 100's top ten. Underneath the chart the song is still growing rather than coasting: kworb's Spotify US daily has it at number one on 1,574,023 streams, up 93,530 on the day, with “Be Her” eighth on 795,644 and gaining 44,304. ⚠️ One instrument note that matters for anyone checking behind this: kworb's US page had been serving the same stale snapshot twice over on Saturday and has now unstuck, though it still runs a day behind the global page — the two series are never merged, and every leg here ties out exactly against yesterday's figures by change-column arithmetic.",
      rec: "The interesting question is not who is number one but why the top of a streaming chart has become so much harder to dislodge. The weeks-on-chart figures for the current top ten are 46, 19, 12, 5, 13, 48, 48, 18, 53 and 28 — Olivia Dean has a song in its fifty-third week. Ask your students what USED to remove a hit from the charts, and let them find the answer by elimination: radio rotation limits, and finite shelf space in a record shop. Streaming abolished both. There is no slot that a new release must take from an old one, so turnover collapsed and incumbency compounds through algorithmic recommendation. It is a capacity-constraint story with the constraint removed, and they will recognise it faster than they expect.",
      src: ["Billboard chart highlights — the Hot 100 dated September 5, Langley's twentieth week","https://www.billboard.com/lists/enhypen-ella-langley-stella-lefty-chart-highlights-sept-5"] },
    { cat: "Listening", t: "A song from 1982 is climbing the global chart, and “Mr. Brightside” is back inside the American top ten at twenty-three years old",
      why: "The standing “2026 is the new 2016” trend has quietly become something larger than a nostalgia cycle, because the newest leg is forty-four years old. Michael Jackson's “Billie Jean” sits at number nine on Spotify's global daily chart on 2,803,671 streams and is RISING, up 81,916 — while the two legs this desk has been tracking are easing: Bieber's “Beauty And A Beat” (2012) fourth on 3,223,757, Katy Perry's “The One That Got Away” (2010) sixth on 3,125,322. The Killers' “Mr. Brightside,” which could not be refreshed on Saturday, is back: number forty globally, and number NINE in the United States on 785,554 streams, up 49,845, in its twenty-third year. It rhymes on video, too — FlixPatrol's worldwide film chart for September 6 has “The Sixth Sense” (1999) at sixth and “The Blind Side” (2009) at ninth.",
      rec: "Resist the urge to call this nostalgia, because for a nineteen-year-old it is not — none of these songs is being remembered, they are simply being encountered. That is the useful observation and it is worth saying out loud to a class: recommendation feeds and short-video sound reuse have deleted release date as a sorting variable, so the catalogue arrives flat, undated and adjacent to new releases, and a track from 1982 competes on exactly the same surface as one from last week. Ask them how they first heard the oldest song they like. The answers will be striking, and they set up a real question you can hand them: if age no longer sorts music, what does the recording industry's traditional distinction between “catalogue” and “front-line” product still measure?",
      src: ["kworb — Spotify global daily (“Billie Jean” ninth on 2,803,671, up 81,916)","https://kworb.net/spotify/country/global_daily.html"] },
    { cat: "Watching", t: "Spider-Man took a sixth consecutive weekend at number one — and the two domestic totals being reported are not in conflict, which is the interesting part",
      why: "“Brand New Day” held the top spot over Labor Day weekend with $18.0m across three days and a $23.3m four-day estimate, down 20% week on week — the first film to manage six consecutive number ones since “Avatar: The Way of Water.” Worldwide it is at $2.4bn. Domestically it is being reported two ways: Boxoffice Pro says $917,762,000 and TheWrap says $923m, both published on Sunday. ⭐ THEY RECONCILE EXACTLY. The gap is $5.3m, which is precisely the Monday holiday estimate — $23.3m minus $18.0m — so one figure stops on Sunday and the other includes the fourth day. Two numbers, one film, no error, and the whole discrepancy dissolves once you know which day each stops on. That is a rarer outcome than it sounds on this beat, where conflicting figures usually stay conflicting.",
      rec: "This is the best possible five minutes on why you always ask what a total is a total OF. Put both numbers up, ask which is wrong, let the class argue, and then show them the arithmetic that makes both right. The record it is chasing, by the way, is still quoted four different ways across four outlets — $936.66m, “$936 million,” $935.6m and $936.7m — and not one of those figures is adjusted for inflation, so the pursuit is less impressive than every headline implies. Measured in tickets rather than dollars, “Gone with the Wind” still leads and no chart in general circulation says so.",
      src: ["Boxoffice Pro — Spider-Man webs up Labor Day weekend for a sixth number one","https://www.boxofficepro.com/weekend-box-office-spider-man-webs-up-labor-day-weekend-for-sixth-1/"] },
    { cat: "Online", t: "The GTA 6 trailer is simultaneously absent from one Netflix chart and fifth on another, and both are correct",
      why: "FlixPatrol's daily worldwide top ten for September 6 does not contain “Grand Theft Auto VI: An Extended Look” at all. What's on Netflix, covering August 29 to September 5, has it fifth on 37 points. Neither is wrong and neither is stale — one is a single day and the other a weekly average of ranks, and a title that decayed steadily through the week can sit mid-table on the average while having already dropped off the daily chart entirely. ⚠️ THEY MUST NOT BE AVERAGED, and the temptation to do so is the actual hazard here. ⭐ Also worth retiring: What's on Netflix has published since September 1, so the staleness flag this desk put on it comes off. The trailer's arc, for the record, went third, fifth, eighth and then gone in four days, having peaked at number one in 87 of 93 countries on 31.1 million cumulative views. The genuine under-25 title on both charts is “Outer Banks.”",
      rec: "This is a free lesson in censored data and it needs no setup. Ask why a title “disappears” from a top-ten list, and let someone say the obvious thing — that it stopped being watched — before you point out that all you actually observe is that it fell below tenth. The list censors at its own edge. Everything below the cut is recorded as the same value, namely absence, whether it was eleventh or five-hundredth. This is the identical structure to the Dolly Parton streaming series this desk watched vanish and then reappear HIGHER than where it dropped off, and it is the identical structure to every truncated dataset they will meet later. If they take one habit away, make it this: when a series ends, ask whether the thing stopped or the ruler ran out.",
      src: ["FlixPatrol — Netflix worldwide top ten, September 6","https://flixpatrol.com/top10/netflix/"] },
    { cat: "Reading", t: "A romantasy self-published in October 2025 is now on four of the five national bestseller lists — and the publisher arrived after the readers did",
      why: "Sheila Masterson's “The Poison Daughter” appears on Publishers Weekly, USA Today, the New York Times and the Indie Bestsellers lists — four of the five Book Riot aggregates. It was SELF-PUBLISHED IN OCTOBER 2025 and is charting now on the strength of a traditionally published collector's edition, described as having “a full-color illustrated case, designed endpapers, and an exclusive bonus chapter.” That is roughly eleven months from a self-published ebook to four national lists, with the publisher entering the story only after the demand was already visible and already measured. Five titles now appear on all five lists, up from three a week ago: “Theo of Golden,” “Yesteryear,” “Whistler,” “Dungeon Crawler Carl” and “The Calamity Club.” Book Riot notes in its own voice that the aggregated lists “continue to lack diversity on many levels, including being disproportionately by white authors.”",
      rec: "Ask your class to name the last book they bought a physical copy of and why, and see how many say something like “I already read it.” That is the whole business model here and it is worth being precise about: the collector's edition is not competing with the ebook, it is being sold TO the people who already own the ebook, which makes it a second sale to a customer whose willingness to pay has already been demonstrated. The supply chain ran backwards — readers made the market, the publisher bought in after the risk had resolved, and the product it sold was physical premium to an audience that reads on screens. There is a fuller version of this in today's classroom note.",
      src: ["Book Riot — the bestselling books of the week, according to all the lists","https://bookriot.com/bestselling-books-september-3-2026/"] },
  ],
  classnote: { t: "A romantasy novel called “The Poison Daughter,” by Sheila Masterson, is on four of the five national bestseller lists this week. It was self-published in October 2025. What is charting now is a traditionally published collector's edition — “a full-color illustrated case, designed endpapers, and an exclusive bonus chapter” — and the publisher arrived roughly eleven months after the book did. That sequence is the lesson, and it is one of the cleanest real-world illustrations available right now of three separate ideas your students will otherwise meet only as diagrams. START WITH THE PUBLISHER'S PROBLEM, BECAUSE IT MAKES THE OLD SYSTEM MAKE SENSE BEFORE YOU DISMANTLE IT. Ask the class to be a publisher in 2015 deciding whether to acquire a debut novel. What do you actually know? Almost nothing: no sales history, no measured audience, an editor's judgement and a comparison to something that sold. You are buying a lottery ticket, and you must pay the advance, the print run, the warehouse and the returns risk BEFORE you learn anything. Let them articulate why publishers behaved as they did under those conditions — small advances to unknowns, large ones to proven names, a portfolio in which a few titles pay for many failures. That is not stupidity or gatekeeping; it is rational behaviour under genuine uncertainty with a large, irreversible, up-front commitment. NOW CHANGE ONE THING. Self-publishing makes the cost of the first experiment nearly zero. Ask what that does, and push them past the obvious answer that “more books get published.” The deeper consequence is that THE UNCERTAINTY GETS RESOLVED BEFORE THE EXPENSIVE DECISION IS MADE. The publisher no longer has to guess whether there is an audience; it can watch one form and count it. What Masterson's publisher bought was not a manuscript of unknown value, it was a demonstrated demand curve. This is option value, and it is the version of the concept that actually lands: the ability to wait until the uncertainty resolves has a positive value, and here the entire industrial structure has reorganised itself around capturing it. Ask them who now bears the risk that used to sit with the publisher — the answer is the author, who wrote the book for nothing on the chance it would work — and then ask the uncomfortable follow-up, which is whether that is a better arrangement or merely a different one. Someone will note that we only ever hear about the authors for whom it worked. That is survivorship bias, arriving on its own, in a discussion about books. THEN THE THIRD IDEA, WHICH IS THE ONE THEY WILL ENJOY MOST. Look at what the publisher actually sold: a physical premium object, to an audience that reads on screens, most of whom ALREADY OWN THE BOOK. Ask what is being sold, since it is manifestly not the story. They will get there — the case, the endpapers, the bonus chapter, and the fact of owning the thing. Then ask why the bonus chapter exists at all, and let them see the mechanism: it converts “I already read this” from a reason not to buy into a reason to buy. This is second-degree price discrimination, and it is a much better example than the airline-seat one in the textbook, because the marginal cost of the ebook is essentially zero and everything above that is a pure sorting device separating readers who want the story from readers who want the object. Ask what the publisher would do if the two groups could resell to each other freely, and they will discover the arbitrage condition that makes price discrimination possible, without being told it. THREE EXTENSIONS, FOUR MINUTES EACH. FIRST: BookTok as an information technology rather than a marketing channel. What it does economically is make demand OBSERVABLE before it is monetised — ask what other markets would be transformed by a public, credible, pre-purchase signal of demand, and let them generate examples from video games, music and restaurants. SECOND: ask whether the publisher's late entry adds any value at all, or merely captures rent from a market someone else made. The honest answer is genuinely contested — distribution, physical production, foreign rights and retail placement are real inputs — and the argument is worth having precisely because it does not resolve cleanly. THIRD, if you have a quantitative group: Book Riot observes that the aggregated lists are “disproportionately by white authors.” That is an empirical claim with a testable structure. Ask how they would decide whether it reflects acquisition decisions, reader demand, or the construction of the lists themselves — and let them find that the three are hard to separate precisely because each one feeds the next.",
    src: ["Book Riot — the bestselling books of the week, according to all the lists (“The Poison Daughter” on four of five)","https://bookriot.com/bestselling-books-september-3-2026/"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
