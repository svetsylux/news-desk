  pulse: [
    { cat: "Listening", t: "The Dolly Parton shock is decaying, but the rate of decay has itself collapsed — from 42% a day to about 18%",
      why: "The chart dated Aug 27 showed a roughly 40% single-day fall. The chart dated Aug 28 — kworb's lag is holding at three days, so this is the freshest available — shows something different: “Jolene” down from 1,173,872 to 961,193, a fall of 18.1%, and now third; “9 to 5” down from 1,149,897 to 957,012, off 16.8%, and fourth; “Islands in the Stream” down 19.5% to 682,851 and out of the top fifteen entirely at seventeenth. Parton now holds two of the top fifteen, from three the day before and seven at the peak. So the shape of the whole event is now visible: a 90% rise in one day, a 42% fall the next, then an 18% fall, which is a decay curve flattening fast rather than a cliff. It has not found a floor yet, and the interesting question — whether the floor sits above the pre-death baseline — is still open and will resolve this week. Meanwhile Ella Langley's “Choosin' Texas,” which retook No. 1 on the 27th, actually grew on the 28th, from 1,334,454 to 1,443,703. The thing that was displaced is not merely back; it is bigger than before.",
      rec: "This is now a genuine two-point decay estimate rather than a single dramatic number, and that makes it a much better exercise. Give students the four daily figures for “Jolene” and ask them to fit something — anything — and then to forecast Friday. Then ask the question that separates description from economics: does the series return to its old level, or settle above it? A permanent shift would mean the event did not just move attention around, it added listeners who did not previously know the catalogue, and that is an empirically distinguishable claim.",
      src: ["kworb (Spotify US daily, chart dated Aug 28)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Playing", t: "The GTA 6 trailer held the No. 1 slot on Netflix for about three days and has now been beaten by a Robert De Niro thriller",
      why: "On Sunday morning the twenty-six-minute Grand Theft Auto VI: An Extended Look was the number one film on Netflix worldwide at 916 points. It is now second. The Whisper Man has taken the top slot in both the United States and worldwide, with The Secret Woman third. That is a very short reign for what was, by some distance, the most anticipated piece of promotional material in the history of the medium — the same video that pushed Netflix's web traffic up 125% and mobile up 50% against the average of the previous twelve Thursdays. Three days is roughly what a very large film gets, which is the useful comparison: the trailer behaved exactly like a piece of content, not like an event, and it decayed on the same schedule. Four days on, Take-Two has still said nothing about the terms of the Netflix arrangement; every quote from Strauss Zelnick that this desk can verify predates the premiere.",
      rec: "Put this next to the Parton numbers, because the two are unrelated in every way except the shape of the curve. Ask a class why almost nothing holds a number-one position any more, and what that implies about the value of buying one. If attention decays at 20 to 40% a day regardless of what you spent to acquire it, then the asset a marketer is actually buying is a few days of salience, and it should be priced like a perishable.",
      src: ["FlixPatrol (Netflix top ten)","https://flixpatrol.com/top10/netflix/united-states/"] },
    { cat: "Watching", t: "The film Warner Bros. wrote off opened to $15.4m — about five times its distributor's previous best — while the expensive one opened to $8m and a C",
      why: "Coyote vs. Acme took roughly $15m to $15.4m across the weekend with an A from CinemaScore, against Ketchup Entertainment's previous company best of $3.1m. Note the framing carefully, because one outlet ran this as an all-time box-office record and it is nothing of the kind: it is a company record, roughly a fivefold jump, and the distinction is the entire point. The economics are now fuller: Warner Bros. wrote the film off, sold domestic rights to Ketchup for about $50m, foreign rights went separately for about $20m, and marketing ran about $10m — against a production budget reported at $70m in one place and $30m in another, a discrepancy this desk still cannot resolve. The other new wide release, The Dog Stars, took $8m on a budget reported at $70m by the studio and $110m in production filings, with 41% on Rotten Tomatoes and a 41% definite-recommend on PostTrak. Its CinemaScore is now given as C where three outlets said C+ on Sunday; the desk flags rather than picks. Spider-Man: Brand New Day took a fifth consecutive number one at $22m and has now passed $2.3bn worldwide, overtaking Titanic. Your students care about the first of these specifically because they campaigned for it — the shelving of Coyote and Batgirl was, to them, a thing done to an audience rather than a business decision, and an A CinemaScore reads as a verdict.",
      rec: "The clean question is why a distributor whose ceiling was $3.1m could profitably release a film that a major could not. It is not taste and it is not courage; it is overhead and opportunity cost, and the same logic explains divestitures, spin-offs and the entire existence of secondary markets. The follow-up is sharper: was Warner Bros. wrong, or was the write-off a rational decision that a smaller firm could then arbitrage?",
      src: ["World of Reel (weekend actuals)","https://www.worldofreel.com/blog/2026/8/30/the-dog-stars-bombs-with-8m-opening-coyote-vs-acme-nabs-15m"] },
    { cat: "Reading", t: "The publishing week runs on a Tuesday clock, which is why there is nothing new to report on a Monday",
      why: "Book Riot's new-releases roundup is anchored to Tuesday, the industry's standard on-sale day, so the September 1 edition has not posted and the current list is still the six titles out on August 25 — Analeigh Sbrana's Heir of Prophecy, which is the dominant BookTok formula compressed into one sentence, and Meka James's The Marriage Rebound alongside Danticat, Hillier, Arias and Foster. The weekly bestseller roundup is likewise unchanged and next due around Thursday. This is worth noticing rather than apologising for: publishing still runs on a weekly release cadence inherited from physical distribution, in a market where discovery has moved almost entirely to recommendation, and the mismatch is why a book can chart three months after publication. Separately, Lia Haberman's ICYMI — the most reliable single newsletter on what Gen Z and Alpha are actually buying — has now gone ten days without an edition, its last being the August 21 back-to-school playbook. That is not a scoop, but it is the second-best youth-marketing source this desk has and it is quiet.",
      rec: "If you want one thing from this card, it is the Tuesday clock itself. Ask a class why an industry that sells a purely informational good still coordinates its releases on a single day of the week, and let them get to the answer: because the charts are weekly, and a chart is a coordination device that rewards concentrating your sales rather than spreading them. It is the same reason albums drop on Fridays.",
      src: ["Book Riot (new releases, Aug 25)","https://bookriot.com/new-book-releases-august-25-2026/"] },
    { cat: "Online", t: "Voting closes tonight on the closest thing the internet has to an official record of what August was laughing at",
      why: "Know Your Meme's August 2026 meme-of-the-month ballot went up on the 27th and closes with the month, tonight. The nominees are Petra Parker, a Spider-Man fan-art trend; Roaming Characters at Universal Horror Nights, a theme-park meme that lives on X; John Politics; a wholesome trend called Kinda Chic; and Gucci Morty. No winner has been declared and no September ballot is live yet. Two things about the list rather than any single entry. Four of the five derive from existing intellectual property — a Marvel character, a theme park, Rick and Morty, a fashion house — which is the ordinary condition of internet humour now and not a decline from some earlier purity; the raw material is what is already in circulation. And the ballot exists at all, which matters more than the entries: Know Your Meme has spent years turning an entirely informal process into a dated monthly archive, and it is the only recency index in this space that reliably timestamps itself. The trending feed on the same site serves cached renders and cannot be trusted for dates, which has caught this desk before.",
      rec: "The single most useful URL on this dashboard for your purposes is this one, once a month, skimmed. You will end a term with the reference set and never have to open a platform. Naming one thing correctly and in passing is worth far more than building a lecture around one, which ages in weeks.",
      src: ["Know Your Meme (August 2026 meme of the month)","https://knowyourmeme.com/editorials/poll/cast-your-vote-for-august-2026s-meme-of-the-month"] },
    { cat: "Listening", t: "A country song breaks the modern Hot 100 record tomorrow morning, five months after it first went to number one",
      why: "Ella Langley's “Choosin' Texas” tied the longest-running non-holiday number one in Billboard history — nineteen weeks, level with “Old Town Road” and “A Bar Song (Tipsy)” — on the chart dated Aug 29. Week twenty resolves on the chart dated Sept 5, which publishes tomorrow, and nothing has leaked or been previewed anywhere this desk can find. Assuming it holds, the only remaining target is Mariah Carey's twenty-two weeks with “All I Want for Christmas Is You,” which is a different category of record because it was accumulated across seasons rather than consecutively. Holler's assessment is that “barring a major release in the next month or so that disrupts the Top Ten,” Langley surpasses it. What makes this worth a card rather than a footnote is the contrast with everything else on this page: the Parton catalogue decayed 42% in a day, the most anticipated trailer in gaming held number one for three days, and one country single has held the top of the Hot 100 since spring. In a market that supposedly cannot hold attention for a week, something is holding it for five months.",
      rec: "This is the cleanest superstar-economics example available right now, and it has a mechanism your students can explain to you: playlist and sound-loop placement is self-reinforcing, so a small early lead compounds into a durable one. Ask them why a market with essentially infinite choice produces MORE concentration rather than less. The answer — that search costs falling to zero makes the ranking itself the scarce resource — is one of the more counterintuitive results in the course.",
      src: ["Holler (a historic 19th week at No. 1)","https://holler.country/news/breaking/ella-langleys-choosin-texas-spends-historic-19th-week-at-no-1-on-billboard-hot-100/"] }

  classnote: { t: "There is a natural experiment running on the open internet right now that isolates a single variable more cleanly than almost anything you could design, and your students are living inside it. The setup: over the past several months, adult content has been removed or restricted in sequence from Steam, itch.io, Gumroad, Tumblr, Wattpad and — per a Kotaku explainer — OnlyFans. None of these platforms changed its own views. What changed was pressure applied to payment processors, and the processors applied it downstream. Then itch.io did the thing that makes this a proper experiment rather than a news story: it restored the FREE adult games and left the PAID ones delisted. Identical content. Identical platform. Identical users. The only variable that differs between the restored set and the delisted set is whether a card transaction is attached. And developers responded exactly as an economist would predict — a number of them relisted their paid work by setting the price to zero on the platform and moving monetisation elsewhere, which is the revealed-preference proof that the constraint was never about the content. Meanwhile AO3, the Archive of Our Own, is the control case: donation-funded, with no card transaction attached to any individual work, and it is the only platform in the sequence that never changed its rules. Start by asking who regulates speech on the internet. You will get platforms, and you will get governments, and both answers are wrong here, and letting the room be wrong for a minute is worth it. Then lay out the sequence and ask them to find the common cause. Once someone says Visa and Mastercard, do not move on — ask why a payment network would care. Push past “they are prudish.” The real answer is chargebacks, reputational exposure, and the fact that a card network's core asset is being accepted everywhere, which makes it enormously loss-averse about any category that generates disputes or regulatory attention. Have them state it precisely: the processor is not expressing a preference about content, it is minimising a tail risk on a business that has nothing to do with the content. Now build the market structure, because this is where the economics lives. Ask how many firms sit in the layer between a buyer and a seller of a digital good. Enumerate them: the platform, the payment gateway, the acquiring bank, the card network, the issuing bank. Ask which of those layers is competitive and which is concentrated. The platform layer is crowded — there are dozens of places to sell a game. The card-network layer is two firms. Have them draw the conclusion themselves: in a vertical chain, the binding constraint is set by the least competitive layer, and a seller can switch platforms freely and still be unable to escape, because every platform terminates in the same two networks. That is a general result about vertical chains and it explains a great deal beyond this case — app-store rules, ad networks, cloud providers, and the entire debate about essential facilities. Then use the free-versus-paid split, which is the whole reason this is a classnote and not a news item. Ask them what it identifies. On itch.io, the free games came back and the paid ones did not, and the content is the same. So the restriction is not on speech, it is on transactions — and the two have been separated experimentally rather than argued about. Ask what that means for anyone trying to characterise the policy. It means calling it censorship is imprecise: it is a refusal to intermediate exchange, which has the same effect on a commercial creator and no effect at all on a hobbyist. Ask them who is harmed and who is not, and let them notice that the incidence falls entirely on people who were trying to make a living. Now the developer response, which is the best part. They set the price to zero and moved payment off-platform. Ask what has actually happened to the transaction. It has not stopped; it has been rerouted, at a cost — worse discovery, worse conversion, no platform trust, higher friction. Have them name the general phenomenon: a restriction that cannot prohibit an activity raises its cost instead, and the deadweight loss shows up as the difference between the efficient channel and the surviving one. Then ask the sharper follow-up: does this make the policy a failure? Not necessarily, from the processor's point of view — it has removed its own exposure, which was the objective, and it does not care where the money goes afterward. A policy can succeed for its author and be pure waste for everyone else, and students who can hold that distinction are ready for public economics. Finish on AO3, and give it real weight, because a control case that nobody designed is a gift. Ask why the one platform that never changed its rules is also the one with no card transactions on its works. Then ask the question that should follow them out of the room: if the ability to resist this pressure depends on not charging for anything, what does that imply about which kinds of cultural production can be independent? The answer is not comfortable. It says that in a payments-intermediated economy, editorial independence is available to volunteers and to firms large enough to be their own processor, and to nobody in between.",
    src: ["Kotaku (the payment-processor sequence, AO3 and Wattpad)","https://kotaku.com/archive-of-our-own-wattpad-smut-ban-fanfiction-2000726632"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
