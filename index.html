<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "The director of the CIA spent Tuesday in Moscow, and nobody can say why. A US Air Force C-17 left Riga and landed at Vnukovo around 10 a.m. local on Aug 25, departing about 7 p.m.; the visit window is reported as Aug 24–26. It is the first known visit by a CIA director to Russia since William Burns in November 2021. The detail that makes it more than protocol: the United States asked Ukraine to refrain from striking Moscow and St Petersburg while John Ratcliffe was on the ground, and Ukraine agreed — a source told the Kyiv Independent the reason was that “they don’t believe in the strength of (Russian President Vladimir) Putin’s air defenses.” Ukraine was told a US delegation was coming but reportedly not that Ratcliffe would be on it, and it is unclear whether he travels on to Kyiv. Ratcliffe has maintained a standing channel with SVR chief Sergei Naryshkin. Dmitry Peskov’s account moved twice in twelve hours: on Tuesday evening he said “we have no information about this” and that no meetings with the US administration were planned that week; by Wednesday he was telling the Washington Post the visit involved “contacts between the intelligence services,” while maintaining that no meeting with Putin had been scheduled. Against that denial sits a Kremlin pool report that Putin cancelled a prepared event for hundreds of people on Aug 25. Meduza declines to resolve it — its own headline is that nobody knows why he flew — and sets out three competing accounts: Ksenia Sobchak’s, that Ratcliffe negotiated the release of Charles Zimmerman (Meduza notes no source is given); the Wall Street Journal’s, that he delivered a warning drawn from US intelligence on Russian mobilisation preparations and possible NATO provocations, with journalist Michael Weiss suggesting it concerned alleged GRU sabotage; and Ukraine Context’s, that the subject was an operation of significant importance for further processes. The MOEX swung 3% up and then back down on the news. Separately and on the same day, Putin signed three decrees — numbers 605, 606 and 607 — whose contents are unknown; their existence is inferred only from gaps in the numbering sequence on Russia’s official legal portal. This desk has no read on either, and says so.",
        s: [["Kyiv Independent (CIA director arrives)","https://kyivindependent.com/cia-director-arrives-in-moscow/"],["Meduza (nobody knows why he flew)","https://meduza.io/feature/2026/08/25/direktor-tsru-dzhon-retkliff-posetil-moskvu-vpervye-s-nachala-bolshoy-voyny"],["Kyiv Post (three secret decrees)","https://www.kyivpost.com/post/83128"],["Kyiv Independent (Kremlin denies Putin meeting)","https://kyivindependent.com/putin-did-not-meet-cia-director-during-russia-visit-kremlin-says/"]] },
      { t: "Lavrov broke a five-day silence in the one setting where Russia has an interlocutor it can afford to be polite to. He received Archbishop Paul Richard Gallagher, the Vatican’s Secretary for Relations with States, in Moscow on Aug 25 — the first face-to-face Vatican–Russia meeting at that level since the full-scale invasion. Lavrov called it a “productive conversation” and thanked the Vatican for its “balanced position”; Gallagher said each day the conflict continues “creates new victims” and makes eventual reconciliation between Kyiv and Moscow harder. The agenda covered paths to peace, humanitarian cooperation and particularly assistance for children affected by the war, the return of forcibly deported Ukrainian children, and the Vatican’s standing offer to host negotiations — which Lavrov rejected in May. Gallagher’s visit runs through Aug 28 and he was scheduled to meet Yuri Ushakov on Aug 26, which is not yet confirmed as having happened; he visited Ukraine in July, touring missile-strike sites and meeting foreign minister Andrii Sybiha. That scheduled meeting is the only trace of Ushakov anywhere, and Witkoff, Kushner and Ushakov now make six straight days with nothing verifiable — the single datapoint on Witkoff is a phone call with Ukraine’s negotiator Rustem Umerov on Aug 23, and he and Kushner have postponed their planned first visit to Ukraine. On the paper trail, two things to record rather than repeat. ISW’s Aug 25 assessment does not mention the “reportedly presented joint Ukraine-US-Europe peace proposal” from its Aug 23 assessment, making two consecutive days of silence; treat that line as an evaporated single-source claim and stop carrying it. And the “corridor of opportunities” is renderable two ways: this desk published Meduza’s verbatim «от G20 в Соединенных Штатах Америки до конца лета 2027 года», while a second reading of the same Meduza filing gives «с конца 2026-го до лета 2027 года» — end of 2026 to summer 2027. Those are compatible rather than contradictory, since the G20 in the United States falls on Dec 14–15, 2026, but note the two renderings rather than presenting either as the wording. ISW’s own Aug 25 takeaways are elsewhere: escalating Russian strikes on Ukrainian-Moldovan border infrastructure in conjunction with the campaign against port and maritime infrastructure, and “to achieve broader political effects”; the Kremlin attempting to manage concerns about Putin’s nationalisation decree; another military satellite launched Aug 24, possibly toward a Rassvet constellation, Russia’s Starlink analogue; and Ukrainian advances in the Kupyansk and Borova directions. Underneath the diplomacy, the Patriot ask has hit an obstacle that is not American, and the marketplace campaign has swung back to Wildberries. On the interceptors: TASS, citing Euronews from Paris, reports European Commission spokesman Balazs Ujvari saying the Commission has not yet approved Kyiv’s Patriot purchases from the United States using EU funds. Ukraine has submitted weapons contracts totalling €22 billion against a €6 billion cushion for non-European requests; the 2026–2027 EU programme allocates €90 billion, and Ukraine cannot direct more than 35% of it to defence products made outside the EU and EEA, with exemptions where the goods are not made in Europe or European production is costlier or slower. France is pushing to make those exemptions temporary — Euronews quotes the aim as ensuring “a greater share of the EU-backed funding ultimately supports European — and potentially French — production.” France co-produces the SAMP/T with Italy, Europe’s Patriot equivalent. So the constraint on Zelensky’s 300 interceptors may bind in Brussels before it binds in Washington. Alongside it, UK prime minister Andy Burnham’s September lobbying is now dated and named: “I’m looking forward to going to New York in September,” “I’m quite clear what I need to do in the next few weeks,” the shortfall “fixable” but requiring “a lot of negotiation,” with European Council president Antonio Costa, Moldova’s Maia Sandu, Luxembourg’s Luc Frieden and Estonia’s Alar Karis named, and the group considering convening a Coalition of the Willing meeting to coincide with the General Assembly. The Storm Shadow item also advanced: France has joined the UK, approving SCALP production in Ukraine alongside Storm Shadow. On the strike campaign, correct the framing this desk used on Monday. Ozon has not been hit again since Aug 24 — the confirmed sequence is Chapaevsk Aug 22, Orenburg Aug 23, then Adygeysk, Nevinnomyssk and Makhachkala Aug 24, about 233,000 square metres or 6% of Ozon’s warehouse capacity across a network of roughly 5 million square metres and 50-plus fulfilment centres — and its shares fell 28% before partially recovering the same day, with no follow-through since. Overnight into Wednesday the target was Wildberries again, which is the older campaign: Ukrainian drones struck the Kotovsk logistics hub in Tambov Oblast, the second strike on that warehouse since July 18. Governor Yevgeny Pervyshov: “The strikes caused a fire at the Wildberries logistics center. The fire covered more 100,000 square meters” — about fourteen soccer fields — with one employee concussed by the blast wave and residents advised to stay indoors for two days over carbon-monoxide risk. The Kyiv Independent filed it at 02:19 sourced to the monitoring channel Exilenova Plus with an explicit caveat that details “could not be immediately verified”; Pervyshov’s confirmation followed. Ukraine’s Defence Ministry frames the whole effort as “long-range sanctions” on dual-use logistics.",

      { t: "Overnight, and in both directions, with the numbers labelled. Into Ukraine, from 18:00 Aug 25: 162 attack and decoy drones launched — Shahed types including jet-powered variants, plus Gerbera and Parody decoys — of which 134 were neutralised or suppressed as of 08:00 Aug 26 on preliminary data, with 18 locations struck and debris falling at three more. Launched and downed are different numbers and neither is a day total. The deadliest point was Chernihiv, where a private residential building was hit: a four-year-old girl and a 49-year-old woman were killed and a 14-year-old girl hospitalised, with outbuildings damaged and a fire at a nearby store. The city has declared Aug 26 a Day of Mourning, flags at half-mast and entertainment events cancelled — the second time in three days Chernihiv has taken the worst of a night. From the day before, Russian aircraft bombed Kramatorsk in Donetsk Oblast, injuring about 24 people including a child and damaging more than thirty residential buildings. Do not merge this with ISW’s figure of 150 drones plus Iskander-M and Kh-31P missiles: that describes the previous night. Going the other way, Russia’s Defence Ministry claims 426 Ukrainian drones intercepted and destroyed between Tuesday evening and Wednesday morning, giving no launched figure, and neither the Moscow Times nor Kyiv Post verified it independently. At least three people were killed inside Russia: in Lipetsk Oblast, Governor Igor Artamonov reported “two people were killed — a man and a 14-year-old child — while two women were injured and hospitalized” in a strike on a private residence, which the Moscow Times attributes to falling debris; a woman was killed in Belgorod Oblast. Refining took two more hits. Tuesday’s strike set the Afipsky plant in Krasnodar alight, with Governor Veniamin Kondratyev saying falling drone debris killed two people and injured two others, and the Novoshakhtinsky refinery in Rostov Oblast temporarily suspending processing — after Perm was forced to suspend on Aug 21. Overnight into Wednesday the Lukoil Nizhegorodnefteorgsintez plant at Kstovo in Nizhny Novgorod Oblast was reportedly targeted, with multiple explosions and fires observed. No updated cumulative refining-capacity figure surfaced in the window; the last hard datapoint is early August, refining at a 24-year low. What did move is the policy response, and it is worth reading in both languages. Putin signed a decree on temporary management under which the state or a designated party can assume control of all or part of an asset where security measures are judged “inadequate,” “untimely,” or “ineffective,” with no set duration, covering energy, industrial, transport and logistics facilities and “objects of special importance.” Meduza headlines it “Refineries and warehouses will be handed to the state if owners can’t protect them from drones,” notes that business had previously been taken only from foreigners, and quotes a fuel-market source describing an obligation to eliminate consequences “immediately and at any cost” with no legal predictability. Deputy prime minister Denis Manturov says it does not constitute nationalisation and involves only “targeted decisions at the highest level”; Peskov blamed owners for insufficient security. TASS routes the same subject through the Energy Ministry as a fuel-balance question — the diesel export ban expiring Sept 1, whose extension is “currently under consideration,” with priority on “fully meeting domestic fuel needs, including those of agricultural producers during seasonal field operations” — and does not connect it to drone damage at all. Same decree, two countries.",

      { t: "Iran opened a corridor and insisted the strait is still closed. The advance of the day came at 06:02 UTC from Kazem Gharibabadi, deputy foreign minister for legal and international affairs: Iran and Oman have agreed a new temporary route through the Strait of Hormuz, seven miles — 11.3 kilometres — wide, with entry running through Iranian territorial waters and part of the exit doing the same. Nothing was disclosed about vessel types, fees, escorts, inspection protocols or duration, and Oman’s foreign minister Badr Albusaidi had earlier said only that the two hoped to “soon announce” it. Gharibabadi’s framing is that the agreed route “is a temporary route” and that the strait does not reopen until the United States meets its commitments under the June peace agreement: “Washington must return to its commitments.” Trump’s line runs the other way — that “all mines have been cleared and detonated” and that ships laying new ones will be “destroyed.” Hold the traffic numbers as a conflict rather than a count: Kpler recorded two commodity vessels transiting on Monday Aug 24, the lowest daily tally since early May against a ten-day average of fourteen, and seven on Aug 20 against about fourteen the day before; Vortexa put Monday’s oil transits at 5 million barrels a day with a seven-day average near 6–7 million. Kpler’s own caveat is that vessels sailing with transponders off do not appear in its data. Note that “closed” here is a legal and political posture rather than literal zero traffic, and one tracker read Day 178 while GlobalSecurity ran Day 179 for the same date. GlobalSecurity’s war log did roll forward, to Day 179 for Aug 25, and carries two hard numbers: the rial at a record low of 2.02 million to the dollar on the open market, and inflation around 90% per Iran’s Statistical Center. It also logs a 26-night pause in coalition strikes on Iranian territory. The sanctions second act has not landed. Checked against both the Treasury press-release index and OFAC’s Recent Actions, there is nothing dated Aug 25 or Aug 26; SB0613 of Aug 24 remains the latest Iran action, and the highest release number is SB0615, the Quantum-Readiness Task Force. The teased bank designation is real and still outstanding — Bessent said a financial institution would be sanctioned in a major announcement by the end of the week and declined to name it or its country. One correction this desk owes itself: “Economic Fury” was not only Ambassador Mike Waltz’s pre-announcement coinage. It appears in Bessent’s own words inside Treasury release SB0596 of Aug 7 — “Iran’s shadow banking system is buckling under Economic Fury” — so it was the official campaign name through early August, and Operation Economic Outcast is an Aug 24 rebrand. Post-Aug-24 usage remains a staleness flag; earlier usage is legitimate. Tehran’s response ran through the economy ministry, with Ali Madanizadeh saying “US sanctions against us are not new… Washington cannot achieve its goals,” and SNSC secretary Mohsen Rezaei promising a response “in a seismic manner.” Pakistan’s mediation produced warmth and no deliverable: interior minister Mohsin Naqvi said “significant progress was made, and the meeting concluded on a highly positive note,” while Pezeshkian told Field Marshal Asim Munir that “the United States must correct its tone and approach in dealing with Iran instead of dictating terms.” The June 17 Islamabad memorandum has expired and no next date or venue was named. In Gaza, at least seven were killed Tuesday, three in a home in Beit Lahiya near Kamal Adwan Hospital and one by drone in al-Mawasi; among the sites struck was a warehouse of nutrition supplies for children and pregnant and nursing women run by Ard El Insan with Medical Aid for Palestinians. Dr Munir al-Bursh, director-general of Gaza’s health ministry, warned of a “complete collapse of the basic necessities of life” and said only 12 of about 34 oxygen stations are operational. Lebanon was quiet — Hezbollah’s threatened retaliation for the Aug 15 strikes remained unexecuted. From the analytical benches, the reads converge from opposite directions. Al Jazeera’s panel reads the package as weakness: Negar Mortazavi of the Center for International Policy — “the United States is returning to economic pressure because military force has failed to deliver the quick victory it expected”; Trita Parsi of the Quincy Institute — “it was a fundamental miscalculation Trump did in the outset that the threat of war will compel the Iranians to surrender”; Sina Azodi of George Washington — “to me, it’s more a psychological operation than an actual warfare.” Larry Johnson argues the plumbing has already moved: CIPS cleared about $25.5 trillion in 2025 across 190 countries and is growing near 40% a year, so “you cannot freeze a yuan payment out of a dollar system it never enters,” and “the dollar is not dying. What is dying is the American monopoly on the plumbing.” Bessent’s own answer on why the large Chinese banks were spared is the same fact from the other side: “Why would I want to blow up the global financial system?” Azodi, writing at Responsible Statecraft, extends it to the military instrument — “nuclear weapons may constrain escalation, but they rarely determine political outcomes.” Nothing new from Mearsheimer, Diesen or Sachs in the window.",

      { t: "Stocks rose Tuesday because oil fell, and everything that matters this week happens today. AP’s tally: the S&P 500 at 7,677.28 (+24.42, +0.32%), the Nasdaq Composite at 26,151.30 (+171.11, +0.66%), the Dow at 53,577.40 (+160.24, +0.30%) and the Russell 2000 at 3,010.02 (+14.94, +0.50%). AP’s framing sentence is the causal claim: “Oil prices fell again, which helped ease worries in the bond market and support stock prices.” Barchart adds that WTI fell more than 3% after reports the United States would restore diplomats to Middle East embassies, cutting perceived conflict risk, and the 10-year yield fell six basis points to 4.64%. Moderna was the biggest S&P gainer at +14.36% to $158.83 on melanoma vaccine data; Albemarle the worst at −5.89%; Nvidia rose 2.17% into its own earnings. One structural detail worth carrying: 97.5% of Tuesday’s advance was already on the board at the opening bell. Three cautions on numbers this desk has published. Monday’s consensus figures were slightly off at source — two independent sources give consumer confidence consensus at 90.2 rather than 90.8 and new home sales at 620K rather than 628K, and the prior month was revised down to 90.2, which is probably where the confusion came from. All three of Tuesday’s soft prints missed: confidence at 89.4, a seven-month low, with the expectations sub-index down 7.8%; new home sales at 607,000, down 10.5% month over month; the Richmond Fed at 4 against 7. Only Case-Shiller beat, at +2.1% year over year against +1.8%. TheStreet’s summary — “consumers are optimistic about today but increasingly nervous about tomorrow.” Second, the VIX series is still messy: Yahoo’s Wednesday pre-market 15.67 (+1.42%) is explicitly cash, against Monday’s cash close of 14.89, and a Schwab page showing 15.85 on Tuesday morning was carrying Monday’s numbers throughout. Third, the Nasdaq hazard is live again this morning — Tuesday’s Composite close is 26,151.30 while Wednesday’s Nasdaq-100 futures are 29,215.50, a gap of about 3,064 points. As of roughly 3:51 a.m. ET Wednesday, S&P futures were 7,687.00 (−0.07%), Nasdaq-100 futures 29,215.50 (−0.21%) and Dow futures 53,701.00 (+0.10%). Today is the hinge: July personal income and outlays, the second estimate of Q2 GDP and July durable goods all at 8:30 a.m., then Nvidia after the close. The Reuters poll has personal income +0.2%, consumer spending +0.3%, headline PCE −0.1% month over month and +3.7% year over year, core PCE +3.3% year over year, real GDP +1.5%, durable goods +0.3% and core capital goods +0.9%. That confirms the durable-goods correction — +0.3% is the street, and the +0.7% in circulation is TradingEconomics’ own model. The PCE dispute, though, is real and unresolved: investingLive’s same-day preview gives headline +0.07% month over month and 3.6% year over year against the poll’s −0.1% and 3.7%, with core 3.2–3.3%; Yahoo sides with core at 3.3%; and Christopher Hodge of Natixis has headline unchanged at 3.70%, citing “continued upward pressure from computer hardware and software prices tied to AI and data centre investment.” Publish headline as a range of −0.1% to +0.1% month over month and 3.6–3.7% year over year, core as 3.2–3.3%, and do not pick one until it prints. Nvidia reports at a consensus $2.09 on $92.07 billion — 40 analysts, EPS range $2.05–$2.20, revenue range $90.30–$96.66 billion — against year-ago figures of $1.05 on $46.74 billion with a 72.4% gross margin. Company guidance was “$91.0 billion in revenue, plus or minus 2 percent,” and it assumes no data-centre compute revenue from China. The 75% gross-margin figure this desk carried could not be sourced to any preview and should be treated as unverified. investingLive’s framing of the setup is the useful one: post-earnings moves have grown increasingly muted, and “the bar for a positive share price reaction now sits above simply clearing the consensus number.”",

      { t: "Canada answered dollar for dollar, the ruble had its worst day of the series, and gold held while oil fell for a third session. Ottawa announced retaliatory tariffs of up to 50% on hundreds of US products — steel and aluminium goods, furniture, clothing, paper and dairy — covering $27.6 billion of US goods, about 8% of total US exports to Canada, effective Sept 8. Finance minister François-Philippe Champagne says they match US levies “dollar for dollar, rate for rate,” and that “this is an unprecedented challenge imposed on Canada, but Canada will meet the moment.” Carney on the collapsed talks: “they asked too much and offered too little.” Trump, on Truth Social: “They feel entitled, and yet, WE DON’T NEED CANADA, THEY NEED US!” His threat to double tariffs from 25% to 50% on Canadian cars, auto parts, trucks and steel from Jan 1, 2027 stands. In commodities, gold spot traded around $4,632.53 Wednesday morning, down 0.55%, with December futures at $4,682.80 — a contango spread of $50.27, narrowed from about $68 a day earlier, and not a conflict. Gold is up 13.61% on the month and 36.34% on the year against a January all-time high of $5,608.35, with TradingEconomics again crediting Treasury buyback operations weakening the dollar. Silver rose to $68.885, up 17.94% on the month and 78.50% on the year, on industrial demand from solar, EVs and AI data-centre build-out. Crude fell a third consecutive session — WTI $80.08 (−2.77%), Brent $86.889 (−1.91%) — with TradingEconomics attributing it to Pakistan’s Tehran visit, Qatari mediation and the Iran–Oman corridor talks, and stating plainly that prices “have come under pressure this week after Washington’s latest measures to intensify economic pressure on Iran proved less aggressive than markets had expected.” In crypto, publish the level: bitcoin around $79,000, ether about $2,465, solana $97, XRP $1.44, zcash $783, with bitcoin up 23% and XRP up 45% on the week. Tuesday’s intraday high of $81,265 was rejected at the 50-week moving average near $81,085, and CryptoQuant’s Julio Moreno says “basically all metrics are pointing to the initial phase of a new bull market” while noting bitcoin needs a close above its 365-day average near $83,000 for confirmation. One correction to Monday’s ETF line: CoinDesk’s own article body says sixth consecutive day of inflows where its headline says seventh, so report the $337.56 million and not the streak. Treasuries firmed — 10-year 4.65%, 30-year 5.18% — and the activist-Treasury theme is confirmed still live, with the government planning to “at least double its buybacks” and reportedly considering tapping its cash account to finance them, a departure from the usual cash-neutral approach, while Bessent has reassured markets that auction sizes will not be reduced. The ruble had the sharpest move in this desk’s series: the Bank of Russia set USD/RUB at ₽84.4635 effective Aug 26, from ₽83.2878 — a 1.41% depreciation, the largest single-day weakening recorded here and the weakest fixing since Aug 20, landing on Ratcliffe-visit day. EUR/RUB ₽98.5182, CNY/RUB ₽12.5659; key rate 14.00%, next board meeting Sept 11. On the Fed, September hike odds sit at 32% on Kalshi and 33% on Polymarket against 30% on CME FedWatch a week earlier, with Barchart’s futures-implied 39% a genuine outlier on the same day — quote the 30–33% range and flag the outlier rather than blending. Boston Fed president Susan Collins said Tuesday it would be “appropriate to tighten policy soon” if inflation progress stalls; Goldman’s Jan Hatzius holds the other side — “after two months of materially softer jobs and inflation data, it’s hard to see any of the doves shifting toward hikes.” Jackson Hole opens tomorrow, Aug 27–29, on “Financial Innovation: Implications for Payments and Policy,” with Warsh’s keynote Friday at 10:00 a.m. ET and the full agenda posted Thursday evening. A BofA fund manager survey has 69% expecting a neutral tone, which makes the risk asymmetric; TD Securities’ Oscar Munoz calls it “the critical opportunity for Warsh to restore credibility.” And the week’s teaching paper is Tyler Cowen’s pick: an NBER paper by Ferrante, Prestipino, Raffo and Waugh finding that US tariff rates hit Depression-era levels in 2025 while imports rose, because an AI-driven investment boom offset the contraction — “absent the investment boom, imports would have fallen by 10 percent and activity would have contracted by 0.7 percent.” Composition did the work: tariffs on consumption and intermediate goods acted as supply shocks and capital-goods tariffs as demand shocks, and because the 2025 tariffs concentrated on consumption goods and spared capital goods, they limited output damage while amplifying inflation — which is exactly the decomposition to have in mind when the PCE prints this morning.",

      { t: "A drugmaker lost its constitutional challenge to Medicare price negotiation, and a Medicare pilot turned out to charge sicker patients more. The ruling first: in Merck & Co. v. Becerra, No. 1:23-cv-01615, Judge Colleen Kollar-Kotelly of the District of Columbia denied Merck’s motion for summary judgment in full and granted the government’s cross-motion on Aug 24, upholding the Medicare Drug Price Negotiation Program more than three years after the case was filed in June 2023. All three claims failed — the Fifth Amendment takings claim, the First Amendment compelled-speech claim, and the unconstitutional-conditions claim. The drug at issue is Januvia. Merck shares moved −0.20% to $150.36 in Tuesday pre-market. This desk has not been able to read the opinion itself — Endpoints and Law360 are paywalled and Georgetown’s litigation tracker logs the order without text — so the reasoning, any quotation from Kollar-Kotelly, Merck’s response and whether it appeals to the D.C. Circuit are all unknown, and that gap is worth stating rather than papering over. Second, and the better teaching item: KFF’s Jackie Fortiér has taken apart the Medicare GLP-1 bridge pilot, and the design has a cliff in it. The 18-month pilot launched in July at $50 a month for Wegovy, Zepbound KwikPen and Foundayo, open to Part D enrollees with a BMI of 35 or above, or 27 to 34 with prediabetes or cardiovascular disease — about 3.8 million eligible, roughly $3.3 billion at 25% uptake and about $10 billion at 75%, with 5.9 million excluded. The catch is that the $50 price applies only to beneficiaries using a GLP-1 exclusively for weight loss. Anyone carrying an FDA-approved indication — Type 2 diabetes, moderate-to-severe obstructive sleep apnea — is pushed back to their Part D plan at $200 to $600-plus a month. Juliette Cubanski, who directs KFF’s Program on Medicare Policy, describes the intent as targeting “those people who can’t get GLP-1 coverage through Part D but would benefit from taking one for weight loss.” The case in the piece is Jeff La Marca, 68, a retired New Jersey professor with a BMI of 42 and a quadruple bypass, denied the $50 price because of a sleep-apnea diagnosis. Third, and the cleanest entry-regulation contest running anywhere: four systems are competing for 92 acute-care beds in Buncombe, Madison and Yancey counties in western North Carolina, decided by NC DHHS after an Aug 19 public hearing. Mission Health, owned by HCA, is licensed for 853 beds after receiving 95 in March; AdventHealth would fold the beds into a Weaverville facility under construction; UNC Health proposes a new facility at the Westgate Mall site; Novant would add twenty to an approved 34-bed facility in Arden. Mission has drawn its fourth Immediate Jeopardy finding since 2021 and was recently confirmed back in substantial compliance. Yancey County EMS director Kristy Bryant said crews frequently hear requests to transport “anywhere but Mission”; Madison County commissioner Matthew Wechtel cited travel times of 45 to 75 minutes; state senator Julie Mayfield said she was “shocked” and “puzzled” by the March allocation. All five county commissions, sheriffs, health departments, EMS agencies, school systems and municipalities backed AdventHealth and UNC Health, and Asheville mayor Esther Manheimer signed support letters for every applicant except Mission. When the auditorium of more than a hundred was asked whether Mission should get more beds, the room stood — after Mission’s representatives had already left.",
        s: [["STAT (Pharmalittle: Merck loss)","https://www.statnews.com/pharmalot/2026/08/25/rfk-vaccine-disclosure-merck-court-loss-over-medicare/"],["KFF Health News (GLP-1 bridge catch)","https://kffhealthnews.org/aging/medicare-glp1-bridge-weight-loss-drugs-coverage-exceptions-cost-access/"],["NC Health News (92 beds)","https://www.northcarolinahealthnews.org/2026/08/25/western-nc-hospital-certificate-of-need-tug-of-war/"],["STAT (Unraveled, part 1)","https://www.statnews.com/2026/08/25/rural-hospitals-response-medicaid-cuts-part-1-unraveled-series/"]] },
      { t: "The vaccine RFI is formally published, the measles count did not refresh, and the Ebola numbers need re-basing. On the RFI, a correction to this desk’s account: it was published in the Federal Register on Monday Aug 24, Vol. 91, No. 162, p. 54725 — it was not yet formally out when Monday’s brief was written. Docket HHS–OS–2026–0332, signed by Robert F. Kennedy Jr., comments closing Sept 20. The notice sets out the three categories verbatim — Routine (Universal), where “the default is to vaccinate all persons in an age group absent contraindications”; Risk-Based, “directed to persons with specified medical, occupational, behavioral, or other risk factors”; and Shared Clinical Decision-Making, “individually based, informed by discussion between healthcare provider and patient/parent/guardian,” with no default. It asks whether the categories are “adequate, clear, and well understood by clinicians, patients, and parents,” what considerations should govern assignment, and “what communication practices should accompany vaccine recommendations so that they earn and keep public trust.” On whether any actual comment has appeared: still none from any medical society, insurer, manufacturer or state — but the asymmetry is now the story. The only organised RFI-specific mobilisation found is on the vaccine-sceptic side, with call-to-action posts circulating and an AHA explainer on Aug 21 as the closest thing to institutional engagement. Comment generation is running on one side of the docket only, four weeks out. The three-way baseline dispute on what the Aug 10 executive order cut — 17 to 11, or 18 to 11 twice over — is unchanged; carry all three. Florida has moved further and faster: the state health department has published a proposed rule eliminating school-entry requirements for chickenpox, hepatitis B, Haemophilus influenzae type B and pneumococcal vaccines, with a 21-day comment period, asserting these are not required under state law. The Florida Conference of Catholic Bishops has told attorney general James Uthmeier that Catholic schools do not accept religious vaccine exemptions, offering their justification “out of respect for you and your office” — a private institution holding a stricter line than the state. On measles, CDC has not updated: the page still reads Aug 20 data with an Aug 21 stamp, and the Wednesday refresh had not posted. One figure does need revising. The current page reads 47 states plus DC reporting 2,761 cases, plus 16 among international visitors, totalling 2,777 — against the “45 states plus New York City and DC” this desk has carried. The Hill also uses 47 jurisdictions and calls 2026 the worst measles year in more than thirty. The state-by-state table, vaccination-status breakdown, hospitalisation rate and death count did not render, so do not restate Utah 518 or the 7% hospitalisation rate as freshly confirmed today. Maryland has declared outbreaks in three counties. And the elimination review has a firmer timeline: Noel Brewer of UNC Gillings, who chairs the committee, has written that it reviewed the evidence in mid-August with PAHO announcing in November, and that the criterion is sustained transmission of a chain beyond twelve months, with Utah as the test case — “elimination of measles in the United States in 2000 was a landmark public health achievement. Twenty-five years later, the country has already reported more cases this year than it did in all of 2025.” The DRC Ebola figures need re-basing rather than extending. ECDC, updated Aug 24, gives 5,514 confirmed cases and 2,642 deaths — a case fatality rate near 48% — across 57 of 151 health zones in six provinces, with Ituri at 4,607 cases and 2,065 deaths, or 83.6% of the total. That exceeds the 5,200-plus this desk carried for the same date, which is an attribution difference between ECDC aggregation and WHO or DRC ministry counts; report the figure with its source rather than merging them. The Aug 22-to-24 increment implies roughly 27 cases and 18 deaths a day, well below the 90 a day and 260 deaths a week previously carried — but two data points cannot distinguish genuine deceleration from weekend reporting lag, so do not call it a trend. Uganda’s outbreak was declared over on July 28. Elsewhere: an NIH open-access mandate is generating about $104 million a year in compliance costs that NIH funds are specifically disallowed from covering, per an analysis of roughly 24,000 grant-associated manuscripts from 2024 led by Ryan Huebinger at New Mexico — an unfunded mandate with a measured magnitude. ACA 2027 rate filings from 276 insurers across all fifty states show a median proposed increase of 15%, ranging from −1% to +54%, with 63% falling between 10% and 25%; median medical trend is 10%, expiring enhanced premium tax credits add about four percentage points, and insurers’ own morbidity and adverse-selection adjustments run 4–7%. The insurers describe the mechanism in their own filings: “healthier-than-average people will exit the marketplace… and in response insurers will raise premiums for remaining enrollees.” And STAT’s new series on rural hospitals puts numbers to the same squeeze — about $1 trillion cut from expected Medicaid funding over ten years, roughly 7.6 million people expected to lose coverage, Maine hospitals facing about 1% annual revenue drops against margins already below 1%, and nearly half of Maine’s emergency-service hospitals now without inpatient obstetrics. MDI Health’s Chrissi Maguire: “it’s the most fragile I’ve ever seen it.”",

      { t: "The Ypsilanti data-centre file is now documented at the source, DTE has been silent for nine days, and the story has gone national without a single Michigan outlet following it. Working from the township’s own document index rather than second-hand reporting: Resolution 2026-21, filed as the Electric Moratorium Resolution, is dated Aug 18 and runs 180 days. The Sept 9 town hall is confirmed for 5 to 7 p.m. at the Ann Arbor Marriott Ypsilanti at Eagle Crest, Roy Wilbanks Ballroom, in a format of guided discussion followed by Q&A and comment, with registration required and a livestream available. The June 24 letter from township attorney Douglas Winters turns out to respond to erroneous statements by Washtenaw County commissioner Justin Hodge, a name this desk has not been tracking. The Aug 13 “Grasso Response to Dingell” is U-M president Grasso answering Representative Debbie Dingell. And the March 18 land purchase is logged at 124 acres — parcels 10455 and 10635 Textile Rd, sold by Norfolk and Western Railway for $5.2 million — against the 144 acres carried elsewhere; the township’s own record is the better number. A correction on DTE: Ryan Lowry’s “reviewing the proposed moratorium” line is from Bridge on Aug 17, which predates the Aug 18 vote, not Aug 19. So DTE’s latest word is now nine days old and was about a proposal that has since passed. The township document page carries no DTE correspondence of any kind, WEMU published nothing on the subject Aug 24 through 26, and no litigation filing has surfaced. Fuller figures from that Bridge piece: the U-M project is $1.2 billion with a $100 million MEDC pledge for site preparation, drawing power equivalent to 80,000 homes through a 110-megawatt DTE substation described as equal to the township’s entire current usage, in a township of 56,000 people, for a projected 200 jobs. Winters: “We need to examine the impact that these substations are going to have upon the environment, especially when they’re going to build these gigantic monstrosities,” and “what they’re building is already going to produce more energy than what the rest of the township is using right now.” Supervisor Brenda Stumbo: “We need to make sure it’s in the right location from a planning standpoint, and we need to make sure that we have ordinances in place that require DTE or any electrical company to go through a process.” The reputational fact worth noticing is that on Aug 21 this went national in a framing no Michigan outlet has used — 404 Media and Slashdot both ran it as a township fighting a nuclear-weapons data centre by passing a moratorium on electrical infrastructure, with Tom’s Hardware describing a 220,000-square-foot hyperscale project backed by U-M and Los Alamos. Nobody local has followed up. Saline Township produced no advance at all: the $7 billion, $16 billion and $43 billion figures got no new reporting, and Bridge’s own October announcement piece still carries the $7 billion in its headline, which is the figure to retire. In the Senate race there is no new polling — Susquehanna’s 46–39 and AARP’s 48–47 remain the only two, with RealClearPolling averaging El-Sayed 45.7 to Rogers 45.0 — but there is a real development. Twitch streamer Hasan Piker, an El-Sayed ally who campaigned with him, said on an Aug 20 broadcast that “if pro-Israel Jews keep putting this idea out there that they’re singularly invested in Israel, eventually somebody’s going to come around and take action” against American Jews. State senator Jeremy Moss, the Democratic nominee in MI-11, condemned the remarks as antisemitic, invoking the March 2026 attack on Temple Israel in West Bloomfield that targeted Jewish children. El-Sayed said “nobody speaks for this campaign besides me and my campaign spokespeople” but declined to disavow Piker directly; Representative Hillary Scholten refused to campaign with him, saying he had missed the chance to “cut ties”; Rogers called Piker El-Sayed’s “running mate.” On campus, the Wolverine Village question this desk has been chasing resolves as a timing error rather than a silence: both U-M Record pieces that look current are back-dated — the Wolverine Village feature is Aug 19 and the move-in traffic piece Aug 12, with the Record homepage misreporting them as Aug 26 — and the two disagree on dates, with one giving early move-in Aug 22–25 and main move-in Aug 26–30, the other early Aug 22–23 and general Aug 24–30. Main move-in begins today. So there is still no day-of coverage and still no confirmation that any student was displaced, but the answer is arriving now rather than overdue. The Aug 19 feature is worth knowing for context — 2,300 new beds, a 25% increase in undergraduate housing capacity, five residence halls and 800-plus dining seats, with Martino Harmon saying “Wolverine Village is the direct result of listening to our students” — and it makes no mention of construction delays or temporary housing at all. Two Bridge items from Tuesday for her own beat: the Upper Peninsula copper mine receiving $50 million in state grants, and Kelly House on Dana Nessel’s report defending the failed Flint water prosecutions.",
        s: [["Ypsilanti Township (data center documents)","https://ypsitownship.org/data-center-documents/"],["Bridge Michigan (Copperwood, $50M)","https://bridgemi.com/business-watch/controversial-up-copper-mine-gets-50m-in-state-grants-after-years-of-trying/"],["Michigan Advance (El-Sayed, Moss, Piker)","https://michiganadvance.com/2026/08/25/el-sayed-moss-stress-opposition-to-rogers-amid-dispute-over-piker-comments/"],["U-M Record (Wolverine Village)","https://record.umich.edu/articles/wolverine-village-reimagines-living-and-learning-at-u-m/"]] },
      { t: "The visa case did move — this desk had it wrong twice — and the numbers underneath it are now measurable. Judge F. Dennis Saylor IV issued an order on Aug 19 in NAFSA: Association of International Educators, et al. v. Department of Homeland Security in the District of Massachusetts, setting a briefing schedule; the DHS response deadline of Aug 31 and the Sept 3 hearing at 11 a.m. in Courtroom 1 are both confirmed, not unconfirmed as reported here on Monday. And the plaintiff composition was wrong: the parties are associations and unions — NAFSA, the Presidents’ Alliance, the Association of Independent Colleges and Universities in Massachusetts, the American Federation of Teachers, Graduate Labor Organization AFT Local 6516, the UAW, UAW Local 2322 and NewsGuild-CWA. The fifteen institutions supplied declarations and testimony, not party status. The complaint and preliminary-injunction motion were filed Aug 18 against a rule published July 17 capping F-1 and J-1 admission at four years. The scale is now visible in two places. Nationally, student visa issuance fell 23% in 2025 against 2024 — F-1 down 33.4%, J-1 down 9.9%, M-1 down 6.7% — with India down 56.6%, China down 28%, Iran down more than 90% from over 3,000 in 2024, and Myanmar and Venezuela each down more than 70%. Only 32 of more than 200 countries rose. The decline accelerated in May 2025, coinciding with the social-media screening rollout, and NAFSA projects a $3.4 billion economic loss for 2026–27. Institutionally, the University of Maryland College Park estimates incoming graduate enrolment could fall up to 30% this fall, with UMBC reporting 32 admitted students withdrawn and 14 deferred, and Youngstown State reporting international enrolment down 30% to 850 with about 100 new international students against 650 two years ago. The $103,265 H-1B fee has firmer edges too: exempt are “certain institutions of higher education,” nonprofit research organizations and governmental research organizations, with a 30-day comment period grounded in DHS’s asserted fee-setting authority rather than a proclamation — but the revenue estimate needs flagging, since DHS projects about $8.8 billion annually on an assumed 85,000 cap-subject petitions, not the roughly $3 billion this desk carried. Colleges hire more than 20,000 foreign scholars and administrators a year on H-1B, and the earlier $100,000 version was struck down on June 8 on the ground that the administration needed congressional authorization. Still no higher-ed association reaction to the new fee from ACE, AAU, NAFSA or the Presidents’ Alliance, and still no institutional or association response anywhere to the CPT reinterpretation — both absences now a week old. On accreditation, the Department’s proposal is open for comment until Sept 21 with possible finalisation Nov 1, and two new accreditors each received $1 million in launch funding in January. Under secretary Nicholas Kent: “In a more dynamic market, accrediting agencies would be incentivized to differentiate themselves based on quality.” The three changes are faster recognition of new accreditors with the two-year requirement eliminated; universal minimum expectations for student achievement plus mandated evaluation of retention, completion, post-graduation outcomes and licensure, alongside standards for faculty hiring and “intellectual diversity”; and conflict rules barring advisory board members from voting on standards affecting their own institutions. On the ABA specifically, correct Monday’s count: Chronicle reports only nine of the fourteen independent law schools would face difficulty finding an alternative recognized accreditor, not thirteen, and the staff analysis found more than 25 compliance violations. The Chicago technology ban gained detail and a second name. It covers three phases of the required social-sciences core sequences, typically taken sophomore year. Faculty are constrained as well: they may not use generative AI in grading unless they carefully assess it and disclose that use to students, syllabi must be produced by people rather than AI, and exception requests must reach division leadership by the first day of class. Jenny Trinitapoli signed the Aug 1 memo — “meant to lay the groundwork for higher level study at the College, in the SOSC Core we first equip students to read, write, and think without dependence on AI” — developed in consultation with core course chairs, with precedent in Sarah Hammerschlag’s all-analog course. The context that gives it force is that Chicago provides free Claude access campus-wide under an Anthropic contract, which is what spurred the campus debate. No other institution has adopted anything comparable; state that plainly rather than implying a movement. And for the classroom itself, the technique of the week is Heather McQueen’s Quecture at Edinburgh, published in 2021 and evergreen rather than new. The load-bearing idea is that the artifact a student produces is a question, not an answer — which is why it survives AI and why attaching credit to it does not collapse into free-riding. Mechanics: structure the lecture into learning-objective blocks and pause at the end of each, having stated the objective explicitly on a slide. Then run think–type–talk, in that order and with no substitutions. Think is silent and individual: each student formulates their own question about the objective just covered. Type commits it to a polling tool before any exposure to peers, which is what makes it enforceable in a large room — you get a visible artifact from every student rather than only from the confident ones. Talk is discussion with neighbours. Display the whole question pool to the class, which converts a private exercise into a shared diagnostic and shows students the distribution of confusion. Comment on the questions live and build subsequent segments around them; you are selecting, not answering everything. The assessment is the second load-bearing detail: roughly 5% of course credit for each student’s single best question plus their documentation of how it was addressed — in class, in office hours, in the reading, or by themselves. That rewards one curated artifact retrospectively rather than paying per utterance, so there is nothing to free-ride on, and the “how it was addressed” clause forces the student to close the loop. McQueen reports the gains fall particularly on lower-performing and educationally disadvantaged learners. In intermediate theory it lands naturally after a derivation — Slutsky, deadweight loss under a per-unit tax, a tangency condition — where the student question locates the misconception far better than a clicker item written in advance.",
        s: [["Presidents’ Alliance (duration-of-status litigation)","https://www.presidentsalliance.org/duration-of-status-litigation/"],["Inside Higher Ed (visas down 23%)","https://www.insidehighered.com/news/global/international-students-us/2026/08/26/new-student-visas-dropped-23-2025"],["Inside Higher Ed (accreditation proposal)","https://www.insidehighered.com/news/governance/accreditation/2026/08/26/3-key-changes-trumps-new-accreditation-rule"],["THE Campus (McQueen, the Quecture)","https://www.timeshighereducation.com/campus/teaching-scale-reaching-all-your-students-large-classes"]] },
      { t: "Mind & cosmos: a partial answer to a long-standing open problem that says so in its own abstract, entanglement made from sunlight in a tent at three in the morning, and a psychedelics beat that produced nothing at all. Physical Review Letters published its Aug 25 issue with three quantum papers worth the space. The strongest is Dominic J. Williamson of the University of Sydney, sole author, on partial self-correction in layer codes built from good quantum Tanner codes: memory time grows exponentially with linear system size up to a length scale that is itself exponential in inverse temperature, at which point it scales as a double exponential of inverse temperature, decoded by three rounds of parallelised minimum-weight perfect matching composed with a good-quantum-Tanner-code decoder. A three-dimensional self-correcting quantum memory is a named open problem, and the honest framing is Williamson’s own — the codes “fall short of achieving strict self-correction in the thermodynamic limit,” and only small explicit instances built on random input codes have been simulated. In the same issue, Wojciech Górecki of INFN Pavia with Simone Felicetti of ISC-CNR Rome, Lorenzo Maccone of Pavia and Roberto Di Candia of Aalto derive lower bounds on relaxation time and second-order correlation time from continuous-measurement quantum metrology, computed solely from steady-state expectation values and their parameter derivatives — validated on a critical driven-dissipative resonator, where the bound matches known analytical dynamics, and on the infinite-range Ising model, where only the steady state is solvable and the bound yields information beyond existing analytical reach. These are lower bounds and the method presupposes the steady state is measurable even where the dynamics are not. Third, a São Paulo–Kastler Brossel–Oklahoma collaboration led by R. L. Rincón Celis reports a resonator-based detection system addressing the sidebands of each beam independently, recovering twin-beam correlations that standard homodyne spectral measurement discards, and showing that phase shifts between carrier and sideband modes change which entanglement witnesses fire — with no numerical claims in the abstract, so attribute no figures to it. The prettiest result of the day is in Optica: Hanieh Fattahi’s group at the Max Planck Institute for the Science of Light concentrated sunlight to a spot about two millimetres wide, fed it into a hair-thin fibre, and generated entangled photon pairs at a Bell parameter of 2.54 against a classical threshold of 2, with 94% fidelity to the target Bell state and a pair-generation rate comparable to laser pumping once normalised by spectral bandwidth. Their own caveats are the good part: continuous sun tracking, environmental effects and background light are “significant practical challenges,” and they had to enclose the apparatus in a tent and take initial measurements around 3 a.m. to suppress background. Underneath the physics it is a cost-of-inputs story — entanglement from a free pump. Also new, from Boston College: Brian Zhou and lead author Thomas K. M. Graham, with Zdeněk Sofer in Prague, report scanning nitrogen-vacancy magnetometry of two atomic layers of chromium sulfur bromide, with an electrical on/off ratio of 1,000,000% and a magnetic on/off ratio of 3,000% — no temperatures, field strengths or spatial resolution published, so those two ratios are the only hard numbers. The money moved too, and should be read as money rather than results: NSF announced $290 million across eight quantum institutes over five years, including a $37.5 million five-year renewal for QuBBE at Chicago starting Sept 1 — which establishes a new Berggren Center for Quantum Biology and Medicine aimed at protein-based quantum sensors and nanodiamond detection of cellular activity, the rare filing where quantum-hardware money points directly at a biomedical adoption question — and $27.9 million for a Princeton-led Institute for Quantum Processor Manufacturing. On the mind side, Nautilus has Kristen French interviewing the Irish neuroscientist Shane O’Mara on how conversation continuously updates memory, with two people co-recalling retrieving richer detail than either alone. The instrument detail is the useful one and he supplies the limitation himself: fNIRS rigs now cost around €400,000 and his lab is building toward monitoring four people simultaneously, but fNIRS reads cortical activity only to about two centimetres of depth — which excludes the hippocampal formation he credits with the mechanism. Quanta did not advance past Monday’s Barrett and Miller piece. Tricycle ran Meredith McKinney’s translation of Bashō’s The Narrow Road to Oku, excerpts from the 1689 five-month journey through northern Japan with an introduction to the haibun form; a small plumbing note, Tricycle’s /latest/ page does render dates even though its homepage does not, which makes it a cheaper index than fetching articles one at a time. And Buddhistdoor reports a Myanmar military airstrike killing fourteen people at a Buddhist monastery in Sagaing Region during a meditation retreat. The psychedelics beat is empty: no Field Notes #5 at Psychedelic Alpha, the numbered Bulletin run showing no sign of moving past #229, nothing on PsyPost’s psychedelics section on Aug 24, 25 or 26, and no new trial results, regulatory filings or state programme data anywhere in the window.",
        s: [["PRL (partial self-correction in layer codes)","https://journals.aps.org/prl/abstract/10.1103/mb89-8436"],["Physics World (sunlight entanglement)","https://physicsworld.com/a/researchers-harness-sunlight-to-generate-quantum-entanglement/"],["The Quantum Insider (NSF $290M)","https://thequantuminsider.com/2026/08/25/nsf-invests-290m-eight-quantum-research-institutes/"],["Nautilus (O’Mara on conversation)","https://nautil.us/how-conversations-can-shape-reality-1284420"]] },
      { t: "Director watch: the Lynch weekender has been called off, and as of this morning only the organisers know. Both event-controlled pages now say so — gatheringoftheangels.com carries a banner reading “DUE TO UNFORESEEABLE CIRCUMSTANCES, A GATHERING OF THE ANGELS 2026 HAS BEEN POSTPONED TO 2027,” with new dates “announced soon,” and welcometotwinpeaks.com’s event page, published May 6 and last updated Aug 24, states that “this event has been postponed. Ticket holders have been informed,” with its guest list stripped back to George Griffith and Sabrina Sutherland. The TicketTailor sales page now returns a 404. Not one press outlet has picked it up: Time Out of Aug 12, NME of Aug 14 and the rest still run Sept 26–27 as live, which means all that copy — the Goaz and Buchanan bookings, the owl, the Double R Club, the £180 weekend pass — is now stale rather than merely provisional. The Dunham and D’Amico online-panellist correction this desk made on Monday was right and was carried correctly by both Time Out and NME; it is simply moot. One new recirculator to reject: the British Fantasy Society’s undated page describes the 2025 edition, with Michael Horse, Chrystabell and Dexter Fletcher, and surfaces on postponement queries. On von Trier the checkpoint returns a no with two substantial new facts attached. No completion announcement has appeared in Danish or English by Aug 26. Ekko reports that Stellan Skarsgård is attached, calling the project “an experiment consisting of still images” and saying of von Trier, “I would say yes to him — whatever he asked.” The format is the news: still photographs, modelled on Chris Marker’s La Jetée, chosen specifically to minimise physically demanding shoot days and accommodate the Parkinson’s diagnosis. And Peter Aalbæk Jensen’s brake is firmer than the screenplay timeline suggested — “at least two more years” before a finished film reaches audiences, since production funding cannot even be applied for until the manuscript is done. His August wording was also hedged more than this desk rendered it: “before the summer break, I heard that Lars might, with a bit of luck, have the screenplay written around August.” On his health: “physically, Lars is affected, but there’s nothing wrong with his mind.” One date to flag rather than resolve — the Ekko article page renders Aug 5 while the site index lists it as Aug 14. Noé remains a verified negative, re-checked against his IMDb news index, whose most recent item is still dated February 5, 2016. Refn is unchanged since May, though Cineuropa fills in the credits: MUBI holds North America, Latin America, the UK, Ireland, France, Italy, Spain, Benelux, Turkey, Australia and New Zealand with Goodfellas on the rest, Christina Erritzøe and Kimberly Willming of byNWR Originals and Goodfellas’ Vincent Maraval executive produce, and principal photography stands for January 2027 in Los Angeles with no cast. Refn: “in today’s political and social climate, the iconography of Maniac Cop alone provokes an immediate, uneasy reaction… a radical new vision where there is no protection, no safety net, only mayhem.” MUBI’s Efe Cakarel: “not a remake; it is a resurrection.” Criterion’s December slate is still not announced — checked against its own Coming Soon page, nothing past The Right Stuff on Nov 24, with Wild at Heart in 4K and Shadows of Forgotten Ancestors on Nov 17 and The Complete Kubrick collector’s set on Oct 20 — and the blu-ray.com “Criterion Announces December Releases” trap fired again as a top result, still September 15, 2025, still the December 2025 slate. Venice was re-verified clean against all nineteen Classics restorations; it opens Sept 2 with Danny Boyle’s Ink. In the art world two deaths and a sentence. Sliman Mansour, the Palestinian painter who chronicled six decades of the liberation struggle, died Aug 24 at 79; Hyperallergic’s Hakim Bishara: “drawing from the bleeding wound of the Nakba and the fight for liberation, his work is a defiant response to those who wish Palestine was just a distant memory.” And Gao Zhen, one half of the Gao Brothers, was sentenced on Aug 25 to three years by the Sanhe City People’s Court in Hebei — he is 70 — for sculptures made between 2005 and 2009 depicting Mao repenting or aiming fire at Jesus, prosecuted under Xi’s 2021 amendment on slander of China’s heroes and martyrs, having been arrested in August 2024 during a family visit to Hubei. His wife and son are barred from leaving China. The Vienna Bernini now has a title — Portrait of an Old Man, head and shoulders, white hair on a dark ground — and Gudrun Swoboda’s case in her own words: the mouth shows “a sense of the sculptural,” the paint is applied like modelled clay in “short bristle-brush strokes,” and the moustache technique is “sculpting with the brush.” Scientific examination confirms two hands, with a second artist, possibly one of Bernini’s sons, painting the lower garment and shoulder; the sitter may be Mario Chigi. The Smithsonian regents vote — not merely discuss — on Aug 31 whether to house the National Museum of the American Latino in the Arts and Industries Building, which would bypass the congressional approval the original plan required, with the failure of the women’s history museum bill in May as the precedent everyone is reading. One thing to hold rather than assert: Hyperallergic says the building reopened this summer after a 22-year closure with 250th-anniversary exhibitions, The Art Newspaper says restoration is ongoing with no completion date, and this desk has carried it as closed since 2004 and closing again Sept 7. Three sources, three states; do not state the building’s status. Messina is cold — no recovery, arrest or investigation news, all coverage still clustered Aug 15–17, and neither Hyperallergic nor The Art Newspaper mentioned it at all this week. The live thread there is instead Europol’s warning about increasingly violent museum thefts across Europe. And a quiet find for anyone who reads: more than eighty secret artworks by Iris Murdoch, made during her Oxford years of 1939–41 and Dalí-influenced, have turned up in an attic, with twenty-five now on display at the University of Chichester Library.",
        s: [["Welcome to Twin Peaks (event postponed)","https://welcometotwinpeaks.com/event/a-gathering-of-the-angels-2026-david-lynch-celebration/"],["Ekko (Skarsgård, La Jetée format)","https://www.ekkofilm.dk/artikler/lars-von-trier-naermer-nyt-manuskript/"],["Hyperallergic (Gao Zhen sentenced)","https://hyperallergic.com/chinese-artist-gao-zhen-gets-3-year-prison-sentence-for-mao-sculptures/"],["The Art Newspaper (Bernini)","https://www.theartnewspaper.com/2026/08/20/newly-discovered-bernini-painting-to-be-unveiled-at-vienna-museum"]] }
