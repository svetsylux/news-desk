<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

    { h: "World & geopolitics", items: [
      { t: "The Independence Day diplomacy produced one communiqué, one American refusal, and one number worth keeping. At the UN Security Council session convened Monday afternoon, more than fifty UN members — the EU and its member states, the UK, Canada, Japan, South Korea, Georgia and Australia — signed a joint statement urging Russia to halt its aggression and stop striking civilians. The United States did not sign. Dan Negrea, identified by the Kyiv Independent as US envoy to the UN Economic and Social Council, instead called on “both sides” to cease strikes endangering civilian vessels and urged negotiations to “return peace and stability to both countries” — the both-sides framing being the whole of the story, and the second consecutive time Washington has declined to join such a rebuke. Danish foreign minister Lars Løkke Rasmussen, chairing: “This senseless war and the immense human suffering could end immediately,” Russia “simply needs to accept the unconditional ceasefire.” Poland's deputy permanent representative Michal Miarka, on airspace violations over Poland, Romania and Latvia: “These cases cannot be accepted as the ‘new normal.’” No resolution was tabled or voted, no Russian statement appears in any reachable filing, and neither Rosemary DiCarlo nor Tom Fletcher — the previewed briefers — is quoted in the outcome coverage, nor does the UN human rights mission's 37% rise in first-half civilian casualties resurface. The thirty-nation Coalition of the Willing did produce a communiqué: strengthen Ukraine's air defence “as a matter of urgent priority,” deepen defence-industry cooperation through the Anti-Ballistic Missile Coalition, “ratchet up” sanctions on Russia's military-industrial complex and the Shadow Fleet, deliver energy support before winter through the Ukraine Energy Support Fund, and hold the Multinational Force Ukraine ready to deploy once a “credible cessation of hostilities” is established under “robust politically and legally binding security guarantees.” It demands a “full, immediate and unconditional ceasefire” from the current line of contact and claims measures since February 2022 have cost Russia at least $495 billion. One inconsistency to note: Kyiv Post's own summary has Andy Burnham, Emmanuel Macron and Friedrich Merz chairing alongside Zelensky, while a second Kyiv Post filing and the Kyiv Independent both have Macron and Merz participating remotely. The concrete ask is Patriots. Zelensky wants at least 300 interceptors for the winter, and his own delivery series is the argument: 675 missiles in 2023, 364 in 2025, and “for 2026, as currently projected, it is 264.” Burnham and other European leaders will approach Trump at the General Assembly in September to seek access to US stockpiles — “I'm quite clear what I need to do in the next few weeks,” he said, calling the shortage “fixable” but requiring “a lot of negotiation.” Britain separately authorised MBDA to release classified data on the SCALP missile's British components so Ukraine and France can stand up local Storm Shadow production; within hours Dmitry Peskov said Russia “is doing the relevant work to identify missile production sites” and that Britain is in the war “on the side of the Kyiv regime.” That ends this desk's four-day run of no Kremlin voice — but Lavrov is now five days silent, his only scheduled appearance today being Vatican talks with Archbishop Paul Richard Gallagher on bilateral cooperation, with Ukraine not on the announced agenda. Witkoff, Kushner and Ushakov make five straight days with nothing verifiable; Peskov's Aug 20 line still stands as the latest word — they are “always welcome conversation partners,” but “there is no specific information yet. No specific dates have been set for such a visit yet.”",

      { t: "The peace proposal this desk flagged yesterday has gone quiet, and the “corridor of opportunities” it treated as an unconfirmed lead is real — but starts later than reported. ISW's Aug 23 assessment recorded that Zelensky “reportedly presented a joint Ukraine-US-Europe proposal on August 23 to end the war.” Its Aug 24 assessment does not mention it at all: the six key takeaways are the Ukrainian campaign against Russian air defences, Putin setting conditions for asset nationalisation, relief measures for Russian enterprises, Putin extending loyalist tenures including Alexander Bastrykin's, an overnight strike package of “two Onyx anti-ship missiles, six Kh-31P/Kh-59 guided aerial missiles, and 143 drones,” and Ukrainian advances at Slovyansk, Hulyaipole and western Zaporizhia. No text, no sourcing, no US comment and no Kremlin response has appeared in twenty-four hours, which makes the Aug 23 line an unrepeated single-source claim and not a development. The corridor, by contrast, is confirmed twice over and in Zelensky's own words: Meduza carries him verbatim — «Коридор возможностей по окончании войны — от G20 в Соединенных Штатах Америки до конца лета 2027 года» — from the G20 summit in the United States on Dec 14–15, 2026 to the end of summer 2027, before US presidential campaigning begins. Kyiv Post independently renders it as “a ‘corridor of opportunity’ for diplomacy exists from the upcoming G20 summit until late summer 2027.” Correct yesterday's “late 2026” to the G20. From the same remarks: he offered to halt Ukrainian strikes on Russian oil infrastructure if Russia stops attacking Ukrainian energy and agricultural facilities; he called NATO membership “the only viable option” for security guarantees; he named Moscow's “absolute demand” as Ukrainian withdrawal from the east; and on the two American intermediaries, he said they “very much want to bring victory to President Trump.”",

      { t: "Two days of tolls, and the slug trap caught this desk out again — in the direction that understates. Monday's roundup, filed 12:33 Kyiv, reports at least eight killed and at least 43 injured across Ukraine over the preceding day: Kharkiv 5 killed and 17 injured including two children, Donetsk 2 and 7, Sumy 1 and 12, Zaporizhzhia 3 injured, Dnipropetrovsk 3 injured, Chernihiv 1 injured. Russia launched two Oniks anti-ship missiles, six Kh-31P/Kh-59 guided missiles and 143 drones; Ukraine downed one Oniks, two Kh-31P/Kh-59, two Banderol munitions and 109 drones. The Independence Day strike itself was on Chernihiv, where a drone hit a nine-storey residential building around noon in the third of three waves — the URL says fifteen injured, the body says at least eighteen including two children, and the body is the number. Governor Viacheslav Chaus: “Cynical strike by Russian terrorists on a residential building in Chernihiv. Right in the middle of the day — on Independence Day.” Overnight into Tuesday, from 18:00 Monday, Ukraine's Air Force counted one Iskander-M ballistic missile, one Kh-31P and 150 Shahed-type drones launched, with 124 drones neutralised by 09:00 — three killed and one injured: one in Kharkiv's Osnovianskyi district (Mayor Ihor Terekhov), two in Zaporizhzhia in a guided aerial bomb strike (Governor Ivan Fedorov), and a woman injured but not hospitalised in Kyiv's Holosiivskyi district. The Vinohradivka–Vulcănești crossing on the Ukraine–Moldova border closed temporarily after drone damage to infrastructure, with the State Customs Service saying it would announce resumption later. Going the other way, the Ozon campaign did not run a fourth night — and moved from the warehouse floor to the exchange. Confirmed sequence: Chapaevsk in Samara Oblast on Aug 22, Orenburg on Aug 23, then Adygeysk, Nevinnomyssk and Makhachkala on Aug 24, roughly 233,000 square metres or about 6% of Ozon's warehouse capacity in three days. Ozon shares fell 28.5% to 2,129 rubles by 10:30 Moscow time after opening down 12.7%; the benchmark Russian index fell 2%; parent AFK Sistema dropped over 13%. Ukraine's Defence Ministry claimed it plainly: “After Ukrainian units struck Wildberries' 15 largest logistics hubs, now it's Ozon's turn,” arguing that “systematic strikes on storage centers for dual-use goods complicate the enemy's logistics and negatively affect the Russian economy as a whole.” One sourcing note worth carrying rather than smoothing: TASS quotes Ozon's press office directly — a fire, staff “promptly evacuated,” “preliminary reports indicate several injuries,” the warehouse suspended indefinitely, items hidden from the storefront, orders cancelled with refunds and inbound shipments halted — while Meduza states in the same window that Ozon's management has commented on neither the attacks, their consequences, nor a way out. Attribute the operational detail to TASS quoting Ozon, not to settled fact. Overnight into Tuesday the target set shifted back to refining: the Afipsky refinery in Krasnodar Krai was hit for the fifth time this year, after Jan 21, Mar 14, Jun 11 and Jul 14, with Governor Veniamin Kondratyev reporting “at least 10 private homes were damaged” and fires at a home and on refinery premises; the Novoshakhtinsk refinery in Rostov Oblast was reported struck by the Ukrainian monitoring channel Supernova+, single-source, with Governor Yuri Slyusar confirming only drone attacks on Novoshakhtinsk, Gukovo and Kamensk-Shakhtinsky. The cumulative figures are the ones to hold: more than seventy Ukrainian drone attacks on Russian industrial facilities since the start of 2026, five refineries fully halted since early August, and Russian refining capacity down to 3.6 million barrels a day, the lowest since May 2002. A correction to yesterday's Brovdi item: the sourced claim from the commander of the Unmanned Systems Forces is that “Ukrainian drones successfully struck 66 Russian targets overnight on Aug. 24,” with one MiG-29 near Dolotinka and four radars — narrower than the Su-33, S-400, Pantsir and Tor list this desk published. And the Krasnodar childcare toll is not converging but diverging: the Kyiv Independent and Kyiv Post cite Governor Kondratyev for two children killed and nine injured, TASS cites the same governor for three children killed and seven injured, and the Moscow Times now cites Russian children's rights commissioner Maria Lvova-Belova for “at least three teenagers” killed and six children hospitalised. Three accounts, one governor, no reconciliation.",
        s: [["Kyiv Independent (Monday toll)","https://kyivindependent.com/russian-attacks-kill-8-injure-43-across-ukraine-as-country-marks-independence-day/"],["Kyiv Post (overnight into Tuesday)","https://www.kyivpost.com/post/83044"],["Kyiv Post (Afipsky, fifth strike)","https://www.kyivpost.com/post/83038"],["Meduza (Ozon shares)","https://meduza.io/en/news/2026/08/24/shares-of-russian-online-marketplace-ozon-drop-more-than-28-on-moscow-exchange-after-ukrainian-drone-strikes-on-its-warehouses"]] },
      { t: "The Iran package landed, it has a name, and the most consequential thing in it is what is missing. Treasury press release SB0613, dated Aug 24 — “Treasury Launches Unprecedented Campaign Against Iranian Regime on Economic D-Day” — designates roughly sixty entities, individuals and vessels under Executive Order 13902, and newly determines five sectors of Iran's economy sanctionable: digital assets, technology, gold, aviation and shipping. Digital assets is the novel addition; as TRM Labs reads it, any institution processing a significant transaction for an Iranian exchange or digital-assets business now risks its own access to the US financial system. Jurisdictions touched include the UAE, Hong Kong, China, Singapore, Switzerland, Malaysia and Europe; named entities include Sweet Ocean Industrial, RPT Technology, Shenzhen Sweet Ocean Technology, BRE Line, Azure Shipping, Shipoil and Wellbred Capital, alongside the IRGC-Qods Force and vessels SIFRA, G SILVER, QUANTUM HOPE, VOYAGE ELITE and TELA. Bessent: “President Trump has taken action that his predecessors have long deferred. Under his leadership, America is no longer managing the Iranian threat. We are ending it,” and the objective is “to sever every economic lifeline that sustains this tyrannical regime until Tehran stands alone.” The omission is the story. China was not named as a target in his opening remarks and the large Chinese banks that would actually clear Iranian oil payments were deliberately spared — OilPrice: “Washington stopped short Monday of sanctioning the larger Chinese banks that may facilitate those purchases.” Chinese individuals and shipping and technology firms were designated; Chinese financial institutions were not. Asked about them directly, Bessent said only: “We want to make clear here today that no one is above the reach of U.S. sanctions.” No public timeline was given, countries were reportedly given private deadlines through quiet diplomacy, and a further announcement involving a financial institution is expected by the end of the week — single-source. Markets read the carve-out as de-escalation and sold: Brent fell about 2.6% to $91.97 and WTI 2.6% to $84.81 shortly after the announcement, after both had gained more than 5% the prior week. Tehran's reply came from Mohsen Rezaei, SNSC secretary: “Any country that takes part in imposing economic restrictions on us will be regarded as an enemy,” with a stated three-stage sequence of negotiation followed by strikes on participating nations' interests, and the standing threat that if Iran's neighbours join in, “not a drop of oil will leave the Persian Gulf and the Strait of Hormuz.” Foreign Minister Abbas Araghchi's line exists in two translations of a single statement — Al Jazeera renders it “We have seen this movie before. Same bull. Different bullies,” Xinhua as “In a sense, it is a repetitive film that we have watched over and over and know how to deal with” — attribute the phrasing to the outlet. Spokesman Esmaeil Baghaei called the US demands “an assertion of extraterritorial sovereignty.” Two corrections to yesterday's brief. First, the operation is called Economic Outcast, not Economic Fury — Fury was Ambassador Mike Waltz's pre-announcement name for the effort, so anything using it after Monday afternoon is pre-announcement copy. Second, the Hormuz fee spokesman is Hassan Ghashghavi, spokesperson of the Majlis National Security and Foreign Policy Commission, not Ebrahim Rezaei: “Based on Article 3, a fee will be charged for services including maritime, environmental, fuelling under special conditions, insurance, safety, and other services provided in the Strait of Hormuz.” It remains committee-level, with full Majlis, Guardian Council and possibly Expediency Council stages still ahead, and no fee amounts disclosed anywhere. Field Marshal Asim Munir's Tehran visit happened, with Interior Minister Mohsin Naqvi, meeting Pezeshkian, Mohsen Rezaei, Ghalibaf, Araghchi and Interior Minister Eskandar Momeni; the ISPR readout says discussions focused on “measures to prevent further escalation, reopening of the Strait of Hormuz and expedited termination of the conflict,” with Iranian leaders appreciating Pakistan's “constructive role” — but no agreement and no extension of the lapsed June 17 memorandum. GlobalSecurity's war log has not rolled forward: it still reads Day 177, Aug 23, so the no-strikes-inside-Iran streak is verified only through the night of Aug 22–23 and should not be reported as a twenty-fifth or twenty-sixth night. The two-day quiet on Israel–Lebanon is over — IRNA, single-source, reports Israeli warplanes striking a house in the Deir neighbourhood of Nabatieh al-Fawqa late Sunday, with artillery on Ali al-Taher, Kfar Reman, Al-Dabsha and Mansouri, a demolition at Al-Taybeh and houses burned at Haddatha, and no casualty reports available. From the heterodox bench, the reads run directly against Bessent's framing: John Mearsheimer's “Is Strangling Iran Going to Succeed?” argues that “Iran faces an existential threat from the US and Israel, which incentivizes it to absorb huge amounts of pain,” that “China, which is Iran's largest trading partner, has already let it be known that it will not play along,” and that “the US does not have the luxury of playing the long game, which is what its policy of economic strangulation demands.” Larry Johnson reads the Saudi–Turkey–Pakistan Mecca agreement as post-American security architecture Iran is about to join. At Responsible Statecraft, Andrew Leonard writes that “military force can set conditions, signal resolve, and buy time for civilian action. It cannot determine political outcomes,” and Jennifer Kavanagh argues a US–Israel mutual defence treaty and permanent basing “will increase the U.S. security burden and tie the United States down in the Middle East in ways that may quickly become irreversible.” Nothing new from Diesen with a verifiable article URL, and nothing from Sachs since Aug 15.",

      { t: "Monday closed mixed and quiet, and the loudest thing in the tape was a Truth Social post about Canada. AP's tally: the S&P 500 at 7,652.86 (−21.51, −0.28%), the Nasdaq Composite at 25,980.19 (−200.26, −0.8%), the Dow at 53,417.16 (+140.15, +0.3%) and the Russell 2000 at 2,995.08 (−22.79, −0.8%). AP's framing — stocks “drifted to a mixed finish as the countdown ticks toward potentially market-moving events coming later in the week.” The tech leg came from a weekend report that Nvidia plans to raise prices on some AI servers by more than 15%, which sold off Sandisk, Micron and the memory complex. Two corrections to yesterday's numbers, both of the same kind. The VIX figure this desk published (15.92, up 5.23%) was a futures quote; cash VIX closed Friday at 15.84 and Monday at 14.89, down 6.00% — the opposite sign. Tuesday's pre-market tables again show about 15.85, again futures. And the Nasdaq hazard is live in today's data: Monday's Composite close is 25,980 while Tuesday's Nasdaq-100 futures are 29,239.75, a gap of more than 3,200 points. As of 2:10 a.m. ET Tuesday, S&P futures were 7,686.00 (+0.21%), Nasdaq-100 futures 29,239.75 (+0.46%), Dow futures 53,561.00 (+0.13%) and Russell futures 3,008.70 (+0.24%). On Canada the situation escalated rather than resolved. Trump posted Monday threatening 50% tariffs on all Canadian cars, trucks, auto parts and steel effective Jan 1, 2027: “Canada has been ripping off the United States of America for years,” and “Build in the U.S. and there are ZERO TARIFFS.” The sequence now runs: Prime Minister Mark Carney suspended talks Aug 21 after eighteen months, saying “last-minute changes in the U.S. proposed terms were unfair, uneconomic, and called into question the reliability of any deal”; a US 50% tariff on roughly $28 billion of Canadian goods took effect at midnight Aug 22; Canadian dollar-for-dollar retaliation on steel, dairy, appliances, agricultural equipment, pulp, paper and electronics arrives Sept 8. Carney: “It's a power play… becomes a question of sovereignty,” and “In short, they asked too much, and they offered too little.” USTR Jamieson Greer counters that Canada declined to finalise agreed terms and that the US had offered “the best treatment of any major exporter.” The Canadian dollar was Monday's weakest major currency; claims that the threat pressured GM and Ford shares are single-source and unquantified. In Treasuries the long end firmed again — the 10-year around 4.702% and the 30-year around 5.23% Tuesday morning, implying Monday closes near 4.70% and 5.23% against Friday's 4.737% and 5.276% — with TradingEconomics attributing the steadiness to investors “assessing the implications of the Treasury Department's expanded debt buyback program.” That activist-Treasury theme is now the connective tissue between the bond market and the gold market. Today's calendar, confirmed across four independent sources: Case-Shiller and FHFA house prices at 9:00, then Conference Board consumer confidence (consensus 90.8), new home sales (628K) and the Richmond Fed at 10:00. Wednesday remains the week's hinge — July PCE, the second estimate of Q2 GDP and July durable goods at 8:30, then Nvidia after the close at a consensus $2.09 on $92.07 billion against year-ago figures of $1.05 on $46.74 billion, roughly a doubling on both lines, with the setup risk that Nvidia has beaten for four straight quarters and sold off on every one. Two figures this desk carried need correcting: durable goods at +0.7% is TradingEconomics' own model forecast, not the street, where consensus is +0.3%; and the July PCE consensus is now in dispute, with one calendar showing −0.1% headline against the +0.1% carried here and an independent forecaster putting core at 3.2% year over year rather than 3.3%. Treat Wednesday's PCE year-over-year as unsettled until it prints. Friday still stacks the Chicago PMI at 9:45 (consensus 57.6), the final Michigan sentiment — where the number to use is the August preliminary of 51.0, not the 55.2 that is July's final recycled — the preliminary payroll benchmark revision, and Kevin Warsh's first Jackson Hole keynote. On the Fed itself the July 29 meeting held at 3.50–3.75% by 9–3 with all three dissents hawkish, and September hike odds now sit at 33.5% on both Kalshi and Polymarket against 30% on CME FedWatch a week earlier — a narrower spread than the 53-versus-32 gap of a month ago, but still worth quoting as a range rather than a number. J.P. Morgan's Phil Camporeale: “The combination of a slower-than-expected normalization of supply chains around the Strait of Hormuz and market questioning of inflation-fighting credibility after the July FOMC meeting has lowered the bar for a rate hike in September.” Goldman's Jan Hatzius on the other side: “After two months of materially softer jobs and inflation data, it's hard to see any of the doves shifting toward hikes.” No Fed speakers Monday or Tuesday — not a formal blackout, which begins Sept 5, but a cleared calendar before the symposium. Adam Posen of the Peterson Institute on what Warsh walks into: “Both the bond market and the FOMC have clearly decided to wake up.” Evercore's Krishna Guha: “We are in a regime where activist Treasury policy is as material.”",
        s: [["Barchart/AP (Monday close)","https://www.barchart.com/story/news/4009034/how-major-us-stock-indexes-fared-monday-8-24-2026"],["Fox Business (Canada tariffs)","https://www.foxbusiness.com/politics/trump-says-50-tariffs-canadian-vehicle-steel-imports-hit-jan-1"],["Reuters via Yahoo (Jackson Hole stakes)","https://finance.yahoo.com/economy/policy/articles/bond-market-anxiety-raises-stakes-100241607.html"],["AlphaStreet (Nvidia preview)","https://news.alphastreet.com/nvidia-nvda-q2-2027-preview-eps-est-2-09-reports-august-26/"]] },
      { t: "Gold held its three-month high, silver faded, crude gave back the sanctions premium, bitcoin took out $80,000, and the ruble's four-session rally ended. Gold spot traded around $4,633 Tuesday morning, down 0.40%, implying a Monday close near $4,652 — TradingEconomics' own commentary says “around $4,650,” a small internal inconsistency worth noting — while December futures sit at $4,701.40. The roughly $68 gap between them is contango, not a contradiction. TradingEconomics' framing is the useful one: “US government interventions in the bond market revived the so-called debasement trade that fueled gold's 65% rally in 2025.” Silver fell toward $68.04, down 1.30%, implying a Monday close near $68.94 — below the $69.384 this desk published Monday, so silver faded through the session rather than extending. Crude went the other way from the sanctions premium: WTI around $83.59 and Brent $90.66 Tuesday morning, after Monday settles near $85.01 and $92.17, both down roughly 2.4% on the day. PVM's Tamas Varga on the asymmetry: “Should the pledged embargo be launched, oil supply from the region will fall.” In crypto the level is the story and the delta is not: bitcoin above $80,000 (CoinDesk's widget at $80,719), ether just under $2,500, solana just above $101, XRP just above $1.50 and zcash at $846 — bitcoin up more than 25% on the week and 23% month to date. The caution is in the same filing: bitcoin's momentum gauge sits near 78 on a 0–100 scale, where “anything above 70 is usually read as a sign that a price has climbed too far too fast and is due a pause,” with Bitfire Research seeing selling pressure between $78,500 and $82,000. Flows have not blinked — Monday brought a seventh consecutive day of bitcoin ETF inflows at $337.56 million, with ether at $115.57 million, solana $33.49 million and XRP $13.82 million, taking the week past $2.5 billion and bitcoin ETF assets to $98.56 billion from $78.67 billion a week earlier. On the ruble, the new fixing arrived and the direction reversed: the Bank of Russia set USD/RUB at ₽83.2878 effective Aug 25, from ₽82.9211 in force across Aug 22–24, a 0.44% weakening after four consecutive sessions of appreciation from ₽85.1293. EUR/RUB is ₽97.4384 and CNY/RUB ₽12.3853; the key rate holds at 14.00% with the next board meeting Sept 11. And the week's teaching item lands on the same morning as the sanctions package, which is either luck or the natural rhythm of an academic literature that has been waiting for this. Gabriel Felbermayr of the Austrian Institute of Economic Research, Ohyun Kwon of Wharton, and Constantinos Syropoulos and Yoto Yotov of Drexel, publishing at CEPR, take 22 broad sectors, more than 170 industries and over 200 countries from 1986 to 2022 and find that complete sanctions cut sender–target trade in all 22 sectors, significantly in 20 — while raising the target's trade with third countries in 17 of 22 sectors, significantly in 13. In chemicals and metal products, third-country trade more than doubles. Their case study is Georgia under Russia's 2006 embargo: exports to Russia fell 56.9%, exports to the rest of the world rose 79.5%, and total exports rose 60.9%. Their conclusion is a warning about measurement rather than about policy — sanctions “clearly disrupt trade between senders and targets” while trade “between targets and third countries” expands substantially, so “bilateral statistics can mislead.” A companion column the same week, by Francesco Bianchi and Qingyuan Fang of Johns Hopkins with Leonardo Melosi of the EUI and Anna Rogantini Picco of the ECB, estimates that a Eurobond-financed common fiscal capacity would cut the euro area's zero-lower-bound frequency from 25.6% to 13.1% and output volatility from 13.5% to 6.4%.",

    { h: "Health & policy", items: [
      { t: "The weekend drought broke, and Monday produced the best health-economics item in weeks — a natural experiment in incomplete restriction. A team led by Matt Notowidigdo, economics professor at Chicago Booth, working from a Bloomberg Philanthropies grant, studied 15,000 SNAP households of which 3,291 sit in the ten states that restricted soda purchases, using data from the first six months of 2026. Soda purchases fell about 12%, roughly 34 fewer twelve-ounce cans per person per year. But recipients redirected up to 39% of the unspent soda money into other sugary drinks and juices the restrictions do not cover — which is the finding, and the reason Notowidigdo's own conclusion is a design point rather than a verdict: “If the goal is to reduce sugar consumption, you want the ban to be more comprehensive.” The projected effects net of leakage are still substantial: type 2 diabetes risk down 2.6% over ten years, about 34,000 cases prevented nationally, roughly $1 billion a year in healthcare savings. The paper is an NBER working paper and not yet peer-reviewed, and the survey component found the restrictions increased stigma among recipients — a real cost that appears in no savings estimate. Measles has moved too, and not in the right direction. CDC's count as of Aug 20 is 2,777 confirmed cases across 36 outbreaks, up 211 in a single week from 101 the week before, with 94% of cases outbreak-associated. Utah leads at 518, then Pennsylvania at 379, Virginia 177, Ohio 142, Arizona 122, Washington 55, across 45 states plus New York City and DC. Ninety-four percent of cases are in people unvaccinated or of unknown status; the hospitalisation rate is 7%, down from 11% in 2025; there have been no deaths in 2026 against three in 2025. Applying the Johns Hopkins unit costs this desk carried Monday, 2,777 cases at $58,591 including public health response comes to roughly $163 million. A new thread opens underneath: the National Verification Committee, chaired by Noel Brewer of the UNC Gillings School of Global Public Health, met in mid-August to assess whether the United States retains measles elimination status, with its assessment going to PAHO for a determination in November. Brewer's description of national rates was “a runaway train.” Third, California has put a penalty schedule behind a spending cap, which is the most concrete price-regulation experiment in American healthcare right now. General healthcare entities face a 3.5% growth limit in 2025 ramping down to 3% by 2029; seven designated high-cost hospitals face 1.8% in 2026 declining to 1.6% by 2029. Penalties run to a maximum of 125% of spending above target, with alternatives under consideration of $10,000 a day or a flat $500,000, and enforcement begins only in 2028 after two years of data collection. Ben Johnson of the California Hospital Association: “They're building the plane while flying it. We know improvements in affordability are needed, but we have serious questions about how and about what the unintended consequences could be.” The context underneath independently corroborates the Levitt figure this desk ran Monday — hospitals accounted for 40% of US health spending increases from 2022 to 2024 — alongside an estimate that about a quarter of US health spending is wasteful, and a California ledger of seventeen hospital closures since 2016 against six openings, before roughly $30 billion a year in expected federal Medicaid cuts.",
        s: [["STAT (SNAP soda study)","https://www.statnews.com/2026/08/24/snap-restrictions-12-percent-drop-soda-purchases/"],["CDC (measles data)","https://www.cdc.gov/measles/data-research/index.html"],["KFF Health News (California cost caps)","https://kffhealthnews.org/health-industry/high-healthcare-costs-hospitals-state-spending-limits-california-fines/"],["CIDRAP (211 new cases)","https://www.cidrap.umn.edu/measles/cdc-adds-211-new-cases-accelerating-us-measles-outbreak"]] },
      { t: "The vaccine RFI now has a deadline and a third version of its own baseline; the FDA nomination still has no hearing. Comments on the HHS request for information close Sept 20, under Federal Register document 2026-17250, asking whether the existing three categories — universal, risk-based, shared clinical decision-making — are “clear and understood” and whether “additional or different categories” should be adopted. The baseline for what the Aug 10 executive order actually cut is now reported three ways: Healthcare Dive says 17 diseases to 11, NBC News says 18 to 11, and Texas Public Radio also says 18 to 11 while naming the moved vaccines as hepatitis A, hepatitis B, rotavirus, meningococcal disease, influenza and COVID-19 — six, and without RSV, where this desk's standing list had RSV plus the two hepatitis vaccines. The arithmetic only closes at 18 if RSV is also counted among the moved, which would make the 17 a count that excludes one of them. Carry all three rather than picking. Substantively nothing has changed in the twenty-four hours: there is still no verifiable stakeholder response to the RFI itself, only to the executive order that preceded it — the Infectious Diseases Society of America's Aug 10 statement from president Ronald Nahass (“The American people deserve childhood vaccine recommendations that are made by qualified experts, through an established, transparent process and based on the best available scientific evidence”), the Pediatric Infectious Diseases Society's Aug 11 statement, and the letter now signed by more than 210 medical, scientific and public-health organisations. AAP president Andrew Racine warns that additional appointments “could delay vaccinations and create confusion” among families. With the deadline four weeks out, formal comments will cluster in mid-September. On the FDA, no hearing and no committee vote has been scheduled, and Senator Bill Cassidy as HELP chairman controls whether one happens at all after calling Heidi Overton's role in the vaccine order “almost disqualifying.” The White House is pressing ahead — spokesman Kush Desai says Overton has spent the last year and a half coordinating policy across health agencies and will be “integral” to the administration's agenda. The precedent cuts both ways: Cassidy voiced doubts about both Robert F. Kennedy Jr. and CDC director Erica Schwartz and voted to confirm both, but the White House was forced to withdraw surgeon general nominee Casey Means for lack of votes. One plumbing note that keeps costing this desk: the Senate HELP page for an FDA commissioner confirmation hearing still serves a notice dated Feb 27, 2025, announcing a March 6, 2025 hearing for Marty Makary. It reads as current and is not. Elsewhere: CMS's final rule barring federal Medicaid and CHIP funding for pediatric gender-affirming medications and surgery takes effect Oct 13, and Medicaid experts warn its legal theory — invoking general provisions about “ensuring efficiency and quality of care” — could in principle be applied to almost any drug, displacing the default that Medicaid covers outpatient FDA-approved drugs for medically accepted indications where manufacturers pay rebates. On GLP-1s, only Indiana has publicly signed onto the federal negotiation programme while several states move to end Medicaid coverage of weight-loss drugs on budget grounds — the state-level counterpart to a federal pilot that bypasses Part D plans entirely. Aon projects job-based health premiums rising 9.5% in 2027, with the sharpest version of the story in the public sector, where Dauphin County, Pennsylvania raised property taxes to cover it. And the Ebola outbreak passed its hundredth day Monday at more than 5,200 confirmed cases, averaging about ninety a day, with 260 deaths a week over the past six weeks and Ituri accounting for roughly 85% of cases — the number that matters most being that about 60% of deaths are occurring in communities rather than treatment centres, which means most transmission is happening outside the surveillance system. WHO's regional director for Africa, Mohamed Janabi: “This outbreak has reached a defining moment… we now need to significantly step up the response.”",
        s: [["AHA (RFI, Sept 20 deadline)","https://www.aha.org/news/headline/2026-08-21-hhs-seeks-feedback-immunization-categories-executive-order-childhood-vaccine-schedule"],["STAT (CMS gender-affirming care rule)","https://www.statnews.com/2026/08/24/transgender-care-ban-precedent-could-be-broadly-applied-medicaid-states/"],["WHO Africa (Ebola, 100 days)","https://www.afro.who.int/countries/democratic-republic-of-congo/news/over-5200-cases-recorded-democratic-republic-congocrosses100-days-ebola-outbreak-declaration"],["STAT (public-sector health costs)","https://www.statnews.com/2026/08/24/public-sector-workers-health-insurance-costs-hospital-union-battle/"]] }

    { h: "Campus & culture", items: [
      { t: "The Saline Township number this desk flagged as stale is stale, and the answer is messier than a correction. The $7 billion figure originates as a Wall Street Journal estimate relayed by Bridge Michigan on Oct 30, 2025 — announcement-day, second-hand, and ten months old. Bridge's current figure, $43 billion for “The Barn” from Oracle and OpenAI, appears in its gubernatorial data-centre explainer with no citation attached. A third and better-documented figure exists: $16 billion, tied to the Oracle/OpenAI financing close and carried by WLNS, ENR and Tom's Hardware, the last of which notes the project was “$7 billion when first announced late the prior year.” Whether $43 billion and $16 billion describe the same scope — full multi-phase buildout versus financed first phase — is not established anywhere reachable, so the honest presentation is $16 billion as the sourced financing figure and $43 billion as Bridge's uncited one. Retire the $7 billion. Verified detail that does hold: DTE supplies roughly 1.4 gigawatts from existing grid resources plus battery storage funded entirely by Oracle, residents secured a $14 million community benefits package, and DTE claims $300 million in savings for existing ratepayers. On the Ypsilanti Township side, the instrument is Resolution 2026-21, a six-month moratorium on large electric utility structures approved at the board's regular meeting of Aug 18 — WEMU reported it the 19th, so this desk's “Aug 19 the township passed” is a day off at the source. The Sept 9 town hall is confirmed for 5 to 7 p.m. at the Ann Arbor Marriott Ypsilanti, with Los Alamos representatives attending alongside U-M, which frames the facility as “a research computing center rather than a traditional data center.” The township's own document index carries no DTE response and no litigation filing: Ryan Lowry's Aug 19 line about reviewing the moratorium remains DTE's latest word, a week on. It does carry two items this desk has not been tracking — a June 24 letter from township attorney Douglas Winters on county commissioner pushback, and an Aug 13 “Grasso response to Congresswoman Dingell,” which is a federal-oversight thread on the Los Alamos connection worth pulling. One acreage discrepancy to flag rather than assert: the township logs the March 18 land purchase as 124 acres against the 144 this desk has carried. The politics moved sharply. Senate nominee Mike Rogers has reversed to support a statewide data-centre moratorium, per reporting by The Lever, after disclosures that he holds millions in AI investments — which collides with both the Ypsilanti thread and his own campaign messaging, and means the position this desk carried is out of date. Representative Tom Barrett is repositioning similarly despite having voted for the 2025 tax bill that gave data centres their benefits; Genoa Township extended its moratorium six months for noise studies; Mason City Council approved “Mason Connect” with a Sept 14 town hall. And the Democratic answer to the Cook toss-up rating and $45 million in outside spending behind Rogers has arrived in the form of two polls, neither showing him ahead: Susquehanna has Abdul El-Sayed 46 to Rogers 39 among 800 likely voters fielded Aug 11–17, with independents breaking 46–24 for El-Sayed; AARP Michigan has it 48–47, with under-50 voters going El-Sayed by 14 and voters over 50 going Rogers by 9. On campus, the incoming president has a date: the Board of Regents votes formally Sept 1 at 11 a.m., and C. Cybele Raver starts Dec 1. Regents chair Michael Behm: “Dr. Raver has a proven record of building strong teams, expanding research excellence, and strengthening every institution she has served.” Still no day-of coverage of how Wolverine Village move-in actually went, and nobody has confirmed that any student was displaced into temporary dorms — ClickOnDetroit's note about “uncertainty earlier this week over whether construction would be completed in time” remains the ceiling of what is verifiable, and the Michigan Daily's report cannot be checked because the site is robots-blocked. The Bridge item most worth Sveta's own attention is Robin Erb's Monday piece on the Galleri multi-cancer blood test, which asks whether finding cancers earlier is worth $100 billion — a screening cost-effectiveness question with a price tag already attached to it.",
        s: [["Bridge Michigan (Galleri, $100B)","https://bridgemi.com/michigan-health-watch/blood-test-can-find-cancers-save-michigan-lives-is-that-worth-100b/"],["Michigan Advance (Rogers reversal)","https://michiganadvance.com/2026/08/24/michigan-data-centers-the-weekly-download-4/"],["U-M Record (Raver named)","https://record.umich.edu/articles/u-m-board-of-regents-names-dr-c-cybele-raver-as-choice-for-17th-president/"],["Bridge Michigan (data centres and the governor's race)","https://bridgemi.com/michigan-government/where-michigan-governor-candidates-stand-on-data-centers-the-environment/"]] },
      { t: "A new visa fee arrived that exempts universities, a peer institution banned classroom technology outright, and the litigation everyone is watching has not moved. The H-1B proposal is the fresh item: $103,265 per new petition on top of existing fees, after a federal court struck down the earlier $100,000 version, with a 30-day comment period and projected revenue around $3 billion — and, unlike the version that was struck down, universities, nonprofit research institutions and national labs are exempt. Zuzana Wootson of the Presidents' Alliance, which is lead plaintiff in the duration-of-status case, makes the connection: “International students do not choose where to study based on the classroom experience alone. They also consider whether they will have a meaningful opportunity to apply their education after graduation.” On the case itself, Judge Saylor has issued no order and none has been reported; the Aug 31 DHS response deadline and Sept 3 hearing are not confirmed by any reachable source. What did arrive is the declarations, and two details revise this desk's account. The filing is fifteen institutions plus the University of California system, not fifteen in total; and the sharpest line in it is from Susan-Ellis Dougherty at Maryland: “Forcing undergraduates to remain frozen in an initial major chosen prior to matriculation destroys their academic autonomy” — which is the clause that bites on any department students transfer into after arriving, economics very much included. Also new: Maryland Baltimore additionally risks Carnegie R-1 status, which requires 70 doctorates awarded annually. Illinois chancellor Charles Isbell: “These activities are being undertaken solely because of the challenged rule.” Boston University provost Colin Duckett: “Changes to the structure of Boston University's academic programs are costly and burdensome to implement.” No institutional or association response to the CPT reinterpretation has surfaced anywhere — no NAFSA, ACE or AAU statement — so that thread has not moved publicly since the broadcast message. The accreditation fight gained a calendar and a vocabulary: the step against the ABA is a staff report recommending its legal-education council lose federal recognition, NACIQI reviews it next month, and under secretary Nicholas Kent then decides, with appeal and litigation available afterwards. Thirteen independent law schools would need new accreditors to keep federal student aid. Assistant secretary David Barker: “Accreditation operates like a cartel. When there's no competition, accreditors inject their political preferences into their work.” Council chair Justice Melissa Hart: “The Council complies with the Higher Education Act and Department requirements. We look forward to addressing misconceptions at our hearing.” The Houston cut has a shape now — the core went from 241 options to 144, about 40%, effective for students starting this fall, driven by Texas Senate Bill 37, and the courses losing gen-ed status include Entrepreneurship, Business Law and Ethics and Tourism alongside the humanities offerings that drew the coverage, which makes it a social-science contraction as much as a humanities one. The UH AAUP chapter says administrators are “interpreting SB37 expansively in ways that go well beyond what the statute's text requires.” Alabama's post-tenure review covers all tenured faculty “at least once every five years” under House Bill 580; chancellor Sid Trant defends advisory-only senates as “a long-standing practice,” and notably Alabama did not dissolve its senates, unlike Auburn and Jacksonville State. Two corrections to Monday's item on academic integrity: Andrew Peck is Penn State's inaugural assistant dean for academic integrity, and the change is that all fourteen University College campuses adopt a centralised model of adjudication rather than councils being dissolved outright; and the Cornell figure is “more than half” of pilot-phase violations being AI-related, not about half. The genuinely new integrity story is Chicago's. Effective this fall, the undergraduate social-sciences core sequences ban all classroom technology, AI assistance on coursework, in-class recording and wearable AI devices — and constrain faculty too, requiring careful assessment and disclosure before generative AI is used in grading. Jenny Trinitapoli, who leads the undergraduate social-sciences division, says the policy will “afford students the freedom to think for themselves, to listen to one another without the cacophony of other (disembodied and non-human) voices”; historian Aaron Jakes describes “relief and jubilation”; political scientist Paul Staniland calls it “common sense.” For the classroom itself, the best find this week is by an economist, for an economics lecture. Theodore Koutmeridis, senior lecturer in economics at Glasgow, gives over the first twenty minutes of a two-hour lecture to a debate on a current topic connected to that day's material. The mechanics are what make it work: the topic is chosen jointly with students and posted online beforehand, so preparation is possible but voluntary; students speak as they are ready rather than being called on; he participates himself, offering his own view and asking follow-ups rather than moderating from outside; and there is no assessment attached, which removes the free-riding problem that kills graded participation in a large room. One student's verdict was that it “allowed me to feel less like a number and more like a person.” Pair it with Joshua Fullard's team recap at Warwick — the last ten minutes of each seminar, teams of no more than five with a whiteboard, thirty seconds of silent individual thinking then sixty seconds of team discussion, sequential reveals, points for the explanation as well as the answer, and a scoreboard carried across weeks. The thirty-sixty split is the load-bearing detail: individual commitment before group talk is what stops one confident student answering for the table. And for the AI question, B. Jean Mandernach of Grand Canyon reframes it as verification rather than detection, with one method that actually scales to a large course — a short written reflection on reasoning and decisions, built in as a required final component of the assignment rather than added reactively when something looks wrong.",
        s: [["Inside Higher Ed (H-1B fee)","https://www.insidehighered.com/news/quick-takes/2026/08/25/trump-administration-proposes-new-h-1b-visa-fee"],["Inside Higher Ed (visa declarations)","https://www.insidehighered.com/news/global/international-students-us/2026/08/24/international-student-rule-already-spurring"],["Chronicle (Chicago bans tech and AI)","https://www.chronicle.com/article/u-of-chicagos-social-sciences-division-bans-tech-ai-in-core-courses"],["THE Campus (Koutmeridis, Democracy Lab)","https://www.timeshighereducation.com/campus/democracy-lab-how-20-minutes-debate-can-revive-lecture"]] },
      { t: "Mind & cosmos: a spin liquid that is not quite a spin liquid, a Rydberg vapour that learns better near a phase transition, a framework paper on the brain that admits its own arbitrariness, and a trial date that needs correcting before someone cites it as new. In Physical Review Letters, DinhDuy Vu and Dominik Kufel of Harvard, with Jack Kemp (Harvard and the Cavendish), Lode Pollet (LMU Munich), Chris Laumann (Boston University and the Max Planck Institute for the Physics of Complex Systems) and Norman Yao (Harvard), extend approximately-symmetric neural quantum states to real-time evolution and simulate dynamical state preparation in systems of up to 384 atoms on the ruby lattice. The prepared state “shows spin-liquid properties extending over half the system size, with a topological entanglement entropy plateauing close to γ = ln 2.” The framing is itself the caveat, and they state it: the interest is in preparing a state with quantum-spin-liquid correlations “even when the ground-state phase diagram does not exhibit such a topological phase,” and “understanding the microscopic nature of such quantum spin ‘lake’ states and their relationship to equilibrium spin-liquid order remains an essential question.” Half-system-size correlations, not a demonstrated topological phase. In Nature Communications, a Shanxi University group with Tübingen and Nottingham collaborators — Zongkai Liu, Qiming Ren, Chris Nill, Albert Cabot, Igor Lesanovsky and Linjie Zhang among them — feed time-series data into a Rydberg atomic vapour through modulated laser fields and report that “close to a non-equilibrium phase transition, where collective effects are amplified, the capability of the system to learn the input becomes enhanced,” demonstrated on Lorenz-series and temperature data. Read it as a mechanism claim: the rendered version publishes no atom counts, no prediction-accuracy figures and no error metrics. In hardware, Japan's first operational full-stack neutral-atom machine came online at the Institute for Molecular Science with Hitachi and Infleqtion — named Shibukawa, about fifty qubits now, five hundred planned near-term and ten thousand physical qubits with error correction targeted by March 2031. Project lead Kenji Ohmori: “Neutral atom-based quantum computers have recently been rapidly attracting attention around the world as a new modality that could exceed the limits of the superconducting modality.” No gate fidelities or benchmarks are published, so it is an announcement rather than a result — the same discount this desk applied to Brookhaven and Quantum X Labs on Monday. EuroHPC separately opened €119 million across six quantum calls, including €20 million each for trapped-ion, superconducting and neutral-atom platforms, closing Nov 17. On the mind side Quanta ended its silence with a piece on a Nature Reviews Neuroscience framework paper by Lisa Feldman Barrett of Northeastern and Earl Miller of MIT, proposing categorisation and compression as the brain's organising operation. Barrett: “A category is an event in which different things are treated as similar or equivalent in a particular situation.” Miller on why: “Your brain has to constantly make predictions about what's going to happen in the next few seconds because it's got to filter out most of the incoming sensory information.” The supporting number is that within visual cortex roughly 90% of synaptic connections carry feedback rather than incoming sensory signal. Their limitation is unusually candid and worth quoting for a methods seminar — choosing the limbic core as the loop's starting point is admittedly arbitrary, other regions could have served, and Barrett says so plainly: “For the sake of having a scientific discussion, you have to say, ‘I'm going to pick this point as the start.’” The psychedelics beat is thin this week, with one qualitative study: Yula Milshteyn and Moshe Bensimon at Bar-Ilan interviewed 27 Israeli rave attendees, mean age 38, on preparation for and consequences of psychedelic use at rave parties, concluding participants “return to their normal life, yet with changes in physical, emotional, cognitive, and social aspects.” Their own stated limits are extensive: small self-selected sample, predominantly male, doses not recorded, and no objective psychological or cognitive measures collected at all. One date correction that matters more than any of the above, because the paper is negative and a stale date would invert it: the JAMA Psychiatry EPISODE trial of psilocybin in treatment-resistant depression ranks near the top of current searches and was published online March 18, 2026, not this month. It randomised 144 and analysed 142; response at six weeks was 17.0% on 25 mg against 12.5% on 5 mg and 10.6% on nicotinamide, an adjusted odds ratio of 1.73 with a confidence interval from 0.53 to 6.23 and a p-value of .19; adverse events occurred in 100% of the 25 mg arm, suicidal ideation in six participants on dosing day, and two serious adverse reactions including one case of HPPD. The authors call it inconclusive. Keep it distinct from Rucker's UK trial of Aug 6, which is positive — a week-three MADRS difference of −10.41 with a Cohen's d of −1.70 — and whose most striking self-reported limitation is that all psilocybin recipients and 70% of placebo recipients correctly guessed their allocation. On the contemplative shelf, Tricycle has Liv Arnold on Bangkok's Death Awareness Cafe, founded in 2018 by the Buddhist philosopher Veeranut Rojanaprapa, where four interactive exhibits — Birth, Elder, Pain, Death — have visitors crawl through a simulated womb, wear ageing simulation gear, visit a mock ICU and lie in a coffin; a receptionist supplies the thesis, “When you're aware of your own death, you do better.” And Wat Phra Mahathat Woramahawihan in Nakhon Si Thammarat has become the first UNESCO World Heritage Site in southern Thailand and the country's ninth — an eighth-century monastery with a 78-metre main stupa on a 5.14-hectare site, inscribed after fourteen years on the tentative list, cited for a fusion of Hindu, Mahayana and Theravada architecture drawn from South Asia, Central Java, Sri Lanka and Myanmar.",
        s: [["PRL (quantum spin lakes)","https://journals.aps.org/prl/abstract/10.1103/7dnl-6kg2"],["Quanta (categorisation and compression)","https://www.quantamagazine.org/a-new-framework-for-how-the-brain-compresses-our-noisy-world-20260824/"],["The Quantum Insider (Shibukawa)","https://thequantuminsider.com/2026/08/24/japans-full-stack-neutral-atom-quantum-computer-is-operational/"],["Tricycle (Death Awareness Cafe)","https://tricycle.org/article/bangkok-death-awareness-cafe/"]] },
      { t: "Director watch: the Lynch weekender has grown a cast list, von Trier's screenplay is due this month, and Noé and Refn are both clean negatives. The Gathering of the Angels at the Genesis Cinema in Whitechapel on Sept 26–27 has added performers rather than more crew — Harry Goaz (Deputy Andy), Ian Buchanan (Dick Tremayne), George Griffith (Ray Monroe from The Return) and executive producer Sabrina Sutherland, alongside a DJ Yoda set, The Double R Club's live cabaret, a live owl demonstration with a falconer, and screenings of Fire Walk With Me and Blue Velvet. One correction to this desk's account: Duwayne Dunham and Gary D'Amico are appearing as online panellists, not in person. Nothing on the Lynch estate in the window, and the recirculators to keep discarding now include a March 2026 TMZ piece on the estate passing to his children and the $13 million sale of the Hollywood Hills compound. On von Trier, no movement since Aug 9, but one detail from that report is a live checkpoint rather than background: Peter Aalbæk Jensen said the screenplay for After — framed as von Trier's fifteenth and final film — “is supposed to be completed this month,” which makes early September the moment to look again. Noé remains nothing at all, and this time the only 2026-dated item anywhere was a June appearance alongside Refn at Il Cinema in Piazza in Rome, which is a public engagement and not a project; MUBI's untitled placeholder and IndieWire's undated kids-movie piece still rank first on any search. Refn is likewise quiet since the May announcement, though two facts fill it out: Goodfellas is handling sales alongside MUBI's full financing, and the Maniac Cop revival was announced immediately after the Cannes 2026 premiere of Her Private Hell. January 2027 in Los Angeles stands. Criterion has published its November slate — Wild at Heart in 4K and Shadows of Forgotten Ancestors on Nov 17, Shoot the Piano Player, Marie Antoinette and Blue Heron on Nov 10, Harold and Maude and KPop Demon Hunters on Nov 3, The Right Stuff on Nov 24 — and nothing past Nov 24, so the December slate is still expected around Sept 15. Today Criterion releases Barbara Kopple's Harlan County USA and American Dream. Venice, re-verified, still contains none of the four across the lineup and all nineteen Classics restorations. In the art world the Vienna Bernini finally has a date and an argument. The Portrait of an Old Man goes on view in “Bernini: Painter and Sculptor” at the Kunsthistorisches Museum's Palais Lobkowitz from Dec 2 to Apr 4, hung alongside the Uffizi self-portrait and a Royal Collection drawing. Curator Gudrun Swoboda's case rests on the garment, collar and hairstyle matching Rome fashions around 1670, a mouth showing “a sense of the sculptural,” handling that resembles building up a face in clay in short strokes, and stylistic parallels with a self-portrait drawing of 1675–80; scientific examination confirms two different hands, with a collaborator, possibly a son, painting the lower portion. The sitter may be Mario Chigi, brother of Alexander VII and Bernini's late patron. The Messina theft has produced no recovery, arrest or investigation news — coverage still clusters on Aug 15–17, and note that mainstream outlets consistently report “four paintings stolen,” which is the net figure after two of the five taken were abandoned outside the building. The Smithsonian's Latino museum question comes to a head Aug 31, when the board of regents meets on finalising the Arts and Industries Building on the National Mall — a building the institution already owns, which would bypass congressional approval. Built in 1881 by Adolf Cluss and Paul Schulze, host of President Garfield's inaugural ball and the second-oldest building on the Mall, it has been closed to the public since 2004 and closes again Sept 7 for renovation. Mike Gonzalez, writing against it, calls this “a loophole to sneak in a building for a yet-to-be-built controversial museum”; the Smithsonian did not comment. Two further items from Monday. Ruth Mackenzie has been appointed parliamentary under-secretary for the arts at DCMS, overseeing museums, libraries and cultural property and the sponsorship of Arts Council England — made a peer in July and appointed by Prime Minister Andy Burnham, previously director of arts at the British Council, Cultural Olympiad director for London 2012 and artistic director of the Théâtre du Châtelet. And Rita Flores of Pussy Riot says Russia's FSB tried to recruit her against dissident artists from 2023: “It was just like in the movies: we sat down at the table, and I wasn't allowed to move or look away… They started trying to recruit me, resorting to all sorts of threats and mockery, saying truly nasty things, threatening to kill my family.” She alleges she was offered roughly three million rubles, about $36,000, to lure Pussy Riot founder Pyotr Verzilov to Serbia. She has left Russia. One practical note for anyone who consigns work: after the collapses of Stephen Friedman, Arusha and Simon Lee, Petra Warrington of Wedlake Bell advises that consignors “contact the liquidators as soon as possible, assert their ownership rights and provide evidence of title,” and that agreements “should clearly identify the works and state that title remains with the consignor, with the gallery acting as agent” — because “the more transactions an artwork goes through, the harder it is for everybody to get back to the correct position.”",
        s: [["Time Out (Lynch weekender guests)","https://www.timeout.com/london/news/david-lynch-weekender-london-september-081226"],["World of Reel (von Trier screenplay)","https://www.worldofreel.com/blog/2026/8/9/lars-von-trier-almost-finished-screenplay-for-his-final-film"],["The Art Newspaper (Bernini unveiling date)","https://www.theartnewspaper.com/2026/08/20/newly-discovered-bernini-painting-to-be-unveiled-at-vienna-museum"],["The Art Newspaper (Smithsonian Latino museum)","https://www.theartnewspaper.com/2026/08/21/smithsonian-institution-latino-museum-arts-industries-building-washington"]] }
    ]}
