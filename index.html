<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "Correction, and it is the largest this desk has had to make: yesterday’s “six injured, 165 evacuated” near Kyiv was, by the end of Saturday, thirty-seven people dead — twenty of them residents of a care home. The strike hit the village of Myla in the Bucha district, about five kilometres west of Kyiv, and the toll moved through the day in a way that is itself the lesson. Kyiv Oblast governor Tymur Tkachenko gave “at least 27 killed” around 11:30 in the morning; by the early afternoon President Zelensky confirmed thirty-seven killed and forty-two injured, four of them children. Meduza reports that twenty of the thirty-seven were residents of a nearby care home for elderly and disabled people. About fifty residential buildings were damaged and roughly four hundred people evacuated, against the 165 this desk published yesterday. Among the dead is Taras Didych, head of the Dmytrivka community, killed while helping with the rescue. The Kyiv-Chop highway was closed between kilometres 15 and 32, and Sunday was declared a day of mourning in the Kyiv region. Note that the URL slug on the Kyiv Independent’s own story still carries “at least 27” — the number frozen at the moment of first filing — which is the clearest demonstration this desk has yet had of why a toll must never be taken from a slug. The second half of the story is the one that will be argued about. What detonated was an ammunition store, and the Ukrainian state is now investigating itself over it: prosecutors opened a pre-trial investigation under Article 367 of the criminal code, official negligence, concerning the storage and permitting of explosive materials. Zelensky: “There are regulations: ammunition cannot be stored near houses or other residential buildings,” and “those who allowed this must certainly bear responsibility for their decisions.” Serhii Koretskyi — whose title this desk still cannot verify and therefore does not state, having flagged the same problem yesterday — said that “on the fifth year of the full-scale invasion, making the same mistakes is criminal negligence,” and demanded “severe punishment.” Against that, Russia’s account is not that it missed. The Ministry of Defence, via TASS, presents Myla (rendered “Milaya”) as a deliberate and legitimate target — “an ammunition depot with FP-1/FP-2 drone components and launch boosters” — inside a wider overnight campaign it says also hit a Fim Service logistics centre at Chaiki said to hold Flamingo cruise-missile components, the port of Izmail, the port of Nikolayev and a customs terminal at Kalinovka for Western military cargo. So the two sides agree on what was in the building and disagree on everything that follows from it, and a Ukrainian prosecutor’s office has taken a position closer to Moscow’s on the narrow question of whether the ammunition should have been there. Both framings belong in the record; neither settles the other.",
        s: [["Kyiv Independent (the strike, updated through Saturday)","https://kyivindependent.com/russian-strike-near-kyiv-causes-ammunition-detonations-killing-at-least-27/"],["Meduza (37 killed; 20 were care-home residents)","https://meduza.io/en/feature/2026/08/29/at-least-37-killed-after-russian-strike-hits-an-ammunition-warehouse-near-kyiv-triggering-massive-explosions-many-of-the-victims-were-residents-of-a-nearby-care-home"],["TASS (the Russian MoD’s target list, incl. “Milaya”)","https://tass.com/defense/2179247"],["Kyiv Post (ISW, Aug 29 assessment)","https://www.kyivpost.com/post/83358"]] },
      { t: "Kyiv spent a third straight day under continuous air-raid alert, both sides published drone tallies for once, and Ukraine put a refinery near St Petersburg on fire. Take the numbers carefully, because they measure different things and must not be merged. Ukraine’s Air Force reports 233 Russian drones downed overnight Aug 28–29, then 224 launched between 6:30 a.m. and 6 p.m. on Saturday of which 199 were downed or suppressed by six in the evening, with up to ten still airborne at 6:20 p.m. No missile figures accompany them — the Air Force has still not resumed publishing ballistic-missile interception counts, and this desk prints that absence rather than filling it. Separately, Russia’s Ministry of Defence claims 313 Ukrainian fixed-wing drones intercepted overnight across Belgorod, Bryansk, Voronezh, Kaluga, Kursk, Lipetsk, Rostov, Tula, Moscow, Krasnodar, Crimea and Tatarstan plus the Sea of Azov and Black Sea. Those are a launched figure, a downed figure and a claimed-intercept figure from three different institutions; none is a check on the others. Beyond Myla, a fourteen-year-old girl was killed in the Boryspil district and a two-year-old girl in Kyiv’s Obolonskyi district with eight injured, and the attacks continued into Sunday morning with a residential building struck on floors two to five in Obolonskyi. Agriculture minister Taras Vysotskyi supplies the economic figure of the week: “Russian strikes have destroyed 90% of Ukraine’s modern storage facilities.” In the other direction, Ukrainian drones set fire to the Kirishi Petroleum Organic Synthesis refinery in Leningrad Oblast — one of Russia’s largest, and under Western sanctions — with governor Aleksandr Drozdenko saying “a drone crash has been reported in the vicinity of a refinery in the Kirishi district, resulting in a fire” and that “42 drones were shot down over the region.” An airbase at Yeysk in Krasnodar Krai was also reportedly targeted. ISW’s Aug 29 assessment, published Sunday morning as Kyiv Post 83358 — the ID band running exactly as predicted from 83304 — characterises the whole of Aug 28–29 as a single twenty-eight-hour combined drone and missile campaign against Kyiv city and oblast, says it was designed to “maximize civilian damage and disrupt daily civilian functions,” and reports Ukrainian gains in the Dobropillya direction, which is a new axis distinct from the Kostyantynivka advances it reported the day before. Zelensky, for his part, has ordered the military to launch a thousand drones a day at Russia. Set that beside Meduza’s Bloomberg-sourced count of twenty-one refinery attacks in August and refining throughput at a twenty-year low, and the shape of the autumn is legible: both sides are now targeting the other’s economic plant at scale, and Ukraine’s storage and Russia’s refining are the two capital stocks being consumed.",
        s: [["Kyiv Independent (199 of 224 downed; third day of alerts)","https://kyivindependent.com/ukraine-says-it-downed-more-than-200-drones-as-rare-days-long-air-raid-alerts-stretch-into-third-morning/"],["Kyiv Independent (Kirishi refinery and Yeysk airbase struck)","https://kyivindependent.com/major-oil-refinery-airbase-targeted-by-ukrainian-forces-in-reported-strikes-across-russia/"],["TASS (Russian MoD: 313 drones intercepted overnight)","https://tass.com/defense/2179229"],["Meduza (Zelensky orders 1,000 drones a day)","https://meduza.io/en/news/2026/08/28/zelensky-orders-ukraine-s-military-to-launch-1-000-drones-a-day-at-russia"]] },
      { t: "The Ratcliffe channel produced its first Ukrainian acknowledgement, and a purpose finally attached to the trip. Zelensky, in a statement early Saturday: “Today we received information from the American side about the meetings in Moscow that took place these past days.” He added, “I am grateful for the information and for the necessary tone of the conversation with Russia,” and “we value the coordination of steps and the fact that America is advancing a quite realistic vision of what needs to be done.” That is Kyiv confirming it was briefed, which is a different fact from what was said in Moscow — and on the latter the Washington Post, via Meduza, now gives a purpose: that Ratcliffe went to warn Russian officials the Iran conflict has not weakened American capacity, and that a major escalation in Ukraine “would only push Trump toward Zelensky.” Note that four theories are now in print from four outlets — the Post’s warning-against-exploiting-weakness, the Wall Street Journal and Politico’s warning-against-NATO-strikes, and the New York Times’s urging-peace-talks — and this desk is not going to adjudicate between them. What is settled is the meeting with SVR director Sergey Naryshkin, who described it as covering “issues that fall within the purview of intelligence services” and said “there’s nothing unusual about it”; a Putin meeting remains unconfirmed, and Peskov’s denial was always specific to the president. Against Zelensky’s warm reading, Peskov’s Friday line still stands unretracted: peace talks are on a “deep pause.” Witkoff and Kushner make ten consecutive days with nothing verifiable — the working US channel is the intelligence services, not the envoys, and that has now been true for a week and a half. Putin met Lukashenko at Novo-Ogaryovo on Saturday afternoon, formal talks followed by an informal conversation per Ushakov, with the opening open to the press — and no substantive readout has been published by any outlet this desk checked, which is worth saying plainly rather than assuming one exists. The week ahead is the busiest of Putin’s year. The SCO summit in Bishkek runs Aug 31 to Sept 1 with leaders of seventeen countries plus UN Secretary-General António Guterres; alongside the members are Aliyev, Pashinyan, Khurelsukh, Gnassingbé, Erdogan, Sisoulith, Vo Thi Anh Xuan and Hussein Issa. Ushakov confirms Putin will hold separate talks with both Pezeshkian and Xi; this desk could not verify the Monday-Tuesday split it published yesterday and withdraws it rather than repeat it. On the agenda: Ukraine and Middle East security, Afghanistan, India-China-Pakistan relations, an SCO development bank, transport corridors, and a Bishkek Declaration for the organisation’s twenty-fifth anniversary. Putin then flies to Vladivostok for the Eastern Economic Forum, Sept 1 to 4, with Ushakov trailing the Sept 3 plenary: “our president will deliver a major speech, as usual.”",

      { t: "Hormuz reached a thirtieth night without strikes inside Iran, a fourth incompatible traffic series appeared, and one of them printed an IRGC claim the others do not carry. GlobalSecurity’s log rolled forward to Day 183, Aug 29: the rial near 2,020,000 to the dollar against an official 1.5 million, inflation near 90% on the government’s own Statistical Center, and the pause in confirmed strikes inside Iran now at thirty nights, which answers yesterday’s open question. The corridor still has not opened and no vessel has transited. But the day-count problem has got worse rather than better. GlobalSecurity calls Aug 29 Day 183; global-energy-flow, carrying Windward’s data, calls the same day Day 182 — so the one-day offset persists exactly. A third live tracker, straits.live, calls it Day 181, cites a pre-crisis baseline of about 85 vessels a day, and carries an IRGC Navy statement this desk has seen nowhere else: that “the Strait of Hormuz is closed to all ships seeking passage without coordination with Iran,” contested by CENTCOM. And the pre-war baselines are now drifting: Windward’s page today reads about 110 vessels a day where it read about 130 on Friday, against GlobalSecurity’s 85. Four logs, three day-numbers and three baselines that cannot all be right — publish the spread and adjudicate none of it. Kpler via Reuters has not updated past Friday’s seven commodity vessels against a ten-day average of fifteen. Windward adds one thing worth having: a Goldman Sachs estimate that Gulf exports are back near 15 to 16 million barrels a day despite the low visible counts, which it attributes to dark-shuttle trade. On sanctions, SB0617 of Aug 28 remains the highest release number and OFAC’s latest recent action is still 20260828 — nothing new Saturday, and Bessent’s next move is still pending. Inside Iran the fuel story got a name and a blunter framing. Executive Vice President Mohammad-Jafar Ghaempanah: “Gasoline distribution is unfair, and continuing on this path is impossible,” and “domestic gasoline production is insufficient, and due to the U.S. naval blockade, we cannot import gasoline.” Pezeshkian says the government lacks the foreign currency to keep importing fuel, and Yasser Mirzaei of the Iran Energy Optimization Organization confirms a significant drawdown from national reserves this year. IranWire’s production and consumption figures are 115 million against 129 million litres a day — a fourteen-million shortfall against the fifteen million this desk carried from a different source, and both are published here rather than reconciled. On Gaza there is no advance on Mladenov’s Aug 28 warning that the situation “threatens a collapse of the ceasefire,” and the cumulative figures stand at 1,303 killed and 4,336 wounded since the October 2025 ceasefire and 73,438 killed since October 2023. Worth noting for the record that Mladenov made a separate and earlier warning on Aug 26 that Gaza was heading for a “point of no return,” so these are two statements, not one re-dated. Lebanon’s toll is unchanged at 4,350 killed and 12,310 wounded. From the benches, a quiet weekend: Diesen, Johnson, Mearsheimer, Sachs and Responsible Statecraft all published nothing after Friday, and all five are verified negatives.",

    { h: "Economy & markets", items: [
      { t: "The payroll benchmark revision this desk refused to publish a direction on is resolved, and it is down. The Bureau of Labor Statistics released USDL-26-1425 at ten o’clock Friday morning, and its own text reads: “The preliminary estimate of the Current Employment Statistics (CES) national benchmark revision to total nonfarm employment for March 2026 was -79,000 (-0.1 percent).” The private sector is -178,000, also downward. So the two same-day accounts that contradicted each other on Friday were not both defensible — the “upward, and the first since 2022” version was simply wrong, and it circulated without a figure attached, which in hindsight was the tell. Publishing the release and withholding the direction was the right call for one day; here is the number. It matters more than usual this year because it lands into a Fed that is arguing about a hike rather than a cut, and a downward revision to the level of employment is the one datum that cuts against the hawkish case Warsh made on Friday. On the symposium’s closing day, this desk can report the programme and must report an absence. Saturday’s session, chaired by Anil Kashyap of Chicago, ran Christine Parlour of Berkeley on “Financial Innovation and the Future of Banking” with Itay Goldstein of Pennsylvania discussing; Markus Brunnermeier of Princeton on “Financing Innovation” with Raghuram Rajan discussing; and a closing panel, “Financial Innovation: Considerations for Central Banking,” with Wenxin Du of Harvard, Arvind Krishnamurthy of Stanford and Jesús Fernández-Villaverde of Pennsylvania. The papers themselves are not yet retrievable — the Kansas City Fed’s page links them through elements an automated reader cannot follow, and no outlet had published substantive coverage of an academic paper session by Sunday morning. That is a genuine absence rather than a failure to look, and the papers are worth returning to next week. What did surface is Kenneth Rogoff, speaking from the sidelines on Friday rather than from his lunch address, and he is worth quoting because he is arguing about the fiscal side while everyone else argues about the rate: “I think we will have some kind of debt crisis, financial repression, inflation, maybe something more dramatic,” and “the biggest threat over the next 5 to 10 years is from the inside, that we just aren’t prepared to balance our budget” — a deficit at six to seven per cent of GDP in peacetime with no coalition to close it. On pricing, nothing has moved that can be cleanly measured over a weekend, and this desk will not manufacture movement. Polymarket’s September contract reads 55% no change against 44% for a twenty-five-basis-point hike on $64.8m of volume, which sits below Friday’s 56 to 59% CME reading — but the page timestamps itself to the contract’s resolution date rather than to now, so treat it as a live quote of unknown vintage rather than as evidence of a weekend fade. The next FOMC is Sept 15 and 16. This week’s calendar is heavy and ends with the August employment report: ISM manufacturing, construction spending and JOLTS on Tuesday; ADP, factory orders and the Beige Book on Wednesday; the trade balance, claims and ISM services on Thursday; payrolls, unemployment and average hourly earnings on Friday.",

      { t: "Russia closed the diesel carve-out rather than let it open, which answers the question this desk has been holding for a week — and it did it on a Saturday. The mechanics were widely misreported all month, so state them precisely. Russia’s July 30 package bans gasoline exports and bans diesel exports by non-producing traders through Jan 31, 2027. What was set to lapse on Aug 31 was the narrower ban on diesel exports by the refineries themselves, meaning producers would have regained the right to export diesel from Sept 1 inside an otherwise-standing prohibition. On Saturday the government extended that producer ban to Sept 30. So the carve-out does not open, the stated rationale is stabilising the domestic fuel market, and the immediate cause is the drone campaign against refining capacity — twenty-one attacks in August, throughput near 3.8 million barrels a day against a normal 5.3 to 5.5 million. Read the two together and the policy is legible: with capacity down about a fifth, the government has chosen to hold barrels at home and accept the lost export revenue rather than let the domestic price find the world price. Ukraine is destroying the plant; the Russian state is rationing what is left by closing the export door. The currency did what the Bank of Russia’s calendar says it should. The fixing set from Aug 29 is USD ₽85.6007, EUR ₽99.6820, CNY ₽12.7335, unchanged from Friday’s and verified rather than assumed — the CBR publishes on business days, so this rate carries the weekend and should hold through Monday, with Tuesday’s the next real print. The key rate is 14.00% and the next board meeting is Sept 11. Tuesday is also when the digital ruble goes live under Federal Law 248-FZ, and the Bank of Russia’s own page is worth reading against the version circulating in commentary: mandatory acceptance from Sept 1, 2026 for major-bank clients and retailers above ₽120m in annual revenue; from Sept 1, 2027 for banks with universal licences and retailers above ₽30m; and from Sept 1, 2028 for all remaining banks and retailers — which is to say everyone under ₽30m, not a ₽20m threshold as this desk published yesterday from secondary sourcing. Outlets under ₽5m are exempt entirely, individual transactions are fee-free, and consumer participation is voluntary. In markets proper there is nothing new: US equities, Treasuries and the VIX have not traded since Friday’s close, when the S&P 500 finished 7,711.76, the Nasdaq Composite 26,402.42, the Dow 53,559.99 and the Russell 2000 2,972.37. Bitcoin, which does trade, is up modestly — CoinDesk reads $78,141 at 1:26 a.m. Sunday and The Block $78,221 in the same window, so call it roughly $78,100 to $78,200 against Friday’s $77,000 to $77,900 close. And from VoxEU, dated Saturday and squarely on Sveta’s beat, Hakan Kara and Alp Şimşek on Türkiye: financial engineering is no substitute for interest rates.",
        s: [["Business Recorder (Russia extends the producer diesel-export ban to Sept 30)","https://www.brecorder.com/news/40437001/russia-extends-ban-on-diesel-exports-until-september-30"],["Bank of Russia (fixings set from Aug 29)","https://www.cbr.ru/eng/currency_base/daily/"],["Bank of Russia (the digital ruble rollout thresholds)","https://www.cbr.ru/eng/press/event/?id=25774"],["CoinDesk (bitcoin, Sunday 1:26 a.m. ET)","https://www.coindesk.com/price/bitcoin"]] }

    { h: "Health & policy", items: [
      { t: "The vaccine docket did not decay — it doubled overnight, on a weekend, and the asymmetry that makes it interesting held for a fifth day. The HHS request for information on the categories used in federal vaccine recommendations now shows 1,500 comments. The run is 256 on Aug 25, 504 on Aug 27, 652 on Aug 28, 720 on Aug 29 and 1,500 today: increments of +248, +148, +68, and then +780. This desk called the shape of a decaying pulse on Saturday and was wrong within twenty-four hours, which is worth saying rather than quietly restating. One caveat on the reading: both fetches of the Federal Register page fell inside the tool’s fifteen-minute cache, so this is one live read rather than two, and Monday should re-test it. The likely driver has broadened beyond the single Children’s Health Defense piece identified on Friday: a search of the mobilisation side now turns up several more call-to-action posts dated around Aug 25 across independent newsletters, all coaching readers to file. Against that, a targeted search for AMA or AAP activity on this docket returned nothing responsive for the fifth consecutive day — no member alerts, no campaigns, no releases. Fifteen hundred comments in six days on one side and institutional silence on the other is the finding; the composition is unobtainable, since regulations.gov renders only in JavaScript, and the count is the only observable. The H-1B fee docket, by contrast, is flat: 3,957 comments, identical to Friday, with the page stamping itself 10:15 p.m. Saturday — a clean weekend plateau against the +788 of the day before. On measles, a fourth and fifth test have now been run and the answer is settled: the CDC page did not refresh Thursday, Friday, Saturday or Sunday, and still reads as-of Aug 20 data with 2,777 confirmed cases, 47 jurisdictions plus sixteen among international visitors, 36 outbreaks and 94% outbreak-associated. The state, hospitalisation and death tables again rendered as empty shells, a fifth consecutive extraction failure rather than an absence, so Utah 518 and the 7% hospitalisation rate stay unconfirmed. But one genuinely new figure did render, and it is the most important number on the page: MMR coverage among American kindergartners “has decreased from 95.2% during the 2019–2020 school year to 92.4% in the 2025–2026 school year.” That is national coverage falling below the threshold measles requires, which is the mechanism underneath the case count rather than a consequence of it. On Ebola the ECDC has not published since Aug 28 and the figures stand: 5,794 cases and 2,786 deaths in the DRC, 843 hospitalised, 82.3% of contacts under follow-up, across 60 of 151 health zones, species Bundibugyo. The arithmetic checks exactly — 138 new cases and 71 new deaths, a 51.4% case fatality rate among the newly reported against a national 48.1%. A figure of “81 new confirmed cases and 42 deaths reported on August 27” also surfaced in one automated read and does not reconcile with that arithmetic; it is discarded as a misread rather than published. The province table again failed to render, so Ituri’s corrected 78.0% is still not restatable as current.",
        s: [["Federal Register (vaccine RFI docket, 1,500 comments)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["Federal Register (H-1B fee docket, flat at 3,957)","https://www.federalregister.gov/documents/2026/08/25/2026-17324/fee-for-certain-h-1b-petitions"],["CDC (measles data page: MMR kindergarten coverage 95.2% to 92.4%)","https://www.cdc.gov/measles/data-research/index.html"],["ECDC (DRC Ebola, data as of Aug 26)","https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda"]] },
      { t: "Monday is the stacked day, and two of its four items now have enough detail to read in advance. On drug pricing, the most-favoured-nation deals with mid-sized biotechs are still expected Monday, and the benchmark basket is confirmed as Canada, Denmark, France, Germany, Italy, Japan, Switzerland and the United Kingdom, benchmarked to net rather than list prices, with the administration projecting $64.3bn in government savings over ten years or $529bn including commercial spillover. The new detail is what is being offered to sign: reporting has the inducements including tariff relief and potential exemption from Medicare pilot discount programmes — which is the part worth watching, because it means the price concession is being bought with regulatory forbearance rather than paid for in cash, and forbearance does not appear in the savings estimate. Signatories are still unnamed; the opposition is named and now has a formal one, the Midsized Biotech Alliance of America, ten firms including Alkermes, Alnylam, BioMarin, Incyte, Madrigal and Travere. One unresolved detail: the count of prior large-company agreements is given as seventeen in one source and sixteen in another. Second, state annual reports under the $50bn Rural Health Transformation Program are due to CMS on Monday, and states are under no obligation to publish them — CMS will issue an annual summary and will not proactively release individual submissions. The allocations are worth having: a $100m annual floor per state plus a quality-scored bonus, producing first-year figures from $147m in New Jersey to $281m in Texas, against more than $900bn in anticipated Medicaid reductions. Maya Sandalow of the Bipartisan Policy Center: “transparency is really important to help protect the integrity of the program, ensure funds are reaching the communities they’re meant to serve.” Mississippi state senator Hob Bryan is blunter: “if they’re not up to something nefarious, why do they have to do it all in secret?” And Michael Cannon of Cato, from the other direction, says “no way” private investors “would let the recipients of those funds get away with the shoddy approach to transparency.” Third, STAT’s Unraveled series has published parts one and two and part three has still not appeared; Monday remains its likeliest slot. From Friday’s late filing, one item this desk missed and should have: the FDA cleared Juul’s Juul2 device with optional age-gating, an app authentication that unlocks the device. Chief executive K.C. Croswaite says the company plans “a portfolio of flavors — beyond tobacco and menthol — that are targeted to adult nicotine consumers.” The context is what makes it a case rather than a clearance: Juul has paid about $3bn settling government and private litigation over teenage use, is no longer the top-selling e-cigarette brand — Reynolds American’s Vuse is — and the teenagers have moved to unauthorised Chinese disposables that no age-gate touches. A firm voluntarily raising its own transaction cost, in a market where the unregulated fringe now holds the marginal buyer, is an unusually clean illustration of why compliance and market share can move in opposite directions. And from the NBER’s August digest, on Gangopadhyaya and Kaestner: among parents between 250% and 500% of the federal poverty line, “roughly three people took up publicly supported coverage for every one newly insured person.”",
        s: [["FiercePharma (the MFN deals expected Monday)","https://www.fiercepharma.com/pharma/trump-set-reveal-mfn-pricing-deal-mid-sized-companies-bloomberg"],["KFF Health News (rural health reports due Monday, publication optional)","https://kffhealthnews.org/rural-health/rural-health-transformation-program-transparency-50-billion-dollars-state-tracking/"],["STAT (FDA clears Juul2 with age-gating)","https://www.statnews.com/2026/08/28/juul-fda-clearance-updated-ecigarette-age-gating-technology/"],["NBER Digest (ACA crowd-out of employer coverage)","https://www.nber.org/digest/202608/crowd-out-employer-provided-health-insurance-affordable-care-act"]] }

    { h: "Campus & culture", items: [
      { t: "Michigan: the canvassers fight opened a second front in the legislature, and DTE’s silence in Ypsilanti Township reached thirteen days. The ballot-question litigation is now two-track. Americans for Citizen Voting Michigan and named plaintiff Fred Smith have a mandamus complaint at the Michigan Supreme Court arguing the Board of State Canvassers had a “clear legal duty” to certify the voter-identification and proof-of-citizenship petition, challenging the rejection of five notarized affidavits and raising due-process and equal-protection claims; the filing date is given as Aug 27 by the campaign’s own outlet and Aug 28 by Michigan Public and the NPR affiliates, and this desk flags rather than picks. The sharpest new number is the margin: the petition was rejected by three signatures, on a staff review of a 1,000-signature sample, against more than 700,000 collected. The court has been asked to rule by Tuesday and has not acted. The second front is legislative: House Resolution 350, adopted Aug 26, creates a Select Committee on the Rules and Procedures of the Board of State Canvassers — seven members, five Republicans and two Democrats, with subpoena power, chaired by Rep. Mike Harris of Waterford. A petition campaign losing at a bipartisan board by three signatures and simultaneously obtaining a partisan investigative committee with subpoena power is the kind of institutional two-step worth watching irrespective of the merits. On public power, the Ann Arbor dismissal has produced quotes from all three sides. Rudy Harper for the DTE-funded coalition: “Michigan law sets strict, clear rules for how ballot petitions must be gathered and filed, and we continue to believe those rules were not followed here.” City attorney Atleen Kaur: “we are pleased that the Court correctly recognized the Clerk’s canvass was compliant with the Home Rule City Act.” And Brian Geiringer of Ann Arbor for Public Power: “Ann Arbor residents want their electric bill payments to fund grid maintenance and renewable power, not corporate profits and baseless lawsuits.” The appeal is confirmed; the venue is not stated in any source and is therefore not stated here. In Ypsilanti Township the document page still carries nothing newer than Aug 19 and DTE has still said nothing — and the page carries a fourth resolution this desk had not catalogued, Resolution 2026-05 of Mar 31, whose filename reads “Data-Center-High-Value-Target-Risk,” alongside Resolution 2026-08 requesting a YCUA moratorium on data-centre services, the Aug 18 electric moratorium 2026-21, and the older siting resolution 2025-23. The Sept 9 town hall remains the next scheduled event. Elsewhere: the Ann Arbor Public Schools transgender-policy amendment carries one clause this desk clipped, since attorney Richard Landau’s warning was not only about $15m in federal funding but also that the district would be exposed “to potential Department of Justice civil litigation.” The U-M regents meet Tuesday at eleven to elect C. Cybele Raver, and the LSA proposal is properly called a grade-covering pilot — first-semester grades for first-year students shown as Pass or No-Credit on external transcripts while letter grades are retained internally, tentatively for fall 2027, with town halls this autumn, still no vote date and no approving body. Three verified negatives: no charges at Quality Behavioral Health, no advance on the RenCen benefits process before Tuesday’s second meeting, and no new Senate field work — RealClearPolling’s average line reads El-Sayed 46.3 to Rogers 44.5, but its poll table again rendered a single stale May entry, so the move off 45.7–45.0 is not confirmed.",
        s: [["Michigan Fair Elections (the mandamus complaint and House Resolution 350)","https://www.mifairelections.org/post/two-front-fight-citizen-voting-backers-hit-courts-and-capitol-within-72-hours"],["Michigan Advance (Washtenaw judge dismisses the DTE-funded complaint)","https://michiganadvance.com/2026/08/28/washtenaw-judge-tosses-complaint-against-ann-arbor-clerk-over-public-power-petition-signatures/"],["Ypsilanti Township (data centre documents)","https://ypsitownship.org/government/boards___commissions/board_of_trustees/data_center_information.php"],["U-M Record (the grade-covering pilot)","https://record.umich.edu/articles/lsa-explores-new-grade-covering-pilot-to-support-first-year-students/"]] },
      { t: "A fifth university has suspended course-credit CPT, it moved eleven days ago, and the sequence this desk published on Saturday is out of order. UC Davis suspended all applications for course-credit CPT on Aug 19 — “temporarily suspending, until further notice,” in its international office’s own words — citing new ICE guidance, risk to students’ immigration status, and protecting the university’s ability to host international students; degree-requirement CPT continues as normal, students holding I-20 documents issued before the suspension may proceed, and the office says it is consulting legal counsel. That places Davis between Irvine and USC, so the real order is Berkeley effective Aug 12 to 14, Irvine Aug 17, Davis Aug 19, USC announced Aug 25 and effective Aug 24, and Washington Aug 26. Three of the five are University of California campuses and the three UC moves are the first three, which strengthens rather than weakens the system-level-posture reading. A sixth mover circulates — a consultancy site implying UC San Diego has also paused — and could not be confirmed at UCSD’s own international office; it is reported here as unverified, and should not be conflated with UCSD’s separate appearance on the Defense Department’s audit list. On the association side, NAFSA’s own administration tracker is current through Aug 24 and carries nothing at all on CPT, the campus suspensions, or either SEVP broadcast. That is a plain absence, not a mystery. The Defense Department list is no longer secret, and it is stranger than the two confirmed names suggested. Inside Higher Ed published all thirty on Aug 27: Bryant, Cornell, Drake, Duke, Emory, Georgetown, Harvard, Illinois Institute of Technology, Johns Hopkins, MIT, NYU, Northeastern State University, Oklahoma State, Penn State, Portland State, Southern Illinois University–Carbondale, Stony Brook, Berkeley, UCLA, UC San Diego, Cincinnati, Delaware, Illinois Urbana-Champaign, Minnesota, North Carolina at Chapel Hill, South Carolina, USC, Texas at Austin, Virginia Tech and Worcester Polytechnic. The outlier is Northeastern State University in Tahlequah, Oklahoma — a small regional public in a list otherwise composed of research universities, single-sourced and worth a second look. Assistant Secretary for Science and Technology Joseph Jewell frames it as protection rather than suspicion: “universities are critical partners in executing a wide range of Department of War research programs, and the Department must therefore ensure that our research investments are well protected from foreign exploitation.” The AFT and AAUP have issued a joint statement raising profiling and academic-freedom concerns; not one of the thirty has commented, three days from Monday’s deadline. In NAFSA v. DHS — which is the challenge to ending duration of status for F and J holders, and is legally distinct from the CPT thread even though both flow from the same posture — the docket has not moved past the Aug 19 scheduling order. The government’s response is due Monday and the hearing is Sept 3 at eleven in Courtroom 1 before Judge Saylor. And for the classroom, a technique built for exactly Sveta’s course. Suzanne Bonner, K. K. Tang and Terence Yeo of the University of Queensland run a trading game for comparative advantage: students are split into villages with randomised endowments dealt as coloured cards — white for labour, yellow and green for natural resources, coloured pens for knowledge — and negotiate across an open room against a visible countdown to assemble redeemable combinations. It runs from thirty students to over a hundred using parallel simultaneous markets, at one or two facilitators per thirty to forty-five students, with tiered payoffs. Their own caution is the useful part: “the debrief is crucial in maximising the benefits from the game because it formalises the connections between the students’ experiences and the learning objective” — and they report that conceptual retention was stronger in smaller sessions than in the simplified large-class version, so the thing degrades as it scales.",
        s: [["UC Davis SISS (course-credit CPT suspended Aug 19)","https://siss.ucdavis.edu/news/federal-government-updates-international-students-and-scholars"],["Inside Higher Ed (the full thirty-university DOD audit list)","https://www.insidehighered.com/news/quick-takes/2026/08/27/dod-demands-30-american-colleges-audit-foreign-partnerships"],["Presidents’ Alliance (NAFSA v. DHS docket and schedule)","https://www.presidentsalliance.org/duration-of-status-litigation/"],["THE Campus (Bonner, Tang and Yeo’s trading game)","https://www.timeshighereducation.com/campus/it-takes-village-using-trading-game-teach-economics"]] },
      { t: "Mind & cosmos: Saturday was not the empty psychedelics day this desk reported, a quantum company’s stock doubled, and a paper on non-dual awareness turns out to have been sitting in the literature since January. Start with the correction, because it is a specific one. Yesterday this desk published a verified empty day across four psychedelics sources. It was not empty — it was in the wrong section. PsyPost’s psychopharmacology vertical, distinct from its psychedelics vertical, published on Aug 29: Bysiek and colleagues at the Polish Academy of Sciences and the Medical University of Warsaw, in Progress in Neuro-Psychopharmacology and Biological Psychiatry, gave two low doses of psilocybin a week apart to adult male rats subjected to chronic unpredictable mild stress. The drug reversed anhedonia on the sucrose-preference test, reduced anxiety-like behaviour, and increased hippocampal neurogenesis across proliferation, maturation and survival; BDNF messenger RNA rose in the hippocampus and prefrontal cortex within two hours of the first dose, and corticosterone normalised within two hours and remained lower at two weeks. The authors’ own limitations are the right ones: animals, messenger RNA rather than protein, and context-dependent behaviour. Psychedelic Alpha is still stalled — Field Notes at number four from Aug 21, Bulletins at 229 from Aug 7 — and PsyPost’s psychedelics vertical is genuinely quiet since Wednesday. In physics the journals ran, as on Friday, almost entirely to theory. Physical Review Letters volume 137 issue 9 carries Singh, Kessler and Barkai at Bar-Ilan on the nonanalytic transition in quantum-walk splitting probabilities, which is the fourth distinct Bar-Ilan item in circulation and must not be merged with the other three; Gjonbalaj, Sahay and Yelin on counterdiabatic shortcuts for preparing nonequilibrium states on Rydberg systems; and Dey, Banerjee and Huffman on the sign-problem landscape of a U(1) quantum link model. PRX Quantum adds Lu, Liu, Gopalakrishnan and You on holographic duality, and Lu, Zhao and Vallières on time-dependent Hamiltonians for microwave-driven Josephson circuits — all theory. The single experiment in the tranche is Ruckriegel, Adam, Bolt and colleagues on microwave spectroscopy of few-carrier states in bilayer graphene quantum dots, from Aug 24. And a correction this desk owes on its own reporting: the PRX Quantum “99.999% fidelity X-gates on present superconducting hardware” paper is analytical and numerical, and “on present superconducting hardware” describes the parameter regime rather than a machine anything was measured on. The quantum business news is, for once, a result rather than an announcement. Pasqal opened its first day on Nasdaq at $16.98, touched $20.10 and closed at $19.11 — up 95.2% against the SPAC’s prior close of $9.79, on about 3.7 million shares, valuing the deal near $2bn, before giving back about a tenth after hours. The company reported 2025 revenue of €16.5m and is unprofitable. Chief executive Wasiq Bokhari: “today is not a finish line; it is an acceleration point.” Two more funding items — New Mexico matching DARPA benchmarking money and California’s $9.7m for a southern quantum workforce network — are money rather than results and are labelled as such. In consciousness, Essentia published David E. Lloyd on Aug 28 proposing consciousness as a structured resonance between thought, modelled as linear and radiative, and emotion, modelled as circular and field-like, extended to a cosmic-scale teleology; it is not a Buddhist or Advaita argument. Lion’s Roar — whose feed, unlike its homepage, does carry per-article dates, which is a useful discovery — ran Gayathri Narayanan on Aug 28 relating metta to Advaita Vedanta from the author’s own roots in it. And a find worth flagging despite being eight months old, because it appears never to have surfaced here: Kiana Ward of Amherst, in Neuroscience of Consciousness, models non-dual awareness via constraint closure as “a shift from decoupled to precarious constraints,” engaging Nāgārjuna on emptiness and dependent origination and explicitly with mahāmudrā, dzogchen and rigpa. It is dated Jan 20, 2026 and is offered as reading rather than news.",
        s: [["PsyPost (psilocybin, hippocampal neurogenesis and chronic stress in rats)","https://www.psypost.org/psilocybin-reverses-depressive-behaviors-and-restores-brain-cell-growth-in-stres/"],["The Quantum Insider (Pasqal closes its first Nasdaq session up 95%)","https://thequantuminsider.com/2026/08/29/pasqal-shares-nearly-double-in-nasdaq-debut/"],["Essentia Foundation (Lloyd on consciousness as structured resonance)","https://www.essentiafoundation.org/consciousness-and-world-as-structured-resonance/reading/"],["Neuroscience of Consciousness (Ward on non-dual awareness and constraint closure)","https://academic.oup.com/nc/article/2026/1/niaf068/8431344"]] },
      { t: "The daily deaths check found a photographer, the Lynch ticket page contradicted its own homepage, and thieves took a $4.6m necklace out of a Vienna museum in the afternoon. Franco Fontana died on Aug 29 in Modena, aged 92 — the Italian who made colour a formal subject rather than a description, flattening Emilian fields into planes of saturated colour from the 1960s onward, showing in more than four hundred solo exhibitions and holding work in over fifty museums, and who worked for Vogue America but declined to move to New York. His own formulation is the one to keep: photography “should not document reality, but interpret it.” Confirmed across four Italian and international outlets. Separately, and outside the artistic category but too large to omit, King Harald V of Norway died Aug 28 aged 89 after thirty-five years on the throne, succeeded by King Haakon VIII. One false alarm worth recording so it does not recur: an Artnet obituary of David Hockney ranks high on current queries and is dated Jun 12, 2026, more than two months old — checked and rejected. On the director watch the standing scoop reaches day eight with still no press pickup, and it has acquired an internal contradiction. The homepage banner is unchanged — “due to unforeseeable circumstances, a gathering of the angels 2026 has been postponed to 2027… our new dates will be announced soon” — with the navigation still stripped to Home, Previous Events and About Us and no Tickets link anywhere. But the orphaned tickets URL, which returned a provenance error twice on Saturday and which this desk therefore refused to re-assert, fetched cleanly today, and it is still selling: general admission at £99.50, a weekend at £180, VIP at £310, a Buy Tickets button and a reference to the 2026 schedule, with no postponement notice on the page at all. The TicketTailor checkout behind it returns a 404. So a site whose front page says the event is postponed to 2027 has a live-looking sales page one click away, and six outlets are still advertising Sept 26 and 27 as live. There are still no 2027 dates. On von Trier, tomorrow is the deadline and nothing has moved: producer Peter Aalbæk Jensen’s line stands in the original Danish on Ekko’s page — that before the summer break he heard Lars might, with a bit of luck, have the screenplay written around August — alongside Skarsgård’s “jeg ville gøre det. Jeg ville sige ja til ham — hvad end han bad om,” and Jensen’s estimate that at least two more years will pass before there is a finished film. Ekko’s article page renders Aug 5 against the index’s Aug 14, and this desk continues to flag rather than pick. Noé is a plain negative on a tenth check. Refn still has no cast for Maniac Cop, and Cineuropa’s own wording is that casting and additional key creatives are yet to be announced; MUBI’s Efe Cakarel gives the line for the file — “not a remake. It is a resurrection.” Criterion’s December slate is confirmed unannounced at the source for a second day, the Coming Soon page holding at twenty-two titles through The Right Stuff on Nov 24. Venice opens Wednesday, and the preview is richer than this desk had it: Ink is a Rupert Murdoch drama with Jack O’Connell, Guy Pearce and Claire Foy; the closing film is Giovanni Veronesi’s Dio Ride; honorary Golden Lions go to both George Clooney and Ellen Burstyn; competition includes McDonagh’s Wild Horse Nine, Pattinson’s Primetime, Casey Affleck’s directorial debut Company, Zeller’s Bunker with Bardem and Cruz, Herzog’s Bucking Fastard pairing Rooney and Kate Mara, Lee Chang-dong’s first film since Burning, and Koreeda’s Look Back. The Upcoming supplies the number that should be said aloud: one female director among the competition’s twenty, nearly a decade after Barbera signed the fifty-fifty pledge. In the art world, two hard stories. On Aug 27 two people bought tickets to Vienna’s Museum of Applied Arts, smashed a case in the Glanzstücke exhibition and left with a Van Cleef & Arpels platinum-and-diamond necklace valued by Sotheby’s at $4.6m — two hundred carats, 673 white diamonds, designed in 1939 for Queen Nazli of Egypt for the wedding of Princess Fawzia to the future Shah — along with earrings and a brooch. And the State Department has removed Kehinde Wiley’s Young Artists After Siamesas 1960, over twelve feet by nine, from the US Embassy in Santo Domingo, where it hung from 2015, and is exploring whether it can legally be sold; a senior official says the department “is in the process of discussions with legal representatives to ascertain whether the art can be sold,” Ambassador Leah Campos says it is her intention “that everything we project from US Embassy Santo Domingo reflect the beauty, strength and commitment to liberty of the United States,” and Art in Embassies director Erin Scavino called the painting “very woke” and “aesthetically terrifying.” On the Smithsonian, the meeting is real and the format is still contested: the institution’s own regents page confirms a Board of Regents meeting on Monday with an approved public agenda, but that PDF returns a server error and cannot be read, so the four-way disagreement between discuss, vote, a decision expected and an emergency unscheduled meeting stands unadjudicated. And on Kusama, both open questions remain open — no memorial date, and her own museum’s site still carries nothing.",
        s: [["News.az (Franco Fontana, 1933–2026)","https://news.az/news/franco-fontana-italian-master-of-colour-photography-dies-at-92"],["Hyperallergic ($4.6m Van Cleef necklace taken from the MAK)","https://hyperallergic.com/thieves-snatch-4-6m-diamond-necklace-from-viennese-museum/"],["The Art Newspaper (Wiley removed from the Santo Domingo embassy)","https://www.theartnewspaper.com/2026/08/25/kehinde-wiley-painting-removed-us-embassy-dominican-republic-state-department"],["Ekko (von Trier: the screenplay “around August”)","https://www.ekkofilm.dk/artikler/lars-von-trier-naermer-nyt-manuskript/"]] }
    ]}

  hooks: [
    { story: "The NBER’s August digest carries a finding on the Affordable Care Act that is uncomfortable in exactly the way good empirical work often is. Anuj Gangopadhyaya and Robert Kaestner, in Working Paper 35263, ask how much of the ACA’s coverage expansion represented people gaining insurance who did not have it, and how much represented people moving from employer-sponsored insurance onto publicly supported coverage. Among parents between 250% and 500% of the federal poverty line, the digest’s summary of the result is that “roughly three people took up publicly supported coverage for every one newly insured person.” The effect is not uniform, and the gradient is the informative part: at 0 to 150% of poverty, the uninsured rate fell by 0.93 percentage points with minimal decline in employer coverage; at 401 to 500% of poverty, the uninsured rate fell by only 0.3 percentage points while employer coverage fell by 0.6. So the programme worked close to as intended at the bottom of the eligible range and inverted as it moved up it. This is not an evaluation of whether the ACA was worth doing, and nothing in it says the newly covered are worse off. It is a measurement of the ratio between enrolment and newly insured, and of how that ratio changes with income.",
      src: ["NBER Digest","https://www.nber.org/digest/202608/crowd-out-employer-provided-health-insurance-affordable-care-act"],
      concept: "Crowd-out, and why an enrolment number is not a coverage number",
      q: "Put one number on the board and nothing else: three to one. Tell them it is the ratio of people who took up publicly supported coverage to people who became newly insured, among parents in a particular income band under the ACA. Ask what could possibly explain a ratio like that, and let them flounder for a minute, because the wrong answers are the productive ones. Someone will say fraud. Someone will say the programme failed. Neither is right, and the correction is the whole lesson: the other two people were already insured, through an employer, and they switched. Nothing improper happened. Now build it properly. A household chooses between employer coverage, at a price equal to the employee premium share, and public coverage, at a subsidised price that depends on income. Ask what happens when the subsidised option becomes available at a price below the employer option. They will get it immediately in the abstract and then fail to apply it, so make them apply it: ask what fraction of the people who switch were uninsured before. The answer is none of them — by construction, a switcher had coverage. Then ask the question that separates a policy analyst from a slogan: is that a bug? Push back hard on the first answer either way. On one side, if the public plan is cheaper for the same care, moving people onto it is efficient and the employer premium was a distortion in the first place, since employer coverage is subsidised through the tax code and therefore already over-consumed. On the other, the public plan is cheaper to the household because the taxpayer pays the difference, so the switch converts private spending into public spending without changing anyone’s health, and the budget cost per newly insured person is four times the naive figure. Both are correct. They are correct about different things, and a student who can hold both at once is doing economics. Now use the gradient, because it does the real analytical work and they will not see it coming. Write the two endpoints: at the bottom of the range, the uninsured rate falls 0.93 points and employer coverage barely moves; at the top, the uninsured rate falls 0.3 points and employer coverage falls 0.6. Ask them to explain the pattern before you do. The mechanism is selection on the outside option: poor parents mostly did not have an employer offer, so there was nothing to crowd out and the subsidy bought coverage; better-off parents mostly did, so the subsidy bought a substitution. Have them state the general principle, and make them say it in their own words: a subsidy crowds out private provision in proportion to how much private provision the recipients already had, which means the crowd-out rate is highest precisely where the recipients needed help least. That is a sentence worth writing down, because it generalises to housing vouchers, to childcare subsidies, to student aid, and to nearly every in-kind transfer they will ever study. Then make it a design problem and let them feel the trade-off bite. Ask how you would reduce crowd-out. They will propose eligibility screens — no subsidy if you have an employer offer — and that is in fact what the ACA’s firewall does. Ask what the screen costs. It creates a cliff, it requires verifying something the government cannot easily observe, it punishes people whose employer offer is nominally available and practically unaffordable, and it locks households into jobs. Ask whether the alternative — accepting crowd-out as the price of a clean, simple, high-take-up programme — is defensible. It is, and the argument is that administrative simplicity has real value and that job lock has real costs of its own. Finish by turning the tables on the number itself. Ask what the study cannot tell them. It cannot tell them whether the public plan is better or worse than the employer plan it replaced; it cannot tell them what happened to the employers’ wage bill when they stopped buying coverage, which is where the incidence question lives; and it cannot tell them what the three-to-one ratio would be today, in a very different subsidy schedule. Ask which of those three they would most want measured next, and why. The honest answer is the wage question, because if employers passed the saving back as wages then the household is better off by more than the coverage change alone, and if they did not, then the crowd-out is a transfer to firms — and nobody in the room can tell which without going and looking."},
    { story: "The CDC’s measles page has not refreshed its case counts since Aug 20 — four consecutive daily tests have now confirmed it — but one thing on it did render this weekend, and it is the number underneath every other number on the page. MMR vaccination coverage among American kindergartners, in the CDC’s own words, “has decreased from 95.2% during the 2019–2020 school year to 92.4% in the 2025–2026 school year.” Set that beside the epidemiology. Measles has a basic reproduction number usually estimated between twelve and eighteen, which implies a herd-immunity threshold — the share of a population that must be immune to stop sustained transmission — somewhere around 92 to 95%, and public health has for decades used 95% as the operational target precisely because it sits at the top of that band with margin. National coverage has moved from just above the target to the bottom edge of the range in six school years, a fall of 2.8 percentage points. The case count on the same page stands at 2,777 confirmed for the year across 47 jurisdictions plus sixteen among international visitors, with 36 outbreaks and 94% of cases outbreak-associated, and the United States’ elimination status is under review by a National Verification Committee chaired by Noel Brewer of UNC Gillings, with PAHO announcing in November. Two measles deaths occurred in Pennsylvania this year, the state’s first in thirty-five.",
      src: ["CDC","https://www.cdc.gov/measles/data-research/index.html"],
      concept: "A positive externality with a threshold — and why the last three per cent are worth more than the first ninety",
      q: "Start with the externality, because they think they already know it and they only half do. Ask why vaccination is a standard example of a positive externality. They will say: it protects other people too. Correct, and insufficient. Push: name the people it protects. They will get to infants too young for the first dose, to the immunosuppressed, to the small fraction in whom the vaccine did not take. Now ask the marginal question that makes it economics rather than biology. For a parent deciding, what is the private benefit? Protection of their own child, less whatever they believe the risks and hassle to be. What is the social benefit? That, plus the reduction in every other person’s probability of exposure. So the private optimum has less vaccination than the social optimum, and the standard prescription follows: subsidise it, or mandate it. They will nod. Now break the model, and do it deliberately, because the standard treatment is wrong here in a way that matters. Draw a curve with coverage on the horizontal axis and expected outbreak size on the vertical. Ask them to sketch it. Most will draw a smooth downward slope, and that is the error. The true curve is nearly flat and near zero above the threshold, and then rises sharply below it — because the reproduction number under vaccination crosses one at a specific point, and on one side of that point a chain of transmission dies out and on the other it does not. Put the numbers on it: with R-nought between twelve and eighteen, the threshold sits around 92 to 95 per cent. Now write 95.2 and 92.4 on the board and ask what has happened between them. What has happened is that the country has walked from comfortably above the threshold to sitting on it. Ask them to state the implication for the marginal social value of a single vaccination. It is not constant. Near ninety per cent coverage, one more vaccinated child changes very little. Near the threshold, one more child can be the difference between an outbreak that fades in three cases and one that runs to three hundred. The externality is not linear, and that is the single most important thing on this board. Then ask the question that will make some of them uncomfortable and should. If the marginal social value of vaccination rises as coverage falls toward the threshold, what does that imply about the private incentive as coverage falls? It runs the other way. The higher coverage is, the safer free-riding is, and the safer free-riding looks to any individual parent, the more of it there will be. So the system has positive feedback in the wrong direction: the approach to the cliff is self-accelerating right up until it is not. Have them name other systems with that structure. Antibiotic stewardship. Fisheries. Bank runs. Contributions to a public good with a provision point. Ask what all of them have in common as policy problems, and steer them to the answer: they cannot be managed by watching the outcome variable, because the outcome variable stays fine until it suddenly is not, and by then the adjustment is expensive. You have to watch the input. Now go at the aggregation, because 92.4 per cent is a national figure and it conceals the thing that actually determines outbreaks. Ask whether a country at 92.4 per cent everywhere is the same as a country at 98 per cent in most places and 78 per cent in a few. It is not remotely the same, and the second is far more dangerous, because transmission is local and the threshold binds locally. This is the clearest example a course will get of why a mean is the wrong statistic for a threshold process — and it is exactly why the CDC’s failure to render its state-level table for five consecutive days is a real loss rather than a cosmetic one. Finally, make them do the policy honestly, in both directions. Ask what a mandate does, and make them account for its costs as well as its benefits: exemption rates respond to how easy exemptions are, some parents will leave the school system rather than comply, and enforcement falls unevenly. Ask what an information campaign does, and whether they think the marginal unvaccinated child in 2026 is unvaccinated because of missing information or because of a considered belief — and what that answer implies about which instrument works. Close on the counterintuitive result: a policy that succeeds at raising coverage makes the disease rarer, which lowers the perceived private benefit of the vaccine, which erodes coverage. Elimination is not a stable state. It is a state that has to be paid for continuously, and 2.8 percentage points in six years is what the bill looks like when it goes unpaid."},
    { story: "On Saturday the Russian government extended a ban on diesel exports by refineries through Sept 30, closing a carve-out that would have opened on Sept 1. The structure is worth stating precisely because almost every account of it in August was wrong. A package adopted on July 30 bans gasoline exports and bans diesel exports by non-producing traders through Jan 31, 2027. Inside that, a narrower ban stopped the refineries themselves from exporting diesel, and it was that narrower ban — not the whole thing — that was due to lapse on Aug 31, which would have let producers resume diesel exports from Sept 1. Saturday’s decision extends it a month. The stated reason is stabilising the domestic fuel market. The circumstance is that Ukrainian drones struck Russian refineries twenty-one times in August, more than in any month of the war, and August throughput ran near 3.8 million barrels a day against a normal summer 5.3 to 5.5 million — a twenty-year low, with gasoline output down about 20% year on year and diesel more than 23%. Meanwhile Iran, in the same week, is dealing with the mirror image: Executive Vice President Mohammad-Jafar Ghaempanah says “gasoline distribution is unfair, and continuing on this path is impossible,” and “due to the U.S. naval blockade, we cannot import gasoline,” with a shortfall variously reported at fourteen or fifteen million litres a day and Tehran transport costs up from one million to 3.2 million rials.",
      src: ["Business Recorder","https://www.brecorder.com/news/40437001/russia-extends-ban-on-diesel-exports-until-september-30"],
      concept: "An export ban is a price control wearing a trade-policy costume — and who actually pays for it",
      q: "Draw a single market for diesel in a country that normally exports it, and insist on the standard diagram before any politics: domestic supply, domestic demand, and a world price above the price that would clear the domestic market in autarky. Ask what happens with free trade. Producers sell at the world price, domestic consumers pay the world price, and the country exports the difference between quantity supplied and quantity demanded. Now ban exports and ask them to find the new equilibrium. They will get there: with the outlet closed, the whole of domestic supply must be absorbed at home, so the domestic price falls until the domestic market clears on its own. Have them mark the new price and shade the areas. Consumers gain. Producers lose, and lose more than consumers gain, because the export revenue is gone. Ask them to name what the policy is, functionally, and do not accept ‘trade policy.’ It is a price ceiling implemented by removing an alternative buyer rather than by writing a maximum price. Same effect, different instrument, and no enforcement problem at the pump — which is precisely why governments reach for it. Then ask the question that turns this from a diagram into this week’s news. What happens to that diagram when the supply curve shifts sharply left because a fifth of your refining capacity is offline? Have them redraw it. Domestic price rises, quantity falls, and the export surplus shrinks or vanishes. Now ask: at that point, is the export ban still binding? It might not be — if capacity has fallen far enough that domestic demand absorbs everything anyway, the ban is redundant. So why extend it? Let them work through it. Because with the world price high and the domestic price suppressed, a refinery with any spare barrel strictly prefers to export it, and the government is trying to stop exactly that reallocation. The ban is not managing a surplus any more. It is allocating a shortage. Now do incidence properly, because this is where students reliably go wrong. Ask who bears the cost of the ban. They will say producers, and point at the shaded area. Push: over what horizon? In the short run, yes — the refineries eat the difference between the world and domestic price on every barrel. But ask what a refiner does, facing a domestic price held below world levels and a capital stock being destroyed by drones. It does not invest. Repairs get slower, maintenance gets deferred, and the supply curve shifts further left next year. So the ban transfers surplus to consumers today at the cost of capacity tomorrow, which means the incidence over three years is on consumers again. Have them state the general principle: a price control that binds transfers surplus in the short run and destroys it in the long run, and the length of the run is set by how elastic supply is to investment. Then use Iran as the contrast case, because the pair is unusually clean and they are happening simultaneously. Russia is an exporter suppressing its domestic price by closing an export door. Iran is an importer that cannot import — a blockade, not a policy — facing a shortfall of fourteen or fifteen million litres a day against consumption near 129 to 135 million. Ask what instruments are available to each. Russia can ration by closing exports, because it has exports to close. Iran has no export margin to reallocate; its options are the price, formal rationing, or reserves — and the Tehran transport cost tripling from one million to 3.2 million rials tells you which one is actually operating, whatever the official price is. Have them articulate the difference: a country with a tradeable surplus can hide a shortage inside its trade policy, and a country without one cannot hide it anywhere. Close on the political economy, and let them argue. Ask why a government facing a fuel shortage almost always chooses the instrument that suppresses the price rather than the one that rations quantity explicitly. The answers are worth having on the board: a price is visible daily to every voter and a queue is visible only to the people in it; an export ban’s losers are a small number of firms rather than a large number of households; and the cost of the policy appears in the future, as capacity that was never rebuilt, which is a place voters cannot see. Then ask whether any of that is specific to an authoritarian state at war. It is not — the same logic explains export restrictions on food staples across a dozen democracies in 2022, and it is worth naming those so the room does not walk out thinking this is a story about Russia."}
