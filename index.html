<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "Putin's biggest week of the year opens in Bishkek this morning, and the American channel produced its first concrete proposal. The Shanghai Cooperation Organisation summit runs today and tomorrow with leaders of seventeen countries plus UN Secretary-General António Guterres, and Kremlin aide Yury Ushakov has given the running order plainly: “It all starts on August 31 with a conversation with Chinese President Xi Jinping. This looks quite logical and, for us, this is a very important meeting.” The Putin-Xi bilateral is set for today with the Power of Siberia 2 gas pipeline on the agenda; the Putin-Pezeshkian meeting carries a reported $25bn Rosatom nuclear-plant agreement with Iran. Xi and Putin have now met roughly ten times since the invasion began. Modi, Erdogan, Tokayev and Pashinyan are confirmed present; this desk could not independently re-confirm the fuller attendance list it published yesterday and does not restate it. Note that no post-meeting readout of any bilateral existed at the time of writing — Bishkek is UTC+6 and the summit was only just opening — so what follows is the schedule, not the outcome. Putin then flies to Vladivostok for the Eastern Economic Forum, September 1 to 4, with a plenary address on the third. The genuinely new item is on the Ratcliffe channel. Axios, citing two sources briefed on the matter, reports that CIA director John Ratcliffe used his covert Moscow visit to propose a trilateral meeting between Trump, Putin and Zelensky — and Kommersant's own Sunday-morning digest independently carries the same claim, which is unusual and worth noting in itself. That is a fifth account of what the trip was for, alongside the Washington Post's warning-against-exploiting-weakness, the Wall Street Journal's and Politico's warning-against-NATO-strikes, and the New York Times's urging-peace-talks. This desk adjudicates none of the five. Axios adds that the administration has floated the trilateral before, that Zelensky is supportive, and that Putin has previously rejected it. Against all of it, Peskov's Friday line that talks are on a “deep pause” stands unretracted. One correction this desk owes: it reported on Sunday that no readout of Saturday's Putin-Lukashenko meeting at Novo-Ogaryovo had been published anywhere. One had. It is thin — trade and Union State boilerplate, Putin on cooperation “developing successfully” and Lukashenko on microelectronics, 12.5% first-half trade growth against roughly $52bn the prior year, no Ukraine content and no deliverables — but thin is not the same as absent, and the desk said absent. Witkoff and Kushner make eleven consecutive days with nothing verifiable; the working American channel remains the intelligence services.",

      { t: "The Myla toll moved again, to thirty-eight — and the name this desk twice refused to attach a title to turns out to belong to Ukraine's prime minister. Take the correction first, because it is the desk's own. Serhii Koretskyi, whose “on the fifth year of the full-scale invasion, making the same mistakes is criminal negligence” has been quoted here for two days without a title because the title could not be verified, is the Prime Minister of Ukraine, appointed on July 16, 2026. It is confirmed across three outlets. Withholding an unverified title was right; two days is longer than it should have taken to resolve, and the resolution changes the weight of the quote considerably — this is the head of government, not a commentator, calling the state's own conduct criminal negligence. On the toll: thirty-eight dead, four missing, 381 evacuated including 59 children. And the second half is a mirror image of yesterday's lesson. Ukrinform's story lives at a URL whose slug reads “rises-to-52” while its body says thirty-eight — the number in that slug is the injured count, not the dead, and a reader taking the toll from the address bar would have got it wrong in the opposite direction from the Kyiv Independent's frozen “at least 27” yesterday. Two slug traps, two days, two directions. The other figures do not reconcile and are published unreconciled: Kyiv Post gives twenty injured, two of them children, and about fifty buildings damaged; Ukrinform gives fifty-two injured, five children, nine hospitalised in moderate condition, and roughly three hundred damaged structures. Kyiv Oblast administration head Tymur Tkachenko: “We are continuing to address the aftermath of the enemy attack at the site of the tragedy in the village of Myla.” The strikes themselves are now in a fifth consecutive day, and the framing has shifted from nightly tallies to a campaign. The Kyiv Independent reports 800 Russian jet-powered drones launched over four days, nearly 1,500 drones in total over the same four days, and nearly 2,000 attack drones over the week. Zelensky: “Right now, Russia's tactic is to wear down Ukraine and Ukrainians — first and foremost, our people,” and “the most difficult task is intercepting the jet-powered ones. Now, it is mainly our combat aircraft that protect against them.” His stated goal is an interception rate “well above 90%” by autumn. From the other direction, Russia's Ministry of Defence claims 494 Ukrainian drones intercepted in the twelve hours to eight on Sunday morning across fourteen regions, up from the 313 it claimed the night before. Ukraine's Air Force has still published no ballistic-missile interception figures, and the reason is now documented rather than inferred: it stopped in early August after reports like “28/0” were being used to argue it had intercepted nothing, per spokesman Yurii Ihnat, and the Institute of Mass Information's Oksana Romaniuk warned at the time that “when some communication disappears, the vacuum can be filled with suspicions and rumors, and distrust may increase.” Ukrainian strikes hit Belgorod on Sunday evening — a thermal power plant, an Ozon warehouse, the television tower area — with acting governor Alexander Shuvaev saying only that “according to preliminary information, there are casualties.” And a number that belongs in the record: a joint Mediazona and BBC Russian Service investigation has now verified by name 242,747 Russian military dead as of August 27, up 3,393 since mid-August, of whom roughly 88,600 were volunteers and 26,600 recruited prisoners. Both outlets say the true figure is materially higher.",

      { t: "The month-long pause inside Iran ended on Sunday, and the desk's own running count is the thing that shows why the count was fragile. American forces struck Iranian targets on Larak Island in southern Iran on Sunday, the first such attack in roughly a month. US Central Command describes it as “limited, precise action” to stop Iranian forces laying mines in the Strait of Hormuz and explicitly denies it was “an act of aggression”; Iran's Fars agency says the strike “killed and injured soldiers” without giving numbers. Al Jazeera published at 20:15 Sunday and updated at 02:15 this morning; Bloomberg's headline calls it the first attack in weeks. Now set that beside GlobalSecurity's Day 184 log for August 30, which records a thirty-first consecutive night without confirmed strikes inside Iran. Both can be true only if the log was written before the strike, which is almost certainly what happened — but it means the “nights without strikes” series this desk has been carrying is a lagging indicator that can be wrong on the day it matters most, and it should be read that way from now on. Oil moved. Brent is quoted at $89.703, up $1.60 or 1.82% on the day, on TradingEconomics' live panel, while the same page's narrative text says Brent “climbed above $90 per barrel on Monday” — a live quote and a round-number narrative that do not quite agree, published here as a spread rather than a level. The Hormuz counting problem is unchanged in shape and worse in substance. All three logs rolled forward exactly one day, preserving their offsets: GlobalSecurity calls August 30 Day 184, Windward via global-energy-flow calls it Day 183, straits.live calls it Day 182. But the baselines have moved again, and in a new way: Windward now cites Lloyd's List at 114 transits in the week to August 23 against 73 in the preceding week, and separately “approximately 5 vessels a day” — which is not the same metric as the 110-to-130-a-day framing it carried on Friday, and this desk cannot tell whether the page changed its measure or its data. straits.live holds an 85-a-day baseline and notes three vessels transited on August 23, four per cent of normal. CENTCOM, via GlobalSecurity, now puts 82 vessels redirected. One thing the desk published on Sunday could not be reproduced today: the Goldman Sachs estimate that Gulf exports had recovered to 15 to 16 million barrels a day is no longer on the Windward page, which now attributes to Energy Secretary Chris Wright a seven-day moving average of nine million barrels a day through Hormuz and about fifteen million across the Gulf including pipelines. Same order of magnitude, different attribution and a different measure; the desk flags the substitution rather than pretending the earlier line is still standing. The Iranian position hardened rhetorically. The IRGC Navy, via GlobalSecurity: statements by American officials that the strait is open are “an obvious lie.” Deputy foreign minister Kazem Gharibabadi, via straits.live: no ship can transit without Iran's coordination, and Tehran will not move first on reopening until Washington honours its commitments — he is separately quoted saying Iran is “in no rush.” No vessel has yet transited the Iran-Oman temporary corridor; that absence now runs to a sixth day. On sanctions, both the Treasury press-release index and OFAC's Recent Actions were checked and neither has moved: SB0617 of August 28 remains the highest release number and August 28 remains OFAC's latest action. And a new voice: Supreme Leader Mojtaba Khamenei, described as breaking his silence, in a written message for Islamic Unity Week — “identify your real enemy, understand his plan and confront it” — and separately, on the domestic economy, the need to “seriously address inflation, unemployment, management of prices.” The rial sits near 2,020,000 to the dollar against an official 1.5 million with inflation near 90% on the government's own Statistical Center.",

      { t: "Six months of war got a set of totals, a new Israeli strike hit a hill that has now been hit three times, and one of the five benches finally published. Al Jazeera's six-month accounting, dated August 28, is the first consolidated ledger this desk has seen and is worth having in one place even though every line in it is contested somewhere: the war began February 28, 2026; 4,350 killed in Lebanon, 3,527 in Iran, 28 across the Gulf states, 60 Israelis and 18 American service members with 757 wounded; more than 3,580 American and Israeli strikes on Iran against more than 2,053 Iranian attacks across the Gulf; seventy confirmed attacks on Hormuz shipping with nineteen seafarer deaths; daily passages through the strait down from a hundred to an average of seven over six months, with a brief rise to twenty a day after a June 17 agreement; American defence spending of $37.5bn with a possible $80bn to $100bn unreported; Brent up 22% from pre-war levels having peaked 67% higher in April; and the Strategic Petroleum Reserve down to 290 million barrels, its lowest since 1982. Trump's approval sits at 33% and eighty per cent of Americans expect prolonged involvement. On Lebanon, a new and separate event: Israeli aircraft, artillery and a drone-fired guided missile struck the Nabatieh district on Saturday, including the Ali al-Taher ridge again — the third dated incident on that hill after July 31 and August 26-27 — along with the villages of Haris and Haddatha. A Lebanese military field source reports no confirmed casualties and it is explicitly unresolved whether the targets were pre-assessed or whether Hezbollah fire preceded the strikes. Hezbollah has claimed nothing, and the cumulative Lebanese health ministry toll is unchanged at 4,350 killed. On Gaza there is no advance: Nikolay Mladenov's August 28 warning that failure to follow the roadmap “threatens a collapse of the ceasefire in Gaza,” that there is “no better alternative to the current plan,” and that a       { t: "Two things moved the tape overnight and they point the same way: a strike near the Strait of Hormuz and a Fed that is arguing about a hike. Take the pricing first and take it carefully, because a Monday five-in-the-morning read is mostly futures and Asia. US equity futures were lower late Sunday — the Dow down about 160 points to roughly 53,439, the Nasdaq-100 down 185 to about 29,306.75, the S&P 500 down 28 to about 7,694 — attributed by the one aggregator this desk could reach to the Larak strike and to Warsh's Jackson Hole tone strengthening bets on a September hike. That is a single secondary source, since the two outlets that carry the live blogs properly are both blocked to an automated reader, and it is labelled as such. The Nikkei 225 closed at 65,550, down 855.56 or 1.29%, on the same two causes; the same page's narrative says “below 65,500,” which does not quite match its own number, so both are printed. Shanghai opened down 0.35% and Hang Seng flat. The DAX read is internally contradictory — a live panel showing 26,528 and up 0.77% against narrative text saying it fell 0.14% — and this desk cannot reconcile it, so it publishes the contradiction rather than picking a side. Friday's US closes remain the last real equity prints: S&P 500 7,711.76, Nasdaq Composite 26,402.42, Dow 53,559.99, Russell 2000 2,972.37. One open item from Friday is now closed: the VIX settled at 14.35 on August 28. That comes from a single secondary summary rather than from Cboe, but the same summary independently reproduces the Dow's true −0.02% rather than the −0.1% the Associated Press printed in error, which is a reasonable proxy for care. On the Fed, the number to hold is 58%. CME FedWatch put the probability of a September hike at 58% as of just before seven this morning, and the piece carrying it makes the right point about it: “a long way from the 90%-or-higher reading that typically qualifies as a done deal.” That is inside Friday's 56-to-59% band, so nothing has         s: [["CoinDesk (September hike at 58%, not 90%, on CME FedWatch)","https://www.coindesk.com/markets/2026/08/31/september-fed-rate-hike-fears-appear-overblown-as-the-probability-is-just-58-not-90"],["Bloomberg (emerging-market stocks fall as Warsh stokes hike bets)","https://www.bloomberg.com/news/articles/2026-08-31/emerging-market-stocks-fall-as-warsh-stokes-fed-rate-hike-bets"],["TradingEconomics (Nikkei 225, Monday close)","https://tradingeconomics.com/japan/stock-market"],["FXStreet (the week ahead: payrolls Friday)","https://www.fxstreet.com/analysis/forecasting-the-upcoming-week-busy-week-with-focus-on-the-us-labour-market-202608281523"]] },
      { t: "The Jackson Hole papers this desk reported as unretrievable are now posted, and a standing claim about the IMF turns out to have been wrong for three weeks. On Saturday the desk said the symposium's closing-day papers could not be reached because the Kansas City Fed's page linked them through elements an automated reader cannot follow, and called that a genuine absence worth returning to. It was, and the return has paid: the page now carries PDFs for the full set. Eswar Prasad of Cornell on the international monetary system; Darrell Duffie of Stanford on innovation in tokenized finance; Christine Parlour of Berkeley on “Financial Innovation and the Future of Banking” with Itay Goldstein of Pennsylvania discussing; Markus Brunnermeier of Princeton on “Financing Innovation” with Raghuram Rajan discussing; and the closing panel on considerations for central banking with remarks from Wenxin Du of Harvard and handouts from Arvind Krishnamurthy of Stanford and Jesús Fernández-Villaverde of Pennsylvania. Titles and authorship are confirmed; the contents are not yet read, and this desk will not summarise a paper it has only seen the cover of. Kenneth Rogoff's sideline remarks are now quotable at length and the fiscal argument is the interesting half: “I think we will have some kind of debt crisis, financial repression, inflation, maybe something more dramatic”; “the deficit is running at 6% to 7% of GDP during peacetime, and no political coalition is preparing to close it”; and on incidence, “the lower income people don't have anything to worry about. And the higher income people added to your tax bill,” with longer life expectancies as “the low hanging fruit” and higher taxes likely “because our taxes aren't that high compared to the rest of the world.” A Bloomberg headline puts US debt past $40 trillion and has Rogoff predicting action only after a major shock, but the body is unreadable to this desk and the figure is therefore carried as a headline claim rather than a verified one. Now the correction. This desk has said for several runs that the IMF blog had published nothing since August 6 and that the July World Economic Outlook Update was its current flagship. That is false. The IMF has published at least twice since: Tobias Adrian on August 26 arguing that “central bank communications should anchor expectations by explaining how policy responds to changing conditions, rather than committing to a fixed path” — which is a direct and interesting counterpoint to Warsh's case for ending forward guidance, from the Fund's own financial-counsellor — and a piece on regulatory and institutional reform and growth on August 25. The desk was reading a stale index and calling it silence, which is the error it warns about most often. On Russia, nothing has changed and one confirming check was enough: the producer diesel-export carve-out did not open, it was extended to September 30 inside a trader and gasoline ban running to January 31, 2027. Tomorrow brings both the digital ruble under Federal Law 248-FZ, with mandatory acceptance beginning for major-bank clients and retailers above ₽120m in annual revenue, and the next real Bank of Russia fixing; today's rate is still the August 29 print of USD ₽85.6007, EUR ₽99.6820, CNY ₽12.7335, carrying the weekend as the CBR's business-day calendar requires. And from VoxEU, whose landing page remains the only fetchable form, two columns worth Sveta's time: Hakan Kara and Alp Şimşek on Türkiye — financial engineering is no substitute for interest rates — and, dated Sunday, a piece predicting AI adoption from comparative advantage rather than exposure.",
        s: [["Kansas City Fed (2026 symposium: the Saturday papers are now posted)","https://www.kansascityfed.org/research/jackson-hole-economic-symposium/2026/"],["Yahoo Finance (Rogoff on the deficit and who pays)","https://finance.yahoo.com/economy/policy/articles/harvard-economist-says-debt-reckoning-194554983.html"],["IMF Blogs (Adrian on central bank communication, Aug 26 — the desk's “nothing since Aug 6” was wrong)","https://www.imf.org/en/blogs"],["Bank of Russia (the digital ruble thresholds)","https://www.cbr.ru/eng/press/event/?id=25774"]] }
    ]},

      { t: "Monday's drug-pricing deals had not landed by five this morning, and the more useful finding is what happened to the seventeen that already did. The most-favoured-nation agreements with mid-sized biotechs are still expected today and there is still no signatory, no term sheet and no confirmation. What is confirmed is the shape: participating firms would price for state Medicaid programmes against a basket of Canada, Denmark, France, Germany, Italy, Japan, Switzerland and the United Kingdom on net rather than list prices, with the inducements being tariff relief and potential exemption from forthcoming Medicare pilot discount programmes. The count of prior large-company agreements has firmed up — KFF Health News independently gives seventeen, matching FiercePharma, against the sixteen in Pharmacy Times, so seventeen now has two sourcings. And KFF's Stephanie Armour has published the piece that should frame today's announcement whenever it comes. Those seventeen deals “apply narrowly to new drugs and Medicaid enrollees only”; there are no public dashboards tracking compliance; and the FDA has quietly moved deadlines without announcing it. Larry Levitt of KFF: “These deals are often not transparent, so there's no way for the public to judge how meaningful they are.” Leslie Dach of Protect Our Care is blunter: “It's just all talk. They just govern for a day of publicity, and then it's over.” The receipts are in the same piece and they are specific. Insurers pledged to cut prior authorisation by 80% by January 2026; the actual reduction as of July is 11%. Food-dye commitments: seven of twenty-seven companies compliant, with the deadline pushed from 2026 to 2027. And an American Medical Association survey finds only one physician in three believes voluntary pledges will make a meaningful difference. Whatever is announced today should be read against that record rather than against its own press release. The other Monday deadline is quieter and structurally similar. State annual reports under the $50bn Rural Health Transformation Program are due to CMS today, and states are under no obligation to publish them — CMS will issue an annual summary and will not proactively release individual submissions. No state report and no CMS statement had appeared by this morning, which is what the deadline structure predicts. The Bipartisan Policy Center's pre-deadline letter adds a detail worth having: CMS's own template requires disaggregated reporting by initiative, evidentiary documentation for completed checkpoints, and quantitative metrics — so the information exists and simply is not public. Maya Sandalow of the BPC: “States should be able to learn from each other, get a sense of lessons learned and best practices, and then pivot their initiatives accordingly.” Mississippi state senator Hob Bryan: “I just don't believe in all this secrecy. If they're not up to something nefarious, why do they have to do it all in secret?” Michael Cannon of Cato, from the other direction: “People should know how their $50 billion in taxes is being spent on the rural health program, and whether state projects are making rural patients healthier.” The allocations run from a $147m floor-plus-bonus in New Jersey to $281m in Texas, against more than $900bn in anticipated Medicaid reductions. STAT's Unraveled series, whose parts one and two ran on August 25 and 27 on exactly this subject, has still not produced part three.",
        s: [["KFF Health News (Armour: the health-industry deals haven't been enforced)","https://kffhealthnews.org/health-industry/trump-kennedy-food-dyes-price-deals-unenforced-vanishing/"],["FiercePharma (the MFN deals with mid-sized companies)","https://www.fiercepharma.com/pharma/trump-set-reveal-mfn-pricing-deal-mid-sized-companies-bloomberg"],["KFF Health News (rural health reports due today, publication optional)","https://kffhealthnews.org/rural-health/rural-health-transformation-program-transparency-50-billion-dollars-state-tracking/"],["STAT (Unraveled, part two: hospitals race to reverse Medicaid cuts)","https://www.statnews.com/2026/08/27/hospitals-lobby-reverse-medicaid-cuts-part-2-unraveled-series/"]] },
      { t: "The measles page did refresh after all, one docket moved by 857 comments and the other's count turns out to be a day old. Start with the CDC, because the desk has now been wrong about it in a useful way. After four consecutive days of testing and reporting no refresh, today's read returns different numbers: 2,903 confirmed cases as of August 27, made up of 2,887 among US residents across 47 jurisdictions plus sixteen among international visitors, with 37 outbreaks against 36 and 94% outbreak-associated, which works out to 2,737 of 2,903. So the page did move at some point last week from its August 20 snapshot to an August 27 one, and has then sat still through Thursday, Friday, Saturday, Sunday and this morning. It is four days behind rather than eleven, but it is still not a live page, and the “updates Thursday afternoon” model remains retired. The case count is up 126 in a week. The state table, the age and vaccination breakdowns and the hospitalisation rate again rendered as empty structure with headers and no numbers — a sixth consecutive extraction failure, which is not the same thing as an absence, and Utah's 518 and the 7% hospitalisation rate stay unrestatable. The MMR kindergarten line rendered again, word for word: coverage “has decreased from 95.2% during the 2019-2020 school year to 92.4% in the 2025-2026 school year.” Two independent fetches, identical text, so that figure is now stable. On the dockets, one clean finding and one honest failure. The H-1B fee docket has moved sharply: 4,814 comments against Saturday's 3,957, a jump of 857, with the page stamping itself Sunday lunchtime. The vaccine RFI still reads 1,500 — but the regulations.gov widget embedded in the Federal Register page stamps itself 6:15 on Sunday morning, which means this is not a Monday plateau, it is a Sunday number that has not refreshed. The desk cannot say whether Saturday's +780 held, decayed or continued, and says so rather than reporting a flat line it has not observed. What can be said is that the asymmetry held for a sixth day: a targeted search for American Academy of Pediatrics or American Medical Association activity on docket HHS-OS-2026-0332 again returned nothing responsive, and a piece published this morning on AAP, AMA and NFID criticism of the vaccine executive order makes no mention of the RFI at all. Two threads the desk is closing out honestly. Merck v. Kennedy has now survived six searches without being identified, and the two nearest matches are both something else: Kennedy v. Merck & Co., 2:18-cv-20223, is the reverse-styled Gardasil mass tort suspended in February 2025, and the “Merck vaccine case linked to Kennedy” turns out to be Robi v. Merck in Los Angeles County Superior Court, a state case halted mid-trial and reconvening in September with a new jury over concerns that confirmation politics could bias jurors. The roughly October 23 appeal window remains unverified and should not be repeated as fact. And on Ebola, the ECDC has published nothing since August 28 at 14:40 — 5,794 cases, 2,786 deaths, 843 hospitalised, 82.3% of contacts under follow-up, 60 of 151 health zones, species Bundibugyo. The invented “81 new confirmed cases and 42 deaths reported on August 27” that this desk discarded on Sunday reappeared verbatim in an independent fetch today, which confirms it is a reproducible extraction artifact rather than a one-off misread, and it is discarded again. Two unverified single-source items are flagged rather than published: a reported ERVEBO campaign for frontline workers launched August 27 in Tshopo, Bas-Uele and Haut-Uele, and Uganda's linked outbreak reportedly declared over on July 28 with twenty cases and two deaths.",
        s: [["CDC (measles: 2,903 confirmed as of Aug 27; MMR kindergarten coverage 95.2% to 92.4%)","https://www.cdc.gov/measles/data-research/index.html"],["Federal Register (H-1B fee docket, 4,814 comments)","https://www.federalregister.gov/documents/2026/08/25/2026-17324/fee-for-certain-h-1b-petitions"],["Federal Register (vaccine RFI: 1,500, stamped Sunday morning)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["ECDC (DRC Ebola, last updated Aug 28)","https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda"]] }
    ]},
    { h: "Campus & culture", items: [
      { t: "Michigan: the three-signature margin has a denominator now, the select committee has a roster, and the Ann Arbor appeal has not actually been filed. The ballot-question arithmetic is finally complete and it is worth stating in full because the shape of it is the story: 709,841 signatures submitted, 446,198 valid signatures required, and a staff review of a 1,000-signature sample that found 626 valid against a threshold of 629. Three short, on a sample, on a petition with more than seven hundred thousand signatures, at a board that then deadlocked two-two. Democratic canvasser Mary Ellen Gurewitz called it a “sloppy” drive that put the board in a “bad position”; Republican Paul Cordes believed sufficient signatures existed. Campaign chair Paul Jacob, of the Liberty Initiative Fund: “More than 700,000 Michiganders signed this petition. We have the signatures required to qualify, and we are asking the Michigan Supreme Court to ensure those voters are not silenced because the Board of State Canvassers failed to do its job.” The filing date remains disputed — the campaign's own outlet says Thursday August 27, which is indeed a Thursday, while the public radio stations report it on the 28th — and this desk still flags rather than picks. Two schedule corrections: organisers had until September 2 to appeal, and the court has until September 19, the military and absentee ballot certification deadline, to decide. Tomorrow's date is the campaign's requested expedited ruling, not a statutory one, and no order has issued. On the legislative track, House Resolution 350 passed 57 to 41 and the seven-member Select Committee on the Rules and Procedures of the Board of State Canvassers now has a full roster: chair Mike Harris of Waterford, majority vice chair Bryan Posthumus of Rockford, Ann Bollin of Brighton, Rachelle Smit of Martin and Jason Woolford of Howell for the Republicans; minority vice chair Denise Mentzer of Mount Clemens and Mai Xiong of Warren for the Democrats. It can subpoena, administer oaths and compel sworn testimony. Speaker Matt Hall: “We can't let this stand. What has been done here to disenfranchise the voice of hundreds of thousands of petition signers is a disgrace.” No hearing date and no subpoenas yet. On public power, a correction to this desk's own Sunday copy: it reported the appeal as confirmed. It is not. The DTE-funded coalition's spokesman Rudy Harper said on August 26 that the group is “reviewing the decision and expect to appeal,” and Ann Arbor for Public Power's own site, whose most recent post is that same day, records no filing. The venue of the dismissed case is now confirmed as Washtenaw County Trial Court before Judge Patrick Conlin, with the hearing on August 24; the appellate venue is still stated nowhere and is still not stated here. In Ypsilanti Township the document page is unchanged since August 19 and DTE has now said nothing for fourteen days. One thing did change in the record: Resolution 2026-08 is dated April 15 and 2026-21 is specified as a six-month moratorium — and Resolution 2025-23, which this desk catalogued on Sunday, did not appear on the page in today's fetch, which is flagged as a discrepancy rather than reported as a removal. The same summarisation artifact that invented a Los Alamos nuclear facility out of Resolution 2026-05 reproduced itself today; go by the filename. Context this desk had been missing: the University of Michigan closed on a 124-acre parcel in March and selected the Textile Road site for a $1.2bn facility on August 11. The September 9 town hall is at the Marriott at Eagle Crest in the Roy Wilbanks Ballroom, five to seven, registration required. Elsewhere: the Ann Arbor schools transgender-policy amendment passed with trustee Rima Mohammad casting the lone dissent, arguing the changes unnecessarily targeted vulnerable students. The RenCen community-benefits meeting is tomorrow at six, electing the first two of nine Neighborhood Advisory Council seats — three more are appointed jointly by council members Renata Miller, Mary Waters and Coleman A. Young II and four by the Planning and Development Department — for a complex that is 95% vacant, in an eleven-week process covering roughly 4,600 impact-area residents. Eric Dueweke of Community Development Advocates of Detroit: “What is the rush?” And no charges yet at Quality Behavioral Health, where the August 25 searches covered the chief executive's residence and facilities in Troy, Eastpointe and Detroit's east side.",
        s: [["Michigan Fair Elections (the mandamus complaint, and Jacob's statement)","https://www.mifairelections.org/post/two-front-fight-citizen-voting-backers-hit-courts-and-capitol-within-72-hours"],["Michigan Advance (HR 350 passes 57-41; the committee's remit)","https://michiganadvance.com/2026/08/27/new-house-committee-to-examine-signature-verification-sampling-process-for-ballot-initiatives/"],["Bridge Michigan (709,841 submitted, 626 of 1,000 against a 629 threshold)","https://bridgemi.com/michigan-government/citizenship-voting-proposal-blocked-from-michigan-ballot-backers-vow-fight/"],["WEMU (Ann Arbor schools amend the transgender policy; Mohammad dissents)","https://www.wemu.org/wemu-news/2026-08-28/aaps-changes-transgender-student-policy-under-pressure-from-u-s-department-of-education"]] },
      { t: "The CPT sequence is wrong again, and this time the correction comes from a university's own office rather than a consultancy. The unverified sixth mover this desk flagged on Sunday — UC San Diego, circulating on a blacklisted aggregator — has been checked at source, and the source says something both stronger and different. UCSD's International Students and Scholars Office writes, on its own domain: “On August 12, 2026, ISEO was made aware that the Student and Exchange Visitor Program (SEVP) has made recent policy updates on F-1 CPT issuance,” and “while F-1 CPT remains an option, ISEO is temporarily pausing the submission and processing of all F-1 CPT requests in iServices while guidance is forthcoming.” Two things follow. First, the scope is broader than the others: Davis, Berkeley, Irvine, USC and Washington suspended course-credit CPT specifically, while UCSD's language pauses all F-1 CPT requests. Second, the date is August 12 — the same day Berkeley's suspension took effect — so UCSD is not the sixth mover in a sequence, it is concurrent with the first. That makes four of the six University of California, moving first and moving together, which is a much stronger system-posture reading than the one this desk published. The caveats are real and stated: the page carries no last-updated stamp, so its current status cannot be confirmed, and no third-party outlet has reported UCSD at all. Meanwhile NAFSA's own administration tracker was fetched directly and contains zero mentions of CPT, of Berkeley, Davis, USC or Washington, or of either SEVP broadcast; its newest entry is August 24. That is now a directly confirmed absence rather than an inferred one. Today is the deadline in the Defense Department's foreign-partnership audit at thirty named universities, and not one of the thirty has said anything — checked again this morning across Inside Higher Ed's reporting, a law-firm analysis and a targeted search naming Harvard, MIT, Berkeley and Penn State. The only sector response is from the American Council on Education, which is not on the list and says the department's release “implies wrongdoing without evidence.” The AFT and AAUP joint statement is dated August 25 and titled “Department of War Directive Undermines Scientific Innovation. It Should Be Rescinded,” issued by AAUP president Todd Wolfson and AFT president Randi Weingarten. A second departmental voice joins Joseph Jewell's: under secretary for research and engineering Emil Michael says the department has “zero tolerance” for partnerships risking national security and seeks protection from “unauthorized technology transfer, intellectual property theft and adversarial exploitation.” The legal scaffolding is Section 1286 of the FY2019 NDAA, which maintains a list of 130 flagged foreign institutions, plus Section 238 of the FY2025 and Section 215 of the FY2026 acts. Separately and today, the government's response is due in NAFSA v. DHS — the duration-of-status case, distinct from the CPT thread — before Judge F. Dennis Saylor IV, with the hearing Thursday at eleven and the rule's effective date September 15. Nothing had been filed as of this morning. The eight-name plaintiff coalition is worth setting out because two of the names are graduate-worker unions: NAFSA, the Presidents' Alliance, AICUM, the AFT, the Graduate Labor Organization AFT Local 6516, the International Union UAW, UAW Local 2322, and the NewsGuild-CWA. The demand side has a number now. New student visas fell 23% in 2025, and the composition is what matters: F-1 degree visas down 33.4%, J-1 exchange down 9.9%, M-1 vocational down 6.7%; India down 56.6%, China down 28%, Iran by more than 90% from a base above three thousand, Myanmar and Venezuela by more than 70%. The series is level through early 2025 and falls from May, the month student visa interviews were paused for social-media screening. NAFSA puts the 2026-27 economic loss at $3.4bn. Rajika Bhandari: “Students who perceive the U.S. as an unpredictable destination may decide not to apply.” On teaching, a thin week honestly reported. The best current item is Chronicle's Teaching newsletter of August 27, which points to James Lang of Notre Dame arguing for moving “the most important work in class” — in-class reading, in-class research writing — as the answer to AI, alongside Jay Howard of Butler on planned discussion — “good discussions are often the result of careful planning” — Kristi Rudenga of Notre Dame on checking that students are interacting with presented material, and Carlo Rotella of Boston College on drawing out quiet students; the linked articles themselves were not reachable. The August 20 edition carries harder numbers: Chapman University is considering permitting AI by default with per-course boundaries, and its academic-dishonesty complaints are up 400% since 2020; Penn State is consolidating fourteen campus integrity councils into one office and redirecting the savings to prevention. Faculty Focus published two pieces in the window and neither carries a class size, a timing or a measured outcome, which is worth saying rather than dressing up. And a date correction the desk owes: the Warwick games-for-economics piece it cited on Sunday is from June 2024, not 2026.",
        s: [["UC San Diego ISEO (all F-1 CPT requests paused, dated Aug 12)","https://iseo.ucsd.edu/student-services/working-in-us/f1-cpt.html"],["Inside Higher Ed (the thirty-university DOD audit; deadline today)","https://www.insidehighered.com/news/quick-takes/2026/08/27/dod-demands-30-american-colleges-audit-foreign-partnerships"],["Inside Higher Ed (new student visas down 23%; F-1 down 33.4%, India down 56.6%)","https://www.insidehighered.com/news/global/international-students-us/2026/08/26/new-student-visas-dropped-23-2025"],["Presidents' Alliance (NAFSA v. DHS: government response due today)","https://www.presidentsalliance.org/duration-of-status-litigation/"]] },
      { t: "Mind & cosmos: a quiet weekend in the journals with one real experiment in it, a psychiatry piece worth Sveta's evening, and a contemplative shelf that mostly held. The physics tranches were checked at source rather than by search, and both Physical Review Letters volume 137 issue 9 and PRX Quantum are unchanged since Friday — no new papers beyond the quantum-walk and counterdiabatic-shortcut items already carried here, and the desk repeats its own correction rather than the trap: the PRX Quantum “99.999% fidelity X-gates on present superconducting hardware” paper is analytical and numerical, and the phrase describes a parameter regime, not a machine. What is new is an actual measurement, and after four days of theory-only tranches it deserves the space. In Nature Communications on Saturday, Alexander Ulanowski, Johannes Früh and Andreas Reiserer of the Technical University of Munich report cavity-enhanced optical readout and control of nuclear spin qubits — erbium-doped yttrium orthosilicate inside an optical cavity at cryogenic temperature, with 91% single-shot readout fidelity and coherence times of 0.2 seconds. Experimental, peer-reviewed, and the pairing of optical readout with a telecom-band emitter is the point rather than either number alone. This desk could not pin the article's own URL and does not invent one, and it did not capture the authors' stated limitations, which it would normally print; both gaps are declared. Physics World's feed, which is the reliable recency index where its news archive renders stale, confirms nothing after August 28. Quanta's physics tag tops out at Charlie Wood on von Neumann's 1927 trilogy from the 26th. The Quantum Insider has a French national roundup dated today, correctly an announcements digest rather than results — SEALSQ at $11m in first-half revenue, a $5m SEALSQ-Quobly agreement, €4.6m for a doctoral network — and Pasqal's second Nasdaq session cannot be reported at five in the morning because the market has not opened. Psychedelics were genuinely quiet, and this time both PsyPost verticals were checked directly, which is the discipline the desk adopted after publishing a false empty day on Saturday: the psychedelic-drugs vertical and the psychopharmacology vertical both top out at Friday's Bysiek psilocybin paper, with an explicit nothing for the 30th and 31st. Psychedelic Alpha remains stalled — Bulletin 229 from August 7, Field Notes 4 from August 21, still no Field Notes 5 — and its August 26 piece is analysis of the stale Definium readout rather than new data. On the contemplative shelf, Tricycle has advanced twice since Friday: “Living Images,” Matt Hanson on a Cologne exhibition of devotional objects, on Saturday, and “That Summer's End,” Lee Seong-bok translated by Anton Hur, on Sunday — Seon Buddhist elegies to impermanence read through French symbolism, which is closer to Sveta's shelf than most of what passes through here. Buddhistdoor and Essentia both hold at Friday. Lion's Roar could not be verified at all: its feed was fetched twice and returned unrelated content both times, which is a tooling failure rather than a confirmed silence, and the desk says so rather than reporting the source quiet. And from Nautilus, whose recency the desk could not establish at all on Sunday and could today via its dated listing: Anand Kumar, writing on Saturday as a member of the team revising the DSM, on the manual using biology to understand mental disorders for the first time. That is a first-person account of a classification system being rebuilt around mechanism rather than symptom, which is the kind of thing that changes what counts as a disease — and therefore, eventually, what gets reimbursed.",
        s: [["Nature Communications (Ulanowski, Früh and Reiserer: cavity-enhanced nuclear spin qubit readout)","https://www.nature.com/ncomms/"],["PsyPost (psychedelics vertical: nothing after Friday's Bysiek paper)","https://www.psypost.org/psychedelic-drugs/"],["Tricycle (latest: Lee Seong-bok, translated by Anton Hur)","https://tricycle.org/latest/"],["The Quantum Insider (French national quantum update, Aug 31 — announcements, not results)","https://thequantuminsider.com/2026/08/31/french-national-quantum-update-august-2026/"]] },
      { t: "August ended with no von Trier screenplay, a ticket page selling seats to an event that is not happening, and a Smithsonian story this desk may have been conflating with a different museum. Take the deadline first, because it was today's. Producer Peter Aalbæk Jensen's line was that before the summer break he heard Lars might, with a little luck, have written the manuscript around August. August is over and there is no confirmation, no denial and no Danish coverage of a delivered script — checked at Ekko, DR, Kino and Kristeligt Dagblad. A quote surfaced today that did not appear in this desk's earlier reads and that settles a rumour: asked about a Cannes 2026 premiere, Jensen said “filmen er ikke lavet, så der er ikke noget, der kan vises på en festival” — the film is not made, so there is nothing that can be shown at a festival. That matters because a second World of Reel trap has been identified, dated March 18, 2026, headlined that After is finished and aiming for Cannes; it is directly contradicted by the producer's own words and should be rejected alongside the September 2024 one. Two more Danish results that surface on manuscript queries are 2024 pieces that do not mention the film at all. The standing position holds: fifteenth and final film, 1.3m kroner from the Danish Film Institute, Stellan Skarsgård attached, photographs modelled on Chris Marker's La Jetée, and Jensen's estimate that at least two more years will pass before there is a finished film. On the Lynch weekender, day nine, both URLs were re-fetched live and the contradiction is intact. The homepage still says the 2026 gathering has been postponed to 2027 with new dates to be announced, navigation still stripped to Home, Previous Events and About Us. The orphaned tickets page is still selling — £99.50 a day, £180 the weekend with a “save £19” line, £310 VIP, a live Buy Tickets button, a link to the 2026 schedule, and copy urging visitors to buy the weekend “for the full experience.” The TicketTailor checkout behind it still returns 404. No outlet has corrected the record and the stale September 26-27 dates are still what a search surfaces. Refn has no cast for Maniac Cop; Noé remains a plain negative on an eleventh check; Criterion's Coming Soon page still stops at The Right Stuff on November 24 with no December slate, though it now confirms the September ladder in full — 12 Angry Men on the 8th, Shoah and Two Prosecutors on the 15th, The Secret Agent and Nouvelle Vague on the 22nd, Days and Nights in the Forest and Three Films by Leos Carax on the 29th. Venice's pre-opening screening, Tinto Brass's Deadly Sweet, is tomorrow. Now the correction, and it is a real one. This desk has been reporting a four-way disagreement about whether the Smithsonian Board of Regents would discuss or vote today on the American Women's History Museum. Hyperallergic's piece — the source of the word “vote” — is dated August 24 and is about the Latino museum, stating that the board will reportedly vote on housing that institution in the recently reopened Arts and Industries Building. The Art Newspaper has a matching August 21 piece on the Smithsonian racing to finalise a Latino museum site. So at least one leg of the four-way disagreement may have been about a different museum all along, and the desk cannot tell from what it can reach whether these are one agenda item or two. The regents page remains unreachable and no outcome for either has been reported. Publish “a decision is expected,” adjudicate nothing, and stop treating the Hyperallergic line as evidence about the women's history museum. On Kusama both questions stay open, and the access problem has widened: the artist's own site carries a passing announcement at yayoi-kusama.jp but that domain is robots-disallowed too, so neither her museum nor her estate site can be read here. No arrest or recovery in the Vienna necklace theft; no response from Kehinde Wiley. And the daily deaths check found one name that clears the bar and four that do not. Samuel Monroe Jr., who played Sharif in Menace II Society, died on August 27 aged 52 after a battle with meningitis, confirmed across four outlets. Four further names appear on a single aggregator and could not be corroborated anywhere — the Croatian musician Stjepan Jimmy Stanić, the Namibian writer Helao Shityuwete, the Italian conductor Antonino Fogliani, and the British graffiti artist known as Helch — and they are listed here as leads, not facts, on the Fabrizio Plessi precedent.",
        s: [["Ekko (von Trier: “the film isn't made, so there's nothing that can be shown at a festival”)","https://www.ekkofilm.dk/artikler/lars-von-trier-naermer-nyt-manuskript/"],["A Gathering of the Angels (the orphaned tickets page, still selling on day nine)","https://www.gatheringoftheangels.com/tickets"],["Hyperallergic (the Aug 24 “vote” piece is about the LATINO museum)","https://hyperallergic.com/amid-trumps-threats-a-potential-home-for-smithsonian-latino-museum/"],["TMZ (Samuel Monroe Jr., 1974-2026)","https://www.tmz.com/2026/08/27/samuel-monroe-jr-dead/"]] }
    ]}

  hooks: [
    { story: "KFF Health News published a piece on Friday that is, in effect, an audit of promises. Over the past year the administration has announced a series of voluntary agreements with health-industry firms: seventeen pharmaceutical companies agreeing to lower prices through TrumpRx, insurers pledging to cut prior authorisation, food companies pledging to remove dyes. Stephanie Armour went and checked what happened next. The insurers committed to reducing prior authorisation by 80% by January 2026; the measured reduction as of July is 11%. The food-dye commitment covers twenty-seven companies, of which seven have complied, and the deadline has been pushed from 2026 to 2027. The seventeen drug-pricing deals “apply narrowly to new drugs and Medicaid enrollees only,” there are no public dashboards tracking compliance, and the FDA has quietly moved deadlines without announcing it. Larry Levitt of KFF: “These deals are often not transparent, so there's no way for the public to judge how meaningful they are.” Leslie Dach of Protect Our Care: “It's just all talk. They just govern for a day of publicity, and then it's over.” An AMA survey finds one physician in three thinks voluntary pledges will make a meaningful difference. Today the administration is expected to announce another round of the same instrument, with mid-sized biotechs, in which the concessions are bought with tariff relief and possible exemption from Medicare pilot discount programmes.",
      src: ["KFF Health News","https://kffhealthnews.org/health-industry/trump-kennedy-food-dyes-price-deals-unenforced-vanishing/"],
      concept: "Cheap talk, and why a promise is worth exactly what it costs to break",
      q: "Open with the numbers and nothing else. Write 80% and 11% on the board, then 27 and 7, and ask what they have in common. Someone will say the companies lied. Do not accept that, because it is both uncharitable and analytically empty — push instead for the structural question: what would have had to be true for these pledges to bind? Now build the standard apparatus. A promise is a message. Ask what determines whether a message carries information. They will grope toward credibility; make them be precise about what credibility means here, and steer them to the sharp version: a message is informative only if the sender would have found it costly to send it falsely. Then ask the diagnostic question about each of these pledges — what did it cost the firm to make it, and what does it cost to break it? The answer to both is close to zero. There is no contract, no penalty, no third party with standing to sue, and, crucially, no measurement. Have them state the general result in their own words: an unverifiable promise conveys no information, so a rational listener should update on it not at all. Then hold that against the fact that markets and headlines plainly did update on these announcements, and ask who benefited from the gap between the announcement and the audit. Now make them do the harder half, which is the design problem, because the room will want to conclude that voluntary agreements are worthless and that is too easy. Ask what a voluntary agreement can do that a regulation cannot. The honest answers are real: it is fast, it does not require legislation, it does not require the agency to prove harm, and it lets the firm choose the cheapest compliance path rather than the one a rule writer imagined. Ask what it gives up in exchange. Enforceability, obviously — but push further, to the thing this article actually exposes. What it gives up is the measurement, and the measurement is the expensive part. A rule creates a reporting requirement almost automatically; a pledge does not, and someone must then decide to go and count. Ask who did the counting here. A journalist and a survey. Now the concept that generalises furthest, and the one worth writing down: monitoring is a public good. Everyone who consumes health care benefits from knowing whether the prior-authorisation pledge was honoured, and nobody has a private incentive to spend a year finding out. So monitoring is undersupplied, and any policy instrument that relies on external monitoring will systematically underperform relative to its announcement. Have them connect this to something they already know — ask why financial reporting is mandatory and standardised rather than voluntary and bespoke, and let them derive the answer rather than receiving it. Then get uncomfortable, because the second half of today's story deserves it. The mid-sized-biotech deals are reportedly being bought with tariff relief and exemption from Medicare pilot discount programmes. Ask them what kind of payment that is. It is not cash; it is regulatory forbearance. Ask where forbearance appears in the projected $64.3bn of government savings. It does not, because forgone future regulation has no line in a budget score. So the announced saving is a gross figure with the price left out. Ask them how they would estimate the missing cost, and let them find out how hard it is — you would need the counterfactual distribution of outcomes under a pilot programme that has not run yet. That difficulty is not a footnote; it is precisely why this form of payment is attractive to both sides. Close by turning it around, because a course that only teaches scepticism is not teaching economics. Ask under what conditions a voluntary pledge WOULD be credible. Push until they get to repeated interaction with a counterparty who can retaliate, observable output, and a reputation that carries commercial value. Then ask which of those hold for a pharmaceutical firm dealing with an administration it will face for at least two more years. Some of them do. That is the strongest version of the industry's case, and a student who can state it, having just seen the 11% and the seven-of-twenty-seven, is doing the thing you actually want."},
    { story: "On Sunday American forces struck Iranian targets on Larak Island, in what CENTCOM calls “limited, precise action” to stop mine-laying in the Strait of Hormuz. Brent responded: TradingEconomics shows $89.703, up 1.82% on the day, with the same page's text saying crude “climbed above $90 per barrel on Monday.” Now set that price beside the quantities. Four separate logs claim to track traffic through the strait, and they cannot all be right. GlobalSecurity calls Sunday Day 184 of the war, Windward via global-energy-flow calls it Day 183, and straits.live calls it Day 182 — three different day-counts of the same conflict, holding the same offsets they held on Friday. The baselines are worse. straits.live gives a pre-crisis norm of about 85 vessels a day and reports three transits on August 23, four per cent of normal. Windward now cites Lloyd's List at 114 transits in the week to August 23 against 73 the week before, and separately “approximately 5 vessels a day” — a framing this desk cannot reconcile with the 110-to-130 a day the same page carried on Friday. Kpler via Reuters last reported seven commodity vessels against a ten-day average of fifteen. CENTCOM says 82 vessels have been redirected. And the estimate that Gulf exports are back near 15 to 16 million barrels a day, which this desk published on Sunday attributed to Goldman Sachs, is no longer on the page; the same page now attributes roughly nine million barrels a day through Hormuz and about fifteen million across the Gulf to Energy Secretary Chris Wright. Nobody knows how many ships went through the Strait of Hormuz last week. Everybody knows what Brent closed at.",
      src: ["TradingEconomics","https://tradingeconomics.com/commodity/brent-crude-oil"],
      concept: "What a price knows that a count does not — and the limits of that claim",
      q: "Put the two halves on the board separately: on the left, four vessel counts that disagree; on the right, one oil price that everyone agrees on to three decimal places. Ask the room which side they would rather have if they had to forecast next month's diesel price. Most will say the price, and they will be right, but they will be right for the wrong reason — they will say it because it is a single number. Make them earn the real reason. Ask what a price actually is. Not “what buyers pay” — push past that. It is the outcome of a process in which everybody who has an opinion about future scarcity, and money to back it, has already acted. Ask what that implies about the information content of the number. The classic answer is Hayek's: the price aggregates dispersed private information that no central observer could ever collect, and it does so without anyone having to report anything. Have them apply it here. Who knows how many tankers cleared Hormuz last week? A few shipbrokers, some satellite firms, several navies, and none of them will tell you the same thing. Who knows what that traffic implies for scarcity? The same people, plus everyone hedging jet fuel, and all of them are in the Brent market. So the price is not merely tidier than the counts. It is a summary statistic that has already integrated all four of them and a great deal more. Now build the mechanism properly, because “prices contain information” is a slogan until they can say how it gets in. Walk through a trader who has proprietary evidence that traffic is worse than the public logs suggest. Ask what they do. They buy. Ask what happens to the price. It rises. Ask what has just happened to their private information. It has become public — not the information itself, but its implication for scarcity. Have them state the result: private information enters the price through the act of trading on it, which is why the price can be better informed than any observer, and why anyone who wants to keep an informational edge faces a trade-off between exploiting it and destroying it. Then use the strike to make the point about expectations, which is the part students most often miss. Ask how many barrels were physically lost on Larak Island on Sunday. As far as anyone reports, none — the strike was on rocket launchers and mine-laying capacity. So why did the price move nearly two per cent? Because the price is not a measure of today's scarcity, it is a probability-weighted statement about future scarcity, and the strike changed the distribution. Push them to say what changed: not the mean supply, necessarily, but the variance, and the perceived probability of a genuinely closed strait. Ask whether a rise in variance alone can move a spot price, and let them argue. It can, through inventories: if closure becomes likelier, holding a barrel today is worth more, so demand for storage rises now. Have them articulate that storage is the mechanism by which expectations about the future show up in the present, and note that this is why commodities with cheap storage have forward-looking spot prices and those without — electricity, fresh produce — do not. Now, the essential correction, and do not skip it. Ask what the price does NOT tell you. It does not tell you how many ships transited, and if what you need to know is how many ships transited — because you are insuring one, or crewing one, or writing the sanctions policy — the price is useless to you. Ask them to name the quantities the price cannot recover: volumes, composition, who is buying, whether the flow is legal. Then note the Chris Wright figure: roughly nine million barrels a day moving through a strait whose visible traffic several trackers put near zero. Ask how both can be true. Dark shipping, transponders off. So the observable count and the underlying flow have come apart, which means the counts are not merely imprecise, they are biased in a known direction. Ask whether the price knows that. It does, if the traders do. And that is the honest closing position: the price is the best available summary of scarcity and a terrible substitute for a measurement, and confusing the two is how people end up asserting that a strait is closed because a website says two hundred and something ships did not go through it."},
    { story: "New student visas issued by the United States fell 23% in 2025, and the composition is more informative than the headline. Degree-seeking F-1 visas fell 33.4%; J-1 exchange visas fell 9.9%; M-1 vocational visas fell 6.7%. By origin, India — the second-largest sending country in 2024 — fell 56.6%, China 28%, Myanmar and Venezuela by more than 70%, and Iran by more than 90% from a base above three thousand. The series is level through early 2025 and drops from May, the month student visa interviews were paused to implement social-media screening. NAFSA estimates the loss to the American economy at $3.4bn in 2026-27. Rajika Bhandari, who advises on international education: “Students who perceive the U.S. as an unpredictable destination may decide not to apply.” Layered on top, five universities — Berkeley, Irvine, Davis, USC and Washington — have suspended course-credit curricular practical training, and UC San Diego's own international office says it paused all F-1 CPT requests on August 12, the same day Berkeley's suspension took effect. The Defense Department has ordered thirty universities to audit their foreign partnerships, with today as the deadline. And NAFSA v. DHS, in which the government's response is due today, challenges a rule ending duration of status for F and J holders — with two graduate-worker unions among the eight plaintiffs, which tells you who inside the university thinks it is a labour case.",
      src: ["Inside Higher Ed","https://www.insidehighered.com/news/global/international-students-us/2026/08/26/new-student-visas-dropped-23-2025"],
      concept: "A quantity restriction in a market whose price cannot clear it — and where the incidence really lands",
      q: "Start by making them draw the market, and be strict about the axes, because the usual mistake happens right here. Ask what is being bought and sold. Somebody will say “education.” Fine — but then ask what the price is. Tuition. Now ask what a visa denial does to that market. They will reach for a quota, and that is correct, so draw it: a vertical line to the left of the equilibrium quantity, and above it a gap between what the marginal admitted student would pay and what the excluded student would have paid. Ask who captures that gap. In a standard quota the answer is whoever holds the licence, and the rent is real and transferable. Ask who holds it here. The State Department, which cannot sell it. So the rent is not captured by anyone — it is destroyed. Have them name the general condition: a quota generates rents only if the right to the restricted quantity can be traded, and a non-transferable administrative quota converts what would have been a transfer into pure deadweight loss. That is worth writing down, because it distinguishes this from a tariff or an auctioned licence, both of which raise revenue. Now attack the obvious response and make them work. Ask why the university does not simply cut the price. If the demand curve has shifted and seats are empty, lower tuition should fill them. Let them find the answer themselves: the constraint is not on willingness to pay, it is on the right to enter. A student in Hyderabad who is refused a visa will not enrol at any price, including zero. Have them state the principle — when a market is rationed by a non-price instrument, the price loses its ability to clear, and the observed price stops carrying information about scarcity. Then ask what a university does instead, and steer them to the real answers: it recruits from other countries, it substitutes toward domestic students, or it shrinks the programme. Ask which of those is cheapest, and whether they think a programme built on a particular pipeline can substitute quickly. Now do incidence, which is where this becomes a serious class rather than a policy complaint. Ask who bears the cost. They will say the students, and the universities. Push. Ask about the graduate students who already hold visas — why are two of the eight plaintiffs in the duration-of-status case graduate-worker unions? Because the doctoral labour market is one where the employer, the visa sponsor and the credential-granting body are the same institution, and a rule that shortens the permissible stay shifts bargaining power inside that relationship regardless of how many new visas are issued. Ask what happens to a worker's outside option when their right to remain is tied to a single employer and now has a fixed expiry. It collapses. Have them predict the effect on stipends, on hours, on willingness to complain — and note that this is monopsony theory applied to a legal restriction rather than a geographic one. That is the sharpest thing in the whole story. Then interrogate the $3.4bn, because they should not accept a number just because an association published it. Ask what it must be measuring. Presumably tuition plus living expenditure by students who will not now come. Ask what it would need to net out to be a real welfare figure — the domestic students who take those seats instead, the resources those seats would otherwise have consumed, the fact that some of the spending would have been financed from abroad and some not. Ask whether $3.4bn is an upper or lower bound on the true social cost, and let them argue both sides. The case for “too high” is substitution. The case for “too low” is everything the estimate cannot count: the research those students would have done, the firms they would have started, and the fact that a 33.4% fall in the degree-seeking category is a stock effect that persists for years after any policy is reversed. Close on the expectations point, because it is the one that will still be true in five years. Bhandari's line is about perceived unpredictability, not about any actual rule. Ask what it means for a durable investment — and a doctorate is one, four to seven years of a young person's life — when the rules governing it can change annually. Have them work out that uncertainty over policy raises the required return, which means the marginal applicant deterred is not the weakest one but the one with the best alternative somewhere else. Ask what that does to the average quality of who still comes, and let the room sit with the answer."}
