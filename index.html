<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

  brief: [
    { h: "World & geopolitics", items: [
      { t: "Tuesday was the deepest strike day of the war so far, and the ledger runs both ways. Russia’s Defense Ministry, via TASS, claims 791 Ukrainian drones intercepted across sixteen regions plus the Sea of Azov and the Black Sea, with named governors reporting the regional splits — 150-plus in Moscow Region (Andrei Vorobyov), 80-plus in Rostov (Yury Slyusar), 65 in Voronezh (Alexander Gusev), 33 in Tula, 25 in Kaluga. The Moscow figure is genuinely contested: PBS reports 600-plus drones headed toward the capital region with 180 downed, against Vorobyov’s 150-plus. Russian casualties were light — three wounded in Moscow Region including a 10-year-old girl, three in Ryazan — and the damage was commercial, which is where Meduza leads and TASS does not. The mirror entry the same day: a Russian missile strike on Pechenihy in Kharkiv Oblast killed 10 civilians and wounded 17, per regional administration head Oleh Syniehubov, part of a 24-hour Ukrainian toll of at least 19 killed and 53 injured across six oblasts from 147 Russian drones, 111 of them downed, with impacts at 19 locations. Zelensky: “We will definitely respond to this Russian strike.”",
        s: [["TASS","https://tass.com/politics/2174447"],["Meduza","https://meduza.io/en/news/2026/08/18/more-than-600-ukrainian-drones-target-moscow-wildberries-warehouse-damaged"],["Moscow Times","https://www.themoscowtimes.com/2026/08/18/over-600-ukrainian-drones-target-moscow-region-in-major-air-assault-a93519"],["Al Jazeera","https://www.aljazeera.com/news/2026/8/18/russia-reports-ukrainian-drone-strike-near-zaporizhzhia-nuclear-plant"]] },
      { t: "Two divergences worth reading side by side. The first is a single event carrying three different sentences: a drone hit near the Zaporizhzhia nuclear plant, killing one and sending sixteen or more for medical help per Russian-installed Energodar mayor Maxim Pukhov. TASS headlines it through the IAEA as an indictment — “Grossi urges to stop attacks on nuclear facilities after Energodar strike” — treating Ukrainian authorship as settled; Al Jazeera marks the same facts as an unverified Russian claim in its headline; the Moscow Times routes the sourcing through the IAEA and assigns no blame at all, quoting the plant director calling it “the worst event the plant has faced.” TASS applied the same technique to the drone wave itself, running it as an “attempted” attack and normalizing the scale by citing larger prior raids — 822 drones Saturday, 660 on June 26 — with no Ukrainian perspective in the piece. The second divergence is about direction. Lavrov escalated against London, saying Moscow may treat British involvement as “participation in the war, with all the ensuing consequences”; Ukrainian foreign minister Andrii Sybiha read the day’s strikes as stalling — “Putin continues to drag out the war instead of accepting Ukraine’s realistic ceasefire proposals and ending the bloodshed.” ISW’s Aug 18 assessment leads not with the front but with VEB’s dismissal of chief economist Andrey Klepach over an assessment that “contradicts Russian President Vladimir Putin’s theory of victory,” and says substantial evidence supports Klepach. From the other bench, Branko Marcetic in Responsible Statecraft names the Atlantic Council, CEPA and the American Foreign Policy Council as “hawkish, weapons manufacturer-funded” institutions whose breakthrough predictions keep failing: “a combination of wishful thinking and misinformation does just enough to keep the idea of a military victory alive, undermining the chance for painful but necessary negotiations.” One note for the record: no Witkoff or Kushner meeting with Putin was confirmed in this window, despite circulating items that turn out to be dated December 2025.",

      { t: "Inside Russia the pressure showed up in the exchange rate, the courtroom and the Black Sea. Kommersant reports the Central Bank’s official dollar rate crossed 85 rubles for August 18 — the first time since September 2025, which puts the ruble at its weakest in eleven months. Lev Shlosberg drew 11 years for anti-war speech; Meduza’s Russian-language framing is the flat one — “столько теперь можно получить в России за публичную антивоенную позицию,” this is what a public anti-war position now costs — and prosecutors had sought twelve, partly for reposting a Daily Mirror cover and for taking part in debates. St. Petersburg issued its first fine for publishing video of a drone strike’s aftermath. And Ukraine’s campaign against export logistics is now catching third-country shipping: a Greek-owned grain ship caught fire near Novorossiysk, the second Greek-owned vessel hit within 24 hours, after Ukrainian strikes halted most Russian Black Sea grain exports — a framing that does not surface in TASS coverage of the same days.",
        s: [["Коммерсантъ","https://www.kommersant.ru/doc/8891495"],["Meduza (RU)","https://meduza.io/feature/2026/08/17/lva-shlosberga-prigovorili-k-11-godam-kolonii-za-antivoennuyu-pozitsiyu"],["Moscow Times (grain ship)","https://www.themoscowtimes.com/2026/08/18/greek-owned-grain-ship-catches-fire-after-drone-attack-near-novorossiysk-a93525"],["Meduza (video fine)","https://meduza.io/news/2026/08/18/v-peterburge-vpervye-oshtrafovali-za-publikatsiyu-video-s-posledstviyami-ataki-dronov"]] },
      { t: "The Gulf is quiet in the air and loud everywhere else. Day 172 marked the nineteenth consecutive night with no US or Israeli strikes inside Iran and no Iranian ballistic launches, while Hormuz transits have collapsed to single digits against a pre-war norm of 130 to 140 ships a day and war-risk premiums sit at 7.5 to 10 percent of hull value versus 1 to 3 percent before. On talks the two capitals are flatly contradicting each other: Al Jazeera’s Wednesday liveblog runs as “Trump denies talks with Iran; Tehran claims US begging for negotiation,” with foreign minister Abbas Araghchi saying Washington is asking and Trump saying nothing is planned, reportedly irritated by an Iran-Oman Hormuz arrangement concluded without him. The UAE imposed an indefinite trade embargo over alleged missile attacks; Iran denies launching them and calls the incident “a false flag operation.” The IRGC’s Brig. Gen. Yadollah Javani says defensive efforts “might take on an offensive aspect” and warns of “strategic surprises.” The heterodox read arrived Wednesday morning from Glenn Diesen, whose new episode with former British diplomat Alastair Crooke is titled “Iran & Russia Give Up on Diplomacy & Go on the Offensive” — reading the nineteen quiet nights as repositioning rather than de-escalation. Alongside it, Djavad Salehi-Isfahani in Responsible Statecraft on how Iran has staved off economic collapse, and Larry Johnson on why Bessent’s sanctions program will fail.",

    { h: "Economy & markets", items: [
      { t: "Tuesday was the third straight down day and the long end did the work. The S&P 500 closed 7,691.76 (−53.30, −0.7%), the Dow 53,343.40 (−116.38, −0.2%), the Nasdaq 26,289.71 (−355.20, −1.3%) on a chip-led selloff, and the Russell 2000 3,017.89 (−1.3%). The 30-year Treasury yield touched 5.323% intraday — its highest since 2007 — before easing back under 5.3%, with the 10-year at 4.74%. Schwab’s desk note is the line worth keeping: bond yields and stocks now carry “the most negative correlation since 1997,” which is the bond market pricing inflation rather than growth, “at an auspicious time as corporate borrowing surges to fund AI spending.” Brent held near $90.71 and WTI $84.84 on the Gulf, gold $4,452.70. Today brings FOMC minutes at 2 p.m. Eastern from a meeting that held at 3.50–3.75% with three dissents — Logan, Hammack and Kashkari, all for a 25-basis-point hike, which is a hawkish configuration, not a dovish one. September hold pricing has risen to roughly 65%. Warsh’s first Jackson Hole keynote as chair is Aug 28.",

      { t: "Housing gave a genuinely odd print: July starts fell to 1,239,000 at an annual rate, down 12.4% from June’s revised 1,415,000 and 13.5% below July 2025, against a consensus near 1.35 million — with single-family at 808,000, the slowest pace since 2022. Permits went the other way, up 5.0% to 1,443,000. Builders are pulling back on what they break ground on while still buying the option to build later, which is a rational response to a 19-year high in the 30-year yield rather than a read on demand. Home Depot, reporting the same morning, beat and reaffirmed: net sales $47.9 billion (up 5.7%), comparable sales up 1.7% overall and 1.3% in the US, adjusted EPS $4.92 against $4.68, full-year guidance unchanged — and the stock rose more than 1% against a down tape. Walmart, Target and Lowe’s follow this week.",

    { h: "Health & policy", items: [
      { t: "The drug-price number held up under a second look; the credit for it did not. STAT’s Ed Silverman confirmed Tuesday that prescription prices fell 3.1% over the twelve months through July — the steepest annual decline since 1963 — with a 0.8% drop from June and a third consecutive monthly decline, then took apart the “promises made, promises kept” framing with the understatement that “like so much else in life, nothing is that simple.” The attribution problem is the interesting part: IRA-negotiated Medicare prices, generic and GLP-1 competition, patent expiry and index-weight effects all push the same direction, and none of them is separable from the index alone. Two live policy items sit underneath it — states must decide by September 30 whether to join a federal most-favored-nation drug pricing program for Medicaid, and California’s CalRx has now moved 120,000 five-pen packs of insulin glargine in seven months at a $55 suggested price against $89 to $411 for branded equivalents, under a $50 million contract with nonprofit manufacturer Civica. USC’s Geoffrey Joyce on the ceiling: “There is some value, but it’s for a very limited number of drugs for just a fraction of the population.”",

      { t: "The August Health Affairs is unusually teachable, and one of its papers is a null result worth more than most positive ones. Mackleby, Bejarano, Meiselbach, Meyers, Wilson and Trish find that most hospitals with vertically integrated Medicare Advantage plans charge similar prices to affiliated and unaffiliated plans — which is evidence against the input-foreclosure story that vertical-integration policy usually presumes. Alongside it: Wen, Soltoff, Unruh, Stevenson and Braun find hospice acquisitions by certain firms and corporations were associated with reductions in care intensity from 2010 to 2021, and Elani, Sommers, Roberts and Tipirneni find Medicare Advantage dental enrollment and generosity rose from 2010 to 2025 while continuity of coverage declined. In the same window STAT’s Bob Herman documents how health costs are squeezing public-sector employers — the setting where premium growth shows up as a visible municipal budget line rather than as an invisible wage offset.",

    { h: "Campus & culture", items: [
      { t: "Michigan has a new president. The Board of Regents on Tuesday selected C. Cybele Raver, provost and vice chancellor at Vanderbilt, as U-M’s 17th president and the second woman to hold the office, with formal approval expected in September. She holds a Yale doctorate in developmental psychology, joined Vanderbilt in 2021, and grew its research expenditures past $1 billion annually. Raver: “Michigan’s scale and impact across research, education, economic growth, and public service are unmatched.” Regents chair Michael Behm: “She understands what it takes to lead a complex, world-class university.” The other Washtenaw County story is still open — Ypsilanti Township’s six-month moratorium on new electrical transmission infrastructure, aimed at slowing U-M’s $1.2 billion computing center with Los Alamos, was scheduled for a board vote Tuesday and no outcome had been published anywhere by this morning. Bridge’s Monday piece remains the last word, with township attorney Doug Winters arguing “what they’re building is already going to produce more energy than what the rest of the township is using right now,” and DTE’s Ryan Lowry saying only that “our team is reviewing the proposed moratorium.” Also: the state Bureau of Elections found the voter-citizenship proposal short of valid signatures for the November 3 ballot.",
        s: [["Bridge Michigan (Raver)","https://bridgemi.com/talent-education/u-m-picks-vanderbilts-c-cybele-raver-as-next-president-what-to-know/"],["Michigan Public","https://www.michiganpublic.org/education/2026-08-18/university-of-michigan-names-vanderbilt-university-provost-as-its-next-president"],["Bridge (data center)","https://bridgemi.com/business-watch/ypsilanti-township-eyes-moratorium-on-power-transmission-to-slow-u-m-data-center/"],["Bridge (ballot)","https://bridgemi.com/michigan-government/state-voter-citizenship-proposal-shouldnt-make-michigan-ballot/"]] },
      { t: "Four separate federal pressures on universities landed inside 24 hours, and they are not the same kind of thing. Higher-ed groups sued over the four-year cap on student visas, under which students may stay only four years or 30 days past program completion, whichever is shorter — a rule that does not fit doctoral timelines; the Presidents’ Alliance’s Miriam Feldblum says the limits “do not align with actual program lengths or students’ educational needs.” The Pentagon told roughly thirty universities — Berkeley, UT Austin, Duke and Johns Hopkins among them — to audit collaborations with entities in China, Russia and Iran and report by month’s end or risk federal funding. The Justice Department opened an investigation into scholarship preferences at William & Mary’s law and education schools, materials due September 8, with Assistant Attorney General Harmeet Dhillon saying “we will not turn a blind eye to race-based preferences, however they are packaged.” And NIH proposed, in notice NOT-OD-26-088, replacing the 1-to-9 peer-review scale with three buckets — most competitive, competitive, not discussed — keeping scores internal; comment closes October 13. Forbes’s objection is the procedural one: “without clearly indicated scores, decision-making could become a whole lot more opaque and political.”",

      { t: "Mind & cosmos: the error-correction race produced a hardware result with real numbers attached. D-Wave published in Nature on an entangling gate for dual-rail erasure qubits, reporting roughly 99.9% gate fidelity at about 500 nanoseconds and an error-reduction factor of ten, against a roadmap of 100 logical qubits by 2032 running more than a million operations. Chief scientist Robert Schoelkopf argues the results show the architecture “can deliver the speed, fidelity and error-correction efficiency required for practical, fault-tolerant quantum computing”; CEO Alan Baratz frames the field’s problem as no longer qubit count but error correction that scales. One date caveat worth carrying: the primary announcement is August 5 and was recirculated on the 18th, so it is fresh in the feeds rather than fresh in fact. Wednesday’s arXiv quant-ph listing carries 82 new entries, among them Chiara Marletto’s “Universal quantum theory from dynamical consistency” — constructor theory, for the foundations shelf. On the pharmacology side, a Penn Medicine group reports in Nature Neuroscience that a single dose of psilocybin produced rapid and sustained relief of allodynia and anxiodepressive-like behavior in mouse models of chronic pain, with the effect outlasting acute drug exposure. And Toronto approved a Kagyu Monastery plan to put a Tibetan Buddhist temple atop a thirteen-storey tower combining housing, retail, daycare and visitor accommodation — an unusually urban answer to the question of what a monastery is for.",

      { t: "Director watch has its Lynch item, and it arrives with an argument attached. Criterion’s November slate puts Wild at Heart on 4K UHD on November 17 in a new restoration of the unrated international cut, overseen by cinematographer Frederick Elmes with David Lynch Estate approval, a new 5.1 mix by Dean Hurley and an introduction by Dennis Lim — the 1990 Palme d’Or, restored under estate authority. The same slate releases K-Pop Demon Hunters on 4K two weeks earlier, which The Playlist notes “will almost certainly raise eyebrows among some of the Collection’s more staunch cinephile devotees,” while conceding “it’s also difficult to argue with the reality of the movie’s impact.” Canon formation happening in public, in one month, is more interesting than either title alone. At the box office Aug 14-16: Spider-Man: Brand New Day held first with $70.7 million (−51%, $786.5 million cumulative), Nolan’s The Odyssey took second with $23.6 million and passed $505 million domestic, David Robert Mitchell’s The End of Oak Street opened third at $21.0 million, and Katseye: Wild Hearts opened on just 724 screens. Nolan’s Odyssey is simultaneously the lead essay in the August 20 New York Review — Daniel Mendelsohn, “Artful Weaving.”",

  hooks: [
    { story: "California's CalRx has distributed 120,000 five-pen packs of insulin glargine over seven months at a $55 suggested price, against $89 to $411 for branded equivalents, under a $50 million contract with nonprofit manufacturer Civica. Three drugmakers control more than 90% of the global insulin market — and before CalRx shipped, incumbents and PBMs had already capped patient copays at $35 a month.",
      src: ["KFF Health News","https://kffhealthnews.org/health-care-costs/gavin-newsom-calrx-state-branded-insulin-generic-biosimilar-drugs-rollout/"],
      concept: "Entry, limit pricing & entry deterrence in a concentrated market",
      q: "Set this up as an entry game. Three incumbents hold 90%-plus of a market with high fixed costs and a regulatory moat; a state-sponsored nonprofit entrant announces a $55 price. Then notice the sequencing: the $35 copay cap arrived BEFORE the entrant shipped. Ask students whether a $35 out-of-pocket price is a competitive response, an accommodation, or a deterrent — and what distinguishes those three in the model. Push on the wedge that makes this interesting: the incumbents cut the price the patient sees while leaving the price the system pays untouched, which means they conceded on the margin the entrant was competing on and kept the margin that funds them. Ask what the entrant would have to do to threaten the second margin, and why a $50 million contract for 120,000 packs may not be enough to make the threat credible. Good closer: Geoffrey Joyce says the value is real but 'for a very limited number of drugs for just a fraction of the population' — so is CalRx best understood as entry, or as a costly signal that regulators could enter?" },
    { story: "New Health Affairs research finds that hospice acquisitions by certain firms and corporations were associated with reductions in care intensity between 2010 and 2021 — in a sector paid a fixed daily rate per enrolled patient regardless of how much care is delivered that day.",
      src: ["Health Affairs","https://www.healthaffairs.org/doi/10.1377/hlthaff.2025.01535"],
      concept: "Principal-agent problems & the incentive geometry of per-diem payment",
      q: "Write the hospice's problem under a per diem: revenue is a constant times patient-days, so every visit, every nurse hour and every drug is a pure cost to the agent and invisible to the payer. Ask students to predict the profit-maximizing intensity before showing them the finding — most will get the direction right, which is the point. Then make it harder. Why doesn't reputation solve this? Identify who observes quality (families, briefly, under duress), who chooses the provider (often a referring hospital), and who pays (Medicare) — three different parties, which is why the market does not discipline the way the textbook says. Now ask what payment reform would fix it and what each fix breaks: fee-for-service restores the intensity incentive but invites overtreatment; quality-linked payment requires measuring something families can verify; capitation with outcome adjustment requires risk adjustment nobody trusts. Extension for the ambitious: the paper finds the effect for 'certain firms,' not all acquirers — what does heterogeneity in the response tell you about whether this is an incentive story or an ownership story?" },
    { story: "July housing starts fell 12.4% to a 1,239,000 annual rate — single-family at 808,000, the slowest since 2022 — while building permits rose 5.0% to 1,443,000. The same month, the 30-year Treasury yield hit 5.32%, its highest since 2007.",
      src: ["Calculated Risk","https://calculatedrisk.substack.com/p/housing-starts-decreased-to-1293"],
      concept: "Irreversible investment, sunk costs & the option value of waiting",
      q: "Starts and permits moved in opposite directions in the same month, which looks like a contradiction and is not. Ask what a permit actually is: cheap, expiring, and reversible. Ask what a start is: largely sunk the moment the foundation is poured. Then give them the Dixit-Pindyck intuition without the math — when an investment is irreversible and the future is uncertain, the option to wait has positive value, so the correct hurdle rate exceeds the cost of capital and a builder can rationally decline a project with positive expected NPV. Have them show that rising rate volatility raises the option value even if the expected rate path is flat, and ask which of the two series should therefore move first. Then reverse it: what would you have to observe to conclude this is a demand collapse rather than an option-value story, and does the permits number rule that out? Closing question with teeth: if the option to wait is valuable to every builder simultaneously, is the aggregate delay efficient?" }
  ],
  pulse: [
    { cat: "Listening", t: "The Spotify chart and the Hot 100 are no longer the same country",
      why: "Ella Langley's Choosin' Texas holds both — 18th week at Hot 100 No. 1, one from tying the 19-week non-holiday record shared by Old Town Road and A Bar Song (Tipsy), and 10.1 million US streams on the week. But below it the two lists diverge completely. Spotify's US weekly has Malcolm Todd's Earrings at 7.7 million, Steve Lacy's oh yeah? at 7.4 million, Tame Impala's Loser at 6.7 million, Olivia Rodrigo's stupid song at 6.4 million — and at No. 10, The Killers' Mr. Brightside from 2003, at 5.6 million streams, outperforming most of the current Hot 100 top ten. A 23-year-old song is a live chart entry for listeners born a decade after it came out.",
      rec: "If you want one line that gets a room talking, ask what's in their rotation that's older than they are, and why. The answers are specific and unembarrassed, and they hand you a free lesson in how a catalog with zero marginal cost stops having a release date.",
      src: ["kworb / Spotify US weekly","https://kworb.net/spotify/country/us_weekly.html"] },
    { cat: "Watching", t: "Criterion put Lynch and K-Pop Demon Hunters on the same slate",
      why: "The November lineup announced last week gives David Lynch's Wild at Heart a 4K restoration of the unrated cut on Nov 17 — overseen by cinematographer Frederick Elmes with estate approval — and releases K-Pop Demon Hunters on 4K on Nov 3. The Playlist wrote that the second pick 'will almost certainly raise eyebrows among some of the Collection's more staunch cinephile devotees,' while granting that 'it's also difficult to argue with the reality of the movie's impact.' Your students are the constituency that made the second film a phenomenon, and many of them know exactly what the Criterion spine means. Watching a canon renegotiate its boundary in public is more interesting to them than either film.",
      rec: "This is the rare culture item that works as a genuine question rather than a reference: ask what makes something worth preserving, and who should decide. It runs five minutes and it is a real argument, not a quiz on whether you know the film.",
      src: ["The Playlist","https://theplaylist.net/criterion-november-2026-kpop-demon-hunters-wild-at-heart-marie-antoinette-20260814/"] },
    { cat: "Reading", t: "One author holds five of the top fifteen fiction slots",
      why: "Matt Dinniman's Dungeon Crawler Carl series occupies positions 8, 10, 11, 13 and 14 on the current New York Times fiction list simultaneously. It is LitRPG — a serialized, originally self-published genre that borrows its structure from game mechanics, with stat blocks and level-ups on the page. The reason the backlist charts alongside the new release is that readers acquire the whole series at once rather than one book at a time, which is the reading equivalent of a season dropping all at once. This is a distribution story more than a taste story, and it is invisible if you only look at what is at No. 1.",
      rec: "Nothing to deploy in class. It is useful context for advising: a student who says they 'don't really read' may be forty hours into a series that never appears in a syllabus conversation, and asking about format rather than title gets you a truer answer.",
      src: ["NYT fiction list (Aug 16)","https://www.nytimes.com/books/best-sellers/"] },
    { cat: "Online", t: "Pinkchyu, and the cost of a persona",
      why: "Lin Lamar — 4 million-plus followers across TikTok and X — went viral after a Nelk-channel dating show in which she got Drake to bark like a dog, won the episode, and was promised a house for her mother. The second act is the one worth understanding: unretouched, makeup-free photos of her circulated as a gotcha, and the argument that followed was about whether an aesthetic that is obviously constructed can be exposed at all. Under-25s conduct authenticity fights with a level of theoretical precision that tends to surprise people who only see the surface of it.",
      rec: "Context, not material. If a student references this, the useful thing to know is that the discourse was largely on her side, and that the framing was about labor and construction rather than about deception.",
      src: ["Know Your Meme","https://trending.knowyourmeme.com/editorials/guides/who-is-pinkchyu-the-memes-about-the-goth-baddie-who-made-drake-bark-during-a-dating-show-explained"] },
    { cat: "Playing", t: "Kyiv ships a Chornobyl expansion tomorrow morning",
      why: "S.T.A.L.K.E.R. 2: Cost of Hope arrives Thursday at 9 a.m. Eastern from GSC Game World in Kyiv, alongside a free Update 2.0 that moves the whole game to Unreal Engine 5.5 and rebuilds the A-Life AI. The paid expansion opens the Chornobyl Nuclear Power Plant as an explorable location and continues the Duty-versus-Freedom faction storyline. The studio has shipped through the war, and the students who play this know that — it is one of the few places where your geopolitics reading and their Thursday night are the same subject.",
      rec: "One sentence in a Thursday class is enough: a Kyiv studio is shipping a major engine rebuild this morning, mid-war. It reminds a room that the war has firms and workers in it, not only armies, and it costs you nothing in credibility because you are reporting rather than performing.",
      src: ["GameRant","https://gamerant.com/stalker-2-cost-of-hope-dlc-release-times-countdown-when/"] },
    { cat: "Online", t: "Netflix bought six hours of being first",
      why: "Rockstar's GTA 6 gameplay reveal premieres on Netflix on Aug 27 at 3 p.m. Eastern with a six-hour exclusivity window before it reaches YouTube for free; the game ships Nov 19. Footage leaked Tuesday anyway, nine days early — a beachfront scene showing a Focus stat rising 2% per made basketball shot, a $39 wallet and a $1,643 home value. The leak is the ordinary part. The interesting part is that a streaming service paid for six hours of priority on a trailer that becomes free the same evening.",
      rec: "Worth knowing rather than deploying — but if you want a hook, ask a class what Netflix actually bought. Most rooms get there: not the video, the ordering.",
      src: ["ScreenRant","https://screenrant.com/grand-theft-auto-6-gameplay-leak-netflix-stream/"] }
  ],
  classnote: { t: "Netflix has a six-hour exclusive window on the GTA 6 gameplay reveal (Aug 27, 3 p.m. ET) before the same video goes free on YouTube — and the footage leaked nine days early regardless. This is a compact lesson in windowing and the economics of priority. Start with what is being sold: the content has zero marginal cost, becomes free within hours, and cannot be withheld from anyone who waits. So Netflix is not buying the video; it is buying an ordering — a six-hour monopoly on being the place where it happened. Ask students to write down what that ordering is worth and to whom: to Netflix (sign-ups, session time, a news cycle), to Rockstar (a distribution partner's promotion in exchange for a delay that costs almost nothing), and to the viewer who waits (nothing lost but the conversation). Then break it: the leak means the window's value was partly destroyed before it opened, which raises the real question — is exclusivity a property right or a coordination device, and what happens to its price when enforcement is impossible? Good extension: compare to theatrical windows, embargoed reviews, and Wednesday's 2 p.m. FOMC minutes release, where the entire regulatory apparatus exists to make sure nobody gets a six-hour head start at all.",
    src: ["ScreenRant","https://screenrant.com/grand-theft-auto-6-gameplay-leak-netflix-stream/"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
