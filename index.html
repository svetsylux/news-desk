  pulse: [
    { cat: "Listening", t: "Dolly Parton’s catalogue surge has started falling as fast as it rose — about forty per cent in a single day",
      why: "On the Spotify US daily chart dated Aug 27 — kworb’s lag held at three days, so this is the freshest available — “Jolene” has fallen from 2,023,623 streams to 1,173,872 and from No. 1 to No. 2. “9 to 5” is down forty per cent, from 1,916,970 to 1,149,897. “Islands in the Stream” has slipped from third to sixth. And the top fifteen now holds three Parton tracks where it held seven the day before: “I Will Always Love You,” “Coat of Many Colors,” “Here You Come Again” and “My Tennessee Mountain Home” have all dropped out. Ella Langley’s “Choosin’ Texas” has retaken No. 1 at 1,334,454. Worldwide streams tell the same arc from the other side — 41.8 million on the day she died, 79.7 million the next day, and then this. So the whole event, peak to visible decay, took about seventy-two hours. This desk got the direction wrong twice in a row before it turned: on Friday it said the surge was decaying and it was accelerating; on Saturday it said it had accelerated, and it had already peaked.",
      rec: "This is the cleanest demand shock your students will ever get with a public, daily, free time series behind it. Ask them to guess the half-life before showing them, then show them: roughly a day. Then ask why grief-driven demand decays faster than, say, a film franchise’s — the answer is that nothing about the catalogue changed, only the salience did, and salience is the most perishable input in the economy.",
      src: ["kworb (Spotify US daily, chart dated Aug 27)","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Playing", t: "The Grand Theft Auto VI trailer is now the number one film on Netflix worldwide, ahead of everything Netflix actually paid for",
      why: "It was second on Saturday morning and it is first now: Netflix’s global film chart reads GTA VI: An Extended Look at 916 points, The Whisper Man at 713, Facing El Chapo at 625, The Secret Woman at 555, and Shrek down at seventh. That is a twenty-six-minute advertisement for a product that does not exist yet, ranked as a film, outperforming every actual film on the service. The traffic effect is measured — Sensor Tower puts Netflix web users up 125% and mobile up 50% against the average of the previous twelve Thursdays — and the exclusivity lasted six hours before the same video went free on YouTube. Four days on, Take-Two’s Strauss Zelnick has still said nothing about the terms. His only quotes on the arrangement predate the event and describe Netflix as “a great marketing partner… distribution partner,” with no mention of money in either direction.",
      rec: "Ask the room who paid whom, and take a show of hands before you say anything. Most will assume Rockstar bought the slot. Then give them the traffic numbers and the six-hour window and ask them to reconsider: a firm selling a $79.99 game in November has no distribution problem, and Netflix has an engagement problem it cannot otherwise solve. The silence about terms is the most informative thing either company has said.",
      src: ["FlixPatrol (Netflix global film chart)","https://flixpatrol.com/top10/netflix/"] },
    { cat: "Watching", t: "The film Warner Bros. buried opened to an A CinemaScore and roughly four times its distributor’s all-time best weekend",
      why: "Coyote vs. Acme took about $5.2m on Friday on top of $1.7m in Thursday previews, and the weekend is converging around $14m — with an A from CinemaScore, 95% from critics and a 94% audience meter. The other new wide release, The Dog Stars, took a C+ and roughly $7 to $8m on a budget reported anywhere between $70m and $110m. Spider-Man: Brand New Day took a fifth consecutive number one, about $22m, and stands at $891m domestic. The number worth holding onto is not the gross but the comparison: $14m is more than four times Ketchup Entertainment’s previous best of $3.1m for The Day the Earth Blew Up. One outlet is running this as an all-time box-office record, which it is not — it is a company record, and the difference is the whole point. This matters to your students specifically because they followed the campaign to get the film released; they experienced the shelving of Batgirl and Coyote as something done to them, and an A CinemaScore reads to them as a verdict returned in their favour.",
      rec: "The teachable asymmetry is that a distributor with $3.1m as its ceiling could profitably release a film that a studio with a slate to protect could not. Ask why. The answer is overhead and opportunity cost, not taste — and it is the same reason divestitures and secondary markets exist at all.",
      src: ["ScreenRant (Coyote vs. Acme’s opening weekend)","https://screenrant.com/coyote-vs-acme-box-office-opening-weekend-domestic-result/"] },
    { cat: "Reading", t: "The week’s new-release list is two-thirds genre, and the genre is dark-academia romantasy",
      why: "Book Riot’s Aug 25 new-releases roundup is a fair cross-section of what actually sells to under-twenty-fives right now, and the two with obvious pull are Analeigh Sbrana’s Heir of Prophecy — a kidnapped Chosen One, the Fae, and a magic school, which is the dominant BookTok formula in one sentence — and Meka James’s The Marriage Rebound, a Black sapphic romance built around a WNBA player. The rest of the list is literary and general: Edwidge Danticat’s Dèy, Jennifer Hillier’s Heart of Glass, John Manuel Arias’s Crocodilopolis, M.H. Foster’s The Demon Overlord’s Retirement Plan. Set that beside the bestseller lists, where Matt Dinniman still holds two slots with books that began as a free serial on a web forum, and the shape of the market is clear: the discovery function has moved almost entirely out of the bookstore and into recommendation, and the categories that thrive are the ones a reader can describe to a friend in six words.",
      rec: "Ask a student who reads romantasy to describe the genre’s conventions and time how long it takes — it will be under a minute, and it will be precise. Then ask what a genre convention does economically. It lowers search costs to almost nothing, which is why highly conventional categories dominate markets with no gatekeeper and weak price signals.",
      src: ["Book Riot (new releases, Aug 25)","https://bookriot.com/new-book-releases-august-25-2026/"] },
    { cat: "Online", t: "Know Your Meme’s August meme-of-the-month ballot is the closest thing to a monthly index of what they were actually laughing at",
      why: "The nominees, posted Aug 27, are Petra Parker — a Spider-Man fan-art trend; Roaming Characters at Universal Horror Nights, which is a theme-park meme that lives on X; John Politics; a wholesome trend called Kinda Chic; and Gucci Morty. Two things are worth noticing about that list rather than any single entry. First, four of the five are derived from existing intellectual property — a Marvel character, a theme park, Rick and Morty, a fashion house — which is the ordinary condition of internet humour now and not a decline from anything. Second, the ballot exists at all: Know Your Meme has been formalising a folk process into a dated monthly archive for years, and it is the only recency index of its kind that reliably carries timestamps. Note the mechanics that make it usable — individual entry pages are dated and reliable, while the trending feed serves cached renders and cannot be trusted for recency, which has caught this desk before.",
      rec: "If you want one item from this dashboard to actually use, it is this URL rather than any individual meme. Skim it once a month and you will have the reference set without having to be on the platforms. Naming one thing correctly and in passing is worth more than a lecture built around one, which ages in weeks.",
      src: ["Know Your Meme (August 2026 meme of the month)","https://knowyourmeme.com/editorials/poll/cast-your-vote-for-august-2026s-meme-of-the-month"] },
    { cat: "Watching", t: "An Oasis documentary premieres at Venice next week and is in cinemas eleven days later — and the audience for it is younger than you would guess",
      why: "Oasis: Don’t Look Back in Anger, directed by Dylan Southern and Will Lovelace and produced with Peaky Blinders’ Steven Knight, screens at Venice with both Gallagher brothers expected, then opens theatrically Sept 11 — a gap of days rather than the usual months, which is itself a signal about how confident the distributor is. The reason to put it on a Student Pulse card rather than a culture page is that the audience is not who it looks like. “Mr. Brightside,” twenty-two years old, sits at No. 13 on the US Spotify daily chart in its 312th week on the weekly chart; Shrek is in the Netflix global top ten; and the running joke among your students all year has been that 2026 is the new 2016. A Britpop documentary lands directly into that, and the people who will fill the screenings on opening weekend were mostly not born when the band split the first time.",
      rec: "Worth asking a class why nostalgia consumption clusters on a specific year rather than spreading evenly across a decade. A shared focal point is what makes a reference legible to strangers — and legibility, not sentiment, is what makes a nostalgia market big enough to release a film into.",
      src: ["The Upcoming (Venice 2026 preview)","https://www.theupcoming.co.uk/2026/08/11/venice-film-festival-2026-preview-boyle-mcdonagh-pattinson-affleck-and-oasis-at-the-lido-as-clooney-set-for-honorary-golden-lion/"] }

  classnote: { t: "A twenty-six-minute advertisement is currently the number one film on Netflix worldwide, and neither company involved will say who paid whom. This is the best two-sided-market example available this term, and every fact in it is public. The sequence: Rockstar premiered the Grand Theft Auto VI Extended Look on Netflix at 3:00 p.m. Eastern on Aug 27, and put the identical video free on YouTube and its own site at 9:00 p.m. — a six-hour exclusive window, not a paywall. Netflix returned errors worldwide for three minutes at 3:00 and was working again by 3:03. Sensor Tower measured Netflix web users up 125% and mobile users up 50% against the average of the previous twelve Thursdays. Three days later the trailer is not merely on Netflix’s film chart, it is at the top of it, ahead of The Whisper Man, Facing El Chapo and Shrek. Take-Two has said nothing about the terms; Strauss Zelnick’s only remarks on the arrangement predate the event and call Netflix “a great marketing partner… distribution partner,” with no money mentioned in either direction. Start by asking the room to write down, privately, who they think paid whom, and how much. Collect the guesses out loud. The overwhelming majority will say Rockstar paid Netflix, because that is what advertising looks like — an advertiser buys a slot. Now dismantle it with them rather than for them. Ask what Rockstar needed that it did not already have. The game sells for $79.99 on Nov 19 with preloads from Nov 12; the previous trailer did tens of millions of views on YouTube alone with no partner; the company has one of the largest owned audiences in entertainment. Ask them to name the distribution problem. There isn’t one. Then ask what Netflix needed. Netflix competes for hours of attention against exactly the thing this video is advertising, and it cannot buy six hours of near-universal attention at any price on the open market — there is no such market. Have them state the asymmetry in their own words: one party has an audience and no scarcity of distribution, the other has distribution and a scarcity of audience. Now formalise it as a two-sided platform. Netflix's value to subscribers rises with content that draws them in; its value to studios rises with subscribers. Ask what happens when a piece of content arrives that raises engagement without Netflix having to license a film library. It is pure margin on the platform side. Then ask the sharper question: is this content, or is it advertising? Make them argue it. If it is content, Netflix should pay for it. If it is advertising, Rockstar should pay for it. The reason nobody will say is that the answer reveals which firm believed it was in the weaker position — and both have an interest in nobody knowing. Ask what a disclosed price would do to each firm's next negotiation, and they will get there: it sets the reference point for every future crossover, and whichever direction it points, one side loses leverage permanently. That is the actual reason for the silence, and it is a general result about why prices go unpublished in thin markets with few repeat players. Now push into complements and substitutes, which is where the interesting economics lives. Ask whether a video game and a streaming service are substitutes or complements. Both, and the room should feel the discomfort of that. They are substitutes for the same evening hours, which is why Netflix has spent years talking about competing with games; and they are complements in that the trailer is content Netflix can show. Ask what it means for a firm to host its own competitor's advertising. It means the substitution is happening anyway, and the platform has chosen to be paid in engagement for a defection it cannot prevent. That is a real strategic pattern with a name — if you cannot stop disintermediation, monetise it — and it explains a great deal of platform behaviour that otherwise looks self-defeating. Then use the six hours, because it is the most carefully designed number in the whole event. Ask why six and not twenty-four, and not zero. Six hours is long enough that watching on Netflix was the only way to see it during the US afternoon, which is what generated the traffic spike and the three-minute outage; and it is short enough that no one who refused to sign up was lost, since the free version arrived the same evening. Have them describe what is being price-discriminated here, given that the price is zero on both sides. The currency is time and friction, not money, and the segmentation is between viewers who will not wait and viewers who will. Ask them to name three other markets that segment on impatience rather than willingness to pay — early access, expedited shipping, and queue-jumping at theme parks will come out — and note that in each case the seller is capturing something real from a customer who never opens a wallet. Close on the measurement problem, which is where students should end up sceptical of the whole thing. The Sensor Tower figures compare one Thursday to the average of twelve. Ask what that comparison cannot tell you: whether the visitors subscribed, whether they stayed, whether they watched anything else, and whether Netflix's own baseline was drifting. Engagement is the metric because engagement is the metric that can be measured within a week; retention takes a quarter. Ask them what they would need to see, and when, to know whether Netflix got a good deal — and then note that if Rockstar in fact paid nothing, Netflix cannot have got a bad one, which is precisely why the terms will stay unpublished.",

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
