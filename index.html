<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

    { h: "World & geopolitics", items: [
      { t: "Putin spent Saturday saying no in public, and the interesting part is which no. At the United Russia party congress in Moscow and in a same-day interview with Vesti journalist Pavel Zarubin, he addressed the peace track directly: “The proposals being conveyed to us are sometimes, I would say, exotic in nature and are unacceptable,” and “We are always ready for dialogue about peace, but only on the basis of the realities that have developed on the ground.” He declined to say which proposals, calling it “a kind of ‘probing’ along various lines regarding possible agreements” — so the substance is unknown and the rejection is not. On retaliation he was blunter: “The Kiev regime has set the goal of harming our economy. What did it do? It was the one to open this Pandora’s box… Do you want to disrupt our logistics? Well, our retaliatory measures will not be long in coming.” A translation note worth carrying, because the phrase is circulating as a verbatim quote: TASS’s own English renders the follow-on as Russian measures being “way more painful and way more devastating,” while Al Jazeera’s headline renders it “far more destructive.” Same remark, two renderings; attribute the phrasing to the outlet. He also told the congress the troops “continue to advance in all directions” and have “accelerated the pace of their offensive operations” — against which ISW’s Aug 22 assessment records confirmed Ukrainian advances in central Kostyantynivka, northeast of Oleksandrivka and west of Orikhiv, and reads the congress speech as Putin establishing United Russia as the war party ahead of an expected electoral win. ISW also notes Putin publicly acknowledged Ukrainian long-range strikes on Russia’s fuel infrastructure, which is an admission rather than a denial. On the Western side, the one meeting was Keith Kellogg with Zelensky in Kyiv, on Patriot interceptor shortages, which the Presidential Office called an “absolute priority” — and Kellogg left government in 2025 and now works independently, so this is not a White House engagement however it is captioned. No verifiable Witkoff, Kushner or Ushakov development exists in this window either; that is now three consecutive days of nothing, and the absence is worth stating rather than filling.",
        s: [["TASS (Putin, Pandora’s box)","https://tass.com/politics/2176519"],["Al Jazeera","https://www.aljazeera.com/news/2026/8/22/russian-strikes-kill-6-people-in-ukraine-day-after-shopping-complex-attack"],["ISW (Aug 22)","https://www.kyivpost.com/post/82911"]] },
      { t: "Saturday’s Ukrainian toll climbed through the day, and once again the slug froze before the body did. The Kyiv Independent’s piece, filed 08:40 and updated 12:58, reports at least 7 killed and 31 injured; its own URL still reads “kills-at-least-6-injures-26,” and Al Jazeera’s body — a mid-window figure — has 6 and 26. Earlier filings that are now superseded put it at 2 (AP, 03:20) and 5 (Washington Post). Use the body and the latest filing: 7 and 31. The regional breakdown is Kherson 3 killed and 13 injured with houses and apartments hit and a shopping centre destroyed without casualties, Donetsk 1 killed and 7 injured of whom 5 were in Kramatorsk, Sumy 1 killed and 6 injured including a 12-year-old, one railway worker killed overnight in Kyiv, and 1 killed with 5 injured in a daytime attack on Boryspil. New in this window and not previously reported: a Shahed damaged the Odesa Oblast border crossing with Moldova, which went briefly out of service. Ukraine’s Air Force says it downed or suppressed 3 surface-to-air missiles, 6 small cruise missiles and 182 drones; ISW counts the launch side as ballistic and quasi-ballistic missiles, three cruise missiles and 271 drones — launched versus intercepted, not a contradiction, and not to be merged. Zelensky: “Every day that Ukraine lacks air defense is a day that results in casualties that could have been avoided.” Friday’s Kryvyi Rih shopping-centre double-tap has now settled at 16 killed, 9 still missing and more than 130 wounded, with 22 children among the injured per Al Jazeera — a figure that was not in yesterday’s accounting. Oleksandr Pertsovsky, head of Ukrzaliznytsia, reported the railway worker’s death; Russia’s Defense Ministry said it had struck “a locomotive depot.”",
        s: [["Kyiv Independent","https://kyivindependent.com/russia-kills-at-least-6-injures-26-civilians/"],["Al Jazeera","https://www.aljazeera.com/news/2026/8/22/russian-strikes-kill-6-people-in-ukraine-day-after-shopping-complex-attack"],["ISW (Aug 22)","https://www.kyivpost.com/post/82911"]] },
      { t: "Ukraine hit four categories of target at once, and Russia’s own deputy prime minister described how the fuel gap is being closed. Overnight into Saturday: the Novokuibyshevsk refinery in Samara Oblast, a Rosneft plant with 8.8 million tonnes of annual capacity producing aviation fuel, diesel and army lubricants, left burning — Ukraine’s General Staff confirmed “a fire on the refinery’s grounds”; the Ozon logistics centre at Chapayevsk, 75,000 square metres, with over 500 employees evacuated and several injuries, the first strike on an Ozon facility after weeks of hits on the larger rival Wildberries; the Saky airbase in occupied Crimea, one Su-24M destroyed and four pieces of airfield equipment damaged; and relay stations in Bryansk. Saturday evening added the Yeysk oil terminal in Krasnodar Krai, a port handling about 6.8 million tonnes of cargo a year including more than a million tonnes of petroleum products. Overnight into Sunday a second Ozon centre was hit at Orenburg, roughly 1,000 kilometres from the border, with damage not yet assessed and no Ukrainian claim of responsibility. The Ukrainian Defence Ministry’s framing: “Systematic strikes on storage centers for dual-use goods are making it more difficult for the enemy to operate and are negatively impacting the overall economy of Russia.” The mirror ledger, as always, does not reconcile and is not meant to — Russia’s Defense Ministry claims 457 drones intercepted between Friday night and Saturday morning and a separate 250 destroyed between 08:00 and 20:00 Moscow time on Saturday across seventeen regions; Sergey Sobyanin reported six shot down heading for Moscow on Sunday. Russian-side deaths run to at least six: two killed and thirteen wounded in Belgorod, two civilians including a 16-year-old in occupied Luhansk with nine wounded, four wounded in Bryansk, and in Yeysk a figure that moved — Krasnodar governor Veniamin Kondratyev is cited for three killed including two children, while the Moscow Times body has two children killed and two adults wounded, most consistent with an adult dying of wounds. On the economics, Deputy Prime Minister Alexander Novak conceded the mechanism outright: “The main sources for making up for the deficit are imports and production of K-2, K-3, and K-4 fuel.” That is imports plus downgraded fuel standards, stated by the government rather than inferred. RIA Novosti, describing a “second wave of tension,” prices it: roughly 76 roubles a litre at the pump in early August, imported gasoline at 105,000 roubles a tonne on the St Petersburg exchange, and 360 tonnes of Indian-refined gasoline sold through it.",

      { t: "On Iran the strike pause held a 23rd night and the sanctions package is still, twenty-four hours out, entirely undescribed. GlobalSecurity’s Day 176 log confirms no US or Israeli strikes on Iranian territory through Saturday morning, dating the pause to a presidential cancellation of a multi-day campaign on Aug 1; a 24th night is not yet verifiable and should not be asserted. The blockade now has an accounting: 68 commercial vessels redirected, three disabled and two boarded, supported by more than twenty warships, with four commodity vessels transiting on Aug 20 and none of them carrying crude or LNG. Alongside that runs a reported nightly convoy of 15 to 20 tankers through the southern Omani channel under air cover, and war-risk premiums at 7.5 to 10 percent of hull value. Brent finished the week between $93.82 and $94.39 depending on whose settle you take, against a roughly $66 pre-war baseline, with US retail gasoline averaging $4.11 a gallon. Tehran spent Saturday talking to third countries rather than to Washington. Mohsen Rezaei, secretary of the Supreme National Security Council: “We’re telling all nearby countries not to join the US economic war. Otherwise, we will consider them as enemies” — followed immediately by “First we negotiate. Then, we try to separate them from America with pleasant language, because we are not really looking to expand the war,” which is an unusually explicit statement of sequencing. Foreign Minister Abbas Araghchi, on the sanctions: “We have seen this movie before. Same bull. Different bullies.” Spokesman Esmaeil Baghaei made the legal argument — that secondary sanctions imply “the complete erosion of sovereignty as the foundational basis of the UN-based inter-State system, and a recipe for an abysmal return to full-scale classic colonialism” — while the Foreign Ministry called the package a “declaration of war on all nations.” Trump’s position is that he regards “the Strait of Hormuz as an American territory right now,” and that Iran “would love to make a deal. But they are not ready to make the right deal.” Bessent has still named no country, company or sector, saying only that he will “talk about exactly what we’re going to do” at Monday’s press conference and declining to say whether China is a target; the package remains dark, which is itself the fact. From the heterodox bench, Larry Johnson’s Saturday essay argues the whole architecture is self-defeating on its own history — “Every time the war on Sunni terror collided with the war on Iran, the war on Iran won” — while Glenn Diesen’s Friday conversation with Pascal Lottaz frames the war as a symptom of the transition out of unipolarity rather than a discrete crisis. Nothing verifiable on Israel–Lebanon in this window; the operative mediators’ statement remains Türkiye, Egypt and Qatar’s Aug 20 warning from Doha that “the intensification of Israeli attacks undermines regional and international efforts at a critical juncture.”",

      { t: "Markets are shut, so this is a week-ahead, and the week is unusually front-loaded with things that move prices. Wednesday Aug 26 carries the July PCE deflator (consensus +0.1% headline, +0.2% core), a second read on Q2 GDP at 1.5%, durable goods at +0.7% — and, after the close, Nvidia, where consensus is $2.09 a share on $92.07 billion of revenue, roughly a doubling year over year. Friday Aug 28 stacks the Chicago PMI at 57, final Michigan sentiment at a notably depressed 51.0, the annual benchmark revision to nonfarm payrolls, and Kevin Warsh’s first Jackson Hole keynote as Chair, at 10:00 a.m. Eastern. Two cautions on that calendar: it comes from a single source, TradingEconomics, and PCE landing the same day as GDP is off the usual BEA pattern, so treat the Wednesday cluster as provisional; and the Kansas City Fed does not normally publish the full agenda until the night before, so the keynote time is a working estimate. The symposium theme is “Financial Innovation: Implications for Payments and Policy.” Expectations for the speech itself should probably be low, and Warsh has said as much — “I look at it like a blank piece of paper right now. I have not begun consideration with the incredible team here what would go into that document.” Eamonn Sheridan at investinglive argues the hype outruns the man, who has minimized forward guidance since May, and that the committee split is the real signal: roughly half of FOMC members penciled in 2026 rate increases at the June meeting and three regional presidents dissented for hikes in July, which he calls an unusually high level of dissent this early in a chair’s tenure. Keep the direction straight — the live question at this Fed is a hike. Meanwhile Friday’s closes are now corroborated a fourth way, resolving yesterday’s bookkeeping problem: Investrade independently puts the S&P 500 at 7,674 (+0.43%), the Dow at 53,276 (+0.98%), the Nasdaq at 26,180 (+0.43%) and the Russell 2000 at 3,017 (+0.85%), with the week at −1.43%, −0.85%, −2.05% and −1.6% — matching both the levels and the deltas this brief carried provisionally. The 10-year finished at 4.737% and the 30-year at 5.276%, up 4.1 and 3.9 basis points on the day. That last number is the week’s quiet verdict. Bessent’s Aug 19 buyback expansion doubled the per-operation cap on 10- to 30-year Treasuries from $2 billion to $4 billion and knocked about 10 basis points off the long bond to roughly 5.19%; it closed the week above where it started, with total federal debt now past $40 trillion.",

      { t: "Bitcoin held its gain over the weekend and extended it, gold logged a third straight winning week, and the ruble did something worth a second look. Bitcoin traded at $78,335 as of Sunday morning, up 7.26% on the day, with Ethereum at $2,515 (+8.12%), Solana at $93.65 (+6.87%) and XRP the biggest mover at $1.4538 (+14.61%); US spot Bitcoin ETFs took in $606 million on Aug 20, of which BlackRock absorbed 83%, and Ether funds $221 million. Standard Chartered’s Geoff Kendrick: “There is now a risk my end year forecast (of $100,000) is too low.” One housekeeping note — three outlets call this the best week since 2023, since 2024, and “in two years” respectively; the price is corroborated, the superlative is not, so publish the former. Metals: December gold futures settled at $4,680.60 (+2.39%) against spot near $4,608, September silver at $69.53 (+2.09%) against spot near $68.99 — futures and spot, not a conflict. Gold is up more than 5% over three weeks. Wells Fargo’s Sameer Samana, head of global equities and real assets strategy, sees $4,900 to $5,100 by year-end and $5,400 to $5,600 by end-2027, but with a caveat that doubles as independent corroboration of the rate story: “If the Fed funds futures market is embedding two to three hikes, then I think the price of gold is embedding two to three hikes,” and near term he sees “risk to the downside to $3,500.” Crude settled at $87.06 WTI and $94.39 Brent, with WTI up $5.59 or 6.86% on the week, its largest weekly gain since late July. And the ruble: the CBR’s own series shows 85.1293 on Aug 20, 83.3550 on Aug 21 and 82.9211 on Aug 22 — a 2.6% appreciation in two sessions and the strongest level in the visible window, which is a larger move than this brief implied when it reported the fixings one at a time. No Aug 23 fixing is published yet; the key rate stands at 14.00% with the next board meeting Sept 11. Worth pairing with a CEPR column published Aug 19 on using satellite data to track Russia’s wartime economy — the revealed preference of researchers paying a large measurement cost to avoid free official statistics.",

    { h: "Health & policy", items: [
      { t: "Two consultancies now disagree by 1.6 points about 2027, and the composition of this year’s increase is more interesting than either forecast. Willis Towers Watson projects employer health costs rising 11.1% next year — which the Wall Street Journal characterizes as potentially the steepest spike in nearly two decades — against Aon’s 9.5% to more than $19,000 per employee. Both are consultancy projections marketed to benefits buyers rather than independent actuarial estimates, and the gap is partly methodological, so the forecast to watch is neither number but the decomposition underneath. Aon’s 2026 figures: total plan cost $17,562, up 8.3%; employer contribution $14,432, up 8.8%; employee contribution $5,297, up 7.9%; and out-of-pocket $2,167, up 10.2%. The fastest-growing component is the one that is not a premium at all. Jeff Levin-Scherz of WTW: “Employers are telling us that this is utterly unsustainable.” On the individual market, Peterson-KFF’s compilation of 276 insurers across all fifty states holds at a 15% median proposed increase for 2027, but the spread is the story — filings range from −1% to +54%, with the interquartile range 11% to 22%. In a subset of 77 insurers across sixteen states plus DC, the median underlying medical trend for 2027 is 10%, against roughly 8% in prior years; about four percentage points are attributed to risk-pool deterioration from the expired enhanced premium tax credits, and one insurer attributed 0.8 points specifically to the No Surprises Act arbitration process. That last line has a court case behind it: on Aug 13 the Fifth Circuit, in Texas Medical Association v. HHS, vacated core parts of the qualifying payment amount methodology, striking insurers’ inclusion of “ghost rates” — contracted rates for services a provider does not actually furnish, which drift toward zero because nobody has any reason to negotiate them upward — on the ground that the QPA “should be comprised of rates for services actually furnished by a provider,” and also striking the exclusion of risk-sharing and bonus compensation. Since the QPA is the anchor in baseball-style arbitration, where providers already win about 85% of disputes and awards exceed the QPA roughly 87% of the time, raising the anchor raises every downstream award. It is a provider win whose cost lands on premium payers rather than on insurers. The exits continue in parallel: Cigna leaves eleven state exchanges covering about 369,000 members, Molina goes from fourteen states to six, Centene drops Medicare Advantage in Oklahoma, Tennessee and Hawaii, and Humana sheds roughly 600,000 seniors, about 8% of its 7.2 million MA members.",

      { t: "The first cross-insurer prior-authorization denial data is out, and the variance is too large to be about medicine. KFF’s analysis of newly mandated CMS disclosures finds denial rates averaging 12% in Medicare Advantage, 14% in Medicaid managed care and 18% on the ACA marketplaces — but the within-market spread dwarfs the between-market spread. In Medicare Advantage, UnitedHealth denies 17% and Elevance 5%. In Medicaid managed care, Independence Health Group denies 23% and L.A. Care 2%. On the exchanges, Centene denies 25% and Guidewell 3%. Set against appeal outcomes, the numbers get sharper still: about two-thirds of appealed MA denials are overturned, half in Medicaid, and 43% of ACA denials are eventually approved. A 25% denial rate paired with a 43% reversal rate is hard to read as utilization management and easy to read as friction. KFF flags the obvious data limitation — insurers report percentages without total request volumes, in inconsistent formats and with no breakdown by service type, so none of this is volume-weighted. Three other items belong beside it. The Physicians Advocacy Institute, surveying 1,000 physicians, reports that more than 80% are now employed by hospitals, insurers or other corporations, against 25% in 2012, with more than six in ten practices corporately owned and private equity, insurers and other non-hospital entities together now owning more practices than health systems do; about half of corporately employed physicians report pressure to prioritize volume over quality, 63% report policies restricting outside referrals and 59% pressure to keep patients in-system. PAI is a physician-side advocacy body and these are self-reported perceptions rather than observed referral data, which is worth saying while noting that the ownership figures are not in dispute. In New York, EmblemHealth has sent Mount Sinai a cease-and-desist after the system quietly stopped accepting new Medicaid, Essential Plan, HARP and Child Health Plus patients on Aug 1 — a mid-contract throttling of the lowest-margin lines rather than a termination, with the contract running through January 1. And a detail in Medicare’s GLP-1 Bridge pilot that sharpens yesterday’s eligibility story: the $50 monthly copay counts toward neither the Part D deductible, the $2,100 out-of-pocket cap, nor the Medicare Prescription Payment Plan, and Low-Income Subsidy recipients — roughly a quarter of Medicare beneficiaries, with incomes below $24,600 — cannot apply cost-sharing assistance to it. The program is therefore regressive within Medicare, and there is no formal appeals process, only resubmission. On the two watch items: HHS and CDC’s vaccine recommendation-tier RFI drew coverage but no verifiable stakeholder response as of Sunday morning, and Heidi Overton’s FDA nomination saw no Senate movement over the weekend, leaving the agency without a confirmed commissioner since May.",
        s: [["Healthcare Dive (prior auth)","https://www.healthcaredive.com/news/prior-authorization-denial-rates-kff-medicare-advantage-medicaid-aca/"],["Healthcare Dive (PAI survey)","https://www.healthcaredive.com/news/doctors-say-they-feel-pressured-to-prioritize-corporate-interests-over-pati/828503/"],["STAT (vaccine RFI)","https://www.statnews.com/2026/08/21/rfi-reveals-possible-kennedy-strategy-vaccine-policy-changes/"]] }
    ]},
    { h: "Campus & culture", items: [
      { t: "A federal judge threw out the administration’s suit against Washtenaw County, and Bridge ran a statewide data-center piece that pointedly does not mention Ypsilanti Township. Judge F. Kay Behm dismissed the Justice Department’s case against the Washtenaw County sheriff, prosecutor and board of commissioners over the county’s sanctuary policies, holding that the county was exercising powers reserved under the Tenth Amendment and that nothing in the Immigration and Nationality Act requires local sheriffs to hold detainees at federal request. From the opinion: “Apparently flummoxed by the County’s decision to focus its resources on local priorities and public safety, the United States sues to demand Washtenaw County’s cooperation, the use of its jail cells, and its resources.” Separately, Bridge Michigan’s Aug 21 survey of data-center backlash finds at least 28 officials across eight Michigan communities facing recall efforts, with more than 34 communities tracked by the Economic Development Responsibility Alliance of Michigan — and covers Saline Township’s $7 billion OpenAI/Oracle project, Mason, Lyon Township and Marshall while never naming Ypsilanti Township, the U-M/Los Alamos center, Doug Winters or Brenda Stumbo. That is an editorial choice rather than a development, but it is a conspicuous one given that Saline Township is in the same county. Mason council member Elaine Ferris, eighteen years in office: “We have zero power to prevent this.” U-M’s Sarah Mills, associate professor of practice, is the expert voice in the piece. On Ypsilanti Township itself there is nothing new: no resolution number, no Sept 9 town hall coverage, and the frequently cited 110-megawatt DTE substation figure remains unconfirmed a week on. Wolverine Village opened for early move-in Saturday and Sunday with general move-in Aug 24–30, and no outlet has published day-of coverage, so whether it went smoothly is simply unknown; the Michigan Daily’s construction-delay report remains unverifiable because the site is robots-disallowed. Two details worth having: the five halls are Lake Superior, Lake Huron, Lake Michigan, Lake Ontario and Dr. E. Royster Harper Hall — the first U-M campus building named for a Black woman — and the 2,300 beds represent a 25% increase in undergraduate housing capacity. Elsewhere, state revenue is running $455 to $459 million above projection in the general fund and $195 to $220 million above in the School Aid Fund, on July receipts of about $3.1 billion, a 7% jump year over year; and Detroit’s renewed Pay As You Stay now has a hard deadline of Nov 6 at 4:30 p.m. for HOPE enrollment, alongside the Gilbert Family Foundation’s Detroit Tax Relief Fund, which has helped 13,000 homeowners erase more than $52 million in tax debt.",
        s: [["Michigan Public (Behm ruling)","https://www.michiganpublic.org/politics-government/2026-08-22/federal-judge-dismisses-trump-admin-lawsuit-against-washtenaw-county-sanctuary-policies"],["Bridge Michigan (data centers)","https://bridgemi.com/michigan-environment-watch/residents-and-officials-feeling-powerless-in-michigan-data-center-fights/"],["U-M Record (Wolverine Village)","https://record.umich.edu/articles/wolverine-village-is-a-new-model-for-living-and-learning-on-campus/"],["BridgeDetroit (PAYS)","https://www.bridgedetroit.com/are-you-behind-on-your-property-taxes-a-wayne-county-relief-program-is-back/"]] },
      { t: "The international-student case now has a hearing date twelve days before the rule bites. In NAFSA v. Department of Homeland Security, before Judge F. Dennis Saylor IV in the District of Massachusetts, a motion for preliminary injunction was filed alongside the Aug 18 complaint — not just the complaint, as first reported — and on Aug 19 Saylor set a briefing schedule: DHS response due Aug 31, in-person hearing Sept 3 at 11:00 a.m. The rule takes effect Sept 15. There are eight plaintiffs, not three: NAFSA, the Presidents’ Alliance, the Association of Independent Colleges and Universities in Massachusetts, the AFT, the Graduate Labor Organization AFT Local 6516, the UAW international, UAW Local 2322 and the NewsGuild-CWA. The rule replaces roughly fifty years of duration-of-status with four years or thirty days past the program completion date, whichever is shorter. The complaint’s central claim is an economics one: “DHS’s cost-benefit analysis is fundamentally defective. The agency acknowledged billions of dollars in quantified costs over ten years, but listed zero quantitative benefits” — against 22,000 public comments and an estimated $3.4 billion cost to the US economy from enrollment declines. Miriam Feldblum of the Presidents’ Alliance argues DHS “did not engage in the reasoned decision-making that’s required by the APA,” and adds the durable point: “when students don’t come, that’s not a relationship that can be repaired.” A DHS spokesperson: “The performative outrage is incredible. Where was the outrage when foreign nationals were abusing the system?” The other federal front moved to accreditation. On Aug 21 the Education Department began proceedings to strip the American Bar Association of its authority to accredit law schools, alleging violations in what it called nearly thirty ways; thirteen free-standing law schools would need new accreditors, and NACIQI takes it up Sept 23–24, with the ABA council separately voting Sept 8 on repealing its diversity standard. Assistant Secretary David R. Barker: “Accreditation, in general, operates like a cartel. When there’s no competition, accreditors feel free to inject their own political preferences, their own ideologies into the work that they do.” Justice Melissa Hart, who chairs the ABA’s legal education section: “The Council is confident it complies with the Higher Education Act and with the Department’s requirements for accreditors.” Two smaller items with teeth. The Chronicle reports two professors publicly singled out for using generative AI in their own published opinion writing while students face discipline for the same — Harvard Kennedy School economist Ricardo Hausmann, who used it to condense an essay on tariffs in violation of the Financial Times’ no-AI policy, and Berkeley’s Zvezdelina Stankova, who used it to edit a piece for the San Francisco Standard, which permits it. Hausmann’s defence is the question worth putting to a class: “The issue is whether the use of AI produces better ideas, or a cleaner written text that communicates those ideas better.” And for the syllabus itself, the best pedagogy piece to surface this week is by an economist — Temesgen Kifle of Queensland, on six assessment types built around economics tasks, including one in which students critique AI-generated sales forecasts and catch errors such as confusing correlation with causation.",
        s: [["Inside Higher Ed (visa suit)","https://www.insidehighered.com/news/global/international-students-us/2026/08/19/lawsuit-seeks-vacate-rule-ending-duration-status"],["Inside Higher Ed (ABA)","https://www.insidehighered.com/news/government/2026/08/21/ed-threatens-abas-ability-accredit-law-schools"],["Chronicle (AI in public writing)","https://www.chronicle.com/article/professors-were-singled-out-for-using-ai-in-public-writing-now-theyre-defending-themselves"],["THE Campus (Kifle)","https://www.timeshighereducation.com/campus/six-assessment-types-support-deep-realworld-learning"]] },
      { t: "Mind & cosmos: a thirty-year-old bound cracked at Michigan, a photonic processor doing real classification, and a psilocybin trial whose blinding failed completely. Nikhil Bansal at the University of Michigan and Haotian Jiang at Chicago improved the Komlós conjecture’s discrepancy bound from log(N) to the one-half power — the 1998 record — down to log(N) to the one-quarter, the first movement in nearly three decades. Daniel Spielman of Yale: “The fourth root of log(N) is very small… It’s getting pretty close to constant for every practical purpose.” Bansal’s own read is the modest one: “We hit a wall at a quarter root. Going beyond that will definitely require something very new.” The conjecture itself remains open. In Physical Review Letters, Si-Qiu Gong and colleagues at USTC ran image classification on jiǔzhāng 4.0, an 8,176-mode photonic processor averaging about 2,200 photon clicks, reaching 95.86% on MNIST and 85.95% on Fashion-MNIST and beating classical linear-kernel SVMs — while stating plainly that Gaussian boson sampling’s “application to practical real-world problems remains a central challenge.” Two more from the same week: Toshihiro Yada’s group at Tokyo shows that whether a many-body pure state looks thermal depends on the structure of its multipartite correlations rather than the amount of entanglement, with the counterintuitive result that maximally entangled states look more thermal, not less; and a NIST team led by C. M. Bowers gets Bell-state fidelities above 0.99 at motional occupations up to ten phonons, which is to say two-qubit gates without ground-state cooling. In psychedelics, a Cambridge group — Liliana Galindo, Anya Ragnhildstveit and Benjamin Illingworth — published a Nature Medicine commentary on delivering psilocybin-assisted therapy inside the UK public health system, responding to James Rucker’s Aug 6 feasibility RCT. The trial’s numbers are strong: 60 randomized, a week-three adjusted between-group difference of −10.41 on MADRS with a Cohen’s d of −1.70, response 43% against 3% and remission 40% against 3%. The authors’ own caveat is the one to carry, because it is more candid than most: “blinding was not upheld, with 100% of participants who received psilocybin and 70% of participants who received placebo correctly guessing their allocation,” in a sample they describe as unusually highly educated. The commentary’s point is that efficacy is no longer the binding constraint; delivery is. Relatedly, HRSA’s request for information on training and care-delivery models for ambulatory psychedelic therapy closed Aug 13 with 59 comments, from drug developers through Oregon and Colorado state-market operators. And on Quanta’s podcast, Melanie Mitchell argues we are measuring the wrong thing entirely: AI is “an alien intelligence” whose mechanisms are not human, and the right toolkit is the one developmental and comparative psychology built for infants and animals. Her caution — “People very much think that these models have human-like qualities when maybe they actually don’t” — pairs with EDHEC’s Lionel Martellini on quantum hype: “Most of these use cases look a little over-engineered… a solution desperately in search of a problem.”",
        s: [["Quanta (Komlós)","https://www.quantamagazine.org/huge-breakthrough-in-the-math-of-imbalance-20260821/"],["PRL (boson sampling)","https://journals.aps.org/prl/abstract/10.1103/9mb1-t3w4"],["Nature Medicine (psilocybin in the NHS)","https://www.nature.com/articles/s41591-026-04597-y"],["Quanta (Mitchell)","https://www.quantamagazine.org/are-we-thinking-correctly-about-ai-intelligence-20260820/"]] },
      { t: "Director watch: two clean negatives and one event that has quietly grown. Venice runs Sept 2–12 and contains no Lynch, von Trier, Noé or Refn — the lineup carries no tribute or retrospective, and the nineteen Venice Classics restorations run from Buñuel and Lubitsch to Ann Hui and Wajda with none of the four among them. That is worth stating positively, because a Lynch tribute at Venice is exactly the sort of thing that gets assumed. Nothing verifiable exists on Gaspar Noé at all: searches return only the July 2023 Blanchett and Rogowski casting story, unreconfirmed, and MUBI’s placeholder page. Nothing new on Refn since May 22, when the Maniac Cop remake was set for wide theatrical release through MUBI with shooting to start in January. On von Trier, the Aug 9 report stands unadvanced, though the producer’s fuller quote is worth the correction it makes — Peter Aalbæk Jensen of Ekkof Film, rebutting a March story that After might premiere at a festival: “The film hasn’t been made, so there’s nothing that can be shown at a festival. Before the summer break, I heard that Lars might, with a bit of luck, have the screenplay written around August.” The live item is London. “A Gathering of the Angels,” at the Genesis Cinema in Whitechapel on Sept 26–27, has expanded its guest list since the May announcement from George Griffith and Sabrina Sutherland to add Harry Goaz and Ian Buchanan, with an online panel featuring editor Duwayne Dunham and effects supervisor Gary D’Amico; the programme runs Blue Velvet and Fire Walk With Me alongside a live owl demonstration, a Double R Club cabaret and a DJ Yoda set. Blue Velvet turns forty on Sept 19, with a Varèse Sarabande soundtrack reissue dated Sept 4 — repertory 4K screenings are running but no coordinated national re-release is confirmed. Criterion’s Wild at Heart 4K holds at Nov 17; no December slate is announced. In the art world the strongest item extends last week’s repatriation thread rather than repeating it: Canada’s Indigenous Art Centre, inside Crown-Indigenous Relations and Northern Affairs Canada, cannot locate 111 of more than 5,000 works by First Nations, Métis and Inuit artists, from a collection valued around C$14.4 million, after an audit found decades of gaps in inventory records. Spokesperson Maryéva Métellus: “An ‘unaccounted for’ designation does not mean an artwork is lost or stolen.” The artist Lawrence Paul Yuxweluptun calls it “another example of government incompetence” and wants the collection transferred to the Canada Council for the Arts. Also: the Smithsonian’s regents meet Aug 31 on housing the National Museum of the American Latino in the Arts and Industries Building — a route that would bypass Congress after the administration cancelled the museum’s funding in May — and the Kunsthistorisches Museum will unveil a Portrait of an Old Man, c. 1670, newly attributed to Bernini by curator Gudrun Swoboda, on Dec 2. If it holds, it puts Bernini painting some thirty years after he was thought to have stopped.",
        s: [["La Biennale (Venice Classics)","https://www.labiennale.org/en/news/venice-classics-restored-films-83rd-venice-film-festival"],["NME (Gathering of the Angels)","https://www.nme.com/news/film/immersive-david-lynch-and-twin-peaks-celebration-event-coming-to-london-next-month-3962617"],["The Art Newspaper (Indigenous collection)","https://www.theartnewspaper.com/2026/08/21/canada-federal-indigenous-art-collection-111-works-unaccounted-for"],["The Art Newspaper (Bernini)","https://www.theartnewspaper.com/2026/08/20/newly-discovered-bernini-painting-to-be-unveiled-at-vienna-museum"]] }
    ]}

  hooks: [
    { story: "Bridge Michigan looks at multi-cancer early detection blood tests, which screen for dozens of cancers from one draw. Galleri costs $950 out of pocket. Covering it under Medicare would run roughly $55 billion a year; offering it to everyone over 50 would run about $100 billion. Grail claims 24,000 American lives saved annually. For scale: Michigan expects 21,000 cancer deaths this year, cancer accounts for about 7% of US health spending, the first year after a cancer diagnosis costs $45,063 and end-of-life cancer care $121,746 a year. About 1 in 100 people tested return a positive, and the test can point to the tumor’s location in 9 of 10 of those cases. The University of Michigan’s Center for Value-Based Insurance Design puts total US low-value care at roughly $340 billion a year. Michigan State medical ethicist Leonard Fleck: “There’s all kinds of things we can do that might save some lives, and the cost at an individual level might be relatively small.”",
      src: ["Bridge Michigan","https://bridgemi.com/michigan-health-watch/blood-test-can-find-cancers-save-michigan-lives-is-that-worth-100b/"],
      concept: "Base rates, the arithmetic of screening, and why a cheap test can be an expensive policy",
      q: "Open with Fleck’s sentence on the board, because it contains the whole trap in one line: each individual decision looks cheap, and the aggregate is a hundred billion dollars. Ask students to name what makes those two statements compatible. They will get there — the per-unit cost is small and the population is enormous — and that is the moment to insist on the distinction between an average cost and a marginal social cost at scale. Then do the arithmetic that actually decides this, which is not the price of the test. Give them the 1-in-100 positive rate and ask what happens next to those hundred people. Nine in ten positives can be localized, so the follow-up is imaging or biopsy for everyone who screens positive. Have them look up or estimate a plausible prevalence for the cancers in question in a 50-plus population and compute the positive predictive value themselves. Even with excellent sensitivity, a low base rate means most positives are false, and each false positive purchases a workup, an anxious month, and some non-trivial probability of a complication from an unnecessary procedure. Students consistently expect a test that is 99% accurate to be 99% informative, and watching that intuition break on Bayes’ rule is worth more than any lecture on the topic. Now make it an economics problem rather than a statistics problem. The $100 billion is not the cost of the test; it is the cost of the test plus the induced downstream utilization, minus averted late-stage treatment. Ask what the sign of the net is and what it depends on. It hinges on how many of the detected cancers would have become clinically apparent anyway and been treated at a similar cost — overdiagnosis, which is the hardest quantity in health economics to measure precisely because the counterfactual is unobservable. Then bring in the $340 billion low-value-care figure, and ask the sharper question: if we already spend that much on care with no benefit, is the right comparison for a new screening program against zero, or against reallocating existing spending? That reframes the whole thing as a budget-constraint problem, which is what it is. Close on the political economy, because that is where the answer actually gets made. The costs of the test are concentrated on payers and diffuse across taxpayers; the benefits are vivid, identifiable, and attach to named survivors. Ask students to predict which way that asymmetry pushes coverage decisions, and whether they can name any mechanism that would counteract it. This is also a live Michigan story, which makes it a good one to assign as a two-page memo to a state legislator."},
    { story: "KFF has published the first cross-insurer prior-authorization denial data, drawn from newly mandated CMS disclosures. Average denial rates run 12% in Medicare Advantage, 14% in Medicaid managed care and 18% on the ACA marketplaces — but the variation within each market is far larger than the variation between them. UnitedHealth denies 17% of MA requests; Elevance denies 5%. Independence Health Group denies 23% of Medicaid managed-care requests; L.A. Care denies 2%. Centene denies 25% of marketplace requests; Guidewell denies 3%. Meanwhile about two-thirds of appealed MA denials are overturned, half in Medicaid, and 43% of ACA denials are eventually approved. KFF notes the data’s limits: insurers report percentages without total request volumes, in inconsistent formats, with no breakdown by service type.",
      src: ["Healthcare Dive","https://www.healthcaredive.com/news/prior-authorization-denial-rates-kff-medicare-advantage-medicaid-aca/"],
      concept: "Ordeal mechanisms, screening through costly access, and the denial that is not meant to stick",
      q: "Start by asking what prior authorization is officially for, and get the textbook answer stated cleanly: the insurer holds information the patient does not about cost-effectiveness, and gatekeeping is meant to filter out care whose expected benefit is below its cost. Fine. Now put the appeal statistics next to the denial statistics and ask whether that story survives. If 43% of denials on the exchanges are eventually approved on appeal, then the initial denial was not a judgment that the care was inappropriate — the insurer conceded almost half the time. Ask students what a denial that gets reversed nearly half the time is actually doing. This is where they discover ordeal mechanisms, and it is worth naming the concept explicitly: a policy that imposes a time-and-hassle cost rather than a price, in order to sort applicants by how much they want the thing. The literature usually meets this in a welfare-program context, where waiting in line screens for need. Ask what it screens for here. The people who appeal are those with the time, the literacy, the persistence, and often a physician’s office with the staff to fight — which is emphatically not the same population as those with the greatest clinical need. So the sorting is real but it is sorting on the wrong variable, and that is the welfare argument against the mechanism, stated precisely rather than indignantly. Then attack the variance, which is the part that cannot be explained away. Ask students to propose reasons UnitedHealth might deny at 17% and Elevance at 5% in the same market. They will offer patient mix, regional practice patterns, product design. Push them to say whether any of those plausibly generates a threefold gap, and then a twelvefold gap between Centene and Guidewell in the same regulated market. What remains after the clinical explanations are exhausted is a policy choice made by each firm, which means denial intensity is a strategic variable, not a medical one. Ask what it is being chosen to maximize, and what constrains it — reputation, regulator attention, provider network relations, star ratings. For an intermediate section, this becomes a clean model: the insurer picks a denial rate trading off the claims it avoids paying against the appeals cost, the regulatory risk, and the enrollment it loses to reputation. Ask what happens to the optimal rate when appeal rates are low because appealing is hard, and you have derived the result that the friction is a complement to the denial rather than a check on it. Finish with KFF’s methodological caveat, because it teaches the habit: percentages without volumes cannot be aggregated, and a 25% denial rate on a small book is not comparable to 12% on a large one. Ask what single additional column would make this dataset analyzable. That the disclosure rule did not require it is itself a finding."},
    { story: "Axios reports that dorm decorating has become a professionalized market. Shelly Gates of Mary Margaret Designs has done about 35 dorm rooms this year, with some custom projects reaching $20,000, pitched to parents as “a four-year investment.” An incoming James Madison freshman and her roommate spent roughly $2,500 on coordinated bedding, a headboard, a dresser and vases. LTK reports dorm-related creator engagement up 116% year over year and college shopping up 53%; college and back-to-school haul content drew 800 million YouTube views in the past year. Target and IKEA each appear in about 30% of dorm-shopping visibility analyses. A 2026 BadCredit.org survey found 74% of US parents said it was important that their child have what other children have.",
      src: ["Axios","https://www.axios.com/2026/08/14/college-dorm-decor-economy"],
      concept: "Positional goods, observability, and an arms race with no equilibrium gain",
      q: "This one has the advantage that half the class lives in the market. Begin by asking what a dorm room is for, and let them answer functionally — sleep, study, storage. Then ask what the marginal $2,000 buys, and whether the answer is different in kind from the first $200. It is: the first tranche buys use, the second buys standing. Get them to define a positional good precisely — one whose value to the holder depends on its rank relative to others’ rather than on its absolute level — and then ask them to prove that dorm decor now qualifies, using the evidence rather than intuition. The 74% of parents wanting their child to have what other children have is the cleanest single line for this, since it is a preference defined entirely by reference to others. Now introduce the mechanism that changed, because the interesting claim is not that students are vainer than they used to be. Ask how many people saw a dorm room in 1996. A dozen, maybe. Ask how many see one now, and route them to the 800 million views figure. The reveal video is a coordination and comparison device: it takes a good that used to be observed by a handful of people and benchmarks it against a national distribution, instantly and for free. Have them state the comparative static — when observability rises, the return to relative position rises, so equilibrium spending rises. Then ask the crucial follow-up: does anyone end up better off? In a pure positional game, no. Everyone spends more and the distribution of rank is unchanged, which is the definition of an arms race and a straightforward negative externality in consumption. Each family’s spending lowers everyone else’s relative standing without anyone intending harm. Ask what a Pigouvian remedy would even look like here, and let them discover why it is hard — you cannot tax a headboard for being aspirational, though you can notice that some universities effectively do the equivalent by supplying standardized furniture and prohibiting modification. That is a real policy, chosen for other reasons, that happens to cap the game. Push on the distributional consequence, which is where this stops being a light story. If the observable standard rises, students who cannot meet it do not simply consume less; they consume a visible signal of not meeting it, at the exact moment they are forming a social network. Ask whether that is different from ordinary income inequality in consumption, and why. Good extension for an intermediate section: model it as a contest where payoff depends on rank, show that equilibrium effort exceeds the socially optimal level, and then ask what happens when contestants have different budget constraints — the equilibrium is not just wasteful, it is sorted by wealth. A closing question that usually lands: the $20,000 room and the $2,500 room are playing the same game with different budgets. Which one is more likely to feel it went badly?"}

  pulse: [
    { cat: "Listening", t: "The eighteen-week No. 1 is speeding up, which is not how records are supposed to age",
      why: "Ella Langley’s “Choosin’ Texas” took 1,434,669 Spotify streams on Aug 21 — up 6.4% from the 1,348,488 it was doing a few days earlier, in its 43rd week on the Hot 100 and 18th at No. 1. A song accelerating in month ten is the anomaly worth noticing, because the ordinary shape of a hit is exponential decay. The mechanism is that two distribution systems are feeding rather than cannibalizing each other: playlist and algorithmic placement compound with country radio rotation, and each new audience the other system reaches becomes new streaming volume. Behind her, STELLA LEFTY’s “Boston” jumped Spotify No. 11 to No. 7 at 811,546 a day and moved 6 to 4 on the Hot 100 — now running at 57% of Langley’s daily volume, up from about 46%. Langley simultaneously holds four of the Hot 100’s top twenty, including a brand-new No. 19 debut, “Jaded,” a Koe Wetzel single she features on. Week 19 is not revealed until Tuesday.",
      rec: "If you want a single question that reliably opens a conversation, ask a student whether they think a song can be too popular — most under-25s have a precise and slightly resentful opinion about a track they liked before it saturated, and the answer tells you how they think about taste and belonging.",
      src: ["kworb / Spotify US daily","https://kworb.net/spotify/country/us_daily.html"] },
    { cat: "Watching", t: "The $18 million horror sequel beat the $850 million blockbuster on Friday, then lost the weekend",
      why: "Spider-Man: Brand New Day took its fourth straight weekend at No. 1 with $36.5 million, crossing $852.4 million domestic and passing No Way Home’s $814.8 million to become the highest-grossing Spider-Man film in the US. But it lost Friday — $9.8 million against Insidious: Out of the Further’s $10.6 million — before winning the frame. Insidious opened to $23 million from 3,303 locations on an $18 million budget, with a C+ CinemaScore and 60% on Rotten Tomatoes. That is the horror demand curve compressed into three days: near-total front-loading, a weak word-of-mouth tail signaled by the C+, and a return multiple on negative cost that comfortably beats the blockbuster playing in the next auditorium. It is also why the genre is priced to be review-proof — the purchase is a group outing at a fixed showtime, and the thing being bought correlates weakly with whether the plot holds up.",
      rec: "Worth knowing before you ask a student what they saw: for horror the honest answer to “was it good” is often “no, and that wasn’t the point.” Treating that as a coherent position rather than a lapse in taste will get you a much better conversation about how they actually choose what to watch.",
      src: ["TheWrap","https://www.thewrap.com/creative-content/movies/spider-man-insidious-out-of-the-further-box-office/"] },
    { cat: "Reading", t: "One author now has book one and book three on the bestseller lists in the same week",
      why: "Matt Dinniman’s Dungeon Crawler Carl sits on four of the five major bestseller lists; The Dungeon Anarchist’s Cookbook, which is book three, is a new entry on three of them. That combination — an older first volume holding while a later volume enters — is backlist laddering, and it says something specific about the product. Readers finishing book one buy book three inside the same chart week, so a years-old series climbs the lists in sequence rather than at launch. The engine is the Soundbooth Theater full-cast audio production, which makes each installment a roughly twenty-hour commitment ending on a cliffhanger; completing one unit mechanically generates demand for the next, the way a season finale does. It is a serialization story rather than a reading-habits story. This week’s clean sweeps across all five lists, incidentally, were Ann Patchett’s Whistler, Caro Claire Burke’s Yesteryear and Kathryn Stockett’s The Calamity Club.",
      rec: "For advising rather than teaching: when a student says they are “on book four,” they may mean forty hours of audio, not four paperbacks. If you are trying to gauge whether long-form attention is the problem, format is the question that gets an honest answer.",
      src: ["Book Riot","https://bookriot.com/bestselling-books-august-20-2026/"] },
    { cat: "Online", t: "This week’s memes are almost entirely made of old footage",
      why: "Look at what Know Your Meme has trending and check the dates on the source material. “Three Layer Dip Stack” is built on a 2020 Pringles Super Bowl commercial. “Robert Loggia Family Guy” recycles a 2007 cutaway. The Spider-Man Ceiling trend lip-syncs to “Sunflower,” which is from 2018. Only the GTA 6 leak and the Ariana Grande “Petal” format are genuinely of this month. The temptation is to read this as cultural exhaustion, and the better read is a supply story: the cost of surfacing an old clip is zero, the archive is now vastly deeper than the annual flow of new material, and recommendation systems reward proven engagement over recent engagement. The optimal move for a creator is therefore to mine the back catalog. This is exactly the same dynamic as one in three music streams going to songs at least ten years old — except here there are no rights holders and no licensing friction at all, so the effect is cleaner and stronger.",
      rec: "If a reference lands and you cannot place it, the useful question is not “what is that from” but “how old is that” — students frequently do not know, because the feed served it undated. That shared uncertainty is a better footing than pretending to recognize it.",
      src: ["Know Your Meme","https://knowyourmeme.com/newsfeed/trending"] },
    { cat: "Playing", t: "A $75 million tournament ends this morning, and its biggest prize was settled by an elimination",
      why: "The Esports World Cup closes today in Paris with the Counter-Strike 2 grand final, Team Spirit against FUT Esports, at 7:30 a.m. Eastern — FUT’s first appearance in a grand final at this level. The result is not in as of this brief. The story of the tournament, though, is already fixed: on Aug 21 the Brazilian side Legacy eliminated Team Falcons, the reigning IEM Cologne Major champions and world No. 1, 2–0 — their second consecutive 2–0 over Falcons in 2026, after having already knocked out NAVI. Because CS2 was the final title of the year, that quarterfinal exit removed Falcons’ last chance to add to their 4,400 Club Championship points, which means the $7 million club prize was effectively decided by a game they lost rather than one anyone won. The CS2 event itself carries a $2 million pool, $600,000 to the winner.",
      rec: "The club-versus-team distinction is the one thing worth knowing here. Orgs like Spirit, Falcons and G2 field squads across unrelated games and compete on a cross-game points total, so “who won” has two different answers. Asking which titles an org fields is a real question, not a polite one.",
      src: ["Dust2","https://www.dust2.us/news/77118/ewc-playoffs-day-four-recap-fut-outlast-furia-and-spirit-best-legacy-to-set-up-grand-final"] },
    { cat: "Playing", t: "Someone leaked a complete build of GTA 6 as a protest about how it is being sold",
      why: "A hacker using the alias CyberLeek released a full working build of Grand Theft Auto VI, including the complete Leonida map, proving authenticity by shooting the word LEEK into an in-game wall with bullets — demonstrating live play rather than stolen internal footage. Rockstar answered with DMCA takedowns, heaviest on YouTube; clips survived on X. The part worth attention is the stated motive, which is not free stuff: the leaker says he is protesting Rockstar’s digital-only pre-selling strategy and will keep releasing material, including the ending, until the company apologizes. That is a pricing-and-ownership grievance rather than a piracy one. Digital distribution eliminated the used-game market that once let a $70 buyer recover part of the outlay, and pre-selling shifts risk onto the buyer before any quality information exists. The leak attacks the one asset that model depends on — the seller’s control over when information is released. The game ships in November, consoles first.",
      rec: "If you teach anything about durable goods or resale markets, this is a case students already know the facts of. Asking why a used copy of a game used to be worth something, and what happened to that value, is a question they can answer from their own purchase history.",
      src: ["Tom’s Hardware","https://www.tomshardware.com/video-games/catastrophic-gta-vi-leak-is-a-full-working-build-notorious-hacker-cyberleek-taunts-rockstar-games-by-spraying-the-word-leek-onto-a-wall-in-game-with-bullets"] }
  ],
  classnote: { t: "On April 28, a TikTok user posted a screen recording of a “leaked” Ariana Grande single called “Petal” — her voice repeating the word over an instrumental. No such song existed; the audio was fabricated. It spread anyway: 1.8 million views on the original, then 10.8 million on a July 29 repost with 1.5 million likes, then 3.9 million, then 3 million, plus a live-action “Petal Chair Choreo” format recreating her choreography. On July 31, Grande released a real music video for a real song called “Petal.” It does not contain the viral audio. It debuted at No. 4 on the Hot 100 and fell to No. 18 in week two — the sharpest top-five collapse on the chart. Start by asking students to state what was actually being consumed for those three months, because the answer is not the song. It was the idea of the song, the anticipation of it, and the joke about it, all supplied free by strangers and none of it produced by the rights holder. Have them name the good precisely: a counterfeit that is not a copy, since it shares no content with the original, but is nonetheless a substitute in demand, because it satisfies the same want. That is an unusual object, and it is worth making them articulate why it is a substitute despite being materially unrelated. Then get to the market failure. The standard model of a counterfeit assumes it competes on price for the same use — a fake handbag does what a real one does, worse, for less. This does not fit. Ask what the fake “Petal” actually took from the real one, and steer them past the easy answer of lost sales toward the harder one: it consumed the novelty. Anticipation is depletable. By July 31 the audience had already extracted most of the available surplus from the concept, at zero price, and what remained for the paid release was a market that had spent its attention on a free good four months earlier. This is a durable-goods and information-goods problem wearing a pop-music costume — the value of an information good is concentrated in first exposure, so anything that delivers a plausible first exposure captures value the producer cannot recover. Push on timing, which is the decision variable. Ask what the rights holder should have done, and make them argue both sides. Releasing immediately in April captures the demand but forfeits production quality and the coordinated rollout; waiting preserves the rollout and loses the window. Then ask whether the producer could have appropriated the meme instead of racing it — sampling the fake audio, or releasing the choreography format herself — and what that would have cost in artistic control. There is no clean answer, which is what makes it a good problem rather than a good example. Close with the falsifiable version, since that is the habit worth teaching. If the mechanism is depleted anticipation rather than confused consumers, then two predictions follow: the effect should be strongest for goods whose value is mostly novelty and weakest for goods with repeat consumption value, and it should show up as an unusually steep second-week decline rather than a low debut. The Hot 100 gave exactly that shape — No. 4 on release, No. 18 seven days later. Ask them what evidence would have refuted it.",
    src: ["Know Your Meme","https://knowyourmeme.com/memes/ariana-grande-petal"] },

  if (s < 86400) return Math.round(s / 3600) + "h ago";

  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;

  const dot = document.getElementById("liveDot");

  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;

}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
</script>
</body>
</html>
