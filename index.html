  hooks: [
    { story: "A team led by Matt Notowidigdo, economics professor at the University of Chicago Booth School of Business, has measured what happened when ten states barred SNAP benefits from being spent on soda. Working with a Bloomberg Philanthropies grant and data from the first six months of 2026, the study follows 15,000 SNAP households, 3,291 of them in restricted states. Soda purchases fell about 12% — roughly 34 fewer twelve-ounce cans per person per year. But recipients redirected up to 39% of the money they no longer spent on soda into other sugary drinks and juices that the restrictions do not cover. The projected health effects, net of that leakage, are still substantial: type 2 diabetes risk down 2.6% over ten years, about 34,000 cases prevented nationally, roughly $1 billion a year in healthcare savings. The paper is an NBER working paper and not yet peer-reviewed. A survey component found the restrictions increased stigma among recipients — a cost that appears in none of the savings estimates. Notowidigdo's own conclusion is a design point rather than a verdict: “If the goal is to reduce sugar consumption, you want the ban to be more comprehensive.”",
      src: ["STAT News","https://www.statnews.com/2026/08/24/snap-restrictions-12-percent-drop-soda-purchases/"],
      concept: "Substitution, the leakage of a partial restriction, and why the boundary of a policy is the policy",
      q: "Start before you give them the second number. Put up only the first — a ban on buying soda with SNAP benefits reduced soda purchases by about 12% — and ask them to predict what happened to total sugar consumption. Most rooms will say it fell by something like 12%, because the mental model is that a ban removes a quantity. Then give them the 39%. The gap between those two reactions is the whole lesson, and it is worth letting them sit in it before you name it. Now make them build the mechanism themselves rather than handing them the word. Ask what a SNAP recipient's problem actually looks like: a fixed budget, a set of goods, and a rule that removes one good from the eligible set without changing the budget or removing anything else. The money does not evaporate. It goes to the nearest available substitute, and the nearest available substitute to soda is a juice or a sports drink that the rule did not name. Have them draw it as a two-good problem — restricted good on one axis, unrestricted sugary substitute on the other — and show that the ban is not a price change at all but a corner constraint. That distinction is worth dwelling on, because students routinely model bans as infinite prices and it gets the comparative statics wrong. An infinite price on soda would reduce real income; a corner constraint with the budget intact does not. Then turn it into a design question, which is where the interesting economics lives. Ask what would have to be true for a partial restriction to work at all, and let them derive the condition: the leakage depends entirely on the elasticity of substitution between the restricted good and its nearest legal neighbour. If soda and juice are close substitutes, leakage approaches one and the policy accomplishes nothing on sugar. If they are distant, leakage is small. So the policy's effectiveness is not a property of the policy — it is a property of the product space it was drawn onto. Ask them who draws that boundary and how, and whether a beverage industry that anticipates the rule has any influence over which products fall on which side. Push them on why the boundary was drawn where it was. Soda is legible, politically salient, and easy to define. Sugar content is the thing anyone actually cares about and is harder to write into a statute. This is the general problem with any rule that regulates a proxy rather than the target: the proxy is chosen for administrability, and everything that is not the proxy becomes a margin of adjustment. Have them name three other policies with the same structure — SUV exemptions from fuel economy standards, taxes on cigarettes but not other nicotine products, calorie labels on menus but not on the grocery shelf — and identify the substitute in each case. Then complicate it honestly, because the convenient conclusion is that the policy failed and it did not. Thirty-four thousand prevented diabetes cases is not nothing, and 61% of the money did not leak. Ask them whether a policy that achieves 61% of its intended effect at essentially no administrative cost is a good policy, and force them to specify what they are comparing it to — a comprehensive sugar restriction that would be politically harder and more paternalistic, a sugar tax that would fall on everyone rather than on SNAP recipients, or nothing. Finally, the stigma finding, which is the part most classes will skip and shouldn't. The survey found the restrictions increased stigma among recipients. Ask where that belongs in a welfare calculation. It is a real utility cost, borne entirely by the poorest households, and it does not appear in the $1 billion savings figure or in the 34,000 cases. Have them write down the social welfare function that would justify the policy and identify exactly which term the stigma enters and with what weight — and then ask whether anyone actually chose that weight or whether it was set to zero by default because it was not measured."},
    { story: "A new CEPR column by Gabriel Felbermayr, director of the Austrian Institute of Economic Research, Ohyun Kwon of Wharton, and Constantinos Syropoulos and Yoto Yotov of Drexel, uses the ITPD-E database — 22 broad sectors, more than 170 industries, over 200 countries, 1986 to 2022, including domestic trade flows — to ask what sanctions actually do to a target economy's trade. Complete sanctions cut trade between sender and target in all 22 sectors, statistically significantly in 20. But they raise the target's trade with third countries in 17 of the 22 sectors, significantly in 13; in chemicals and metal products, third-country trade more than doubles. Their case study is Georgia under Russia's 2006 embargo: exports to Russia fell 56.9%, exports to the rest of the world rose 79.5%, and total exports rose 60.9%. The authors' conclusion is a warning about measurement rather than about policy — sanctions “clearly disrupt trade between senders and targets” while trade “between targets and third countries” expands substantially, so “bilateral statistics can mislead.” The column published the morning after the US Treasury announced a sixty-target secondary-sanctions package against Iran that conspicuously did not name China's large banks.",
      src: ["VoxEU / CEPR","https://cepr.org/voxeu/columns/when-trade-sanctions-increase-targets-trade"],
      concept: "Trade destruction versus trade diversion — and why a partial-equilibrium answer to a general-equilibrium question is always wrong in the same direction",
      q: "Open with the Georgia numbers on the board and nothing else: exports to Russia down 56.9%, exports to everywhere else up 79.5%, total exports up 60.9%. Ask whether the embargo worked. You will get a split, and the split is the point — half the room will look at the first number and half at the third. Then ask the question that resolves it: which number does the sanctioning country observe most easily, and which one does it actually care about? Bilateral trade data is cheap, timely, and published by the sanctioning country itself. Total trade requires reconciling everybody else's statistics. The measurement asymmetry runs in exactly the direction that flatters the policy, which is a pattern worth teaching them to look for in general. Now build the economics properly, because “trade diversion” is a phrase students can repeat without understanding. Set it up as a supply-and-demand problem with three parties: a target that produces something, a sender that stops buying it, and a rest-of-world that was already buying at the world price. Ask what happens to the target's price and quantity if the rest-of-world demand curve is perfectly elastic at the world price. The answer is that the embargo does essentially nothing except reroute — the target sells the same quantity to different buyers. Then relax it: make rest-of-world demand downward-sloping and add a per-unit rerouting cost, and now you get a real welfare loss for the target, but one bounded by the cost of rerouting rather than by the size of the sender's market. Have them state that as a proposition, because it is the whole result: the damage from a sanction is not the value of the trade destroyed, it is the transaction cost of replacing it. Then ask what makes rerouting expensive, and let them find the list themselves — thin markets, specialised products, long-term contracts, transport geography, financial infrastructure, and whether any third country is large enough to absorb the volume. That gives you a sharp prediction they can test against the data in front of them: rerouting should be easiest in homogeneous, storable, widely-traded goods and hardest in differentiated ones with relationship-specific investment. Ask them to check it against the finding that chemicals and metal products more than double their third-country trade. They should be able to explain why those two categories, specifically. Now bring in the week's news, which is what makes this live rather than historical. The Treasury package announced Monday designates roughly sixty entities across digital assets, technology, gold, aviation and shipping, and it deliberately did not sanction China's large banks. Ask them, given the model they have just built, whether that omission is a weakness or a design choice — and make them argue both. The case for weakness is that the third country doing the absorbing is precisely the one left untouched, so rerouting stays cheap and the sanction collapses to a bilateral reshuffle. The case for design is that sanctioning a large country's banking system imposes costs on the sender too, through its own financial system, so the sender is trading off damage to the target against damage to itself. That trade-off is the real object, and it is not visible in any bilateral trade statistic. Push them to say what a sender would have to do to raise the target's rerouting cost rather than just its bilateral cost — secondary sanctions on the third-country intermediaries, shipping and insurance, which is exactly what the vessel and shipping designations in the package are. So the policy has already internalised the paper's logic, imperfectly. For a written assignment: give them the Georgia figures and ask them to compute what the embargo cost Georgia, stating every assumption they need — the counterfactual growth path, the price at which the diverted exports sold, and the fixed costs of finding new buyers. Most will discover that the honest answer requires data nobody has, which is the correct place to end up, and a much better lesson than a number."},
    { story: "California has attached a penalty schedule to a healthcare spending cap, making it the most concrete price-regulation experiment currently running in American healthcare. General healthcare entities face a spending growth limit of 3.5% in 2025, ramping down to 3% by 2029. Seven hospitals designated as high-cost face a tighter schedule: 1.8% in 2026, declining to 1.6% by 2029. Penalties run to a maximum of 125% of spending above the target, with alternatives under consideration of $10,000 a day or a flat $500,000. Enforcement does not begin until 2028, after two years of data collection. Ben Johnson, group vice president for financial policy at the California Hospital Association: “They're building the plane while flying it. We know improvements in affordability are needed, but we have serious questions about how and about what the unintended consequences could be.” The backdrop: hospitals drove 40% of US health spending increases between 2022 and 2024, roughly a quarter of US health spending is classified as wasteful, seventeen California hospitals have closed since 2016 against six openings, and the state expects to lose about $30 billion a year in federal Medicaid funding.",
      src: ["KFF Health News","https://kffhealthnews.org/health-industry/high-healthcare-costs-hospitals-state-spending-limits-california-fines/"],
      concept: "Rate regulation on a growth rate rather than a level — quality margins, the ratchet, and why the enforcement lag is the most interesting number in the policy",
      q: "Begin by making them notice what is being capped, because almost nobody reads it carefully the first time. This is not a price ceiling. It is a cap on the growth rate of spending, which is a cap on a product of two things — price and quantity — measured as a change rather than a level. Ask what a regulated entity can do to satisfy a cap on price times quantity that it could not do to satisfy a cap on price. The list they generate is the entire policy literature: reduce volume, shift case mix toward less costly patients, reclassify services, move care to an entity outside the cap's definition, or reduce quality along a margin nobody measures. Have them rank those by how easy each is to detect. The one that ranks last is quality, and that is not a coincidence — it is the general result that regulating a contractible dimension pushes adjustment onto the non-contractible ones. Then get to the level-versus-growth distinction, which is where the real bite is. A hospital that is already expensive and one that is already cheap face the same 3.5% growth cap, so the regulation locks in the existing distribution of prices and permits it to compound. Ask what that does to a low-cost efficient hospital's incentives. It punishes it, because it has no fat to cut and its allowable increase is computed off a smaller base. Now introduce the seven designated high-cost hospitals at 1.8% and ask whether that fixes the problem. It partially does — it is a level correction bolted onto a growth rule — but it also creates a threshold, and thresholds create behaviour. Ask what an eighth hospital, just below the designation line, now has an incentive to do, and how it would know where the line is. Next, the ratchet, which students find genuinely surprising. If your allowable spending next year is a function of your spending this year, then cutting costs today lowers your own ceiling tomorrow. Have them write that down as a dynamic problem and identify the distortion: efficiency gains are partially expropriated by the regulator through a tighter future base, so the optimal response is to run at the cap rather than below it. This is the classic rate-of-return regulation problem in a different costume, and it explains why almost every growth-cap regime in the world eventually needs an escape valve or a rebasing rule. Ask them to design one. Then the enforcement lag, which is the number I would build the session around. Penalties begin in 2028; data collection runs 2026 and 2027. Ask what a forward-looking hospital does in a window where its behaviour is observed but not yet punished, and where the observed behaviour sets the base against which it will later be judged. The answer — spend generously now to establish a high baseline — is the opposite of what the policy intends, and it is entirely rational. Make them argue about whether the regulator could have avoided it. A shorter lag means less reliable data; a longer one means more gaming; announcing the base year retroactively would solve it but is probably not legally available. There is no clean answer, which is the honest lesson. Finally, take Johnson's quote seriously rather than dismissing it as industry pushback. “What the unintended consequences could be” is a real question, and the strongest version of the hospital case is that seventeen California hospitals have closed since 2016 against six openings, and roughly $30 billion a year in federal Medicaid funding is about to disappear. Ask what happens when a binding spending cap meets a large negative revenue shock in the same institution, and who bears it. Then have them state, in one sentence each, the strongest argument for the cap and the strongest argument against, and identify what evidence would move them. If they cannot name the evidence, they do not yet have a position — they have a preference."}

  pulse: [
    { cat: "Listening", t: "She tied the all-time record on the day the song fell hardest",
      why: "Ella Langley's “Choosin' Texas” logged a 19th week at No. 1 on the Hot 100, announced Monday rather than the usual Tuesday, tying the record for the longest non-holiday reign held jointly by “Old Town Road” and “A Bar Song (Tipsy).” Only Mariah Carey's “All I Want for Christmas Is You,” at 22 weeks, now stands ahead of it; for country context, Morgan Wallen's “Last Night” managed 16. And on the same day, the underlying streaming fell off a cliff by its own standards — 1,341,125 Spotify US streams against 1,477,593 two days earlier, down 136,468 or 9.2%, the steepest single-day drop in the run and a reversal of the 3.0% gain this desk noted Monday. STELLA LEFTY's “Boston” barely moved at 776,815, down 0.6%, so the gap between them narrowed from about 696,000 to about 564,000 in one day. This is Chris Molanphy's “default hit” thesis arriving at its logical endpoint: a record tied by accumulation and low churn rather than by intensity. Two other things on the same chart make the point. Langley holds No. 1 and No. 9 simultaneously with “Be Her.” And The Killers' “Mr. Brightside,” released in 2004, climbed from No. 8 to No. 7 at 732,164 daily streams — a twenty-two-year-old song outstreaming most of the current Hot 100.",
      rec: "The record is the hook, but the interesting question is the second one. Ask a student whether a song that stays at No. 1 for nineteen weeks is more popular than one that peaks for three, and let them work out that the answer depends entirely on what the chart is adding up. It is a nice way into aggregation rules without saying the words.",
      src: ["93Q Country","https://93qcountry.com/1708080/ella-langley-choosin-texas-billboard-hot-100-record-2/"] },
    { cat: "Watching", t: "Marvel's US record fell on Monday, and one film is holding up the entire box office",
      why: "Spider-Man: Brand New Day passed Avengers: Endgame's $858.37 million on Monday to become the highest-grossing Marvel film in US history, after a fourth consecutive No. 1 weekend of $39.0 million took it to roughly $855 million domestic and $2.22 billion worldwide. Endgame keeps the global Marvel crown at $2.8 billion. What it is chasing now is Star Wars: The Force Awakens at $936.6 million, an eleven-year-old record about $80 million away. The structural fact underneath is more interesting than the record: total weekend business was $129.9 million, up 49.1% year over year, and that recovery is almost entirely one film. Insidious: Out of the Further opened second at $25.3 million from 3,303 theatres on an $18 million budget — a $7,660 per-screen average and a genre that remains the last reliably profitable theatrical proposition for under-25s, though note its CinemaScore is a C+, which sits oddly against the 70% audience score being reported as a series best. And at No. 8, taking $3.1 million, sat The Fast and the Furious — the 2001 one. Meanwhile on streaming, Outer Banks went from No. 7 on its drop day to No. 1 on Netflix's US series chart within four days, and its finale scored 9.0 on IMDb with 700-plus reviews, the highest-rated episode the show has ever had. For contrast, Stranger Things' last two episodes scored 5.6 and 7.4. Four of the ten series on that chart are true crime or documentary.",
      rec: "If you want a real conversation rather than a survey, skip the Marvel record and ask about the C+ CinemaScore. Students will explain at length why a horror film they rated poorly was still worth the ticket, and the answer — that the product is the room, not the film — is one they arrive at themselves.",
      src: ["Boxoffice Pro","https://www.boxofficepro.com/weekend-box-office-spider-man-takes-a-fourth-spin-at-the-top/"] },
    { cat: "Reading", t: "The self-published LitRPG series now has two books on the multi-list bestseller board",
      why: "Book Riot's cross-list roundup, which blends the New York Times, USA Today, Publishers Weekly, Amazon and the Indie Bestsellers list, now has Matt Dinniman occupying two of the nine multi-list slots. Dungeon Crawler Carl appears on four of the five lists; The Dungeon Anarchist's Cookbook — a 2024 title, the third in the series — is a fresh debut on three. A LitRPG series that began as self-published serial fiction is now doing what franchise fiction does, and it is doing it on the back catalogue, not just the new release. Note what the roundup does not say: it makes no mention of BookTok at all. The influence is visible only in the sales data and never labelled, which is a measurement problem rather than a modesty one. The official BookTok Bestseller List, launched in March by Media Control with TikTok and blending NielsenIQ sales data with BookTok engagement, is United Kingdom only. There is no US equivalent. Every American claim about BookTok's commercial power — including this one — is inferred from retailer proxies rather than measured directly.",
      rec: "When a student mentions a book everyone is reading, ask how they found it rather than what they thought. You will usually get an account of a recommendation chain with no identifiable origin, which is exactly why nobody can measure this and why publishers are guessing too.",
      src: ["Book Riot","https://bookriot.com/bestselling-books-august-20-2026/"] },
    { cat: "Online", t: "The archive-footage pattern has collapsed, and what replaced it is mostly not American",
      why: "Two weeks ago almost everything trending on Know Your Meme was built from old clips; last week it was about four of seven; this morning it is two of seven — the Robert Loggia Family Guy cutaway from 2007 and the Three Layer Dip Stack, which is a 2026 TikTok song built on a line from a 2020 Pringles Super Bowl commercial. Everything else is natively generated: Petra Parker, the Spider-Man fan-art trend; the GTA 6 leaks, now their own KYM entry; Ariana Grande's “Petal,” which originated as a fake leak and is resurging; the Lindsay Clancy trial, which is news-driven; and a brand-new entry added Monday, “Udin Din Din Din Dun.” That last one matters for the pattern, because it is the second Indonesian brainrot character to break through in a fortnight, after Chanty Beluga. So Chanty Beluga was not a one-off, native formats are now the clear majority, and the pipeline feeding them is substantially not American — two of seven trending items are Indonesian or descended from Indonesian formats, and a third is a Pringles ad.",
      rec: "The useful move is to stop trying to place a reference and start asking where it came from. “Is that an American thing?” is a question students enjoy answering and frequently cannot, which turns a moment of being out of the loop into a genuinely open question you are both in.",
      src: ["Know Your Meme","https://knowyourmeme.com/newsfeed/trending"] },
    { cat: "Online", t: "They arrived from high schools with phone hotels and blanket AI bans, and they noticed the double standard",
      why: "The students starting this term spent their last two years of high school under device regimes that are now normalised, and they have opinions about how those regimes were run. Pew finds 48% of Americans support cell phone bans in schools against 43% opposed, with younger adults notably less supportive than the population overall. “Phone hotels” — the wall pocket you deposit your phone into on the way in — became the standard ritual. One eighteen-year-old's account of the arc: phone hotels “became standard by senior year after minimal restrictions in freshman/sophomore years.” On AI, schools implemented absolute bans with, in the reporting's phrase, minimal nuance — and a sixteen-year-old's summary of how that landed is the line worth carrying into your first class: “Teachers ban AI while using it themselves; messaging feels contradictory and hypocritical.” Set that next to what this desk carried Monday — 68% of middle and high school students use chatbots for homework help, while more than half of Gen Z say they dislike AI-generated content relative to human-made work. They are not confused. They are describing a rule they experienced as applying in one direction only.",
      rec: "If you are going to set an AI policy, say out loud what you yourself will and will not use it for in the course — grading, feedback, writing the problem sets. It costs one sentence in the syllabus, and it is the single thing most likely to make the rest of the policy land as a rule rather than as a double standard.",
      src: ["ICYMI (Lia Haberman)","https://liahaberman.substack.com/p/icymi-gen-z-alpha-back-to-school"] },
    { cat: "Playing", t: "Gamescom's big show is this afternoon, and Rockstar still has not identified its leaker",
      why: "Gamescom Opening Night Live runs today at 2 p.m. Eastern, hosted by Geoff Keighley and Eefje “Sjokz” Depoortere for about two hours, with The Witcher 3: Songs of the Past, Final Fantasy VII Revelation, Gears of War: E-Day, Ananta, Tides of Annihilation, Metro 2039, Game of Thrones: War for Westeros and Warlock: Dungeons & Dragons confirmed. It arrives with the GTA VI situation unresolved: Rockstar has not identified CyberLeek, Bloomberg's Jason Schreier reports management treating the response as all hands on deck with employees “frustrated and exhausted,” and there is no delay — the Nov 19 date, the $79.99 and $99.99 editions, the disc-free release and the Nov 12 preload all stand, and a Netflix reveal was scheduled for today. The detail worth noticing is that a second, unrelated leak hit Rockstar around the same time: an Xbox Graphics Capture file containing 3D models, map textures, telemetry, skybox height and map depth data — enough to reconstruct the complete map — obtained from an employee compromised by phishing. So the campaign with a stated grievance about digital ownership got the clips, and an ordinary phishing email got the map.",
      rec: "Ask which of the two leaks they had heard about. Almost everyone will know the one with a name and a manifesto and almost nobody the one that actually exposed more, which is a tidy demonstration of why the story with a protagonist travels and the structural one does not.",
      src: ["Insider Gaming","https://insider-gaming.com/rockstar-suffers-new-gta-6-map-leak-separate-cyberleek/"] }
  ],
  classnote: { t: "The back-to-school data this year describes something worth putting in front of a principles class in week one, because it is a budget-constraint story that students will recognise as their own. The Harris Poll finds 62% of Gen Z avoid making weekend plans because of financial anxiety, and 85% are building low-cost social workarounds instead. RTB House finds 50% now deliberate two or more days before a purchase. Lia Haberman's read is that the “spending hangover” has replaced FOMO as the defining emotion of the cohort. Libby Rodney, chief strategy officer at Harris: “Gen Z avoids spending due to financial regret; they rebuild social lives around affordability.” Start by asking what 62% actually means, and insist on precision. It is not that they cannot afford a weekend out; it is that the anticipated regret is large enough to change the decision before it is made. That is a wedge between the price of a good and its perceived cost, and it is worth naming as such. Then have them account for the 85%. If the plans are not being cancelled but relocated to cheaper substitutes, total consumption may barely move while its composition shifts entirely — which is the same substitution result the SNAP soda hook produces, arriving from the demand side rather than the policy side. Ask what a firm selling the expensive version should conclude, and steer them past “lower the price” to the sharper answer: the binding constraint is not the price, it is the deliberation. Fifty percent taking two or more days before a purchase is a search cost the consumer is imposing on herself, and impulse-dependent business models are the ones that break. Now bring in the counterweight, because a class that concludes Gen Z simply spends less has missed the interesting half. Dorm-related creator activity is up 116% year over year, college shopping content up 53%, and back-to-school hauls took 800 million YouTube views in the past year. BadCredit.org finds 74% of US parents prioritise peer parity on the first day of school. So the same cohort deliberating for two days over a purchase is consuming an enormous volume of content about purchases, and their parents are spending specifically so their children do not look different. Ask them to reconcile it. The reconciliation is that these are different goods: the weekend out is private consumption, and the dorm room and the first-day outfit are positional. Positional goods do not respond to income the way private ones do, because their value is defined relative to what everyone else has — which means a general tightening can leave positional spending untouched or even raise it. Have them state the condition under which that happens, and then ask the uncomfortable follow-up: if everyone in the dorm spends more to keep pace, who is better off? Nobody, in relative terms, and everyone is poorer in absolute terms. That is a coordination failure they can feel, which makes it stick better than the standard arms-race example. Close on the intermediary, because it is where the money actually flows. Amber Venz Box of LTK: “Creators shape how Gen Z discovers trends, shops, and personalizes trends across categories.” Ask what a creator is, economically — not an advertiser and not a retailer, but a matching technology that lowers search costs for a cohort that has decided search costs are worth paying. Then ask why Target and IKEA each hold roughly 30% of AI visibility in this category, and what it means that the next search layer is one where two firms occupy a third of the answer space. That is a market-structure question with no settled answer, which makes it a good one to leave open.",
    src: ["ICYMI (Lia Haberman)","https://liahaberman.substack.com/p/icymi-gen-z-alpha-back-to-school"] },

/* ---------------- State ---------------- */
const state = {
  live: new Map(),        // feedId -> [{t,u,d:Date|null}]
  status: new Map(),      // feedId -> 'live' | 'baked' | 'fail'
  fetching: false,
  lastFetch: null,
  query: ""
};
FEEDS.forEach(f => state.status.set(f.id, "baked"));

/* ---------------- Utilities ---------------- */
const esc = s => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function parseDate(x) { const t = Date.parse(x); return isNaN(t) ? null : new Date(t); }
function timeAgo(d) {
  if (!d) return "";
  const s = (Date.now() - d.getTime()) / 1000;
  if (s < 0) return "";
  if (s < 3600) return Math.max(1, Math.round(s / 60)) + "m ago";
  if (s < 86400) return Math.round(s / 3600) + "h ago";
  if (s < 86400 * 14) return Math.round(s / 86400) + "d ago";
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function itemsOf(id) {
  const live = state.live.get(id);
  if (live && live.length) return live;
  return (BAKED.items[id] || []).map(it => ({ t: it.t, u: it.u, d: parseDate(it.d) }));
}
function titleKey(t) { return t.toLowerCase().replace(/[^a-z0-9Ѐ-ӿ]+/g, "").slice(0, 80); }

/* ---------------- Fetch layer ---------------- */
const PROXIES = [
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u)
];
function fetchTimeout(url, ms) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal, redirect: "follow" }).finally(() => clearTimeout(t));
}
async function fetchFeedText(url) {
  try { const r = await fetchTimeout(url, 7000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  for (const p of PROXIES) {
    try { const r = await fetchTimeout(p(url), 11000); if (r.ok) { const tx = await r.text(); if (tx.length > 200) return tx; } } catch (e) {}
  }
  throw new Error("unreachable");
}
function parseFeed(xml, feed) {
  const doc = new DOMParser().parseFromString(xml.trim().replace(/^﻿/, ""), "text/xml");
  if (doc.querySelector("parsererror")) throw new Error("parse");
  let nodes = Array.from(doc.querySelectorAll("item"));
  const atom = !nodes.length;
  if (atom) nodes = Array.from(doc.querySelectorAll("entry"));
  const out = [];
  for (const n of nodes.slice(0, 25)) {
    let t = (n.querySelector("title")?.textContent || "").trim();
    if (!t) continue;
    if (feed.gn) t = t.replace(/\s+-\s+[^\-–—]{2,60}$/, "");
    let u = "";
    if (atom) {
      const alt = n.querySelector('link[rel="alternate"]') || n.querySelector("link");
      u = alt ? (alt.getAttribute("href") || "") : "";
    } else {
      u = (n.querySelector("link")?.textContent || "").trim();
      if (!u) u = n.querySelector("link")?.getAttribute("href") || "";
      if (!u) u = (n.querySelector("guid")?.textContent || "").trim();
    }
    const dRaw = n.querySelector("pubDate")?.textContent
      || n.getElementsByTagName("dc:date")[0]?.textContent
      || n.querySelector("published")?.textContent
      || n.querySelector("updated")?.textContent || "";
    out.push({ t, u, d: parseDate(dRaw) });
  }
  if (!out.length) throw new Error("empty");
  return out;
}
let renderTimer = null;
function scheduleRender() { clearTimeout(renderTimer); renderTimer = setTimeout(renderAll, 600); }
async function fetchAll() {
  if (state.fetching) return;
  state.fetching = true;
  updateHeader();
  const queue = FEEDS.slice();
  let done = 0;
  async function worker() {
    while (queue.length) {
      const f = queue.shift();
      try {
        const txt = await fetchFeedText(f.u);
        state.live.set(f.id, parseFeed(txt, f));
        state.status.set(f.id, "live");
      } catch (e) {
        if (!(BAKED.items[f.id] || []).length) state.status.set(f.id, "fail");
      }
      done++;
      updateHeader();
      scheduleRender();
    }
  }
  await Promise.all(Array.from({ length: 8 }, worker));
  state.fetching = false;
  state.lastFetch = new Date();
  updateHeader();
  renderAll();
}

/* ---------------- Render helpers ---------------- */
function badge(p) {
  const per = PERS[p] || PERS.none;
  if (!per.label) return "";
  return `<span class="badge"><i style="background:var(${per.v})"></i>${per.label}</span>`;
}
function itemLi(it, srcName) {
  const meta = [srcName, timeAgo(it.d)].filter(Boolean).join(" · ");
  return `<li class="it" data-s="${esc((it.t + " " + (srcName || "")).toLowerCase())}">
    <a href="${esc(it.u)}" target="_blank" rel="noopener">${esc(it.t)}</a>
    ${meta ? `<span class="meta">${esc(meta)}</span>` : ""}</li>`;
}
function feedCard(id, cap = 4) {
  const f = FEED_BY_ID[id];
  const its = itemsOf(id).slice(0, cap);
  const st = state.status.get(id);
  const dot = `<span class="src-dot ${st}" title="${st === "live" ? "live feed" : st === "baked" ? "snapshot from last rebuild" : "feed unreachable"}"></span>`;
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it)).join("")}</ul>`
    : `<div class="empty">Nothing loaded — open the source directly.</div>`;
  return `<div class="card" data-card="${f.id}">
    <h3>${dot}<a href="${esc(f.home)}" target="_blank" rel="noopener">${f.n}</a>${badge(f.p)}</h3>${body}</div>`;
}
function mergedItems(ids, { filter = null, cap = 10 } = {}) {
  const seen = new Set(); const out = [];
  for (const id of ids) {
    const f = FEED_BY_ID[id];
    for (const it of itemsOf(id)) {
      if (filter && !filter.test(it.t)) continue;
      const k = titleKey(it.t);
      if (seen.has(k)) continue;
      seen.add(k);
      out.push({ ...it, src: f.n.replace(/ —.*$/, ""), p: f.p });
    }
  }
  out.sort((a, b) => (b.d?.getTime() || 0) - (a.d?.getTime() || 0));
  return out.slice(0, cap);
}
function mergedCard(title, ids, opts = {}) {
  const its = mergedItems(ids, opts);
  const body = its.length ? `<ul class="items">${its.map(it => itemLi(it, it.src)).join("")}</ul>`
    : `<div class="empty">No matching headlines loaded yet.</div>`;
  return `<div class="card"><h3>${title}</h3>${body}</div>`;
}
function colhead(t, sub = "") {
  return `<div class="colhead">${t}${sub ? `<span class="sub">${sub}</span>` : ""}</div>`;
}

      <p><b>Freshness:</b> a scheduled task rewrites the Morning brief, the classroom hooks, the Student Pulse, and the saved headlines once a day, every morning around 5:00 a.m. Detroit time. Independently, every time you open the page it re-pulls all 98 feeds live (green dot = live; gray = snapshot from the last rebuild; red = source unreachable right now). The FX tiles pull European Central Bank reference rates live.</p>
      <p><b>Paywalls &amp; plumbing:</b> FT and The Economist feeds carry headlines; the click may hit a paywall. Sources without a usable public feed arrive via a Google News query (their headlines, Google's plumbing). YouTube cards list each channel's latest uploads.</p>
      <p><b>Student Pulse:</b> a standing answer to “what are my undergraduates into right now?” Each refresh rewrites the Pulse check — what they're listening to, watching, reading, playing, and doing online — with a line of analysis and one practical way in for you, plus a weekly youth-market story that doubles as a micro example. The aim is fluency, not imitation: knowing what Haymaker Valley is beats referencing it.</p>
      <p><b>Mind &amp; Cosmos:</b> your standing shelf for consciousness studies, Dzogchen and Tibetan Buddhism, Advaita Vedanta, quantum physics and computing, and psychedelics research — mixing contemplative magazines (Tricycle, Lion's Roar, Buddhistdoor), consciousness-first essays (Essentia, Aeon/Nautilus filtered, Closer to Truth), hard physics (Quanta, Physics World, new arXiv quant-ph papers), and the psychedelic research pipeline (Psychedelic Alpha, PsyPost, MAPS). Teaching &amp; pedagogy has its own column under Higher Ed, and the Culture tab keeps a Director watch on Lynch, Noé, von Trier, and Refn alongside Criterion, MUBI, and Senses of Cinema.</p>
      <p><b>Culture without the WSJ:</b> FT Life &amp; Arts and Aeon are the closest substitutes for the WSJ weekend essay; the New Yorker, NYRB, and The Atlantic cover the long-form review beat; ARTnews and Guardian Culture carry art-world news; Vogue, Business of Fashion, and Variety keep a lighter eye on style and entertainment.</p>
    </div>`;
}
function renderAll() {
  renderToday(); renderGeo(); renderEcon(); renderHealth(); renderMichigan(); renderEducation(); renderMind(); renderPulse(); renderCulture(); renderAbout();
  applySearch();
}

/* ---------------- FX tiles (ECB reference rates via Frankfurter, CORS-open) ---------------- */
async function renderFx() {
  const el = document.getElementById("fx");
  if (!el) return;
  try {
    const [nowR, prevR] = await Promise.all([
      fetchTimeout("https://api.frankfurter.dev/v1/latest?base=USD&symbols=EUR,GBP,JPY,CNY", 8000).then(r => r.json()),
      fetchTimeout(prevDateUrl(), 8000).then(r => r.json())
    ]);
    const defs = [
      { k: "EUR / USD", f: r => 1 / r.rates.EUR, dp: 4 },
      { k: "GBP / USD", f: r => 1 / r.rates.GBP, dp: 4 },
      { k: "USD / JPY", f: r => r.rates.JPY, dp: 2 },
      { k: "USD / CNY", f: r => r.rates.CNY, dp: 3 }
    ];
    el.innerHTML = defs.map(d => {
      const v = d.f(nowR), pv = d.f(prevR);
      const pct = ((v - pv) / pv) * 100;
      const dir = pct >= 0.005 ? "up" : pct <= -0.005 ? "down" : "";
      const arrow = dir === "up" ? "▲" : dir === "down" ? "▼" : "–";
      return `<div class="tile"><div class="k">${d.k}</div><div class="v">${v.toFixed(d.dp)}</div>
        <div class="d ${dir}">${arrow} ${Math.abs(pct).toFixed(2)}% <span style="color:var(--muted)">vs prior day</span></div></div>`;
    }).join("") + `<div class="tile"><div class="k">ECB ref rates</div><div class="v" style="font-size:13px;font-weight:400;color:var(--ink2)">as of ${esc(nowR.date)}</div></div>`;
  } catch (e) {
    el.innerHTML = `<div class="empty">Live FX unavailable — use the market links below.</div>`;
  }
}
function prevDateUrl() {
  const d = new Date(Date.now() - 86400000 * (new Date().getDay() === 1 ? 3 : 1));
  const iso = d.toISOString().slice(0, 10);
  return `https://api.frankfurter.dev/v1/${iso}?base=USD&symbols=EUR,GBP,JPY,CNY`;
}

/* ---------------- Header / chrome ---------------- */
function updateHeader() {
  const live = FEEDS.filter(f => state.status.get(f.id) === "live").length;
  const fail = FEEDS.filter(f => state.status.get(f.id) === "fail").length;
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("statusText");
  if (state.fetching) { txt.textContent = `pulling live feeds… ${live}/${FEEDS.length}`; dot.classList.toggle("on", live > 0); }
  else if (live > 0) { txt.textContent = `${live} live · ${FEEDS.length - live - fail} snapshot${fail ? ` · ${fail} unreachable` : ""}`; dot.classList.add("on"); }
  else { txt.textContent = `snapshot of ${BAKED.builtLabel}`; dot.classList.remove("on"); }
  document.getElementById("refreshBtn").disabled = state.fetching;
}
function applySearch() {
  const q = state.query.trim().toLowerCase();
  let n = 0, tot = 0;
  document.querySelectorAll("li.it").forEach(li => {
    tot++;
    const hit = !q || (li.dataset.s || "").includes(q);
    li.classList.toggle("hiddenBySearch", !hit);
    if (hit) n++;
  });
  document.getElementById("searchCount").textContent = q ? `${n} match${n === 1 ? "" : "es"}` : "";
}
function initChrome() {
  document.getElementById("dateline").textContent = new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  document.getElementById("nav").addEventListener("click", e => {
    const b = e.target.closest(".tab-btn"); if (!b) return;
    document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x === b));
    document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + b.dataset.tab));
  });
  document.getElementById("refreshBtn").addEventListener("click", fetchAll);
  const themes = ["auto", "light", "dark"]; let ti = 0;
  document.getElementById("themeBtn").addEventListener("click", () => {
    ti = (ti + 1) % 3;
    const t = themes[ti];
    if (t === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = t;
    document.getElementById("themeBtn").textContent = "Theme: " + t[0].toUpperCase() + t.slice(1);
  });
  document.getElementById("search").addEventListener("input", e => { state.query = e.target.value; applySearch(); });
}

/* ---------------- Boot ---------------- */
initChrome();
renderAll();
updateHeader();
fetchAll();
</script>
