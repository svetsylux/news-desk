<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "THE KYIV LEG HAPPENED, THE ENVOYS GOT THERE BY TRAIN, AND IT FAILED. Yesterday's brief left Steve Witkoff and Jared Kushner in transit at Rzeszow in Poland at 1:31 a.m., with no arrival reported anywhere and the leg labelled unconfirmed. It is now confirmed, and the mode of travel is the first detail worth having: the Kyiv Independent reports the pair reached Kyiv BY RAIL because aircraft could not land, Russian strikes having closed the airports — the same inference TASS had drawn from the Rzeszow landing, borne out. They met Volodymyr Zelensky in central Kyiv. Meduza counts three rounds of talks; the Moscow Times puts roughly three hours with Ukrainian negotiators, with the British, French and German national security advisers joining subsequent sessions. ⭐⭐ AND THE RESULT IS A CLEAN NEGATIVE, WHICH IS RARER AND MORE USEFUL THAN A COMMUNIQUÉ. The Kyiv Independent's headline is “‘The war will continue' — US peace push fails to achieve deal.” Zelensky, on the record: “We very much hope that we will be able to reach agreements with our American partners, and we are counting on the support of our European partners if the war continues in winter — and this is how it appears at the moment.” He also said security guarantees are needed and “a dignified post-war peace is needed,” and, pushing back on what Moscow wants the talks to be about, “This is not just about the Donbas. I think it is about the war as a whole.” Witkoff's account is warmer and thinner: “We think we have the ingredients to get to that place. We've had a very meaningful discussion, substantive, important, and we are very encouraged and we look forward to continuing this as long as it takes,” plus the one forward-looking claim anybody made — “You heard President Zelensky talk about a trilateral that we're hopeful will be announced in short order.” Kushner: “Hopefully this trip has come out with some new ways to advance forward. I think we've learned a lot from the trip.” A White House official said the envoys “discussed substantive plans for next steps, which will be announced in the coming weeks.” ⭐ THE UNNAMED “IDEAS” ARE NOW HALF-DESCRIBED, WHICH IS AS FAR AS ANYONE HAS GOT. Yury Ushakov said on Saturday that the Americans had “outlined a number of ideas regarding possible avenues for a settlement” and named none of them. Meduza gets closest: the envoys brought “updated versions” of prior documents, “revised to reflect the changed circumstances,” and Meduza identifies CONTROL OF DONBAS as the central negotiating issue — which is precisely what Zelensky's “not just about the Donbas” line is refusing. So the shape of the disagreement is now public even though the text is not. ⚠️ One personnel caution: TASS's account names Kyiv's participants, including Kirill Budanov as head of Zelensky's office and Rustem Umerov as foreign intelligence chief. Those attributions could not be corroborated from a Ukrainian source and are published here as TASS's claim rather than as facts about who holds which job.",

      { t: "THE CAPITALS TRUCE HELD FOR KYIV — AND THIS DESK HAD ITS END DATE WRONG, WHICH IS WORTH CORRECTING BEFORE ANYTHING ELSE. Yesterday's brief said the three-day pause on long-range strikes against Kyiv and Moscow ran “to about Sept 8.” Two sources put it a day earlier. The Kyiv Independent's war-latest of Sept 6 records that Putin ordered no strikes on Kyiv for three days from midnight and that Zelensky agreed Ukraine would refrain from striking Moscow “from that moment THROUGH SEPTEMBER 7”; the Moscow Times says flatly that the Kremlin “announced it would pause strikes on Kyiv UNTIL MONDAY.” September 8 belongs to something else entirely — the separately reported Ukrainian “silence regime,” whose window is midnight Sept 5 to 23:59 Sept 8. Two different clocks were welded into one, here, yesterday. Today is the last day of the capitals pause, not the second-to-last. ⭐ ON THE SUBSTANCE, IT HELD WHERE IT APPLIED: the Kyiv Independent reported no hits in Kyiv city proper during the declared pause, with fires in Kyiv Oblast only, and no new Ukrainian strike on Moscow was reported. ⚠️ THE CHEAPEST SINGLE INDICATOR COULD NOT BE READ THIS MORNING, AND THAT IS A CHECKED ABSENCE RATHER THAN A HOLE. The Russian Defence Ministry's overnight air-defence tally for Sept 6–7, whose region list is the thing that shows whether Moscow oblast was touched, had not been published or indexed as of this writing after four searches and three fetches of TASS — which IS publishing Sept 7 copy, so this is not an outage. The three prior nights stand as three distinct nights and must never be averaged: 490 (Sep 3–4), 53 (Sep 4–5), 258 (Sep 5–6, with Moscow oblast absent from the ministry's own list). ⚠️ AND A TRAP WORTH NAMING: a TASS item dated Sept 6 reports 400 fixed-wing UAVs over 24 hours. That is the ARMY'S COMBAT-ZONE report, a different instrument from the air-defence-over-Russian-territory tally, and it does not belong in that series. What Ukraine's side of the same window does show, via the air force through UNN: 92 drones and Banderol munitions launched overnight, 71 downed or suppressed, hits at twelve locations, launched from Oryol, Primorsko-Akhtarsk, occupied Donetsk and Hvardiiske in occupied Crimea. ⭐⭐ AND THE LYSAK QUESTION IS SETTLED, DOCUMENTARILY, AGAINST THE OUTLET THAT RE-OPENED IT. Ukrinform carries the appointment itself — Presidential Decree No. 119/2025-rp, “To appoint Serhii Petrovych Lysak Head of the Odesa CITY Military Administration,” a post whose full formal title is head of the city military administration of the Odesa district of the Odesa region, and he came to it from the Dnipropetrovsk REGIONAL administration. So this desk's three-way resolution was right and the Kyiv Independent's Sept 6 line — “Odesa Oblast… said Governor Serhii Lysak” — is wrong twice over, in jurisdiction and in title. It is also self-refuting: the hyperlink in that very sentence points at the Odesa CITY military administration's Telegram channel. ⚠️ Oleh Kiper as the oblast head was NOT re-verified this run and carries over unconfirmed.",

      { t: "ISW PUTS A YEAR ON IT, AND THE YEAR IS 2032. The Institute for the Study of War's September 6 assessment is unusually blunt about the gap between the war Putin describes and the war being fought. “Russian President Vladimir Putin reiterated Russia's unwillingness to make any meaningful compromises in the peace negotiations process to end the war in Ukraine,” it begins, and then: “Putin is doubling down on the fictional battlefield situation that he defines as ‘reality' and insisting that his misrepresentation of the actual state of the war become the basis for any peace negotiations on Ukraine.” ISW attributes the misperception to his own chain of command — “The lies and distortions of Russian military commanders at many levels are likely leading Putin to harden his perception that Russian forces can achieve his intended objectives in Donetsk Oblast by the end of 2026” — and then supplies the arithmetic that makes the claim checkable rather than rhetorical: “RUSSIAN FORCES WILL NOT SEIZE DONETSK OBLAST UNTIL 2032 AT THEIR CURRENT RATE OF ADVANCE — IF THEY CAN SEIZE IT AT ALL.” ⭐ AND IT IS NOT A ONE-SIDED DOCUMENT, WHICH IS WHY THE 2032 LINE IS WORTH TAKING SERIOUSLY: the same assessment records that “Russian forces have achieved tactically-significant advances in the Hulyaipole direction in the past several months.” That is the first Russian advance this desk has seen ISW affirm in this run of assessments, and it sits in the same paragraph as the projection. ⚠️ Note also what the assessment does NOT contain: no mention of the capitals truce, and no mention of the reported Ukrainian silence regime — an analytic silence rather than a denial, and a different thing from either. ⚠️ TWO METHOD NOTES, BOTH ABOUT HOW THIS WAS OBTAINED RATHER THAN WHAT IT SAYS. First, criticalthreats.org returned PROVENANCE_REQUIRED and its own search index stopped at September 5, so the assessment was read via the Kyiv Post repost — the lag runs in both directions and yesterday it ran the other way, which is exactly why both paths get checked every run and a failure gets recorded as a failure. Second, on the silence regime itself: the Meduza piece this desk cited as carrying a Tregubov denial DOES NOT CONTAIN ONE. Read in full, its only official-status line is “Ukrainian authorities have not officially announced the order.” If a denial from the Joint Forces spokesman exists it is somewhere else, and the claim is withdrawn here rather than repeated. Against the regime holding, what does exist is circumstantial: the Moscow Times reports fighting continuing along the 1,200-kilometre front, and TASS claims a tightening encirclement at Vovchansk.",

      { t: "⭐⭐ IRAN DID NOT TEST ADMIRAL COOPER'S EXCHANGE RATE. IT ROUTED AROUND IT — AND THAT IS A MORE INTERESTING RESULT THAN EITHER OUTCOME THIS DESK WAS WATCHING FOR. On Friday the head of CENTCOM published something militaries almost never publish: an explicit price. “If you shoot at two of our ships, we will impose an even higher economic cost — taking out three of yours,” Admiral Brad Cooper said, after IRGC ballistic missiles were fired at an American carrier and a destroyer and CENTCOM destroyed or disabled three IRGC-linked tankers. Defence Secretary Pete Hegseth put the same rule more plainly: “It's simple: if Iran shoots at US ships, we will destroy their oil tankers.” A stated ratio is a testable prediction, so the question was whether Iran would fire again and whether three more tankers would burn. Neither happened. What happened instead, at 04:03 BST on Sept 6, is that the IRGC claimed to have struck an American UNMANNED SURFACE VESSEL in the Strait of Hormuz — corroborated independently by Middle East Eye and RFE/RL, with no US confirmation, no US denial, no damage detail and no named IRGC official. The IRGC statement: “This strategic waterway is under the control of the Islamic Republic of Iran, and any move by the child-killing enemy will be met with a firm response.” AND NO CENTCOM TANKER RETALIATION FOLLOWED. An unmanned vessel is cheap, deniable, and sits below the threshold Cooper actually priced — his rule names ships with crews. The ratio was neither broken nor upheld; the target class simply moved to the margin the rule did not cover. ⚠️ GLOBALSECURITY MISSED IT, FOR THE SECOND TIME IN A WEEK: its Day 191 log records only a Hezbollah drone attack for Sept 6 and no mention of a claim two outlets carried that morning. ⭐ Two upgrades it does supply: the tankers now have geography — M/T Downy disabled off KHARG ISLAND, M/T Stark 1 near JASK, M/T Kylo sunk in the GULF OF OMAN — and CENTCOM's redirection figure has moved from 87 to 92 vessels, with 3 disabled and 2 boarded. ⚠️ The two sides describe the warship encounter incompatibly: the IRGC says the carrier and destroyer were “forced to flee,” the US that both “successfully evaded.” ⭐⭐ SEPARATELY, IRAN HAS CLAIMED MANAGEMENT OF A SHIPPING CORRIDOR IN OMANI WATERS. Mohsen Rezaei, Secretary of the Supreme National Security Council — the post confirmed on the record by Al-Monitor, which matters given how many Iranian personnel facts have gone stale this year — said on Sept 7 that Iran will declare a restricted zone outside the Strait and open an Iran–Oman corridor: “The new restricted zone will begin from where the U.S. blockade of Iran begins”; any ship entering “would be added to a sanctions list”; and “the maps of a new international corridor which lies in Iranian and Omani waters AND IN WHICH IRAN WILL HAVE MANAGEMENT have been agreed and should be signed in the coming days.” That middle clause is a sovereignty claim, not a shipping notice. No coordinates, no signing date. ⚠️⚠️ AND A CORRECTION THIS DESK OWES: yesterday's brief had Trump threatening Pickaxe Mountain “on two consecutive days, in escalating language,” placing “We're going to take out Pickaxe Mountain” in the Oval Office on Sept 5. Al Jazeera's own explainer attributes that line to the HUGH HEWITT SHOW IN MID-JULY, seven weeks old, and dates the narrower Oval Office remark — the US knows “everybody that's moving at Pickaxe” — to SEPT 4. There was no escalation ladder. The mountain, roughly 220 km south of Tehran and 2 km from Natanz beneath hundreds of metres of granite, remains unstruck. ⚠️ Against Trump's “We're not fighting right now,” Responsible Statecraft counts 794 US wounded and 18 killed since Feb 28, 36 injured in the last fortnight — though its own split of 7 plus 4 deaths does not reach 18, and both figures are printed here rather than reconciled.",

      { t: "MARKET CLOSED. NO SUCH DATUM EXISTS — AND TODAY THAT IS THE WHOLE ANSWER, NOT AN EVASION. Today is Labor Day, and the Federal Reserve Board's own September calendar says so in the form that settles it: “Holiday - Labor Day (daily and weekly statistical releases rescheduled to Tuesday, September 8).” US equity, Treasury and options markets were shut Saturday and Sunday and are shut today. There is therefore no Monday close for the S&P 500, the Dow, the Nasdaq Composite, the Russell 2000, the VIX or the ten-year, and there cannot be one. That is a different sentence from “the numbers were flat,” and it is the true one: the observation was never made. Friday September 4 remains the most recent close and will remain so until Tuesday — S&P 7,718.36, Dow 53,414.25, Nasdaq Composite 26,506.99, Russell 2000 2,974.85 (the only index up), VIX 14.53, ten-year 4.789%. What did trade is FX and a shortened electronic commodity session, and the dollar index sat near 99.20 in early Asian hours. ⭐⭐ THE FED PATH DID MOVE, AND THE INTERESTING PART IS THAT TWO INSTRUMENTS HAVE CONVERGED. Investing.com's Fed Rate Monitor refreshed overnight to a genuinely new stamp — “Sep 07, 2026 01:25AM EDT,” against Friday night's “Sep 05” — and its components put the September 15–16 meeting at 41.3% for the current 3.50–3.75% range against 58.7% for 3.75–4.00%, i.e. a hike at 58.7% and a hold at 41.3%, the labels INFERRED rather than printed. Cumulative odds of at least one hike by December read 85.2%; two or more by March 2027, from its own components, 66.9%. ⭐ Note what did not happen: the page carried NO auto-summary line at all this run, so last week's summary-versus-components contradiction could not recur. Against that, CME Group's FedWatch printed roughly 58.3% for a September hike an hour later. ⭐ A GAP OF 1.6 POINTS ON FRIDAY HAS CLOSED TO 0.4. Two methodologies, an hour apart, now say the same thing: a September hike is a shade better than a coin flip and no more. ⚠️ The front end firmed while the tail eased — September up 0.3, December down 0.4, March down 0.7. ⚠️ CME's own page could not supply this: its probability grid is JavaScript-injected and the HTML contains no numbers, so the figure comes via FXStreet. ⭐ NO FED SPEAKER FOR A FIFTH DAY, established from the Board's own speeches index rather than inferred: Waller's Sept 3 remains newest, Barr's Sept 1 behind it, and the blackout began Saturday Sept 5. ⚠️ One unresolved conflict, flagged not published: the Board's calendar lists a Barr speech for Sept 9 INSIDE the blackout, naming the same forum as his Sept 1 speech, while Kiplinger's week-ahead has Wednesday empty. Treat as a calendar artifact until confirmed. ⭐ THE WEEK IS THE STORY, THEN. August PPI lands Thursday Sept 10 at 8:30; AUGUST CPI FRIDAY SEPT 11 AT 8:30, four days before the FOMC and inside the blackout, with no consensus published on either BLS schedule. Treasury's long-end buybacks double from $2bn to “at least $4 billion per operation” beginning WEDNESDAY. And the first thing that moves anything is NFIB Small Business Optimism at 6 a.m. Tuesday, before the cash market reopens. Elias Haddad of BBH frames the swing: “A hot CPI print would all but seal a September hike… A cooler reading would strengthen the case for a hold.”",
        s: [["investing.com Fed Rate Monitor (refreshed to “Sep 07, 2026 01:25AM EDT”; September at 58.7/41.3 from its components)","https://www.investing.com/central-banks/fed-rate-monitor"],["FXStreet (CME FedWatch at roughly 58.3%, and confirmation that US markets are shut for Labor Day)","https://www.fxstreet.com/news/united-states-dollar-index-strengthens-above-9900-as-robust-us-jobs-data-boosts-fed-rate-hike-bets-202609070225"],["Federal Reserve (the September calendar — “Holiday - Labor Day,” releases rescheduled to Tuesday)","https://www.federalreserve.gov/newsevents/2026-september.htm"],["BLS (the CPI release schedule — August CPI on Friday September 11 at 8:30 a.m.)","https://www.bls.gov/schedule/news_release/cpi.htm"],["US Treasury (buybacks rising from $2bn to “at least $4 billion per operation” from September 9)","https://home.treasury.gov/news/press-releases/sb0607"]] },
      { t: "⭐⭐ DIESEL SET A RECORD FOR A THIRD CONSECUTIVE DAY, AND THE SPREAD IS THE STORY RATHER THAN THE LEVEL. AAA's national average for diesel reached $5.8970 a gallon on data stamped September 6 — against $5.8819 on Saturday and the $5.85 of Friday that first topped June 2022's $5.81. Three days, three records, and it now sits 1.1 cents below $5.90. Up 29.4 cents in a week, 55.0 cents in a month, and 58.9% year on year against $3.7106 a year ago. ⭐ NOW PUT REGULAR GASOLINE BESIDE IT, BECAUSE THAT IS WHERE THE ECONOMICS IS: $4.1473, up 6.9 cents in a week and 29.6% year on year. Both fuels come out of the same barrel of crude and the same refineries, and one has risen at twice the annual rate of the other. THE DIESEL–GASOLINE SPREAD IS NOW $1.75 A GALLON. This is not a general crude pass-through — a crude shock lifts both — it is a distillate-specific squeeze, and it is corroborated on the futures board, where heating oil, the distillate contract, was the strongest mover of the session at $4.6241 a gallon, up 1.85%, while gasoline futures fell 0.42%. ⚠️ CRUDE ITSELF CANNOT BE STATED AS A SINGLE NUMBER TODAY, AND THE FAILURE MODE FOUND ON SATURDAY HAS RECURRED AND WORSENED. TradingEconomics is now carrying THREE mutually irreconcilable WTI readings on one site: a panel at $91.486, unmoved to three decimals from Friday and almost certainly stale; a table at $91.804; and fresh narrative prose, rewritten around the war, saying crude “rose above $93 per barrel on Monday, approaching three-month highs as the US and Iran exchanged strikes in the Middle East.” Brent splits the same three ways — panel $97.625, table $97.023, narrative “toward $97… extending last week's gains” — but there the DIRECTION is unambiguous even though the level is not, since every reading clears Friday's $96.28. All published, none reconciled. A stale panel is not a flat number, and the lesson from Saturday holds: read the narrative even when the panel has not moved. ⚠️ Gold splits by source rather than within one: Kitco has $4,428.10 bid, essentially unchanged from Friday, stamped 7:46 p.m. Sunday; TradingEconomics has $4,398.90, $29 lower. ⚠️ And a defect worth knowing: TradingEconomics' commodities table is rendering absolute changes with inverted signs today — gold shows “+33.66” beside “−0.76%” — so its percentages are usable and its absolute changes are not. ⭐ THE RUBLE HAS A VALID FIGURE TODAY, WHICH IS THE OPPOSITE OF THE EQUITY ANSWER AND WORTH SAYING PRECISELY. The Bank of Russia sets fixings on working days effective the NEXT calendar day, so Friday's setting — USD ₽86.5857, EUR ₽100.5693, effective 05.09.2026 — covers Saturday, Sunday and Monday and IS today's official rate. A fixing set today, effective Sept 8, had not appeared by noon Moscow: checked, not there yet. Key rate 14.00%, with the board meeting FRIDAY, the same day as US CPI.",
        s: [["AAA (the national average — diesel at a third consecutive record, $5.8970, against gasoline at $4.1473)","https://gasprices.aaa.com/"],["TradingEconomics (WTI: a stale panel, a different table and a rewritten narrative, all published together)","https://tradingeconomics.com/commodity/crude-oil"],["TradingEconomics (Brent toward $97 — the level disputed, the direction not)","https://tradingeconomics.com/commodity/brent-crude-oil"],["Bank of Russia (Friday's fixing still running — and still today's official rate)","https://www.cbr.ru/eng/currency_base/daily/"]] },

      { t: "⚠️⚠️ THE VACCINE COMMENT COUNTER DID NOT MOVE, AND THE REASON IS THAT THE PAGE DID NOT MOVE EITHER — SO YESTERDAY'S QUESTION IS STILL OPEN. Saturday's finding was that comments on the HHS vaccine RFI had jumped from 3,896 to 9,798 in under a day, a 2.51-fold rise against a trailing pace near 790 a day, and the test proposed for today was simple: keep climbing at roughly 5,000 a day and the surge is a real filing campaign before the September 20 close; revert to about 4,000 and the 9,798 was a batch artifact. Neither, because THE FEDERAL REGISTER PAGE SERVED A BYTE-IDENTICAL STALE CACHE. Both the comment count of 9,798 and the page-view count of 12,764 came back unchanged under an identical timestamp — “Page views 12,764 as of 09/06/2026 at 4:15 am EDT” — on two independent fetches, one of them written narrowly to ask for the numbers rather than for whether the page worked. That is the signature of a served cache, not a plateau, and it is the same failure this docket produced on September 4 when 2,316 repeated itself. ⭐ THE RULE THIS KEEPS TEACHING, AND IT IS WORTH THE REPETITION: A STALE PAGE IS NOT A FLAT NUMBER. The series is unchanged and the discriminating reading has simply not been taken: 256, 504, 652, 720, 1,500, 1,500, 1,635, 1,828, 2,316, 2,316 (stale), 3,896, 9,798 — and then nothing. ⚠️ Note too that the visible timestamp attaches to PAGE VIEWS; the comment line carries none of its own, which is why staleness here has to be detected by byte-comparison rather than read off the page. ⭐ THE H-1B DOCKET, BY CONTRAST, IS THE FRESHEST IT HAS BEEN: 6,580 comments, up 96 from 6,484, on a page stamped “09/06/2026 at 10:15 pm EDT” — about six and three-quarter hours before this was written. Docket USCIS-2026-0298, RIN 1615-AD20, 91 FR 54817, closing September 24. ⚠️ AND THE DESYNCHRONISATION HAS SWAPPED DIRECTION AGAIN, WHICH IS NOW A THREE-RUN PATTERN RATHER THAN AN ODDITY: eighteen hours apart on Sept 5 with H-1B stale, six hours the other way on Sept 6, and eighteen hours back the other way today with H-1B fresh. Quote both stamps or quote neither. ⭐ The +96 is the smallest non-zero increment in the whole H-1B series, which ran 3,957, 4,814, 5,079, 5,432, 6,064, 6,064 (stale), 6,484, 6,580 — a sharp deceleration, but over an interval shorter than a day and against a prior reading whose own stamp is unknown, so it should not be annualised.",
        s: [["Federal Register (the vaccine RFI — 9,798 comments and 12,764 page views, byte-identical to yesterday under an identical stamp)","https://www.federalregister.gov/documents/2026/08/24/2026-17250/request-for-information-categories-used-in-federal-vaccine-recommendations-and-the-role-of-shared"],["Federal Register (the H-1B fee docket — 6,580 comments, stamped September 6 at 10:15 p.m. EDT)","https://www.federalregister.gov/documents/2026/08/25/2026-17324/fee-for-certain-h-1b-petitions"]] },
      { t: "⭐⭐ THE MOST-FAVORED-NATION COUNT WAS BEING GUARDED AGAINST AN ERROR IN THE WRONG DIRECTION, AND A LAW-FIRM BRIEFING SETTLES IT. This desk has repeatedly warned against adding the nine mid-sized manufacturers who signed Medicaid pricing deals on August 31 to the twenty-six already counted, on the ground that no source stated the cumulative figure. A source does state it. Gibson Dunn's Biotech Briefings of September 1, by Dan Mulloy: “The agreements bring the total number of manufacturers with MFN deals to 26, which the White House says covers 89 PERCENT OF THE BRANDED DRUG MARKET.” Twenty-six is the POST-deal total — seventeen large manufacturers plus the nine mid-sized — so the caution was right for the wrong reason: adding nine to twenty-six would not merely have been unsupported, it would have double-counted the same nine firms. The correct figures are 26 and 89%. The nine also committed $19.6bn of US manufacturing investment, and Senator Elizabeth Warren has renewed her demand that the deal terms be published — they remain unpublished, which is a live transparency gap rather than a rhetorical one. ⭐ THE ENFORCEMENT CLIFF IS 22 DAYS OUT: Section 232 tariffs of up to 100% took effect July 31 for the initial seventeen, and on SEPTEMBER 29 every other branded manufacturer becomes subject. ⭐ AND THE STRUCTURAL POINT SURVIVES THE CORRECTION AND IS STRONGER FOR IT, NOW IN ITS FIFTH WEEK: not one of the nine signatories — Alcon, Astellas, BeOne Medicines, BridgeBio, CSL, Kyowa Kirin, Sun Pharma, Teva, UCB — is a named founding member of the Midsized Biotech Alliance, which was formed in February specifically to represent that segment and has still said nothing. Checked two ways this run, including an explicit ask of the Gibson Dunn analysis, which does not mention the Alliance or any midsize trade group at all. A sourced silence, not an absence of looking. ⭐ SECTION 504 HAS MOVED PROCEDURALLY WITHOUT MOVING SUBSTANTIVELY: a CORRECTED joint motion for entry of final judgment was filed on September 1, superseding the original, and “the court has not yet entered the proposed judgment.” Alison Barkoff of George Washington University, now properly attributed: “We strongly and unequivocally condemn the actions of DOJ and HHS. This resolution continues the federal government's abandonment of its duty to enforce the right of people with disabilities to live in their own homes and communities.” ⚠️ A correction to this desk's own citation: the federal docket is 5:24-cv-00225 in the Northern District of Texas; the number carried here previously was a docket-tracking service ID, not a court number. ⚠️ The party count still reads five ways and is not reconciled, and the Olmstead margin — how many people the community-integration provision actually covers — is now unquantified after a sixth run of asking, with all three advocacy sources returning an explicit “no number appears.” ⭐ EBOLA IS UNCHANGED AND THE NON-UPDATE IS EXPECTED RATHER THAN OMINOUS: ECDC still reads Sept 4 at 14:25, data to Sept 2 — 6,342 cases, 3,072 deaths, 1,475 recovered, 770 in isolation, 60 of 151 health zones, contacts at 86.5% — because the page updates only on weekdays. ⚠️ The CFR was NOT printed this run; 48.4% is computed today, not quoted. No DON617 exists. ⭐ And the AFRO diagnosis sharpens again: situation report 14 was recovered through the search index, bypassing the module stuck on “Loading…” — proving the sitrep pipeline still produces and the module alone is broken.",
        s: [["Gibson Dunn Biotech Briefings (Dan Mulloy — 26 manufacturers, 89% of the branded market, and the September 29 cliff)","https://biotechbriefings.gibsondunn.com/mfn-goes-mid-market-nine-more-drugmakers-sign-medicaid-pricing-deals-as-the-september-29-tariff-deadline-approaches/"],["Disability Belongs (the corrected joint motion of September 1, and “the court has not yet entered the proposed judgment”)","https://www.disabilitybelongs.org/2026/09/texas-v-kennedy-action-update/"],["ECDC (the Ebola outbreak page — unchanged, data to September 2, and a weekday-only update cycle)","https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda"],["WHO (Disease Outbreak News 616 — still the newest, with no DON617 in existence)","https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON616"]] },
    ] },

      { t: "⭐⭐ HARVARD IS THE EIGHTEENTH INSTITUTION TO CURTAIL CURRICULAR PRACTICAL TRAINING, AND IT IS THE ONLY ONE THAT HAS PUBLISHED WHICH OF ITS OWN SCHOOLS LOSE IT. The Harvard International Office's guidance, reported by the Crimson on September 3: “Harvard will authorize CPT for F-1 students only where the opportunity is a formal requirement of the student's degree program, successful completion of the degree is contingent on CPT, and the required internship or practicum is offered by sponsoring employers through cooperative agreements with the school.” Then the part nobody else has printed — an itemised split. CPT IS GONE at Harvard College, the Law School, the Medical School, the Graduate School of Design and the Graduate School of Arts and Sciences. IT SURVIVES at the Business School, the Kennedy School, the Graduate School of Education, the Divinity School and the School of Public Health. One rule, ten schools, five and five — and the line falls exactly where professional programmes already embed required placements with cooperating employers, while the College and the arts-and-sciences graduate school do not. ⭐⭐ AND THE CONVERGENCE FINDING THIS DESK HAS BEEN INFERRING IS NOW DOCUMENTARY. Harvard cites TWO SEVP broadcast messages, dated AUGUST 12 and AUGUST 24. Berkeley, independently, cites “ICE Guidance Memos” dated “Wednesday August 12, 2026” and “Monday August 24, 2026.” Two institutions, two coasts, the same two dates. So this is not one broadcast message but a PAIR, in August, and USC's SEVP Broadcast Message 2608-02 is almost certainly one of them. Eighteen institutions did not independently reach the same conclusion; a two-step federal guidance sequence produced a national contraction through documents that expressly disclaim being rules. ⭐ BERKELEY IS ALSO PROMOTED TODAY FROM SECONDHAND TO FIRSTHAND, in its own words: “BIO has suspended, until further notice, all applications for ‘Course Credit CPT'.” ⚠️ Keep the nuance, because it is the same formula seen from the other side: degree-requirement and thesis CPT survive at Berkeley, so what has been killed is specifically the elective route — exactly what Michigan meant by “CPT tied to an elective course can no longer be approved.” ⚠️ Berkeley's page carries no posting date of its own, and that is stated rather than papered over. ⚠️ UCLA STAYS OUT, AND THE STANDARD THAT ADMITTED MICHIGAN AND USC IS THE STANDARD THAT KEEPS UCLA OUT: two of its own pages were read directly and neither carries any pause, suspension or restriction language — its immigration-updates page has not been touched since July 17. The secondhand claim that UCLA paused CPT is not supported by anything UCLA has published. Northwestern is a new headline-only lead, its student paper being robots-disallowed. ⭐ NAFSA v. DHS: STILL NO ORDER OF ANY KIND, EIGHT DAYS FROM THE RULE'S SEPTEMBER 15 EFFECTIVE DATE, confirmed three ways — NAFSA's tracker still stamped September 4 and therefore untouched all weekend, the Crimson recording that Judge Saylor “declined to rule immediately,” and two unfiltered searches surfacing nothing after September 4. The TRO he floated has not materialised. Government counsel is Michael A. Celone; for the plaintiffs, Paul W. Hughes III: “The agency failed in our view at every turn.” ⚠️ And one aggregator, news.clinchlaw.com, puts the hearing on September 9 — it was September 3. Do not cite that domain on this docket. ⭐ In pedagogy, Ghosh's “Tech-free teaching” survives a ninth challenger; the pattern is now stable enough to state as a finding — Faculty Focus's 2026 output is prescriptive, offering session designs without class sizes, timings or outcomes, while the one 2026 piece carrying figures had numbers but no design.",
        s: [["The Harvard Crimson (the Harvard International Office's school-by-school CPT split, and the two SEVP messages)","https://www.thecrimson.com/article/2026/9/3/cpt-authorizations-halted/"],["Berkeley International Office (“BIO has suspended, until further notice, all applications for ‘Course Credit CPT'”)","https://internationaloffice.berkeley.edu/students/employment/cpt"],["The Harvard Crimson (Saylor “struggling to see any rational connection”; the comment period “barely legal”)","https://www.thecrimson.com/article/2026/9/4/judge-student-visa-limit/"],["NAFSA (the case tracker, still stamped September 4 — the hearing held, and no order)","https://www.nafsa.org/legal-defense-DS"]] },
      { t: "⚠️⚠️ MICHIGAN'S TORNADOES: THIS DESK GOT THE COUNT, THE DATE AND THE CASUALTIES WRONG, AND THE NATIONAL WEATHER SERVICE'S OWN SURVEY CORRECTS ALL THREE. Saturday's brief reported two confirmed tornadoes from “Friday's severe weather,” with no injuries in any source checked. The NWS Detroit/Pontiac survey, which titles the event “September 2 and 3, 2026,” records THREE: an EF0 near Marysville in St. Clair County on SEPT 2 at 7:19 p.m.; an EF0 in Lincoln Park on SEPT 3 at 4:12 p.m.; and the EF2 two miles northeast of Comerica Park on SEPT 3 at 4:14 p.m. — a 3.50-mile path, half a mile wide at maximum, 115 mph winds, on the ground about four minutes, running near Mt. Elliott and East Vernor toward Belle Isle. So the storm was Wednesday and Thursday, not Friday; the ~241,000 outage figure belongs to 4 a.m. FRIDAY, the morning AFTER the tornado rather than the morning of it; and there was ONE INJURY, a man hurt shielding his infant when a tree struck their home. Ratings are preliminary and subject to final review. ⭐ THE 1997 QUESTION IS ALSO NOW ANSWERED BY THE NWS RATHER THAN SPECULATED: “the first confirmed tornado in the city of Detroit since the F2 that impacted the city on July 2, 1997.” Weather.com's flag, raised before confirmation, is vindicated — but it remains two facts from two moments, and they should not be welded into one sentence. ⭐ RESTORATION LOOKS SUBSTANTIALLY DONE: a third-party aggregator showed 2,734 DTE customers out at 1:31 a.m. today, roughly 0.1% of 2.93 million, against targets of 90% by Saturday night and everyone by Sunday. ⚠️ The peak is reported four ways — 241,000, 264,000, “almost 280,000,” “over 250,000 by noon Friday” — and belongs in a range, not a point. DTE's Brian Calka has given two distinct quotes and they should not be merged; the second, to BridgeDetroit: “I've been in the organization for 20 years… What I saw on the east side today was unlike anything I have seen in my history.” Mayor Mary Sheffield: “Aside from the young man, we still today have not received any reports of serious injuries to date.” No cost estimate and no disaster declaration — checked, not there. ⭐⭐ AND THE ELECTION-ADMINISTRATION FINDING IS THE ONE WITH CONSEQUENCES. The Board of State Canvassers' cancelled September 4 meeting has not been rescheduled — and the board has NO SEPTEMBER MEETING SCHEDULED AT ALL. Its next date is OCTOBER 23, more than a month AFTER ballots begin mailing on SEPTEMBER 19. No reason for the cancellation has been published. ⚠️ A second ghost URL on the poisoned /2026/09/04/ path was found 404-ing today; treat that whole path as untrustworthy. ⭐ ON LABOR DAY ITSELF, the Michigan League for Public Policy's Patrick Schaefer supplied the numbers and, unintentionally, a link to Wednesday: Michigan unemployment 5% against 4.2% nationally, labor underutilisation 9.1% against 7.9%, and “1.2 job seekers per job opening.” His conclusion lands squarely on the Ypsilanti data centre two days before its town hall: “AI, data centers and the tech industry do not seem to be the answer.” ⭐ That town hall — Wednesday, 5–7 p.m. at the Marriott at Eagle Crest — REACHED REGISTRATION CAPACITY ON AUGUST 20, with a waitlist and a livestream. ⚠️ And U-M has made two distinct nuclear statements that are compatible but not identical: its own Record describes “computational modeling for nuclear stewardship,” while spokesman Paul Corliss says the centre “would not involve the storage or handling of nuclear materials.” Modelling yes, materials no — do not collapse them.",
        s: [["National Weather Service Detroit/Pontiac (the survey — three tornadoes, September 2 and 3, one injury, and the July 2, 1997 comparison)","https://www.weather.gov/dtx/severeweather0902032026"],["BridgeDetroit (the EF2 on the east side, and the man hurt shielding his infant)","https://www.bridgedetroit.com/detroit-tornado-september-2026/"],["Michigan Secretary of State (the Board of State Canvassers — no September meeting, next date October 23)","https://www.michigan.gov/sos/elections/bsc"],["Michigan Advance (Labor Day: 1.2 job seekers per opening, and a direct shot at data centres)","https://michiganadvance.com/2026/09/07/policy-experts-ask-michigan-to-strengthen-workers-rights-as-state-grapples-with-economic-challenges/"],["U-M Record (the September 9 town hall — registration at capacity since August 20)","https://record.umich.edu/articles/u-m-to-host-town-hall/"]] },
      { t: "⭐⭐ MIND & COSMOS — THE UNBLINDING PROBLEM FINALLY HAS ITS NUMBERS, AND THEY ARE WORSE THAN THE ANECDOTES SUGGESTED. For several runs this desk has been chasing two papers on blinding integrity in psychedelic trials, both access-blocked — one behind robots on ScienceDirect, one behind a CAPTCHA on PubMed. The figures have now been recovered through a secondary carrier, Clinical Trial Vanguard, and they are these: ACROSS 112 RANDOMISED CLINICAL TRIALS of psychedelics as psychiatric interventions, psilocybin, LSD and ayahuasca trials report BLINDING FAILURE RATES EXCEEDING 90%; ONLY 29.5% — 33 OF THE 112 — EVALUATED BLINDING INTEGRITY AT ALL; and 57.1% merely acknowledged it as a limitation in the methods section. The arithmetic checks: 29.5% of 112 is 33.0. The corroborating figure elsewhere is participants “correctly identifying their assignment 90% of the time,” with the MDMA MAPP1 and MAPP2 trials described as near-total identification. ⚠️ TWO HONEST QUALIFICATIONS, BOTH OF WHICH MATTER. First, these carrier articles are dated June 2 and June 9, so this is RECOVERED DATA, NOT NEW COVERAGE — and the second of the two cites the first, so they are one story, not two. Second, and this is the joke that is not a joke: the review of blinding failure reports descriptive proportions and NOT ONE CONFIDENCE INTERVAL, including on its own headline number. “Exceeding 90%” is a threshold with no range, no per-trial breakdown, and no interval. ⭐ THE MISSING-ERROR-BAR CHECK HAS NOW FIRED FOUR RUNS RUNNING, and today on three separate items. The first human psilocin trial since the 1960s — Tai, Szigeti, Downey, Aday and colleagues at UCSF, n=20, in the Journal of Psychopharmacology — was re-checked against new coverage and remains entirely statistics-free: no p-values, no confidence intervals, no effect sizes, and no counts behind the tolerability claim either. An equivalence claim without an interval is a description, not a result. ⚠️ Keep it distinct from a SECOND psilocin paper with a DIFFERENT DOI, Vella and colleagues on neural growth in rat embryonic cortical neurons, which is in vitro and explicitly descriptive. ⭐ THE PHYSICS SIDE PRODUCED ACTUAL EXPERIMENTS FOR ONCE, AND THE LABEL TALLY IS THE FINDING: four experiments, two theory papers, two company announcements, two commentaries and one essay — against last week's one experiment and seven metric-free announcements. Physical Review Letters volume 137 carries room-temperature storage of entanglement in a silicon carbide quantum node; PRX Quantum has Pauli-noise disambiguation validated on up to 92 qubits, and a theory paper on randomised dissipation. ⭐⭐ AND THE MOST CONSEQUENTIAL ITEM IS A RETREAT: NEC HAS HALTED DEVELOPMENT OF QUANTUM COMPUTING HARDWARE. The company that demonstrated the first superconducting solid-state qubit in 1999 ended physical hardware development at the end of March 2026, having concluded commercialisation would take too long to justify the return. Its last prototype was an 8-qubit annealing machine in 2023. It continues in annealing, quantum-inspired computing and services. ⚠️ Sourced to Nikkei Asia rather than to NEC, with no investment figures disclosed. ⚠️ Pasqal has no new close and cannot have one — market closed. Physicsworld's feed, the working route on Saturday, was provenance-blocked today, so the general silence there is a failed check rather than an established absence.",
        s: [["Clinical Trial Vanguard (112 trials, blinding failure above 90%, and only 29.5% evaluating integrity at all)","https://www.clinicaltrialvanguard.com/opinion/psychedelic-trials-are-effectively-open-label-the-fda-has-to-decide-what-to-do-with-that/"],["PsyPost (the first human psilocin trial since the 1960s — re-checked, still without a single interval)","https://www.psypost.org/first-human-trial-of-psilocin-since-the-1960s-reveals-better-tolerability-than-psilocybin/"],["The Quantum Insider (NEC halts quantum hardware development, 27 years after its first solid-state qubit)","https://thequantuminsider.com/2026/09/06/nec-halts-development-of-quantum-computer-hardware/"],["PRX Quantum (the recent-papers index — Pauli-noise disambiguation on up to 92 qubits)","https://journals.aps.org/prxquantum/recent"]] },
      { t: "🔴 ROBIN MORGAN DIED ON SATURDAY, TWO DAYS AFTER GLORIA STEINEM. The poet, editor and second-wave organiser died on September 5 in New York, aged 85, after what CBS News describes as “a series of health problems in recent weeks”; NBC carries it independently, satisfying this desk's two-outlet rule. She edited “Sisterhood Is Powerful” (1970), “Sisterhood Is Global” (1984) and “Sisterhood Is Forever” (2002), wrote the poetry collections “Monster” and “Dark Matter” and the memoir “Saturday's Child,” was editor-in-chief of Ms., and co-founded New York Radical Women, W.I.T.C.H., the Sisterhood Is Global Institute and — with Jane Fonda and Steinem — the Women's Media Center. She had been a child actor first, on “Mama” from 1949 to 1957. Her lines: “hate generalizes, love specifies,” and, from “Monster,” “I want a women's revolution like a lover / I lust for it.” Steinem, who died on September 3, had called her an ideal “utility player” for protest movements; the two were friends and collaborators, and the notices are being written a fortnight apart in the same paragraph. ⭐ ALSO CONFIRMED: Andy Williams, guitarist of Every Time I Die and the AEW wrestler “The Butcher,” died at 48 on September 5, reportedly after collapsing during a show — verified at seven outlets. And the deaths backlog, worked again, now yields hard dates for three names this desk had been carrying unverified: Michael Mendl, the German actor of “Downfall,” at 82; the Irish environmental journalist Frank McDonald at 76; and the Filipino historian Resil B. Mojares at 83, all on September 5, all aggregator-dated and awaiting two-outlet confirmation. ⭐⭐ AT VENICE, LEE CHANG-DONG'S “POSSIBLE LOVE” DID WHAT EVERY PREDICTION HAD BEEN HEDGED AROUND. It premiered Sunday evening in the Sala Grande to an ovation reported at six minutes by Variety, 6.5 by Deadline and “over six minutes” by the Korea Herald — flagged, not picked. The reviews are uniform: Rory O'Connor at The Film Stage makes it a Critic's Pick and calls it “the most substantial film I've seen in this year's competition and one that is easily amongst the best of the year so far”; James Mottram gives it 4.5 out of 5; Variety has “a beautifully mature, quietly colossal relationship drama,” the Hollywood Reporter “quiet powerhouse,” and Bilge Ebiri suggests it may be the most powerful film of Lee's career. ⭐ TWO FACTS THIS DESK DID NOT HAVE: IT IS A NETFLIX FILM, Lee's first, made after he failed to secure theatrical backing — and it is SOUTH KOREA'S OFFICIAL ACADEMY AWARD SUBMISSION. Lee on why: “There was the pandemic, a time when people couldn't come to theaters. Beyond that, I felt human relationships were fundamentally changing.” A Golden Lion on Saturday would be only the second for Korea, after “Pieta” in 2012. ⚠️ It is not yet on the Tomatometer — where Pattinson's “Primetime” has moved to 94% and is now the festival's highest-scoring film, above McDonagh's 90%. ⚠️⚠️ AND TWO CORRECTIONS THIS DESK OWES ON ITS OWN LONGEST-RUNNING FILM ITEMS. FIRST, THE LYNCH WEEKENDER: this desk has said for eighteen days that not one outlet had reported the postponement. That is wrong, and has been since August 24, when welcometotwinpeaks.com posted “UPDATE (AUGUST 24, 2026): This event has been postponed. Ticket holders have been informed.” The claim is corrected here rather than quietly dropped. SECOND, CRITERION: Saturday's brief reported that the “Harold and Maude” cluster had moved to October 3 and the “Marie Antoinette” cluster to October 10. THE DATES NEVER MOVED — it was a rendering failure, double-confirmed today against the Marie Antoinette product page, which reads “available Nov 10, 2026.” November 3 and November 10 stand, and December is still unannounced. ⚠️ One more date correction: the Stedelijk's Kusama retrospective opens SEPTEMBER 12, not the 11th. And at Gwangju, the Chinese artists did not come back — Artnet found the pavilion dark on Friday evening, a metal gate across the entrance.",
        s: [["CBS News (Robin Morgan, feminist writer and close friend of Gloria Steinem, dies at 85)","https://www.cbsnews.com/news/robin-morgan-feminist-writer-dies-age-85/"],["The Korea Herald (Possible Love becomes the talk of Venice — a Netflix film, and Korea's Academy Award submission)","https://www.koreaherald.com/article/10865244"],["The Film Stage (Rory O'Connor's Critic's Pick — “the most substantial film I've seen in this year's competition”)","https://thefilmstage.com/venice-review-possible-love-marks-a-triumphant-return-for-lee-chang-dong/"],["Welcome to Twin Peaks (the postponement notice, stamped August 24 — the outlet report this desk said did not exist)","https://welcometotwinpeaks.com/event/a-gathering-of-the-angels-2026-david-lynch-celebration/"],["Criterion (the coming-soon page — November 3 and November 10 stand; December still unannounced)","https://www.criterion.com/shop/browse?popular=coming-soon"],["Artnet (as China exits the Gwangju Biennale, Taiwan plows ahead — the pavilion dark behind a metal gate)","https://news.artnet.com/art-world/gwangju-biennale-china-pulls-out-plows-ahead-2806903"]] },
    ] }
