<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sveta's News Desk</title>
<style>
  :root {
    color-scheme: light;
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
    --up:#006300; --down:#d03b3b; --accent:#2a78d6; --accent-wash:rgba(42,120,214,.08);
    --p-wire:#2a78d6; --p-realist:#eb6834; --p-west:#1baf7a; --p-acad:#eda100;
    --p-ruind:#e87ba4; --p-rust:#008300; --p-rudom:#4a3aa7; --p-none:#898781;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
      --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
      --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
      --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --up:#0ca30c; --down:#d03b3b; --accent:#3987e5; --accent-wash:rgba(57,135,229,.14);
    --p-wire:#3987e5; --p-realist:#d95926; --p-west:#199e70; --p-acad:#c98500;
    --p-ruind:#d55181; --p-rust:#008300; --p-rudom:#9085e9;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 2px; }

  header.masthead {
    position: sticky; top: 0; z-index: 40; background: var(--page);
    border-bottom: 1px solid var(--grid); padding: 10px 20px 0;
  }
  .mh-top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand {
    font-family: Charter, 'Iowan Old Style', Georgia, 'Times New Roman', serif;
    font-size: 26px; font-weight: 700; letter-spacing: .2px; margin: 0;
  }
  .dateline { color: var(--ink2); font-size: 13px; }
  .statusline { color: var(--muted); font-size: 12px; margin-left: auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .statusline .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--baseline); margin-right: 4px; }
  .statusline .live-dot.on { background: var(--up); }
  .btn {
    font: 12px system-ui, sans-serif; color: var(--ink2); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; cursor: pointer;
  }
  .btn:hover { background: var(--accent-wash); }
  .btn[disabled] { opacity: .5; cursor: wait; }
  .mh-nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; align-items: center; }
  .tab-btn {
    border: 0; background: none; color: var(--ink2); font: 13.5px system-ui, sans-serif;
    padding: 8px 12px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .searchwrap { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-bottom: 6px; }
  #search {
    font: 13px system-ui, sans-serif; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 7px; padding: 5px 10px; width: 190px;
  }
  #searchCount { font-size: 11.5px; color: var(--muted); min-width: 70px; }

  main { max-width: 1340px; margin: 0 auto; padding: 18px 20px 60px; }
  section.tab { display: none; }
  section.tab.active { display: block; }

  .cols { display: grid; gap: 14px; }
  .cols.c3 { grid-template-columns: repeat(3, 1fr); }
  .cols.c2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1050px) { .cols.c3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 760px)  { .cols.c3, .cols.c2 { grid-template-columns: 1fr; } }

  .colhead {
    font-size: 12px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase;
    color: var(--muted); margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 1px solid var(--grid);
    display: flex; align-items: baseline; gap: 8px;
  }
  .colhead .sub { font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 11.5px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 14px; break-inside: avoid;
  }
  .card h3 { margin: 0 0 6px; font-size: 14px; font-weight: 650; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .card h3 a:hover { color: var(--accent); text-decoration: none; }
  .src-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
  .src-dot.live { background: var(--up); }
  .src-dot.baked { background: var(--baseline); }
  .src-dot.fail { background: var(--down); }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 500;
    color: var(--ink2); border: 1px solid var(--border); border-radius: 20px; padding: 1px 8px 1px 6px;
    letter-spacing: .2px; white-space: nowrap;
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  ul.items { list-style: none; margin: 0; padding: 0; }
  li.it { padding: 6px 0; border-top: 1px solid var(--grid); font-size: 13.5px; }
  li.it:first-child { border-top: 0; }
  li.it a { color: var(--ink); }
  li.it a:visited { color: var(--ink2); }
  li.it .meta { display: block; font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  li.it.hiddenBySearch { display: none; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 6px 0; }

  /* Today */
  .brief h2, .panel h2 {
    font-family: Charter, 'Iowan Old Style', Georgia, serif;
    font-size: 19px; margin: 0 0 10px;
  }
  .brief .bgroup { margin: 12px 0 2px; }
  .brief .bgroup > .glabel {
    font-size: 11px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--muted);
  }
  .brief ul { margin: 6px 0 0; padding-left: 18px; }
  .brief li { margin: 7px 0; font-size: 14px; }
  .srcchip { font-size: 11px; color: var(--accent); white-space: nowrap; }
  .srcchip a { color: var(--accent); }
  .fxrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin: 4px 0 2px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; }
  .tile .k { font-size: 11px; color: var(--muted); letter-spacing: .4px; }
  .tile .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 1px; }
  .tile .d { font-size: 11.5px; font-variant-numeric: tabular-nums; margin-top: 1px; color: var(--ink2); }
  .tile .d.up { color: var(--up); } .tile .d.down { color: var(--down); }
  .quicklinks { font-size: 12.5px; color: var(--ink2); margin-top: 8px; }
  .quicklinks a { color: var(--accent); }
  .hook { border-left: 3px solid var(--p-acad); padding: 2px 0 2px 11px; margin: 12px 0; }
  .hook .story { font-size: 13.5px; }
  .hook .concept { font-size: 12px; color: var(--ink2); margin-top: 4px; }
  .hook .concept b { color: var(--ink); }
  .hook .q { font-size: 12.5px; font-style: italic; color: var(--ink2); margin-top: 4px; }

  /* Student Pulse */
  .pulse-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .pulse-grid .card { margin-bottom: 0; }
  .pcat { font-size: 10.5px; font-weight: 700; letter-spacing: .9px; text-transform: uppercase; color: var(--accent); }
  .pt { font-family: Charter, 'Iowan Old Style', Georgia, serif; font-size: 16.5px; font-weight: 700; margin: 2px 0 6px; }
  .pwhy { font-size: 13px; color: var(--ink2); }
  .prec { font-size: 12.5px; margin-top: 8px; border-top: 1px solid var(--grid); padding-top: 7px; }

  /* About */
  .about p { max-width: 78ch; font-size: 14px; color: var(--ink2); }
  .about p b, .about p strong { color: var(--ink); }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; align-items: baseline; max-width: 78ch; font-size: 13.5px; color: var(--ink2); margin: 10px 0 18px; }
  footer { border-top: 1px solid var(--grid); color: var(--muted); font-size: 12px; padding: 14px 20px 30px; text-align: center; }
</style>
</head>
<body>
<header class="masthead">
  <div class="mh-top">
    <h1 class="brand">Sveta&rsquo;s News Desk</h1>
    <span class="dateline" id="dateline"></span>
    <span class="statusline">
      <span><span class="live-dot" id="liveDot"></span><span id="statusText">snapshot</span></span>
      <button class="btn" id="refreshBtn" title="Re-pull all live feeds">&#8635; Refresh</button>
      <button class="btn" id="themeBtn" title="Toggle color theme">Theme: Auto</button>
    </span>
  </div>
  <nav class="mh-nav" id="nav">
    <button class="tab-btn active" data-tab="today">Today</button>
    <button class="tab-btn" data-tab="geo">Geopolitics</button>
    <button class="tab-btn" data-tab="econ">Economy &amp; Markets</button>
    <button class="tab-btn" data-tab="health">Health &amp; Policy</button>
    <button class="tab-btn" data-tab="michigan">Michigan</button>
    <button class="tab-btn" data-tab="education">Higher Ed</button>
    <button class="tab-btn" data-tab="mind">Mind &amp; Cosmos</button>
    <button class="tab-btn" data-tab="pulse">Student Pulse</button>
    <button class="tab-btn" data-tab="culture">Culture &amp; Style</button>
    <button class="tab-btn" data-tab="about">About</button>
    <span class="searchwrap">
      <input id="search" type="search" placeholder="Filter headlines&hellip;" aria-label="Filter headlines">
      <span id="searchCount"></span>
    </span>
  </nav>
</header>

<main>
  <section class="tab active" id="tab-today"></section>
  <section class="tab" id="tab-geo"></section>
  <section class="tab" id="tab-econ"></section>
  <section class="tab" id="tab-health"></section>
  <section class="tab" id="tab-michigan"></section>
  <section class="tab" id="tab-education"></section>
  <section class="tab" id="tab-mind"></section>
  <section class="tab" id="tab-pulse"></section>
  <section class="tab" id="tab-culture"></section>
  <section class="tab" id="tab-about"></section>
</main>

<footer>
  Rebuilt each morning &middot; pulls live headlines every time it opens &middot; labels describe vantage point, not credibility.
</footer>

      { t: "Ukraine spent its 35th Independence Day hosting a summit, and the day’s most consequential item is one nobody has published the text of. Foreign leaders arrived in Kyiv through Sunday evening and Monday morning — the Kyiv Independent identifies the new British prime minister, Andy Burnham, making his first visit to Kyiv since taking office and expected to chair the Coalition of the Willing later in the day, alongside European Council President António Costa, Moldova’s Maia Sandu, Luxembourg’s Luc Frieden, Estonia’s Alar Karis and Nordic and Baltic leaders. The European Commission approved €6.1 billion ($7.1 billion) in defence loans to mark the day — the defence tranche of the €90 billion Ukraine Support Loan finalised in April, for air defences, missiles, ammunition and radars, with seven of nine product schedules approved and two pending, including US-sourced Patriot missiles that would require an EU member-state exemption. Ursula von der Leyen: “On Ukraine’s Independence Day, Europe shows our support is unfaltering and concrete. As Russia intensifies its attacks, we are stepping up to help Ukraine protect its people and defend its skies.” A UN Security Council session on Ukraine convenes at 15:00 ET, requested by Denmark, France, Greece, Latvia and the UK, chaired by Danish foreign minister Lars Løkke Rasmussen and briefed by Rosemary DiCarlo and Tom Fletcher; the UN Human Rights Monitoring Mission’s figure of a 37% rise in civilian casualties in the first half of 2026 is the number being brought to it. The item to watch, though, is a negative space. ISW’s Aug 23 assessment records that “Ukrainian President Volodymyr Zelensky reportedly presented a joint Ukraine-US-Europe proposal on August 23 to end the war in Ukraine that offers significant Ukrainian concessions even as Putin and other Kremlin officials continue to refuse to compromise on any of their core demands” — and that is the whole of it. No text, no primary sourcing, no US comment, no Kremlin response. A Meduza war roundup for Aug 23 appears in search results with a headline reporting Zelensky describing a “corridor of opportunities” to end the war running from late 2026 to summer 2027, but the page itself would not open, so that line is unconfirmed and should be treated as a lead rather than a quote. Against all of it, the only Kremlin voice in the window is Putin, in a Sunday interview with Vesti journalist Pavel Zarubin, on a different subject entirely: “The current Ukrainian government has laid the foundation for the state the neo-Nazism ideology. This is terrible. We cannot and will not put up with this. This is one of the reasons for the special military operation.” No Lavrov, no Peskov, and a fourth consecutive day with no verifiable Witkoff, Kushner or Ushakov development.",

      { t: "Sunday’s toll was 5 killed and 44 injured — and this time the frozen slug ran high rather than low, which is the opposite of the failure mode this desk has been watching for. The Kyiv Independent’s dispatch, filed 11:53 and updated 08:53 UTC, carries 5 and 44 in its headline and body while its own URL still reads “kill-9-injure-43.” Take the body. The regional breakdown: Zaporizhzhia 3 killed and 20 injured, with Governor Ivan Fedorov counting 559 Russian attacks on 40 settlements; Donetsk 2 killed and 5 injured (Governor Vadym Filashkin); Kherson 11 injured (Governor Oleksandr Prokudin); Kharkiv 3 injured (Governor Oleh Syniehubov); Dnipropetrovsk 2 injured (Governor Oleksandr Hanzha). Deaths sum exactly; injuries sum to about 42 against a headline 44, the gap being later additions. Overnight into Sunday Russia launched 127 drones, of which Ukraine downed 97, with 27 getting through to 22 locations and debris at three more — ISW cites the same 127. The day’s distinctive feature was rail. At Lymanivka station in Kharkiv Oblast a drone hit the Lozova–Kharkiv electric train, killing one passenger and injuring four; the train had been halted and evacuated in advance and those hit had stayed near the tracks. Mykola Kalashnyk, minister of restoration, infrastructure and transport, added that it was a double-tap: “Today, Russia attacked this electric train for a second time while rescuers were working,” with no casualties in the second strike. His running ledger is worth having as a stock rather than a flow: railways hit five times on Aug 23 alone, 1,534 attacks on railways since the start of 2026, and across the war 249 railcars and 492 locomotives damaged, 52 railway employees killed and 317 injured. In Odesa Oblast a jet-powered Shahed struck locomotive No. 147 on the Zhytomyr–Odesa service carrying 593 passengers including 15 children; Ukrainian Railways chief Oleksandr Pertsovskyi reported no casualties because “an evacuation was ordered in time.” And in       { t: "Ukraine hit the same retailer for a third consecutive night, and the day’s casualty dispute is a straightforward two-versus-three. Overnight into Monday, Ozon logistics centres burned at Enem in Adygea (TASS locates it at Adygeisk), at Nevinnomyssk in Stavropol Krai, at Tyube near Makhachkala in Dagestan (TASS says Makhachkala), and at Krasnodar, where a Kuchenland home-goods warehouse also caught fire. Stavropol governor Vladimir Vladimirov: “Our air defense forces are repelling an attack by enemy drones targeting the industrial zone of Nevinnomyssk.” Ozon’s own press service, via TASS, confirmed the Makhachkala hit — “All systems functioned as normal, and we promptly evacuated the staff” — and the company pulled items from its storefront, cancelled orders from that warehouse and halted inbound shipments; the warehouse is closed indefinitely. That is the clearest economic datapoint of the window, and it is a change of target set: after weeks of refineries, this run went after retail logistics, airfields and radar. On Aug 23 itself, Robert “Magyar” Brovdi, commander of the Unmanned Systems Forces, claimed via Telegram to have destroyed at Vityazevo airfield in Krasnodar Krai and in Rostov Oblast and occupied Crimea a Su-33, a MiG-29, an Orion strike drone, S-400, Pantsir and Tor air-defence systems and eight radars — a claim neither confirmed nor denied on the Russian side, and the naval Su-33 element is unusual enough to flag. Russia’s Defense Ministry gives two intercept figures for two separate windows and they must not be added: 269 drones between 08:00 and 20:00 Moscow time on Aug 23 across Crimea and eleven regions, and 351 overnight into Monday over Russian regions and the Black and Azov seas. Rostov governor Yury Slyusar separately claimed 120 downed across four cities and fourteen districts. On the Russian civilian toll, the divergence is narrow and worth stating both ways: the Kyiv Independent and Kyiv Post, citing Krasnodar governor Veniamin Kondratyev, report two children killed and nine others injured — seven children and two adults — when drone debris fell on a childcare centre; TASS’s factbox reports three children killed and seven injured at what it calls a private children’s facility, with Kondratyev noting authorities were “still clarifying information on casualties.” Both sides attribute the deaths to falling debris rather than direct impact. Separately, TASS reported on Aug 22 that the Yeysk toll had risen to three, two of them children, after a man died of his wounds.",

      { t: "The Iran sanctions package now has a name and a time but still, on the morning it lands, no contents. Bessent’s press conference is at 2:00 p.m. ET today, and the framing has hardened into a phrase — “economic D-Day,” which he used in a Financial Times op-ed and which CNN and others have carried since Sunday, alongside his earlier “This is going to be the greatest coordinated economic isolation in the history of the world” and “you are either with us or against us.” Not one country, company or sector has been named, and China has not been confirmed as a target. One active trap deserves stating: a Treasury press release numbered sb0364 surfaces high in search and does name targets — Bank Melli, Shahr Bank, several UAE fronts, Iran’s financial, petroleum and petrochemical sectors — but it is an old release, undated on its face, and it identifies Ali Larijani as secretary of the Supreme National Security Council, a post now held by Mohsen Rezaei. It is not today’s package. GlobalSecurity’s Day 177 log records no US or Israeli strikes on Iranian territory through Sunday morning, marking a twenty-fourth consecutive night, and the dated permalink for Aug 23 returned 404 again, so the rolling page is the only citable version. The genuine advance is legislative: on Aug 23 Iran’s parliamentary National Security Commission approved Article 3 of a plan titled “Strategic Action to Ensure the Security and Progress of the Strait of Hormuz,” establishing service fees on transiting ships. Commission spokesman Ebrahim Rezaei: “Fees will be charged for services including navigation, environmental, fueling under certain conditions, insurance, safety and other services we provide,” payable “in Rials or any other currency desired by the Islamic Republic of Iran.” This is committee-level, not passage by the full Majlis, and no fee amounts were disclosed — the $2 million-per-voyage and $400,000 figures circulating attach to a different bill from March. Mohsen Rezaei, meanwhile: “The Strait of Hormuz is closed, despite American claims, and will not open until America corrects its behaviour,” and “If the countries surrounding Iran join the Americans in their economic war, not a drop of oil will leave the Persian Gulf.” The traffic data underneath is the part that does not reconcile. Kpler counted seven commodity vessels along the strait on Aug 21 — four in, three out, no VLCCs or LNG carriers — against a pre-war norm near 130 a day; CNN’s analysis puts the seven days to Aug 21 at 103 vessels entering and 89 leaving, roughly 20% of the pre-war average, with over 80% of liquid cargoes routing south via Oman. Energy Secretary Chris Wright claimed over 15 million barrels of oil and products transited on Aug 21 with a weekly average near 8 million barrels a day. Those two accounts cannot both be right, and neither has been reconciled. New on the diplomatic track: Pakistan’s Field Marshal Asim Munir travels to Tehran today, his third visit of 2026, announced Sunday by foreign ministry spokesman Esmaeil Baghaei — with the June 17 Islamabad memorandum’s 60-day window having expired in mid-August without extension. From the heterodox bench, Glenn Diesen posted twice on Aug 23, both on this subject: a conversation with Tehran University’s Seyed Mohammad Marandi titled “From ‘Economic D-Day’ to Nuclear Strike Against Iran?” and one with Richard Wolff arguing US imperial decline is accelerating. Nothing new from Mearsheimer, Sonar21, Sachs or Responsible Statecraft in the window, and nothing verifiable on Israel–Lebanon for a second consecutive day.",

      { t: "Two things broke over the weekend, and neither of them is Jackson Hole. US–Canada trade talks collapsed — Prime Minister Mark Carney suspended negotiations and pledged retaliatory tariffs matching new US duties on Canadian goods — and Bessent’s Iran sanctions press conference lands at 2:00 p.m. ET. Those are what is moving Monday. Futures at 4:03 a.m. ET: S&P 7,674.25 (−0.22%), Dow 53,306 (−0.09%), Nasdaq-100 29,175.50 (−0.72%, and note that is the 100, not the Composite that closed Friday at 26,180), Russell 3,020.60 (−0.05%), with the VIX at 15.92, up 5.23%. In Asia the KOSPI opened down 0.7% and fell as much as 3% intraday, the Nikkei opened down 0.2%, MSCI Asia Pacific was off 1%, Samsung fell 8.7% and Alibaba 9.6%. The long end reversed Friday: two independent sources put the 10-year at 4.713%, down 2.3 basis points, and the 30-year at 5.24%, down 3.2 — which checks exactly against Friday’s 4.737% and 5.276%. The week-ahead calendar this brief carried provisionally from a single source is now confirmed five ways, with two corrections. Wednesday Aug 26 genuinely is a triple release: July PCE (headline +0.1% month over month with the year-over-year easing to 3.6% from 3.7%, core +0.2% with the annual rate holding at 3.3%), the second estimate of Q2 GDP at 1.5%, and durable goods — where the +0.7% remains single-source and should be treated as such — followed after the close by Nvidia, at a consensus $2.09 a share on $92 billion, roughly a doubling year over year, with gross margin seen expanding to 75% from 72.7%. Friday Aug 28 stacks the Chicago PMI at 09:45, consensus 57.6 rather than the 57 carried here yesterday, confirmed against the MNI publication calendar; the final Michigan sentiment reading, where the number to use is the August preliminary of 51.0 and not the 55.2 appearing on some calendars, which is the July final recycled — Joanne Hsu, who directs the survey, attributed the drop to politics: “Sentiment among Republicans is now 19% below       { t: "Crypto held a very large week, metals made new highs, oil gave back some of its run into the sanctions announcement, and the ruble question turns out to have been the wrong question. Bitcoin sits near $77,100–77,300, up 21–22% on the week; ether $2,442 (+28% on the week); solana $94 (+24%); XRP about $1.48–1.50 (+46–48%); zcash near $838 after a 70% week. On the one-day move the sources disagree in sign — CoinDesk has bitcoin down marginally over 24 hours, Yahoo has it up 0.66% — so take the level and leave the delta. CoinDesk attributes the week to a $3 billion short squeeze alongside the Treasury buyback expansion, a Grayscale spot zcash ETF filing and a White House crypto meeting. Flows corroborate the size: US spot bitcoin and ether ETFs pulled in a combined $2.6 billion last week, the strongest since October — $1.9 billion into bitcoin funds, $697.2 million into ether, with BlackRock’s IBIT taking $503 million on Thursday alone — while both categories remain net negative year to date. In metals the spot-versus-futures confusion that dogged this brief last week resolves cleanly: gold spot is $4,643.95, up 0.79% to a more-than-three-month high, having traded above $4,640 and back under $4,600 within the session, while December futures are $4,693.10, up 0.27%; silver spot is $69.384, up 0.63%, at a two-month high. Sunday’s spot plus today’s change reconciles to the dollar. Crude went the other way, with Brent at $93.17 (−1.29%) and WTI at $85.86 (−1.38%) on profit-taking before the presser, after a second consecutive weekly gain above 5%. Vivek Dhar of Commonwealth Bank of Australia: “It is unclear whether U.S. policy to economically isolate Iran will prove effective.” Tony Sycamore at IG Markets: “The more pragmatic members of the Iranian leadership would prefer to de-escalate but the hardliners would probably prefer to fight.” On the ruble, the answer is that there is nothing to find: the Bank of Russia publishes on business days effective the following calendar day, so the ₽82.9211 set on Friday remains the official rate in force across Aug 22, 23 and 24, with the next publication due Monday afternoon Moscow time. The three-session appreciation from ₽85.1293 stands at 2.6%, and the key rate stays at 14.00%. The week’s best teaching item comes from CEPR: Francesco D’Acunto of Georgetown and Michael Weber of ESMT Berlin, surveying 46,285 consumers across 47 countries, find that households relying on official reports hold inflation expectations about two percentage points lower than otherwise-similar respondents who ignore them, while those relying on their own shopping and utility bills run about two points higher. The mechanism they identify is selection rather than processing — people choose information sources by perceived credibility, so “distrust of governments and central banks helps explain why more representative aggregate information is dismissed.” It publishes four days before a Fed chair speaks about forward guidance. A companion column the same day, by Bo Becker, Efraim Benmelech and Joao Monteiro, prices the transatlantic equity gap at $34 trillion: US market capitalisation went from 78% of GDP in 2008 to 177% in 2023 while Europe’s moved from 43% to 63%, and the cost of capital for small European firms exceeds 60% against roughly 40% for comparable US firms.",
        s: [["CoinDesk (crypto levels)","https://www.coindesk.com/markets/2026/08/24/crypto-holds-big-weekly-rally-as-warsh-s-jackson-hole-debut-comes-into-focus"],["Business Standard (oil)","https://www.business-standard.com/markets/commodities/oil-prices-fall-ahead-of-expected-us-announcement-on-new-iran-sanctions-126082400049_1.html"],["VoxEU (D’Acunto & Weber)","https://cepr.org/voxeu/columns/why-more-information-can-make-macroeconomic-expectations-less-accurate-global"],["The Block (ETF flows)","https://www.theblock.co/news/markets/2026-08-22-bitcoin-and-ether-etfs-draw-2-6-billion-in-strongest-inflow-week-since-october-tripling-volume-412531"]] }

      { t: "The vaccine story got a document and a price tag on the same weekend. The request for information this brief flagged as a watch item posted Friday, Aug 21 with a 30-day comment period, and it is broader than a tier adjustment: it asks whether new categories should be added to the existing three-tier framework — universal, risk-based group, and shared clinical decision-making — and floats one specific new tier for vaccines recommended “but not during infancy.” It is downstream of an executive order signed Aug 10, “Delivering Gold Standard Childhood Vaccine Recommendations for Americans,” which cuts the universally recommended childhood schedule to eleven diseases. The baseline is reported inconsistently and the discrepancy is worth carrying rather than resolving: Healthcare Dive puts the cut at 17 diseases to 11, NBC News at 18 to 11. The order retains universal status for HPV, pneumococcal, polio, pertussis, tetanus, measles, mumps and rubella, reclassifies RSV and hepatitis A and B to high-risk groups only, directs that MMR be split into three separate shots once domestically available, and requires that childhood vaccines be given at separate appointments; an HHS task force has 90 days to produce a schedule-adjustment plan, which lands around Nov 8. Newly confirmed CDC director Erica Schwartz has said she “absolutely” believes vaccines are safe and effective. On the RFI itself there is still no verifiable stakeholder response — the AAP’s updated schedule and the January letter to the secretary both predate it, and the docket is three days old. What has arrived is a costing, and it is unusually clean. A Johns Hopkins team led by Salin Sriudomporn, publishing in Vaccine and drawing on nineteen peer-reviewed studies, eight gray-literature reports, CDC data and all fifty state health departments across outbreaks ranging from 1 to 802 cases in eighteen states, puts the provider-perspective cost at $33,416 per measles case, $58,591 per case including the public health response, and $43,204 as an all-in average, with $443 per contact traced. The structure underneath those averages is the part worth reading twice: a fixed response cost of $297,747 and an incremental cost of $16,300 per additional case. The 2025 US outbreak, at 2,289 confirmed cases, cost $134 million; the current one stands at 2,566 cases and an estimated $150 million and up. The authors’ own framing: “These outbreaks are largely preventable through inexpensive and highly effective measles vaccination paired with system-level preparedness for effective containment.” Note for the week ahead: the beat was genuinely dead over the weekend — KFF, STAT, Healthcare Dive and Fierce Healthcare all cap at Friday Aug 21, and no Monday KFF morning briefing exists.",
        s: [["STAT (vaccine RFI)","https://www.statnews.com/2026/08/21/rfi-reveals-possible-kennedy-strategy-vaccine-policy-changes/"],["Healthcare Dive (executive order)","https://www.healthcaredive.com/news/trump-executive-order-childhood-vaccine-schedule-autism/827529/"],["KFF Morning Briefing (measles costing)","https://kffhealthnews.org/morning-briefing/friday-august-21-2026/"]] },
      { t: "The FDA nomination moved, and it moved against the nominee. Senator Bill Cassidy of Louisiana — a gastroenterologist who chairs the Senate HELP Committee and therefore controls whether a hearing is scheduled at all — went after Heidi Overton publicly on Aug 20: “Her lack of managerial experience does not prepare her well for leading a large organization that is already dealing with staffing and morale issues,” and, more pointedly, “Dr. Overton’s active role in last week’s nonsensical vaccine executive order calls into question her commitment to standing up for sound science and protecting children’s health. That alone is almost disqualifying.” No hearing has been scheduled; the committee’s own FDA-commissioner hearing page still serves the March 2025 Makary notice, which is a caution about trusting that page rather than a signal. Patty Murray has said she will vote no; Cassidy has a record of voicing doubts and then voting to confirm. Overton is 37, deputy director of the White House Domestic Policy Council, a 2015 University of New Mexico medical graduate with a Johns Hopkins general surgery residency and a PhD in clinical investigation, formerly chief policy officer at the America First Policy Institute. The agency she would run — about 18,000 staff — has had no confirmed commissioner since Marty Makary resigned in May after thirteen months, and interim head Kyle Diamantas was offered the permanent job and declined. RBC’s Brian Abrahams: “Her impact to biopharma and new drug review flexibility is uncertain.” Johns Hopkins’ Joanne Kenen on the odds: “if you made me bet, my bet would be yes, but I wouldn’t want to bet a whole lot of money.” Two other threads are worth pairing because they point in opposite directions. Prescription drug prices fell 0.8% in July and are down 3.1% year over year — the steepest annual decline in more than six decades, with no month in 2026 registering an increase, per BLS CPI — and the attribution fight is entirely unresolved: USC health economist Geoffrey Joyce says “If you were going to give policy credit, you’d have to say the IRA,” while also crediting market forces including GLP-1 competition and patent expirations, and White House spokesperson Kush Desai calls crediting the IRA “idiotic and unfounded,” pointing to most-favored-nation deals and TrumpRx. Set that against KFF’s Larry Levitt in JAMA Health Forum, who notes hospitals are 31% of national health spending against retail drugs at 9%, and drove 40% of spending growth from 2022 to 2024 against 11% for drugs — but that out-of-pocket spending runs $54 billion on drugs versus $41 billion on hospital care, because people fill roughly a prescription a month and one in ten is hospitalised in a year. Salience tracks the small number. Meanwhile private equity’s appetite for physician practices has collapsed: PitchBook counts 851 deals at the 2021 peak against 105 in the first half of 2026, with the full year tracking about 50% below 2025, which Reed Smith’s Paul Pitts attributes to more than a dozen states enacting transaction-oversight laws — “It’s certainly been a big decrease.” And one mechanical detail that explains yesterday’s GLP-1 Bridge item rather than repeating it: claims run through a central Medicare-operated system that approves, adjudicates and pays pharmacies directly, bypassing individual Part D plans, which is precisely why the $50 copay sits outside the deductible, the out-of-pocket cap and the Prescription Payment Plan alike.",
        s: [["STAT (Overton nomination)","https://www.statnews.com/2026/08/20/heidi-overton-fda-commissioner-nominee-erica-schwartz-cdc-speech/"],["Axios (drug price deflation)","https://www.axios.com/2026/08/17/drug-prices-medicare-trump"],["STAT (private equity)","https://www.statnews.com/2026/08/17/private-equity-50-percent-drop-physician-practice-management-deals-2026/"],["KFF (What the Health)","https://kffhealthnews.org/podcast/what-the-health-460-fda-nominee-trump-heidi-overton-august-20-2026/"]] }

      { t: "The Ypsilanti Township silence this brief has been noting for a week turns out to have been partly its own error, and the 110-megawatt figure is now sourced. On Aug 19 the township passed a 180-day moratorium on new major electric infrastructure. Supervisor Brenda Stumbo: “We need to make sure it’s in the right location from a planning standpoint, and we need to make sure that we have ordinances in place that require DTE or any electrical company to go through a process.” The proposed DTE substation is 110 megawatts — equal, WEMU reports, to the current power usage of the entire township — on a heavily wooded parcel on Textile Road beside the Huron River, after a site near Willow Run Airport was considered and rejected. And Bridge Michigan did cover it: an Aug 17 piece names Ypsilanti Township, township attorney Doug Winters and the U-M/Los Alamos project directly, which means yesterday’s reading of Bridge’s Aug 21 statewide survey as a conspicuous omission was too strong — the omission was in that one article, not in the outlet. Winters: “We need to examine the impact that these substations are going to have upon the environment, especially when they’re going to build these gigantic monstrosities,” and “What they’re building is already going to produce more energy than what the rest of the township is using right now.” DTE spokesperson Ryan Lowry: “Our team is reviewing the proposed moratorium, and we are committed to working closely with township officials and the University of Michigan as discussions continue.” The substation would carry power equivalent to 80,000 homes; the data centre is put at $1.2 billion; the electrical moratorium follows an April water and sewage moratorium from the Ypsilanti Community Utilities Authority. The Sept 9 town hall does have coverage after all — 5 to 7 p.m. at the Ann Arbor Marriott Ypsilanti at Eagle Crest, with in-person registration already full as of Aug 20 and a livestream at umich.edu/watch, on a 144-acre property near Textile and Bridge roads. Chris Kolb, vice president for government relations: “We know there are residents who have serious questions and concerns about this project.” One number now needs a second look: Bridge’s gubernatorial data-centre explainer puts Saline Township’s Oracle/OpenAI project at $43 billion against the $7 billion this brief has been carrying, so one of the two is stale. On Wolverine Village, a correction to yesterday’s framing: early move-in runs Aug 22–25 and general move-in Aug 26–30, so what begins today is not move-in but the traffic regime — one-way conversions and lot closures from 7:30 a.m. to 8 p.m. through Aug 29, with more than 10,000 undergraduates and 600-plus student volunteers involved. Still no day-of coverage of how the first weekend actually went, though ClickOnDetroit independently records “uncertainty earlier this week over whether construction would be completed in time for the start of the semester,” which corroborates the Michigan Daily’s unverifiable delay report without resolving it. Elsewhere: Michigan Republicans convened Saturday at Soaring Eagle in Mount Pleasant, nominating Jay DeBoyer for lieutenant governor, Anthony Forlini for secretary of state and Doug Loyd for attorney general, with Senate nominee Mike Rogers — “El-Sayed wants to represent Palestine. I want to represent Michigan” — and gubernatorial nominee John James, who called Benson and El-Sayed “one team. A team of extremism, weakness, and cowardice.” Cook rates the Senate race, for Gary Peters’ open seat, a toss-up, with more than $45 million in outside spending behind Rogers. And Ypsilanti City Council heard a presentation on a possible vacancy tax covering both storefronts and homes — no legislation, no rates, no vote scheduled.",

      { t: "Fifteen institutions put numbers on the record in the international-student case, and a second federal action opened on a different flank. Inside Higher Ed reports testimony filed by fifteen colleges, universities and systems describing damage already occurring before the Sept 15 effective date — the same litigation carried here as NAFSA v. DHS, docketed as Presidents’ Alliance on Higher Education and Immigration v. United States. The figures are the reason to read it: a 25% drop in international applications at Illinois’ flagship; several dozen withdrawals at the University of Maryland Baltimore; $10 million a year in international tuition revenue at Grinnell; $500,000 to $1 million at Penn just to update digital systems; $600,000 in compliance cost at Wisconsin–Madison, which has 2,100 international students already in programmes exceeding four years and roughly 500 more likely to exceed it, and where one in five international doctoral students began in a master’s; and 3,500 students at Cornell who would need annual extension advisement against a USCIS backlog running about a year. Extensions are available for “compelling academic reasons,” a phrase DHS has not defined. Susan-Ellis Dougherty, who leads international student and scholar services at Maryland: the university “is seriously harmed when its identity as a U.S. institution becomes a hinderance.” An admitted student withdrawing from Wisconsin: “A significant factor in my decision was the recently published DHS final rule.” Nothing has moved procedurally — no news on Judge Saylor, the Aug 31 DHS response or the Sept 3 hearing. Separately and less noticed, the Chronicle reports DHS sent colleges a broadcast message reinterpreting Curricular Practical Training, instructing that CPT be approved only where students “would be unable to complete their degree” without it and only if the work “is required for all students pursuing that degree.” Since almost no programme requires one particular work experience of every major, that reading would eliminate CPT for nearly everyone. An administrator, unnamed for political reasons: “It is a VAST departure from our understanding.” A DHS spokesperson: “Nothing about these regulations has changed. However, schools and employers should consider themselves on notice.” On accreditation, no advance on the ABA proceeding, but the Education Department released broader proposed rules requiring “accountability for student outcomes” and prohibiting enforcement of “ideological standards,” with comment closing Sept 21 and a final rule targeted for Nov 1. Also new Monday: the University of Houston cut 40% of its core courses, and Alabama established post-tenure review while codifying faculty senates as advisory only. The pedagogy item to actually use this week is Cornell’s. Its “Accepting Responsibility” programme, run by Elizabeth Karns, replaces informal faculty handling of integrity violations with a documented process in which students write in their own words what happened, describe who they want to become, name their core values and plan for a future ethical crisis, then attend an in-person workshop within two weeks. The pilot covered 360 students across 100 courses; four had a second violation, and about half of participants had violated AI-related policies. Karns: “The goal here is to get them thinking about their future life, not just about academic integrity.” Assistant teaching professor Matthew Eichhorn on why it changes the instructor’s position: “with this new program I stay on the same side as the student.” Penn State is going the other way and centralising, dissolving fourteen campus councils — dean of academic integrity Andrew Peck: “It is overwhelming for us, so we are starting to talk about other solutions.” Two concrete first-week techniques worth stealing, both from Faculty Focus: Meredith Frey’s “human continuums,” where students physically position themselves along a line representing a spectrum of viewpoints and then argue from where they stand — which transfers directly to a price-control or minimum-wage session — and Teresa Thompson’s day-one misconception reset, in which students interview each other about what comes to mind when they hear the discipline’s name and the instructor then dismantles the list as a group.",
        s: [["Inside Higher Ed (visa testimony)","https://www.insidehighered.com/news/global/international-students-us/2026/08/24/international-student-rule-already-spurring"],["Chronicle (CPT reinterpretation)","https://www.chronicle.com/newsletter/latitudes/2026-08-19"],["Inside Higher Ed (Cornell)","https://www.insidehighered.com/news/students/academics/2026/08/24/cornell-hopes-turn-cheating-teachable-moment"],["Faculty Focus (first-week practice)","https://www.facultyfocus.com/articles/effective-teaching-strategies/from-classroom-to-college-practices-that-help-students-succeed-in-both-k-12-and-higher-education/"]] },
      { t: "Mind & cosmos: a double slit at 1.36 ångströms, conformal field theory read off a chain of atoms, and two papers whose authors are notably honest about what they cannot claim. A Caltech group — Xiangkai Sun, Yuan Le, Stephen Naus, Richard Bing-Shiun Tsai, Lewis Picard, Jason Alicea and Manuel Endres, with Sara Murciano and Michael Knap — tuned Rydberg atom chains of 7 to 35 atoms to the Ising and tricritical Ising critical points and recovered the universal energy ratios that conformal field theory predicts: 2:4:6:8 in even parity, 2:3:4:5:6:7:8 in mixed. At the tricritical point they measure E₂/E₁ at 1.45(25) against a predicted 4/3 with free boundaries, 1.98(6) against 2 with fixed boundaries, and 2.5(4) against 10/3 at the unstable fixed point. Their own caveats: post-selection retained only 20 to 70% of experimental runs, and at seven atoms “the energy spacings are sufficiently large” that non-universal corrections swamp the signal. In the same issue of Nature, Koudai Tabata, Takehito Seki, Ryo Ishikawa and Naoya Shibata at the Japan Fine Ceramics Center in Nagoya, with Toma Susi, ran a double-slit experiment where the slits are two adjacent silicon atomic columns 1.36 ångströms apart, using a focused electron probe with a 1.1 Å full width at half maximum. Fringes appear at a periodicity of 0.736 inverse ångströms and — this is the interesting part — persist from 300 to 900 kelvin, “indicating that only a subset of phonon modes degrades visibility.” On the classical side, Joseph Tindall and colleagues at the Flatiron Institute report in Science that a belief-propagation tensor-network method simulating Ising spin-glass dynamics showed markedly lower error than D-Wave’s Advantage2 on cylindrical lattices and comparable error on cubic ones; the write-up gives no numerical error values at all, which is worth knowing before citing it. Two announcements deserve the same discount: Brookhaven and Stony Brook demonstrated a 13-mile free-space quantum link, with Stony Brook Quantum Institute director Eden Figueroa noting the use of “infrared wavelengths that are native to quantum processors,” but published no fidelities or key rates; and Quantum X Labs reports its AI decoder beat matching-family benchmarks on Google’s public surface-code dataset without publishing numbers, though chief quantum technology scientist Nir Sharon states the limitation himself — “this is one benchmark configuration.” On the mind side, Nautilus covers Noelia Antón-Bolaños and an international team culturing brain organoids for five years: after one year the organoids reached milestones that normally occur only postnatally, and mature cells recombined with younger ones regained the capacity to produce late-stage neurons — a developmental memory, not a cognitive one. Antón-Bolaños: “The cells are outside the body, yet they still follow approximately the same developmental timeline as we do—and even more closely than we’d anticipated.” And Devon Stoliker and Adeel Razi at Monash scanned 62 psychedelic-naive adults 80 minutes after psilocybin across rest, music, film and meditation conditions, finding brain activity tracking context rather than overriding it — “The brain is actively constructing both the inner world and the outside world.” Their stated limits: follow-up was one day, so durability is unknown, and the mindfulness course arm showed no group-level benefit. Nothing new from Quanta, nothing in PsyPost after Aug 20, nothing from MAPS since Aug 10. A lighter close, from Tricycle: Brent Purple Oliver on the ethics of not proselytising practice — “Trying to get people to meditate is like trying to make friends with a cat. If you chase them around the house yelling ‘Kitty kitty!’ they’re gonna hide under the bed.”",
        s: [["Nature (CFT in a quantum simulator)","https://www.nature.com/articles/s41586-026-10904-x"],["Nature (atomic-scale double slit)","https://www.nature.com/articles/s41586-026-10914-9"],["Physics World (tensor networks)","https://physicsworld.com/a/no-quantum-advantage-yet-in-the-world-of-tensor-networks/"],["Nautilus (brain organoids)","https://nautil.us/the-remarkable-lives-of-5-year-old-brain-organoids-1284120"]] },
      { t: "Director watch: Refn has a start date, Lynch has a longer guest list, and Noé is now a negative verified three different ways. The Refn item is the substantive one and it supersedes what this desk has carried since May — in a Playlist interview he confirms Maniac Cop shoots in January 2027 in Los Angeles, not the fall, with MUBI fully financing and holding distribution across multiple territories for a wide theatrical release; cast and plot are undisclosed. On the collapse of the HBO series version: “HBO didn’t know what ‘Maniac Cop’ was until they read the scripts,” and they “parted ways amicably, I got all my stuff and some dough.” His stated reason for the timing is political — “you’ve got a new sheriff in town in America” — and “Now is the time to make ‘Maniac Cop.’ Before, it wasn’t the time.” The William Lustig line about a fall shoot dates to March 2 and should be dropped. The London Lynch weekender, “A Gathering of the Angels” at the Genesis Cinema in Whitechapel on Sept 26–27, has added below-the-line names since this brief last checked: assistant editor Jonathan P. Shaw, sound re-recordist Mark Berger and Inland Empire associate producer Jay Aaseng, alongside editor Duwayne Dunham and effects supervisor Gary D’Amico, with the two panels now titled “40 Years of Blue Velvet” on the Saturday and “20 Years of Inland Empire” on the Sunday; weekend general admission is £180, single days £99.50, weekend VIP £310. The Blue Velvet fortieth on Sept 19 still has exactly one dated event attached to it, the Varèse Sarabande soundtrack reissue on Sept 4 — six vinyl variants carrying fourteen tracks against a 48-track digital deluxe — and Angelo Badalamenti’s line in the release material is the one to keep: “I have a very special way of working with David. I always feel so guilty because composing all of his projects throughout all of these years has been so easy.” On von Trier nothing has moved since Aug 9, though two details fill the picture out: the Danish Film Institute has put 1.3 million kroner behind After, and producer Peter Aalbæk Jensen’s account of his condition is more precise than the recirculating versions — “Physically, Lars is affected, but there’s nothing wrong with his mind,” and von Trier “has always used limitations creatively, and now it is his own physical limitation that he is incorporating into the creative process.” Noé remains nothing at all: the IMDb news index for him returns five items of which the most recent is dated February 2016, which is about as clean a negative as this beat produces. Criterion still has not announced a December slate, and the piece that surfaces first when you look for one is from September 2025 and lists the December 2025 releases; Wild at Heart in 4K holds at Nov 17. In the art world the week’s largest story is a theft. On Aug 15, during Assumption Day celebrations, thieves took five of six panels from the Museo Regionale di Messina and abandoned two — St Benedict and St Gregory — outside the building, making off with three panels from Antonello da Messina’s 1473 Polittico di San Gregorio, including the Madonna del Rosario, plus a double-sided Virgin and Child panel from the Wilhelm Soldan collection bought at Christie’s in 2003. Director Marisa Mercurio called the works “our very own Antonello da Messina”; Christopher Marinello of Art Recovery International noted an “eerie similarity to the 1990 Isabella Stewart Gardner heist.” Two standing threads also advanced. The Bernini attribution in Vienna now has evidence behind it: scientific examination indicates the Portrait of an Old Man was “executed by two different hands,” and curator Gudrun Swoboda’s theory is that Bernini painted the face — “sculpting with the brush,” in short bristle strokes — while a collaborator, possibly one of his sons, painted the lower portion; the sitter may be Mario Chigi, brother of Alexander VII. And the Canadian Indigenous art numbers resolve: a November 2024 audit found 132 works unaccounted for, of which seventeen have since been explained — six located in storage, eleven duplicate entries — leaving 111, with four more flagged as possible duplicates and twenty of the remainder being reproductions, from a collection of more than 5,000 works by over 990 artists.",
        s: [["The Playlist (Refn)","https://theplaylist.net/nicolas-winding-refn-maniac-cop-2027-interview-20260721/"],["Varèse Sarabande (Blue Velvet at 40)","https://varesesarabande.com/news/angelo-badalamentis-iconic-blue-velvet-score-returns-to-vinyl-for-40th-anniversary/"],["World of Reel (von Trier)","https://www.worldofreel.com/blog/2026/8/9/lars-von-trier-almost-finished-screenplay-for-his-final-film"],["The Art Newspaper (Bernini)","https://www.theartnewspaper.com/2026/08/20/newly-discovered-bernini-painting-to-be-unveiled-at-vienna-museum"]] }
    ]}

  hooks: [
    { story: "A Johns Hopkins team led by Salin Sriudomporn has costed measles outbreak response in the United States, publishing in Vaccine and pooling nineteen peer-reviewed studies, eight gray-literature reports, CDC data and returns from all fifty state health departments, across outbreaks ranging from a single case to 802 cases in eighteen states. The headline averages: $33,416 per case from the provider’s perspective, $58,591 per case once the public health response is included, $43,204 as an all-in average, and $443 per contact traced. Underneath those averages sits the structure that makes this teachable — a fixed response cost of $297,747 per outbreak plus an incremental cost of $16,300 per additional case. Applied to the 2025 US outbreak of 2,289 confirmed cases, that is $134 million; the current outbreak stands at 2,566 cases and an estimated $150 million and rising. The context is a schedule in flux: an Aug 10 executive order cut the universally recommended childhood schedule to eleven diseases, and an HHS request for information on adding new recommendation tiers opened Aug 21 with a 30-day comment period.",
      src: ["KFF Morning Briefing (Aug 21)","https://kffhealthnews.org/morning-briefing/friday-august-21-2026/"],
      concept: "Fixed, marginal and average cost — and the uncomfortable arithmetic of an outbreak that gets cheaper per case as it grows",
      q: "Put the three numbers on the board in the wrong order on purpose: $43,204 average per case, $297,747 fixed, $16,300 marginal. Ask which of the three is the cost of one more case. Most of the room will reach for the average, because the average is the one with “per case” attached to it, and that reflex is exactly what the rest of the session is for. Now have them build the total cost function themselves from the fixed and marginal figures — TC(n) = 297,747 + 16,300n — and then derive average cost, AC(n) = 297,747/n + 16,300. Ask them to evaluate it at n = 1, n = 10, n = 100 and n = 2,289. They will get roughly $314,000, $46,000, $19,300 and $16,430. The average collapses toward the marginal, and by the time you are in the thousands of cases the average cost per case is almost entirely the marginal cost. That is a spreading-fixed-costs result they have seen in a firm-theory context, arriving here attached to something nobody would call a firm. Then ask the question that makes the room uncomfortable, because it should: does this mean a big outbreak is cheaper than a small one? Per case, unambiguously yes, and that is a real property of the cost function, not an artifact. Make them say precisely what is wrong with concluding anything policy-relevant from it — total cost is still rising in n, the per-case figure is falling only because the denominator grows, and nothing in this cost function values a case of measles. This is the cleanest illustration you will get all term of why average cost is the wrong object for a marginal decision, and why a per-unit number can move in the opposite direction from the thing you actually care about. Now turn it into an economics problem rather than an accounting one. The paper’s $43,204 all-in average is the number that will get quoted, and it embeds a particular distribution of outbreak sizes — outbreaks from 1 to 802 cases. Ask what happens to that average if the size distribution shifts right, and whether a policy that reduced the number of outbreaks while leaving the average outbreak larger would look better or worse on this metric. It would look better per case and worse in total, which is a nice preview of why choosing the denominator is a political act. Then bring in the vaccination side without letting them treat it as obvious. The relevant comparison is not the cost of the response against zero; it is the cost of the response against the cost of the marginal vaccination that would have prevented it, times the number of marginal vaccinations required, adjusted for the fact that you cannot identify in advance which child’s vaccination is the one that prevents the outbreak. That last clause is where the externality lives: the private return to a vaccination is bounded by one person’s risk reduction, while the social return includes the $297,747 fixed cost never incurred. Ask them to write down when private and social incentives diverge most, and they will find it is exactly at high existing coverage, where an individual’s private benefit is smallest and the herd-immunity margin is thinnest. For a memo assignment: give them the cost function and the current outbreak’s 2,566 cases and ask what the expected saving is from a policy that reduces the probability of an outbreak by ten percent versus one that reduces expected outbreak size by ten percent, and have them state which they would fund and what they had to assume."},
    { story: "The NBER Digest summarises new work by Anuj Gangopadhyaya and Robert Kaestner using American Community Survey data from 2008 to 2024 on adults aged 19 to 64, measuring how much of the Affordable Care Act’s coverage expansion displaced employer-sponsored insurance rather than covering the previously uninsured. The gradient is the finding. Among adults at 401 to 500 percent of the federal poverty line, a one-percentage-point increase in public coverage is associated with a 0.6-percentage-point decline in employer-sponsored insurance. For parents between 250 and 500 percent of poverty, roughly three people took up publicly supported coverage for every one person who became newly insured. At the bottom of the distribution, 0 to 150 percent of poverty, crowd-out is minimal: a 0.93-percentage-point reduction in the uninsured with a negligible decline in employer coverage. The displacement is concentrated among married adults, those who held employer coverage before the ACA, and people aged 45 to 64.",
      src: ["NBER Digest","https://www.nber.org/digest/202608/crowd-out-employer-provided-health-insurance-affordable-care-act"],
      concept: "Crowd-out, the difference between coverage gained and insurance gained, and why the same subsidy has different effects at different incomes",
      q: "Start by asking what a coverage expansion is supposed to buy, and insist on a precise answer rather than “more coverage.” The thing a policymaker wants is a reduction in the uninsured. The thing the program produces is enrollment. Ask what the gap between those two is called and let them build it: every enrollee who would have had insurance anyway is enrollment without a reduction in uninsurance. Now give them the 250-to-500-percent figure — three take-ups per one newly insured — and ask them to state, in a single sentence, what the other two people got. The honest answer is: cheaper insurance. That is not nothing, and this is the moment to resist the framing that crowd-out is waste. It is a transfer, and whether it is a good transfer depends on who receives it and what it displaced. Push them to name the party that gains and the party that loses when an employer drops coverage and its workers move to a subsidised exchange plan — and then ask who actually paid for the employer coverage in the first place. If they have had incidence, they will remember that the employer contribution comes out of wages; if they have not, this is the cleanest possible way to introduce it. The interesting question then becomes whether crowded-out workers see the wage offset, and over what horizon. Next, the gradient, which is where the real economics is. Ask why crowd-out is essentially zero at 0 to 150 percent of poverty and large at 401 to 500 percent. They will find it themselves: you cannot crowd out coverage that does not exist. The low-income population had little employer insurance to displace, so nearly every enrollee is a newly insured person; the near-400-percent population is substantially insured already, so the subsidy mostly changes who pays. Then have them state the design implication as a comparative static rather than an opinion — the ratio of newly insured to newly enrolled falls as you extend eligibility up the income distribution, which means the cost per newly insured person rises, possibly steeply. Ask them to sketch that cost curve. It is upward-sloping and convex, and it explains almost every fight over where to set an eligibility threshold. Then complicate it, because the convenient conclusion is too convenient. Ask whether the marginal dollar at 450 percent of poverty is worthless. It is not: it buys insurance-market stability through a broader risk pool, it insures people against losing employer coverage later, and it may improve plan quality for people who were underinsured. Have them argue whether those benefits are large enough to justify the ratio, and make them specify what evidence would settle it. Finally, the demographic detail is the best part for a methods discussion. Displacement concentrates among married adults, prior employer-coverage holders, and the 45-to-64 group. Ask what those three have in common, and whether the pattern is more consistent with employers dropping coverage or with individuals declining it. Married adults have a spouse’s plan to compare against; older adults face the highest premiums in the pre-Medicare band. Both point toward individual choice rather than employer withdrawal, which matters enormously for policy and is not something the aggregate crowd-out number can distinguish. That is the lesson worth leaving them with: the headline coefficient is the beginning of the analysis, not the end of it."},
    { story: "A new CEPR column by Francesco D’Acunto of Georgetown and Michael Weber of ESMT Berlin reports a survey of 46,285 consumers across 47 countries on where people get their information about inflation. Households that rely on official reports hold inflation expectations roughly two percentage points lower than otherwise-similar respondents who ignore official sources; households that rely on their own shopping and utility bills run roughly two percentage points higher. The authors argue the mechanism is selection rather than differential processing — people choose information sources according to how credible they find the institution behind them, so those who distrust governments and central banks discard representative aggregate data in favour of vivid personal signals that are systematically unrepresentative of the basket. In their words, “Distrust of governments and central banks helps explain why more representative aggregate information is dismissed.” The column publishes four days before Federal Reserve Chair Kevin Warsh gives his first Jackson Hole keynote, on a symposium theme of financial innovation, having previously signalled scepticism about forward guidance.",
      src: ["VoxEU / CEPR","https://cepr.org/voxeu/columns/why-more-information-can-make-macroeconomic-expectations-less-accurate-global"],
      concept: "Information as a chosen good — search, source credibility, and why adding accurate information to a market can make average beliefs worse",
      q: "Open with a show of hands: how many of them could name the current inflation rate to within a point, and how many arrived at their number from a published statistic rather than from what things cost them. The split in the room is the paper. Then put the two coefficients up — official-source users about two points low, own-purchases users about two points high — and ask which group is right. Let them argue, then point out that the question is malformed as stated, because it presumes the error is in the reading. Ask instead what each group is measuring accurately. The bills-and-groceries group is measuring their own basket correctly; it simply is not the CPI basket, and it is weighted toward frequently purchased, salient, high-variance items. This is the moment to make them articulate that a personal price index is not a mistaken aggregate index — it is a correct index of a different thing. Now get to the economics, which is that information here is a chosen good. Model it simply: a consumer picks a source to minimise expected belief error, but cannot observe error directly, so she picks on perceived credibility instead. Ask what happens to her choice when perceived credibility of the official source falls while its actual accuracy is unchanged. She substitutes toward the personal signal, her error rises, and — this is the part students find genuinely surprising — nothing about the information environment got worse in any technical sense. The accurate statistic is still published, still free, still accessible. Have them state the result formally: when source choice is endogenous to trust, an increase in the supply of accurate information can leave average belief accuracy unchanged or worse, because the marginal consumer is not the one who takes it up. That is a selection result, and it generalises far beyond inflation. Push them to find the analogue in a market they know. Health information is the obvious one and worth taking slowly, since anti-vaccine belief has exactly this structure: not a failure to receive the study, a decision not to weight it. Then ask what a producer of accurate information can actually do, given that the binding constraint is trust rather than dissemination, and watch them discover that “publish more” and “explain better” are both answers to the wrong problem. Finish on the policy question, which is live this week. If expectations are anchored partly by credibility and credibility is heterogeneous across the population, then a central bank’s communication strategy is not a single instrument — it moves different subpopulations by different amounts, and possibly in different directions. Ask them what that implies about forward guidance as a tool, and whether a central bank that says less might anchor expectations better than one that says more. Warsh has hinted at exactly that position and speaks Friday, which makes this a rare chance to have students commit to a prediction on Monday and grade it against reality on Friday. Have them write down, in one sentence, what he should say and why, and collect it. Extension for an intermediate section: model the consumer as choosing between a costly precise public signal and a free noisy private one, where the perceived precision of the public signal is a function of trust; show that the equilibrium fraction attending to the public signal falls discontinuously as trust drops below a threshold, and ask what that implies about the reversibility of a credibility loss."}

  pulse: [
    { cat: "Listening", t: "One week from tying the all-time record, and the song is still speeding up",
      why: "Ella Langley’s “Choosin’ Texas” took 1,477,593 Spotify US streams on Aug 22, up 42,924 in a single day — a 3.0% gain on top of last week’s 6.4% run, in week 43 on the Hot 100 and week 18 at No. 1. STELLA LEFTY’s “Boston” went the other way, down 3.7% to 781,777, so the gap widened: Boston is now at 52.9% of Langley’s daily volume, down from 57%. Week 19 reveals Tuesday, and 19 weeks would tie the all-time non-holiday Hot 100 record held jointly by “Old Town Road” and “A Bar Song (Tipsy).” The best account of why is Chris Molanphy’s in Slate, and it is not a story about virality: the song averages around 25 million weekly streams, which he calls big but not a blockbuster, does high four-figure weekly downloads, sits at No. 4 on Radio Songs, and is not played on Z100, New York’s biggest top-40 station. It has moved in and out of No. 1 half a dozen times since February. His term for it is the “default hit” — it wins on consistency because country streaming audiences replay a single track while pop audiences rotate. The corollary is on the same chart: The Killers’ “Mr. Brightside,” from 2004, at No. 8 daily.",
      rec: "The useful question is not what they like but what they have not skipped. Ask a student to open their most-played and find a song they never actually chose — most can, and the answer tells you more about how the chart works than about their taste.",
      src: ["Slate (Chris Molanphy)","https://slate.com/culture/2026/08/ella-langley-taylor-swift-country-music-morgan-wallen-billboard-songs.html"] },
    { cat: "Watching", t: "Three different theatrical businesses ran in the same weekend, and one of them ends Marvel’s record",
      why: "Spider-Man: Brand New Day took a fourth consecutive weekend at No. 1 with $39.0 million, reaching $854.9 million domestic and $2.22 billion worldwide — now $3.5 million short of Avengers: Endgame’s $858.37 million, which it should pass midweek to become the highest-grossing Marvel film ever in the US. Insidious: Out of the Further opened to $25.3 million from 3,303 theatres on an $18 million budget, beating its own projection, with 58% from critics and 70% from audiences — a series-best audience score. Total weekend business was $129.9 million, up 49.1% on the same weekend in 2025. Those are two distinct economies: the event film is non-substitutable because being spoiled has a deadline, while horror is the last reliably profitable theatrical genre for under-25s precisely because the product is the room — a jump scare with three hundred strangers does not survive the transfer to a laptop, which is why streaming cannot cannibalise it and why the genre is priced to be review-proof. The third economy showed up Friday, when the fifth and final season of Outer Banks dropped whole and hit No. 7 on Netflix’s US series chart on day one.",
      rec: "If you want a conversation rather than a survey, ask about Outer Banks rather than Spider-Man. A full-season drop turns a show into a weekend-long coordination problem with an expiry date on staying unspoiled, and students will explain the social logistics of that at length.",
      src: ["Boxoffice Pro","https://www.boxofficepro.com/weekend-box-office-spider-man-takes-a-fourth-spin-at-the-top/"] },
    { cat: "Reading", t: "The self-published book series that is now also a pinball machine and an NHL theme night",
      why: "Matt Dinniman’s Dungeon Crawler Carl has spent this month climbing out of the book business entirely. Peacock greenlit a television series on June 19; at Comic-Con on July 27 the audiobook narrator Jeff Hays was confirmed to reprise Princess Donut for the screen version, and a DCC pinball machine was revealed; a Colorado Avalanche theme night is set for Dec 14; a collectibles preorder opened Aug 14. The object that says most about the audience is the “Audio Immersion Tunnel,” a $29.99 USB drive in a cassette-style shell covering all of book one with full cast and original score — second printing capped at 1,500 copies, currently sold out. Note also what does not exist: the official BookTok Bestseller List, launched in March by Media Control with TikTok and blending NielsenIQ sales data with BookTok engagement, is United Kingdom only. There is no US equivalent, so every American claim about BookTok’s influence is inferred from retailer proxies rather than measured.",
      rec: "When a student says they are “on book four,” ask what format. Forty hours of full-cast audio consumed on a commute is a different act from four paperbacks, and it competes with music and podcasts rather than with other books — which is usually the answer to whether long-form attention is really the thing that changed.",
      src: ["Matt Dinniman — news","https://mattdinniman.com/news/"] },
    { cat: "Online", t: "The all-old-footage pattern is weakening, and what is replacing it has names attached",
      why: "Last week almost everything trending on Know Your Meme was built from archive material. This week it is roughly four of seven — the Robert Loggia Family Guy cutaway, the Three Layer Dip Stack built on a 2020 commercial tagline, a Universal Horror Nights snowclone running on the same Family Guy clip, and an AI-edited screenshot of the actress K Callan circulating since July. What is new is different in kind: Chanty Beluga, an anti-comedy character by creator Courtney O’Donnell, is the first purely native format to break through in two weeks, and Petra Parker is a fan-art trend started by the artist @0trebot riding the Spider-Man box office. The archive advantage is a supply story — an old clip costs nothing to surface, the back catalogue is far deeper than the annual flow, and a decades-old referent is universally legible while signalling irony rather than sincerity, which is much cheaper to be wrong about. Creator-originated formats are the opposite bet: attribution and sincerity. Whether they last is the thing to watch. Meanwhile Ariana Grande’s “Petal” meme is still spreading on Know Your Meme while the actual song fell from No. 4 to No. 18 on the Hot 100 — meme life and chart life have decoupled entirely.",
      rec: "If a reference lands and you cannot place it, ask how old it is rather than what it is from. Students frequently do not know either, because the feed served it undated, and that shared uncertainty is a much better footing than pretending to recognise it.",
      src: ["Know Your Meme","https://trending.knowyourmeme.com/editorials/meme-review/the-weekly-meme-roundup-petra-parker-robert-loggia-chanty-beluga-and-more"] },
    { cat: "Online", t: "They use the chatbot for the homework and they do not like the output — both things at once",
      why: "Two findings from the back-to-school research that sit uncomfortably together, and both are true. Sixty-eight percent of middle and high school students use AI chatbots for homework help, per YPulse. And more than half of Gen Z say they dislike AI-generated content relative to human-made work, about half worry AI gives harmful advice, and 40% think it manipulates people. Within two weeks of LinkedIn launching the feature, more than a million users had flagged content as “AI slop.” The resolution is not hypocrisy: using a tool to complete an assignment and wanting to consume human-made work are different preferences over different goods, and the second is partly a status judgement about effort. One further number is worth carrying into office hours: asked what they want to be, 17% of Gen Z name professor and 14% medicine, against 5% who want to be digital creators or influencers, and 18% who want tech entrepreneurship. The creator-economy story about this generation is substantially a story about what gets covered, not what they want.",
      rec: "Do not open the term by asking whether they use AI — you will get the answer they think you want. Ask instead whether they trust what it produces, which is a question they have a real and rather critical opinion about, and which gets you to policy from their side rather than yours.",
      src: ["ICYMI (Lia Haberman)","https://liahaberman.substack.com/p/icymi-gen-z-alpha-back-to-school"] },
    { cat: "Playing", t: "The $7 million was not settled by the elimination after all — it came down to a Trackmania race",
      why: "The Esports World Cup closed Sunday in Paris with Team Spirit beating FUT Esports 3–1 in the Counter-Strike 2 grand final — FUT taking Cache 14–12, then Spirit winning Anubis and Ancient in overtime, both 16–14, and closing Nuke 13–5. donk took MVP; sh1ro delivered the clutches in both overtimes. But the correction is on the club championship, which this brief reported as effectively decided when Brazil’s Legacy knocked out Team Falcons in the quarterfinals. It was not. It came down to the final event of the final day: AG.AL International’s player Gwen won the Trackmania tournament outright for the full 1,000 points, taking AG.AL to 5,300 and past Falcons on 4,600 — $7 million against $5 million, with Vitality third and NAVI fourth, from a total pool above $51 million paying down to 24th place across seven weeks. That is what a cross-title season format is for: a bracket cannot manufacture a last-day swing between two organisations that never played each other.",
      rec: "The club-versus-team distinction is the one thing worth knowing. Organisations field squads across unrelated games and compete on a combined points total, so “who won” has two different answers — asking which titles an org fields is a real question, not a polite one.",
      src: ["Dot Esports","https://dotesports.com/news/news/ewc-standings-ag-al-win"] }
